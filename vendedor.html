<script>
const B=(location.protocol.indexOf("http")===0)?"":"https://b13-bling-backend-production.up.railway.app";
const esc=(s)=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const brl=(v)=>"R$ "+(+v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const soDig=(s)=>String(s??"").replace(/\D/g,"");
let ABA="recuperar", DADOS=null, carregando=false;
let MIN_VALOR=1000;
let mostrarPerdidos=10;

function render(){
  const app=document.getElementById("app");
  app.innerHTML=`
    <div class="top">
      <button onclick="b13ToggleNav()" style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer">☰</button>
      <div class="t">🎯 Apoio ao Vendedor</div><div class="sp"></div>
    </div>
    <div class="wrap">
      <div class="seg">
        <button class="${ABA==='recuperar'?'on':''}" onclick="ABA='recuperar';render()">💰 Meta & Recuperar</button>
        <button class="${ABA==='precos'?'on':''}" onclick="ABA='precos';render()">🏷️ Pesquisar preço</button>
        <button class="${ABA==='historico'?'on':''}" onclick="ABA='historico';render()">🕐 Histórico</button>
        <button class="${ABA==='mapa'?'on':''}" onclick="ABA='mapa';render()">🗺️ Mapa</button>
        <button class="${ABA==='prospectar'?'on':''}" onclick="ABA='prospectar';render()">🔍 Prospectar</button>
        <button class="${ABA==='prospectar2'?'on':''}" onclick="ABA='prospectar2';render()">🌐 Prospecção 2</button>
      </div>
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <div>
          <div style="font-weight:800">📋 Tabela de preços</div>
          <div class="muted" id="tabInfo" style="font-size:11px">Verificando…</div>
        </div>
        <button class="btn btn-wa" onclick="compartilharTabela()">📱 Compartilhar tabela</button>
      </div>
      ${ABA==='recuperar'?viewRecuperar():ABA==='precos'?viewPrecos():ABA==='historico'?viewHistorico():ABA==='mapa'?viewMapa():ABA==='prospectar2'?viewProspectar2():viewProspectar()}
    </div>`;
  if(ABA==='recuperar'&&!DADOS&&!carregando) carregar();
  if(ABA==='precos'&&!PRECOS_CATS) carregarPrecos();

/* ===== ABA 1: RECUPERAR ===== */
function viewRecuperar(){
  if(carregando) return `<div class="card"><div class="muted">📊 Analisando pedidos de atacado (pode levar 1-2 min)…</div></div>`;
  if(!DADOS) return `<div class="card"><div class="muted">Carregando…</div></div>`;
  // primeira análise de todas ainda rodando em segundo plano — nada pronto
  if(DADOS.primeira && DADOS.computando){
    return `<div class="card">
      <div style="font-weight:800;margin-bottom:6px">⏳ Montando a análise pela primeira vez…</div>
      <div class="muted" style="font-size:13px">Isso roda em segundo plano no servidor e pode levar alguns minutos nessa primeira vez (depois fica rápido). ${DADOS.progresso?`<br><br><b>${esc(DADOS.progresso)}</b>`:''}<br><br>Pode deixar essa tela aberta — ela atualiza sozinha quando ficar pronta.</div>
    </div>`;
  }
  if(DADOS.erro) return `<div class="card"><div class="muted">${esc(DADOS.erro)} — <a href="#" onclick="novaAnalise();return false" style="color:#7fd4ff">tentar de novo</a></div></div>`;
  const m=DADOS.metaMes||{};
  const perdidos=DADOS.perdidos||[];
  const grandes=DADOS.pedidosGrandes||[];
  return `
    ${DADOS.computando?`<div class="card" style="border-color:#ffd23f"><div class="muted" style="font-size:12px;color:#ffd23f">🔄 Atualizando a análise em segundo plano${DADOS.progresso?` — ${esc(DADOS.progresso)}`:''}… Os números abaixo são da última análise pronta e atualizam sozinhos.</div></div>`:''}
    ${cardMetaProgresso()}
    <div class="card">
      <div style="font-weight:800;margin-bottom:10px">👤 Vendido por vendedor (atacado — sem varejo)</div>
      ${(DADOS.vendedores&&DADOS.vendedores.length)?DADOS.vendedores.map(vendedorRow).join(""):'<div class="muted">Nenhuma venda de atacado no mês.</div>'}
      ${m.detalhePorVendedorParcial?`<div class="muted" style="font-size:11px;color:#ffd23f;margin-top:8px">⚠️ O detalhamento por vendedor ficou parcial (muitos pedidos no mês — analisou ${m.pedidosDetalhados||0} até agora). O "Total geral" abaixo está completo. Rode "Nova análise" mais tarde pra completar o resto.</div>`:''}
      <div style="border-top:1px solid #2c2660;margin-top:10px;padding-top:10px;display:flex;justify-content:space-between;font-weight:800">
        <span>Total geral</span>
        <span style="color:#ffd23f">${brl(m.valorTotalMes)} · ${m.qtdTotalMes||0} pedidos</span>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="font-weight:800">⚠️ Clientes que sumiram (${DADOS.qtdPerdidos||0})</div>
        <button class="btn btn-ghost" style="font-size:11px;padding:6px 10px" onclick="novaAnalise()">🔄 Nova análise</button>
      </div>
      <div class="muted" style="font-size:12px;margin-bottom:8px">Eram regulares (3+ pedidos, ticket médio acima de ${brl(MIN_VALOR)}) e pararam de comprar.${DADOS.cacheEm?` <span style="color:#7fd4ff">Análise de ${new Date(DADOS.cacheEm).toLocaleString("pt-BR")}</span>`:''}</div>
      ${perdidos.length?perdidos.slice(0,mostrarPerdidos).map(cliRow).join(""):'<div class="muted">Nenhum cliente perdido detectado. 🎉</div>'}
      ${perdidos.length>mostrarPerdidos?`<button class="btn btn-mag" style="width:100%;margin-top:10px" onclick="mostrarPerdidos+=10;render()">▼ Ver mais 10 (${perdidos.length-mostrarPerdidos} restantes)</button>`:''}
    </div>

    <div class="card">
      <div style="font-weight:800;margin-bottom:8px">🔎 Quem mais compra um produto</div>
      <div class="muted" style="font-size:12px;margin-bottom:6px">1º pesquise o produto, depois veja quem mais compra ele.</div>
      <div style="display:flex;gap:8px">
        <input id="buscaTop" placeholder="Pesquisar produto (ex: skol, heineken)…" style="flex:1" oninput="buscarProdutoDebounce(this.value)">
      </div>
      <div id="produtosEncontrados" style="margin-top:8px"></div>
      <div id="topResultado" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <div style="font-weight:800;margin-bottom:8px">💵 Pedidos grandes (acima de ${brl(MIN_VALOR)}, últimos 30 dias)</div>
      <div class="muted" style="font-size:11px;margin-bottom:8px">Ordenados por quem está há mais tempo sem comprar (prioridade de contato). Toque em 💬 pra chamar no WhatsApp.</div>
      ${grandes.length?grandes.map((g,ix)=>`
        <div class="cli">
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:13px">#${esc(g.numero)} — ${esc(g.cliente)}</div>
            <div class="muted" style="font-size:11px">Pedido: ${g.data?g.data.split('-').reverse().join('/'):''} · Última compra: ${g.ultimaCompra?g.ultimaCompra.split('-').reverse().join('/'):''} <b style="color:${g.diasSemComprar>=15?'#ff8090':'#9a95c9'}">(${g.diasSemComprar} dias)</b></div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-weight:800;color:#ffd23f">${brl(g.total)}</div>
            <button class="btn" style="background:#25d366;color:#0a3d1e;font-weight:800;font-size:12px;padding:5px 10px;margin-top:4px" onclick="abrirWhatsGrande(${g.contatoId},'${esc(g.cliente).replace(/'/g,"\\'")}')">💬 WhatsApp</button>
          </div>
        </div>`).join(""):'<div class="muted">Nenhum pedido grande nos últimos 30 dias.</div>'}
    </div>`;
}

// 4 mensagens pré-determinadas pra chamar no WhatsApp o cliente de um pedido grande.
// {nome} é trocado pelo nome do cliente.
const MSGS_PEDIDO_GRANDE=[
  {rotulo:"Reposição", texto:"Olá, {nome}! Aqui é da B13 Bebidas. Passando pra saber se já está na hora de repor o estoque. Quer que eu te mande a tabela atualizada?"},
  {rotulo:"Promoção", texto:"Oi, {nome}! Tudo bem? Estamos com promoções novas essa semana na B13 Bebidas que podem te interessar. Posso te enviar?"},
  {rotulo:"Sentimos falta", texto:"Olá, {nome}! Faz um tempinho que você não faz um pedido com a gente. Aconteceu alguma coisa? Estamos à disposição e com ótimas condições!"},
  {rotulo:"Novidades", texto:"Oi, {nome}! Chegaram novidades no nosso mix aqui na B13 Bebidas. Quer dar uma olhada na tabela atualizada?"},
];

async function abrirWhatsGrande(contatoId, nome){
  // pega o telefone do cliente
  let tel="";
  try{ const j=await fetch(B+"/api/vendedor/cliente/"+contatoId+"/contato").then(r=>r.json()); tel=soDig(j.telefone||""); }catch(e){}
  // deixa o vendedor escolher qual das 4 mensagens usar
  const opcoes=MSGS_PEDIDO_GRANDE.map((m,i)=>`${i+1}) ${m.rotulo}`).join("\n");
  const escolha=prompt(`Qual mensagem enviar pra ${nome}?\n\n${opcoes}\n\nDigite o número (1 a 4):`,"1");
  if(escolha===null) return; // cancelou
  const ix=Number(escolha)-1;
  if(!(ix>=0 && ix<MSGS_PEDIDO_GRANDE.length)){ alert("Escolha inválida. Digite um número de 1 a 4."); return; }
  const msg=MSGS_PEDIDO_GRANDE[ix].texto.replace(/\{nome\}/g, nome);
  if(tel.length<10){
    if(confirm(nome+" não tem telefone cadastrado. Abrir o WhatsApp mesmo assim (você escolhe o contato)?")){
      window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
    }
    return;
  }
  const t55=tel.length<=11?("55"+tel):tel;
  window.open("https://wa.me/"+t55+"?text="+encodeURIComponent(msg),"_blank");
  // registra o contato no histórico de prospecção (mesma lógica dos clientes perdidos)
  fetch(B+"/api/vendedor/prospeccao/contato",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({clienteId:contatoId,clienteNome:nome,nota:"WhatsApp ("+MSGS_PEDIDO_GRANDE[ix].rotulo+")",resultado:"contatado"})}).then(()=>{ TIMELINE=null; });
}

/* ===== ACOMPANHAMENTO DA META (gráfico) ===== */
let META_AC=null, META_CARREGANDO=false;
function cardMetaProgresso(){
  if(META_CARREGANDO) return `<div class="card"><div class="muted">📈 Carregando meta…</div></div>`;
  if(!META_AC){ carregarMetaAc(); return `<div class="card"><div class="muted">📈 Carregando meta…</div></div>`; }
  if(!META_AC.meta){
    return `<div class="card" style="border-color:#514c96">
      <div style="font-weight:800;margin-bottom:6px">🎯 Meta do mês não definida</div>
      <div class="muted" style="font-size:13px">Defina a meta do mês no <b>Dashboard</b> pra acompanhar o progresso aqui com gráficos.</div>
    </div>`;
  }
  const a=META_AC;
  const pct=Math.min(100,a.pctMeta);
  const corPct=pct>=100?'#3ce88a':pct>=70?'#ffd23f':pct>=40?'#ff9f40':'#ff5f8f';
  // ATENDIDOS — é o que realmente decide se bateu a meta
  const pctAt=Math.min(100,a.pctMetaAtendido||0);
  const corPctAt=pctAt>=100?'#3ce88a':pctAt>=70?'#ffd23f':pctAt>=40?'#ff9f40':'#ff5f8f';
  let frase="";
  if(pctAt>=100) frase="🎉 Meta batida nos atendidos! Parabéns!";
  else if(a.diasUteisRestantes>0) frase=`Pra bater a meta faltam <b>${brl(a.faltaAtendido)}</b> em atendidos, em ${a.diasUteisRestantes} dia(s) útil(eis). Ritmo ideal: <b style="color:#7fd4ff">${brl(a.idealPorDiaRestanteAtendido)}/dia</b>.`;
  else frase=`Mês encerrado. Atendido: ${brl(a.vendidoAtendido)} de ${brl(a.meta)}.`;
  return `<div class="card">
    <div style="font-weight:800;margin-bottom:10px">🎯 Progresso da meta — ${a.mes.split("-").reverse().join("/")}</div>

    <div style="background:#12143a;border:1px solid #2a4a6a;border-radius:10px;padding:12px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px">
        <span style="font-size:12px;font-weight:700;color:#7fd4ff">✅ ATENDIDOS <span class="muted" style="font-weight:400">(o que vale pra meta)</span></span>
        <span class="muted" style="font-size:11px">${a.pctMetaAtendido||0}%</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <span style="font-size:22px;font-weight:900;color:${corPctAt}">${brl(a.vendidoAtendido)}</span>
        <span class="muted">de ${brl(a.meta)}</span>
      </div>
      <div style="background:#0f0d24;border-radius:20px;height:16px;overflow:hidden">
        <div style="height:100%;width:${pctAt}%;background:${corPctAt};border-radius:20px"></div>
      </div>
    </div>
    <div class="muted" style="font-size:12px;margin-bottom:12px">${frase}</div>

    <div class="muted" style="font-size:11px;margin-bottom:4px">Pedidos de venda (inclui os que ainda não foram atendidos): ${a.pctMeta}%</div>
    <div style="background:#0f0d24;border-radius:20px;height:10px;overflow:hidden;margin-bottom:12px">
      <div style="height:100%;width:${pct}%;background:${corPct};border-radius:20px;opacity:.7"></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px">
      <div class="rc" style="padding:10px"><div class="muted" style="font-size:10px">Média/dia atendido</div><div style="font-weight:800;color:#7fd4ff;font-size:14px">${brl(a.mediaDiariaAtendido)}</div></div>
      <div class="rc" style="padding:10px"><div class="muted" style="font-size:10px">Ideal/dia atendido</div><div style="font-weight:800;color:#7fd4ff;font-size:14px">${brl(a.idealPorDiaRestanteAtendido)}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      <div class="rc" style="padding:10px"><div class="muted" style="font-size:10px">Média/dia (pedidos)</div><div style="font-weight:800;font-size:14px">${brl(a.mediaDiaria)}</div></div>
      <div class="rc" style="padding:10px"><div class="muted" style="font-size:10px">Ideal/dia (pedidos)</div><div style="font-weight:800;color:#ffd23f;font-size:14px">${brl(a.idealPorDiaRestante)}</div></div>
    </div>
    <div class="muted" style="font-size:11px;margin-bottom:4px">Barra rosa: vendas/dia · linhas: meta ideal (amarelo), pedidos (verde), atendidos (azul):</div>
    <canvas id="graficoMeta" style="width:100%;height:180px"></canvas>
  </div>`;
}

async function carregarMetaAc(){
  if(META_CARREGANDO) return;
  META_CARREGANDO=true;
  try{ META_AC=await fetch(B+"/api/vendedor/meta-acompanhamento").then(r=>r.json()); }
  catch(e){ META_AC={meta:0}; }
  META_CARREGANDO=false;
  render();
  setTimeout(desenharGraficoMeta,100);
}

function desenharGraficoMeta(){
  const cv=document.getElementById("graficoMeta");
  if(!cv||!META_AC||!META_AC.dias) return;
  const dias=META_AC.dias;
  const W=cv.clientWidth||600, H=180, dpr=2;
  cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const padL=44,padR=10,padT=10,padB=20;
  const gw=W-padL-padR, gh=H-padT-padB;
  const maxAc=Math.max(META_AC.meta, ...dias.map(d=>d.acumulado||0))||1;
  const n=dias.length;
  const bw=Math.max(2,gw/n*0.6);
  ctx.strokeStyle="#2c2660"; ctx.fillStyle="#9a95c9"; ctx.font="9px Arial"; ctx.textAlign="right";
  for(let i=0;i<=4;i++){
    const y=padT+gh-(gh*i/4);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText("R$"+Math.round(maxAc*i/4/1000)+"k",padL-4,y+3);
  }
  const maxDia=Math.max(...dias.map(d=>d.valor||0))||1;
  dias.forEach((d,i)=>{
    const x=padL+gw*i/n+gw/n*0.2;
    const bh=(d.valor/maxDia)*gh*0.7;
    ctx.fillStyle=d.futuro?"#2c2660":"#FF0082";
    ctx.fillRect(x,padT+gh-bh,bw,bh);
  });
  function linha(campo,cor,tracejado){
    ctx.strokeStyle=cor; ctx.lineWidth=2; ctx.setLineDash(tracejado?[4,4]:[]);
    ctx.beginPath(); let primeiro=true;
    dias.forEach((d,i)=>{
      const v=d[campo]; if(v==null) return;
      const x=padL+gw*i/n+gw/n*0.5;
      const y=padT+gh-(v/maxAc*gh);
      if(primeiro){ ctx.moveTo(x,y); primeiro=false; } else ctx.lineTo(x,y);
    });
    ctx.stroke(); ctx.setLineDash([]);
  }
  linha("metaAcumulada","#ffd23f",true);
  linha("acumulado","#3ce88a",false);
  linha("acumuladoAtendido","#7fd4ff",false);
  // legenda das linhas
  ctx.textAlign="left"; ctx.font="9px Arial";
  const leg=[["#ffd23f","meta ideal"],["#3ce88a","pedidos"],["#7fd4ff","atendidos"]];
  let lx=padL+4;
  leg.forEach(([cor,txt])=>{
    ctx.fillStyle=cor; ctx.fillRect(lx,padT+2,8,3);
    ctx.fillStyle="#9a95c9"; ctx.fillText(txt,lx+11,padT+6);
    lx+=ctx.measureText(txt).width+28;
  });
  ctx.fillStyle="#9a95c9"; ctx.font="9px Arial"; ctx.textAlign="center";
  dias.forEach((d,i)=>{ if(d.dia%5===0||d.dia===1){ const x=padL+gw*i/n+gw/n*0.5; ctx.fillText(d.dia,x,H-6); } });
}
/* ===== fim acompanhamento meta ===== */

function vendedorRow(v){
  const statusTxt=Object.entries(v.porStatus||{}).map(([nome,qtd])=>`${nome}: ${qtd}`).join(" · ");
  return `<div style="padding:10px 0;border-bottom:1px solid #23204f">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <div style="font-weight:700;font-size:14px">${esc(v.nome)}</div>
      <div style="font-weight:900;color:#ffd23f">${brl(v.valor)}</div>
    </div>
    <div class="muted" style="font-size:11px;margin-top:3px">

async function registrarContato(id,nome){
  const nota=prompt(`Registrar contato com ${nome}.\n\nO que aconteceu? (ex: "Ligou, vai pensar", "Fez pedido", "Não atendeu")`);
  if(nota===null) return;
  let resultado="contatado";
  const low=(nota||"").toLowerCase();
  if(low.includes("pedido")||low.includes("compr")||low.includes("vendeu")) resultado="voltou";
  else if(low.includes("não atend")||low.includes("nao atend")||low.includes("sem resposta")) resultado="sem resposta";
  else if(low.includes("pensar")||low.includes("depois")) resultado="em negociação";
  try{
    await fetch(B+"/api/vendedor/prospeccao/contato",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({clienteId:id,clienteNome:nome,nota,resultado})});
    // atualiza localmente sem refazer a análise pesada
    if(DADOS?.perdidos){
      const c=DADOS.perdidos.find(x=>String(x.id)===String(id));
      if(c){ c.qtdContatos=(c.qtdContatos||0)+1; c.ultimoContato={quando:new Date().toISOString(),resultado,nota}; }
    }
    TIMELINE=null; render();
  }catch(e){ alert("Erro ao registrar."); }
}

async function ignorarCliente(id,nome){
  if(!confirm(`Remover "${nome}" da lista de análise?\n\nUse pra cadastros duplicados ou clientes que não quer acompanhar.`)) return;
  try{
    await fetch(B+"/api/vendedor/prospeccao/ignorar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({clienteId:id,ignorar:true})});
    // remove localmente do cache atual (instantâneo, sem refazer a análise pesada)
    if(DADOS?.perdidos){ DADOS.perdidos=DADOS.perdidos.filter(c=>String(c.id)!==String(id)); DADOS.qtdPerdidos=DADOS.perdidos.length; }
    render();
  }catch(e){ alert("Erro."); }
}

async function recuperar(id,nome){
  let tel="";
  try{ const j=await fetch(B+"/api/vendedor/cliente/"+id+"/contato").then(r=>r.json()); tel=soDig(j.telefone||""); }catch(e){}
  const msg=`Olá, ${nome}! Nós da B13 Bebidas estamos sentindo sua falta! Estamos com diversas promoções! Posso te enviar a tabela?`;
  if(tel.length<10){
    if(confirm(nome+" não tem telefone cadastrado. Abrir o WhatsApp mesmo assim (você escolhe o contato)?")){
      window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
    }
    return;
  }
  const t55=tel.length<=11?("55"+tel):tel;
  window.open("https://wa.me/"+t55+"?text="+encodeURIComponent(msg),"_blank");
  // registra automaticamente que houve tentativa de contato via WhatsApp
  fetch(B+"/api/vendedor/prospeccao/contato",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({clienteId:id,clienteNome:nome,nota:"Abriu WhatsApp",resultado:"contatado"})}).then(()=>{ TIMELINE=null; });
}

async function carregar(forcar){

  carregando=false; render();

  // calculando, tenta de novo daqui a pouco pra pegar o resultado quando ficar
  // pronto (sem travar a tela enquanto isso)
  agendarPollApoio();
}
let _pollApoioT=null;
function agendarPollApoio(){
  clearTimeout(_pollApoioT);
  if(DADOS && DADOS.computando){
    _pollApoioT=setTimeout(async()=>{
      try{ const novo=await fetch(B+"/api/vendedor/apoio?minValor="+MIN_VALOR).then(r=>r.json());
        // só troca se avançou (ficou pronto, ou mudou o progresso)
        DADOS=novo; render();
      }catch(e){}
      agendarPollApoio();
    }, 12000); // a cada 12s
  }
}

async function abrirMapaCompleto(){
  // carrega o Leaflet (CSS+JS) sob demanda, só quando abre o mapa
  if(!window.L){
    await new Promise((res)=>{
      const css=document.createElement("link"); css.rel="stylesheet"; css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(css);
      const js=document.createElement("script"); js.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"; js.onload=res; document.head.appendChild(js);
    });
  }
  // busca os clientes geocodificados
  let clientes=[];
  try{ const j=await fetch(B+"/api/vendedor/mapa-clientes").then(r=>r.json()); clientes=j.clientes||[]; }catch(e){}
  if(!clientes.length){ alert("Nenhum cliente localizado ainda. Clique em 'Processar mais' pra localizar os clientes primeiro."); return; }

  // modal com o mapa
  const ov=document.createElement("div");
  ov.id="modalMapa";
  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;display:flex;flex-direction:column;padding:10px";
  ov.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-weight:800;color:#fff">🗺️ ${clientes.length} clientes no mapa</div>
      <button class="btn btn-ghost" style="padding:8px 14px" onclick="document.getElementById('modalMapa').remove()">✕ Fechar</button>
    </div>
    <div id="mapaLeaflet" style="flex:1;border-radius:12px;overflow:hidden"></div>`;
  document.body.appendChild(ov);

  // inicializa o mapa centralizado na média das coordenadas
  const latMed=clientes.reduce((s,c)=>s+c.lat,0)/clientes.length;
  const lngMed=clientes.reduce((s,c)=>s+c.lng,0)/clientes.length;
  const map=L.map("mapaLeaflet").setView([latMed,lngMed],12);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
  // adiciona a loja (referência)
  const grupo=[];
  clientes.forEach(c=>{
    const m=L.marker([c.lat,c.lng]).addTo(map);
    m.bindPopup(`<b>${(c.nome||"").replace(/</g,"&lt;")}</b><br>${(c.endereco||"").replace(/</g,"&lt;")}`);
    grupo.push([c.lat,c.lng]);
  });
  // ajusta o zoom pra caber todos os pontos
  if(grupo.length>1){ try{ map.fitBounds(grupo,{padding:[40,40]}); }catch(e){} }
  setTimeout(()=>map.invalidateSize(),200); // corrige renderização dentro do modal
}

function renderProspLista(){
  if(PROSP_DADOS.erro) return `<div class="muted">Erro: ${esc(PROSP_DADOS.erro)}</div>`;
  const l=PROSP_DADOS.locais||[];
  const faixa = (PROSP_DADOS.raioMin>0)
    ? `entre ${(PROSP_DADOS.raioMin/1000).toString().replace('.',',')} e ${(PROSP_DADOS.raio/1000).toString().replace('.',',')} km`
    : `até ${(PROSP_DADOS.raio/1000).toString().replace('.',',')} km`;
  if(!l.length) return `<div class="muted">Nenhum estabelecimento encontrado ${faixa}.</div>`;
  return `<div class="muted" style="font-size:12px;margin-bottom:8px">${l.length} encontrados (${faixa}) ${PROSP_DADOS.doCache?'· do cache':''}</div>`+
    l.map((p,i)=>{
      const distTxt = p.distanciaM!=null ? `${(p.distanciaM/1000).toFixed(1).replace('.',',')} km` : '';
      return `
    <div class="cli" style="flex-wrap:wrap">
      <div style="flex:1;min-width:200px">
        <div style="font-weight:700;font-size:13px">${esc(p.nome)}${distTxt?` <span style="color:#7fd4ff;font-weight:600;font-size:11px">· ${distTxt}</span>`:''}</div>
        <div class="muted" style="font-size:11px">${esc(p.endereco)}${p.rating?` · ⭐ ${p.rating} (${p.totalAvaliacoes})`:''}</div>
        <div id="det-${i}" class="muted" style="font-size:11px;margin-top:2px"></div>
      </div>
      <button class="btn btn-ghost" style="font-size:11px;padding:7px 10px" onclick="verDetalhe('${p.placeId}',${i})">📞 Ver contato</button>
    </div>`;}).join("");
}

async function buscarProspeccao(){
  if(PROSP_RAIO_MIN>=PROSP_RAIO){ alert('A distância mínima precisa ser menor que a máxima.'); return; }
  PROSP_CARREGANDO=true; render();
  try{
    PROSP_DADOS=await fetch(B+"/api/vendedor/prospeccao-places?tipo="+PROSP_TIPO+"&raio="+PROSP_RAIO+"&raioMin="+PROSP_RAIO_MIN).then(r=>r.json());
  }catch(e){ PROSP_DADOS={erro:"Erro ao buscar"}; }
  PROSP_CARREGANDO=false; render();
}

async function verDetalhe(placeId,ix){
  const el=document.getElementById("det-"+ix);
  if(el) el.textContent="Buscando contato…";
  try{
    const j=await fetch(B+"/api/vendedor/place-detalhe/"+placeId).then(r=>r.json());
    if(!el) return;
    if(j.jaCliente){
      el.innerHTML=`<span style="color:#3ce88a">✓ Já é cliente: ${esc(j.jaCliente.nome)}</span>${j.telefone?' · '+esc(j.telefone):''}`;
    }else if(j.telefone){
      const tel=soDig(j.telefone); const t55=tel.length<=11?("55"+tel):tel;
      const msg="Olá! Aqui é da B13 Bebidas 🍻 Somos distribuidora de bebidas no atacado aqui na Glória. Posso te passar nossa tabela de preços?";
      el.innerHTML=`📞 ${esc(j.telefone)} · <a href="https://wa.me/${t55}?text=${encodeURIComponent(msg)}" target="_blank" style="color:#25d366;font-weight:700">WhatsApp</a> <span style="color:#ffd23f">· novo cliente!</span>`;
    }else{
      el.innerHTML=`<span class="muted">Sem telefone no Google. ${j.website?'<a href="'+esc(j.website)+'" target="_blank" style="color:#7fd4ff">site</a>':''}</span>`;
    }
  }catch(e){ if(el) el.textContent="Erro ao buscar contato."; }
}

// ===== PROSPECÇÃO 2: busca livre (termo + local), traz contatos de uma vez =====
let PROSP2_TERMO="", PROSP2_LOCAL="", PROSP2_DADOS=null, PROSP2_CARREGANDO=false;
const PROSP2_SUGESTOES=["adega","distribuidora de bebidas","depósito de bebidas","conveniência","bar","petiscaria","choperia","boteco","hamburgueria","pizzaria","espetinho","lanchonete","mercearia","mercadinho","restaurante","tabacaria","casa noturna","food truck","empório","padaria"];

function viewProspectar2(){
  const d=PROSP2_DADOS;
  return `
  <div class="card">
    <div style="font-weight:800;margin-bottom:2px">🌐 Prospecção 2 — busca ampla</div>
    <div class="muted" style="font-size:12px;margin-bottom:10px">Busca por <b>qualquer termo</b> e <b>qualquer região</b> (não só perto da loja). Já traz o <b>telefone e o WhatsApp</b> de cada lugar de uma vez, marca quem já é cliente e deixa você marcar quem já contatou.</div>
    <input id="prosp2Termo" placeholder="O que buscar? (ex.: distribuidora, conveniência, petiscaria)" value="${esc(PROSP2_TERMO)}" oninput="PROSP2_TERMO=this.value" onkeydown="if(event.key==='Enter')buscarProspeccao2()" style="width:100%;background:#0f0d24;border:1px solid #514c96;border-radius:8px;color:#fff;padding:10px 12px;font-size:14px;margin-bottom:8px">
    <input id="prosp2Local" placeholder="Onde? bairro ou cidade (deixe vazio = perto da loja)" value="${esc(PROSP2_LOCAL)}" oninput="PROSP2_LOCAL=this.value" onkeydown="if(event.key==='Enter')buscarProspeccao2()" style="width:100%;background:#0f0d24;border:1px solid #514c96;border-radius:8px;color:#fff;padding:10px 12px;font-size:14px;margin-bottom:8px">
    <div class="muted" style="font-size:11px;margin-bottom:4px">Sugestões rápidas:</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;max-height:96px;overflow:auto">
      ${PROSP2_SUGESTOES.map(s=>`<button class="btn btn-ghost" style="font-size:11px;padding:5px 9px" onclick="PROSP2_TERMO='${s}';buscarProspeccao2()">${s}</button>`).join("")}
    </div>
    <button class="btn btn-mag" style="width:100%" onclick="buscarProspeccao2()">🔎 Buscar estabelecimentos</button>
    <div id="prosp2Resultado" style="margin-top:12px">${PROSP2_CARREGANDO?'<div class="muted">Buscando e puxando os contatos… (pode levar alguns segundos)</div>':(d?renderProsp2Lista():'<div class="muted" style="font-size:12px">Digite o que quer buscar e onde, depois clique em Buscar.</div>')}</div>
  </div>`;
}

async function buscarProspeccao2(){
  if((PROSP2_TERMO||"").trim().length<2){ alert("Digite o que você quer buscar (ex.: distribuidora)."); return; }
  PROSP2_CARREGANDO=true; PROSP2_DADOS=null; render();
  try{
    PROSP2_DADOS=await fetch(B+"/api/vendedor/prospeccao2?termo="+encodeURIComponent(PROSP2_TERMO)+"&local="+encodeURIComponent(PROSP2_LOCAL)).then(r=>r.json());
  }catch(e){ PROSP2_DADOS={erro:"Erro ao buscar"}; }
  PROSP2_CARREGANDO=false; render();
}

// carrega mais 20 (próxima página do Google) e acumula na lista atual
let PROSP2_CARREGANDO_MAIS=false;
async function carregarMaisProsp2(){
  if(!PROSP2_DADOS?.nextPageToken || PROSP2_CARREGANDO_MAIS) return;
  PROSP2_CARREGANDO_MAIS=true; render();
  try{
    const j=await fetch(B+"/api/vendedor/prospeccao2?termo="+encodeURIComponent(PROSP2_TERMO)+"&local="+encodeURIComponent(PROSP2_LOCAL)+"&pageToken="+encodeURIComponent(PROSP2_DADOS.nextPageToken)).then(r=>r.json());
    if(j.erro){ alert("Não consegui carregar mais: "+j.erro); }
    else{
      // acumula, evitando duplicados por placeId
      const existentes=new Set((PROSP2_DADOS.data||[]).map(x=>x.placeId));
      const novos=(j.data||[]).filter(x=>!existentes.has(x.placeId));
      PROSP2_DADOS.data=[...(PROSP2_DADOS.data||[]),...novos];
      PROSP2_DADOS.total=PROSP2_DADOS.data.length;
      PROSP2_DADOS.nextPageToken=j.nextPageToken||null; // token da próxima página (ou fim)
    }
  }catch(e){ alert("Erro ao carregar mais."); }
  PROSP2_CARREGANDO_MAIS=false; render();
}

function renderProsp2Lista(){
  const d=PROSP2_DADOS;
  if(d.erro) return `<div class="err">Erro: ${esc(d.erro)}</div>`;
  const l=d.data||[];
  if(!l.length) return `<div class="muted">Nenhum estabelecimento encontrado. Tente outro termo ou região.</div>`;
  const comTel=l.filter(x=>x.telefone).length;
  return `<div class="muted" style="font-size:12px;margin-bottom:10px">${l.length} encontrados · <b style="color:#25d366">${comTel} com telefone</b>${d.local?' · em '+esc(d.local):' · perto da loja'}</div>`+
    l.map((p,i)=>{
      const tel=soDig(p.telefone||"");
      const t55=tel?(tel.length<=11?("55"+tel):tel):"";
      const msg="Olá! Aqui é da B13 Bebidas 🍻 Somos distribuidora de bebidas no atacado aqui na Glória. Posso te passar nossa tabela de preços?";
      const jaCli=p.jaCliente?`<span style="color:#3ce88a;font-size:11px">✓ já é cliente (${esc(p.jaCliente.nome)})</span>`:'';
      const contatadoTag=p.jaContatado?`<span style="background:#2a2000;color:#ffd23f;border-radius:4px;padding:1px 6px;font-size:10px">✓ contatado</span>`:'';
      return `
      <div style="border:1px solid ${p.jaContatado?'#4a4020':p.jaCliente?'#1e5a3a':'#2c2660'};border-radius:9px;padding:10px 12px;margin-bottom:7px;background:${p.jaContatado?'#1a1706':'#1c1846'}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap">
          <div style="flex:1;min-width:160px">
            <div style="font-weight:700;font-size:13px">${esc(p.nome)} ${contatadoTag}</div>
            <div class="muted" style="font-size:11px">${esc(p.endereco)}${p.rating?` · ⭐ ${p.rating} (${p.totalAvaliacoes})`:''}</div>
            ${jaCli}
          </div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
          ${p.telefone?`<a href="https://wa.me/${t55}?text=${encodeURIComponent(msg)}" target="_blank" class="btn btn-ghost" style="font-size:11px;padding:6px 10px;background:#075e54;color:#fff;text-decoration:none">🟢 WhatsApp</a>
             <a href="tel:${esc(p.telefone)}" class="btn btn-ghost" style="font-size:11px;padding:6px 10px;text-decoration:none">📞 ${esc(p.telefone)}</a>`
            :'<span class="muted" style="font-size:11px">sem telefone no Google</span>'}
          ${p.website?`<a href="${esc(p.website)}" target="_blank" class="btn btn-ghost" style="font-size:11px;padding:6px 10px;text-decoration:none;color:#7fd4ff">🌐 site</a>`:''}
          ${p.mapsUrl?`<a href="${esc(p.mapsUrl)}" target="_blank" class="btn btn-ghost" style="font-size:11px;padding:6px 10px;text-decoration:none">🗺️ Maps</a>`:''}
          <button class="btn btn-ghost" style="font-size:11px;padding:6px 10px" onclick="marcarContatado2('${p.placeId}','${esc(p.nome).replace(/'/g,'')}',${!p.jaContatado})">${p.jaContatado?'↩ desmarcar':'✓ marquei que contatei'}</button>
        </div>
      </div>`;
    }).join("")
    + (PROSP2_DADOS.nextPageToken
        ? `<button class="btn btn-ghost" style="width:100%;margin-top:6px;border:1px dashed #514c96" onclick="carregarMaisProsp2()" ${PROSP2_CARREGANDO_MAIS?'disabled':''}>${PROSP2_CARREGANDO_MAIS?'Carregando…':'➕ Carregar mais 20'}</button>`
        : (l.length>=20?`<div class="muted" style="text-align:center;font-size:11px;margin-top:8px">Fim dos resultados pra essa busca.</div>`:''));
}

async function marcarContatado2(placeId,nome,contatado){
  try{
    await fetch(B+"/api/vendedor/prospeccao2/contatado",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({placeId,nome,contatado})});
    // atualiza local sem refazer a busca
    const p=(PROSP2_DADOS.data||[]).find(x=>x.placeId===placeId);
    if(p){ p.jaContatado=contatado; }
    render();
  }catch(e){ alert("Não consegui marcar. Tente de novo."); }
}

async function carregarTabInfo(){
  const el=document.getElementById("tabInfo");
  if(!el) return;
  try{
    const j=await fetch(B+"/api/tabela/imagem-info").then(r=>r.json());
    if(j.existe){ el.innerHTML=`Atualizada em ${j.em?new Date(j.em).toLocaleDateString("pt-BR"):'—'} · toque pra enviar ao cliente`; }
    else el.innerHTML='<span style="color:#ffbf00">Ainda não gerada — exporte na tela "Tabela Atacado"</span>';
  }catch(e){ el.textContent=""; }
}
async function compartilharTabela(){
  try{
    const resp=await fetch(B+"/api/tabela/imagem-atual");
    if(!resp.ok){ alert("A tabela ainda não foi gerada.\n\nVá em 'Tabela Atacado', ajuste os preços e clique em exportar imagem (PNG) — ela fica disponível aqui pra compartilhar."); return; }
    const blob=await resp.blob();
    const file=new File([blob],"tabela-b13.png",{type:"image/png"});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],text:"Tabela de preços — B13 Bebidas 🍻"}); return; }
      catch(e){ if(e&&e.name==="AbortError") return; }
    }
    const a=document.createElement("a"); a.download="tabela-b13.png"; a.href=URL.createObjectURL(blob); a.click();
    alert("Imagem da tabela baixada — anexe no WhatsApp. 📎");
  }catch(e){ alert("Erro ao carregar a tabela."); }
}

/* ===== ABA: PESQUISAR PREÇO (montar resposta pro WhatsApp) ===== */
let PRECOS_CATS=null, precosBusca="", precosCatSel="", precosSel=[], precosResultados=[], precosBuscando=false;
// precosSel = [{nome, categoria, precoAtacado, precoBling, precoFardo, caixaQtd}]

async function carregarPrecos(){
  // carrega só a lista de categorias (leve). A busca de produto vai ao Bling sob demanda.
  try{
    const j=await fetch(B+"/api/precos/categorias").then(r=>r.json());
    PRECOS_CATS=j.categorias||[];
  }catch(e){ PRECOS_CATS=[]; }
  render();
}

function viewPrecos(){
  if(!PRECOS_CATS) return `<div class="card"><div class="muted">Carregando…</div></div>`;
  const selCount=precosSel.length;
  return `
  <div class="card">
    <div style="font-weight:800;margin-bottom:2px">🏷️ Pesquisar preço</div>
    <div class="muted" style="font-size:12px;margin-bottom:10px">Busca o produto direto no Bling. Traz atacado, preço do Bling e fardo (quando tem). Selecione 1 ou mais pra montar a resposta pro cliente no WhatsApp.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <input id="precosBuscaInp" placeholder="🔎 Buscar produto (ex.: heineken, coca)…" value="${esc(precosBusca)}" onkeydown="if(event.key==='Enter')fazerBuscaPrecos()" oninput="precosBusca=this.value" style="flex:1;min-width:180px;background:#0f0d24;border:1px solid #514c96;border-radius:8px;color:#fff;padding:9px 12px;font-size:14px">
      <button class="btn btn-mag" onclick="fazerBuscaPrecos()">Buscar</button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center">
      <span class="muted" style="font-size:12px">ou por categoria:</span>
      <select onchange="buscarPorCategoria(this.value)" style="background:#0f0d24;border:1px solid #514c96;border-radius:8px;color:#fff;padding:8px 10px;font-size:13px">
        <option value="">Escolher categoria…</option>
        ${PRECOS_CATS.map(c=>`<option value="${esc(c)}" ${precosCatSel===c?'selected':''}>${esc(c)}</option>`).join("")}
      </select>
    </div>
    <div id="precosLista" style="max-height:40vh;overflow:auto">
      ${precosBuscando?'<div class="muted" style="font-size:12px">Buscando no Bling…</div>'
        :precosResultados.length?precosResultados.map((p,i)=>linhaPrecoProd(p,i)).join("")
        :'<div class="muted" style="font-size:12px">Busque um produto ou escolha uma categoria.</div>'}
    </div>
  </div>

  <div class="card" style="border-color:${selCount?'#25d366':'#2c2660'}">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-weight:800">📝 Resposta pro cliente ${selCount?`(${selCount} produto${selCount>1?'s':''})`:''}</div>
      ${selCount?`<button class="btn btn-ghost" style="font-size:11px;padding:5px 10px" onclick="limparPrecosSel()">Limpar</button>`:''}
    </div>
    ${selCount?`
      <textarea id="precosTexto" readonly style="width:100%;min-height:${Math.min(320,90+selCount*38)}px;background:#0f0d24;border:1px solid #514c96;border-radius:8px;color:#fff;padding:12px;font-size:14px;font-family:inherit;line-height:1.5;resize:vertical">${esc(montarTextoPrecos())}</textarea>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn btn-wa" style="flex:1;min-width:140px" onclick="compartilharPrecosWhats()">📱 Compartilhar no WhatsApp</button>
        <button class="btn btn-ghost" onclick="copiarPrecos()">📋 Copiar texto</button>
      </div>
    `:'<div class="muted" style="font-size:13px">Selecione produtos que eles aparecem aqui, prontos pra enviar.</div>'}
  </div>`;
}

function linhaPrecoProd(p,i){
  const sel=precoJaSelecionado(p);
  const precos=[];
  if(p.precoAtacado!=null) precos.push(`atacado ${brl(p.precoAtacado)}`);
  if(p.precoBling!=null) precos.push(`bling ${brl(p.precoBling)}`);
  if(p.precoFardo!=null) precos.push(`fardo ${brl(p.precoFardo)}${p.caixaQtd?`/${p.caixaQtd}un`:''}`);
  return `
    <div onclick="togglePrecoProd(${i})" style="display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:5px;border-radius:8px;cursor:pointer;background:${sel?'#153a26':'#1c1846'};border:1px solid ${sel?'#25d366':'#2c2660'}">
      <div style="width:22px;height:22px;border-radius:5px;flex-shrink:0;border:2px solid ${sel?'#25d366':'#514c96'};background:${sel?'#25d366':'transparent'};display:flex;align-items:center;justify-content:center;font-weight:900;color:#0a2a1a">${sel?'✓':''}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:13px">${esc(p.nome)}</div>
        <div class="muted" style="font-size:11px">${p.categoria?esc(p.categoria)+' · ':''}${precos.join(" · ")||'sem preço cadastrado'}</div>
      </div>
    </div>`;
}

function precoJaSelecionado(p){ return precosSel.some(x=>x.nome===p.nome); }
function togglePrecoProd(i){
  const p=precosResultados[i]; if(!p) return;
  const ix=precosSel.findIndex(x=>x.nome===p.nome);
  if(ix>=0) precosSel.splice(ix,1);
  else precosSel.push(p);
  render();
}

async function fazerBuscaPrecos(){
  const q=(precosBusca||"").trim();
  if(q.length<2){ return; }
  precosCatSel=""; precosBuscando=true; render();
  try{
    const j=await fetch(B+"/api/precos/buscar?q="+encodeURIComponent(q)).then(r=>r.json());
    precosResultados=j.data||[];
  }catch(e){ precosResultados=[]; }
  precosBuscando=false; render();
}
async function buscarPorCategoria(cat){
  precosCatSel=cat; precosBusca="";
  if(!cat){ precosResultados=[]; render(); return; }
  precosBuscando=true; render();
  try{
    const j=await fetch(B+"/api/precos/buscar?categoria="+encodeURIComponent(cat)).then(r=>r.json());
    precosResultados=j.data||[];
  }catch(e){ precosResultados=[]; }
  precosBuscando=false; render();
}

function limparPrecosSel(){ precosSel=[]; render(); }

function montarTextoPrecos(){
  if(!precosSel.length) return "";
  const porCat={};
  precosSel.forEach(p=>{ const c=p.categoria||"Outros"; (porCat[c]=porCat[c]||[]).push(p); });
  let txt="*B13 bebidas - preços:*\n";
  Object.entries(porCat).forEach(([cat,prods])=>{
    txt+=`\n*${cat}*\n`;
    prods.forEach(p=>{
      // inclui os 3 preços quando existirem
      const partes=[];
      if(p.precoAtacado!=null) partes.push(`atacado ${brl(p.precoAtacado)}`);
      if(p.precoBling!=null) partes.push(`unidade ${brl(p.precoBling)}`);
      if(p.precoFardo!=null) partes.push(`fardo ${brl(p.precoFardo)}${p.caixaQtd?` (cx c/${p.caixaQtd})`:''}`);
      txt+=`• ${p.nome}: ${partes.join(" | ")||'consulte'}\n`;
    });
  });
  txt+="\n_Preços sujeitos a alteração_";
  return txt;
}

function compartilharPrecosWhats(){
  const txt=montarTextoPrecos();
  if(!txt){ alert("Selecione ao menos um produto."); return; }
  window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");
}
async function copiarPrecos(){
  const txt=montarTextoPrecos();
  if(!txt) return;
  try{
    await navigator.clipboard.writeText(txt);
    alert("✅ Texto copiado! Cole no WhatsApp.");
  }catch(e){
    const ta=document.getElementById("precosTexto");
    if(ta){ ta.removeAttribute("readonly"); ta.select(); document.execCommand("copy"); ta.setAttribute("readonly","true"); alert("✅ Texto copiado!"); }
  }
}

render();
setTimeout(carregarTabInfo,300);
</script>
