<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B13 — Apoio ao Vendedor</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
  :root{--mag:#FF0082;--indigo:#181542;--bg:#0f0d24}
  body{background:var(--bg);color:#fff}
  #app{max-width:980px;margin:0 auto;min-height:100vh}
  .top{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#2b2870,#262366);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:3px solid var(--mag)}
  .top .t{font-weight:900;font-size:17px}.top .sp{flex:1}
  .wrap{padding:14px}
  .card{background:#151233;border:1px solid #2c2660;border-radius:14px;padding:16px;margin-bottom:14px}
  .muted{color:#9a95c9;font-size:13px}
  .btn{border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:13px;padding:9px 13px;color:#fff}
  .btn-mag{background:var(--mag)}.btn-wa{background:#25d366;color:#0a2a1a}.btn-ghost{background:#1c1846}
  .seg{display:flex;gap:6px;background:#0f0d24;border-radius:10px;padding:4px;margin-bottom:14px}
  .seg button{flex:1;padding:10px;border:none;border-radius:8px;background:transparent;color:#9a95c9;font-weight:800;cursor:pointer;font-size:13px}
  .seg button.on{background:var(--mag);color:#fff}
  .rc{background:#0f0d24;border-radius:12px;padding:14px;text-align:center}
  .rc .v{font-size:24px;font-weight:900}
  .cli{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid #23204f}
  .cli:last-child{border:none}
  .tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:5px}
  .tag-at{background:#3a2a00;color:#ffd23f}.tag-pd{background:#3a0010;color:#ff8090}
  input,select{padding:10px;border-radius:9px;border:2px solid #514c96;background:#0f0d24;color:#fff;font-size:14px}
</style>
<script src="/nav.js"></script>
<style>
  @media(min-width:900px){
    #b13nav{transform:translateX(0%) !important}
    button[onclick="b13ToggleNav()"]{display:none !important}
    body > *:not(#b13nav):not([onclick="b13ToggleNav()"]):not(#b13navOverlay){ margin-left:200px }
  }
</style>

<body><script>
  (function(){
    if(typeof b13RequireLogin==="function" && !b13RequireLogin()) return;
    if(typeof b13BloquearSeSemAcesso==="function" && !b13BloquearSeSemAcesso("/vendedor")) return;
    document.addEventListener("DOMContentLoaded",function(){
      const nav=document.createElement("div");
      nav.innerHTML=b13RenderNav("/vendedor");
      document.body.insertBefore(nav,document.body.firstChild);
    });
  })();

<div id="app"></div>
<script>
const B=(location.protocol.indexOf("http")===0)?"":"https://b13-bling-backend-production.up.railway.app";
const esc=(s)=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const brl=(v)=>"R$ "+(+v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const soDig=(s)=>String(s??"").replace(/\D/g,"");
let ABA="recuperar", DADOS=null, carregando=false;
let MIN_VALOR=1000;
let mostrarPerdidos=10;

function render(){
  const app=document.getElementById("app");
  app.innerHTML=`
    <div class="top">
      <button onclick="b13ToggleNav()" style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer">☰</button>
      <div class="t">🎯 Apoio ao Vendedor</div><div class="sp"></div>
    </div>
    <div class="wrap">
      <div class="seg">
        <button class="${ABA==='recuperar'?'on':''}" onclick="ABA='recuperar';render()">💰 Meta & Recuperar</button>
        <button class="${ABA==='historico'?'on':''}" onclick="ABA='historico';render()">🕐 Histórico</button>
        <button class="${ABA==='mapa'?'on':''}" onclick="ABA='mapa';render()">🗺️ Mapa</button>
        <button class="${ABA==='prospectar'?'on':''}" onclick="ABA='prospectar';render()">🔍 Prospectar</button>
      </div>
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <div>
          <div style="font-weight:800">📋 Tabela de preços</div>
          <div class="muted" id="tabInfo" style="font-size:11px">Verificando…</div>
        </div>
        <button class="btn btn-wa" onclick="compartilharTabela()">📱 Compartilhar tabela</button>
      </div>
      ${ABA==='recuperar'?viewRecuperar():ABA==='historico'?viewHistorico():ABA==='mapa'?viewMapa():viewProspectar()}
    </div>`;
  if(ABA==='recuperar'&&!DADOS&&!carregando) carregar();
  setTimeout(carregarTabInfo,50);
}

/* ===== ABA 1: RECUPERAR ===== */
function viewRecuperar(){
  if(carregando) return `<div class="card"><div class="muted">📊 Analisando pedidos de atacado (pode levar 1-2 min)…</div></div>`;
  if(!DADOS) return `<div class="card"><div class="muted">Carregando…</div></div>`;
  const m=DADOS.metaMes||{};
  const perdidos=DADOS.perdidos||[];
  const grandes=DADOS.pedidosGrandes||[];
  return `
    ${cardMetaProgresso()}
    <div class="card">
      <div style="font-weight:800;margin-bottom:10px">👤 Vendido por vendedor (atacado — sem varejo)</div>
      ${(DADOS.vendedores&&DADOS.vendedores.length)?DADOS.vendedores.map(vendedorRow).join(""):'<div class="muted">Nenhuma venda de atacado no mês.</div>'}
      <div style="border-top:1px solid #2c2660;margin-top:10px;padding-top:10px;display:flex;justify-content:space-between;font-weight:800">
        <span>Total geral</span>
        <span style="color:#ffd23f">${brl(m.valorTotalMes)} · ${m.qtdTotalMes||0} pedidos</span>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="font-weight:800">⚠️ Clientes que sumiram (${DADOS.qtdPerdidos||0})</div>
        <button class="btn btn-ghost" style="font-size:11px;padding:6px 10px" onclick="novaAnalise()">🔄 Nova análise</button>
      </div>
      <div class="muted" style="font-size:12px;margin-bottom:8px">Eram regulares (3+ pedidos, ticket médio acima de ${brl(MIN_VALOR)}) e pararam de comprar.${DADOS.cacheEm?` <span style="color:#7fd4ff">Análise de ${new Date(DADOS.cacheEm).toLocaleString("pt-BR")}</span>`:''}</div>
      ${perdidos.length?perdidos.slice(0,mostrarPerdidos).map(cliRow).join(""):'<div class="muted">Nenhum cliente perdido detectado. 🎉</div>'}
      ${perdidos.length>mostrarPerdidos?`<button class="btn btn-mag" style="width:100%;margin-top:10px" onclick="mostrarPerdidos+=10;render()">▼ Ver mais 10 (${perdidos.length-mostrarPerdidos} restantes)</button>`:''}
    </div>

    <div class="card">
      <div style="font-weight:800;margin-bottom:8px">🔎 Quem mais compra um produto</div>
      <div class="muted" style="font-size:12px;margin-bottom:6px">1º pesquise o produto, depois veja quem mais compra ele.</div>
      <div style="display:flex;gap:8px">
        <input id="buscaTop" placeholder="Pesquisar produto (ex: skol, heineken)…" style="flex:1" oninput="buscarProdutoDebounce(this.value)">
      </div>
      <div id="produtosEncontrados" style="margin-top:8px"></div>
      <div id="topResultado" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <div style="font-weight:800;margin-bottom:8px">💵 Pedidos grandes (acima de ${brl(MIN_VALOR)}, últimos 30 dias)</div>
      <div class="muted" style="font-size:11px;margin-bottom:8px">Ordenados por quem está há mais tempo sem comprar (prioridade de contato).</div>
      ${grandes.length?grandes.map(g=>`
        <div class="cli">
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:13px">#${esc(g.numero)} — ${esc(g.cliente)}</div>
            <div class="muted" style="font-size:11px">Pedido: ${g.data?g.data.split('-').reverse().join('/'):''} · Última compra: ${g.ultimaCompra?g.ultimaCompra.split('-').reverse().join('/'):''} <b style="color:${g.diasSemComprar>=15?'#ff8090':'#9a95c9'}">(${g.diasSemComprar} dias)</b></div>
          </div>
          <div style="font-weight:800;color:#ffd23f">${brl(g.total)}</div>
        </div>`).join(""):'<div class="muted">Nenhum pedido grande nos últimos 30 dias.</div>'}
    </div>`;
}

/* ===== ACOMPANHAMENTO DA META (gráfico) ===== */
let META_AC=null, META_CARREGANDO=false;
function cardMetaProgresso(){
  if(META_CARREGANDO) return `<div class="card"><div class="muted">📈 Carregando meta…</div></div>`;
  if(!META_AC){ carregarMetaAc(); return `<div class="card"><div class="muted">📈 Carregando meta…</div></div>`; }
  if(!META_AC.meta){
    return `<div class="card" style="border-color:#514c96">
      <div style="font-weight:800;margin-bottom:6px">🎯 Meta do mês não definida</div>
      <div class="muted" style="font-size:13px">Defina a meta do mês no <b>Dashboard</b> pra acompanhar o progresso aqui com gráficos.</div>
    </div>`;
  }
  const a=META_AC;
  const pct=Math.min(100,a.pctMeta);
  const corPct=pct>=100?'#3ce88a':pct>=70?'#ffd23f':pct>=40?'#ff9f40':'#ff5f8f';
  let frase="";
  if(pct>=100) frase="🎉 Meta batida! Parabéns!";
  else if(a.diasRestantes>0) frase=`Faltam ${brl(a.falta)} em ${a.diasRestantes} dia(s). Ritmo ideal: <b style="color:#ffd23f">${brl(a.idealPorDiaRestante)}/dia</b>.`;
  else frase=`Mês encerrado. Vendido: ${brl(a.vendido)} de ${brl(a.meta)}.`;
  return `<div class="card">
    <div style="font-weight:800;margin-bottom:10px">🎯 Progresso da meta — ${a.mes.split("-").reverse().join("/")}</div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
      <span style="font-size:22px;font-weight:900;color:${corPct}">${brl(a.vendido)}</span>
      <span class="muted">de ${brl(a.meta)} · ${a.pctMeta}%</span>
    </div>
    <div style="background:#0f0d24;border-radius:20px;height:16px;overflow:hidden;margin-bottom:6px">
      <div style="height:100%;width:${pct}%;background:${corPct};border-radius:20px"></div>
    </div>
    <div class="muted" style="font-size:12px;margin-bottom:12px">${frase}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px">
      <div class="rc" style="padding:10px"><div class="muted" style="font-size:10px">Pedidos de venda</div><div style="font-weight:800;color:#3ce88a;font-size:14px">${brl(a.vendido)}</div></div>
      <div class="rc" style="padding:10px"><div class="muted" style="font-size:10px">Atendidos</div><div style="font-weight:800;color:#7fd4ff;font-size:14px">${brl((DADOS.metaMes&&DADOS.metaMes.valorAtendidos)||0)}</div></div>
      <div class="rc" style="padding:10px"><div class="muted" style="font-size:10px">Média/dia</div><div style="font-weight:800;font-size:14px">${brl(a.mediaDiaria)}</div></div>
      <div class="rc" style="padding:10px"><div class="muted" style="font-size:10px">Ideal/dia rest.</div><div style="font-weight:800;color:#ffd23f;font-size:14px">${brl(a.idealPorDiaRestante)}</div></div>
    </div>
    <div class="muted" style="font-size:11px;margin-bottom:4px">Vendas por dia (barra rosa) · realizado acum. (verde) · ideal (tracejado amarelo):</div>
    <canvas id="graficoMeta" style="width:100%;height:180px"></canvas>
  </div>`;
}

async function carregarMetaAc(){
  if(META_CARREGANDO) return;
  META_CARREGANDO=true;
  try{ META_AC=await fetch(B+"/api/vendedor/meta-acompanhamento").then(r=>r.json()); }
  catch(e){ META_AC={meta:0}; }
  META_CARREGANDO=false;
  render();
  setTimeout(desenharGraficoMeta,100);
}

function desenharGraficoMeta(){
  const cv=document.getElementById("graficoMeta");
  if(!cv||!META_AC||!META_AC.dias) return;
  const dias=META_AC.dias;
  const W=cv.clientWidth||600, H=180, dpr=2;
  cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const padL=44,padR=10,padT=10,padB=20;
  const gw=W-padL-padR, gh=H-padT-padB;
  const maxAc=Math.max(META_AC.meta, ...dias.map(d=>d.acumulado||0))||1;
  const n=dias.length;
  const bw=Math.max(2,gw/n*0.6);
  ctx.strokeStyle="#2c2660"; ctx.fillStyle="#9a95c9"; ctx.font="9px Arial"; ctx.textAlign="right";
  for(let i=0;i<=4;i++){
    const y=padT+gh-(gh*i/4);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText("R$"+Math.round(maxAc*i/4/1000)+"k",padL-4,y+3);
  }
  const maxDia=Math.max(...dias.map(d=>d.valor||0))||1;
  dias.forEach((d,i)=>{
    const x=padL+gw*i/n+gw/n*0.2;
    const bh=(d.valor/maxDia)*gh*0.7;
    ctx.fillStyle=d.futuro?"#2c2660":"#FF0082";
    ctx.fillRect(x,padT+gh-bh,bw,bh);
  });
  function linha(campo,cor,tracejado){
    ctx.strokeStyle=cor; ctx.lineWidth=2; ctx.setLineDash(tracejado?[4,4]:[]);
    ctx.beginPath(); let primeiro=true;
    dias.forEach((d,i)=>{
      const v=d[campo]; if(v==null) return;
      const x=padL+gw*i/n+gw/n*0.5;
      const y=padT+gh-(v/maxAc*gh);
      if(primeiro){ ctx.moveTo(x,y); primeiro=false; } else ctx.lineTo(x,y);
    });
    ctx.stroke(); ctx.setLineDash([]);
  }
  linha("metaAcumulada","#ffd23f",true);
  linha("acumulado","#3ce88a",false);
  ctx.fillStyle="#9a95c9"; ctx.font="9px Arial"; ctx.textAlign="center";
  dias.forEach((d,i)=>{ if(d.dia%5===0||d.dia===1){ const x=padL+gw*i/n+gw/n*0.5; ctx.fillText(d.dia,x,H-6); } });
}
/* ===== fim acompanhamento meta ===== */

function vendedorRow(v){
  const statusTxt=Object.entries(v.porStatus||{}).map(([nome,qtd])=>`${nome}: ${qtd}`).join(" · ");
  return `<div style="padding:10px 0;border-bottom:1px solid #23204f">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <div style="font-weight:700;font-size:14px">${esc(v.nome)}</div>
      <div style="font-weight:900;color:#ffd23f">${brl(v.valor)}</div>
    </div>
    <div class="muted" style="font-size:11px;margin-top:3px">
      ${v.qtd} pedido(s) · <span style="color:#3ce88a">${v.atendidos} atendido(s) = ${brl(v.valorAtendido)}</span>
    </div>
    ${statusTxt?`<div class="muted" style="font-size:11px;margin-top:2px">${esc(statusTxt)}</div>`:''}
  </div>`;
}

function cliRow(c){
  const ult=c.ultimoContato;
  return `<div class="cli" style="flex-wrap:wrap">
    <div style="flex:1;min-width:200px">
      <div style="font-weight:700;font-size:14px">${esc(c.nome)}</div>
      <div class="muted" style="font-size:11px">
        <span class="tag ${c.nivel==='perdido'?'tag-pd':'tag-at'}">${c.nivel==='perdido'?'PERDIDO':'ATENÇÃO'}</span>
        ${c.diasSem} dias sem comprar · ${c.qtdPedidos} pedidos · média ${brl(c.ticketMedio)}
      </div>
      ${c.qtdContatos?`<div class="muted" style="font-size:11px;margin-top:3px;color:#7fd4ff">📞 ${c.qtdContatos} contato(s) · último: ${ult?ult.resultado:''} ${ult&&ult.quando?'('+new Date(ult.quando).toLocaleDateString("pt-BR")+')':''}</div>`:''}
      ${ult&&ult.nota?`<div class="muted" style="font-size:11px;font-style:italic">"${esc(ult.nota)}"</div>`:''}
    </div>
    <div style="display:flex;gap:4px;flex-wrap:wrap">
      <button class="btn btn-wa" style="font-size:11px;padding:7px 10px" onclick='recuperar(${JSON.stringify(c.id)},${JSON.stringify(c.nome)})'>📱 WhatsApp</button>
      <button class="btn btn-ghost" style="font-size:11px;padding:7px 10px" onclick='registrarContato(${JSON.stringify(c.id)},${JSON.stringify(c.nome)})'>📝 Registrar</button>
      <button class="btn btn-ghost" style="font-size:11px;padding:7px 10px;opacity:.7" onclick='ignorarCliente(${JSON.stringify(c.id)},${JSON.stringify(c.nome)})' title="Remover da lista (ex: cadastro duplicado)">🚫</button>
    </div>
  </div>`;
}

async function registrarContato(id,nome){
  const nota=prompt(`Registrar contato com ${nome}.\n\nO que aconteceu? (ex: "Ligou, vai pensar", "Fez pedido", "Não atendeu")`);
  if(nota===null) return;
  let resultado="contatado";
  const low=(nota||"").toLowerCase();
  if(low.includes("pedido")||low.includes("compr")||low.includes("vendeu")) resultado="voltou";
  else if(low.includes("não atend")||low.includes("nao atend")||low.includes("sem resposta")) resultado="sem resposta";
  else if(low.includes("pensar")||low.includes("depois")) resultado="em negociação";
  try{
    await fetch(B+"/api/vendedor/prospeccao/contato",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({clienteId:id,clienteNome:nome,nota,resultado})});
    // atualiza localmente sem refazer a análise pesada
    if(DADOS?.perdidos){
      const c=DADOS.perdidos.find(x=>String(x.id)===String(id));
      if(c){ c.qtdContatos=(c.qtdContatos||0)+1; c.ultimoContato={quando:new Date().toISOString(),resultado,nota}; }
    }
    TIMELINE=null; render();
  }catch(e){ alert("Erro ao registrar."); }
}

async function ignorarCliente(id,nome){
  if(!confirm(`Remover "${nome}" da lista de análise?\n\nUse pra cadastros duplicados ou clientes que não quer acompanhar.`)) return;
  try{
    await fetch(B+"/api/vendedor/prospeccao/ignorar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({clienteId:id,ignorar:true})});
    // remove localmente do cache atual (instantâneo, sem refazer a análise pesada)
    if(DADOS?.perdidos){ DADOS.perdidos=DADOS.perdidos.filter(c=>String(c.id)!==String(id)); DADOS.qtdPerdidos=DADOS.perdidos.length; }
    render();
  }catch(e){ alert("Erro."); }
}

async function recuperar(id,nome){
  let tel="";
  try{ const j=await fetch(B+"/api/vendedor/cliente/"+id+"/contato").then(r=>r.json()); tel=soDig(j.telefone||""); }catch(e){}
  const msg=`Olá, ${nome}! Nós da B13 Bebidas estamos sentindo sua falta! Estamos com diversas promoções! Posso te enviar a tabela?`;
  if(tel.length<10){
    if(confirm(nome+" não tem telefone cadastrado. Abrir o WhatsApp mesmo assim (você escolhe o contato)?")){
      window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
    }
    return;
  }
  const t55=tel.length<=11?("55"+tel):tel;
  window.open("https://wa.me/"+t55+"?text="+encodeURIComponent(msg),"_blank");
  // registra automaticamente que houve tentativa de contato via WhatsApp
  fetch(B+"/api/vendedor/prospeccao/contato",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({clienteId:id,clienteNome:nome,nota:"Abriu WhatsApp",resultado:"contatado"})}).then(()=>{ TIMELINE=null; });
}

let _prodT=null;
function buscarProdutoDebounce(v){ clearTimeout(_prodT); _prodT=setTimeout(()=>buscarProdutoTop(v),350); }
async function buscarProdutoTop(termo){
  termo=(termo||"").trim();
  const box=document.getElementById("produtosEncontrados");
  const topBox=document.getElementById("topResultado");
  if(topBox) topBox.innerHTML="";
  if(termo.length<2){ box.innerHTML=""; return; }
  box.innerHTML='<div class="muted">Buscando produtos…</div>';
  try{
    const j=await fetch(B+"/api/buscar-atacado?nome="+encodeURIComponent(termo)).then(r=>r.json());
    const prods=(j.data||[]).slice(0,8);
    box.innerHTML=prods.length?`
      <div class="muted" style="font-size:11px;margin-bottom:4px">Escolha o produto:</div>
      ${prods.map(p=>`<button class="btn btn-ghost" style="font-size:12px;padding:7px 10px;margin:2px" onclick='verQuemCompra(${JSON.stringify(p.nome).replace(/'/g,"&#39;")})'>${esc(p.nome)}</button>`).join("")}
    `:'<div class="muted">Nenhum produto encontrado.</div>';
  }catch(e){ box.innerHTML='<div class="muted">Erro na busca.</div>'; }
}

async function verQuemCompra(nomeProduto){
  const box=document.getElementById("topResultado");
  document.getElementById("produtosEncontrados").innerHTML=`<div class="muted" style="font-size:12px">Produto: <b>${esc(nomeProduto)}</b></div>`;
  box.innerHTML='<div class="muted">Buscando quem compra (pode demorar)…</div>';
  try{
    const j=await fetch(B+"/api/vendedor/top-produto?nome="+encodeURIComponent(nomeProduto)).then(r=>r.json());
    const l=j.data||[];
    box.innerHTML=l.length?`<div style="font-weight:700;margin-bottom:6px">🏆 Quem mais compra:</div>`+l.map((c,i)=>`
      <div class="cli">
        <div style="width:24px;font-weight:900;color:#ffd23f">${i+1}º</div>
        <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13px">${esc(c.nome)}</div>
          <div class="muted" style="font-size:11px">${c.qtdTotal} un em ${c.pedidos} pedido(s)</div></div>
        <button class="btn btn-wa" style="font-size:12px" onclick='recuperar(${JSON.stringify(c.id)},${JSON.stringify(c.nome)})'>📱</button>
      </div>`).join(""):'<div class="muted">Ninguém comprou esse produto no período.</div>';
  }catch(e){ box.innerHTML='<div class="muted">Erro na busca.</div>'; }
}

async function carregar(forcar){
  carregando=true; render();
  try{ DADOS=await fetch(B+"/api/vendedor/apoio?minValor="+MIN_VALOR+(forcar?"&forcar=1":"")).then(r=>r.json()); }
  catch(e){ DADOS={erro:"Erro ao carregar"}; }
  carregando=false; render();
}
function recarregar(){ DADOS=null; mostrarPerdidos=10; carregar(); }
function novaAnalise(){
  if(!confirm("Refazer a análise agora? Isso varre todos os pedidos no Bling e leva 1-2 min. (A análise já é atualizada automaticamente 1x por dia.)")) return;
  DADOS=null; mostrarPerdidos=10; carregar(true);
}

/* ===== ABA MAPA ===== */
let MAPA_STATUS=null, BUSCA_CLI="", RESULT_CLI=[], CLI_SEL=null, PROXIMOS=null, RAIO_PROX=3;
function viewMapa(){
  if(!MAPA_STATUS) carregarStatusMapa();
  return `<div class="card">
    <div style="font-weight:800;margin-bottom:8px">🗺️ Mapa e clientes próximos</div>
    <div class="muted" style="font-size:12px;margin-bottom:10px">Busque um cliente e veja outros num raio próximo — útil pra montar rota de visitas ou achar quem está perto de quem já compra.</div>

    <div style="background:#0f0d24;border-radius:10px;padding:10px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="muted" style="font-size:12px">${MAPA_STATUS?`${MAPA_STATUS.total||0} clientes com localização`:'Carregando…'}</div>
        <button class="btn btn-ghost" style="font-size:11px;padding:6px 10px" onclick="geocodificarLote()">📍 Processar mais</button>
      </div>
      <div class="muted" style="font-size:11px;margin-top:4px">Na 1ª vez, clique em "Processar mais" várias vezes pra ir localizando os clientes (faz aos poucos).</div>
      <div id="geoProgresso" class="muted" style="font-size:11px;margin-top:4px"></div>
      <button class="btn btn-mag" style="width:100%;margin-top:8px;font-size:12px" onclick="abrirMapaCompleto()">🗺️ Ver mapa com todos os clientes</button>
    </div>

    <label class="muted" style="font-size:12px">Buscar cliente</label>
    <div style="display:flex;gap:8px;margin:4px 0 10px">
      <input id="buscaCli" placeholder="Nome ou parte do nome…" value="${esc(BUSCA_CLI)}" style="flex:1" oninput="BUSCA_CLI=this.value" onkeydown="if(event.key==='Enter')buscarCliMapa()">
      <button class="btn btn-mag" onclick="buscarCliMapa()">🔍 Buscar</button>
    </div>
    <div id="resultCli">${RESULT_CLI.map(cliMapaRow).join("")}</div>

    ${CLI_SEL?`
      <div style="margin-top:12px;border-top:1px solid #2c2660;padding-top:12px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="font-weight:800">📍 Próximos de ${esc(CLI_SEL.nome)}</div>
          <div style="display:flex;align-items:center;gap:6px">
            <label class="muted" style="font-size:12px">Raio:</label>
            <select onchange="RAIO_PROX=+this.value;buscarProximos()" style="padding:6px">
              <option value="1" ${RAIO_PROX===1?'selected':''}>1 km</option>
              <option value="3" ${RAIO_PROX===3?'selected':''}>3 km</option>
              <option value="5" ${RAIO_PROX===5?'selected':''}>5 km</option>
              <option value="10" ${RAIO_PROX===10?'selected':''}>10 km</option>
            </select>
          </div>
        </div>
        ${PROXIMOS?(PROXIMOS.length?`
          ${PROXIMOS.map(p=>`
            <div class="cli">
              <div style="flex:1;min-width:0">
                <div style="font-weight:700;font-size:13px">${esc(p.nome)}</div>
                <div class="muted" style="font-size:11px">${esc(p.endereco)}</div>
              </div>
              <div style="font-weight:800;color:#3ce88a">${p.dist} km</div>
            </div>`).join("")}
        `:'<div class="muted">Nenhum cliente com localização nesse raio.</div>'):'<div class="muted">Calculando…</div>'}
      </div>`:''}
  </div>`;
}

function cliMapaRow(c){
  return `<div class="cli">
    <div style="flex:1;min-width:0">
      <div style="font-weight:700;font-size:13px">${esc(c.nome)}</div>
      <div class="muted" style="font-size:11px">${c.lat?esc(c.endereco||''):'⚠️ sem endereço no Bling — não dá pra localizar'}</div>
    </div>
    <button class="btn ${c.lat?'btn-mag':'btn-ghost'}" style="font-size:11px;padding:7px 10px" ${c.lat?'':'disabled'} onclick='selecionarCli(${JSON.stringify(c).replace(/'/g,"&#39;")})'>Ver próximos</button>
  </div>`;
}

let _cliT=null;
function buscarCliDebounce(v){ BUSCA_CLI=v; clearTimeout(_cliT); _cliT=setTimeout(buscarCliMapa,350); }
async function buscarCliMapa(){
  const inp=document.getElementById("buscaCli");
  if(inp) BUSCA_CLI=inp.value;
  if(BUSCA_CLI.trim().length<2){ alert("Digite ao menos 2 letras."); return; }
  const box=document.getElementById("resultCli");
  if(box) box.innerHTML='<div class="muted" style="font-size:12px">Buscando… (pode levar alguns segundos)</div>';
  try{
    const j=await fetch(B+"/api/vendedor/buscar-cliente-mapa?nome="+encodeURIComponent(BUSCA_CLI.trim())).then(r=>r.json());
    RESULT_CLI=j.clientes||[];
    if(!RESULT_CLI.length && box){ box.innerHTML='<div class="muted" style="font-size:12px">Nenhum cliente encontrado com esse nome.</div>'; return; }
    render();
  }catch(e){ if(box) box.innerHTML='<div class="muted">Erro na busca.</div>'; }
}

function selecionarCli(c){ CLI_SEL=c; PROXIMOS=null; render(); buscarProximos(); }
async function buscarProximos(){
  if(!CLI_SEL) return;
  try{
    const j=await fetch(B+"/api/vendedor/clientes-proximos/"+CLI_SEL.id+"?raio="+RAIO_PROX).then(r=>r.json());
    PROXIMOS=j.proximos||[];
  }catch(e){ PROXIMOS=[]; }
  render();
}

async function abrirMapaCompleto(){
  // carrega o Leaflet (CSS+JS) sob demanda, só quando abre o mapa
  if(!window.L){
    await new Promise((res)=>{
      const css=document.createElement("link"); css.rel="stylesheet"; css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(css);
      const js=document.createElement("script"); js.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"; js.onload=res; document.head.appendChild(js);
    });
  }
  // busca os clientes geocodificados
  let clientes=[];
  try{ const j=await fetch(B+"/api/vendedor/mapa-clientes").then(r=>r.json()); clientes=j.clientes||[]; }catch(e){}
  if(!clientes.length){ alert("Nenhum cliente localizado ainda. Clique em 'Processar mais' pra localizar os clientes primeiro."); return; }

  // modal com o mapa
  const ov=document.createElement("div");
  ov.id="modalMapa";
  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;display:flex;flex-direction:column;padding:10px";
  ov.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-weight:800;color:#fff">🗺️ ${clientes.length} clientes no mapa</div>
      <button class="btn btn-ghost" style="padding:8px 14px" onclick="document.getElementById('modalMapa').remove()">✕ Fechar</button>
    </div>
    <div id="mapaLeaflet" style="flex:1;border-radius:12px;overflow:hidden"></div>`;
  document.body.appendChild(ov);

  // inicializa o mapa centralizado na média das coordenadas
  const latMed=clientes.reduce((s,c)=>s+c.lat,0)/clientes.length;
  const lngMed=clientes.reduce((s,c)=>s+c.lng,0)/clientes.length;
  const map=L.map("mapaLeaflet").setView([latMed,lngMed],12);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
  // adiciona a loja (referência)
  const grupo=[];
  clientes.forEach(c=>{
    const m=L.marker([c.lat,c.lng]).addTo(map);
    m.bindPopup(`<b>${(c.nome||"").replace(/</g,"&lt;")}</b><br>${(c.endereco||"").replace(/</g,"&lt;")}`);
    grupo.push([c.lat,c.lng]);
  });
  // ajusta o zoom pra caber todos os pontos
  if(grupo.length>1){ try{ map.fitBounds(grupo,{padding:[40,40]}); }catch(e){} }
  setTimeout(()=>map.invalidateSize(),200); // corrige renderização dentro do modal
}

async function carregarStatusMapa(){
  try{ const j=await fetch(B+"/api/vendedor/mapa-clientes").then(r=>r.json()); MAPA_STATUS=j; render(); }catch(e){}
}
async function geocodificarLote(){
  const el=document.getElementById("geoProgresso");
  if(el) el.textContent="Processando… (pode levar ~30s)";
  try{
    const j=await fetch(B+"/api/vendedor/geocodificar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lote:20})}).then(r=>r.json());
    if(el) el.textContent=`✓ +${j.novosComCoord} localizados agora. Total: ${j.totalComCoord}. Clique de novo pra continuar.`;
    carregarStatusMapa();
  }catch(e){ if(el) el.textContent="Erro ao processar."; }
}

/* ===== ABA 2: PROSPECTAR (em breve) ===== */
let PROSP_TIPO="bar", PROSP_RAIO=3000, PROSP_DADOS=null, PROSP_CARREGANDO=false;
const TIPOS_PROSP=[
  {id:"bar",label:"🍺 Bares"},{id:"restaurante",label:"🍽️ Restaurantes"},
  {id:"lanchonete",label:"🍔 Lanchonetes"},{id:"mercearia",label:"🏪 Mercadinhos"},
  {id:"adega",label:"🍷 Adegas/Distrib."},{id:"conveniencia",label:"⛽ Conveniências"},
];
function viewProspectar(){
  return `<div class="card">
    <div style="font-weight:800;margin-bottom:6px">🔍 Prospecção de novos clientes</div>
    <div class="muted" style="font-size:12px;margin-bottom:10px">Estabelecimentos perto da loja (Glória, BH) que podem virar clientes de atacado.</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">
      ${TIPOS_PROSP.map(t=>`<span class="btn ${PROSP_TIPO===t.id?'btn-mag':'btn-ghost'}" style="font-size:12px" onclick="PROSP_TIPO='${t.id}';render()">${t.label}</span>`).join("")}
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
      <label class="muted" style="font-size:12px">Raio:</label>
      <select onchange="PROSP_RAIO=+this.value" style="flex:1">
        <option value="1500" ${PROSP_RAIO===1500?'selected':''}>1,5 km</option>
        <option value="3000" ${PROSP_RAIO===3000?'selected':''}>3 km</option>
        <option value="5000" ${PROSP_RAIO===5000?'selected':''}>5 km</option>
        <option value="10000" ${PROSP_RAIO===10000?'selected':''}>10 km</option>
      </select>
      <button class="btn btn-mag" onclick="buscarProspeccao()">🔍 Buscar</button>
    </div>
    <div id="prospResultado">${PROSP_CARREGANDO?'<div class="muted">Buscando estabelecimentos…</div>':(PROSP_DADOS?renderProspLista():'<div class="muted" style="font-size:12px">Escolha o tipo e o raio, depois clique em Buscar.</div>')}</div>
  </div>`;
}

function renderProspLista(){
  if(PROSP_DADOS.erro) return `<div class="muted">Erro: ${esc(PROSP_DADOS.erro)}</div>`;
  const l=PROSP_DADOS.locais||[];
  if(!l.length) return '<div class="muted">Nenhum estabelecimento encontrado nesse raio.</div>';
  return `<div class="muted" style="font-size:12px;margin-bottom:8px">${l.length} encontrados ${PROSP_DADOS.doCache?'(do cache)':''}</div>`+
    l.map((p,i)=>`
    <div class="cli" style="flex-wrap:wrap">
      <div style="flex:1;min-width:200px">
        <div style="font-weight:700;font-size:13px">${esc(p.nome)}</div>
        <div class="muted" style="font-size:11px">${esc(p.endereco)}${p.rating?` · ⭐ ${p.rating} (${p.totalAvaliacoes})`:''}</div>
        <div id="det-${i}" class="muted" style="font-size:11px;margin-top:2px"></div>
      </div>
      <button class="btn btn-ghost" style="font-size:11px;padding:7px 10px" onclick="verDetalhe('${p.placeId}',${i})">📞 Ver contato</button>
    </div>`).join("");
}

async function buscarProspeccao(){
  PROSP_CARREGANDO=true; render();
  try{
    PROSP_DADOS=await fetch(B+"/api/vendedor/prospeccao-places?tipo="+PROSP_TIPO+"&raio="+PROSP_RAIO).then(r=>r.json());
  }catch(e){ PROSP_DADOS={erro:"Erro ao buscar"}; }
  PROSP_CARREGANDO=false; render();
}

async function verDetalhe(placeId,ix){
  const el=document.getElementById("det-"+ix);
  if(el) el.textContent="Buscando contato…";
  try{
    const j=await fetch(B+"/api/vendedor/place-detalhe/"+placeId).then(r=>r.json());
    if(!el) return;
    if(j.jaCliente){
      el.innerHTML=`<span style="color:#3ce88a">✓ Já é cliente: ${esc(j.jaCliente.nome)}</span>${j.telefone?' · '+esc(j.telefone):''}`;
    }else if(j.telefone){
      const tel=soDig(j.telefone); const t55=tel.length<=11?("55"+tel):tel;
      const msg="Olá! Aqui é da B13 Bebidas 🍻 Somos distribuidora de bebidas no atacado aqui na Glória. Posso te passar nossa tabela de preços?";
      el.innerHTML=`📞 ${esc(j.telefone)} · <a href="https://wa.me/${t55}?text=${encodeURIComponent(msg)}" target="_blank" style="color:#25d366;font-weight:700">WhatsApp</a> <span style="color:#ffd23f">· novo cliente!</span>`;
    }else{
      el.innerHTML=`<span class="muted">Sem telefone no Google. ${j.website?'<a href="'+esc(j.website)+'" target="_blank" style="color:#7fd4ff">site</a>':''}</span>`;
    }
  }catch(e){ if(el) el.textContent="Erro ao buscar contato."; }
}

async function carregarTabInfo(){
  const el=document.getElementById("tabInfo");
  if(!el) return;
  try{
    const j=await fetch(B+"/api/tabela/imagem-info").then(r=>r.json());
    if(j.existe){ el.innerHTML=`Atualizada em ${j.em?new Date(j.em).toLocaleDateString("pt-BR"):'—'} · toque pra enviar ao cliente`; }
    else el.innerHTML='<span style="color:#ffbf00">Ainda não gerada — exporte na tela "Tabela Atacado"</span>';
  }catch(e){ el.textContent=""; }
}
async function compartilharTabela(){
  try{
    const resp=await fetch(B+"/api/tabela/imagem-atual");
    if(!resp.ok){ alert("A tabela ainda não foi gerada.\n\nVá em 'Tabela Atacado', ajuste os preços e clique em exportar imagem (PNG) — ela fica disponível aqui pra compartilhar."); return; }
    const blob=await resp.blob();
    const file=new File([blob],"tabela-b13.png",{type:"image/png"});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],text:"Tabela de preços — B13 Bebidas 🍻"}); return; }
      catch(e){ if(e&&e.name==="AbortError") return; }
    }
    const a=document.createElement("a"); a.download="tabela-b13.png"; a.href=URL.createObjectURL(blob); a.click();
    alert("Imagem da tabela baixada — anexe no WhatsApp. 📎");
  }catch(e){ alert("Erro ao carregar a tabela."); }
}

render();
setTimeout(carregarTabInfo,300);
</script>
