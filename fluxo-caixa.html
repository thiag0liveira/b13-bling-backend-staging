<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B13 · Fluxo de Caixa Inteligente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0733; --panel:#130B45; --panel-2:#1A1052; --panel-3:#22166a;
  --line:rgba(183,176,230,.16); --line-2:rgba(183,176,230,.28);
  --text:#F2F0FF; --text-2:#B7B0E6; --muted:#8f88c6;
  --accent:#F5127E; --accent-2:#FF6BB0; --accent-wash:rgba(245,18,126,.14);
  --in:#2a96d0; --out:#ea4d78; --in-wash:rgba(42,150,208,.16); --out-wash:rgba(234,77,120,.16);
  --saldo:#B7B0E6; --grid:rgba(183,176,230,.12);
  --good:#0ca30c; --good-txt:#4fd66a; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b; --critical-txt:#ff7b7b;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --glow:radial-gradient(120% 70% at 18% 0%, rgba(245,18,126,.22), rgba(245,18,126,0) 42%),radial-gradient(120% 80% at 100% 100%, rgba(120,60,200,.22), rgba(120,60,200,0) 45%);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F5F4FB; --panel:#FFFFFF; --panel-2:#F3F1FB; --panel-3:#E9E6F7;
  --line:#E4E1F2; --line-2:#CFCAE8;
  --text:#0C0733; --text-2:#4A4570; --muted:#6A6590;
  --accent:#E00F73; --accent-2:#C21A6E; --accent-wash:rgba(224,15,115,.08);
  --in:#1f86c2; --out:#d9346a; --in-wash:rgba(31,134,194,.10); --out-wash:rgba(217,52,106,.10);
  --saldo:#4A4570; --grid:#ECEAF5;
  --good-txt:#0a7a0a; --critical-txt:#b42323;
  --shadow:0 8px 24px rgba(12,7,51,.08);
  --glow:radial-gradient(120% 60% at 18% 0%, rgba(224,15,115,.07), rgba(224,15,115,0) 40%);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Archivo,Arial,sans-serif;background:var(--glow),var(--bg);background-attachment:fixed;color:var(--text);font-size:14px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1440px;margin:0 auto;padding:0 24px}
@media (max-width:720px){.wrap{padding:0 16px}}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.8;padding:6px 8px;border-radius:8px;background:#22138A}
.logo b{font-weight:900;font-size:19px;color:#F2F0FF;letter-spacing:-.5px}
.logo span{font-weight:800;font-size:6.5px;color:#F5127E;letter-spacing:2.2px;margin-top:3px}
.brand h1{font-size:16px;font-weight:800;margin:0;white-space:nowrap;letter-spacing:-.2px}
.brand small{display:block;color:var(--text-2);font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;min-width:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);color:var(--text);font-weight:600;font-size:13px;white-space:nowrap}
.iconbtn:hover{border-color:var(--accent-2)}
.iconbtn svg{width:16px;height:16px;flex:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.08);border-color:var(--accent)}
.iconbtn[aria-pressed="true"]{background:var(--accent-wash);border-color:var(--accent)}
@media (max-width:900px){.hide-sm{display:none!important}.brand small{display:none}}
@media (max-width:640px){.top .wrap{gap:8px}.brand h1{font-size:14px;overflow:hidden;text-overflow:ellipsis}.brand{flex:1}.top .sp{display:none}.top .btn-primary span{display:none}.kpi .val{font-size:20px}.hero .val{font-size:36px}.card{padding:14px}.fab span:not(.n){display:none}}

/* filter row */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 0 4px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--text-2)}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.field{height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);padding:0 10px;font-size:13px}
input[type=date].field{padding:0 8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid var(--line-2);color:var(--text-2);white-space:nowrap}
.chip.pf{border-color:rgba(42,150,208,.5)}
.chip.pj{border-color:rgba(183,176,230,.45)}
.chip.mei{border-color:rgba(250,178,25,.55)}
.chip.sug{border-style:dashed;color:var(--text-2)}
.chip.ok{border-color:rgba(12,163,12,.6);color:var(--good-txt)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:12px 14px;font-weight:700;font-size:13.5px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tabs .count{background:var(--panel-3);border-radius:999px;padding:1px 7px;font-size:11px;color:var(--text)}
.tabs .count.hot{background:var(--accent);color:#fff}

/* cards & grid */
.grid{display:grid;gap:16px;margin:16px 0}
.g-kpi{grid-template-columns:1.5fr 1fr 1fr 1fr 1fr}
.g-2{grid-template-columns:1fr 1fr}
.g-21{grid-template-columns:2fr 1fr}
.g-12{grid-template-columns:1fr 2fr}
@media (max-width:1180px){.g-kpi{grid-template-columns:1fr 1fr 1fr}.g-kpi .hero{grid-column:1/-1}}
@media (max-width:900px){.g-2,.g-21,.g-12{grid-template-columns:1fr}}
@media (max-width:560px){.g-kpi{grid-template-columns:1fr 1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0;position:relative}
.card h2{font-size:15px;font-weight:800;margin:0;display:flex;align-items:center;gap:8px;letter-spacing:-.1px}
.card h2::before{content:"";width:7px;height:7px;background:var(--accent);transform:rotate(45deg);flex:none}
.card .sub{color:var(--text-2);font-size:12.5px;margin:3px 0 12px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.line{height:2px;width:14px;border-radius:2px;vertical-align:3px}

/* KPI */
.kpi .lbl{font-size:12.5px;color:var(--text-2);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:6px;white-space:nowrap}
.kpi .foot{font-size:12px;color:var(--text-2);margin-top:4px}
.kpi .arrow{display:inline-flex;width:20px;height:20px;border-radius:6px;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.kpi .arrow.in{background:var(--in-wash);color:var(--in)}
.kpi .arrow.out{background:var(--out-wash);color:var(--out)}
.hero{background:linear-gradient(135deg,var(--panel-2),var(--panel));overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;background:radial-gradient(circle,var(--accent-wash),transparent 70%);pointer-events:none}
.hero .val{font-size:48px;font-weight:800;letter-spacing:-1.5px;line-height:1.05}
.hero .path{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--text-2)}
.hero .path b{color:var(--text)}
.delta-neg{color:var(--critical-txt);font-weight:700}
.delta-pos{color:var(--good-txt);font-weight:700}
.meter{height:8px;border-radius:99px;background:var(--panel-3);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* insights */
.insights{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.insights li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);font-size:13.5px}
.insights li .ico{flex:none;width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--accent-wash);color:var(--accent-2);font-weight:900;font-size:12px}
.insights b{font-weight:700}

/* alert radar */
.alerts{display:grid;gap:10px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);text-align:left;width:100%}
button.alert:hover{border-color:var(--line-2)}
.alert .dot{flex:none;width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#0C0733}
.alert.critical .dot{background:var(--critical);color:#fff}
.alert.serious .dot{background:var(--serious)}
.alert.warning .dot{background:var(--warning)}
.alert.good .dot{background:var(--good);color:#fff}
.alert.info .dot{background:var(--panel-3);color:var(--text)}
.alert .t{font-weight:700;font-size:13.5px}
.alert .d{color:var(--text-2);font-size:12.5px;margin-top:2px}
.alert .sev{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--text-2)}
.alert .amt{margin-left:auto;font-weight:800;white-space:nowrap;padding-left:8px}

/* bars list */
.bars{display:grid;gap:9px}
.barrow{display:grid;grid-template-columns:minmax(110px,1.1fr) 2fr 148px;gap:10px;align-items:center;font-size:13px;border:0;background:none;padding:3px 4px;border-radius:8px;text-align:left;width:100%}
.barrow:hover{background:var(--panel-2)}
.barrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.barrow .track{height:12px;background:var(--panel-3);border-radius:0 4px 4px 0;overflow:hidden}
.barrow .track i{display:block;height:100%;border-radius:0 4px 4px 0;min-width:2px}
.barrow .v{text-align:right;white-space:nowrap;font-weight:700}
.barrow .v small{color:var(--text-2);font-weight:500;margin-left:6px}

/* charts */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis text,.chart text.axis{fill:var(--muted);font-size:11px;font-family:Archivo,Arial,sans-serif}
.chart .gl{stroke:var(--grid);stroke-width:1}
.scrollx{overflow-x:auto}
.scrollx > .chart{min-width:760px}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;box-shadow:var(--shadow);font-size:12.5px;max-width:320px;opacity:0;transition:opacity .08s}
.tip.on{opacity:1}
.tip .tv{font-weight:800;font-size:15px}
.tip .tl{color:var(--text-2)}
.tip .row{display:flex;align-items:center;gap:8px;margin-top:3px}
.tip .row i{width:12px;height:2px;border-radius:2px;flex:none}
.tip .hd{font-weight:700;margin-bottom:4px}
.hit{cursor:pointer}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-2);font-weight:700;background:var(--panel-2);position:sticky;top:0;z-index:1}
td.r,th.r{text-align:right}
tr.day td{background:var(--panel-2);font-weight:700;font-size:12.5px;color:var(--text-2)}
tr.day td b{color:var(--text)}
tr.tx{cursor:pointer}
tr.tx:hover td{background:var(--accent-wash)}
tr.tx.done td:not(.stc){opacity:.62}
.desc{display:flex;flex-direction:column;gap:3px;min-width:0}
.desc .h{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px}
.desc .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--text-2);font-size:12px}
.v-in{color:var(--text);font-weight:700}
.v-out{color:var(--text);font-weight:700}
.sign{display:inline-flex;width:16px;height:16px;border-radius:5px;align-items:center;justify-content:center;font-size:11px;font-weight:900;margin-right:6px;vertical-align:-2px}
.sign.in{background:var(--in-wash);color:var(--in)}
.sign.out{background:var(--out-wash);color:var(--out)}
.catcell{display:flex;align-items:center;gap:6px}
.catdot{width:8px;height:8px;border-radius:2px;flex:none}
.flag{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;font-size:11px;font-weight:900;color:#0C0733}
.flag.critical{background:var(--critical);color:#fff}.flag.serious{background:var(--serious)}.flag.warning{background:var(--warning)}.flag.info{background:var(--panel-3);color:var(--text)}
.stbox{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);display:inline-flex;align-items:center;justify-content:center;background:none;padding:0}
.stbox.on{background:var(--good);border-color:var(--good);color:#fff}
.stbox svg{width:12px;height:12px}
.more{display:flex;justify-content:center;padding:14px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.toolbar .search{flex:1;min-width:200px;position:relative}
.toolbar .search input{width:100%;padding-left:34px}
.toolbar .search svg{position:absolute;left:10px;top:10px;width:16px;height:16px;color:var(--muted)}
.summary{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);margin:-4px 0 10px}
.summary b{color:var(--text)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,3,20,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--panel);border-left:1px solid var(--line-2);z-index:70;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.on{transform:none}
.drawer .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer .dh h3{margin:0;font-size:15px;font-weight:800;flex:1}
.drawer .db{padding:18px;overflow-y:auto;flex:1}
.drawer .df{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bigv{font-size:34px;font-weight:800;letter-spacing:-1px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px;margin:14px 0}
.kv dt{color:var(--text-2)}
.kv dd{margin:0;word-break:break-word}
.sect{margin-top:18px}
.sect h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-2)}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.catbtn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);font-size:12.5px;font-weight:600;text-align:left}
.catbtn kbd{margin-left:auto;font-size:10.5px;color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:0 5px;font-family:inherit}
.catbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash)}
.reason{font-size:12.5px;color:var(--text-2);background:var(--panel-2);border:1px dashed var(--line-2);border-radius:10px;padding:8px 10px;margin-top:8px}
label.lb{display:block;font-size:12px;color:var(--text-2);font-weight:600;margin:10px 0 4px}
textarea.field,input.field.w{width:100%}
textarea.field{height:auto;min-height:64px;padding:8px 10px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:10px}
.progress{height:4px;background:var(--panel-3)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.link-list{display:grid;gap:6px}
.link-list button{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:8px 10px;font-size:12.5px;text-align:left}

/* empty state */
.empty{display:grid;place-items:center;min-height:calc(100vh - 64px);padding:40px 0}
.drop{width:min(760px,100%);border:2px dashed var(--line-2);border-radius:24px;padding:48px 32px;text-align:center;background:color-mix(in srgb,var(--panel) 70%,transparent);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-wash)}
.drop h2{font-size:30px;font-weight:900;letter-spacing:-.8px;margin:12px 0 8px}
.drop h2 em{font-style:normal;color:var(--accent)}
.drop p{color:var(--text-2);margin:0 auto;max-width:520px}
.drop .big-ico{width:64px;height:64px;border-radius:18px;background:var(--accent-wash);display:inline-flex;align-items:center;justify-content:center;color:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px;text-align:left}
.steps div{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:12.5px;color:var(--text-2)}
.steps b{display:block;color:var(--text);font-size:13px;margin-bottom:2px}
@media (max-width:640px){.steps{grid-template-columns:1fr}.drop h2{font-size:24px}}
.dragcover{position:fixed;inset:0;z-index:90;background:rgba(12,7,51,.8);display:none;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;border:4px dashed var(--accent)}
.dragcover.on{display:flex}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--line-2);border-left:4px solid var(--accent);padding:12px 16px;border-radius:12px;z-index:95;opacity:0;transition:.2s;box-shadow:var(--shadow);font-weight:600;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}

/* fab */
.fab{position:fixed;right:24px;bottom:24px;z-index:40;display:flex;align-items:center;gap:10px;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-weight:800;box-shadow:0 10px 30px rgba(245,18,126,.35)}
.fab .n{background:#fff;color:var(--accent);border-radius:99px;padding:1px 8px;font-size:12px}
@media (max-width:640px){.fab{right:16px;bottom:16px;padding:12px 16px}}

.rank table{min-width:640px}
.pill-btn{border:1px solid var(--line-2);background:var(--panel-2);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600}
.muted{color:var(--text-2)}
.small{font-size:12px}
.right{margin-left:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hr{height:1px;background:var(--line);margin:14px 0}
.note-ico{color:var(--accent-2);font-weight:900}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}

@media print{
  :root{--bg:#fff;--panel:#fff;--panel-2:#f6f5fb;--panel-3:#e9e6f7;--line:#dcd8ee;--line-2:#cfcae8;--text:#0C0733;--text-2:#4A4570;--muted:#6A6590;--in:#1f86c2;--out:#d9346a;--grid:#eceaf5;--saldo:#4A4570;--shadow:none;--glow:none;--accent:#E00F73}
  body{background:#fff}
  .top,.tabs,.filters .seg-period-hide,.fab,.toolbar,.more,.no-print{display:none!important}
  .card{break-inside:avoid;box-shadow:none}
  .print-only{display:block!important}
}
.print-only{display:none}
</style>
</head>
<body>

function hash(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36); }

const BIZ = /\b(LTDA|LTD|ME|EPP|EIRELI|EIREL|S\/A|S A|CIA|COMERCIO|COMERCIAL|DISTRIB\w*|DIST|INDUSTRIA|IND|BEBID\w*|ATACAD\w*|SERVIC\w*|SERVI|EVENTO\w*|FESTAS|REPRESENTAC\w*|EQUIPAMENTO\w*|RENTAL|LOCA\w*|COBRANCA|SECURITIZ\w*|ASSISTENC\w*|SAUDE|PAPELARIA|COPIADORA|SORVETERIA|CHOPERIA|BAR|RESTAURANTE|LANCHONETE|MERCEARIA|PADARIA|SUPERMERCADO|MERCADO|EMPORIO|DEPOSITO|AMBEV|SPAL|SOLIDES|HNK|ALIMENT\w*|TRANSPORT\w*|LOGISTICA|MULTLOG|INFINITY|PONTUAL|TECNOLOGIA|SOLUCOES|CONSULTORIA|ENGENHARIA|FARMACIA|DROGARIA|POSTO|AUTO|MOTOS|PNEUS|GRAFICA|EDITORA|BANCO|PAGAMENTOS|INSTITUICAO)\b/;

/* ---------- leitura dos arquivos ---------- */
function decode(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { return new TextDecoder('windows-1252').decode(buf); }
}
function parseNum(s) {
  s = String(s || '').replace(/[R$\s ]/g, '').trim();
  if (!s) return NaN;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (/-$/.test(s)) { neg = true; s = s.slice(0, -1); }
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const v = parseFloat(s);
  return neg ? -Math.abs(v) : v;
}
function parseDate(s) {
  s = String(s || '').trim();
  let m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if (m) return `${m[3]}-${m[2]}-${m[1]}`;
  m = s.match(/^(\d{2})\/(\d{2})\/(\d{2})$/); if (m) return `20${m[3]}-${m[2]}-${m[1]}`;
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function splitLine(line, d) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) { if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === d) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out.map(x => x.trim());
}
const BANKS = { '001': 'Banco do Brasil', '033': 'Santander', '104': 'Caixa', '237': 'Bradesco', '341': 'Itaú', '260': 'Nubank', '077': 'Inter', '756': 'Sicoob', '748': 'Sicredi', '336': 'C6 Bank', '208': 'BTG', '290': 'PagBank', '323': 'Mercado Pago', '380': 'PicPay', '422': 'Safra', '655': 'Votorantim', '212': 'Original', '403': 'Cora', '197': 'Stone' };

function parseCSV(text, fname) {
  const lines = text.split(/\r?\n/);
  const d = (lines.slice(0, 10).join('\n').split(';').length >= lines.slice(0, 10).join('\n').split(',').length) ? ';' : ',';
  let ag = '', conta = '', bank = '', hi = -1, cols = null;
  for (let i = 0; i < Math.min(lines.length, 40); i++) {
    const f = splitLine(lines[i], d).map(norm);
    const ia = f.findIndex(x => x === 'AGENCIA'); const ic = f.findIndex(x => x === 'CONTA' || x === 'CONTA CORRENTE');
    if (ia >= 0 && f[ia + 1]) ag = f[ia + 1];
    if (ic >= 0 && f[ic + 1]) conta = f[ic + 1];
    if (f.some(x => x === 'DATA' || x.startsWith('DATA')) && f.some(x => x.includes('VALOR') || x.includes('CREDITO') || x.includes('DEBITO'))) {
      hi = i;
      const find = re => f.findIndex(x => re.test(x));
      cols = {
        data: find(/^DATA/), hist: find(/HISTORICO|DESCRICAO|LANCAMENTO|MOVIMENTACAO|DETALHE/),
        doc: find(/^DOC|DOCUMENTO|N[º°O]? ?DOC/), valor: find(/^VALOR/), cred: find(/CREDITO/), deb: find(/DEBITO/), saldo: find(/^SALDO/)
      };
      break;
    }
  }
  if (hi < 0 || !cols || cols.data < 0) throw new Error('não reconheci o cabeçalho (preciso das colunas Data e Valor)');
  if (/AGENCIA/.test(norm(lines[0])) && ag) bank = 'Santander';
  const rows = [];
  for (let i = hi + 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const f = splitLine(lines[i], d);
    const date = parseDate(f[cols.data]); if (!date) continue;
    const hist = (cols.hist >= 0 ? f[cols.hist] : '').replace(/\s+/g, ' ').trim();
    if (/^SALDO( ANTERIOR| DO DIA| FINAL| ATUAL|$)/.test(norm(hist))) continue;
    let valor;
    if (cols.valor >= 0) valor = parseNum(f[cols.valor]);
    else { const c = parseNum(f[cols.cred]), db = parseNum(f[cols.deb]); valor = (isNaN(c) ? 0 : Math.abs(c)) - (isNaN(db) ? 0 : Math.abs(db)); }
    if (isNaN(valor) || valor === 0) continue;
    const sv = cols.saldo >= 0 ? parseNum(f[cols.saldo]) : NaN;
    rows.push({ date, hist, doc: cols.doc >= 0 ? (f[cols.doc] || '').replace(/^0+$/, '') : '', valor: round2(valor), saldo: isNaN(sv) ? null : round2(sv) });
  }
  return { bank: bank || 'Banco', ag, conta, rows: toChrono(rows), src: 'csv', fname };
}
function toChrono(rows) {
  if (rows.length < 2) return rows;
  const a = rows[0].date, b = rows[rows.length - 1].date;
  if (a > b) return rows.slice().reverse();
  if (a < b) return rows;
  let desc = 0, asc = 0;
  for (let i = 0; i < rows.length - 1; i++) {
    const x = rows[i], y = rows[i + 1];
    if (x.saldo == null || y.saldo == null) continue;
    if (Math.abs(y.saldo + x.valor - x.saldo) < .005) desc++;
    if (Math.abs(x.saldo + y.valor - y.saldo) < .005) asc++;
  }
  return desc > asc ? rows.slice().reverse() : rows;
}
function parseOFX(text, fname) {
  const tag = (blk, t) => { const m = blk.match(new RegExp('<' + t + '>([^<\\r\\n]*)', 'i')); return m ? m[1].trim() : ''; };
  const bankId = tag(text, 'BANKID').replace(/^0+(?=\d{3})/, '').padStart(3, '0');
  const ag = tag(text, 'BRANCHID'), conta = tag(text, 'ACCTID');
  const blocks = text.split(/<STMTTRN>/i).slice(1).map(b => b.split(/<\/STMTTRN>/i)[0]);
  let rows = blocks.map((b, i) => {
    const dt = tag(b, 'DTPOSTED');
    const memo = tag(b, 'MEMO'), name = tag(b, 'NAME');
    let hist = memo;
    if (name && !norm(memo).includes(norm(name))) hist = (memo + ' ' + name).trim();
    return { date: `${dt.slice(0, 4)}-${dt.slice(4, 6)}-${dt.slice(6, 8)}`, hist: hist.replace(/\s+/g, ' '), doc: tag(b, 'CHECKNUM') || '', valor: round2(parseNum(tag(b, 'TRNAMT'))), saldo: null, fitid: tag(b, 'FITID'), i };
  }).filter(r => /^\d{4}-\d{2}-\d{2}$/.test(r.date) && !isNaN(r.valor) && r.valor !== 0);
  rows.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : x.i - y.i);
  const lb = text.split(/<LEDGERBAL>/i)[1];
  const bal = lb ? parseNum(tag(lb, 'BALAMT')) : NaN;
  if (!isNaN(bal)) { let s = bal; for (let i = rows.length - 1; i >= 0; i--) { rows[i].saldo = round2(s); s -= rows[i].valor; } }
  return { bank: BANKS[bankId] || ('Banco ' + bankId), ag, conta, rows, src: 'ofx', fname };
}
function parseAny(text, fname) {
  if (/<OFX>|OFXHEADER/i.test(text)) return parseOFX(text, fname);
  return parseCSV(text, fname);
}

/* ---------- importação e mesclagem ---------- */
function mergeParsed(res) {
  const acct = [res.bank, res.ag, res.conta].join('|') || ('Arquivo|' + res.fname);
  if (!S.accts[acct]) S.accts[acct] = { bank: res.bank, ag: res.ag, conta: res.conta };
  const byDate = {};
  res.rows.forEach(r => (byDate[r.date] = byDate[r.date] || []).push(r));
  let added = 0, kept = 0, days = 0;
  for (const date of Object.keys(byDate)) {
    const inc = byDate[date];
    const ex = S.txs.filter(t => t.acct === acct && t.date === date);
    if (ex.length > inc.length) { kept += inc.length; continue; }
    const exIds = new Set(ex.map(t => t.id));
    const dup = {};
    const neo = inc.map((r, i) => {
      const base = r.fitid ? 'F|' + acct + '|' + r.fitid : [acct, date, norm(r.hist), r.doc, r.valor, r.saldo].join('|');
      dup[base] = (dup[base] || 0) + 1;
      const id = hash(base + '#' + dup[base]) + hash(base).slice(0, 3);
      return { id, acct, date, ord: i, hist: r.hist, doc: r.doc, valor: r.valor, saldo: r.saldo };
    });
    neo.forEach(t => { if (!exIds.has(t.id)) added++; });
    if (ex.length) S.txs = S.txs.filter(t => !(t.acct === acct && t.date === date));
    S.txs.push(...neo); days++;
  }
  S.imports.unshift({ at: new Date().toISOString(), file: res.fname, acct, n: res.rows.length, added, from: res.rows[0] && res.rows[0].date, to: res.rows.length ? res.rows[res.rows.length - 1].date : '' });
  S.imports = S.imports.slice(0, 60);
  return { added, kept, days, acct };
}
async function importFiles(files) {
  const msgs = []; let added = 0, n = 0;
  for (const f of files) {
    try {
      const text = decode(await f.arrayBuffer());
      const res = parseAny(text, f.name);
      if (!res.rows.length) { msgs.push(f.name + ': nenhum lançamento encontrado'); continue; }
      const r = mergeParsed(res); added += r.added; n += res.rows.length;
    } catch (e) { msgs.push(f.name + ': ' + e.message); }
  }
  save('txs', 'accts', 'imports');
  if (n) {
    const ds = S.txs.map(t => t.date).sort();
    S.ui.period = 'all';
    toast(`${n} lançamentos lidos · ${added} novos · período ${dShort(ds[0])} a ${dShort(ds[ds.length - 1])}` + (msgs.length ? ' · ' + msgs.join('; ') : ''));
  } else if (msgs.length) toast('Não consegui ler: ' + msgs.join('; '));
  render();
}

/* ---------- inteligência: leitura do histórico e classificação ---------- */
function parseHist(H, v) {
  let m;
  if (/TARIFA|RENDIMENTO|\bIOF\b|JUROS|CESTA DE SERV|ANUIDADE|ENCARGO/.test(H)) return ['outro', ''];
  if ((m = H.match(/^PIX RECEBIDO\s*(.*)$/))) return ['pix_in', m[1]];
  if ((m = H.match(/^PIX (?:ENVIADO|EMITIDO|TRANSFERENCIA ENVIADA|TRANSF\w* ENVIADA)\s*(.*)$/))) return ['pix_out', m[1]];
  if ((m = H.match(/^PIX DEVOLVIDO\s*(.*)$/))) return [v < 0 ? 'pix_dev' : 'pix_dev_in', m[1]];
  if ((m = H.match(/^PAGAMENTO DE BOLETO(?: OUTROS BANCOS)?\s*(.*)$/))) return ['boleto', m[1]];
  if ((m = H.match(/^PAGAMENTO (?:DE )?TITULO\s*(.*)$/))) return ['boleto', m[1]];

const tipEl = () => $('#tip');
function mk(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function tipShow(ev, build) { const t = tipEl(); t.replaceChildren(); build(t); t.classList.add('on'); tipMove(ev); }
function tipMove(ev) { const t = tipEl(); const r = t.getBoundingClientRect(); let x = ev.clientX + 14, y = ev.clientY + 14; if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14; if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14; t.style.left = Math.max(4, x) + 'px'; t.style.top = Math.max(4, y) + 'px'; }

function tipRow(t, color, label, value) { const r = mk('div', 'row'); const i = mk('i'); i.style.background = color; r.append(i, mk('span', 'tl', label), mk('b', 'num', value)); t.append(r); }
function niceTicks(min, max, count = 4) {
  if (min === max) { max = min + 1; }
  const span = max - min, step0 = span / count, mag = Math.pow(10, Math.floor(Math.log10(step0))), err = step0 / mag;
  const step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 2; v += step) t.push(Math.round(v * 100) / 100);

}
const axK = v => v === 0 ? '0' : (Math.abs(v) >= 1000 ? NUM1.format(v / 1000) + ' mil' : NUM1.format(v));
function barPath(x, y, w, h, r = 4) { if (h <= 0.5) return ''; r = Math.min(r, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }

function drawSaldo(el, list, open) {
  if (!list.length) { el.innerHTML = '<div class="muted">Sem lançamentos.</div>'; return; }
  const W = Math.max(320, el.clientWidth), H = W < 600 ? 240 : 330, m = { l: 62, r: 18, t: 22, b: 30 };
  const pts = [{ v: open, t: null }]; let s = open;
  for (const t of list) { s = round2(s + t.valor); pts.push({ v: s, t }); }
  const vals = pts.map(p => p.v); const ticks = niceTicks(Math.min(...vals), Math.max(...vals), 4);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = i => m.l + (W - m.l - m.r) * (pts.length === 1 ? 0.5 : i / (pts.length - 1));
  const Y = v => m.t + (H - m.t - m.b) * (1 - (v - y0) / (y1 - y0 || 1));

  // separadores de dia
  const bounds = []; let cur = null;

  bounds.forEach((b, k) => {
    const xa = X(b.i - 0.5 < 0 ? 0 : b.i - 0.5), xb = k + 1 < bounds.length ? X(bounds[k + 1].i - 0.5) : X(pts.length - 1);
    if (k > 0) g += `<line class="gl" x1="${xa}" x2="${xa}" y1="${m.t}" y2="${H - m.b}"/>`;
    if (xb - xa > 34) g += `<text class="axis" x="${(xa + xb) / 2}" y="${H - m.b + 18}" text-anchor="middle">${dShort(b.d)}</text>`;
  });
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(p.v).toFixed(1)).join('');
  const area = line + `L${X(pts.length - 1)},${H - m.b}L${X(0)},${H - m.b}Z`;
  let iMin = 0, iMax = 0; pts.forEach((p, i) => { if (p.v < pts[iMin].v) iMin = i; if (p.v > pts[iMax].v) iMax = i; });

function drawDaily(el, list) {

  const W = Math.max(300, el.clientWidth), H = 240, m = { l: 54, r: 10, t: 14, b: 30 };
  const max = Math.max(...days.map(d => Math.max(A.days[d].ent, A.days[d].sai)));
  const ticks = niceTicks(0, max, 4), top = ticks[ticks.length - 1];

  const Y = v => m.t + (H - m.t - m.b) * (1 - v / top);

  let g = ''; ticks.forEach(v => { g += `<line class="gl" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${axK(v)}</text>`; });
  let bars = '';

    bars += `<rect class="hit" data-d="${d}" x="${m.l + band * i}" y="${m.t}" width="${band}" height="${H - m.t - m.b}" fill="transparent"/>`;
  });
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas por dia"><g>${g}</g><line x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line-2)"/>${bars}</svg>`;
  el.querySelectorAll('rect.hit').forEach(r => {
    const d = r.dataset.d, D = A.days[d];

  });
}

function drawSankey(el, list) {
  const A = agg(list);
  const W = Math.max(760, el.clientWidth);
  const L = catsOf('in').map(c => ({ id: c.id, label: c.short, v: (A.byCat[c.id] || {}).v || 0, n: (A.byCat[c.id] || {}).n || 0, kind: 'in' })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  const R = catsOf('out').map(c => ({ id: c.id, label: c.short, v: (A.byCat[c.id] || {}).v || 0, n: (A.byCat[c.id] || {}).n || 0, kind: 'out' })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  if (!L.length && !R.length) { el.innerHTML = '<div class="muted">Sem lançamentos.</div>'; return; }
  const ent = A.ent, sai = A.sai;
  if (sai > ent) L.push({ id: '_bal', label: 'Uso do saldo', v: round2(sai - ent), kind: 'bal' });
  else if (ent > sai) R.push({ id: '_bal', label: 'Sobra no caixa', v: round2(ent - sai), kind: 'bal' });
  const total = Math.max(ent, sai), gap = 8, minH = 18, nodeW = 12, padT = 26;
  const H = Math.max(320, Math.max(L.length, R.length) * 30 + padT + 12);
  const avail = H - padT - 12;
  function fitK(nodes) {
    let k = (avail - gap * (nodes.length - 1)) / total;
    for (let i = 0; i < 25; i++) {
      const small = nodes.filter(n => n.v * k < minH), big = nodes.filter(n => n.v * k >= minH);
      const bigSum = big.reduce((s, n) => s + n.v, 0); if (!bigSum) break;
      const nk = (avail - gap * (nodes.length - 1) - small.length * minH) / bigSum;
      if (nk >= k - 1e-9) break; k = nk;
    }
    return k;
  }
  const k = Math.min(fitK(L), fitK(R), avail / total);
  const labelW = W < 900 ? 215 : 240;
  const xL = labelW, xR = W - labelW - nodeW, xC = W / 2 - nodeW / 2;
  function place(nodes) {
    const used = nodes.reduce((s, n) => s + Math.max(n.v * k, minH), 0) + gap * (nodes.length - 1);
    let y = padT + (avail - used) / 2;
    nodes.forEach(n => { n.slot = Math.max(n.v * k, minH); n.h = Math.max(2, n.v * k); n.y = y + (n.slot - n.h) / 2; n.ly = y + n.slot / 2; y += n.slot + gap; });
  }
  place(L); place(R);
  const cH = total * k, cY = padT + (avail - cH) / 2;
  const colr = n => n.kind === 'in' ? 'var(--in)' : n.kind === 'out' ? 'var(--out)' : 'var(--saldo)';
  const band = (x0, y0, x1, y1, h) => { const xm = (x0 + x1) / 2; return `M${x0},${y0}C${xm},${y0} ${xm},${y1} ${x1},${y1}L${x1},${y1 + h}C${xm},${y1 + h} ${xm},${y0 + h} ${x0},${y0 + h}Z`; };
  let links = '', nodes = '', labels = '';
  let off = 0;
  L.forEach((n, i) => { const h = n.v * k; links += `<path class="hit lk" data-side="L" data-i="${i}" d="${band(xL + nodeW, n.y + (n.h - h) / 2, xC, cY + off, h)}" fill="${colr(n)}" opacity=".30"/>`; off += h; });
  off = 0;
  R.forEach((n, i) => { const h = n.v * k; links += `<path class="hit lk" data-side="R" data-i="${i}" d="${band(xC + nodeW, cY + off, xR, n.y + (n.h - h) / 2, h)}" fill="${colr(n)}" opacity=".30"/>`; off += h; });
  const lbl = (n, x, anchor, tot) => `<text x="${x}" y="${n.ly + 4}" text-anchor="${anchor}" style="font-size:12.5px;fill:var(--text-2)"><tspan style="fill:var(--text);font-weight:700">${esc(n.label)}</tspan>  ${fmtK(n.v)} · ${fmtP(pct(n.v, tot))}</text>`;
  L.forEach(n => { nodes += `<rect x="${xL}" y="${n.y}" width="${nodeW}" height="${n.h}" rx="3" fill="${colr(n)}"/>`; labels += lbl(n, xL - 10, 'end', total); });
  R.forEach(n => { nodes += `<rect x="${xR}" y="${n.y}" width="${nodeW}" height="${n.h}" rx="3" fill="${colr(n)}"/>`; labels += lbl(n, xR + nodeW + 10, 'start', total); });
  nodes += `<rect x="${xC}" y="${cY}" width="${nodeW}" height="${cH}" rx="3" fill="var(--accent)"/>`;
  labels += `<text x="${xC + nodeW / 2}" y="${cY - 10}" text-anchor="middle" style="font-size:12.5px;fill:var(--text);font-weight:800">Conta · ${fmtK(total)}</text>`;
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fluxo: entradas por origem à esquerda e saídas por destino à direita">${links}${nodes}${labels}</svg>`;
  el.querySelectorAll('path.lk').forEach(p => {
    const n = (p.dataset.side === 'L' ? L : R)[+p.dataset.i];
    p.addEventListener('pointermove', ev => { p.setAttribute('opacity', '.55'); tipShow(ev, tp => { tp.append(mk('div', 'tv num', fmt(n.v)), mk('div', 'hd', n.kind === 'bal' ? n.label : (p.dataset.side === 'L' ? `${CAT[n.id].label} → conta` : `Conta → ${CAT[n.id].label}`))); tp.append(mk('div', 'tl', n.kind === 'bal' ? (n.id === '_bal' && p.dataset.side === 'L' ? 'Saídas acima das entradas foram cobertas pelo saldo que já existia' : 'Entradas que ficaram na conta') : `${n.n} lançamentos · ${fmtP(pct(n.v, p.dataset.side === 'L' ? ent : sai))} das ${p.dataset.side === 'L' ? 'entradas' : 'saídas'}`)); }); });
    p.addEventListener('pointerleave', () => { p.setAttribute('opacity', '.30'); tipHide(); });
    if (n.kind !== 'bal') p.addEventListener('click', () => { tipHide(); filterCat(n.id); });
  });
}

function filtered(list) {
  const u = S.ui, q = norm(u.q), qd = u.q.replace(/\D/g, '');
  const ids = u.ids ? new Set(u.ids.ids) : null;
  return list.filter(t => {
    if (ids && !ids.has(t.id)) return false;
    if (u.dir !== 'all' && t.dir !== u.dir) return false;
    if (u.cat !== 'all' && t.cat !== u.cat) return false;
    if (u.status === 'pend' && t.done) return false;
    if (u.status === 'done' && !t.done) return false;
    if (u.status === 'att' && !attention(t)) return false;
    if (u.status === 'flag' && !t.flags.length) return false;
    if (q) {
      const hay = t.H + ' ' + norm(t.pname) + ' ' + norm(CAT[t.cat].label) + ' ' + norm(t.m.nota || '') + ' ' + norm(t.m.motivo || '');
      const vq = u.q.replace(/[R$\s]/g, '');
      const valMatch = /^[\d.,]+$/.test(vq) && (fmt(Math.abs(t.valor)).includes(vq) || String(Math.abs(t.valor)).includes(vq.replace(',', '.')));
      const docMatch = qd.length >= 4 && t.p && t.p.doc && t.p.doc.includes(qd);
      if (!hay.includes(q) && !valMatch && !docMatch) return false;
    }
    return true;
  });
}

/* ---------- conciliação com o Gestão de Caixas ---------- */
// cruza os lançamentos do extrato bancário (já importado e classificado) com os
// pagamentos e estornos do nosso caixa, por valor + proximidade de data. Não é
// um match perfeito por ID (o extrato do banco não carrega o número do pedido),
// então é uma AJUDA pra achar rápido o que bate e o que sobra, não um veredito.
function matchCaixa(list) {
  const janelaDias = 5; // cartão pode compensar alguns dias depois da venda
  const pagamentos = (CX.pagamentos || []).map((p, i) => Object.assign({ _ix: i, _usado: false }, p));
  const estornos = (CX.estornos || []).map((e, i) => Object.assign({ _ix: i, _usado: false }, e));
  const diffDias = (a, b) => Math.abs((new Date(a + 'T12:00:00') - new Date(b + 'T12:00:00')) / 86400000);
  const bancoIn = list.filter(t => t.valor > 0.004);
  const bancoOut = list.filter(t => t.valor < -0.004);
  const matches = [];
  function acharMelhor(candidatos, valorAlvo, dataAlvo) {
    let melhor = null, melhorDif = Infinity;
    for (const c of candidatos) {
      if (c._usado) continue;
      if (Math.abs(c.valor - valorAlvo) > 0.02) continue;
      const dd = diffDias(c.data, dataAlvo);
      if (dd > janelaDias) continue;
      if (dd < melhorDif) { melhorDif = dd; melhor = c; }
    }
    return melhor;
  }
  bancoIn.forEach(t => {
    const m = acharMelhor(pagamentos, t.valor, t.date);
    if (m) { m._usado = true; matches.push({ t, caixa: m, tipo: 'pagamento' }); }
  });
  bancoOut.forEach(t => {
    const m = acharMelhor(estornos, Math.abs(t.valor), t.date);
    if (m) { m._usado = true; matches.push({ t, caixa: m, tipo: 'estorno' }); }
  });
  const bancoSemMatch = list.filter(t => !matches.some(m => m.t.id === t.id));
  const pagamentosSemMatch = pagamentos.filter(p => !p._usado);
  const estornosSemMatch = estornos.filter(e => !e._usado);
  return { matches, bancoSemMatch, pagamentosSemMatch, estornosSemMatch };
}
async function buscarCaixa() {
  const r = periodRange();
  if (!r.from || !r.to) { toast('Importe um extrato primeiro.'); return; }
  CX.loading = true; CX.erro = null; renderView();
  try {
    const j = await fetch(`/api/caixa/conciliacao?dataInicial=${r.from}&dataFinal=${r.to}`).then(x => x.json());
    if (j.erro) throw new Error(j.erro);
    CX = { loading: false, from: r.from, to: r.to, pagamentos: j.pagamentos || [], estornos: j.estornos || [], erro: null };
    toast(`${(j.pagamentos || []).length} pagamento(s) e ${(j.estornos || []).length} estorno(s) do caixa carregados`);
  } catch (e) {
    CX.loading = false; CX.erro = 'Não consegui buscar do nosso sistema: ' + e.message;
  }
  renderView();
}
function conciliacaoHTML(list) {
  if (!CX.pagamentos) {
    return `<div class="card" style="padding:40px 20px;text-align:center">

function download(name, content, type) {
  const b = new Blob([content], { type }); const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportCSV() {
  const L = filtered(scope());
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const n = v => v == null ? '' : v.toFixed(2).replace('.', ',');
  const head = ['Data', 'Conta', 'Tipo', 'Histórico do banco', 'Pagador/Favorecido', 'CPF/CNPJ', 'Pessoa', 'Papel', 'Categoria', 'Direção', 'Valor', 'Saldo', 'Conferido', 'Origem da categoria', 'Motivo do estorno', 'Autorizado por', 'Anotação', 'Alertas'];
  const rows = L.map(t => [dBR(t.date), acctLabel(t.acct), KIND[t.kind], t.hist, t.p ? partyLabel(t.p) : '', t.p && t.p.doc ? fmtDoc(t.p.doc, false) : '', t.p ? t.p.pessoa : '', PAPEIS[t.papel] || '', CAT[t.cat].label, t.dir === 'in' ? 'Entrada' : 'Saída', n(t.valor), n(t.saldo), t.done ? 'Sim' : 'Não', t.src === 'auto' ? (t.conf === 'sugerida' ? 'Sugestão' : 'Automática') : 'Definida pela equipe', t.m.motivo || '', t.m.autor || '', t.m.nota || '', t.flags.map(f => f.t).join(' | ')].map(q).join(';'));
  const r = periodRange();
  download(`b13-fluxo-caixa_${r.from}_a_${r.to}.csv`, '﻿' + [head.map(q).join(';'), ...rows].join('\r\n'), 'text/csv;charset=utf-8');
  toast(`${L.length} lançamentos exportados (abre direto no Excel)`);
}
function backup() {
  const data = { app: 'b13-fluxo-caixa', v: 1, exportedAt: new Date().toISOString(), txs: S.txs, accts: S.accts, meta: S.meta, parties: S.parties, rules: S.rules, imports: S.imports, cfg: S.cfg };
  download(`b13-fluxo-caixa-backup_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data), 'application/json');
}
async function restore(file) {
  try {
    const d = JSON.parse(decode(await file.arrayBuffer()));
    if (d.app !== 'b13-fluxo-caixa' || !Array.isArray(d.txs)) throw new Error('arquivo não é um backup desta ferramenta');
    openConfirm('Restaurar backup?', `O backup de ${new Date(d.exportedAt).toLocaleString('pt-BR')} tem ${d.txs.length} lançamentos. Ele substitui todos os dados atuais deste navegador.`, 'Restaurar', () => {
      ['txs', 'accts', 'meta', 'parties', 'rules', 'imports'].forEach(k => { S[k] = d[k] || (k === 'txs' || k === 'rules' || k === 'imports' ? [] : {}); });
      S.cfg = Object.assign({ estornoMax: 500, socioMin: 5000, microMax: 2 }, d.cfg || {});
      save('txs', 'accts', 'meta', 'parties', 'rules', 'imports', 'cfg'); toast('Backup restaurado'); render();
    });
  } catch (e) { toast('Não foi possível restaurar: ' + e.message); }
}
async function importCadastro(file) {
  const text = decode(await file.arrayBuffer());
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const d = (lines[0] || '').includes(';') ? ';' : ',';
  const pm = { CLIENTE: 'cliente', FORNECEDOR: 'fornecedor', SOCIO: 'socio', FUNCIONARIO: 'funcionario', FREELA: 'funcionario', MOTORISTA: 'funcionario', OUTRO: 'outro' };
  let n = 0;
  for (const l of lines) {
    const f = splitLine(l, d); if (f.length < 2) continue;
    const doc = (f[0] || '').replace(/\D/g, ''), nome = (f[1] || '').trim(); if (!nome) continue;
    let key = null;
    if (doc.length === 11 || doc.length === 14) key = 'doc:' + doc; else if (f[0] && !/\d/.test(f[0])) key = 'nome:' + norm(f[0]);
    if (!key) continue;
    const papel = pm[norm(f[2] || '').split(' ')[0]] || (S.parties[key] || {}).papel || '';
    S.parties[key] = Object.assign({}, S.parties[key] || {}, { nome, papel }); n++;
  }
  save('parties'); toast(n ? `${n} cadastros importados` : 'Nenhuma linha válida (use documento;nome;papel)'); renderView();
}
function wipe() {
  ['txs', 'accts', 'meta', 'parties', 'rules', 'imports', 'cfg'].forEach(k => LS.del(k));
  S.txs = []; S.accts = {}; S.meta = {}; S.parties = {}; S.rules = []; S.imports = []; S.cfg = { estornoMax: 500, socioMin: 5000, microMax: 2 };
  S.ui.tab = 'overview'; dirty = true; render(); toast('Dados apagados deste navegador');
}

function filterCat(cat) { Object.assign(S.ui, { tab: 'extrato', cat, dir: 'all', status: 'all', ids: null, q: '', limit: 250 }); render(); window.scrollTo(0, 0); }

const refreshTable = () => { const z = $('#tblzone'); if (z) z.innerHTML = tableHTML(scope()); };

document.addEventListener('keydown', ev => {

    else if (ev.key === 'Enter' && ev.target.tagName !== 'BUTTON') { ev.preventDefault(); if (S.ui.seq) { toggleDone(d.id, true); seqStep(1); } else { toggleDone(d.id); drawDrawer(); } }
    else if (ev.key === 'ArrowRight' && S.ui.seq) { ev.preventDefault(); seqStep(1); }
    else if (ev.key === 'ArrowLeft' && S.ui.seq) { ev.preventDefault(); seqStep(-1); }
    return;
  }
  if (ev.key === 'Enter' && !inField && ev.target.matches('tr[data-act]')) ev.target.click();
});
// arrastar e soltar em qualquer lugar da página
let dragN = 0;
window.addEventListener('dragenter', e => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) { dragN++; $('#dragcover').classList.add('on'); } });
window.addEventListener('dragleave', () => { dragN = Math.max(0, dragN - 1); if (!dragN) $('#dragcover').classList.remove('on'); });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('#dragcover').classList.remove('on'); const f = Array.from(e.dataTransfer.files || []); if (f.length) importFiles(f); });
window.addEventListener('resize', debounce(() => { if (S.txs.length && S.ui.tab === 'overview') afterView(scope()); }, 150));
window.addEventListener('scroll', tipHide, { passive: true });

render();

</script>
</body>
