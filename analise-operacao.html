<script>
const B = location.protocol.indexOf("http") === 0 ? "" : "https://app.b13bebidas.com.br";
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function token() { try { return (b13GetSession() || {}).token || ""; } catch (e) { return ""; } }
async function api(p) { try { const r = await fetch(B + p, { headers: { "X-Auth-Token": token() } }); const j = await r.json().catch(() => ({})); return r.ok ? j : { erro: j.erro || ("erro " + r.status) }; } catch (e) { return { erro: e.message }; } }
const ok = x => x && !x.erro;
const brl = n => n == null || isNaN(n) ? "—" : "R$ " + Number(n).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = (n, d) => n == null || isNaN(n) ? "—" : Number(n).toLocaleString("pt-BR", { maximumFractionDigits: d == null ? 1 : d });
const min = n => n == null ? "—" : (n >= 90 ? Math.floor(n / 60) + " h " + String(Math.round(n % 60)).padStart(2, "0") + " min" : num(n, 1) + " min");
const NOMEMES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"], DSEM = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
const rotMes = m => NOMEMES[+m.slice(5) - 1] + " de " + m.slice(0, 4);
const hojeBR = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);
function antes(m) { let [y, mo] = m.split("-").map(Number); mo--; if (mo === 0) { mo = 12; y--; } return y + "-" + String(mo).padStart(2, "0"); }
function periodo(m) { const [y, mo] = m.split("-").map(Number), u = new Date(Date.UTC(y, mo, 0)).getUTCDate(); return { ini: m + "-01", fim: m + "-" + String(u).padStart(2, "0") }; }
document.getElementById("mes").value = antes(hojeBR().slice(0, 7));
// ---------- fontes pesquisadas (boas práticas)
const FONTES = {
  picking: { t: "Indicadores de separação: linhas por hora refletem melhor a complexidade que pedidos por hora", u: "https://www.shippingbo.com/en/supply-chain-en/order-picker-kpis-indicators-to-track-to-improve-productivity-and-quality/" },
  pickingMetodo: { t: "Eficiência de separação: acurácia, tempo de deslocamento e método", u: "https://www.cleverence.com/articles/3pl-business/how-to-improve-order-picking-efficiency-4829/" },
  otif: { t: "Entrega no prazo e completa (OTIF) em bebidas", u: "https://blog.opendock.com/beverage-fulfillment" },
  otif2: { t: "Boas práticas para melhorar o OTIF", u: "https://www.loginextsolutions.com/blog/?p=12176" },
  vazamento: { t: "Vazamento de margem e disciplina de preço na distribuição", u: "https://www.phcppros.com/articles/24151-margin-maximization" },
  segmento: { t: "Segmentação de clientes por lucro, não só por volume", u: "https://distributionstrategy.com/report/closing-the-execution-gap/" },
  churn: { t: "Sinais de que um cliente atacadista está esfriando", u: "https://www.repspark.com/blog/using-data-to-prevent-b2b-buyer-churn" },
  churn2: { t: "Cliente em risco: dias sem comprar acima do intervalo próprio", u: "https://docs.vortexiq.ai/nerve-centre/kpi-cards/shopify/customer-churn-risk" },
  lento: { t: "Estoque lento: segmentar por ABC e XYZ e agir cedo", u: "https://www.cleverence.com/amp/articles/for-business/slow-moving-inventory-4827/" },
  combo: { t: "Estoque parado: combos com produtos de alto giro e ofertas por tempo limitado", u: "https://www.fulfyld.com/blog/how-to-minimize-slow-and-obsolete-moving-slob-inventory/" },
  promo: { t: "Promoções guiadas pelo estoque e acompanhadas pelo giro, não só pela receita", u: "https://www.revlifter.com/blog/how-promotions-can-boost-your-inventory-turnover-ratio" },
  cesta: { t: "Análise de cesta de compra: suporte, confiança e lift", u: "https://knowledgebase.firsthive.com/knowledge-base/analytics/basket-analysis" },
  pedidoPequeno: { t: "O problema são as linhas de baixo valor: picks que custam mais que o lucro", u: "https://www.asa.net/News/News/its-not-a-small-order-problem-the-silent-crisis-killing-distributor-profits" },
  moq: { t: "Quantidade mínima por item para controlar o custo de atender", u: "https://distributionstrategy.com/2020/10/how-minimum-order-quantity-moq-can-solve-small-order-problems/" },
  escala: { t: "Escala por perfil horário: montar a equipe para os 90 minutos mais cheios", u: "https://cleverence.com/articles/3pl-business/minimum-wage-increases-labor-cost-management-strategies-4827" },
  picos: { t: "Suavizar picos com promoções programadas e incentivo para pedir fora do pico", u: "https://racklify.com/encyclopedia/throughput-limit-crisis-when-your-operations-cant-keep-up/" },
  fill: { t: "Taxa de atendimento por linha, faltas na separação e estoque de segurança", u: "https://umbrex.com/resources/company-analysis/operations/fill-rate/" },
  pix: { t: "Custos para receber: Pix, débito e crédito (crédito cai em cerca de 30 dias)", u: "https://blog.cielo.com.br/produtos-e-servicos/custos-para-receber-pix/" },
  pixDesc: { t: "Desconto no Pix precisa caber na margem e na diferença de custo para o cartão", u: "https://www.cora.com.br/blog/desconto-no-pix/" }
};
let D = null;
async function gerar() {
  const m = document.getElementById("mes").value; if (!/^\d{4}-\d{2}$/.test(m)) { alert("Escolha o mês."); return; }
  const P = periodo(m); document.getElementById("corpo").innerHTML = `<div class="card"><span class="spin"></span> Analisando ${rotMes(m)}… pode levar alguns segundos.</div>`;
  const [op, rt, mg, ac, ab] = await Promise.all([api("/api/analise-operacao?mes=" + m), api("/api/rotas/dashboard-mensal?mes=" + m), api(`/api/margem-bruta?ini=${P.ini}&fim=${P.fim}&agrupar=mes`), api(`/api/estoque-acompanhamento?ini=${P.ini}&fim=${P.fim}&limite=1`), api(`/api/vendas-abaixo-custo?ini=${P.ini}&fim=${P.fim}&status=todos`)]);
  D = { m, P, op, rt, mg, ac, ab }; D.rec = recomendar(D); D.promo = promocoes(D); render();
}
// ---------- motor de recomendações
function recomendar(D) {
  const R = [], add = (prio, area, titulo, evid, acao, fontes) => R.push({ prio, area, titulo, evid, acao, fontes: fontes || [] }); const op = ok(D.op) ? D.op : null; if (!op) return R;
  const sp = op.separacao || {}, cf = op.conferencia || {}, hz = op.horarios || {}, pr = op.precos || {}, pd = op.produtos || {}, cl = op.clientes || {}, pg = op.pagamentos || {}, pe = op.pedidos || {}, fa = op.faltas || {};
  const func = (sp.porFuncionario || []).filter(f => f.pedidosComTempo >= 4 && f.indiceVsMedia != null);
  if (func.length >= 2) { const lento = [...func].sort((a, b) => b.indiceVsMedia - a.indiceVsMedia)[0], rapido = [...func].sort((a, b) => a.indiceVsMedia - b.indiceVsMedia)[0];
    if (lento.indiceVsMedia >= 1.25 && rapido.indiceVsMedia <= 0.85) add(3, "Separação", `Ritmo de separação muito desigual entre ${esc(rapido.funcionario)} e ${esc(lento.funcionario)}`, `${esc(rapido.funcionario)} gasta <b>${num(rapido.minutosPorLinha)} min por linha</b> e ${esc(lento.funcionario)} gasta <b>${num(lento.minutosPorLinha)} min por linha</b> (média da equipe ${num(sp.minutosPorLinha)}). Em linhas por hora são ${num(rapido.linhasPorHora)} contra ${num(lento.linhasPorHora)}.`, `Acompanhar uma separação de cada um para achar a causa (rota pelo depósito, produtos pesados no fundo, falta de carrinho, interrupções). Replicar o método de ${esc(rapido.funcionario)} e pareá-lo com ${esc(lento.funcionario)} por alguns dias. Comparar sempre por linhas por hora, não por pedidos, porque o tamanho do pedido muda o tempo.`, ["picking", "pickingMetodo"]); }
  const totPed = (sp.porFuncionario || []).reduce((a, f) => a + f.pedidos, 0), topF = (sp.porFuncionario || [])[0];
  if (topF && totPed >= 12 && topF.pedidos / totPed > 0.5 && (sp.porFuncionario || []).length >= 2) add(2, "Separação", `${esc(topF.funcionario)} separou ${num(topF.pedidos / totPed * 100, 0)}% dos pedidos do mês`, `Foram ${topF.pedidos} de ${totPed} pedidos. Carga concentrada em uma pessoa cria gargalo quando ela falta e esconde o ritmo real da equipe.`, `Distribuir os pedidos por fila (quem estiver livre pega o próximo) e treinar uma segunda pessoa para os clientes e produtos que só ela atende.`, ["escala"]);
  if (sp.minutosP90 && sp.minutosMediana && sp.minutosP90 > 2.2 * sp.minutosMediana && sp.comTempo >= 10) add(2, "Separação", "Alguns pedidos demoram muito mais que o normal", `Metade dos pedidos é separada em até <b>${min(sp.minutosMediana)}</b>, mas 1 em cada 10 leva <b>${min(sp.minutosP90)}</b> ou mais.`, `Listar os pedidos mais lentos do mês e ver o que têm em comum (muitas linhas, itens faltando, cliente específico, horário de pico). Pedidos grandes podem ser divididos entre duas pessoas.`, ["picking"]);
  if (sp.pctComFalta != null && sp.pctComFalta >= 8 && sp.total >= 10) add(3, "Estoque e separação", `${num(sp.pctComFalta, 0)}% dos pedidos saem da separação com item faltando`, `Em ${sp.total} separações, ${num(sp.pctComFalta * sp.total / 100, 0)} tiveram falta.${(fa.topProdutos || []).length ? " Mais citados: " + fa.topProdutos.slice(0, 4).map(x => `${esc(x.nome)} (${x.ocorrencias}x)`).join(", ") + "." : ""}`, `Os itens que mais faltam e giram rápido merecem estoque de segurança e ponto de pedido. Falta recorrente também mostra saldo errado no cadastro: contar esses itens fisicamente. Meta de referência: faltas em menos de 4% das linhas.`, ["fill"]);
  if (sp.filaMediana != null && sp.filaMediana > 20 && sp.comTempo >= 8) add(2, "Fila de separação", `O pedido espera ${min(sp.filaMediana)} (mediana) até alguém começar a separar`, `Em 1 de cada 10 pedidos a espera passa de ${min(sp.filaP90)}. O cliente sente isso no horário de entrega.`, `Escalar mais gente de separação na janela de pico e definir horário de corte para entrega no mesmo dia.`, ["escala", "otif"]);
  if (cf.esperaMediana != null && cf.esperaMediana > 20 && cf.comTempo >= 8) add(3, "Conferência", `O pedido separado espera ${min(cf.esperaMediana)} (mediana) para ser conferido`, `Em 1 de cada 10 a espera passa de ${min(cf.esperaP90)}. O tempo de conferir é curto (${min(cf.minutosMediana)}), então o problema é fila, não ritmo. O pedido leva ${min(cf.cicloMedianaMin)} do início até ficar conferido (1 em cada 10 passa de ${min(cf.cicloP90Min)}).`, `Quem separa deveria conferir o pedido do colega assim que terminar o seu, em vez de começar outro. Definir uma pessoa de conferência fixa nas horas de pico.`, ["escala", "picking"]);
  if (hz.janelaPico90min && hz.pedidosComHora >= 20 && hz.janelaPico90min.pctDoDia >= 30) add(2, "Horários", `${num(hz.janelaPico90min.pctDoDia, 0)}% dos pedidos chegam entre ${hz.janelaPico90min.inicio} e ${hz.janelaPico90min.fim}`, `São ${hz.janelaPico90min.pedidosNaJanela} de ${hz.pedidosComHora} pedidos com horário registrado em apenas 90 minutos.`, `Montar a escala em torno dessa janela (entrada escalonada, almoço em revezamento) e oferecer vantagem para pedidos feitos fora dela, como confirmar o pedido até certa hora para entrega no dia.`, ["escala", "picos"]);
  const dias = (hz.porDiaDaSemana || []).filter(d => d.diasComVenda >= 2); if (dias.length >= 4) { const melhor = [...dias].sort((a, b) => b.valorMedioPorDia - a.valorMedioPorDia)[0], pior = [...dias].sort((a, b) => a.valorMedioPorDia - b.valorMedioPorDia)[0]; if (pior.valorMedioPorDia < 0.6 * melhor.valorMedioPorDia) add(2, "Dias da semana", `${DSEM[pior.dia]} vende ${num(pior.valorMedioPorDia / melhor.valorMedioPorDia * 100, 0)}% do que vende ${DSEM[melhor.dia]}`, `Média por dia: ${brl(pior.valorMedioPorDia)} (${DSEM[pior.dia]}) contra ${brl(melhor.valorMedioPorDia)} (${DSEM[melhor.dia]}).`, `Usar ${DSEM[pior.dia]} para promoção programada com os produtos de estoque lento (veja o plano de promoções) e para visitas de reativação. Isso também alivia o dia de pico da equipe.`, ["picos", "promo"]); }
  if (pr.linhasAvaliadas >= 20 && (pr.pctAbaixo >= 8 || pr.valorDeixadoNaMesa > 0.01 * (pe.total || 1))) add(3, "Preço", `${num(pr.pctAbaixo, 0)}% das linhas foram vendidas abaixo da tabela`, `Em ${pr.linhasAvaliadas} linhas comparáveis, ${pr.linhasAbaixoDaTabela} saíram abaixo da tabela, somando <b>${brl(pr.valorDeixadoNaMesa)}</b> a menos no mês (${num(pr.valorDeixadoNaMesa / (pe.total || 1) * 100)}% do faturamento).${(pr.porVendedor || [])[0] ? " Maior valor deixado por " + esc(pr.porVendedor[0].vendedor) + " (" + brl(pr.porVendedor[0].deixou) + ")." : ""}${(pr.porCliente || [])[0] ? " Cliente com maior desconto acumulado: " + esc(pr.porCliente[0].cliente) + " (" + brl(pr.porCliente[0].deixou) + ")." : ""}`, `Definir quem pode dar desconto e até quanto, e exigir justificativa acima do limite. Rever os clientes com desconto recorrente: desconto deve ser concedido por volume ou prazo, não virar direito adquirido.`, ["vazamento", "segmento"]);
  const disp = (pr.produtosComPrecoDisperso || []).filter(x => x.amplitudePct >= 25 && x.linhas >= 6); if (disp.length) add(2, "Preço", `${disp.length} produto(s) vendidos com preços muito diferentes no mesmo mês`, disp.slice(0, 4).map(x => `${esc(x.nome)}: de ${brl(x.precoMin)}${x.vendedores && x.vendedores[0] ? " (" + esc(x.vendedores[0].vendedor) + ")" : ""} a ${brl(x.precoMax)} (média ${brl(x.precoMedio)})`).join("; ") + ".", `Padronizar o preço por tipo de cliente. Variação grande no mesmo produto costuma ser erro de lançamento, embalagem diferente ou desconto sem regra.`, ["vazamento"]);
  const mb = (pd.volumeComMargemBaixa || []); if (mb.length) add(2, "Produtos", "Produtos de muito volume com margem abaixo da mediana", mb.slice(0, 4).map(x => `${esc(x.nome)}: ${brl(x.faturamento)} com margem de ${num(x.margem)}%`).join("; ") + `. Mediana de margem dos produtos: ${num(pd.medianaMargem)}%.`, `Rever o custo com o fornecedor e subir o preço aos poucos nesses itens. São os que mais pesam no resultado e passam despercebidos por vender bem.`, ["vazamento", "segmento"]);
  const lentos = [...(pd.estoqueLento || []), ...(pd.semVendaNoMes || [])]; if (pd.capitalParadoTotal > 0 && lentos.length) add(3, "Estoque parado", `${brl(pd.capitalParadoTotal)} em estoque que vendeu pouco ou nada`, lentos.slice(0, 5).map(x => `${esc(x.nome)}: ${brl(x.capitalParado)}${x.diasDeEstoque ? " (" + num(x.diasDeEstoque, 0) + " dias de estoque)" : " sem venda no mês"}`).join("; ") + ".", `Montar promoção com tempo limitado, combinando esses itens com os de alto giro (veja o plano de promoções), sem descer abaixo de 10% de margem. Acompanhar o giro, não só o faturamento da promoção.`, ["lento", "combo", "promo"]);
