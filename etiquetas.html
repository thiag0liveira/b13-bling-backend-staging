<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>B13 — Etiquetas de Preço</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
  body{background:#0f0d24;color:#fff;min-height:100vh}
  .top{background:#181542;padding:14px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .top img{height:32px}
  .top .t{font-weight:900;font-size:18px}
  .top .sp{flex:1}
  .btn{background:#FF0082;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:800;font-size:13px;cursor:pointer}
  .btn-ghost{background:transparent;border:1px solid #514c96;color:#fff}
  .wrap{max-width:1000px;margin:0 auto;padding:18px}
  @media print{ .wrap{max-width:none;padding:0;margin:0} }
  .card{background:#181542;border-radius:14px;padding:18px;margin-bottom:16px}
  .muted{color:#9a95c9;font-size:12px}
  .busca{width:100%;padding:12px;font-size:15px;background:#0f0d24;border:2px solid #514c96;border-radius:10px;color:#fff}
  .lista{max-height:340px;overflow:auto;margin-top:10px}
  .linha{display:flex;align-items:center;gap:10px;padding:7px;border-bottom:1px solid #2a2660;font-size:13px}
  .linha input{width:auto}
  @media print{ .noprint{display:none!important} body{background:#fff} @page{ size:A4; margin:10mm } }
  .folha.modelo2{ grid-template-columns:repeat(2,1fr) }
  @media print{
    .folha.modelo2{ grid-auto-rows:126mm; row-gap:6mm; column-gap:6mm }
    .folha.modelo2 .etq2{ height:126mm }
    .folha.modelo2 .etq2:nth-child(4n){ page-break-after:always }
  }
  /* Modelo 3: 1 produto por folha A4 inteira — mesmo cartão do modelo 2, só ampliado
     com zoom (mantém o fluxo do layout, ao contrário de transform:scale) */
  .folha.modelo3{ grid-template-columns:1fr; gap:0 }
  /* Varal A4: o MESMO cartão do modelo 3, com margem em branco no topo para o prendedor do barbante */
  .folha.modelo3.varal3 .varalPag{ break-inside:avoid }
  .folha.modelo3.varal3 .varalTopo{ height:12mm; border-bottom:0.3mm dashed #ccc; margin-bottom:3mm; display:flex; align-items:center; justify-content:center; color:#bbb; font:8pt Arial; letter-spacing:1px }
  @media print{ .folha.modelo3.varal3 .varalPag{ break-after:page; page-break-after:always } .folha.modelo3.varal3 .varalPag:last-child{ break-after:auto; page-break-after:auto } .folha.modelo3.varal3 .etq2{ page-break-after:auto; zoom:2.05 } }
  .folha.modelo3 .etq2{ zoom:2.2; margin:30px auto }
  @media print{
    .folha.modelo3 .etq2{ zoom:2.2; margin:0 auto; page-break-after:always }
  }

  .folha{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;align-items:stretch}
  .etiqueta{background:#fff;color:#181542;border:2px solid #181542;border-radius:6px;overflow:hidden;page-break-inside:avoid;font-family:Arial,Helvetica,sans-serif}
  .etiqueta .nome{font-weight:900;font-size:19px;padding:10px 14px 6px;letter-spacing:.3px;text-transform:uppercase}
  .etiqueta .secoes{display:flex;border-top:2px solid #181542}
  .etiqueta .secao{flex:1;padding:12px 8px;text-align:center;position:relative}
  .etiqueta .secao+.secao{border-left:2px solid #000}
  .etiqueta .secao.preta{background:#fff;color:#000}
  .etiqueta .secao.preta .rotulo{color:#333}
  .etiqueta .secao.preta .valor{color:#000}
  .etiqueta .secao.branca{background:#181542;color:#fff}
  .etiqueta .secao.branca .rotulo{color:#cfc9f5}
  .etiqueta .secao.branca .valor{color:#fff}
  .etiqueta .secao.rosa{background:#FF0082;color:#0033cc}
  .etiqueta .secao.rosa .rotulo{color:#001a66}
  .etiqueta .secao.rosa .valor{color:#0033cc}
  .etiqueta .secao .rotulo{font-size:12px;font-weight:900;letter-spacing:1.5px;margin-bottom:3px}
  .etiqueta .secao .valor{font-size:36px;font-weight:900;line-height:1;display:flex;align-items:baseline;justify-content:center;gap:2px}
  .etiqueta .secao .valor .cifra{font-size:17px;font-weight:800;align-self:flex-start;margin-top:6px}
  .etiqueta .secao .sub{font-size:9px;font-weight:700;margin-top:4px;letter-spacing:.3px}
  @media print{
    .etiqueta,.etiqueta *,.etq2,.etq2 *,.etq2::before{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  }
  .etiqueta .rodape{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:9px;color:#555;border-top:1px solid #ccc}
  .etiqueta .rodape .categoria{font-size:12px;font-weight:900;color:#181542;letter-spacing:.5px;text-transform:uppercase}

  /* -------- Modelo 2 -------- */
  .etq2{position:relative;background:#fff;color:#000;border:3px solid #181542;border-radius:14px;overflow:hidden;page-break-inside:avoid;
    font-family:'Poppins',Arial,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.12);display:flex;flex-direction:column}
  .etq2::before{content:"";position:absolute;inset:0;background-image:url('/logo');background-repeat:no-repeat;background-position:center 58%;
    background-size:65%;opacity:.06;pointer-events:none;filter:grayscale(1)}
  .etq2 > *{position:relative;z-index:1}
  .etq2 .nome2{font-weight:900;font-size:32px;line-height:1.15;text-transform:uppercase;text-align:center;padding:20px 14px 4px;letter-spacing:.3px}
  .etq2 .categoria2{text-align:center;font-size:19px;font-weight:800;color:#c40018;text-transform:uppercase;letter-spacing:1px;padding-bottom:10px}
  .etq2 .corpo2{display:flex;align-items:stretch;padding:0 16px;gap:14px}
  .etq2 .unidade2{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0}
  .etq2 .unidade2 .preco2{font-size:64px;font-weight:900;display:flex;align-items:baseline;gap:2px}
  .etq2 .unidade2 .preco2 .cif2{font-size:26px}
  .etq2 .unidade2 .preco2 .cent2{font-size:28px}
  .etq2 .unidade2 .lbl2{font-size:15px;font-weight:800;color:#444}
  .etq2 .unidade2 .lblGrande2{font-size:20px;font-weight:900;margin-top:6px;letter-spacing:.5px}
  .etq2 .divisor2{width:3px;background:#000;align-self:stretch;margin:14px 0}
  .etq2 .pack2{flex:1;background:#FF0082;color:#000;border:2px solid #181542;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 8px;margin:12px 0}
  .etq2 .pack2 .preco2{font-size:52px;font-weight:900;color:#000;display:flex;align-items:baseline;gap:2px}
  .etq2 .pack2 .preco2 .cif2{font-size:22px}
  .etq2 .pack2 .lbl2{font-size:14px;font-weight:800;color:#000}
  .etq2 .pack2 .lblGrande2{font-size:13px;font-weight:900;color:#000;letter-spacing:.3px}
  .etq2 .atacado2{margin:12px 16px 0;background:#29ABE2;border:2px solid #181542;border-radius:12px;padding:14px 18px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
  .etq2 .atacado2 .preco2{font-size:48px;font-weight:900;color:#000;display:flex;align-items:baseline;gap:2px}
  .etq2 .atacado2 .preco2 .cif2{font-size:21px}
  .etq2 .atacado2 .lblGrande2{font-size:28px;font-weight:900;color:#000}
  .etq2 .obs2{text-align:center;font-size:13px;font-weight:800;color:#000;margin:4px 16px 12px}

  /* layout com 1 preço só (varejo) — grande e centralizado no meio do card */
  .etq2 .unico2{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 14px}
  .etq2 .unico2 .grande2{font-size:92px!important}
  .etq2 .unico2 .lblGrande2{font-size:25px;margin-top:8px}

  /* layout com 2 precos — um em cima, outro embaixo, cada um ocupando a largura toda */
  .etq2 .empilhado2{display:flex;flex-direction:column;padding:8px 16px 14px;gap:12px}
  .etq2 .unidadeEmpilhada2{padding:14px 0}
  .etq2 .unidadeEmpilhada2 .preco2{font-size:68px}
  .etq2 .pack2Full,.etq2 .atacado2Full{border:2px solid #181542;border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .etq2 .pack2Full .preco2,.etq2 .atacado2Full .preco2{font-size:54px;font-weight:900;color:#000;display:flex;align-items:baseline;gap:2px;justify-content:center}
  .etq2 .pack2Full .preco2 .cif2,.etq2 .atacado2Full .preco2 .cif2{font-size:24px}
  .etq2 .pack2Full .lblGrande2{font-size:15px;font-weight:900;color:#000;margin-top:4px}
  .etq2 .atacado2Full .lblGrande2{font-size:26px;font-weight:900;color:#000;margin-top:4px}
  .etq2 .rosa2{background:#FF0082}
  .etq2 .azul2{background:#29ABE2}
  .etq2 .rodapeLogo{background:#c40018;padding:14px;display:flex;align-items:center;justify-content:center;margin-top:auto}
  .etq2 .rodapeLogo img{height:34px;filter:brightness(0) invert(1)}

  /* ===== Modelo VARAL A4: folha inteira, lida de longe, para pendurar no barbante ===== */
  @font-face{font-family:B13Anton;src:url(/fontes/Anton-Regular.ttf)}
  @font-face{font-family:B13Archivo;src:url(/fontes/ArchivoBlack-Regular.ttf)}
  @page varal{ size:A4; margin:0 }
  html:has(.folha.varal), body:has(.folha.varal), body:has(.folha.varal) .wrap, .folha.varal{ page:varal } /* evita a página em branco na troca de tipo de página */
  .folha.varal{ display:block; padding:0 }
  .vf{ width:210mm; height:297mm; position:relative; overflow:hidden; display:flex; flex-direction:column; background:#fff; color:#111; font-family:B13Archivo,"Arial Black",Arial,sans-serif; margin:0 auto 12px; box-shadow:0 0 0 1px #ccc; cursor:pointer; page:varal; break-after:page; page-break-after:always }
  .vf:last-child{ break-after:auto; page-break-after:auto }
  .vf .vtopo{height:24mm;border-bottom:.3mm dashed #ccc;display:flex;align-items:center;justify-content:center;color:#bbb;font:8pt Arial;letter-spacing:1px}
  .vf .vcat{background:#c40018;color:#fff;text-align:center;font-size:20pt;letter-spacing:6px;padding:3.5mm 0;text-transform:uppercase;border-bottom:1mm solid #181542}
  .vf .voferta{background:#FF0082;color:#000;text-align:center;font-size:30pt;letter-spacing:10px;padding:2.5mm 0;border-bottom:1mm solid #181542}
  .vf .vcab{display:flex;align-items:center;gap:6mm;padding:8mm 14mm 0}
  .vf .vnome{flex:1;min-width:0}.vf .vn{font-size:58pt;line-height:1.02;text-transform:uppercase;overflow-wrap:anywhere}.vf .ve{font-size:22pt;color:#555;margin-top:3mm;text-transform:uppercase}
  .vf .vfoto{width:34mm;height:46mm;flex-shrink:0;display:flex;align-items:center;justify-content:center}.vf .vfoto img{max-width:100%;max-height:100%;object-fit:contain}
  .vf .vpreco{flex:1;display:flex;align-items:center;justify-content:center;color:#000;font-family:B13Anton,Impact,"Arial Narrow",sans-serif;line-height:.82;padding:0 10mm}
  .vf .vrs{font-size:46pt;align-self:flex-start;margin-top:10mm;margin-right:2mm}.vf .vcent{font-size:110pt;align-self:flex-start;margin-top:6mm}
  .vf .vun{text-align:center;font:bold 16pt Arial;color:#555;margin-top:-4mm}
  .vf .vvant{margin:8mm 14mm 0;color:#000;text-align:center;padding:5mm 4mm;border:0.8mm solid #181542;border-radius:4mm}.vf .vvant.fardo{background:#FF0082}.vf .vvant.atac{background:#29ABE2}.vf .vvant b{font-size:28pt;display:block}.vf .vvant span{font:bold 17pt Arial}
  .vf .vval{text-align:center;font:11pt Arial;color:#666;margin:5mm 0 4mm}
  .vf .vrod{background:#c40018;color:#fff;text-align:center;padding:4mm 0 3.5mm}.vf .vrod img{height:16mm;filter:brightness(0) invert(1);display:block;margin:0 auto 1.5mm}.vf .vrod b{font-size:24pt;letter-spacing:3px;display:block}.vf .vrod span{font:10.5pt Arial}
  @media print{ .vf{ margin:0; box-shadow:none } #b13menu, #b13qrModal, .noprint{ display:none !important } html body{ padding-top:0 !important; margin:0 !important } .folha.varal{ margin:0 !important } html body .wrap{ padding:0 !important; margin:0 !important; max-width:none !important } }
  .vf, .vf div, .vf b{ font-family:B13Archivo,"Arial Black",Arial,sans-serif !important }
  .vf .vpreco, .vf .vpreco span{ font-family:B13Anton,Impact,"Arial Narrow",sans-serif !important }
  .vf .vtopo, .vf .vun, .vf .vval, .vf .vvant span, .vf .vrod span{ font-family:Arial,sans-serif !important }
.top{flex-wrap:wrap;row-gap:6px}

  /* ===== Modelo 1 (novo visual, 29/10/2026) =====
     Etiqueta de gôndola para o porta-etiqueta U transparente de 10 × 3,5 cm.
     Corte de 100 × 35 mm (linha tracejada clara), arte de 97 × 32 mm com 1,5 mm de folga de corte.
     A4 com 2 colunas × 8 linhas = 16 por folha, sem espaço entre etiquetas (um corte separa duas).
     Margem da folha controlada aqui (página nomeada etq1), por isso imprime em escala 100% e sem cabeçalho/rodapé do navegador. */
  @page etq1{ size:A4; margin:0 }
  html:has(.folha.etq1), body:has(.folha.etq1), body:has(.folha.etq1) .wrap, .folha.etq1{ page:etq1 }
  .folha.etq1{ display:flex; flex-direction:column; align-items:center; gap:16px }
  .e1-pag{ width:210mm; height:297mm; background:#fff; padding:8.5mm 5mm; display:grid; grid-template-columns:repeat(2,100mm); grid-auto-rows:35mm; align-content:start; overflow:hidden; box-shadow:0 0 0 1px #ccc; page:etq1; break-after:page; page-break-after:always }
  .e1-pag:last-child{ break-after:auto; page-break-after:auto }
  @media print{ .folha.etq1{ display:block; gap:0 } .e1-pag{ box-shadow:none; margin:0 } }
  .e1-pag, .e1-pag *{ -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important; color-adjust:exact!important }
  .e1-pag, .e1-pag *{ font-family:"Archivo",Arial,Helvetica,sans-serif }
  .e1-cel{ width:100mm; height:35mm; padding:1.5mm; outline:.15mm dashed #B9B4D6; outline-offset:-.075mm; display:flex }
  .e1{ width:97mm; height:32mm; background:#fff; color:#0C0733; border:.35mm solid #0C0733; border-radius:2mm; overflow:hidden; display:flex; flex-direction:column; gap:1.1mm; padding:1.7mm 2mm 1.2mm }
  .e1-cab{ display:flex; align-items:baseline; justify-content:space-between; gap:2mm; min-width:0; padding:0 .4mm }
  .e1-nome{ flex:1; min-width:0; font-size:12pt; font-weight:900; font-stretch:68%; line-height:1; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .e1-nome.longo{ font-size:10.5pt }
  .e1-cat{ flex:none; font-size:5.4pt; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:#E00F73; line-height:1 }
  .e1-cat::before{ content:"◆ " }
  /* preços lado a lado, mesma largura e mesmo tamanho de número */
  .e1-precos{ flex:1; display:flex; gap:1.1mm; min-height:0 }
  .e1-p{ flex:1; min-width:0; border-radius:1.3mm; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1mm }
  .e1-lbl{ font-size:5.4pt; font-weight:800; letter-spacing:.16em; text-transform:uppercase; line-height:1; white-space:nowrap }
  .e1-v{ display:flex; align-items:flex-start; line-height:.8; font-variant-numeric:tabular-nums; white-space:nowrap }
  .e1-rs{ font-size:6.5pt; font-weight:800; margin-top:.5mm; margin-right:.4mm }
  .e1-int{ font-size:24pt; font-weight:900; font-stretch:88%; letter-spacing:-.02em }
  .e1-cent{ font-size:11pt; font-weight:900; font-stretch:88%; margin-left:.2mm }
  .e1-vj{ background:#F2F1F9; color:#0C0733 } .e1-vj .e1-lbl{ color:#4A4570 }
  .e1-fd{ background:#FDE7F1; color:#E00F73 } .e1-fd .e1-lbl{ color:#0C0733 }
  .e1-at{ background:#0C0733; color:#fff } .e1-at .e1-lbl{ color:#B7B0E6 }
  .e1-rod{ display:flex; justify-content:space-between; align-items:center; gap:2mm; font-size:5pt; font-weight:600; color:#4A4570; line-height:1; padding:0 .4mm; font-variant-numeric:tabular-nums }
  .e1-rod b{ color:#0C0733; font-weight:800 }
  .e1-selo{ font-weight:900; color:#0C0733; letter-spacing:.04em }
  .e1-selo i{ font-style:normal; color:#E00F73; letter-spacing:.2em; font-size:4.4pt }
  /* separador de categoria: cartão do mesmo tamanho, abre cada bloco */
  .e1-sep{ width:97mm; height:32mm; border-radius:2mm; background:#0C0733; color:#fff; display:flex; flex-direction:column; justify-content:center; gap:1.4mm; padding:0 4mm }
  .e1-sep b{ font-size:20pt; line-height:1; font-weight:900; font-stretch:75%; text-transform:uppercase; color:#fff }
  .e1-sep b::before{ content:"◆ "; color:#F5127E }
  .e1-sep span{ font-size:6.5pt; font-weight:700; color:#B7B0E6; letter-spacing:.08em; text-transform:uppercase }
</style>

<script>const BACKEND = location.protocol.indexOf("http") === 0 ? "" : "https://b13-bling-backend-production.up.railway.app";
function brl(n) {
  return n == null ? "—" : Number(n).toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}
function esc(s) {
  return String(s !== null && s !== void 0 ? s : "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}
let TODOS = [];
let SELECIONADOS = new Set();
async function carregar() {
  try {
    const j = await fetch(BACKEND + "/api/lista-fardo").then(r => r.json());
    TODOS = j.data || [];
  } catch (e) {
    TODOS = [];
  }
  if (BLING_ITENS) { mesclarBling(); return; }
  renderCategorias();
  renderLista();
}
async function atualizarLista() {
  const div = document.getElementById("lista");
  if (div) div.innerHTML = `<div class="muted">Atualizando…</div>`;
  await carregar();
}

// força a reconstrução do índice de produtos (preços de varejo) — útil logo depois
// de cadastrar/alterar um produto no Bling, sem esperar a atualização automática
function atualizarProdutosVarejo() {
  const btn = document.getElementById("btnVarejo");
  const box = document.getElementById("statusVarejo");
  if (btn) btn.disabled = true;
  box.innerHTML = `<div class="card" style="margin-top:10px"><div class="muted">Iniciando atualização dos produtos…</div>
    <div style="background:#0a0918;border-radius:8px;height:14px;overflow:hidden;border:1px solid #514c96;margin-top:8px"><div id="barVarejo" style="height:100%;width:5%;background:linear-gradient(90deg,#FF0082,#ff5fae);transition:width .3s"></div></div></div>`;
  const es = new EventSource(BACKEND + "/api/preco/reconstruir-indice");
  es.onmessage = ev => {
    const d = JSON.parse(ev.data);
    const bar = document.getElementById("barVarejo");
    const txt = box.querySelector(".muted");
    if (d.tipo === "status" && txt) txt.textContent = d.mensagem;else if (d.tipo === "total" && txt) txt.textContent = `0 de ${d.total} produtos…`;else if (d.tipo === "progresso") {
      if (txt) txt.textContent = `${d.atual} de ${d.total} produtos… ${d.nome || ""}`;
      if (bar) bar.style.width = Math.round(d.atual / d.total * 100) + "%";
    } else if (d.tipo === "done") {
      es.close();
      if (btn) btn.disabled = false;
      if (bar) bar.style.width = "100%";
      box.innerHTML = `<div class="card" style="margin-top:10px"><div class="muted">✅ Produtos atualizados: ${d.qtdProdutos} produto(s). A busca já reflete os preços/produtos mais novos.</div></div>`;
      atualizarLista();
      setTimeout(() => {
        box.innerHTML = "";
      }, 8000);
    } else if (d.tipo === "erro") {
      es.close();
      if (btn) btn.disabled = false;
      box.innerHTML = `<div class="card" style="margin-top:10px"><div style="color:#ff8090">Erro: ${esc(d.erro)}</div></div>`;
    }
  };
  es.onerror = () => {
    es.close();
    if (btn) btn.disabled = false;
  };
}
let _buscaBlingT = null;
function buscarBlingDebounce() {
  clearTimeout(_buscaBlingT);
  _buscaBlingT = setTimeout(buscarBling, 350);
}
async function buscarBling() {
  const termo = document.getElementById("buscaBling").value.trim();
  const box = document.getElementById("resultadosBling");
  if (termo.length < 2) {
    box.innerHTML = "";
    return;
  }
  box.innerHTML = `<div class="muted">Buscando…</div>`;
  try {
    const j = await fetch(BACKEND + "/api/buscar?nome=" + encodeURIComponent(termo)).then(r => r.json());
    const lista = j.data || [];
    box.innerHTML = lista.length ? lista.map(p => `
      <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #2a2660">
        <span style="flex:1;font-size:13px">${esc(p.nome)} <span class="muted">(cód. ${esc(p.codigo || "—")})</span></span>
        <button class="btn btn-sm" onclick='adicionarAvulsoBling(${JSON.stringify({
      id: p.id,
      nome: p.nome
    }).replace(/'/g, "&#39;")})'>+ Adicionar</button>
      </div>`).join("") : `<div class="muted">Nenhum produto encontrado no Bling.</div>`;
  } catch (e) {
    box.innerHTML = `<div class="muted">Erro na busca.</div>`;
  }
}
async function adicionarAvulsoBling(p) {
  try {
    const j = await fetch(BACKEND + "/api/lista-fardo/associar-avulso", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        produtoId: p.id,
        nome: p.nome
      })
    }).then(r => r.json());
    if (j.erro) {
      alert(j.erro);
      return;
    }
    await carregar(); // recarrega a lista (já vem com esse item novo)
    SELECIONADOS.add(j.itemId);
    renderCategorias();
    renderLista();
    document.getElementById("buscaBling").value = "";
    document.getElementById("resultadosBling").innerHTML = `<div class="muted">✅ "${esc(p.nome)}" adicionado à seleção (sem preço de atacado/fardo — só varejo).</div>`;
  } catch (e) {
    alert("Erro ao adicionar produto.");
  }
}

let BLING_ITENS = null;
async function carregarTodosBling() {
  const btn = document.getElementById("btnTodosBling"), info = document.getElementById("infoBling");
  btn.disabled = true; info.textContent = "Buscando os produtos…";
  try {
    const s = (typeof b13GetSession === "function" && b13GetSession()) || {};
    const j = await fetch(BACKEND + "/api/etiquetas/produtos-bling", { headers: { "X-Auth-Token": s.token || "" } }).then(r => r.json());
    if (j.erro) throw new Error(j.erro);
    BLING_ITENS = j;
    const antes = TODOS.length; mesclarBling();
    info.innerHTML = `✅ <b style="color:#fff">${TODOS.length - antes}</b> produto(s) do Bling somados à lista (${TODOS.length} no total). ${j.semPreco ? j.semPreco + " sem preço de varejo ficaram de fora. " : ""}O preço vem do cadastro do sistema; use "🔃 Atualizar produtos varejo" se mudou agora há pouco.`;
    btn.textContent = "📦 Atualizar a lista do Bling";
  } catch (e) { info.textContent = "Não consegui trazer os produtos: " + e.message; }
  btn.disabled = false;
}
// soma os produtos do Bling (que ainda não estão na lista) como itens só de varejo
function mesclarBling() {
  if (!BLING_ITENS) return;
  const tem = new Set(TODOS.map(i => i.itemId));
  BLING_ITENS.itens.forEach(p => {
    if (tem.has(p.itemId)) return;
    tem.add(p.itemId);
    TODOS.push({ itemId: p.itemId, categoriaNome: p.categoriaNome, itemNome: p.nome + (p.codigo ? " (" + p.codigo + ")" : ""), precoAtacado: null, precoFardo: null, precoVarejo: p.preco, doBling: true });
  });
  TODOS.sort((a, b) => a.itemNome.localeCompare(b.itemNome, "pt-BR"));
  renderCategorias();
  renderLista();
}
// busca os dados das etiquetas em lotes (a lista inteira numa chamada só estoura o limite do endereço e demora)
async function buscarEtiquetas(ids) {
  const folha = document.getElementById("folhaEtiquetas"), LOTE = 40, rapido = ids.length > LOTE, saida = [];
  for (let i = 0; i < ids.length; i += LOTE) {
    if (rapido) folha.innerHTML = `<div class="muted noprint">Gerando… ${Math.min(i + LOTE, ids.length)} de ${ids.length}</div>`;
    const j = await fetch(BACKEND + "/api/etiquetas?itens=" + ids.slice(i, i + LOTE).join(",") + (rapido ? "&rapido=1" : "")).then(r => r.json());
    if (j.erro) throw new Error(j.erro);
    (j.data || []).forEach(x => saida.push(x));
  }
  return { data: saida };
}
function categoriasUnicas() {
  return [...new Set(TODOS.map(i => i.categoriaNome || "(sem categoria)"))].sort((a, b) => a.localeCompare(b, "pt-BR"));
}
function renderCategorias() {
  const box = document.getElementById("categorias");
  if (!box) return;
  const cats = categoriasUnicas();
  if (!cats.length) {
    box.innerHTML = "";
    return;
  }
  box.innerHTML = cats.map(cat => {
    const itensCat = TODOS.filter(i => (i.categoriaNome || "(sem categoria)") === cat);
    const todosMarcados = itensCat.length > 0 && itensCat.every(i => SELECIONADOS.has(i.itemId));
    return `<button class="btn ${todosMarcados ? "" : "btn-ghost"}" style="font-size:11px;padding:6px 10px"
      onclick="toggleCategoria('${esc(cat).replace(/'/g, "&#39;")}')">${todosMarcados ? "✓ " : ""}${esc(cat)} <span style="opacity:.7">(${itensCat.length})</span></button>`;
  }).join("");
}
function toggleCategoria(cat) {
  const itensCat = TODOS.filter(i => (i.categoriaNome || "(sem categoria)") === cat);
  const todosMarcados = itensCat.length > 0 && itensCat.every(i => SELECIONADOS.has(i.itemId));
  itensCat.forEach(i => todosMarcados ? SELECIONADOS.delete(i.itemId) : SELECIONADOS.add(i.itemId));
  renderCategorias();
  renderLista();
}
function renderLista() {
  const termo = (document.getElementById("filtro").value || "").toLowerCase();
  const box = document.getElementById("lista");
  const filtrados = TODOS.filter(i => i.itemNome.toLowerCase().includes(termo));
  if (!filtrados.length) {
    box.innerHTML = `<div class="muted">Nenhum produto encontrado.</div>`;
    atualizarContSel();
    return;
  }
  box.innerHTML = filtrados.map(i => `
    <label class="linha">
      <input type="checkbox" ${SELECIONADOS.has(i.itemId) ? "checked" : ""} onchange="toggleSel('${i.itemId}',this.checked)">
      <span style="flex:1">${esc(i.itemNome)}</span>
      <span class="muted">${i.precoAtacado != null ? "Atacado " + brl(i.precoAtacado) : (i.precoVarejo != null ? "Varejo " + brl(i.precoVarejo) : "só varejo")}${i.precoFardo != null ? " · Fardo " + brl(i.precoFardo) : ""}</span>
    </label>`).join("");
  atualizarContSel();
}
function toggleSel(id, marcado) {
  if (marcado) SELECIONADOS.add(id);else SELECIONADOS.delete(id);
  renderCategorias();
  atualizarContSel();
}
// itens que aparecem na lista agora (respeita o filtro por nome)
function itensFiltrados() {

// marca todos os que estão na lista; com filtro por nome ativo, marca só os filtrados

function atualizarContSel() {
  const f = itensFiltrados(), filtrando = !!(document.getElementById("filtro").value || "").trim(), marcadosNaLista = f.filter(i => SELECIONADOS.has(i.itemId)).length;

}
function fmtPreco(v) {
  if (v == null) return "—";
  return Number(v).toLocaleString("pt-BR", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}
function hojeFmt() {
  const d = new Date();
  return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();
}
// ===== Modelo 1 (novo visual, 29/10/2026) — etiqueta 100 × 35 mm para porta-etiqueta U 10 × 3,5 cm =====
// true = ordena por categoria e abre cada categoria com um cartão separador (facilita colar por corredor)
const E1_SEPARAR_CATEGORIAS = true;
const E1_POR_FOLHA = 16; // 2 colunas × 8 linhas
function e1HojeCurto() {
  const d = new Date();
  return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getFullYear()).slice(2);
}
// volume em litros a partir do nome ("750ml", "1L", "2,5L"); kit/bipack/fardo ficam sem cálculo para não informar valor errado
function e1VolumeLitros(nome) {
  nome = String(nome || "");
  if (/\b(bi\s?pack|pack|kit|fardo|c\/\s?\d|cx)\b/i.test(nome)) return null;
  const m = nome.match(/(\d+(?:[.,]\d+)?)\s*(ml|l)\b/i);
  if (!m) return null;
  const n = parseFloat(m[1].replace(",", "."));
  if (!(n > 0)) return null;
  return m[2].toLowerCase() === "ml" ? n / 1000 : n;
}
function e1Preco(v) {
  if (v == null || isNaN(Number(v))) return `<span class="e1-int">—</span>`;
  const [i, c] = Number(v).toFixed(2).split(".");
  return `<span class="e1-rs">R$</span><span class="e1-int">${Number(i).toLocaleString("pt-BR")}</span><span class="e1-cent">,${c}</span>`;
}
function e1Etiqueta(it, hoje) {
  const temF = it.precoFardo != null, temA = it.precoAtacado != null;
  const cel = (cls, lbl, v) => `<div class="e1-p ${cls}"><span class="e1-lbl">${lbl}</span><span class="e1-v">${e1Preco(v)}</span></div>`;
  const precos = [cel("e1-vj", "Varejo", it.precoVarejo)];
  if (temF) precos.push(cel("e1-fd", `Fardo ${esc(it.caixaQtd || "—")}+ un`, it.precoFardo));
  if (temA) precos.push(cel("e1-at", "Atacado*", it.precoAtacado));
  const L = e1VolumeLitros(it.nome);
  const esq = (L && it.precoVarejo > 0)
    ? `${L >= 1 ? String(L).replace(".", ",") + " L" : Math.round(L * 1000) + " ml"} · <b>R$ ${fmtPreco(it.precoVarejo / L)}</b> o litro`
    : `<span class="e1-selo">B13 <i>BEBIDAS</i></span>`;
  const nome = String(it.nome || "");
  return `<div class="e1">
    <div class="e1-cab"><span class="e1-nome${nome.length > 30 ? " longo" : ""}">${esc(nome)}</span>${it.categoriaNome ? `<span class="e1-cat">${esc(it.categoriaNome)}</span>` : ""}</div>
    <div class="e1-precos">${precos.join("")}</div>
    <div class="e1-rod"><span>${esq}</span>${temA ? "<span>* atacado sujeito à taxa do cartão</span>" : ""}<span>${hoje}</span></div>
  </div>`;
}
function e1Separador(cat, n) {
  return `<div class="e1-sep"><b>${esc(cat)}</b><span>${n} etiqueta${n > 1 ? "s" : ""} a seguir</span></div>`;
}
async function gerarEtiquetas() {
  if (!SELECIONADOS.size) {
    alert("Selecione ao menos um produto.");
    return;
  }
  const folha = document.getElementById("folhaEtiquetas");
  folha.className = "folha etq1";
  folha.innerHTML = `<div class="muted noprint">Gerando…</div>`;
  try {
    const j = await buscarEtiquetas([...SELECIONADOS]);
    const hoje = e1HojeCurto();
    let itens = (j.data || []).filter(it => !it.erro);
    const celulas = [];
    if (E1_SEPARAR_CATEGORIAS) {
      const cat = it => it.categoriaNome || "Sem categoria";
      itens = itens.slice().sort((a, b) => cat(a).localeCompare(cat(b), "pt-BR") || String(a.nome || "").localeCompare(String(b.nome || ""), "pt-BR"));
      let atual = null;
      itens.forEach(it => {
        if (cat(it) !== atual) {
          atual = cat(it);
          celulas.push(e1Separador(atual, itens.filter(x => cat(x) === atual).length));
        }
        celulas.push(e1Etiqueta(it, hoje));
      });
    } else {
      itens.forEach(it => celulas.push(e1Etiqueta(it, hoje)));
    }
    const paginas = [];
    for (let i = 0; i < celulas.length; i += E1_POR_FOLHA) {
      paginas.push(`<div class="e1-pag">${celulas.slice(i, i + E1_POR_FOLHA).map(c => `<div class="e1-cel">${c}</div>`).join("")}</div>`);
    }
    folha.innerHTML = paginas.join("") || `<div class="muted">Nenhuma etiqueta gerada.</div>`;
    document.getElementById("btnImprimir").style.display = "inline-block";
  } catch (e) {
    folha.innerHTML = `<div class="muted">Erro ao gerar etiquetas.</div>`;
  }
}
function partesPreco(v) {
  if (v == null) return {
    i: "—",
    c: ""
  };
  const s = Number(v).toFixed(2).split(".");
  return {
    i: s[0],
    c: s[1]
  };
}

  const temFardo = it.precoFardo != null;
  const temAtacado = it.precoAtacado != null;

        <div class="lbl2">UND</div>
        <div class="lblGrande2">UNIDADE</div>
      </div>
      <div class="${seg.classe} ${seg.cor}">
        <div class="preco2"><span class="cif2">R$</span>${seg.preco.i}<span class="cent2">,${seg.preco.c}</span></div>
        <div class="lblGrande2">${seg.label}</div>
      </div>
    </div>`;
  } else {
    // os 3 preços -> layout original (unidade+fardo lado a lado, atacado embaixo)

      <div class="unidade2">
        <div class="preco2"><span class="cif2">R$</span>${varejo.i}<span class="cent2">,${varejo.c}</span></div>
        <div class="lbl2">UND</div>

      </div>
      <div class="divisor2"></div>

        <div class="preco2"><span class="cif2">R$</span>${fardo.i}<span class="cent2">,${fardo.c}</span></div>
        <div class="lbl2">UND</div>
        <div class="lblGrande2">A PARTIR DE ${it.caixaQtd || "—"} UNIDADES</div>
      </div>
    </div>
    <div class="atacado2">
      <div class="preco2"><span class="cif2">R$</span>${atacado.i}<span class="cent2">,${atacado.c}</span></div>
      <div class="lblGrande2">ATACADO</div>
    </div>
    <div class="obs2">VALORES DE ATACADO SUJEITO A TAXA DO CARTÃO</div>`;
  }
  return `<div class="etq2">
    <div class="nome2">${esc(it.nome)}</div>
    ${it.categoriaNome ? `<div class="categoria2">${esc(it.categoriaNome)}</div>` : ""}

// ===== MODELO VARAL A4 (1 produto por folha, para pendurar no barbante) =====
function corCategoriaVaral(c) { c = String(c || "").toLowerCase();
