<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B13 — Etiquetas de Preço</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
  body{background:#0f0d24;color:#fff;min-height:100vh}
  .top{background:#181542;padding:14px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .top img{height:32px}
  .top .t{font-weight:900;font-size:18px}
  .top .sp{flex:1}
  .btn{background:#FF0082;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:800;font-size:13px;cursor:pointer}
  .btn-ghost{background:transparent;border:1px solid #514c96;color:#fff}
  .wrap{max-width:1000px;margin:0 auto;padding:18px}
  @media print{ .wrap{max-width:none;padding:0;margin:0} }
  .card{background:#181542;border-radius:14px;padding:18px;margin-bottom:16px}
  .muted{color:#9a95c9;font-size:12px}
  .busca{width:100%;padding:12px;font-size:15px;background:#0f0d24;border:2px solid #514c96;border-radius:10px;color:#fff}
  .lista{max-height:340px;overflow:auto;margin-top:10px}
  .linha{display:flex;align-items:center;gap:10px;padding:7px;border-bottom:1px solid #2a2660;font-size:13px}
  .linha input{width:auto}
  @media print{ .noprint{display:none!important} body{background:#fff} @page{ size:A4; margin:10mm } }
  .folha.modelo2{ grid-template-columns:repeat(2,1fr) }
  @media print{
    .folha.modelo2{ grid-auto-rows:134mm; row-gap:8mm; column-gap:8mm }
    .folha.modelo2 .etq2{ height:134mm }
    .folha.modelo2 .etq2:nth-child(4n){ page-break-after:always }
  }

  .folha{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;align-items:stretch}
  .etiqueta{background:#fff;color:#181542;border:2px solid #181542;border-radius:6px;overflow:hidden;page-break-inside:avoid;font-family:Arial,Helvetica,sans-serif}
  .etiqueta .nome{font-weight:900;font-size:19px;padding:10px 14px 6px;letter-spacing:.3px;text-transform:uppercase}
  .etiqueta .secoes{display:flex;border-top:2px solid #181542}
  .etiqueta .secao{flex:1;padding:12px 8px;text-align:center;position:relative}
  .etiqueta .secao+.secao{border-left:2px solid #000}
  .etiqueta .secao.preta{background:#fff;color:#000}
  .etiqueta .secao.preta .rotulo{color:#333}
  .etiqueta .secao.preta .valor{color:#000}
  .etiqueta .secao.branca{background:#181542;color:#fff}
  .etiqueta .secao.branca .rotulo{color:#cfc9f5}
  .etiqueta .secao.branca .valor{color:#fff}
  .etiqueta .secao.rosa{background:#FF0082;color:#0033cc}
  .etiqueta .secao.rosa .rotulo{color:#001a66}
  .etiqueta .secao.rosa .valor{color:#0033cc}
  .etiqueta .secao .rotulo{font-size:12px;font-weight:900;letter-spacing:1.5px;margin-bottom:3px}
  .etiqueta .secao .valor{font-size:36px;font-weight:900;line-height:1;display:flex;align-items:baseline;justify-content:center;gap:2px}
  .etiqueta .secao .valor .cifra{font-size:17px;font-weight:800;align-self:flex-start;margin-top:6px}
  .etiqueta .secao .sub{font-size:9px;font-weight:700;margin-top:4px;letter-spacing:.3px}
  @media print{
    .etiqueta,.etiqueta *,.etq2,.etq2 *,.etq2::before{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  }
  .etiqueta .rodape{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:9px;color:#555;border-top:1px solid #ccc}
  .etiqueta .rodape .categoria{font-size:12px;font-weight:900;color:#181542;letter-spacing:.5px;text-transform:uppercase}

  /* -------- Modelo 2 -------- */
  .etq2{position:relative;background:#fff;color:#000;border:3px solid #181542;border-radius:14px;overflow:hidden;page-break-inside:avoid;
    font-family:'Poppins',Arial,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.12);display:flex;flex-direction:column}
  .etq2::before{content:"";position:absolute;inset:0;background-image:url('/logo');background-repeat:no-repeat;background-position:center 58%;
    background-size:65%;opacity:.06;pointer-events:none;filter:grayscale(1)}
  .etq2 > *{position:relative;z-index:1}
  .etq2 .nome2{font-weight:900;font-size:32px;line-height:1.15;text-transform:uppercase;text-align:center;padding:20px 14px 10px;letter-spacing:.3px}
  .etq2 .corpo2{display:flex;align-items:stretch;padding:0 16px;gap:14px}
  .etq2 .unidade2{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0}
  .etq2 .unidade2 .preco2{font-size:64px;font-weight:900;display:flex;align-items:baseline;gap:2px}
  .etq2 .unidade2 .preco2 .cif2{font-size:26px}
  .etq2 .unidade2 .preco2 .cent2{font-size:28px}
  .etq2 .unidade2 .lbl2{font-size:15px;font-weight:800;color:#444}
  .etq2 .unidade2 .lblGrande2{font-size:20px;font-weight:900;margin-top:6px;letter-spacing:.5px}
  .etq2 .divisor2{width:3px;background:#000;align-self:stretch;margin:14px 0}
  .etq2 .pack2{flex:1;background:#FF0082;color:#000;border:2px solid #181542;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 8px;margin:12px 0}
  .etq2 .pack2 .preco2{font-size:52px;font-weight:900;color:#000;display:flex;align-items:baseline;gap:2px}
  .etq2 .pack2 .preco2 .cif2{font-size:22px}
  .etq2 .pack2 .lbl2{font-size:14px;font-weight:800;color:#000}
  .etq2 .pack2 .lblGrande2{font-size:13px;font-weight:900;color:#000;letter-spacing:.3px}
  .etq2 .atacado2{margin:12px 16px 0;background:#29ABE2;border:2px solid #181542;border-radius:12px;padding:14px 18px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
  .etq2 .atacado2 .preco2{font-size:48px;font-weight:900;color:#000;display:flex;align-items:baseline;gap:2px}
  .etq2 .atacado2 .preco2 .cif2{font-size:21px}
  .etq2 .atacado2 .lblGrande2{font-size:28px;font-weight:900;color:#000}
  .etq2 .obs2{text-align:center;font-size:13px;font-weight:800;color:#000;margin:4px 16px 12px}

  /* layout com 1 preço só (varejo) — grande e centralizado no meio do card */
  .etq2 .unico2{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 14px}
  .etq2 .unico2 .grande2{font-size:92px!important}
  .etq2 .unico2 .lblGrande2{font-size:25px;margin-top:8px}

  /* layout com 2 precos — um em cima, outro embaixo, cada um ocupando a largura toda */
  .etq2 .empilhado2{display:flex;flex-direction:column;padding:8px 16px 14px;gap:12px}
  .etq2 .unidadeEmpilhada2{padding:14px 0}
  .etq2 .unidadeEmpilhada2 .preco2{font-size:68px}
  .etq2 .pack2Full,.etq2 .atacado2Full{border:2px solid #181542;border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .etq2 .pack2Full .preco2,.etq2 .atacado2Full .preco2{font-size:54px;font-weight:900;color:#000;display:flex;align-items:baseline;gap:2px;justify-content:center}
  .etq2 .pack2Full .preco2 .cif2,.etq2 .atacado2Full .preco2 .cif2{font-size:24px}
  .etq2 .pack2Full .lblGrande2{font-size:15px;font-weight:900;color:#000;margin-top:4px}
  .etq2 .atacado2Full .lblGrande2{font-size:26px;font-weight:900;color:#000;margin-top:4px}
  .etq2 .rosa2{background:#FF0082}
  .etq2 .azul2{background:#29ABE2}
  .etq2 .rodapeLogo{background:#c40018;padding:14px;display:flex;align-items:center;justify-content:center;margin-top:auto}
  .etq2 .rodapeLogo img{height:34px;filter:brightness(0) invert(1)}
</style>
</head>
<body>
<script src="/nav.js"></script>
<script>
if(!b13RequireLogin())document.write=function(){};
document.addEventListener("DOMContentLoaded",function(){
  const nav=document.createElement("div");
  nav.innerHTML=b13RenderNav("/etiquetas");
  document.body.insertBefore(nav,document.body.firstChild);
});
</script>

<div class="top noprint">
  <img src="/logo">
  <div class="t">Etiquetas de Preço</div>
  <div class="sp"></div>
  <button class="btn btn-ghost" onclick="atualizarLista()">🔄 Atualizar lista</button>
  <button class="btn btn-ghost" onclick="location.href='/lista-fardo'">📋 Lista de Fardo</button>
</div>

<div class="wrap noprint">
  <div class="card">
    <div class="muted" style="margin-bottom:6px">Selecione os produtos pra gerar etiquetas (mostra Atacado, Fardo e Varejo)</div>
    <input class="busca" id="filtro" placeholder="Filtrar por nome…" oninput="renderLista()">
    <div class="lista" id="lista"><div class="muted">Carregando…</div></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn" onclick="gerarEtiquetas()">🏷 Gerar etiquetas (modelo 1)</button>
      <button class="btn btn-ghost" onclick="gerarEtiquetasModelo2()">🏷 Gerar etiquetas (modelo 2)</button>
      <button class="btn btn-ghost" onclick="window.print()" id="btnImprimir" style="display:none">🖨 Imprimir</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="folhaEtiquetas" class="folha"></div>
</div>

<script>
const BACKEND=(location.protocol.indexOf("http")===0)?"":"https://b13-bling-backend-production.up.railway.app";
function brl(n){ return n==null?"—":(Number(n)).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

let TODOS=[];
let SELECIONADOS=new Set();

async function carregar(){
  try{
    const j=await fetch(BACKEND+"/api/lista-fardo").then(r=>r.json());
    TODOS=j.data||[];
  }catch(e){ TODOS=[]; }
  renderLista();
}

async function atualizarLista(){
  const div=document.getElementById("lista");
  if(div) div.innerHTML=`<div class="muted">Atualizando…</div>`;
  await carregar();
}

function renderLista(){
  const termo=(document.getElementById("filtro").value||"").toLowerCase();
  const box=document.getElementById("lista");
  const filtrados=TODOS.filter(i=>i.itemNome.toLowerCase().includes(termo));
  if(!filtrados.length){ box.innerHTML=`<div class="muted">Nenhum produto encontrado.</div>`; return; }
  box.innerHTML=filtrados.map(i=>`
    <label class="linha">
      <input type="checkbox" ${SELECIONADOS.has(i.itemId)?"checked":""} onchange="toggleSel('${i.itemId}',this.checked)">
      <span style="flex:1">${esc(i.itemNome)}</span>
      <span class="muted">Atacado ${brl(i.precoAtacado)}${i.precoFardo!=null?" · Fardo "+brl(i.precoFardo):""}</span>
    </label>`).join("");
}

function toggleSel(id,marcado){ if(marcado) SELECIONADOS.add(id); else SELECIONADOS.delete(id); }

function fmtPreco(v){
  if(v==null) return "—";
  return Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function hojeFmt(){ const d=new Date(); return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); }

async function gerarEtiquetas(){
  if(!SELECIONADOS.size){ alert("Selecione ao menos um produto."); return; }
  const folha=document.getElementById("folhaEtiquetas");
  folha.className="folha";
  folha.innerHTML=`<div class="muted noprint">Gerando…</div>`;
  try{
    const j=await fetch(BACKEND+"/api/etiquetas?itens="+[...SELECIONADOS].join(",")).then(r=>r.json());
    folha.innerHTML=(j.data||[]).map(it=>{
      if(it.erro) return "";
      const temFardo=it.precoFardo!=null;
      const temAtacado=it.precoAtacado!=null;
      const secoes=[];
      secoes.push(`<div class="secao preta"><div class="rotulo">VAREJO</div><div class="valor"><span class="cifra">R$</span>${fmtPreco(it.precoVarejo)}</div></div>`);
      if(temFardo) secoes.push(`<div class="secao rosa"><div class="rotulo">FARDO</div><div class="valor"><span class="cifra">R$</span>${fmtPreco(it.precoFardo)}</div></div>`);
      if(temAtacado) secoes.push(`<div class="secao branca"><div class="rotulo">ATACADO</div><div class="valor"><span class="cifra">R$</span>${fmtPreco(it.precoAtacado)}</div></div>`);
      return `<div class="etiqueta">
        <div class="nome">${esc(it.nome)}</div>
        <div class="secoes">${secoes.join("")}</div>
        <div class="rodape"><span class="categoria">${esc(it.categoriaNome||"")}</span><span>${hojeFmt()}</span></div>
      </div>`;
    }).join("");
    document.getElementById("btnImprimir").style.display="inline-block";
  }catch(e){ folha.innerHTML=`<div class="muted">Erro ao gerar etiquetas.</div>`; }
}

function partesPreco(v){
  if(v==null) return {i:"—",c:""};
  const s=Number(v).toFixed(2).split(".");
  return {i:s[0],c:s[1]};
}

async function gerarEtiquetasModelo2(){
  if(!SELECIONADOS.size){ alert("Selecione ao menos um produto."); return; }
  const folha=document.getElementById("folhaEtiquetas");
  folha.className="folha modelo2";
  folha.innerHTML=`<div class="muted noprint">Gerando…</div>`;
  try{
    const j=await fetch(BACKEND+"/api/etiquetas?itens="+[...SELECIONADOS].join(",")).then(r=>r.json());
    folha.innerHTML=(j.data||[]).map(it=>{
      if(it.erro) return "";
      const varejo=partesPreco(it.precoVarejo);
      const fardo=partesPreco(it.precoFardo);
      const atacado=partesPreco(it.precoAtacado);
      const temFardo=it.precoFardo!=null;
      const temAtacado=it.precoAtacado!=null;
      const qtdPrecos=1+(temFardo?1:0)+(temAtacado?1:0);

      let corpoHtml;
      if(qtdPrecos===1){
        // só o varejo -> mostra bem grande, centralizado no meio do card
        corpoHtml=`<div class="unico2">
          <div class="preco2 grande2"><span class="cif2">R$</span>${varejo.i}<span class="cent2">,${varejo.c}</span></div>
          <div class="lbl2">UND</div>
          <div class="lblGrande2">UNIDADE</div>
        </div>`;
      } else if(qtdPrecos===2){
        // um em cima (varejo), o outro embaixo (fardo ou atacado) — cada um ocupando a largura toda
        const seg=temFardo
          ?{classe:"pack2Full",cor:"rosa2",preco:fardo,label:`ACIMA DE ${it.caixaQtd||"—"} UNIDADES`}
          :{classe:"atacado2Full",cor:"azul2",preco:atacado,label:"ATACADO"};
        corpoHtml=`<div class="empilhado2">
          <div class="unidade2 unidadeEmpilhada2">
            <div class="preco2"><span class="cif2">R$</span>${varejo.i}<span class="cent2">,${varejo.c}</span></div>
            <div class="lbl2">UND</div>
            <div class="lblGrande2">UNIDADE</div>
          </div>
          <div class="${seg.classe} ${seg.cor}">
            <div class="preco2"><span class="cif2">R$</span>${seg.preco.i}<span class="cent2">,${seg.preco.c}</span></div>
            <div class="lblGrande2">${seg.label}</div>
          </div>
        </div>`;
      } else {
        // os 3 preços -> layout original (unidade+fardo lado a lado, atacado embaixo)
        corpoHtml=`<div class="corpo2">
          <div class="unidade2">
            <div class="preco2"><span class="cif2">R$</span>${varejo.i}<span class="cent2">,${varejo.c}</span></div>
            <div class="lbl2">UND</div>
            <div class="lblGrande2">UNIDADE</div>
          </div>
          <div class="divisor2"></div>
          <div class="pack2">
            <div class="preco2"><span class="cif2">R$</span>${fardo.i}<span class="cent2">,${fardo.c}</span></div>
            <div class="lbl2">UND</div>
            <div class="lblGrande2">ACIMA DE ${it.caixaQtd||"—"} UNIDADES</div>
          </div>
        </div>
        <div class="atacado2">
          <div class="preco2"><span class="cif2">R$</span>${atacado.i}<span class="cent2">,${atacado.c}</span></div>
          <div class="lblGrande2">ATACADO</div>
        </div>
        <div class="obs2">VALORES DE ATACADO SUJEITO A TAXA DO CARTÃO</div>`;
      }

      return `<div class="etq2">
        <div class="nome2">${esc(it.nome)}</div>
        ${corpoHtml}
        <div class="rodapeLogo"><img src="/logo" onerror="this.outerHTML='<span style=&quot;color:#fff;font-weight:900;font-size:16px;letter-spacing:1px&quot;>B13 BEBIDAS</span>'"></div>
      </div>`;
    }).join("");
    document.getElementById("btnImprimir").style.display="inline-block";
  }catch(e){ folha.innerHTML=`<div class="muted">Erro ao gerar etiquetas.</div>`; }
}

carregar();
</script>
</body>
</html>
