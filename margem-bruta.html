<style>

.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs .chip{font-size:12.5px}

.cli:hover{border-color:var(--mag)}.cli .info{flex:1;min-width:230px}.cli .l1{font-weight:800;font-size:14.5px}.cli .l2{font-size:12px;color:var(--muted);margin-top:3px}
.par{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}

textarea{padding:8px 10px;border-radius:9px;border:1px solid #37327a;background:#0f0d24;color:#fff;font-size:13px;min-height:70px}
#mapa{height:380px;border-radius:10px;border:1px solid var(--borda)}
.err{background:#3d1020;color:#ff8aa3;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:6px}.okmsg{background:#11352a;color:#6be3a8;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:6px}
.wrap .filtros{flex-wrap:wrap;min-width:0}.wrap .card{min-width:0;max-width:100%}.wrap .filtros input,.wrap .filtros select{max-width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:12px}.grid2>*{min-width:0}
.dist .lin{cursor:pointer}.dist .lin:hover{background:#1c1846}.barra{height:6px;background:#221e4f;border-radius:4px;overflow:hidden;margin-top:3px}.barra i{display:block;height:100%;background:#FF0082}
.ped{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid #221e4f;cursor:pointer}.ped:hover{background:#1c1846}.ped .x{flex:1;min-width:0}.ped .x b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ped .x span{color:var(--muted);font-size:12px}.tagp{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:4px;background:#2a2660;color:#cfcaff}
.tagp.ok{background:#0f3a28;color:#3ce88a}.tagp.al{background:#3d1020;color:#ff8aa3}.tagp.am{background:#3a2e08;color:#ffd23f}
.abas{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.abas span{padding:6px 12px;border-radius:999px;border:1px solid #3a3480;cursor:pointer;font-size:13px}.abas span.on{background:#FF0082;border-color:#FF0082;color:#fff}
.edtab input{background:#0f0c29;color:#fff;border:1px solid #3a3480;border-radius:6px;padding:6px;width:100%}

/* topo: o status do histórico quebra linha no celular em vez de esticar a página */
.top{flex-wrap:wrap}#sinc{white-space:normal;min-width:0;flex:1 1 180px;text-align:right}@media(max-width:600px){#sinc{font-size:10.5px;text-align:left}}
.aviso{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;margin-bottom:6px;text-decoration:none;color:#fff;border:1px solid #2a2660;background:#1c1846}
.aviso:hover{border-color:#FF0082}.aviso .ic2{font-size:16px}.aviso.alto{border-left:4px solid #ff5a7a}.aviso.medio{border-left:4px solid #ffd23f}.aviso.baixo{border-left:4px solid #7fd0ff}.aviso.bom{border-left:4px solid #3ce88a}.aviso.info{border-left:4px solid #9a95c9}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:12px}.grid3>*{min-width:0}
.leg{display:flex;gap:12px;font-size:11.5px;color:#9a95c9;margin-top:4px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.wrap>*{min-width:0;max-width:100%;box-sizing:border-box}#kpis{grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr))}#atalhos{flex-wrap:wrap}
.lin>span{min-width:0;overflow-wrap:anywhere;white-space:normal}.lin>b{flex-shrink:0;white-space:nowrap;margin-left:8px}.lin{gap:6px}
.wrap>*{min-width:0;max-width:100%;box-sizing:border-box}#atalhos{flex-wrap:wrap}#atalhos input,#atalhos select{max-width:100%;min-width:0}#parProd{flex-wrap:wrap}
.pcard{border-top:1px solid #2a2660;padding:10px 2px}.pcard .n{font-weight:800;font-size:14px;display:flex;justify-content:space-between;gap:8px}.pcard .l{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:#9a95c9;margin-top:4px}.pcard .l b{color:#fff}
.pcard .c{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}.pcard .c input{width:110px;font-size:16px;padding:8px;text-align:right}.pcard .c button{font-size:18px;padding:6px 14px}
.pcard .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 8px;margin-top:6px}.pcard .g3>div{min-width:0}.pcard .g3 span{display:block;font-size:11px;color:#9a95c9}.pcard .g3 b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pcard .ced{display:flex;gap:4px;align-items:center}.pcard .ced input{width:100%;min-width:0;font-size:16px;padding:6px;text-align:right;border-radius:8px}.pcard .ced button{border:0;background:#FF0082;color:#fff;border-radius:8px;padding:6px 8px;font-size:15px;flex-shrink:0}
@media (max-width:719px){ .pcard{padding:7px 0}.pcard .n{font-size:12px}.pcard .n span:first-child{min-width:0;overflow-wrap:anywhere}.pcard .n span:last-child{white-space:nowrap;flex-shrink:0}
  .pcard .g3{gap:3px 6px;margin-top:4px}.pcard .g3 span{font-size:9.5px}.pcard .g3 b{font-size:11px}
  .pcard .ced input{font-size:16px;padding:3px 4px;height:28px;box-sizing:border-box}.pcard .ced button{padding:3px 6px;font-size:12px;height:28px}
  #cards{width:100%;max-width:100%;overflow:hidden} .kpi .v{font-size:18px} .kpi .l{font-size:10px} .kpi .s{font-size:10px} }
.dtx{display:inline-flex;gap:4px;align-items:center}.dtx>input{width:104px}.dtx .cal{position:relative;overflow:hidden;cursor:pointer;padding:7px 10px;border:1px solid #37327a;border-radius:9px;background:#0f0d24;line-height:1}.dtx .cal input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0;border:0}.cli{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid #2a2660;cursor:pointer}.cli:active{background:#1b1442}</style>

<body><script>
  (function(){ if(!b13RequireLogin()) return; if(!b13BloquearSeSemAcesso("/margem-bruta")) return;
    document.addEventListener("DOMContentLoaded",function(){ const nav=document.createElement("div"); nav.innerHTML=b13RenderNav("/margem-bruta"); document.body.insertBefore(nav,document.body.firstChild); }); })();

<div class="top"><img src="/logo"><div class="t">🪙 Margem Bruta</div><div class="sp"></div><button class="chip" onclick="csv()">⬇️ CSV</button></div>
<div class="wrap">
  <div class="card"><div class="filtros" id="atalhos" style="flex-wrap:wrap">
    <label class="ic">De <span class="dtx"><input id="fIniT" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" autocomplete="off" enterkeyhint="done"><span class="cal">📅<input type="date" id="fIni" aria-label="escolher no calendário"></span></span></label><label class="ic">até <span class="dtx"><input id="fFimT" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" autocomplete="off" enterkeyhint="done"><span class="cal">📅<input type="date" id="fFim" aria-label="escolher no calendário"></span></span></label>
    <select id="fAg"><option value="produto" selected>Por produto</option><option value="mes">Por mês</option><option value="semana">Por semana</option><option value="dia">Por dia</option><option value="pedido">Por pedido</option></select>
    <span id="parProd" style="display:none;gap:6px;flex-wrap:wrap;align-items:center"><select id="fOrdem"><option value="menor_margem">Menor margem</option><option value="maior_margem">Maior margem</option><option value="menor_markup">Menor markup</option><option value="maior_markup">Maior markup</option><option value="maior_lucro">Maior lucro</option><option value="maior_fat">Maior faturamento</option><option value="maior_qtd">Mais vendidos</option></select>
      <label class="ic">margem abaixo de <input id="fMax" inputmode="decimal" placeholder="%" style="width:56px"></label>
      <select id="fSo"><option value="">Todos</option><option value="com_custo">Só com custo</option><option value="sem_custo">Só sem custo</option></select></span>
    <input id="fBusca" type="search" placeholder="🔎 cliente, produto, vendedora, nº" enterkeyhint="search" autocomplete="off" style="flex:1;min-width:160px"><button class="chip" onclick="carregar()">Aplicar</button><button class="chip" onclick="atualizarAgora()">🔄 Atualizar</button></div>
    <div id="msgBusca" class="ic" style="white-space:normal;margin-top:6px"></div>
    <div id="msgAtu" style="margin-top:4px"></div>
    <div class="ic" style="white-space:normal;margin-top:6px">Margem bruta = lucro ÷ faturamento; markup = lucro ÷ custo. Só dos itens cujo produto tem preço de compra (custo) no cadastro. Itens sem custo aparecem à parte, para saber se a margem está completa.</div></div>
  <div class="kpis" id="kpis"><div class="vazio"><div class="spin"></div></div></div>
  <div class="card" id="cliCard" style="display:none"></div>
  <div class="card" style="overflow-x:auto"><table id="tab" style="width:100%;border-collapse:collapse;font-size:13px;min-width:560px"></table><div id="cards"></div></div>
  <div class="card"><h3>Faturamento sem custo (maiores)</h3><div id="semCusto"></div></div>
</div>
<script>
const B = location.protocol.indexOf("http") === 0 ? "" : "https://app.b13bebidas.com.br";
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const brl = n => Number(n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }), pct = v => v == null ? "—" : String(v).replace(".", ",") + "%";
const hoje = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);
let D = null;
let _seq = 0;
async function carregar() {
  const _meu = ++_seq;
  parProd.style.display = fAg.value === "produto" ? "inline-flex" : "none";
  const q = new URLSearchParams({ ini: fIni.value, fim: fFim.value, agrupar: fAg.value, busca: fBusca.value.trim(), ordem: fOrdem.value, margemMax: fMax.value.trim(), so: fSo.value });
  const r = await fetch(B + "/api/margem-bruta?" + q, { headers: { "X-Auth-Token": (b13GetSession() || {}).token || "" } }); D = await r.json().catch(() => ({})); if (_meu !== _seq) return; // chegou uma resposta mais nova
  if (!r.ok) { kpis.innerHTML = `<div class="err">${esc(D.erro || "Não consegui carregar.")}</div>`; return; }
  const T = D.totais, k = (v, l, s) => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div><div class="s">${s || ""}</div></div>`;
  const F = D.faturamento || { total: T.fatCusto + T.fatSemCusto, pedidos: T.pedidos }, tk = F.pedidos ? F.total / F.pedidos : 0;
  kpis.innerHTML = `<div class="kpi" style="grid-column:1/-1;border-color:#2aa876"><div class="v" style="font-size:26px">${brl(F.total)}</div><div class="l">Faturamento total neste filtro</div><div class="s">${F.pedidos} pedido(s)${F.pedidos ? " · ticket médio " + brl(tk) : ""} · valor dos itens vendidos, sem o frete</div></div>` + k(pct(T.margem), "Margem bruta", brl(T.lucro) + " de lucro bruto") + k(pct(T.markup), "Markup", brl(T.lucro) + " acima do custo de " + brl(T.custo)) + k(brl(T.fatCusto), "Faturamento com custo", T.pedidos + " pedido(s)") + k(brl(T.custo), "Custo das mercadorias") + k(pct(T.coberturaPct), "Faturamento coberto por custo", brl(T.fatSemCusto) + " sem custo");
  atualizarMsgBusca(); blocoAtualizacao(); renderClientes();
  if (D.agrupar === "produto") { renderProdutos(); return; }
  cards.innerHTML = ""; tab.style.display = ""; tab.style.minWidth = ""; tab.parentElement.style.overflowX = "auto"; semCusto.parentElement.style.display = ""; // vindo de "Por produto" no celular: tira os cartões antigos e mostra a tabela
  const nome = { mes: "Mês", semana: "Semana", dia: "Dia", pedido: "Pedido" }[D.agrupar];
  tab.innerHTML = `<tr class="ic"><td>${nome}</td><td style="text-align:right">Pedidos</td><td style="text-align:right">Faturamento</td><td style="text-align:right">Custo</td><td style="text-align:right">Lucro bruto</td><td style="text-align:right">Margem</td><td style="text-align:right">Markup</td><td style="text-align:right">Sem custo</td></tr>` +
    (D.linhas.length ? "" : `<tr><td colspan="8" class="ic" style="white-space:normal;padding:10px 4px">Nenhum pedido nesse período${fBusca.value.trim() ? " para “" + esc(fBusca.value.trim()) + "”" : ""}.</td></tr>`) + D.linhas.map(l => `<tr style="border-top:1px solid #2a2660"><td>${l.pedidoId ? `<a href="/pedidos-vendas?pedido=${l.pedidoId}" style="color:#7fd0ff">${esc(l.rotulo)}</a>` : esc(l.rotulo)}</td><td style="text-align:right">${l.pedidos}</td><td style="text-align:right">${brl(l.fatCusto)}</td><td style="text-align:right">${brl(l.custo)}</td><td style="text-align:right"><b>${brl(l.lucro)}</b></td><td style="text-align:right"><b>${pct(l.margem)}</b></td><td style="text-align:right"><b>${pct(l.markup)}</b><div class="ic" style="white-space:nowrap">${brl(l.lucro)}</div></td><td style="text-align:right;color:#9a95c9">${brl(l.fatSemCusto)}</td></tr>`).join("");
  semCusto.innerHTML = D.semCusto.map(x => `<div class="lin"><span>${esc(x.nome)}</span><b>${brl(x.valor)}</b></div>`).join("") || `<div class="ic">Todos os itens vendidos têm custo.</div>`;
}
function renderProdutos() {
  const corM = m => m == null ? "#9a95c9" : m < 10 ? "#ff8aa3" : m < 20 ? "#ffd23f" : "#3ce88a";
  if (window.innerWidth < 720) { // celular: um cartão por produto
    tab.innerHTML = ""; tab.style.display = "none"; tab.parentElement.style.overflowX = "hidden";
    cards.innerHTML = `${D.produtos.map((x, k) => `<div class="pcard"><div class="n"><span>${esc(x.nome)}</span><span style="color:${corM(x.margem)}">${pct(x.margem)}<span class="ic" style="margin-left:5px">markup ${pct(x.markup)}</span></span></div>
      <div class="g3"><div><span>Venda</span><b>${x.precoVenda > 0 ? brl(x.precoVenda) : "—"}</b></div><div><span>Médio</span><b>${x.precoMedio != null ? brl(x.precoMedio) : "—"}</b></div>
        <div><span>Custo</span>${x.produtoId ? `<div class="ced"><input id="cu${k}" inputmode="decimal" value="${x.custoUn != null ? String(x.custoUn).replace(".", ",") : ""}" placeholder="—" onkeydown="if(event.key==='Enter')salvarCusto(${k})"><button onclick="salvarCusto(${k})">💾</button></div>` : "<b>—</b>"}</div>
