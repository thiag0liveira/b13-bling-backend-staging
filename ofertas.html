<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B13 Bebidas — Ofertas</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
  html,body{width:100vw;height:100vh;overflow:hidden}
  body{background:#0b0920;color:#fff}
  #fundo{position:fixed;inset:0;z-index:0;overflow:hidden;
    background-color:#181542;
    background-image:
      linear-gradient(180deg,rgba(12,10,36,.55) 0%,rgba(24,21,66,.30) 35%,rgba(24,21,66,.40) 100%),
      url('/loja-fundo'),
      linear-gradient(160deg,#2b2870 0%,#181542 55%,#0c0a24 100%);
    background-size:cover,cover,cover;
    background-position:center,center 22%,center;
    background-repeat:no-repeat,no-repeat,no-repeat}
  #fundo .topoEscuro{position:absolute;top:0;left:0;right:0;height:30%;background:linear-gradient(180deg,#0c0a24 0%,rgba(12,10,36,.7) 60%,transparent 100%)}
  #fundo .baixoEscuro{position:absolute;bottom:0;left:0;right:0;height:32%;background:linear-gradient(0deg,#0c0a24 0%,rgba(12,10,36,.75) 55%,transparent 100%)}
  #fundo .brilho{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45}
  #fundo .b1{width:340px;height:340px;background:#FF0082;top:-80px;left:-80px;animation:flutuar 14s ease-in-out infinite}
  #fundo .b2{width:420px;height:420px;background:#6228d7;bottom:-140px;right:-100px;animation:flutuar 18s ease-in-out infinite reverse}
  #fundo .b3{width:260px;height:260px;background:#00c8ff;top:40%;left:45%;opacity:.15;animation:flutuar 22s ease-in-out infinite}
  @keyframes flutuar{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-25px)}}
  #fundo .grao{position:absolute;inset:0;opacity:.05;background-image:
    radial-gradient(rgba(255,255,255,.9) 1px,transparent 1px);
    background-size:3px 3px}
  #fundo .vinheta{position:absolute;inset:0;box-shadow:inset 0 0 220px 60px rgba(0,0,0,.65)}
  /* LAYOUT (pensado para o monitor de 18", 1366x768 ou 1600x900; tudo em vh para caber em qualquer tela) */
  #app{position:relative;z-index:1;width:100vw;height:100vh;display:grid;grid-template-rows:11vh 1fr 9vh}
  .top{display:flex;align-items:center;gap:2vw;padding:0 3vw;border-bottom:.5vh solid #FF0082;background:linear-gradient(180deg,rgba(36,32,106,.95),rgba(26,22,80,.95))}
  .top img{height:7vh}
  .top .cat{flex:1;text-align:center;min-width:0}
  .top .cat small{display:inline-block;font-size:2.4vh;letter-spacing:.35vh;color:#1a1300;background:#ffd23f;font-weight:900;padding:.3vh 1.6vh;border-radius:.8vh;margin-bottom:.4vh;box-shadow:0 .4vh 1.2vh rgba(255,210,63,.35)}
  .top .cat b{display:block;font-size:5vh;letter-spacing:.2vh;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .hora{text-align:right;font-size:2vh;color:#cfcaf5;white-space:nowrap}.top .hora b{display:block;font-size:4.6vh;color:#fff}
  .palco{display:grid;grid-template-columns:42fr 58fr;gap:2vh;padding:2vh 3vw;min-height:0;overflow:hidden;transition:opacity .35s}
  .palco.so{grid-template-columns:1fr}
  .palco.saindo{opacity:0}
  .card{min-height:0;background:linear-gradient(160deg,rgba(31,26,85,.96),rgba(20,16,54,.96));border:.25vh solid #3a3480;border-radius:2vh;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 1vh 3vh rgba(0,0,0,.35)}
  .card .foto{flex:1 1 0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 55%,#ffffff 0%,#eeeaff 60%,#d6d0f7 100%);margin:1.2vh;border-radius:1.4vh;min-height:0;overflow:hidden}
  .card .foto img{max-height:92%;max-width:90%;object-fit:contain}
  .card .info{padding:0 1.6vh 1.4vh;display:flex;flex-direction:column}
  .card .nome{font-weight:800;font-size:2.9vh;line-height:1.15;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .emb{align-self:flex-start;margin-top:.5vh;background:#FF0082;color:#fff;font-weight:900;font-size:2.1vh;padding:.4vh 1vh;border-radius:.8vh}
  .preco{display:flex;align-items:flex-start;font-weight:900;color:#ffd23f;line-height:1;margin-top:.8vh}
  .preco .rs{font-size:3vh;margin:1vh .7vh 0 0;color:#fff}.preco .int{font-size:8.5vh}.preco .cent{font-size:4.2vh;margin-top:.6vh}
  .hero .nome{font-size:3.8vh}.hero .emb{font-size:2.4vh}
  .hero .preco .rs{font-size:4.4vh;margin-top:1.8vh}.hero .preco .int{font-size:15vh}.hero .preco .cent{font-size:7vh;margin-top:1.4vh}
  .hero .selo{position:absolute;top:2.2vh;left:2.2vh;background:#ffd23f;color:#1a1300;font-weight:900;font-size:2vh;padding:.8vh 1.6vh;border-radius:1vh;box-shadow:0 .5vh 1.5vh rgba(0,0,0,.4);z-index:2}
  .grade{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:2vh;min-height:0}
  .grade.n1{grid-template-columns:1fr;grid-template-rows:1fr}.grade.n2{grid-template-rows:1fr}
  .grade .card{flex-direction:row;align-items:stretch}
  .grade .card .foto{flex:0 0 44%}
  .grade .card .info{flex:1;justify-content:center;padding:1.2vh 1.6vh 1.2vh .4vh}
  .grade .card .nome{font-size:2.6vh;-webkit-line-clamp:3}
  .tagAtac{align-self:flex-start;margin-top:.8vh;border:.25vh solid #ffd23f;color:#ffd23f;font-weight:900;font-size:1.7vh;letter-spacing:.2vh;padding:.2vh .9vh;border-radius:.6vh}
  .hero .tagAtac{font-size:2.2vh}
  .porUn{font-size:1.9vh;color:#cfcaf5;font-weight:700;margin-top:.3vh}.hero .porUn{font-size:2.6vh}
  .fita{position:absolute;top:3.2vh;right:-5vh;transform:rotate(35deg);background:#ffd23f;color:#1a1300;font-weight:900;font-size:2.2vh;letter-spacing:.4vh;padding:.7vh 7vh;z-index:3;box-shadow:0 .5vh 1.5vh rgba(0,0,0,.4)}
  .vazio{grid-column:1/-1;display:flex;align-items:center;justify-content:center;color:#cfcaf5;font-size:3vh;text-align:center;line-height:1.5}
  .rodape{display:flex;align-items:center;gap:2vw;padding:0 calc(3vw + 30px) 0 3vw;background:rgba(18,15,44,.96);border-top:.25vh solid #2c2660;position:relative}
  .rodape .zap{display:flex;align-items:center;gap:1vh;font-size:3.2vh;font-weight:900;white-space:nowrap}.rodape .zap svg{width:3.6vh;height:3.6vh}.rodape .zap span{color:#3ce88a}
  .rodape .pags{flex:1;display:flex;gap:1vh;justify-content:center;align-items:center}
  .rodape .pags i{width:1.3vh;height:1.3vh;border-radius:50%;background:#3a3480;transition:all .3s}.rodape .pags i.on{width:4.5vh;border-radius:1vh;background:#FF0082}
  .rodape .dir{text-align:right;font-size:1.6vh;color:#9a95c9;line-height:1.5}
  .rodape .dir .lei{color:#cfcaf5;font-weight:700}
  .barra{position:absolute;left:0;top:-.6vh;height:.6vh;background:#FF0082;width:0}
  .barra.correndo{animation:corre linear forwards}
  @keyframes corre{from{width:0}to{width:100%}}
</style>
</head>
<body>
<div id="fundo">
  <div class="topoEscuro"></div>
  <div class="baixoEscuro"></div>
  <div class="brilho b1"></div>
  <div class="brilho b2"></div>
  <div class="brilho b3"></div>
  <div class="grao"></div>
  <div class="vinheta"></div>
</div>
<div id="app">
  <div class="top">
    <img src="/logo">
    <div class="cat"><small>🏷️ PREÇOS DE ATACADO</small><b id="cat">OFERTAS</b></div>
    <div class="hora"><span id="dia"></span><b id="relogio"></b></div>
  </div>
  <div class="palco" id="palco"></div>
  <div class="rodape">
    <div class="barra" id="barra"></div>
    <div class="zap"><svg viewBox="0 0 32 32" fill="#25D366"><path d="M16 3C9 3 3.3 8.7 3.3 15.7c0 2.4.7 4.7 1.9 6.7L3 29l6.8-2.1c1.9 1 4 1.6 6.2 1.6 7 0 12.7-5.7 12.7-12.7C28.7 8.7 23 3 16 3zm0 23.2c-2 0-3.9-.5-5.5-1.5l-.4-.2-4.1 1.3 1.3-4-.3-.4c-1.1-1.7-1.7-3.7-1.7-5.7 0-5.9 4.8-10.7 10.7-10.7 5.9 0 10.7 4.8 10.7 10.7 0 5.9-4.8 10.5-10.7 10.5zm5.9-8c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-2-1.8-2.3-.2-.3 0-.5.1-.7.1-.1.3-.4.5-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.2-.7-1.7-1-2.3-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1.1 2.8 1.2 3c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.9-.8 2.1-1.5.3-.7.3-1.4.2-1.5-.1-.1-.3-.2-.6-.4z"/></svg> Televendas <span>(31) 99971-9888</span></div>
    <div class="pags" id="pags"></div>
    <div class="dir">📍 Av. Brigadeiro Eduardo Gomes, 1668, Glória, BH · 📷 @b13_bebidas<br><b style="color:#ffd23f">Preços de atacado por unidade, na compra da caixa fechada.</b><br><span class="lei">Beba com moderação. Venda proibida para menores de 18 anos.</span></div>
  </div>
</div>
<button id="btnGravar" onclick="alternarGravacao()" style="position:fixed;bottom:10px;right:10px;z-index:5;background:rgba(0,0,0,.25);color:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.15);border-radius:50%;width:26px;height:26px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .2s,background .2s,color .2s;opacity:.5"
  onmouseover="this.style.opacity=1;this.style.background='rgba(0,0,0,.6)';this.style.color='#fff'"
  onmouseout="this.style.opacity=.5;this.style.background='rgba(0,0,0,.25)';this.style.color='rgba(255,255,255,.35)'"
  title="Gravar vídeo da tela">🎥</button>
<script>const BACKEND = location.protocol.indexOf("http") === 0 ? "" : "https://b13-bling-backend-production.up.railway.app";
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
let PRODUTOS = [];
// CACHE: a lista fica guardada na tela (abre na hora, funciona sem internet). A cada 30 min pergunta ao servidor
// se mudou (resposta mínima se não mudou); se mudou, redesenha. A rota não consulta o Bling.
const OF_KEY = "b13_ofertas_v1";
let OF_VERSAO = "";
function comTempoOf(url, ms) { const c = new AbortController(), t = setTimeout(() => c.abort(), ms); return fetch(url, { signal: c.signal }).then(r => { clearTimeout(t); if (!r.ok) throw new Error("http " + r.status); return r.json(); }); }
function carregarGuardado() { try { const s = JSON.parse(localStorage.getItem(OF_KEY) || "null"); if (s && s.produtos) { PRODUTOS = s.produtos; OF_VERSAO = s.versao || ""; } } catch (e) {} }
async function carregarProdutos() {
  try {
    const j = await comTempoOf(BACKEND + "/api/ofertas/produtos?versao=" + encodeURIComponent(OF_VERSAO), 30000);
    if (j.mesmo) return false;
    if (Array.isArray(j.produtos)) {
      PRODUTOS = j.produtos; OF_VERSAO = j.versao || "";
      try { localStorage.setItem(OF_KEY, JSON.stringify({ versao: OF_VERSAO, produtos: PRODUTOS, em: Date.now() })); } catch (e) {}
      return true;
    }
  } catch (e) {}
  return false;
}
// ===== VITRINE: uma categoria por página, 1 destaque + até 4; categorias pequenas juntas em "MAIS OFERTAS" =====
const TEMPO_PAGINA = 12000;
const embalagem = n => { const m = /\(([^)]+)\)/.exec(n || ""); if (m) return m[1].toUpperCase(); const v = /(\d+(?:[.,]\d+)?\s?(?:ML|L))\b/i.exec(n || ""); return v ? v[1].toUpperCase().replace(/\s/g, "") : ""; };
const semParenteses = n => String(n || "").replace(/\s*\([^)]*\)/, "");
const partes = v => { const [i, c] = Number(v || 0).toFixed(2).split("."); return { i: Number(i).toLocaleString("pt-BR"), c }; };
function cardOf(p, hero) {
  const v = partes(p.preco), e = embalagem(p.nome);
  const fardo = /fardo/i.test(p.nome || "");
  const porUn = p.un ? (hero ? `por unidade · ${fardo ? "fardo" : "caixa"} com ${p.un}` : `un. · ${fardo ? "fardo" : "cx"} c/ ${p.un}`) : "por unidade";
  return `<div class="card ${hero ? "hero" : ""}">${hero ? '<div class="selo">⭐ DESTAQUE</div><div class="fita">ATACADO</div>' : ""}
    <div class="foto"><img src="${esc(p.imagem)}" onerror="this.style.display='none'"></div>
    <div class="info"><div class="nome">${esc(semParenteses(p.nome))}</div>${e ? `<span class="emb">${esc(e)}</span>` : ""}
      <span class="tagAtac">ATACADO</span>
      <div class="preco"><span class="rs">R$</span><span class="int">${v.i}</span><span class="cent">,${v.c}</span></div><div class="porUn">${esc(porUn)}</div></div></div>`;
}
function embaralhar(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function montarPaginas() {
  const porCat = {}; PRODUTOS.forEach(p => (porCat[p.categoria || "OFERTAS"] ||= []).push(p));
  const pags = [], sobra = [];
  Object.keys(porCat).sort((a, b) => porCat[b].length - porCat[a].length).forEach(c => {
    const l = embaralhar(porCat[c].slice()); // a cada volta muda a ordem, e com ela o destaque
    for (let i = 0; i < l.length; i += 5) { const g = l.slice(i, i + 5); if (g.length >= 3) pags.push({ cat: c, itens: g }); else sobra.push(...g); }
  });
  for (let i = 0; i < sobra.length; i += 5) pags.push({ cat: "MAIS OFERTAS", itens: sobra.slice(i, i + 5) });
  return pags;
}
let PAGS = [], PI = 0;
function mostrarPagina() {
  const palco = document.getElementById("palco");
  if (!PAGS.length) {
    palco.className = "palco so"; document.getElementById("cat").textContent = "OFERTAS"; document.getElementById("pags").innerHTML = "";
    palco.innerHTML = `<div class="vazio">Preparando as ofertas…<br><span style="font-size:2vh;opacity:.8">as fotos dos produtos estão sendo carregadas; a tela tenta de novo sozinha a cada 2 minutos</span></div>`;
    return;
  }
  if (PI >= PAGS.length) { PAGS = montarPaginas(); PI = 0; }
  const pg = PAGS[PI], hero = pg.itens[0], resto = pg.itens.slice(1);
  palco.classList.add("saindo");
  setTimeout(() => {
    document.getElementById("cat").textContent = pg.cat;
    palco.className = "palco" + (resto.length ? "" : " so");
    palco.innerHTML = cardOf(hero, true) + (resto.length ? `<div class="grade n${resto.length}">${resto.map(p => cardOf(p)).join("")}</div>` : "");
    document.getElementById("pags").innerHTML = PAGS.map((_, i) => `<i class="${i === PI ? "on" : ""}"></i>`).join("");
    const b = document.getElementById("barra"); b.classList.remove("correndo"); void b.offsetWidth; b.style.animationDuration = TEMPO_PAGINA + "ms"; b.classList.add("correndo");
    PI++;
  }, 350);
}
// nome antigo mantido: o cache chama montarGrupos() quando a lista muda
function montarGrupos() { PAGS = montarPaginas(); PI = 0; mostrarPagina(); }
if (!window._trocaPag) window._trocaPag = setInterval(() => { if (PAGS.length) mostrarPagina(); }, TEMPO_PAGINA);
function relogio() { const d = new Date(); document.getElementById("relogio").textContent = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); document.getElementById("dia").textContent = d.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "2-digit" }); }
relogio(); setInterval(relogio, 20000);
async function iniciar() {
  carregarGuardado();
  if (PRODUTOS.length) montarGrupos(); else mostrarPagina();
  const mudou = await carregarProdutos();
  if (mudou || !PAGS.length) montarGrupos();
}
iniciar();
setInterval(async () => { if (await carregarProdutos()) montarGrupos(); }, 30 * 60 * 1000);
setInterval(async () => { if (!PRODUTOS.length && await carregarProdutos()) montarGrupos(); }, 2 * 60 * 1000);
// ATUALIZAÇÃO AUTOMÁTICA DA TELA (zero Bling): versão nova publicada -> recarrega; e 1x por dia num minuto
// sorteado entre 06:45 e 07:15 (telas nunca juntas). Só recarrega com o servidor respondendo (sem internet, ficaria em branco).
let OF_APP = null;
const OF_REC = "b13_ofertas_recarga_v1";
function ofMinuto() { let r = {}; try { r = JSON.parse(localStorage.getItem(OF_REC) || "{}"); } catch (e) {} if (r.minuto == null) { r.minuto = 405 + Math.floor(Math.random() * 31); try { localStorage.setItem(OF_REC, JSON.stringify(r)); } catch (e) {} } return r; }
async function ofConferirVersao() {
  let j; try { j = await comTempoOf(BACKEND + "/api/versao", 15000); } catch (e) { return; }
  if (!j || !j.commit) return;
  if (!OF_APP) { OF_APP = j.commit; return; }
  if (j.commit !== OF_APP) location.reload();
}
setInterval(async () => {
  const r = ofMinuto(), d = new Date(), m = d.getHours() * 60 + d.getMinutes(), hoje = d.toDateString();
  if (m >= r.minuto && m < r.minuto + 120 && r.ultimaDiaria !== hoje) {
    try { await comTempoOf(BACKEND + "/api/versao", 8000); } catch (e) { return; }
    r.ultimaDiaria = hoje; try { localStorage.setItem(OF_REC, JSON.stringify(r)); } catch (e) {}
    location.reload();
  }
}, 60 * 1000);
ofConferirVersao();
setInterval(ofConferirVersao, 15 * 60 * 1000);
let _gravador = null,
  _chunksGravacao = [];
async function alternarGravacao() {
  const btn = document.getElementById("btnGravar");
  if (_gravador && _gravador.state === "recording") {
    _gravador.stop();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        frameRate: 30
      },
      audio: false
    });
    _chunksGravacao = [];
    const candidatos = [{
      mime: "video/mp4;codecs=avc1",
      ext: "mp4"
    }, {
      mime: "video/mp4",
      ext: "mp4"
    }, {
      mime: "video/webm;codecs=vp9",
      ext: "webm"
    }, {
      mime: "video/webm",
      ext: "webm"
    }];
    const escolhido = candidatos.find(c => MediaRecorder.isTypeSupported(c.mime)) || {
      mime: "",
      ext: "webm"
    };
    _gravador = new MediaRecorder(stream, escolhido.mime ? {
      mimeType: escolhido.mime
    } : {});
    _gravador.ondataavailable = e => {
      if (e.data.size > 0) _chunksGravacao.push(e.data);
    };
    _gravador.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(_chunksGravacao, {
        type: escolhido.mime || "video/webm"
      });
      const a = document.createElement("a");
      a.download = "b13_ofertas." + escolhido.ext;
      a.href = URL.createObjectURL(blob);
      a.click();
      btn.textContent = "🎥";
      btn.style.background = "rgba(0,0,0,.25)";
    };
    // se o usuário parar de compartilhar pelo próprio navegador, encerra a gravação também
    stream.getVideoTracks()[0].onended = () => {
      if (_gravador && _gravador.state === "recording") _gravador.stop();
    };
    _gravador.start();
    btn.textContent = "⏹";
    btn.style.background = "rgba(150,0,0,.4)";
  } catch (e) {/* usuário cancelou a seleção de tela */}
}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
async function exportarImagem(){
  html2canvas(document.body,{backgroundColor:"#181542",scale:2,useCORS:true,width:document.documentElement.clientWidth,height:document.documentElement.clientHeight,windowWidth:document.documentElement.clientWidth,windowHeight:document.documentElement.clientHeight}).then(canvas=>{
    const a=document.createElement("a");
    a.download="b13_ofertas.png";
    a.href=canvas.toDataURL("image/png");
    a.click();
  });
}
</script>
</body>
</html>
