function metaMudou() { try { localStorage.setItem("b13meta", JSON.stringify({ v: document.getElementById("meta").value, t: document.getElementById("metaTipo").value, a: document.getElementById("metaArred").value })); } catch (e) {} clearTimeout(metaMudou._t); metaMudou._t = setTimeout(render, 200); }
async function usarMeta(id) { const i = D.itens.find(x => x.id === id), a = alvoPreco(i.custo); if (!a) return; const { ok, j } = await api("/api/tabela-varejo/item/" + id, { method: "PUT", body: JSON.stringify({ precoNovo: a }) }); if (!ok) { avisar(j.erro || "Não consegui usar."); return; } Object.assign(i, j.item); atualizarLinha(i); barras(); }
async function usarMetaGrupo(gid) { const a = alvoPreco(agg(membrosDe(gid)).cmax); if (!a) return; const { ok, j } = await api("/api/tabela-varejo/grupos/" + gid + "/valores", { method: "PUT", body: JSON.stringify({ precoNovo: a }) }); if (!ok) { avisar(j.erro || "Não consegui usar."); return; } j.itens.forEach(n => { const i = D.itens.find(x => x.id === n.id); if (i) Object.assign(i, n); }); atualizarGrupo(gid); barras(); }
// lista o que está abaixo da meta (na lista que está na tela) e grava os preços sugeridos como RASCUNHO
let SUG = [];
function sugerirPrecos() { const m = metaCfg(); if (!m) { avisar("Informe a meta primeiro (ex.: 25 e escolha margem ou markup)."); document.getElementById("meta").focus(); return; }
  SUG = []; entradas(filtrados()).forEach(e => { if (e.tipo === "g") { const a = agg(e.ms), alvo = alvoPreco(a.cmax), atual = a.pv || (a.pvs.length ? Math.min(...a.pvs) : null); if (alvo && atual && abaixoDaMeta(a.cmax, atual)) SUG.push({ nome: "🍓 " + e.g.nome + " (" + e.ms.length + ")", custo: a.cmax, atual, alvo, ids: e.ms.map(x => x.id) }); } else { const i = e.i, pv = precoVar(i), alvo = alvoPreco(i.custo); if (alvo && pv > 0 && abaixoDaMeta(i.custo, pv)) SUG.push({ nome: i.nome, custo: i.custo, atual: pv, alvo, ids: [i.id] }); } });
  const nome = m.tipo === "margem" ? "margem" : "markup", tot = SUG.reduce((a, x) => a + x.ids.length, 0);
  if (!SUG.length) { janela(`<h3 style="margin:0 0 6px">💡 Sugerir preços</h3><div class="ic" style="white-space:normal">Nenhum produto da lista atual está abaixo da meta de ${String(m.v).replace(".", ",")}% de ${nome}. (Produtos sem custo ou sem preço não entram.)</div><button class="btn btn-ghost" style="width:100%;margin-top:10px" onclick="fechar()">Fechar</button>`); return; }
  janela(`<h3 style="margin:0 0 4px">💡 Sugerir preços para ${String(m.v).replace(".", ",")}% de ${nome}</h3><div class="ic" style="white-space:normal;margin-bottom:6px">${SUG.length} item(ns) da lista atual estão abaixo da meta (${tot} produto(s)). Os preços abaixo viram <b>rascunho</b>: você revisa e só vai ao Bling quando aplicar com o QR. Grupos de sabores usam o sabor de <b>maior custo</b>, para nenhum ficar abaixo da meta.</div>
    <div style="max-height:46vh;overflow:auto">${SUG.slice(0, 300).map((x, k) => `<label style="display:flex;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid #221e4f"><input type="checkbox" id="sg${k}" checked style="width:15px;height:15px;margin:0"><span style="min-width:0;flex:1"><b style="font-size:12px">${esc(x.nome)}</b><br><span class="ic">custo ${num2(x.custo)} · ${brl(x.atual)} → <b style="color:#fff">${brl(x.alvo)}</b></span></span><span class="ic" style="text-align:right;white-space:nowrap">margem ${fmtPct(pctM(x.atual, x.custo))} → <b style="color:#fff">${fmtPct(pctM(x.alvo, x.custo))}</b><br>markup ${fmtPct(pctK(x.atual, x.custo))} → <b style="color:#fff">${fmtPct(pctK(x.alvo, x.custo))}</b></span></label>`).join("")}${SUG.length > 300 ? `<div class="ic">…e mais ${SUG.length - 300}. Filtre por categoria para ver todos.</div>` : ""}</div>
    <div id="sgMsg" style="margin-top:8px"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-ghost" style="flex:1" onclick="fechar()">Cancelar</button><button class="btn btn-mag" style="flex:1" onclick="gravarSugestoes()">Gravar como rascunho</button></div>`); }
async function gravarSugestoes() { const escolhidos = SUG.slice(0, 300).filter((x, k) => document.getElementById("sg" + k).checked); if (!escolhidos.length) { document.getElementById("sgMsg").innerHTML = '<div class="err">Marque pelo menos um.</div>'; return; }
  const itens = []; escolhidos.forEach(x => x.ids.forEach(id => itens.push({ id, preco: x.alvo }))); const { ok, j } = await api("/api/tabela-varejo/rascunhos", { method: "POST", body: JSON.stringify({ itens }) }); if (!ok) { document.getElementById("sgMsg").innerHTML = `<div class="err">${esc(j.erro || "Não consegui gravar.")}</div>`; return; }
  fechar(); await carregar(); avisar(`${j.gravados} preço(s) sugerido(s) gravado(s) como rascunho. Revise e toque em "Aplicar no Bling" na barra de baixo.`, true); }
// ---------- aplicar no Bling ----------
function abrirAplicar() { const L = D.itens.filter(i => i.precoNovo && i.precoNovo !== i.precoVarejo);
  janela(`<h3 style="margin:0 0 4px">Aplicar no Bling</h3><div class="ic" style="white-space:normal;margin-bottom:6px">Estes preços de varejo vão substituir os do Bling. Leia o QR do dia (gerente, financeiro ou admin).</div>
    <div style="max-height:44vh;overflow:auto">${L.map(i => `<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #221e4f"><span style="min-width:0"><b>${esc(i.nome)}</b><br><span class="ic">${brl(i.precoVarejo)} → <b style="color:#fff">${brl(i.precoNovo)}</b></span></span><span style="text-align:right;white-space:nowrap" class="ic">margem ${fmtPct(pctM(i.precoVarejo, i.custo))} → <b style="color:#fff">${fmtPct(pctM(i.precoNovo, i.custo))}</b><br>markup ${fmtPct(pctK(i.precoVarejo, i.custo))} → <b style="color:#fff">${fmtPct(pctK(i.precoNovo, i.custo))}</b>${i.custo > 0 ? `<br>lucro ${rs(i.precoVarejo - i.custo)} → <b style="color:#fff">${rs(i.precoNovo - i.custo)}</b>` : ""}</span></div>`).join("")}</div>
    <input id="qr" type="password" placeholder="QR de autorização do dia" style="margin-top:8px" onkeydown="if(event.key==='Enter')aplicar()"><div id="apMsg" style="margin-top:8px"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-ghost" style="flex:1" onclick="fechar()">Cancelar</button><button class="btn btn-mag" style="flex:1" onclick="aplicar()">Aplicar ${L.length}</button></div>`); setTimeout(() => document.getElementById("qr").focus(), 60); }
async function aplicar() { const qr = document.getElementById("qr").value.trim(), msg = document.getElementById("apMsg"); if (!qr) { msg.innerHTML = '<div class="err">Leia o QR de autorização.</div>'; return; }
  let ids = D.itens.filter(i => i.precoNovo && i.precoNovo !== i.precoVarejo).map(i => i.id), feitos = 0, falhas = [];
  while (ids.length) { const lote = ids.splice(0, 20); msg.innerHTML = `<div class="ic">⏳ Enviando ao Bling… ${feitos + falhas.length} de ${feitos + falhas.length + lote.length + ids.length}</div>`;
    const { ok, j } = await api("/api/tabela-varejo/aplicar-bling", { method: "POST", body: JSON.stringify({ ids: lote, tokenQr: qr }) }); if (!ok) { msg.innerHTML = `<div class="err">${esc(j.erro || "Não consegui aplicar.")}</div>`; return; }
    (j.resultados || []).forEach(r => { if (r.ok) feitos++; else falhas.push(r); }); }
  await carregar(); msg.innerHTML = `<div style="color:#3ce88a;font-weight:800">✅ ${feitos} preço(s) aplicado(s) no Bling.</div>${falhas.length ? `<div class="err" style="white-space:normal">${falhas.length} não passaram: ${falhas.map(f => esc(f.erro)).join("; ")}</div>` : ""}`; setTimeout(() => { if (!falhas.length) fechar(); }, 1400); }
function descartar() { janela(`<h3 style="margin:0 0 6px">Descartar rascunhos?</h3><div class="ic" style="white-space:normal">Os preços de varejo alterados aqui voltam para os do Bling. Nada foi enviado ao Bling.</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-ghost" style="flex:1" onclick="fechar()">Voltar</button><button class="btn btn-mag" style="flex:1" onclick="descartar2()">Descartar</button></div>`); }
async function descartar2() { await api("/api/tabela-varejo/descartar-rascunhos", { method: "POST", body: "{}" }); fechar(); await carregar(); }
function baixarCsv() { fetch(B + "/api/tabela-varejo.csv", { headers: { "X-Auth-Token": token() } }).then(r => r.blob()).then(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "analise_de_precos.csv"; a.click(); }); }
try { const mt = JSON.parse(localStorage.getItem("b13meta") || "null"); if (mt) { document.getElementById("meta").value = mt.v || ""; if (mt.t) document.getElementById("metaTipo").value = mt.t; if (mt.a) document.getElementById("metaArred").value = mt.a; } } catch (e) {}
carregar();
</script>
</body>
