<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B13 — Venda Atacado</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
  :root{--mag:#FF0082;--indigo:#181542;--bg:#0f0d24}
  body{background:var(--bg);color:#fff}
  #app{max-width:900px;margin:0 auto;min-height:100vh}
  .top{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#2b2870,#262366);display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:3px solid var(--mag)}
  .top img{height:38px}.top .t{font-weight:900;font-size:17px}.top .sp{flex:1}
  .wrap{padding:14px}
  .card{background:#151233;border:1px solid #2c2660;border-radius:14px;padding:14px;margin-bottom:12px}
  .muted{color:#9a95c9;font-size:13px}
  .btn{border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:13px;padding:11px 14px;color:#fff}
  .btn-mag{background:var(--mag)}.btn-grn{background:#2f9e6b}.btn-ghost{background:#1c1846}.btn-out{background:transparent;border:2px solid #514c96;color:#fff}
  .btn-wa{background:#25d366;color:#0a2a1a}
  .btn:disabled{opacity:.4;cursor:default}
  input,select{padding:11px;border-radius:9px;border:2px solid #514c96;background:#0f0d24;color:#fff;font-size:14px;width:100%}
  input:focus,select:focus{outline:none;border-color:var(--mag)}
  label{font-size:12px;color:#9a95c9;display:block;margin-bottom:3px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row>*{flex:1;min-width:120px}
  .seg{display:flex;gap:6px;background:#0f0d24;border-radius:10px;padding:4px}
  .seg button{flex:1;padding:10px;border:none;border-radius:8px;background:transparent;color:#9a95c9;font-weight:800;cursor:pointer;font-size:13px}
  .seg button.on{background:var(--mag);color:#fff}
  .prod{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid #23204f}
  .prod img{width:44px;height:44px;object-fit:cover;border-radius:7px;background:#241f52;flex-shrink:0}
  .prod .semf{width:44px;height:44px;border-radius:7px;background:#241f52;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #23204f}
  .qtd{display:flex;align-items:center;gap:6px}
  .qtd button{width:32px;height:32px;border-radius:8px;border:none;background:#1c1846;color:#fff;font-size:18px;font-weight:900;cursor:pointer}
  .qtd input{width:52px;text-align:center;padding:6px}
  .badge{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:800}
  .badge-at{background:#0a2a1a;color:#3ce88a}.badge-bl{background:#2a1f00;color:#ffd23f}
</style>
<script src="/nav.js"></script>
<style>
  @media(min-width:900px){
    #b13nav{transform:translateX(0%) !important}
    button[onclick="b13ToggleNav()"]{display:none !important}
    body > *:not(#b13nav):not([onclick="b13ToggleNav()"]):not(#b13navOverlay){ margin-left:200px }
  }
</style>
</head>
<body><script>
  (function(){
    if(typeof b13RequireLogin==="function" && !b13RequireLogin()) return;
    document.addEventListener("DOMContentLoaded",function(){
      const nav=document.createElement("div");
      nav.innerHTML=b13RenderNav("/venda-atacado");
      document.body.insertBefore(nav,document.body.firstChild);
    });
  })();
</script>
<div id="app"></div>
<script>
const B=(location.protocol.indexOf("http")===0)?"":"https://b13-bling-backend-production.up.railway.app";
const esc=(s)=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const brl=(v)=>"R$ "+(+v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const soDig=(s)=>String(s??"").replace(/\D/g,"");
let FUNC=null;
try{ if(typeof b13GetSession==="function"){ FUNC=b13GetSession(); } }catch(e){}

const S={
  tipo:"proposta",      // proposta | pedido
  cliente:null,         // {id,nome,documento,telefone,...}
  editandoCliente:false,
  itens:[],             // {produtoId,nome,valor,quantidade,imagem,origemPreco}
  observacao:"",
  vendedorId:null, vendedorNome:"",
  buscaProd:"", resultadosProd:[],
  analise:null, carregandoAnalise:false,
  novos:[], carregandoNovos:false, novosSelecionados:{},
  compraSelecionados:{}, minComprados:false, minNovos:false,
  modoTabela:false, tabelaCompleta:null, buscaTabela:"",
  rascunhoId:null, salvandoRascunho:false, ultimoSalvo:null,
  msg:"",
};

// resolve vendedor do funcionário logado
(async()=>{
  if(FUNC?.id){
    try{ const j=await fetch(B+"/api/atacado/vendedor/"+FUNC.id).then(r=>r.json());
      S.vendedorId=j.vendedorId; S.vendedorNome=j.vendedorNome||FUNC.nome||""; render();
    }catch(e){}
  }
})();

function total(){ return S.itens.reduce((s,i)=>s+Number(i.valor||0)*Number(i.quantidade||0),0); }

// AUTO-SAVE: salva a proposta como "em digitação" de tempos em tempos, pra não perder o trabalho.
let _autoSaveT=null;
function agendarAutoSave(){
  clearTimeout(_autoSaveT);
  _autoSaveT=setTimeout(salvarRascunho,2500); // salva 2.5s depois da última mudança
}
async function salvarRascunho(){
  // só salva se já tem cliente e ao menos um item (senão não há o que guardar)
  if(!S.cliente?.id || !S.itens.length) return;
  S.salvandoRascunho=true; atualizarStatusSalvo();
  try{
    const payload={
      id:S.rascunhoId, tipo:S.tipo, status:"em_digitacao",
      cliente:S.cliente, itens:S.itens, observacao:S.observacao,
      vendedorId:S.vendedorId, vendedorNome:S.vendedorNome,
      funcionarioId:FUNC?.id, funcionarioNome:FUNC?.nome,
    };
    const j=await fetch(B+"/api/atacado/propostas",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).then(r=>r.json());
    if(j.data?.id){ S.rascunhoId=j.data.id; S.ultimoSalvo=new Date(); }
  }catch(e){}
  S.salvandoRascunho=false; atualizarStatusSalvo();
}
function atualizarStatusSalvo(){
  const el=document.getElementById("statusSalvo");
  if(!el) return;
  if(S.salvandoRascunho){ el.textContent="💾 Salvando…"; }
  else if(S.ultimoSalvo){ el.textContent="✅ Rascunho salvo "+S.ultimoSalvo.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }
  else el.textContent="";
}

async function carregarAnalise(){
  if(!S.cliente?.id){ S.analise=null; return; }
  S.carregandoAnalise=true; render();
  try{
    const j=await fetch(B+"/api/atacado/cliente/"+S.cliente.id+"/analise").then(r=>r.json());
    S.analise=j.erro?null:j;
  }catch(e){ S.analise=null; }
  S.carregandoAnalise=false; render();
  carregarNovos();
}

async function carregarNovos(){
  if(S.novos.length) return; // já carregou nesta sessão
  S.carregandoNovos=true;
  try{
    const j=await fetch(B+"/api/atacado/produtos-novos?qtd=5").then(r=>r.json());
    S.novos=j.data||[];
  }catch(e){ S.novos=[]; }
  S.carregandoNovos=false; render();
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML=`
    <div class="top">
      <button onclick="b13ToggleNav()" style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer">☰</button>
      <img src="/logo"><div class="t">🛒 Venda Atacado</div><div class="sp"></div>
      <button class="btn btn-ghost" style="font-size:12px" onclick="location.href='/tabela-imagem'">📋 Ver tabela</button>
      <a href="/propostas" class="btn btn-ghost" style="text-decoration:none;font-size:12px">📄 Ver propostas</a>
    </div>
    <div class="wrap">
      <div class="card">
        <div class="seg" style="margin-bottom:10px">
          <button class="${S.tipo==='proposta'?'on':''}" onclick="S.tipo='proposta';render()">📄 Proposta comercial</button>
          <button class="${S.tipo==='pedido'?'on':''}" onclick="S.tipo='pedido';render()">🛒 Pedido de venda</button>
        </div>
        <div class="muted">${S.tipo==='proposta'?'Orçamento — fica salvo no sistema; depois você pode gerar o pedido.':'Cria o pedido de venda direto no Bling (status aguardando separação).'}</div>
      </div>

      ${cardCliente()}
      ${S.cliente&&!S.editandoCliente?cardAnalise():''}
      ${S.cliente&&!S.editandoCliente?cardNovos():''}
      ${S.cliente?cardProdutos():''}
      ${S.cliente&&S.itens.length?cardResumo():''}
      ${S.msg?`<div class="card" style="border-color:${S.msg.startsWith('✅')?'#2f9e6b':'#e5563f'}">${esc(S.msg)}</div>`:''}
    </div>`;
  atualizarStatusSalvo();
}

/* ---------- CLIENTE ---------- */
function cardCliente(){
  if(S.cliente&&!S.editandoCliente){
    const c=S.cliente;
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-weight:800">👤 ${esc(c.nome)}</div>
        <button class="btn btn-ghost" style="font-size:12px;padding:6px 10px" onclick="S.editandoCliente=true;render()">Editar</button>
      </div>
      <div class="muted" style="margin-top:4px">${esc(c.documento||'')}${c.telefone?' · '+esc(c.telefone):''}</div>
      <button class="btn btn-out" style="margin-top:10px;font-size:12px" onclick="trocarCliente()">🔄 Trocar cliente</button>
    </div>`;
  }
  if(S.editandoCliente) return cardFormCliente();
  // busca inicial
  return `<div class="card">
    <label>Buscar cliente por CPF / CNPJ</label>
    <div class="row">
      <input id="docBusca" placeholder="Digite o CPF ou CNPJ" inputmode="numeric" style="flex:3"
        onkeydown="if(event.key==='Enter')buscarCliente()">
      <button class="btn btn-mag" style="flex:1;min-width:100px" onclick="buscarCliente()">🔍 Buscar</button>
    </div>
    <div id="buscaClienteMsg" class="muted" style="margin-top:8px"></div>
  </div>`;
}

function cardFormCliente(){
  const c=S.cliente||{};
  const e=c.endereco||{};
  return `<div class="card">
    <div style="font-weight:800;margin-bottom:10px">${c.id?'✏️ Editar cliente':'🆕 Novo cliente'}</div>
    <div class="row" style="margin-bottom:8px">
      <div style="flex:2"><label>Nome / Razão social *</label><input id="cNome" value="${esc(c.nome||'')}"></div>
      <div><label>CPF / CNPJ *</label><input id="cDoc" value="${esc(c.documento||'')}" inputmode="numeric" ${c.id?'readonly':''}></div>
    </div>
    <div class="row" style="margin-bottom:8px">
      <div><label>Telefone / WhatsApp</label><input id="cTel" value="${esc(c.telefone||'')}" inputmode="numeric"></div>
      <div><label>E-mail</label><input id="cEmail" value="${esc(c.email||'')}"></div>
    </div>
    <div class="row" style="margin-bottom:8px">
      <div style="flex:2"><label>Rua</label><input id="cRua" value="${esc(e.rua||'')}"></div>
      <div><label>Número</label><input id="cNum" value="${esc(e.numero||'')}"></div>
    </div>
    <div class="row" style="margin-bottom:8px">
      <div><label>Bairro</label><input id="cBairro" value="${esc(e.bairro||'')}"></div>
      <div><label>Cidade</label><input id="cCidade" value="${esc(e.cidade||'')}"></div>
      <div style="max-width:80px"><label>UF</label><input id="cUf" value="${esc(e.uf||'MG')}" maxlength="2"></div>
    </div>
    <div class="row">
      <button class="btn btn-grn" onclick="salvarCliente()">💾 Salvar cliente</button>
      <button class="btn btn-ghost" style="flex:0;min-width:100px" onclick="S.editandoCliente=false;if(!S.cliente?.id)S.cliente=null;render()">Cancelar</button>
    </div>
  </div>`;
}

async function buscarCliente(){
  const doc=soDig(document.getElementById("docBusca").value);
  const msg=document.getElementById("buscaClienteMsg");
  if(doc.length!==11&&doc.length!==14){ msg.textContent="Digite um CPF (11) ou CNPJ (14 dígitos)."; return; }
  msg.textContent="Buscando…";
  try{
    const j=await fetch(B+"/api/contatos?doc="+doc).then(r=>r.json());
    if(j.encontrado&&j.contato){
      S.cliente=j.contato; S.editandoCliente=false; S.analise=null; render(); carregarAnalise();
    }else{
      // não existe: abre form pra cadastrar novo já com o documento
      S.cliente={documento:doc, endereco:{uf:"MG"}}; S.editandoCliente=true; render();
    }
  }catch(e){ msg.textContent="Erro ao buscar."; }
}

async function salvarCliente(){
  const doc=soDig(document.getElementById("cDoc").value);
  const nome=document.getElementById("cNome").value.trim();
  if(!nome){ alert("Informe o nome."); return; }
  if(doc.length!==11&&doc.length!==14){ alert("CPF ou CNPJ inválido."); return; }
  const payload={
    id:S.cliente?.id||null, documento:doc, nome,
    telefone:document.getElementById("cTel").value.trim(),
    email:document.getElementById("cEmail").value.trim(),
    endereco:{
      rua:document.getElementById("cRua").value.trim(), numero:document.getElementById("cNum").value.trim(),
      bairro:document.getElementById("cBairro").value.trim(), cidade:document.getElementById("cCidade").value.trim(),
      uf:document.getElementById("cUf").value.trim()||"MG",
    },
  };
  S.msg="";
  try{
    const j=await fetch(B+"/api/atacado/cliente",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).then(r=>r.json());
    if(j.erro){ alert(j.erro); return; }
    S.cliente={id:j.id,nome:j.nome,documento:j.documento,telefone:payload.telefone,email:payload.email,endereco:payload.endereco};
    S.editandoCliente=false; render(); carregarAnalise();
  }catch(e){ alert("Erro ao salvar cliente."); }
}

function trocarCliente(){ S.cliente=null; S.editandoCliente=false; S.itens=[]; S.analise=null; S.novosSelecionados={}; S.compraSelecionados={}; render(); }

/* ---------- ANÁLISE DO CLIENTE (Fase 2) ---------- */
function cardAnalise(){
  if(S.carregandoAnalise) return `<div class="card"><div class="muted">📊 Analisando histórico do cliente…</div></div>`;
  const a=S.analise;
  if(!a) return '';
  if(!a.qtdPedidos) return `<div class="card"><div class="muted">📊 Cliente sem compras anteriores registradas.</div></div>`;
  const ultima=a.ultimaCompra?a.ultimaCompra.split('-').reverse().join('/'):'—';
  const mesesTxt=(a.gastoPorMes||[]).map(m=>{
    const [ano,mes]=m.mes.split('-');
    const nomeMes=["","jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"][+mes];
    return `<span style="display:inline-block;background:#0f0d24;border:1px solid #2c2660;border-radius:6px;padding:4px 8px;margin:2px;font-size:11px">${nomeMes}/${ano.slice(2)}: <b style="color:#ffd23f">${brl(m.valor)}</b></span>`;
  }).join("");
  const sugestoes=(a.maisComprados||[]).slice(0,8);
  return `<div class="card">
    <div style="font-weight:800;margin-bottom:8px">📊 Histórico do cliente</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <div style="flex:1;min-width:100px;background:#0f0d24;border-radius:10px;padding:10px;text-align:center">
        <div class="muted" style="font-size:11px">Total gasto</div><div style="font-weight:900;color:#3ce88a">${brl(a.totalGasto)}</div>
      </div>
      <div style="flex:1;min-width:100px;background:#0f0d24;border-radius:10px;padding:10px;text-align:center">
        <div class="muted" style="font-size:11px">Pedidos</div><div style="font-weight:900">${a.qtdPedidos}</div>
      </div>
      <div style="flex:1;min-width:100px;background:#0f0d24;border-radius:10px;padding:10px;text-align:center">
        <div class="muted" style="font-size:11px">Média/pedido</div><div style="font-weight:900;color:#ffd23f">${brl(a.media)}</div>
      </div>
      <div style="flex:1;min-width:100px;background:#0f0d24;border-radius:10px;padding:10px;text-align:center">
        <div class="muted" style="font-size:11px">Última compra</div><div style="font-weight:900">${ultima}</div>
      </div>
    </div>
    ${mesesTxt?`<div class="muted" style="font-size:12px;margin-bottom:4px">Gasto por mês:</div><div style="margin-bottom:10px">${mesesTxt}</div>`:''}
    ${sugestoes.length?`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div class="muted" style="font-size:12px">🔁 Produtos que costuma comprar:</div>
        <div style="display:flex;gap:6px">
          ${Object.values(S.compraSelecionados).filter(Boolean).length?`<button class="btn btn-wa" style="font-size:11px;padding:6px 10px" onclick="enviarSugestoesWhats()">📱 Sugerir ${Object.values(S.compraSelecionados).filter(Boolean).length}</button>`:''}
          <button class="btn btn-ghost" style="font-size:11px;padding:6px 10px" onclick="S.minComprados=!S.minComprados;render()">${S.minComprados?'▼ Expandir':'▲ Minimizar'}</button>
        </div>
      </div>
      ${S.minComprados?'':`<div style="display:flex;flex-direction:column;gap:2px">${sugestoes.map(compraRow).join("")}</div>`}
      `:''}
  </div>`;
}

function compraRow(s){
  const sel=!!S.compraSelecionados[s.produtoId];
  const jaTem=S.itens.some(i=>String(i.produtoId)===String(s.produtoId));
  const origem=s.origemPreco==='atacado'?'Atacado':'Bling';
  return `<div class="prod" style="${sel?'background:rgba(37,211,102,.12);border-radius:8px':''}">
    <div onclick="toggleCompra('${s.produtoId}')" style="cursor:pointer;display:flex;align-items:center;gap:10px;flex:1;min-width:0">
      <div style="width:22px;height:22px;border-radius:5px;border:2px solid ${sel?'#25d366':'#514c96'};background:${sel?'#25d366':'transparent'};display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:#0a2a1a;font-weight:900">${sel?'✓':''}</div>
      ${s.imagem?`<img src="${esc(s.imagem)}" style="width:38px;height:38px">`:`<div class="semf" style="width:38px;height:38px;font-size:18px">📦</div>`}
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:700">${esc(s.nome)}</div>
        <div style="margin-top:2px">
          <span class="badge ${s.origemPreco==='atacado'?'badge-at':'badge-bl'}">${origem}</span>
          <b style="color:#ffd23f;margin-left:6px">${brl(s.preco)}</b>
          <span class="muted" style="font-size:11px;margin-left:6px">(${s.emPedidos||s.vezes} de ${S.analise?.pedidosAnalisados||'?'} pedidos)</span>
        </div>
      </div>
    </div>
    <button class="btn ${jaTem?'btn-ghost':'btn-mag'}" style="font-size:12px;padding:8px 12px" ${jaTem?'disabled':''}
      onclick='addSugestao(${JSON.stringify({id:s.produtoId,nome:s.nome}).replace(/'/g,"&#39;")})'>${jaTem?'✓':'+ Add'}</button>
  </div>`;
}

function toggleCompra(id){ S.compraSelecionados[id]=!S.compraSelecionados[id]; render(); }

async function enviarSugestoesWhats(){
  const sel=(S.analise?.maisComprados||[]).filter(s=>S.compraSelecionados[s.produtoId]);
  if(!sel.length) return;
  const tel=await garantirTelefone();
  if(tel===false) return;
  const linhas=sel.map(s=>`• ${s.nome} — ${brl(s.preco)}`).join("\n");
  const msg=`*B13 Bebidas* 🍻\n\nOlá, ${S.cliente.nome}! Separei algumas sugestões pra você:\n\n${linhas}\n\nQuer que eu já separe? É só responder! 😉`;
  abrirWhats(tel,msg);
}

// adiciona um produto sugerido (busca preço/estoque/múltiplo ao vivo, igual a busca normal)
async function addSugestao(s){
  if(S.itens.some(i=>String(i.produtoId)===String(s.id))) return;
  S.msg="Buscando dados do produto…"; render();
  try{
    // usa a busca pelo nome pra pegar preço de atacado, múltiplo e estoque
    const j=await fetch(B+"/api/buscar-atacado?nome="+encodeURIComponent(s.nome)).then(r=>r.json());
    const p=(j.data||[]).find(x=>String(x.id)===String(s.id))||(j.data||[])[0];
    if(!p){ S.msg="Não encontrei os dados do produto."; render(); return; }
    await addItem({id:p.id,nome:p.nome,preco:p.preco??p.precoBling??0,imagem:p.imagem||"",origemPreco:p.origemPreco||'bling',multiplo:p.multiplo||1,estoque:p.estoque});
  }catch(e){ S.msg="Erro ao adicionar sugestão."; render(); }
}

/* ---------- PRODUTOS NOVOS (Fase 3) ---------- */
function cardNovos(){
  if(S.carregandoNovos) return `<div class="card"><div class="muted">✨ Buscando produtos novos…</div></div>`;
  if(!S.novos.length) return '';
  const selCount=Object.values(S.novosSelecionados).filter(Boolean).length;
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-weight:800">✨ Últimos produtos cadastrados</div>
      <div style="display:flex;gap:6px">

async function enviarNovidadesWhats(){
  const sel=S.novos.filter(p=>S.novosSelecionados[p.id]);
  if(!sel.length) return;
  // garante telefone
  const tel=await garantirTelefone();
  if(tel===false) return; // cancelou
  const linhas=sel.map(p=>`• ${p.nome} — ${brl(p.preco)}`).join("\n");
  const msg=`*Novidades — B13 Bebidas* ✨\n\nOlá, ${S.cliente.nome}! Chegaram produtos novos que podem te interessar:\n\n${linhas}\n\nQualquer coisa é só chamar! 🍻`;
  abrirWhats(tel,msg);
}

// garante que o cliente tem telefone; se não tiver, pede e salva no Bling. Retorna o número ou false se cancelar.
async function garantirTelefone(){
  let tel=soDig(S.cliente?.telefone||"");
  if(tel.length>=10) return tel;
  const novo=prompt("Este cliente não tem telefone/WhatsApp cadastrado. Digite o número (com DDD) pra salvar e enviar:");
  if(!novo) return false;
  const novoDig=soDig(novo);
  if(novoDig.length<10){ alert("Número inválido."); return false; }
  try{
    const j=await fetch(B+"/api/atacado/cliente/"+S.cliente.id+"/telefone",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({telefone:novoDig})}).then(r=>r.json());
    if(j.erro){ alert(j.erro); return false; }
    S.cliente.telefone=novoDig; // atualiza local
    return novoDig;
  }catch(e){ alert("Erro ao salvar telefone."); return false; }
}

function abrirWhats(tel,msg){
  const t=soDig(tel); const t55=t.length<=11?("55"+t):t;
  window.open("https://wa.me/"+t55+"?text="+encodeURIComponent(msg),"_blank");
}

let _prodT=null;
function buscarProdDebounce(v){ S.buscaProd=v; clearTimeout(_prodT); _prodT=setTimeout(buscarProd,350); }
async function buscarProd(){
  const t=S.buscaProd.trim();
  if(t.length<2){ S.resultadosProd=[]; render(); return; }
  try{
    const j=await fetch(B+"/api/buscar-atacado?nome="+encodeURIComponent(t)).then(r=>r.json());
    S.resultadosProd=(j.data||[]).map(p=>({id:p.id,nome:p.nome,preco:p.preco??p.precoBling??0,origemPreco:p.origemPreco||'bling',imagem:p.imagem||"",multiplo:p.multiplo||1,estoque:p.estoque}));
    // preserva o texto digitado sem re-renderizar o input inteiro
    document.getElementById("resultadosProd").innerHTML=S.resultadosProd.map(prodRow).join("");
  }catch(e){}
}

async function addItem(p){
  if(S.itens.some(i=>String(i.produtoId)===String(p.id))) return;
  const mult=Math.max(1,parseInt(p.multiplo)||1);
  let estoque=(p.estoque==null?null:Number(p.estoque));
  let imagem=p.imagem||"";
  // se falta estoque ou imagem, busca ao vivo agora (garante limite de qtd e foto)
  if(estoque==null||!imagem){
    try{ const j=await fetch(B+"/api/produto-estoque/"+p.id).then(r=>r.json()); if(estoque==null) estoque=(j.estoque==null?null:Number(j.estoque)); if(!imagem) imagem=j.imagem||""; }catch(e){}
  }
  if(estoque!=null&&estoque<mult){
    S.msg=`⚠️ ${p.nome} está sem estoque suficiente pra 1 fardo (estoque: ${estoque}, fardo: ${mult}).`;
    render(); return;
  }
  S.itens.push({produtoId:p.id,nome:p.nome,valor:+p.preco||0,quantidade:mult,imagem:imagem||"",origemPreco:p.origemPreco,multiplo:mult,estoque});
  S.msg=""; render(); agendarAutoSave();
}
// maior quantidade permitida = múltiplo do fardo que não passa do estoque
function maxPorEstoque(it){
  const mult=Math.max(1,parseInt(it.multiplo)||1);
  if(it.estoque==null) return Infinity;            // sem info de estoque, não limita
  return Math.max(mult,Math.floor(Number(it.estoque)/mult)*mult);
}
function mudarQtd(ix,d){
  const it=S.itens[ix]; const mult=Math.max(1,parseInt(it.multiplo)||1);
  let q=Math.max(mult,(+it.quantidade||mult)+d*mult);
  const max=maxPorEstoque(it);
  if(q>max){ q=max; S.msg=`⚠️ Estoque disponível de ${it.nome}: ${it.estoque} un (máx. ${max} respeitando o fardo de ${mult}).`; }
  else S.msg="";
  it.quantidade=q; render(); agendarAutoSave();
}
function setQtd(ix,v){
  const it=S.itens[ix]; const mult=Math.max(1,parseInt(it.multiplo)||1);
  let q=parseInt(v)||mult;
  q=Math.max(mult,Math.round(q/mult)*mult); // arredonda pro múltiplo mais próximo
  const max=maxPorEstoque(it);
  if(q>max){ q=max; S.msg=`⚠️ Estoque disponível de ${it.nome}: ${it.estoque} un (máx. ${max} respeitando o fardo de ${mult}).`; }
  else S.msg="";
  it.quantidade=q; render(); agendarAutoSave();
}
function removerItem(ix){ S.itens.splice(ix,1); render(); agendarAutoSave(); }

function fecharNota(){ document.getElementById("modalNota")?.remove(); }

function desenharNota(p){
  const itens=p.itens||[];
  const W=680, padd=28, headerH=120, itemH=40, footerH=90;
  const H=headerH+itens.length*itemH+footerH+30;
  const cv=document.getElementById("cvNota");
  const dpr=2; cv.width=W*dpr; cv.height=H*dpr; cv.style.width="100%";
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#262366"; ctx.fillRect(0,0,W,headerH-24);
  ctx.fillStyle="#FF0082"; ctx.fillRect(0,headerH-24,W,6);
  ctx.fillStyle="#fff"; ctx.font="900 28px Arial"; ctx.textAlign="left"; ctx.fillText("B13 BEBIDAS",padd,42);
  ctx.font="700 16px Arial"; ctx.fillStyle="#ffd23f";
  ctx.fillText(p.tipo==='pedido'?"Pedido de Venda":"Proposta Comercial",padd,68);
  ctx.font="13px Arial"; ctx.fillStyle="#cfc9f5"; ctx.fillText("Cliente: "+(p.cliente?.nome||"—"),padd,90);
  ctx.textAlign="right"; ctx.fillText(new Date().toLocaleDateString("pt-BR"),W-padd,42);
  if(p.vendedorNome) ctx.fillText("Vendedor: "+p.vendedorNome,W-padd,90);
  let y=headerH;
  ctx.font="700 12px Arial"; ctx.fillStyle="#888"; ctx.textAlign="left"; ctx.fillText("PRODUTO",padd,y);
  ctx.textAlign="center"; ctx.fillText("QTD",W-260,y);
  ctx.textAlign="right"; ctx.fillText("UNIT.",W-140,y); ctx.fillText("TOTAL",W-padd,y);
  y+=10; ctx.strokeStyle="#ddd"; ctx.beginPath(); ctx.moveTo(padd,y); ctx.lineTo(W-padd,y); ctx.stroke(); y+=6;
  itens.forEach(i=>{
    const qtd=Number(i.quantidade)||1, un=Number(i.valor)||0;
    ctx.fillStyle="#111"; ctx.font="14px Arial"; ctx.textAlign="left";
    let nome=i.nome||""; if(nome.length>34) nome=nome.slice(0,33)+"…";
    ctx.fillText(nome,padd,y+itemH/2);
    ctx.textAlign="center"; ctx.fillText(String(qtd),W-260,y+itemH/2);
    ctx.textAlign="right"; ctx.fillStyle="#555"; ctx.fillText(brl(un),W-140,y+itemH/2);
    ctx.fillStyle="#111"; ctx.font="700 14px Arial"; ctx.fillText(brl(un*qtd),W-padd,y+itemH/2);
    ctx.strokeStyle="#eee"; ctx.beginPath(); ctx.moveTo(padd,y+itemH); ctx.lineTo(W-padd,y+itemH); ctx.stroke();
    y+=itemH;
  });
  y+=10; ctx.fillStyle="#262366"; ctx.fillRect(padd,y,W-padd*2,44);
  ctx.fillStyle="#fff"; ctx.font="900 18px Arial"; ctx.textAlign="left"; ctx.fillText("TOTAL",padd+12,y+28);
  ctx.textAlign="right"; ctx.fillStyle="#ffd23f"; ctx.font="900 22px Arial"; ctx.fillText(brl(p.total),W-padd-12,y+29);
  y+=44;
  if(p.observacao){ y+=24; ctx.fillStyle="#555"; ctx.font="13px Arial"; ctx.textAlign="left"; ctx.fillText("Obs: "+p.observacao.slice(0,70),padd,y); }
  ctx.fillStyle="#9a95c9"; ctx.font="12px Arial"; ctx.textAlign="center"; ctx.fillText("B13 Bebidas · Obrigado pela preferência! 🍻",W/2,H-16);
}

function baixarNota(){
  const cv=document.getElementById("cvNota"); if(!cv) return;
  const a=document.createElement("a"); a.download="nota-b13.png"; a.href=cv.toDataURL("image/png"); a.click();
}
async function compartilharNota(){
  const cv=document.getElementById("cvNota"); if(!cv) return;
  let blob; try{ blob=await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(),"image/png")); }catch(e){ baixarNota(); return; }
  const file=new File([blob],"nota-b13.png",{type:"image/png"});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:"Nota B13"}); return; }catch(e){ if(e&&e.name==="AbortError") return; }
  }
  baixarNota(); alert("Imagem baixada — anexe no WhatsApp. 📎");
}

async function salvar(){
  if(!S.cliente?.id){ alert("Selecione um cliente cadastrado."); return; }
  if(!S.itens.length){ alert("Adicione ao menos um item."); return; }
  clearTimeout(_autoSaveT); // cancela auto-save pendente
  S.msg="";
  const payload={
    id:S.rascunhoId, // reaproveita o rascunho (não duplica)
    tipo:S.tipo, status:"aberta",
    cliente:S.cliente,
    itens:S.itens,
    observacao:S.observacao,
    vendedorId:S.vendedorId, vendedorNome:S.vendedorNome,
    funcionarioId:FUNC?.id, funcionarioNome:FUNC?.nome,
  };
  try{
    const j=await fetch(B+"/api/atacado/propostas",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).then(r=>r.json());
    if(j.erro){ alert(j.erro); return; }
    if(S.tipo==='pedido'){
      const g=await fetch(B+"/api/atacado/propostas/"+j.data.id+"/gerar-pedido",{method:"POST"}).then(r=>r.json());
      if(g.erro){ S.msg="⚠️ Salvo, mas não gerou o pedido: "+g.erro; render(); return; }
      S.msg=`✅ Pedido #${g.numero} criado (aguardando separação)! Você pode enviá-lo por WhatsApp na tela de Propostas.`;
    }else{
      S.msg=`✅ Proposta salva! Veja em "Propostas" pra enviar por WhatsApp ou gerar o pedido quando aprovada.`;
    }
    // limpa tudo pra próxima venda
    S.cliente=null; S.editandoCliente=false; S.itens=[]; S.observacao="";
    S.buscaProd=""; S.resultadosProd=[]; S.tipo="proposta"; S.analise=null; S.novosSelecionados={}; S.compraSelecionados={};
    S.rascunhoId=null; S.ultimoSalvo=null;
    render();
  }catch(e){ alert("Erro ao salvar."); }
}

render();
</script>
