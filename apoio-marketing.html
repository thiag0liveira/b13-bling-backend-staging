<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B13 — Apoio ao Marketing</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
  :root{--mag:#FF0082;--bg:#0f0d24;--card:#151233}
  body{background:var(--bg);color:#fff;min-height:100vh}
  .wrap{max-width:640px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid #2c2660;border-radius:14px;padding:16px;margin-top:14px}
  .muted{color:#9a95c9}
  input,select,textarea{background:#0f0d24;border:1px solid #514c96;border-radius:8px;color:#fff;padding:10px 12px;font-size:15px;font-family:inherit}
  .btn{border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:14px;padding:11px 16px;color:#fff}
  .btn-mag{background:var(--mag)}
  .btn-ghost{background:#1c1846}
</style>
<script src="/nav.js"></script>
<style>
  @media(min-width:900px){
    #b13nav{transform:translateX(0%) !important}
    button[onclick="b13ToggleNav()"]{display:none !important}
    body > *:not(#b13nav):not([onclick="b13ToggleNav()"]):not(#b13navOverlay):not(#b13topbar){ margin-left:200px }
  }
</style>
</head>
<body><script>
  (function(){
    if(typeof b13RequireLogin==="function" && !b13RequireLogin()) return;
    if(typeof b13BloquearSeSemAcesso==="function" && !b13BloquearSeSemAcesso("/apoio-marketing")) return;
    document.addEventListener("DOMContentLoaded",function(){
      const nav=document.createElement("div"); nav.innerHTML=b13RenderNav("/apoio-marketing");
      document.body.insertBefore(nav,document.body.firstChild);
    });
  })();
</script>
<div class="wrap" id="app"></div>
<script>
const B=(location.protocol.indexOf("http")===0)?"":"https://b13-bling-backend-production.up.railway.app";
const S=(typeof b13GetSession==="function"?b13GetSession():{})||{};
const esc=(s)=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const brl=(v)=>"R$ "+(+v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});

let PRECOS_CATS=null, precosBusca="", precosCatSel="", precosSel=[], precosResultados=[], precosBuscando=false;

async function carregarPrecos(){
  try{ const j=await fetch(B+"/api/precos/categorias").then(r=>r.json()); PRECOS_CATS=j.categorias||[]; }
  catch(e){ PRECOS_CATS=[]; }
  render();
}

function render(){
  const app=document.getElementById("app");
  if(!PRECOS_CATS){ app.innerHTML=`<div class="card"><div class="muted">Carregando…</div></div>`; return; }
  const selCount=precosSel.length;
  app.innerHTML=`
  <div class="card" style="margin-top:0">
    <div style="font-weight:900;font-size:18px">🏷️ Apoio ao Marketing — Consulta de Preços</div>
    <div class="muted" style="font-size:12px;margin-top:4px">Busque um produto ou categoria, selecione o que precisar e copie o texto pronto pra usar.</div>
  </div>

  <div class="card">
    <div style="font-weight:800;margin-bottom:2px">🔎 Pesquisar produto</div>
    <div class="muted" style="font-size:12px;margin-bottom:10px">Traz o preço de atacado, unidade e fardo (quando existir).</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <input id="precosBuscaInp" placeholder="🔎 Buscar produto (ex.: heineken, coca)…" value="${esc(precosBusca)}" onkeydown="if(event.key==='Enter')fazerBuscaPrecos()" oninput="precosBusca=this.value" style="flex:1;min-width:180px">
      <button class="btn btn-mag" onclick="fazerBuscaPrecos()">Buscar</button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center">
      <span class="muted" style="font-size:12px">ou por categoria:</span>
      <select onchange="buscarPorCategoria(this.value)">
        <option value="">Escolher categoria…</option>
        ${PRECOS_CATS.map(c=>`<option value="${esc(c)}" ${precosCatSel===c?'selected':''}>${esc(c)}</option>`).join("")}
      </select>
    </div>
    <div id="precosLista" style="max-height:44vh;overflow:auto">
      ${precosBuscando?'<div class="muted" style="font-size:12px">Buscando no Bling…</div>'
        :precosResultados.length?precosResultados.map((p,i)=>linhaPrecoProd(p,i)).join("")
        :'<div class="muted" style="font-size:12px">Busque um produto ou escolha uma categoria.</div>'}
    </div>
  </div>

  <div class="card" style="border-color:${selCount?'#25d366':'#2c2660'}">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-weight:800">📝 Preços selecionados ${selCount?`(${selCount} produto${selCount>1?'s':''})`:''}</div>
      ${selCount?`<button class="btn btn-ghost" style="font-size:11px;padding:5px 10px" onclick="limparPrecosSel()">Limpar</button>`:''}
    </div>
    ${selCount?`
      <textarea id="precosTexto" readonly style="width:100%;min-height:${Math.min(320,90+selCount*38)}px;line-height:1.5;resize:vertical">${esc(montarTextoPrecos())}</textarea>
      <button class="btn btn-ghost" style="width:100%;margin-top:10px" onclick="copiarPrecos()">📋 Copiar texto</button>
      <div class="muted" style="font-size:11px;margin-top:6px;text-align:center">Cole no WhatsApp, Instagram ou onde precisar.</div>
    `:'<div class="muted" style="font-size:13px">Selecione produtos pra ver o texto aqui.</div>'}
  </div>
  <div class="muted" style="text-align:center;font-size:11px;margin:16px 0">B13 Bebidas · preços sujeitos a alteração</div>`;
}

function linhaPrecoProd(p,i){
  const sel=precoJaSelecionado(p);
  const precos=[];
  if(p.precoAtacado!=null) precos.push(`atacado ${brl(p.precoAtacado)}`);
  if(p.precoBling!=null) precos.push(`bling ${brl(p.precoBling)}`);
  if(p.precoFardo!=null) precos.push(`fardo ${brl(p.precoFardo)}${p.caixaQtd?`/${p.caixaQtd}un`:''}`);
  return `
    <div onclick="togglePrecoProd(${i})" style="display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:5px;border-radius:8px;cursor:pointer;background:${sel?'#153a26':'#1c1846'};border:1px solid ${sel?'#25d366':'#2c2660'}">
      <div style="width:22px;height:22px;border-radius:5px;flex-shrink:0;border:2px solid ${sel?'#25d366':'#514c96'};background:${sel?'#25d366':'transparent'};display:flex;align-items:center;justify-content:center;font-weight:900;color:#0a2a1a">${sel?'✓':''}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:13px">${esc(p.nome)}</div>
        <div class="muted" style="font-size:11px">${p.categoria?esc(p.categoria)+' · ':''}${precos.join(" · ")||'sem preço cadastrado'}</div>
      </div>
    </div>`;
}

function precoJaSelecionado(p){ return precosSel.some(x=>x.nome===p.nome); }
function togglePrecoProd(i){
  const p=precosResultados[i]; if(!p) return;
  const ix=precosSel.findIndex(x=>x.nome===p.nome);
  if(ix>=0) precosSel.splice(ix,1); else precosSel.push(p);
  render();
}

async function fazerBuscaPrecos(){
  const q=(precosBusca||"").trim();
  if(q.length<2) return;
  precosCatSel=""; precosBuscando=true; render();
  try{ const j=await fetch(B+"/api/precos/buscar?q="+encodeURIComponent(q)).then(r=>r.json()); precosResultados=j.data||[]; }
  catch(e){ precosResultados=[]; }
  precosBuscando=false; render();
}
async function buscarPorCategoria(cat){
  precosCatSel=cat; precosBusca="";
  if(!cat){ precosResultados=[]; render(); return; }
  precosBuscando=true; render();
  try{ const j=await fetch(B+"/api/precos/buscar?categoria="+encodeURIComponent(cat)).then(r=>r.json()); precosResultados=j.data||[]; }
  catch(e){ precosResultados=[]; }
  precosBuscando=false; render();
}

function limparPrecosSel(){ precosSel=[]; render(); }

function montarTextoPrecos(){
  if(!precosSel.length) return "";
  const porCat={};
  precosSel.forEach(p=>{ const c=p.categoria||"Outros"; (porCat[c]=porCat[c]||[]).push(p); });
  let txt="*B13 bebidas - preços:*\n";
  Object.entries(porCat).forEach(([cat,prods])=>{
    txt+=`\n*${cat}*\n`;
    prods.forEach(p=>{
      const partes=[];
      if(p.precoAtacado!=null) partes.push(`atacado ${brl(p.precoAtacado)}`);
      if(p.precoBling!=null) partes.push(`unidade ${brl(p.precoBling)}`);
      if(p.precoFardo!=null) partes.push(`fardo ${brl(p.precoFardo)}${p.caixaQtd?` (cx c/${p.caixaQtd})`:''}`);
      txt+=`• ${p.nome}: ${partes.join(" | ")||'consulte'}\n`;
    });
  });
  txt+="\n_Preços sujeitos a alteração_";
  return txt;
}

async function copiarPrecos(){
  const txt=montarTextoPrecos();
  if(!txt) return;
  try{ await navigator.clipboard.writeText(txt); alert("✅ Texto copiado!"); }
  catch(e){
    const ta=document.getElementById("precosTexto");
    if(ta){ ta.removeAttribute("readonly"); ta.select(); document.execCommand("copy"); ta.setAttribute("readonly","true"); alert("✅ Texto copiado!"); }
  }
}

carregarPrecos();
</script>
</body>
</html>
