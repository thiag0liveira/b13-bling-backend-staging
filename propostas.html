<script>const B = location.protocol.indexOf("http") === 0 ? "" : "https://b13-bling-backend-production.up.railway.app";

// ---- overlay de carregamento (gerar pedido / editar) — mostra o que está
// acontecendo, com mensagens que vão mudando, pra ninguém pensar que travou
// durante uma requisição mais demorada (chamadas ao Bling não são instantâneas)
let _carregandoTimer = null;
function mostrarCarregando(etapas) {
  const lista = Array.isArray(etapas) ? etapas : [etapas];
  const html = `<div class="modalBg" id="overlayCarregando" style="z-index:2000"><div class="modal" style="text-align:center;max-width:340px">
    <div style="font-size:36px;margin-bottom:8px">⏳</div>
    <div id="txtCarregando" style="font-weight:700;font-size:14px">${esc(lista[0])}</div>
    <div class="muted" style="font-size:11px;margin-top:8px">Isso pode levar alguns segundos — não feche nem clique de novo.</div>
  </div></div>`;
  const wrap = document.createElement("div");
  wrap.innerHTML = html;
  document.body.appendChild(wrap.firstChild);
  let ix = 0;
  if (_carregandoTimer) clearInterval(_carregandoTimer);
  if (lista.length > 1) {
    _carregandoTimer = setInterval(() => {
      ix = (ix + 1) % lista.length;
      const el = document.getElementById("txtCarregando");
      if (el) el.textContent = lista[ix];
    }, 2500);
  }
}
function atualizarCarregando(msg) {
  const el = document.getElementById("txtCarregando");
  if (el) el.textContent = msg;
}
function esconderCarregando() {
  if (_carregandoTimer) { clearInterval(_carregandoTimer); _carregandoTimer = null; }
  const el = document.getElementById("overlayCarregando");
  if (el) el.remove();
}
const brl = v => "R$ " + (+v || 0).toLocaleString("pt-BR", {
  minimumFractionDigits: 2,

const soDig = s => String(s !== null && s !== void 0 ? s : "").replace(/\D/g, "");
let FILTRO = "todas";
let LISTA = [];
function render() {

  app.innerHTML = `

      <button onclick="b13ToggleNav()" style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer">☰</button>
      <img src="/logo"><div class="t">📄 Propostas & Pedidos Atacado</div><div class="sp"></div>
      <a href="/venda-atacado" class="btn btn-mag" style="text-decoration:none;font-size:12px">+ Nova venda</a>
    </div>
    <div class="wrap">
      <div class="card">
        <div id="filtroChips" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          <span class="chip ${FILTRO === 'todas' ? 'on' : ''}" onclick="mudarFiltro('todas')">Todas</span>
          <span class="chip ${FILTRO === 'proposta' ? 'on' : ''}" onclick="mudarFiltro('proposta')">📄 Propostas</span>
          <span class="chip ${FILTRO === 'pedido' ? 'on' : ''}" onclick="mudarFiltro('pedido')">🛒 Pedidos</span>
          <span style="flex:1"></span>
          <button class="btn btn-ghost" style="font-size:11px;padding:6px 10px" onclick="sincronizarPedidos(true)" title="Verifica no Bling e remove pedidos que foram excluídos lá">🔄 <span id="syncLabel">Sincronizar</span></button>
        </div>

      <div id="lista"><div class="muted">Carregando…</div></div>

  carregar();
  // ao abrir a tela, verifica em segundo plano se algum pedido foi excluído no

// troca o filtro. Reconstrói a tela inteira (render) a partir do FILTRO atual,
// então os botões de cima SEMPRE refletem o que está selecionado — sem depender
// de mexer na classe na mão, que podia dessincronizar.
function mudarFiltro(f) {
  if (FILTRO === f) return;
  FILTRO = f;
  render();
}
async function carregar() {
  const box = document.getElementById("lista");
  if (!box) return;
  const params = new URLSearchParams();
  if (FILTRO === 'proposta' || FILTRO === 'pedido') params.set("tipo", FILTRO);
  try {
    const j = await fetch(B + "/api/atacado/propostas?" + params.toString()).then(r => r.json());
    LISTA = j.data || [];
    if (!LISTA.length) {
      box.innerHTML = `<div class="card"><div class="muted">Nenhuma ${FILTRO === 'todas' ? 'proposta/pedido' : FILTRO} ainda.</div></div>`;
      return;
    }
    renderLista();
    carregarSituacoes(); // preenche o status de cada pedido aos poucos
  } catch (e) {
    box.innerHTML = `<div class="card" style="color:#ff8090">Erro ao carregar.</div>`;
  }
}
function renderLista() {
  const box = document.getElementById("lista");
  if (!box || !LISTA.length) return;
  box.innerHTML = LISTA.map(cardProposta).join("");
}

// busca a situação atual (no Bling) de cada pedido gerado e atualiza o card
let SITU = {}; // {pedidoBlingId: nome | null}
async function carregarSituacoes() {
  for (const p of LISTA) {
    if (!p.pedidoBlingId) continue;
    const k = String(p.pedidoBlingId);
    if (SITU[k] !== undefined) continue;
    try {
      const j = await fetch(B + "/api/atacado/pedido/" + k + "/situacao").then(r => r.json());
      SITU[k] = j.erro ? null : j.situacaoNome || null;
    } catch (e) {
      SITU[k] = null;
    }
    renderLista();
  }
}
function statusPedidoBadge(p) {
  if (!p.pedidoBlingId) return "";
  const nome = SITU[String(p.pedidoBlingId)];
  if (nome === undefined) return `<div style="margin-top:4px"><span class="tag" style="background:#241a3a;color:#c9b8ff">⏳ status…</span></div>`;
  if (nome === null) return `<div style="margin-top:4px"><span class="tag" style="background:#3a0010;color:#ff8090">status indisponível</span></div>`;
  let bg = "#241a3a",
    fg = "#c9b8ff";
  if (/atendido/i.test(nome)) {
    bg = "#0a2a1a";
    fg = "#3ce88a";
  } else if (/cancelado/i.test(nome)) {
    bg = "#3a0010";
    fg = "#ff8090";
  } else if (/rota|separado|verificado|conferência/i.test(nome)) {
    bg = "#0d2440";
    fg = "#7fd4ff";
  } else if (/aguardando|separação|aberto|digitação/i.test(nome)) {
    bg = "#2a1f00";
    fg = "#ffd23f";
  }
  return `<div style="margin-top:4px"><span class="tag" style="background:${bg};color:${fg}">${esc(nome)}</span></div>`;
}

// Sincroniza os pedidos com o Bling: remove do sistema os pedidos que foram
// excluídos no Bling (o pedido é espelho do Bling). Propostas não são tocadas.

let _sincronizando = false;
async function sincronizarPedidos(manual) {
  if (_sincronizando) return;
  _sincronizando = true;
  const lbl = document.getElementById("syncLabel");
  if (lbl && manual) lbl.textContent = "Verificando…";
  try {
    const j = await fetch(B + "/api/atacado/propostas/sincronizar-pedidos", {
      method: "POST"
    }).then(r => r.json());
    if (lbl) lbl.textContent = "Sincronizar";
    if (j.erro) {
      if (manual) alert("Erro ao sincronizar: " + j.erro);
      return;
    }
    if (j.removidos > 0 || j.adicionados > 0) {
      carregar(); // atualiza a lista (fantasmas somem, aguardando separação entram)
      if (manual) {
        const partes = [];
        if (j.adicionados > 0) {
          const nomesAdd = (j.detalhesAdicionados || []).map(d => `#${d.numero || '?'}${d.cliente ? ' (' + d.cliente + ')' : ''}`).join(", ");
          partes.push(`➕ ${j.adicionados} pedido(s) em Aguardando Separação foram trazidos pra lista:\n${nomesAdd}`);
        }
        if (j.removidos > 0) {
          const nomes = (j.detalhes || []).map(d => `#${d.pedidoBlingNumero || '?'}${d.cliente ? ' (' + d.cliente + ')' : ''}`).join(", ");
          partes.push(`🗑 ${j.removidos} pedido(s) que não existiam mais no Bling foram removidos:\n${nomes}`);
        }
        alert("✅ Sincronizado!\n\n" + partes.join("\n\n"));
      }
    } else if (manual) {
      alert(`✅ Tudo certo! ${j.verificados} pedido(s) verificados e nenhum novo em Aguardando Separação pra trazer.`);
    }
  } catch (e) {
    if (lbl) lbl.textContent = "Sincronizar";
    if (manual) alert("Erro de conexão ao sincronizar.");
  } finally {
    _sincronizando = false;
  }
}
function statusTag(p) {
  // só é "Pedido" de verdade quando existe o pedido no Bling (pedidoBlingId).
  // Um item marcado como tipo "pedido" mas SEM pedidoBlingId é uma venda direta
  // cujo pedido não chegou a ser gerado no Bling (deu erro) — nesse caso ele
  // continua sendo tratado como PROPOSTA (fica na aba Propostas, mostra os
  // botões de proposta e pode tentar gerar de novo).
  if (p.pedidoBlingId) return `<span class="tag tag-ger">Pedido #${esc(p.pedidoBlingNumero)} gerado</span>`;
  if (p.tipo === 'pedido') return `<span class="tag tag-prop">⚠️ Proposta (pedido não gerado)</span>`;

}
// ---- impressão no comprovante térmico (mesmo estilo do caixa atacado/totem) ----

      <style>

      const bw = 220, bh = barCanvas.height * (bw / barCanvas.width);

  // apara pro tamanho real
