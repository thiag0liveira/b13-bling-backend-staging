<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B13 — Propostas</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
  :root{--mag:#FF0082;--indigo:#181542;--bg:#0f0d24}
  body{background:var(--bg);color:#fff}
  #app{max-width:900px;margin:0 auto;min-height:100vh}
  .top{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#2b2870,#262366);display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:3px solid var(--mag)}
  .top img{height:38px}.top .t{font-weight:900;font-size:17px}.top .sp{flex:1}
  .wrap{padding:14px}
  .card{background:#151233;border:1px solid #2c2660;border-radius:14px;padding:14px;margin-bottom:12px}
  .muted{color:#9a95c9;font-size:13px}
  .btn{border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:13px;padding:9px 13px;color:#fff}
  .btn-mag{background:var(--mag)}.btn-grn{background:#2f9e6b}.btn-ghost{background:#1c1846}.btn-wa{background:#25d366;color:#0a2a1a}
  .chip{background:#1c1846;border:1px solid #514c96;border-radius:20px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;color:#fff}
  .chip.on{background:var(--mag);border-color:var(--mag)}
  .tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:5px}
  .tag-prop{background:#2a1f00;color:#ffd23f}.tag-ped{background:#0a2a1a;color:#3ce88a}
  .tag-ger{background:#0d2440;color:#7fd4ff}
</style>
<script src="/nav.js"></script>
<style>
  @media(min-width:900px){
    #b13nav{transform:translateX(0%) !important}
    button[onclick="b13ToggleNav()"]{display:none !important}
    body > *:not(#b13nav):not([onclick="b13ToggleNav()"]):not(#b13navOverlay){ margin-left:200px }
  }
</style>
</head>
<body><script>
  (function(){
    if(typeof b13RequireLogin==="function" && !b13RequireLogin()) return;
    if(typeof b13BloquearSeSemAcesso==="function" && !b13BloquearSeSemAcesso("/propostas")) return;
    document.addEventListener("DOMContentLoaded",function(){
      const nav=document.createElement("div");
      nav.innerHTML=b13RenderNav("/propostas");
      document.body.insertBefore(nav,document.body.firstChild);
    });
  })();
</script>
<div id="app"></div>
<script>
const B=(location.protocol.indexOf("http")===0)?"":"https://b13-bling-backend-production.up.railway.app";
const esc=(s)=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const brl=(v)=>"R$ "+(+v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const soDig=(s)=>String(s??"").replace(/\D/g,"");

let FILTRO="todas";
let LISTA=[];

function render(){
  const app=document.getElementById("app");
  app.innerHTML=`
    <div class="top">
      <button onclick="b13ToggleNav()" style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer">☰</button>
      <img src="/logo"><div class="t">📄 Propostas & Pedidos Atacado</div><div class="sp"></div>
      <a href="/venda-atacado" class="btn btn-mag" style="text-decoration:none;font-size:12px">+ Nova venda</a>
    </div>
    <div class="wrap">
      <div class="card">
        <div id="filtroChips" style="display:flex;gap:6px;flex-wrap:wrap">
          <span class="chip ${FILTRO==='todas'?'on':''}" onclick="mudarFiltro('todas')">Todas</span>
          <span class="chip ${FILTRO==='proposta'?'on':''}" onclick="mudarFiltro('proposta')">📄 Propostas</span>
          <span class="chip ${FILTRO==='pedido'?'on':''}" onclick="mudarFiltro('pedido')">🛒 Pedidos</span>
        </div>
      </div>
      <div id="lista"><div class="muted">Carregando…</div></div>
    </div>`;
  carregar();
}

// troca o filtro E atualiza qual chip fica marcado (antes o 'on' só era
// calculado no template inicial, então a marcação ficava presa no "Todas")
function mudarFiltro(f){
  FILTRO=f;
  const wrap=document.getElementById("filtroChips");
  if(wrap){
    const chips=wrap.querySelectorAll(".chip");
    const ordem=["todas","proposta","pedido"];
    chips.forEach((c,ix)=>c.classList.toggle("on", ordem[ix]===f));
  }
  carregar();
}

async function carregar(){
  const box=document.getElementById("lista");
  if(!box) return;
  const params=new URLSearchParams();
  if(FILTRO==='proposta'||FILTRO==='pedido') params.set("tipo",FILTRO);
  try{
    const j=await fetch(B+"/api/atacado/propostas?"+params.toString()).then(r=>r.json());
    LISTA=j.data||[];
    if(!LISTA.length){ box.innerHTML=`<div class="card"><div class="muted">Nenhuma ${FILTRO==='todas'?'proposta/pedido':FILTRO} ainda.</div></div>`; return; }
    box.innerHTML=LISTA.map(cardProposta).join("");
  }catch(e){ box.innerHTML=`<div class="card" style="color:#ff8090">Erro ao carregar.</div>`; }
}

function statusTag(p){
  // só é "Pedido" de verdade quando existe o pedido no Bling (pedidoBlingId).
  // Um item marcado como tipo "pedido" mas SEM pedidoBlingId é uma venda direta
  // cujo pedido não chegou a ser gerado no Bling (deu erro) — nesse caso ele
  // continua sendo tratado como PROPOSTA (fica na aba Propostas, mostra os
  // botões de proposta e pode tentar gerar de novo).
  if(p.pedidoBlingId) return `<span class="tag tag-ger">Pedido #${esc(p.pedidoBlingNumero)} gerado</span>`;
  if(p.tipo==='pedido') return `<span class="tag tag-prop">⚠️ Proposta (pedido não gerado)</span>`;
  return `<span class="tag tag-prop">Proposta</span>`;
}

function cardProposta(p){
  const data=p.criadoEm?new Date(p.criadoEm).toLocaleDateString("pt-BR"):"";
  const itensTxt=(p.itens||[]).map(i=>`${i.quantidade}x ${i.nome}`).join(", ");
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <div>
        <div style="font-weight:800">${esc(p.cliente?.nome||'—')}</div>
        <div class="muted" style="font-size:12px">${data} · Vendedor: ${esc(p.vendedorNome||'—')}</div>
      </div>
      <div style="text-align:right">
        ${statusTag(p)}
        <div style="font-size:18px;font-weight:900;color:#ffd23f;margin-top:4px">${brl(p.total)}</div>
      </div>
    </div>
    <div class="muted" style="font-size:12px;margin:8px 0;line-height:1.4">${esc(itensTxt)}</div>
    ${p.observacao?`<div class="muted" style="font-size:11px">💬 ${esc(p.observacao)}</div>`:''}
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
      <button class="btn btn-wa" onclick='enviarWhats(${JSON.stringify(p.id)})'>📱 Enviar WhatsApp</button>
      <button class="btn btn-ghost" onclick='verImagem(${JSON.stringify(p.id)})'>🖼️ Imagem</button>
      ${!p.pedidoBlingId&&p.status!=='cancelada'?`<button class="btn btn-grn" onclick='gerarPedido(${JSON.stringify(p.id)})'>✅ Gerar pedido</button>`:''}
      ${p.status!=='cancelada'?`<button class="btn btn-ghost" onclick='cancelar(${JSON.stringify(p.id)})'>🚫 Cancelar</button>`:'<span class="tag" style="background:#3a0010;color:#ff8090;align-self:center">Cancelada</span>'}
      ${!p.pedidoBlingId?`<button class="btn btn-ghost" onclick='excluir(${JSON.stringify(p.id)})'>🗑 Excluir</button>`:''}
    </div>
  </div>`;
}

function verImagem(id){
  const p=LISTA.find(x=>x.id===id);
  if(!p){ alert("Proposta não encontrada."); return; }
  const ov=document.createElement("div");
  ov.id="modalImg";
  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px";
  ov.onclick=(e)=>{ if(e.target===ov) ov.remove(); };
  ov.innerHTML=`
    <div style="background:#151233;border:1px solid #2c2660;border-radius:14px;max-width:720px;width:100%;max-height:92vh;overflow:auto;padding:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-weight:800">🖼️ ${p.pedidoBlingId?('Pedido #'+p.pedidoBlingNumero):('Proposta')}</div>
        <button class="btn btn-ghost" style="padding:6px 12px" onclick="document.getElementById('modalImg').remove()">✕ Fechar</button>
      </div>
      <canvas id="cvNota" style="max-width:100%;height:auto;border-radius:10px;border:1px solid #2c2660;background:#fff"></canvas>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-mag" style="flex:1" onclick="baixarImg()">⬇️ Baixar</button>
        <button class="btn btn-wa" style="flex:1" onclick="compartilharImg()">📱 Compartilhar</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  desenharNota(p);
}

let _logoImg=null;
function desenharNota(p){
  // carrega a logo uma vez; quando pronta, redesenha
  if(!_logoImg){
    _logoImg=new Image();
    _logoImg.crossOrigin="anonymous";
    _logoImg.onload=()=>desenharNota(p);
    _logoImg.onerror=()=>{ _logoImg={erro:true}; desenharNota(p); };
    _logoImg.src="/logo";
    if(!_logoImg.complete) return; // espera carregar
  }
  const itens=p.itens||[];
  const W=680, padd=28, headerH=150, itemH=40, footerH=90;
  const H=headerH+itens.length*itemH+footerH+30;
  const cv=document.getElementById("cvNota");
  if(!cv) return;
  const dpr=2; cv.width=W*dpr; cv.height=H*dpr; cv.style.width="100%";
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
  // faixa azul do cabeçalho (mais alta pra caber logo + tipo + cliente)
  ctx.fillStyle="#262366"; ctx.fillRect(0,0,W,headerH-18);
  ctx.fillStyle="#FF0082"; ctx.fillRect(0,headerH-18,W,5);
  // logo no topo esquerdo
  if(_logoImg && !_logoImg.erro && _logoImg.naturalWidth){
    const alturaLogo=40;
    const larguraLogo=_logoImg.naturalWidth*(alturaLogo/_logoImg.naturalHeight);
    try{ ctx.drawImage(_logoImg,padd,20,Math.min(larguraLogo,200),alturaLogo); }catch(e){ ctx.fillStyle="#fff"; ctx.font="900 26px Arial"; ctx.textAlign="left"; ctx.fillText("B13 BEBIDAS",padd,48); }
  }else{
    ctx.fillStyle="#fff"; ctx.font="900 26px Arial"; ctx.textAlign="left"; ctx.fillText("B13 BEBIDAS",padd,48);
  }
  // data no topo direito
  ctx.font="13px Arial"; ctx.fillStyle="#cfc9f5"; ctx.textAlign="right";
  const data=p.criadoEm?new Date(p.criadoEm).toLocaleDateString("pt-BR"):"";
  ctx.fillText(data,W-padd,40);
  // tipo (proposta/pedido) abaixo da logo
  ctx.font="700 16px Arial"; ctx.fillStyle="#ffd23f"; ctx.textAlign="left";
  const tipoTxt=p.pedidoBlingId?("Pedido #"+p.pedidoBlingNumero):("Proposta Comercial");
  ctx.fillText(tipoTxt,padd,84);
  // cliente e vendedor na mesma linha, dentro da faixa
  ctx.font="13px Arial"; ctx.fillStyle="#cfc9f5"; ctx.textAlign="left";
  let nomeCli=p.cliente?.nome||"—"; if(nomeCli.length>36) nomeCli=nomeCli.slice(0,35)+"…";
  ctx.fillText("Cliente: "+nomeCli,padd,110);
  if(p.vendedorNome){ ctx.textAlign="right"; ctx.fillText("Vendedor: "+p.vendedorNome,W-padd,110); }
  // cabeçalho da tabela (abaixo da faixa)
  let y=headerH+14;
  ctx.font="700 12px Arial"; ctx.fillStyle="#888"; ctx.textAlign="left"; ctx.fillText("PRODUTO",padd,y);
  ctx.textAlign="center"; ctx.fillText("QTD",W-260,y);
  ctx.textAlign="right"; ctx.fillText("UNIT.",W-140,y); ctx.fillText("TOTAL",W-padd,y);
  y+=10; ctx.strokeStyle="#ddd"; ctx.beginPath(); ctx.moveTo(padd,y); ctx.lineTo(W-padd,y); ctx.stroke(); y+=6;
  itens.forEach(i=>{
    const qtd=Number(i.quantidade)||1, un=Number(i.valor)||0;
    ctx.fillStyle="#111"; ctx.font="14px Arial"; ctx.textAlign="left";
    let nome=i.nome||""; if(nome.length>34) nome=nome.slice(0,33)+"…";
    ctx.fillText(nome,padd,y+itemH/2);
    ctx.textAlign="center"; ctx.fillText(String(qtd),W-260,y+itemH/2);
    ctx.textAlign="right"; ctx.fillStyle="#555"; ctx.fillText(brl(un),W-140,y+itemH/2);
    ctx.fillStyle="#111"; ctx.font="700 14px Arial"; ctx.fillText(brl(un*qtd),W-padd,y+itemH/2);
    ctx.strokeStyle="#eee"; ctx.beginPath(); ctx.moveTo(padd,y+itemH); ctx.lineTo(W-padd,y+itemH); ctx.stroke();
    y+=itemH;
  });
  y+=10; ctx.fillStyle="#262366"; ctx.fillRect(padd,y,W-padd*2,44);
  ctx.fillStyle="#fff"; ctx.font="900 18px Arial"; ctx.textAlign="left"; ctx.fillText("TOTAL",padd+12,y+28);
  ctx.textAlign="right"; ctx.fillStyle="#ffd23f"; ctx.font="900 22px Arial"; ctx.fillText(brl(p.total),W-padd-12,y+29);
  y+=44;
  if(p.observacao){ y+=24; ctx.fillStyle="#555"; ctx.font="13px Arial"; ctx.textAlign="left"; ctx.fillText("Obs: "+p.observacao.slice(0,70),padd,y); }
  ctx.fillStyle="#9a95c9"; ctx.font="12px Arial"; ctx.textAlign="center"; ctx.fillText("B13 Bebidas · Obrigado pela preferência! 🍻",W/2,H-16);
}

function baixarImg(){
  const cv=document.getElementById("cvNota"); if(!cv) return;
  const a=document.createElement("a"); a.download="nota-b13.png"; a.href=cv.toDataURL("image/png"); a.click();
}
async function compartilharImg(){
  const cv=document.getElementById("cvNota"); if(!cv) return;
  let blob; try{ blob=await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(),"image/png")); }catch(e){ baixarImg(); return; }
  const file=new File([blob],"nota-b13.png",{type:"image/png"});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:"Nota B13"}); return; }catch(e){ if(e&&e.name==="AbortError") return; }
  }
  baixarImg(); alert("Imagem baixada — anexe no WhatsApp. 📎");
}

async function cancelar(id){
  if(!confirm("Cancelar? O pedido/proposta vai pro status cancelado (se já tiver pedido no Bling, ele também será cancelado lá). Não pode ser desfeito.")) return;
  try{
    const j=await fetch(B+"/api/atacado/propostas/"+id+"/cancelar",{method:"POST"}).then(r=>r.json());
    if(j.erro){ alert(j.erro); return; }
    carregar();
  }catch(e){ alert("Erro ao cancelar."); }
}

async function gerarPedido(id){
  if(!confirm("Gerar o pedido de venda no Bling a partir desta proposta?")) return;
  try{
    const j=await fetch(B+"/api/atacado/propostas/"+id+"/gerar-pedido",{method:"POST"}).then(r=>r.json());
    if(j.erro){ alert("❌ Não foi possível gerar o pedido no Bling:\n\n"+j.erro+"\n\nEla continua como PROPOSTA — corrija o problema e tente gerar de novo."); return; }
    alert("Pedido #"+j.numero+" criado (aguardando separação)!");
    carregar();
  }catch(e){ alert("Erro de conexão ao gerar o pedido. Ela continua como proposta — tente de novo."); }
}

async function excluir(id){
  if(!confirm("Excluir esta proposta do sistema? (só é possível em propostas que ainda não viraram pedido)")) return;
  try{ const j=await fetch(B+"/api/atacado/propostas/"+id,{method:"DELETE"}).then(r=>r.json()); if(j.erro){alert(j.erro);return;} carregar(); }catch(e){}
}

async function enviarWhats(id){
  const p=LISTA.find(x=>x.id===id);
  if(!p) return;
  // monta o texto (vai como legenda da imagem, ou como fallback se não der pra mandar imagem)
  const itens=(p.itens||[]).map(i=>{
    const qtd=Number(i.quantidade)||1, un=Number(i.valor)||0;
    return qtd>1?`• ${qtd}x ${i.nome} — ${brl(un)} un = ${brl(un*qtd)}`:`• ${i.nome} — ${brl(un)}`;
  }).join("\n");
  const titulo=p.pedidoBlingId?`*Pedido #${p.pedidoBlingNumero} — B13 Bebidas*`:("*Proposta comercial — B13 Bebidas*");
  const msg=`${titulo}\n\nOlá, ${p.cliente?.nome||''}!\n\n${itens}\n\n*Total: ${brl(p.total)}*${p.observacao?`\n\n${p.observacao}`:''}`;

  // gera a imagem da nota num canvas oculto e tenta compartilhar (com a imagem)
  const cv=document.createElement("canvas");
  cv.style.display="none"; document.body.appendChild(cv);
  await desenharNotaEm(cv,p);
  let blob=null;
  try{ blob=await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(),"image/png")); }catch(e){}
  cv.remove();

  // compartilhamento nativo com a imagem (funciona no celular)
  if(blob && navigator.share && navigator.canShare){
    const file=new File([blob],"nota-b13.png",{type:"image/png"});
    if(navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],text:msg}); return; }
      catch(e){ if(e&&e.name==="AbortError") return; }
    }
  }
  // fallback (computador ou sem suporte a compartilhar arquivo): abre o modal da imagem
  // pra baixar/compartilhar manualmente, já com o texto no WhatsApp
  verImagem(id);
  let tel=soDig(p.cliente?.telefone||"");
  if(tel.length>=10){
    const tel55=tel.length<=11?("55"+tel):tel;
    setTimeout(()=>window.open("https://wa.me/"+tel55+"?text="+encodeURIComponent(msg),"_blank"),300);
  }
}

// desenha a nota num canvas específico (reaproveitável pro compartilhamento)
async function desenharNotaEm(cv,p){
  // garante a logo carregada
  if(!_logoImg||(!_logoImg.erro&&!_logoImg.naturalWidth)){
    await new Promise((res)=>{
      _logoImg=new Image(); _logoImg.crossOrigin="anonymous";
      _logoImg.onload=res; _logoImg.onerror=()=>{ _logoImg={erro:true}; res(); }; _logoImg.src="/logo";
    });
  }
  const itens=p.itens||[];
  const W=680, padd=28, headerH=150, itemH=40, footerH=90;
  const H=headerH+itens.length*itemH+footerH+30;
  const dpr=2; cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#262366"; ctx.fillRect(0,0,W,headerH-18);
  ctx.fillStyle="#FF0082"; ctx.fillRect(0,headerH-18,W,5);
  if(_logoImg && !_logoImg.erro && _logoImg.naturalWidth){
    const aL=40, lL=_logoImg.naturalWidth*(aL/_logoImg.naturalHeight);
    try{ ctx.drawImage(_logoImg,padd,20,Math.min(lL,200),aL); }catch(e){ ctx.fillStyle="#fff"; ctx.font="900 26px Arial"; ctx.textAlign="left"; ctx.fillText("B13 BEBIDAS",padd,48); }
  }else{ ctx.fillStyle="#fff"; ctx.font="900 26px Arial"; ctx.textAlign="left"; ctx.fillText("B13 BEBIDAS",padd,48); }
  ctx.font="13px Arial"; ctx.fillStyle="#cfc9f5"; ctx.textAlign="right";
  ctx.fillText(p.criadoEm?new Date(p.criadoEm).toLocaleDateString("pt-BR"):"",W-padd,40);
  ctx.font="700 16px Arial"; ctx.fillStyle="#ffd23f"; ctx.textAlign="left";
  ctx.fillText(p.pedidoBlingId?("Pedido #"+p.pedidoBlingNumero):("Proposta Comercial"),padd,84);
  ctx.font="13px Arial"; ctx.fillStyle="#cfc9f5"; ctx.textAlign="left";
  let nc=p.cliente?.nome||"—"; if(nc.length>36) nc=nc.slice(0,35)+"…";
  ctx.fillText("Cliente: "+nc,padd,110);
  if(p.vendedorNome){ ctx.textAlign="right"; ctx.fillText("Vendedor: "+p.vendedorNome,W-padd,110); }
  let y=headerH+14;
  ctx.font="700 12px Arial"; ctx.fillStyle="#888"; ctx.textAlign="left"; ctx.fillText("PRODUTO",padd,y);
  ctx.textAlign="center"; ctx.fillText("QTD",W-260,y);
  ctx.textAlign="right"; ctx.fillText("UNIT.",W-140,y); ctx.fillText("TOTAL",W-padd,y);
  y+=10; ctx.strokeStyle="#ddd"; ctx.beginPath(); ctx.moveTo(padd,y); ctx.lineTo(W-padd,y); ctx.stroke(); y+=6;
  itens.forEach(i=>{
    const qtd=Number(i.quantidade)||1, un=Number(i.valor)||0;
    ctx.fillStyle="#111"; ctx.font="14px Arial"; ctx.textAlign="left";
    let nome=i.nome||""; if(nome.length>34) nome=nome.slice(0,33)+"…";
    ctx.fillText(nome,padd,y+itemH/2);
    ctx.textAlign="center"; ctx.fillText(String(qtd),W-260,y+itemH/2);
    ctx.textAlign="right"; ctx.fillStyle="#555"; ctx.fillText(brl(un),W-140,y+itemH/2);
    ctx.fillStyle="#111"; ctx.font="700 14px Arial"; ctx.fillText(brl(un*qtd),W-padd,y+itemH/2);
    ctx.strokeStyle="#eee"; ctx.beginPath(); ctx.moveTo(padd,y+itemH); ctx.lineTo(W-padd,y+itemH); ctx.stroke();
    y+=itemH;
  });
  y+=10; ctx.fillStyle="#262366"; ctx.fillRect(padd,y,W-padd*2,44);
  ctx.fillStyle="#fff"; ctx.font="900 18px Arial"; ctx.textAlign="left"; ctx.fillText("TOTAL",padd+12,y+28);
  ctx.textAlign="right"; ctx.fillStyle="#ffd23f"; ctx.font="900 22px Arial"; ctx.fillText(brl(p.total),W-padd-12,y+29);
  y+=44;
  if(p.observacao){ y+=24; ctx.fillStyle="#555"; ctx.font="13px Arial"; ctx.textAlign="left"; ctx.fillText("Obs: "+p.observacao.slice(0,70),padd,y); }
  ctx.fillStyle="#9a95c9"; ctx.font="12px Arial"; ctx.textAlign="center"; ctx.fillText("B13 Bebidas · Obrigado pela preferência!",W/2,H-16);
}

render();
</script>
