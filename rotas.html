<div id="app"></div>
<script>
const B=(location.protocol.indexOf("http")===0)?"":"https://b13-bling-backend-production.up.railway.app";
const FUNC=(typeof b13GetSession==="function")?b13GetSession():null;
const esc=(s)=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const brl=(v)=>"R$ "+Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const DIAS_SEMANA=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
function hojeBR(){ return new Date(Date.now()-3*60*60*1000).toISOString().slice(0,10); }
function dataLabel(iso){
  const d=new Date(iso+"T12:00:00");
  return d.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit"});
}

const S={
  data: hojeBR(),
  config: null,
  pedidos: [],
  lojaCoord: null,
  carregando: true,
  editandoConfig: false,
  expandido: {},
  atribuicoes: {}, // carroId -> {pedidoIds:[...]}
  resultadoRota: {}, // carroId -> {distanciaTotalKm,duracaoTotalMin,paradasOrdenadas}
  calculando: {}, // carroId -> bool
  carroMapaAtivo: null,
  salvando: false,
  msg: "",
  diasResumo: {}, // "YYYY-MM-DD" -> quantidade de pedidos já atribuídos naquele dia
  diasDetalhe: {}, // "YYYY-MM-DD" -> {carroId: [pedidoIds]}
  idsUsadosOutrosDias: {}, // pedidoId -> data em que já está agendado (pra não repetir noutro dia)
  verVisaoGeral: false,
};

async function carregarTudo(){
  S.carregando=true; render();
  try{
    const j=await fetch(B+"/api/rotas/pedidos-entrega?data="+S.data).then(r=>r.json());
    S.pedidos=j.data||[];
    S.config=j.config;
    S.lojaCoord=j.lojaCoord;
    // reconstrói atribuições a partir do que já veio salvo. Cada carro agora
    // pode ter VÁRIAS viagens no mesmo dia (o carro pode sair, voltar, recarregar
    // e sair de novo) — mantém compatibilidade com o formato antigo (um carro =
    // uma lista só de pedidoIds), tratando como "viagem única" nesse caso.
    const rDia=await fetch(B+"/api/rotas/dia?data="+S.data).then(r=>r.json());
    const salvo=rDia.data||{};
    S.atribuicoes={};
    (S.config.carros||[]).forEach(c=>{
      const d=salvo[c.id];
      let viagens;
      if(d?.viagens?.length) viagens=d.viagens.map(v=>({pedidoIds:v.pedidoIds||[]}));
      else if(d?.pedidoIds?.length) viagens=[{pedidoIds:d.pedidoIds}]; // formato antigo
      else viagens=[{pedidoIds:[]}];
      S.atribuicoes[c.id]={viagens};
    });
    S.atribuicoes["_semCarro"]={pedidoIds:(salvo["_semCarro"]?.pedidoIds)||[]};
    S.resultadoRota={};
    // resumo geral: quantos pedidos já tem em cada dia + quais pedidos já
    // estão agendados em OUTRO dia (pra não aparecerem como "disponíveis" aqui)
    const rResumo=await fetch(B+"/api/rotas/dias-resumo").then(r=>r.json());
    S.diasResumo=rResumo.porDia||{};
    S.diasDetalhe=rResumo.detalheDias||{};
    S.idsUsadosOutrosDias={};
    Object.entries(rResumo.idsUsados||{}).forEach(([pid,data])=>{ if(data!==S.data) S.idsUsadosOutrosDias[pid]=data; });
  }catch(e){ S.msg="Erro ao carregar: "+e.message; }
  S.carregando=false; render();
}

function pedidosDisponiveis(){
  const usados=new Set();
  Object.entries(S.atribuicoes).forEach(([carroId,a])=>{
    if(carroId==="_semCarro"){ (a.pedidoIds||[]).forEach(id=>usados.add(id)); return; }
    (a.viagens||[]).forEach(v=>(v.pedidoIds||[]).forEach(id=>usados.add(id)));
  });
  return S.pedidos.filter(p=>!usados.has(p.id) && !S.idsUsadosOutrosDias[p.id]);
}
function pedidoPorId(id){ return S.pedidos.find(p=>p.id===id); }
function pedidosCarroAtual(carroId){ // todas as viagens desse carro juntas
  return (S.atribuicoes[carroId]?.viagens||[]).flatMap(v=>(v.pedidoIds||[]).map(id=>pedidoPorId(id))).filter(Boolean);
}
function pedidosViagem(carroId,vix){
  return ((S.atribuicoes[carroId]?.viagens||[])[vix]?.pedidoIds||[]).map(id=>pedidoPorId(id)).filter(Boolean);
}

// ---------- capacidade / horário ----------
function minutosDoDia(hhmm){ const [h,m]=(hhmm||"10:00").split(":").map(Number); return h*60+(m||0); }
function janelaMin(carro){ return Math.max(0, minutosDoDia(carro.horaFimJanela||"19:00")-minutosDoDia(carro.horaSaida)); }
// estimativa (antes de calcular a rota de verdade): quantas paradas dá pra
// fazer numa ÚNICA viagem, usando o tempo médio de trajeto + parada configurados
function capacidadeEstimada(carro){
  const porParada=(S.config.tempoTrajetoMin||12)+(S.config.tempoParadaMin||15);
  return Math.max(0, Math.floor(janelaMin(carro)/porParada));
}
// tempo estimado (ou real, se já calculou a rota) de UMA viagem específica
function tempoViagemMin(carroId,vix){
  const ids=(S.atribuicoes[carroId]?.viagens||[])[vix]?.pedidoIds||[];
  if(!ids.length) return 0;
  const resultado=(S.resultadoRota[carroId]||[])[vix];
  if(resultado) return resultado.duracaoTotalMin+ids.length*(S.config.tempoParadaMin||15);
  return ids.length*((S.config.tempoTrajetoMin||12)+(S.config.tempoParadaMin||15));
}
// soma o tempo de TODAS as viagens desse carro no dia + tempo de recarga entre
// elas (voltar na loja, carregar de novo, sair) — e compara com a janela do carro
function riscoCarro(carro){
  const todasViagens=S.atribuicoes[carro.id]?.viagens||[];
  let usado=0, qtdViagensComPedido=0;
  todasViagens.forEach((v,ix)=>{
    if(!(v.pedidoIds||[]).length) return;
    usado+=tempoViagemMin(carro.id, ix);
    qtdViagensComPedido++;
  });
  if(qtdViagensComPedido>1) usado+=(qtdViagensComPedido-1)*(S.config.tempoRecargaMin||20);
  const jan=janelaMin(carro);
  return { usado, jan, risco: usado>jan, qtdViagens: qtdViagensComPedido };
}

// escolhe em qual viagem desse carro um pedido deve entrar: tenta a ÚLTIMA
// viagem existente (se ainda tiver espaço de peso/quantidade pra uma viagem
// só); se não couber, cria uma viagem NOVA nesse mesmo carro — só parte pra
// outro carro se quem chamou decidir isso (essa função nunca troca de carro)
function escolherOuCriarViagem(carroId, pesoNovoPedido){
  const carro=S.config.carros.find(c=>c.id===carroId);
  const bucket=S.atribuicoes[carroId];
  if(!bucket.viagens.length) bucket.viagens.push({pedidoIds:[]});
  const ultimaIx=bucket.viagens.length-1;
  const ultima=bucket.viagens[ultimaIx];
  if(!ultima.pedidoIds.length) return ultimaIx; // última viagem ainda vazia, usa ela
  const pesoUltima=ultima.pedidoIds.reduce((s,id)=>s+(pedidoPorId(id)?.pesoEstimadoKg||0),0);
  const capQtd=Math.min(carro.limiteEntregas||99, capacidadeEstimada(carro)||99);
  const cabeNaUltima=(pesoUltima+pesoNovoPedido)<=(carro.pesoSugeridoKg||99999)*1.2 && ultima.pedidoIds.length<capQtd;
  if(cabeNaUltima) return ultimaIx;
  bucket.viagens.push({pedidoIds:[]}); // não coube na última — abre uma viagem nova nesse mesmo carro
  return bucket.viagens.length-1;
}

function mudarDia(delta){
  const d=new Date(S.data+"T12:00:00");
  d.setDate(d.getDate()+delta);
  S.data=d.toISOString().slice(0,10);
  S.resultadoRota={}; S.carroMapaAtivo=null;
  carregarTudo();
}

function toggleExpandido(id){ S.expandido[id]=!S.expandido[id]; render(); }

function agendarSemCarro(pedidoId){
  S.atribuicoes["_semCarro"].pedidoIds.push(pedidoId);
  render();
}
function desagendar(pedidoId){
  S.atribuicoes["_semCarro"].pedidoIds=(S.atribuicoes["_semCarro"].pedidoIds||[]).filter(id=>id!==pedidoId);
  render();
}
// pega os pedidos já agendados pro dia (mas ainda sem carro) e distribui,
// tentando SEMPRE o menor custo possível nessa ordem de preferência:
// 1) tudo numa viagem só de 1 carro; 2) mais viagens do MESMO carro (o carro
// pode rodar várias vezes entre 10h e 19h); 3) só aí parte pra outro carro.
async function sugerirCarrosParaSemCarro(){
  const pendentes=(S.atribuicoes["_semCarro"]?.pedidoIds||[]).map(id=>pedidoPorId(id)).filter(Boolean);
  if(!pendentes.length){ alert("Nenhum pedido agendado pra esse dia ainda. Agende alguns primeiro."); return; }
  let pool=pendentes.filter(p=>p.lat&&p.lng);
  const semCoord=pendentes.filter(p=>!p.lat||!p.lng);
  const carros=S.config.carros||[];

  // avisa se algum pedido sozinho já é mais pesado do que QUALQUER carro
  // configurado aguenta numa viagem só — nesse caso não tem como caber num
  // veículo só, precisa de 2 carros juntos ou 2 viagens até esse cliente
  const maiorCapacidadeKg=Math.max(0,...carros.map(c=>(c.pesoSugeridoKg||0)*1.2));
  const pesadosDemais=pendentes.filter(p=>(p.pesoEstimadoKg||0)>maiorCapacidadeKg);
  if(pesadosDemais.length){
    const lista=pesadosDemais.map(p=>`Pedido ${p.numero} (${p.pesoEstimadoKg}kg)`).join(", ");
    if(!confirm(`⚠️ ${pesadosDemais.length} pedido(s) sozinho(s) já passam do que qualquer carro configurado aguenta numa viagem: ${lista}.\n\nVai precisar de 2 carros juntos nessa entrega, ou fazer 2 viagens até esse cliente — isso não é feito automaticamente aqui.\n\nContinuar distribuindo o resto mesmo assim?`)) return;
  }

  const semente=(lista)=>{ let s=lista[0], d=-1; lista.forEach(p=>{ const dd=distanciaRetaKm(S.lojaCoord||{lat:-19.917,lng:-43.934},p); if(dd>d){ d=dd; s=p; } }); return s; };
  const montaViagem=(carro, poolAtual, alvoQtd)=>{
    const sem=semente(poolAtual);
    const candidatos=poolAtual.slice().sort((a,b)=>distanciaRetaKm(sem,a)-distanciaRetaKm(sem,b));
    const escolhidos=[]; let pesoAcum=0;
    for(const p of candidatos){
      if(escolhidos.length>=alvoQtd) break;
      const pesoTeste=pesoAcum+(p.pesoEstimadoKg||0);
      if(pesoTeste>(carro.pesoSugeridoKg||99999)*1.2 && escolhidos.length>0) continue;
      escolhidos.push(p); pesoAcum=pesoTeste;
    }
    return escolhidos;
  };

  const carrosPorCapacidade=carros.slice().sort((a,b)=>(b.pesoSugeridoKg||0)-(a.pesoSugeridoKg||0));
  const usados=new Set();

  // fase 1: tenta colocar TUDO numa viagem só de 1 carro (o de maior capacidade)
  for(const carro of carrosPorCapacidade){
    if(!pool.length) break;
    const pesoTotalPool=pool.reduce((s,p)=>s+(p.pesoEstimadoKg||0),0);
    const capQtd=Math.min(carro.limiteEntregas||99, capacidadeEstimada(carro)||99);
    if(pesoTotalPool<=(carro.pesoSugeridoKg||99999)*1.2 && pool.length<=capQtd){
      const viagemIx=escolherOuCriarViagem(carro.id,0);
      pool.forEach(p=>{
        S.atribuicoes["_semCarro"].pedidoIds=S.atribuicoes["_semCarro"].pedidoIds.filter(id=>id!==p.id);
        S.atribuicoes[carro.id].viagens[viagemIx].pedidoIds.push(p.id);
      });
      usados.add(carro.id);
      pool=[];
      break;
    }
  }

  // fase 2: não coube numa viagem só — tenta MAIS VIAGENS DO MESMO CARRO antes
  // de espalhar pra outro veículo (carro/viagem/km rodando é sempre custo)
  if(pool.length){
    for(const carro of carros){
      while(pool.length){
        const capQtd=Math.min(carro.limiteEntregas||99, capacidadeEstimada(carro)||99);
        const risco=riscoCarro(carro);
        const tempoRecargaSeAplica=risco.qtdViagens>0?(S.config.tempoRecargaMin||20):0;
        const tempoEstimadoNovaViagem=Math.min(pool.length,capQtd)*((S.config.tempoTrajetoMin||12)+(S.config.tempoParadaMin||15));
        if(risco.usado+tempoRecargaSeAplica+tempoEstimadoNovaViagem>risco.jan) break; // esse carro já não tem mais tempo sobrando no dia
        const escolhidos=montaViagem(carro,pool,capQtd);
        if(!escolhidos.length) break;
        const pesoEscolhidos=escolhidos.reduce((s,p)=>s+(p.pesoEstimadoKg||0),0);
        const viagemIx=escolherOuCriarViagem(carro.id,pesoEscolhidos);
        // essa viagem tem que começar vazia (senão estaria misturando com pedidos de outra leva) — se a última não estava vazia, já criou uma nova em escolherOuCriarViagem
        escolhidos.forEach(p=>{
          S.atribuicoes["_semCarro"].pedidoIds=S.atribuicoes["_semCarro"].pedidoIds.filter(id=>id!==p.id);
          S.atribuicoes[carro.id].viagens[viagemIx].pedidoIds.push(p.id);
        });
        usados.add(carro.id);
        pool=pool.filter(p=>!escolhidos.some(e=>e.id===p.id));
      }
      if(!pool.length) break;
    }
  }

  render();
  const nomesUsados=[...usados].map(id=>S.config.carros.find(c=>c.id===id)?.nome).filter(Boolean);
  const totalViagensCriadas=[...usados].reduce((s,id)=>s+(S.atribuicoes[id].viagens.filter(v=>v.pedidoIds.length).length),0);
  const sobrouSemCoord=semCoord.length;
  const sobrouNaoCoube=(S.atribuicoes["_semCarro"]?.pedidoIds||[]).length-sobrouSemCoord;
  let msg = usados.size<=1
    ? `✅ Esses pedidos cabem em só 1 veículo (${nomesUsados[0]||"—"}${totalViagensCriadas>1?`, em ${totalViagensCriadas} viagens no dia`:''}) — menos carro/viagem/km rodando = menos custo.`
    : `🚚 Não coube tudo num carro só — vai precisar de ${usados.size} veículos: ${nomesUsados.join(", ")}.`;
  if(sobrouNaoCoube>0) msg+=` ⚠️ ${sobrouNaoCoube} pedido(s) não coube(ram) em nenhum carro/viagem sem estourar peso ou horário — precisa de outro veículo ou ajustar manualmente.`;
  if(sobrouSemCoord>0) msg+=` ⚠️ ${sobrouSemCoord} pedido(s) sem coordenada identificada ficou(aram) de fora.`;
  S.msg=msg;
  for(const carroId of usados){
    const viagens=S.atribuicoes[carroId].viagens;
    for(let vix=0;vix<viagens.length;vix++){ if(viagens[vix].pedidoIds.length) await sugerirRota(carroId,vix); }
  }
}

function atribuirCarro(pedidoId,carroId){
  if(!carroId) return;
  const carro=(S.config.carros||[]).find(c=>c.id===carroId);
  const pedido=pedidoPorId(pedidoId);
  if(carro && pedido){
    const tetoEsseCarro=(carro.pesoSugeridoKg||99999)*1.2;
    if((pedido.pesoEstimadoKg||0)>tetoEsseCarro){
      const maiorCapacidadeKg=Math.max(0,...(S.config.carros||[]).map(c=>(c.pesoSugeridoKg||0)*1.2));
      if((pedido.pesoEstimadoKg||0)>maiorCapacidadeKg){
        if(!confirm(`⚠️ Esse pedido sozinho (${pedido.pesoEstimadoKg}kg) já passa do que QUALQUER carro configurado aguenta numa viagem. Provavelmente vai precisar de 2 carros juntos, ou 2 viagens até esse cliente.\n\nAtribuir mesmo assim?`)) return;
      } else {
        if(!confirm(`⚠️ Esse pedido (${pedido.pesoEstimadoKg}kg) sozinho já passa da capacidade do ${carro.nome} (${carro.pesoSugeridoKg}kg) numa viagem. Talvez caiba melhor num carro maior.\n\nAtribuir mesmo assim?`)) return;
      }
    }
  }
  removerDeTodasAtribuicoes(pedidoId);
  const viagemIx=escolherOuCriarViagem(carroId, pedido?.pesoEstimadoKg||0);
  if(viagemIx>0 && S.atribuicoes[carroId].viagens[viagemIx].pedidoIds.length===0){
    const risco=riscoCarro(carro);
    const tempoExtra=(S.config.tempoRecargaMin||20)+((S.config.tempoTrajetoMin||12)+(S.config.tempoParadaMin||15));
    if(risco.usado+tempoExtra>risco.jan){
      if(!confirm(`⚠️ Esse carro provavelmente já não tem mais tempo sobrando no dia (${Math.round(risco.usado)} de ${risco.jan} min já usados) — essa seria a ${viagemIx+1}ª viagem, com risco de não dar tempo.\n\nColocar esse pedido nessa viagem mesmo assim?`)) return;

  }
  S.atribuicoes[carroId].viagens[viagemIx].pedidoIds.push(pedidoId);
  delete_resultadoViagem(carroId,viagemIx);
  render();
}

async function sugerirRota(carroId,vix){
  vix=vix||0;
  const ids=(S.atribuicoes[carroId]?.viagens||[])[vix]?.pedidoIds||[];
  if(ids.length<1){ alert("Adicione pelo menos 1 pedido a essa viagem."); return; }
  const paradas=ids.map(id=>{ const p=pedidoPorId(id); return {id, endereco:p?.endereco||""}; }).filter(p=>p.endereco);
  if(!paradas.length){ alert("Nenhum pedido dessa viagem tem endereço de entrega cadastrado."); return; }
  const chave=carroId+"_"+vix;
  S.calculando[chave]=true; render();
  try{
    const j=await fetch(B+"/api/rotas/calcular",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({paradas})}).then(r=>r.json());
    if(!j.ok){ alert(j.erro||"Erro ao calcular rota"); S.calculando[chave]=false; render(); return; }
    if(!S.resultadoRota[carroId]) S.resultadoRota[carroId]=[];
    S.resultadoRota[carroId][vix]=j;
    // reordena a lista de pedidoIds dessa viagem conforme a rota otimizada
    S.atribuicoes[carroId].viagens[vix].pedidoIds=j.paradasOrdenadas.map(p=>p.id);
    S.carroMapaAtivo=chave;
  }catch(e){ alert("Erro: "+e.message); }
  S.calculando[chave]=false; render();
  setTimeout(()=>desenharMapa(carroId,vix),100);
}

// distância em linha reta (km) — usada só pra AGRUPAR entregas próximas antes
// de mandar pro Google calcular a rota de verdade (esse cálculo é local, não
// gasta chamada de API)
function distanciaRetaKm(a,b){
  const R=6371;
  const dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
  const la1=a.lat*Math.PI/180, la2=b.lat*Math.PI/180;
  const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

// o peso encaixar se as entregas forem espalhadas longe uma da outra, então

// ---------- decodifica o polyline do Google (formato padrão de encoding) ----------
function decodePolyline(str){
  let index=0,lat=0,lng=0,coords=[];
  while(index<str.length){
    let b,shift=0,result=0;
    do{ b=str.charCodeAt(index++)-63; result|=(b&0x1f)<<shift; shift+=5; }while(b>=0x20);
    lat+=(result&1)?~(result>>1):(result>>1);
    shift=0; result=0;
    do{ b=str.charCodeAt(index++)-63; result|=(b&0x1f)<<shift; shift+=5; }while(b>=0x20);
    lng+=(result&1)?~(result>>1):(result>>1);
    coords.push([lat/1e5,lng/1e5]);
  }
  return coords;
}

let _leafletCarregado=false;
function carregarLeaflet(){
  return new Promise(res=>{
    if(_leafletCarregado||window.L){ _leafletCarregado=true; res(); return; }
    const css=document.createElement("link"); css.rel="stylesheet"; css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(css);
    const js=document.createElement("script"); js.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"; js.onload=()=>{_leafletCarregado=true;res();}; document.head.appendChild(js);
  });
}
let _mapaLeaflet=null;
async function desenharMapa(carroId,vix){
  vix=vix||0;
  const box=document.getElementById("mapaRota"); if(!box) return;
  await carregarLeaflet();
  const resultado=(S.resultadoRota[carroId]||[])[vix]; if(!resultado) return;
  if(_mapaLeaflet){ _mapaLeaflet.remove(); _mapaLeaflet=null; }
  const centro=S.lojaCoord||{lat:-19.917,lng:-43.934};
  _mapaLeaflet=L.map("mapaRota").setView([centro.lat,centro.lng],12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(_mapaLeaflet);
  const pontos=[[centro.lat,centro.lng]];
  L.marker([centro.lat,centro.lng]).addTo(_mapaLeaflet).bindPopup("🏪 B13 Bebidas (saída/volta)");
  resultado.paradasOrdenadas.forEach((p,ix)=>{
    const ped=pedidoPorId(p.id);
    if(ped?.lat&&ped?.lng){
      pontos.push([ped.lat,ped.lng]);
      L.marker([ped.lat,ped.lng]).addTo(_mapaLeaflet).bindPopup(`${ix+1}º — Pedido ${ped.numero}<br>${esc(ped.clienteNome)}`);
    }
  });
  if(resultado.polyline){
    const linha=decodePolyline(resultado.polyline);
    L.polyline(linha,{color:"#FF0082",weight:4}).addTo(_mapaLeaflet);
    if(linha.length) _mapaLeaflet.fitBounds(linha);
  } else if(pontos.length>1){
    _mapaLeaflet.fitBounds(pontos);
  }
}

        <input type="number" value="${carro.limiteEntregas}" min="1" style="width:56px" oninput="S.config.carros[${ix}].limiteEntregas=Number(this.value)" title="Quantidade de entregas dessa rota">
        <span class="muted" style="white-space:nowrap">entregas</span>
        <input type="number" value="${carro.pesoSugeridoKg||200}" min="1" style="width:70px" oninput="S.config.carros[${ix}].pesoSugeridoKg=Number(this.value)" title="Peso sugerido (kg)">
        <span class="muted" style="white-space:nowrap">kg sugeridos</span>
        <span class="muted" style="white-space:nowrap">· sai às</span>
        <input type="time" value="${carro.horaSaida||'10:00'}" oninput="S.config.carros[${ix}].horaSaida=this.value" style="width:100px">
        <span class="muted" style="white-space:nowrap">· volta até</span>
        <input type="time" value="${carro.horaFimJanela||'19:00'}" oninput="S.config.carros[${ix}].horaFimJanela=this.value" style="width:100px">
        <button class="iconbtn" onclick="removerCarroConfig(${ix})" title="Remover">✕</button>
      </div>`).join("")}
    <div class="muted" style="font-size:11px;margin:-2px 0 8px">"Entregas" é quantas paradas essa rota deve ter no dia. "Kg sugeridos" é o peso ideal pra essa rota — o sistema tenta chegar perto disso, mas pode passar um pouco se precisar pra fechar a quantidade de entregas.</div>
    <button class="btn btn-ghost" style="margin-top:6px" onclick="addCarroConfig()">+ Adicionar carro</button>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-grn" style="flex:1" onclick="salvarConfig()">💾 Salvar configuração</button>
      <button class="btn btn-ghost" style="flex:1" onclick="fecharConfig()">Cancelar</button>
    </div>
  </div>`;
}

function htmlPedidoCard(p, modo){
  modo = modo || "disponivel"; // "disponivel" | "semCarro"
  const exp=!!S.expandido[p.id];
  const opcoesCarro=(S.config.carros||[]).map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join("");
  const faixa = modo==="disponivel"
    ? `<div style="background:#3a2a00;color:#ffd23f;font-size:11px;font-weight:800;padding:3px 10px;border-radius:6px 6px 0 0;margin:-12px -12px 10px">⏳ Aguardando agendamento</div>`
    : `<div style="background:#0f3a24;color:#3ce88a;font-size:11px;font-weight:800;padding:3px 10px;border-radius:6px 6px 0 0;margin:-12px -12px 10px">🗓️ Agendado pra ${dataLabel(S.data)} — aguardando carro</div>`;
  const diaCurto=new Date(S.data+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
  const acao = modo==="disponivel"
    ? `<button class="btn btn-mag" style="flex:1" onclick="agendarSemCarro(${p.id})">📅 Agendar pra ${diaCurto}</button>`
    : `<select id="selCarro-${p.id}" style="flex:1;min-width:120px">${opcoesCarro}</select>
       <button class="btn btn-mag" style="padding:6px 12px;font-size:11px" onclick="atribuirCarro(${p.id},document.getElementById('selCarro-${p.id}').value)">Atribuir →</button>
       <button class="btn btn-ghost" style="padding:6px 10px;font-size:11px" onclick="desagendar(${p.id})" title="Tirar do dia">↩</button>`;
  return `<div class="pedcard">
    ${faixa}
    <div class="top2">
      <div>
        <div class="num">Pedido ${esc(p.numero)}</div>
        <div class="cli">${esc(p.clienteNome)}</div>
        <div class="vend">Vendedor: ${esc(p.vendedorNome)}</div>
      </div>
      <div class="vals">
        <div><b>${brl(p.total)}</b></div>
        <div class="muted">Frete: ${brl(p.frete)}</div>
        <div class="muted">⚖️ ${p.pesoEstimadoKg} kg (estim.)</div>
      </div>
    </div>
    ${p.semEndereco
      ? `<div style="margin-top:6px;background:#3a1a00;border:1px solid #ff8c00;border-radius:6px;padding:6px 8px;font-size:11px;color:#ffb84d">⚠️ Sem endereço de entrega no pedido nem no cadastro do cliente. Adicione o endereço no Bling pra calcular a rota.</div>`
      : `<div class="muted" style="margin-top:6px">📍 ${esc(p.endereco||"endereço não identificado")}${p.enderecoOrigem==="cliente"?` <span style="color:#7fd4ff">(do cadastro do cliente)</span>`:""}</div>`}
    <div class="assignrow">
      <button class="btn btn-ghost" style="padding:6px 10px;font-size:11px" onclick="toggleExpandido(${p.id})">${exp?"▲ Ocultar itens":"▼ Ver itens ("+p.itens.length+")"}</button>
      ${acao}
    </div>
    <div class="itenslist ${exp?'on':''}">
      ${p.itens.map(i=>`<div class="itemrow"><span>${esc(i.descricao)}</span><span>${i.quantidade}x ${brl(i.valor)}</span></div>`).join("")}
    </div>
  </div>`;
}

// linha de uma parada (usada tanto antes quanto depois de calcular a rota) —
// sempre dá pra expandir e ver os produtos do pedido, clicando no nome
function htmlStopItem(ped,ix,infoExtra,botoes){
  if(!ped) return `<div class="stopitem"><div class="ordn">${ix+1}</div><div class="nm">Pedido não encontrado</div></div>`;
  const exp=!!S.expandido[ped.id];
  return `<div style="background:#0f0d24;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;overflow:hidden">
    <div class="stopitem" style="border:none;margin-bottom:0;cursor:pointer" onclick="toggleExpandido(${ped.id});event.stopPropagation()">
      <div class="ordn">${ix+1}</div>
      <div class="nm">Pedido ${esc(ped.numero)} — ${esc(ped.clienteNome)} <span class="muted">${exp?'▲':'▼'} ${ped.itens?.length||0} itens</span></div>
      ${infoExtra?`<div class="km">${infoExtra}</div>`:''}
      <div onclick="event.stopPropagation()" style="display:flex;gap:4px">${botoes}</div>
    </div>
    ${exp?`<div style="padding:6px 12px 10px 40px;border-top:1px solid var(--border)">
      <div class="muted" style="font-size:11px;margin-bottom:4px">💰 ${brl(ped.total)} · Frete ${brl(ped.frete)} · ⚖️ ${ped.pesoEstimadoKg}kg (estim.) · 📍 ${esc(ped.endereco||"—")}</div>
      ${(ped.itens||[]).map(i=>`<div class="itemrow"><span>${esc(i.descricao)}</span><span>${i.quantidade}x ${brl(i.valor)}</span></div>`).join("")||'<div class="muted" style="font-size:11px">Sem itens carregados.</div>'}
    </div>`:''}
  </div>`;
}

function htmlCarroBox(carro){
  const viagens=S.atribuicoes[carro.id]?.viagens||[{pedidoIds:[]}];
  const todosPedidos=pedidosCarroAtual(carro.id);
  const pesoTotalCarro=+todosPedidos.reduce((s,p)=>s+(p.pesoEstimadoKg||0),0).toFixed(1);
  const valorTotalCarro=todosPedidos.reduce((s,p)=>s+(p.total||0),0);
  const risco=riscoCarro(carro);
  const cap=capacidadeEstimada(carro);
  return `<div class="carrobox">
    <div class="head">
      <div class="nm">🚚 ${esc(carro.nome)} <span class="muted">(${todosPedidos.length} entrega${todosPedidos.length!==1?'s':''} no total · ${risco.qtdViagens||1} ${(risco.qtdViagens||1)!==1?'viagens':'viagem'} · ${carro.horaSaida||'10:00'}–${carro.horaFimJanela||'19:00'})</span></div>
      <button class="btn btn-ghost" onclick="adicionarViagem('${carro.id}')">+ Nova viagem</button>
    </div>
    ${risco.risco?`<div class="warn">🔴 Atenção: somando ${risco.qtdViagens>1?`as ${risco.qtdViagens} viagens desse carro (com o tempo de recarga entre elas)`:'a viagem'}, dá ${Math.round(risco.usado)} min — provavelmente não cabe na janela disponível (${risco.jan} min, ${carro.horaSaida}–${carro.horaFimJanela}). Considere tirar alguma entrega, usar outro carro, ou ajustar o horário.</div>`:''}
    ${viagens.map((v,vix)=>htmlViagemBox(carro,vix,cap)).join("")}
    <div class="resumo" style="border-top:1px solid var(--border);padding-top:8px;margin-top:2px">
      <span>💰 Total do carro: <b>${brl(valorTotalCarro)}</b></span>
      <span>⚖️ Peso total: <b style="${pesoTotalCarro>(carro.pesoSugeridoKg||99999)*(risco.qtdViagens||1)?'color:#ffd23f':''}">${pesoTotalCarro} kg</b></span>
      <span>⏱️ Tempo usado no dia: <b style="${risco.risco?'color:#ff8090':''}">${Math.round(risco.usado)} min</b> <span class="muted">/ ${risco.jan} min disponíveis</span></span>
    </div>
  </div>`;
}

function htmlViagemBox(carro,vix,cap){
  const viagem=(S.atribuicoes[carro.id]?.viagens||[])[vix]||{pedidoIds:[]};
  const ids=viagem.pedidoIds||[];
  const pedidosViagemArr=ids.map(id=>pedidoPorId(id)).filter(Boolean);
  const pesoViagem=+pedidosViagemArr.reduce((s,p)=>s+(p.pesoEstimadoKg||0),0).toFixed(1);
  const resultado=(S.resultadoRota[carro.id]||[])[vix];
  const chave=carro.id+"_"+vix;
  const acimaCapacidade=ids.length>cap;
  const acimaPeso=pesoViagem>(carro.pesoSugeridoKg||99999)*1.2;
  const totalViagens=(S.atribuicoes[carro.id]?.viagens||[]).length;
  return `<div style="background:#0f0d24;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px">
      <div style="font-weight:800;font-size:13px">🚗 Viagem ${vix+1} <span class="muted">(${ids.length} entrega${ids.length!==1?'s':''} · ${pesoViagem} kg)</span></div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-out" style="font-size:11px;padding:6px 10px" ${S.calculando[chave]?"disabled":""} onclick="sugerirRota('${carro.id}',${vix})">${S.calculando[chave]?"Calculando…":"🧭 Sugerir rota"}</button>
        ${totalViagens>1?`<button class="iconbtn" onclick="removerViagem('${carro.id}',${vix})" title="Remover essa viagem">✕ viagem</button>`:''}
      </div>
    </div>
    ${acimaCapacidade?`<div class="warn" style="font-size:11px;padding:6px 10px">⚠️ ${ids.length} entregas é mais do que a estimativa de capacidade por viagem (~${cap}).</div>`:''}
    ${acimaPeso?`<div class="warn" style="font-size:11px;padding:6px 10px">⚠️ Peso dessa viagem acima do sugerido (+20%) pra esse carro.</div>`:''}
    ${!ids.length?'<div class="muted" style="font-size:12px">Nenhum pedido nessa viagem ainda.</div>':
      (resultado?resultado.paradasOrdenadas.map((p,ix)=>{
        const ped=pedidoPorId(p.id);
        return htmlStopItem(ped,ix,`${p.distanciaProximaKm} km · ${p.duracaoProximaMin} min até aqui`,
          `<button class="iconbtn" onclick="removerDoCarreo('${carro.id}',${vix},${p.id})" title="Remover">✕</button>`);
      }).join("")
      :pedidosViagemArr.map((p,ix)=>htmlStopItem(p,ix,null,
          `<button class="iconbtn" onclick="moverNaLista('${carro.id}',${vix},${ix},-1)" title="Subir">▲</button>
           <button class="iconbtn" onclick="moverNaLista('${carro.id}',${vix},${ix},1)" title="Descer">▼</button>
           <button class="iconbtn" onclick="removerDoCarreo('${carro.id}',${vix},${p.id})" title="Remover">✕</button>`
        )).join(""))}
    ${resultado?`<div class="resumo" style="margin-top:6px"><span>🛣️ <b>${resultado.distanciaTotalKm} km</b></span><span>⏱️ <b>${resultado.duracaoTotalMin} min</b> dirigindo (real)</span><span>🕐 <b>~${resultado.duracaoTotalMin+ids.length*(S.config.tempoParadaMin||15)} min</b> no total (com as ${ids.length} parada${ids.length!==1?'s':''})</span></div>
    <button class="btn btn-ghost" style="margin-top:8px;font-size:11px" onclick="S.carroMapaAtivo='${chave}';render()">🗺️ ${S.carroMapaAtivo===chave?'Mapa aberto abaixo':'Ver rota no mapa'}</button>
    ${S.carroMapaAtivo===chave?`<div id="mapaRota"></div>`:''}`:''}
  </div>`;
}

carregarTudo();
</script>
</body>
</html>
