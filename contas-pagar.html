<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>B13 — Contas a Pagar</title>
<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;margin:0;padding:0}
:root{--mag:#FF0082;--bg:#0f0d24;--card:#151233;--borda:#2c2660;--muted:#9a95c9;--ok:#3ce88a;--warn:#ffd23f;--ruim:#ff8f7a}
body{background:var(--bg);color:#fff;min-height:100vh}
.top{background:linear-gradient(180deg,#2b2870,#262366);border-bottom:3px solid var(--mag);padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top img{height:34px}.top .t{font-weight:900;font-size:16px}.top .sp{flex:1}
.btn{border:none;border-radius:9px;font-weight:800;cursor:pointer;font-size:12px;padding:8px 12px;color:#fff;text-decoration:none;display:inline-block}
.btn-ghost{background:#1c1846;border:1px solid #3a3480}.btn-mag{background:var(--mag)}
.wrap{padding:14px;display:grid;gap:12px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;background:#1c1846;border:1px solid #514c96;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;color:#fff;user-select:none}
.chip.on{background:var(--mag);border-color:var(--mag)}
input,select{padding:8px 10px;border-radius:9px;border:1px solid #37327a;background:#0f0d24;color:#fff;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:12px;position:relative}
.kpi.alerta{border-color:#7a2a3a;background:#20122a}.kpi .v{font-size:22px;font-weight:900}.kpi .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-top:3px}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:4px}
.card{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:14px}
.card h3{font-size:14px;margin-bottom:4px}.desc{font-size:12px;color:var(--muted);margin-bottom:10px}
.rolagem{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
th{background:#0d0b1e;padding:8px 10px;text-align:right;font-size:11px;color:var(--muted);border-bottom:1px solid var(--borda);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--borda);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.ped{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--borda);border-radius:12px;margin-bottom:6px;background:#120f2c;cursor:pointer;flex-wrap:wrap}
.ped:hover{border-color:var(--mag)}.ped .info{flex:1;min-width:220px}.ped .l1{font-weight:800;font-size:14.5px}.ped .l2{font-size:12px;color:var(--muted);margin-top:3px}
.ped .dir{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.valor{font-weight:900;font-size:15px;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tag.ok{background:#11352a;color:#6be3a8}.tag.warn{background:#3a2a0a;color:var(--warn)}.tag.erro{background:#3d1020;color:#ff8aa3}.tag.neu{background:#24205a;color:#cfcaf5}.tag.azul{background:#0d2a44;color:#7fd0ff}
.ic{font-size:12px;color:#cfcaf5;white-space:nowrap}
.vazio{padding:26px;text-align:center;color:var(--muted)}
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:200;overflow-y:auto;padding:24px 10px}
.fundo.aberto{display:flex}.modal{background:#151233;border:1px solid var(--borda);border-radius:14px;padding:16px;width:100%;max-width:860px}
.bloco{background:#120f2c;border:1px solid var(--borda);border-radius:10px;padding:12px;margin-top:10px}
.bloco h4{font-size:13px;margin-bottom:8px;color:#cfcaf5}
.lin{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px solid #1d1946}.lin:last-child{border-bottom:none}
.lin span:first-child{color:var(--muted)}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.galeria a,.galeria div{display:block;border:1px solid var(--borda);border-radius:8px;overflow:hidden;background:#0b0a1e;text-decoration:none;color:#cfcaf5}
.galeria img{width:100%;height:110px;object-fit:cover;display:block}.galeria video{width:100%;height:110px;display:block;background:#000}
.galeria small{display:block;padding:5px 7px;font-size:10.5px;color:var(--muted)}
.tl{border-left:2px solid var(--borda);padding-left:12px}.tl div{font-size:12.5px;padding:4px 0}.tl b{color:#fff}.tl span{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.spin{display:inline-block;width:20px;height:20px;border:3px solid #514c96;border-top-color:var(--mag);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs .chip{font-size:12.5px}
.barras{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:6px}.barras div{flex:1;background:#3a3480;border-radius:4px 4px 0 0;position:relative;min-height:2px}
.barras div.on{background:var(--mag)}.barras small{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--muted)}
.cli{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--borda);border-radius:12px;margin-bottom:6px;background:#120f2c;cursor:pointer;flex-wrap:wrap}
.cli:hover{border-color:var(--mag)}.cli .info{flex:1;min-width:230px}.cli .l1{font-weight:800;font-size:14.5px}.cli .l2{font-size:12px;color:var(--muted);margin-top:3px}
.par{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.par div{background:#120f2c;border:1px solid var(--borda);border-radius:10px;padding:9px}.par b{display:block;font-size:16px}.par span{font-size:11px;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.form label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}.form input,.form select,textarea{width:100%}
textarea{padding:8px 10px;border-radius:9px;border:1px solid #37327a;background:#0f0d24;color:#fff;font-size:13px;min-height:70px}
#mapa{height:380px;border-radius:10px;border:1px solid var(--borda)}
.err{background:#3d1020;color:#ff8aa3;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:6px}.okmsg{background:#11352a;color:#6be3a8;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:6px}
.wrap .filtros{flex-wrap:wrap;min-width:0}.wrap .card{min-width:0;max-width:100%}.wrap .filtros input,.wrap .filtros select{max-width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:12px}.grid2>*{min-width:0}
.dist .lin{cursor:pointer}.dist .lin:hover{background:#1c1846}.barra{height:6px;background:#221e4f;border-radius:4px;overflow:hidden;margin-top:3px}.barra i{display:block;height:100%;background:#FF0082}
.ped{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid #221e4f;cursor:pointer}.ped:hover{background:#1c1846}.ped .x{flex:1;min-width:0}.ped .x b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ped .x span{color:var(--muted);font-size:12px}.tagp{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:4px;background:#2a2660;color:#cfcaff}
.tagp.ok{background:#0f3a28;color:#3ce88a}.tagp.al{background:#3d1020;color:#ff8aa3}.tagp.am{background:#3a2e08;color:#ffd23f}
.abas{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.abas span{padding:6px 12px;border-radius:999px;border:1px solid #3a3480;cursor:pointer;font-size:13px}.abas span.on{background:#FF0082;border-color:#FF0082;color:#fff}
.edtab input{background:#0f0c29;color:#fff;border:1px solid #3a3480;border-radius:6px;padding:6px;width:100%}

/* topo: o status do histórico quebra linha no celular em vez de esticar a página */
.top{flex-wrap:wrap}#sinc{white-space:normal;min-width:0;flex:1 1 180px;text-align:right}@media(max-width:600px){#sinc{font-size:10.5px;text-align:left}}
.wrap>*{min-width:0;max-width:100%;box-sizing:border-box}.wrap input,.wrap select{min-width:0;max-width:100%}.wrap .card{overflow-wrap:anywhere}
#video{width:100%;max-height:340px;background:#000;border-radius:12px;object-fit:cover}
.itn{border:1px solid #2a2660;border-radius:12px;padding:10px;margin-bottom:8px;background:#1c1846}.itn.pend{border-color:#ffd23f}.itn.ign{opacity:.5}
.wrap .tb{width:100%;border-collapse:collapse;font-size:12.5px;min-width:0}.tb td{padding:3px 4px}
.wrap>*{min-width:0;max-width:100%;box-sizing:border-box}.wrap .filtros{flex-wrap:wrap}.wrap input,.wrap select{max-width:100%;min-width:0}#comp{max-width:100%}#lista .ic,#recs .ic,#contasFin .ic{white-space:normal}
</style>
<script src="/nav.js"></script>
<script src="/ficha-pedido.js"></script>
<style>
  body.b13nav-open{ overflow:hidden }
  @media(min-width:900px){
    #b13nav{transform:translateX(0%) !important}
    #b13navOverlay{display:none !important}
    button[onclick="b13ToggleNav()"]{display:none !important}
    body > *:not(#b13nav):not([onclick="b13ToggleNav()"]):not(#b13navOverlay):not(.fundo){ /* menu agora no topo */ }
  }
</style>
</head>
<body><script>
  (function(){ if(!b13RequireLogin()) return; if(!b13BloquearSeSemAcesso("/contas-pagar")) return;
    document.addEventListener("DOMContentLoaded",function(){ const nav=document.createElement("div"); nav.innerHTML=b13RenderNav("/contas-pagar"); document.body.insertBefore(nav,document.body.firstChild); }); })();
</script>
<div class="top"><img src="/logo"><div class="t">📒 Contas a Pagar</div><div class="sp"></div><button class="btn btn-mag" onclick="abrirNova()">➕ Nova despesa</button></div>
<div class="wrap">
  <div class="kpis" id="kpis"><div class="vazio"><div class="spin"></div></div></div>
  <div class="card"><div class="filtros">
    <select id="fSit"><option value="abertas">Em aberto</option><option value="semana">Vencidas e próximos 7 dias</option><option value="vencidas">Só vencidas</option><option value="pagas">Pagas</option><option value="canceladas">Canceladas</option><option value="todas">Todas</option></select>
    <label class="ic">Vence de <input type="date" id="fDe"></label><label class="ic">até <input type="date" id="fAte"></label>
    <select id="fCat"><option value="">Todas as categorias</option></select>
    <input id="fBusca" type="search" placeholder="🔎 fornecedor, descrição ou nº da nota" style="flex:1;min-width:180px"></div>
    <div class="ic" id="fRes" style="margin-top:6px"></div></div>
  <div class="card"><div id="lista"></div></div>
  <div class="card"><h3>📊 Despesas por competência <select id="anoComp" onchange="carregarComp()" style="margin-left:8px"></select></h3><div class="ic" style="white-space:normal">Cada despesa no mês a que pertence (eventos anuais divididos nos meses). É a base da DRE e do ponto de equilíbrio.</div><div id="comp" style="overflow-x:auto;margin-top:6px"></div></div>
  <div class="card"><h3>📋 Orçamento previsto (planilha de custos)</h3><div id="orc" style="overflow-x:auto"></div></div>
  <div class="card"><h3>🏦 Contas e saldos iniciais</h3><div id="contasFin"></div>
    <div class="filtros" style="margin-top:8px"><input id="cfNome" placeholder="Nome (ex.: Banco Inter, Cofre)" style="flex:1;min-width:160px"><select id="cfTipo"><option value="banco">Banco</option><option value="cofre">Cofre</option><option value="caixa">Caixa</option></select>
      <input id="cfSaldo" inputmode="decimal" placeholder="Saldo inicial" style="width:120px"><input id="cfData" type="date" style="width:auto"><button class="btn btn-mag" onclick="salvarContaFin()">Salvar conta</button></div></div>
  <div class="grid2"><div class="card"><h3>🔁 Despesas fixas (todo mês)</h3><div id="recs"></div></div><div class="card"><h3>📊 Pago no mês por categoria</h3><div id="porCat"></div></div></div>
</div>
<div class="fundo" id="mod"><div class="modal" id="modCorpo" style="max-width:560px"></div></div>
<script>
const B = location.protocol.indexOf("http") === 0 ? "" : "https://app.b13bebidas.com.br";
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const brl = n => Number(n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const dmy = d => d ? String(d).slice(0, 10).split("-").reverse().join("/") : "—";
const hoje = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);
function token() { try { return (b13GetSession() || {}).token || ""; } catch (e) { return ""; } }
async function api(p, op) { op = op || {}; const r = await fetch(B + p, { ...op, headers: { "Content-Type": "application/json", "X-Auth-Token": token() } }); const j = await r.json().catch(() => ({})); return { ok: r.ok, j }; }
let D = null, BANCOS = [], CONTAS = [];
const FORMAS = ["Pix", "Boleto", "Transferência", "Dinheiro do caixa", "Dinheiro (cofre)", "Cartão", "Débito automático"]; let CAIXAS = [];
async function carregar() {
  const q = new URLSearchParams({ situacao: fSit.value, de: fDe.value, ate: fAte.value, categoria: fCat.value, busca: fBusca.value.trim() });
  const { ok, j } = await api("/api/contas-pagar?" + q); if (!ok) { lista.innerHTML = `<div class="err">${esc(j.erro || "Não consegui carregar.")}</div>`; return; } D = j; render(); }
function render() {
  const R = D.resumo, k = (v, l, s, cls, f) => `<a class="kpi ${cls || ""}" style="cursor:pointer;text-decoration:none;color:inherit" onclick="fSit.value='${f}';carregar()"><div class="v">${v}</div><div class="l">${l}</div><div class="s">${s}</div></a>`;
  kpis.innerHTML = k(brl(R.aberto), "Em aberto", R.qAberto + " conta(s)", "", "abertas") + k(brl(R.vencido), "Vencidas", R.qVencido + " conta(s)", R.qVencido ? "alerta" : "", "vencidas") + k(brl(R.semana), "Vencidas e próximos 7 dias", R.qSemana + " conta(s)", "", "semana") + k(brl(R.pagoMes), "Pagas no mês", R.qPagoMes + " conta(s)", "", "pagas");
  if (!fCat.dataset.ok) { fCat.innerHTML = `<option value="">Todas as categorias</option>` + D.categorias.map(c => `<option>${esc(c)}</option>`).join(""); fCat.dataset.ok = 1; }
  fRes.textContent = `${D.total} conta(s) · ${brl(D.somaFiltro)}`;
  const cor = { vencida: "#ff8aa3", "vence logo": "#ffd23f", aberta: "#cfcaff", paga: "#3ce88a", cancelada: "#9a95c9" };
  lista.innerHTML = D.itens.map(t => `<div class="lin" style="align-items:flex-start;padding:9px 4px"><div style="min-width:0;flex:1"><b>${esc(t.fornecedor?.nome || t.descricao)}</b> <span class="ic">· ${esc(t.descricao)}${t.parcela && t.parcela !== "1/1" ? " · " + esc(t.parcela) : ""} · ${esc(t.categoria)} · competência ${esc(t.competenciaTxt || "")}</span>
      <div class="ic" style="white-space:normal">vence ${dmy(t.vencimento)} · <b style="color:${cor[t.situacao]}">${esc(t.situacao)}</b>${t.status === "pago" ? ` em ${dmy(t.dataPagamento || "")} · ${esc(t.forma || "")}${t.banco ? " " + esc(t.banco) : ""}${t.valorPago && t.valorPago !== t.valor ? " · pago " + brl(t.valorPago) : ""}` : ""}${t.motivoCancelamento ? " · " + esc(t.motivoCancelamento) : ""}${t.origem === "recorrente" ? " · 🔁 fixa" : ""}</div></div>
    <div style="text-align:right;white-space:nowrap"><b>${brl(t.valor)}</b><div style="margin-top:4px;display:flex;gap:4px;justify-content:flex-end">
      ${t.status === "aberto" ? `<button class="btn btn-mag" style="padding:4px 10px" onclick="abrirPagar('${t.id}')">Pagar</button><button class="btn btn-ghost" style="padding:4px 8px" onclick="abrirEditar('${t.id}')">✏️</button><button class="btn btn-ghost" style="padding:4px 8px" onclick="cancelar('${t.id}')">🗑</button>` : `<button class="btn btn-ghost" style="padding:4px 8px" onclick="reabrir('${t.id}')">↩️ ${t.status === "pago" ? "Desfazer pagamento" : "Reabrir"}</button>`}</div></div></div>`).join("") || `<div class="ic">Nenhuma conta nesse filtro.</div>`;
  recs.innerHTML = (D.recorrentes || []).map(r => `<div class="lin"><span>${esc(r.descricao)} <span class="ic">· ${esc(r.categoria)} · todo dia ${r.dia}${r.ativo === false ? " · ⏸ pausada" : ""}</span></span><span><b>${brl(r.valor)}</b> <button class="btn btn-ghost" style="padding:2px 8px" onclick="pausar('${r.id}',${r.ativo === false})">${r.ativo === false ? "▶️" : "⏸"}</button></span></div>`).join("") || `<div class="ic">Nenhuma. Ao lançar uma despesa, marque "repetir todo mês".</div>`;
  porCat.innerHTML = (D.resumo.pagoPorCategoria || []).map(c => `<div class="lin"><span>${esc(c.categoria)}</span><b>${brl(c.valor)}</b></div>`).join("") || `<div class="ic">Nada pago neste mês ainda.</div>`;
}
const abrir = h => { modCorpo.innerHTML = h; mod.classList.add("aberto"); }, fechar = () => mod.classList.remove("aberto");
const selBanco = id => `<select id="${id}" style="width:100%"><option value="">—</option>${CONTAS.filter(c => c.ativa !== false).map(c => `<option>${esc(c.nome)}</option>`).join("")}${BANCOS.filter(b => !CONTAS.some(c => c.nome === (b.nome || b))).map(b => `<option>${esc(b.nome || b)}</option>`).join("")}<option>Cofre / dinheiro</option></select>`;
function abrirNova() { abrir(`<h3>➕ Nova despesa</h3><div class="grid2">
  <label><div class="ic">Descrição</div><input id="nDesc" style="width:100%" placeholder="ex.: Aluguel da loja"></label><label><div class="ic">Fornecedor / quem recebe</div><input id="nForn" style="width:100%"></label>
  <label><div class="ic">Categoria</div><select id="nCat" style="width:100%">${D.categorias.map(c => `<option>${esc(c)}</option>`).join("")}</select></label><label><div class="ic">Valor total</div><input id="nValor" inputmode="decimal" style="width:100%"></label>
  <label><div class="ic">Vencimento (1ª parcela)</div><input id="nVenc" type="date" value="${hoje()}" style="width:100%"></label><label><div class="ic">Parcelas (pagamentos)</div><input id="nParc" inputmode="numeric" value="1" style="width:100%"></label>
  <label><div class="ic">Competência (mês a que pertence)</div><input id="nComp" type="month" value="${hoje().slice(0, 7)}" style="width:100%"></label><label><div class="ic">Distribuir em quantos meses</div><input id="nCompM" inputmode="numeric" value="1" style="width:100%"></label></div>
  <div class="ic" style="white-space:normal;margin-top:4px">Ex.: IPVA ou seguro pagos de uma vez valem para o ano todo: competência no 1º mês e distribuir em 12. As parcelas são as datas de pagamento; a distribuição é para o custo mensal.</div>
  <label class="ic" style="display:block;margin-top:8px"><input type="checkbox" id="nRep"> 🔁 repetir todo mês (despesa fixa: o sistema cria a conta de cada mês sozinho)</label>
  <label class="ic" style="display:block;margin-top:4px"><input type="checkbox" id="nPago" onchange="nPagoBox.style.display=this.checked?'':'none'"> já foi paga</label>
  <div id="nPagoBox" class="grid2" style="display:none"><label><div class="ic">Forma</div><select id="nForma" style="width:100%">${FORMAS.map(f => `<option>${f}</option>`).join("")}</select></label><label><div class="ic">Banco / conta</div>${selBanco("nBanco")}</label></div>
  <div id="nMsg"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-ghost" style="flex:1" onclick="fechar()">Cancelar</button><button class="btn btn-mag" style="flex:1" onclick="salvarNova()">💾 Lançar</button></div>`); }
async function salvarNova() { const v = id => document.getElementById(id).value; const { ok, j } = await api("/api/contas-pagar", { method: "POST", body: JSON.stringify({ descricao: v("nDesc"), fornecedor: v("nForn"), categoria: v("nCat"), valor: v("nValor").replace(",", "."), vencimento: v("nVenc"), parcelas: v("nParc"), competencia: v("nComp"), competenciaMeses: v("nCompM"), repetirMensal: nRep.checked, pago: nPago.checked, forma: v("nForma"), banco: v("nBanco") }) });
  if (!ok) { nMsg.innerHTML = `<div class="err">${esc(j.erro || "Não consegui lançar.")}</div>`; return; } fechar(); carregar(); carregarComp(); }
async function abrirPagar(id) { try { const { j } = await api("/api/contas-pagar-caixas"); CAIXAS = j.caixas || []; } catch (e) {} abrirPagar2(id); }
function abrirPagar2(id) { const t = D.itens.find(x => x.id === id); abrir(`<h3>Pagar · ${esc(t.fornecedor?.nome || t.descricao)}</h3><div class="ic">${esc(t.descricao)} · vence ${dmy(t.vencimento)} · ${brl(t.valor)}</div><div class="grid2" style="margin-top:8px">
  <label><div class="ic">Data do pagamento</div><input id="pData" type="date" value="${hoje()}" style="width:100%"></label><label><div class="ic">Valor pago</div><input id="pValor" inputmode="decimal" value="${String(t.valor).replace(".", ",")}" style="width:100%"></label>
  <label><div class="ic">Forma</div><select id="pForma" style="width:100%" onchange="pCxBox.style.display=this.value==='Dinheiro do caixa'?'':'none';pBcBox.style.display=this.value==='Dinheiro do caixa'?'none':''">${FORMAS.map(f => `<option>${f}</option>`).join("")}</select></label><label id="pBcBox"><div class="ic">Banco / conta</div>${selBanco("pBanco")}</label>
  <label id="pCxBox" style="display:none"><div class="ic">De qual caixa (vira sangria nele)</div><select id="pCaixa" style="width:100%">${CAIXAS.map(c => `<option value="${c.id}">${esc(c.nome)} · gaveta ${brl(c.gaveta)}</option>`).join("") || "<option value=''>nenhum caixa aberto</option>"}</select></label></div>
  <label style="display:block;margin-top:6px"><div class="ic">Observação</div><input id="pObs" style="width:100%"></label><div id="pMsg"></div>
  <div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-ghost" style="flex:1" onclick="fechar()">Cancelar</button><button class="btn btn-mag" style="flex:1" onclick="pagar('${id}')">✅ Confirmar pagamento</button></div>`); }
async function pagar(id) { const v = x => document.getElementById(x).value; const { ok, j } = await api(`/api/contas-pagar/${id}/pagar`, { method: "POST", body: JSON.stringify({ data: v("pData"), valorPago: v("pValor").replace(",", "."), forma: v("pForma"), banco: v("pBanco"), sessaoId: v("pCaixa"), observacao: v("pObs") }) });
  if (!ok) { pMsg.innerHTML = `<div class="err">${esc(j.erro || "Não consegui.")}</div>`; return; } fechar(); carregar(); }
function abrirEditar(id) { const t = D.itens.find(x => x.id === id); abrir(`<h3>✏️ Editar conta</h3><div class="grid2"><label><div class="ic">Descrição</div><input id="eDesc" value="${esc(t.descricao)}" style="width:100%"></label>
  <label><div class="ic">Categoria</div><select id="eCat" style="width:100%">${D.categorias.map(c => `<option ${c === t.categoria ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></label>
  <label><div class="ic">Valor</div><input id="eValor" inputmode="decimal" value="${String(t.valor).replace(".", ",")}" style="width:100%"></label><label><div class="ic">Vencimento</div><input id="eVenc" type="date" value="${t.vencimento}" style="width:100%"></label>
  <label><div class="ic">Competência</div><input id="eComp" type="month" value="${esc(t.competencia || String(t.vencimento).slice(0, 7))}" style="width:100%"></label><label><div class="ic">Distribuir em meses</div><input id="eCompM" inputmode="numeric" value="${t.competenciaMeses || 1}" style="width:100%"></label></div><div id="eMsg"></div>
  <div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-ghost" style="flex:1" onclick="fechar()">Cancelar</button><button class="btn btn-mag" style="flex:1" onclick="salvarEdicao('${id}')">💾 Salvar</button></div>`); }
async function salvarEdicao(id) { const v = x => document.getElementById(x).value; const { ok, j } = await api(`/api/contas-pagar/${id}/editar`, { method: "POST", body: JSON.stringify({ descricao: v("eDesc"), categoria: v("eCat"), valor: v("eValor").replace(",", "."), vencimento: v("eVenc"), competencia: v("eComp"), competenciaMeses: v("eCompM") }) });
  if (!ok) { eMsg.innerHTML = `<div class="err">${esc(j.erro || "Não consegui.")}</div>`; return; } fechar(); carregar(); }
async function cancelar(id) { const m = prompt("Motivo do cancelamento:"); if (!m) return; const { ok, j } = await api(`/api/contas-pagar/${id}/cancelar`, { method: "POST", body: JSON.stringify({ motivo: m }) }); if (!ok) alert(j.erro); carregar(); }
async function reabrir(id) { if (!confirm("Voltar esta conta para 'em aberto'?")) return; const { ok, j } = await api(`/api/contas-pagar/${id}/reabrir`, { method: "POST", body: "{}" }); if (!ok) alert(j.erro); carregar(); }
async function pausar(id, ativar) { await api(`/api/contas-pagar-recorrentes/${id}`, { method: "POST", body: JSON.stringify({ ativo: ativar }) }); carregar(); }
mod.addEventListener("click", e => { if (e.target.id === "mod") fechar(); });
let _tb; fBusca.addEventListener("input", () => { clearTimeout(_tb); _tb = setTimeout(carregar, 350); }); [fSit, fDe, fAte, fCat].forEach(el => el.addEventListener("change", carregar));
// contas financeiras e despesas por competência
async function carregarOrc() { const { ok, j } = await api("/api/financeiro/orcamento"); if (!ok) { orc.innerHTML = `<div class="err">${esc(j.erro || "")}</div>`; return; }
  const T = j.totais, PE = j.pontoEquilibrio, f = v => brl(v), p = v => v == null ? "—" : String(v).replace(".", ",") + "%";
  orc.innerHTML = `<div class="kpis" style="margin-bottom:8px"><div class="kpi"><div class="v">${f(T.fixas.previsto)}</div><div class="l">Fixas previstas/mês</div><div class="s">jan ${f(T.fixas.jan)} · fev ${f(T.fixas.fev)}</div></div>
    <div class="kpi"><div class="v">${f(T.variaveis.previsto)}</div><div class="l">Variáveis previstas/mês</div><div class="s">${p(PE.variaveisPct)} do faturamento</div></div>
    <div class="kpi ${PE.atingidoPct != null && PE.atingidoPct < 100 ? "alerta" : ""}"><div class="v">${PE.mensal ? f(PE.mensal) : "—"}</div><div class="l">Ponto de equilíbrio/mês</div><div class="s">${PE.mensal ? f(PE.diario) + " por dia útil · 30 dias faturou " + f(PE.fat30) + " (" + p(PE.atingidoPct) + ")" : "precisa da margem bruta (cadastre custos)"}</div></div>
    <div class="kpi"><div class="v">${p(PE.margemContribPct)}</div><div class="l">Margem de contribuição</div><div class="s">margem bruta ${p(PE.margemBrutaPct)} − variáveis ${p(PE.variaveisPct)} · custo cadastrado em ${p(PE.coberturaCusto)} das vendas</div></div></div>
    <table style="width:100%;min-width:520px;border-collapse:collapse;font-size:12px"><tr class="ic"><td>Item</td><td>Conta</td><td style="text-align:right">Jan</td><td style="text-align:right">Fev</td><td style="text-align:right">Previsto/mês</td></tr>
    ${j.itens.map(x => `<tr style="border-top:1px solid #2a2660"><td>${esc(x.nome)}</td><td class="ic" style="white-space:normal">${esc(x.conta)}${x.tipo === "variavel" ? " · variável" : ""}</td><td style="text-align:right">${f(x.jan)}</td><td style="text-align:right">${f(x.fev)}</td><td style="text-align:right"><b>${f(x.previsto)}</b></td></tr>`).join("")}</table>
    <div class="ic" style="white-space:normal;margin-top:6px">${esc(j.fonte || "")}. Pró-labore lançado como despesa fixa (5.1.5).</div>`; }
async function carregarContasFin() { const { j } = await api("/api/financeiro/contas"); CONTAS = j.contas || [];
  contasFin.innerHTML = CONTAS.map(c => `<div class="lin"><span>${esc(c.nome)} <span class="ic">· ${esc(c.tipo)} · desde ${dmy(c.dataInicial)}</span></span><b>${brl(c.saldoInicial)}</b></div>`).join("") || `<div class="ic">Cadastre os bancos, o cofre e os caixas com o saldo do dia de início. A partir daí o sistema calcula o saldo de cada um.</div>`; }
async function salvarContaFin() { const v = id => document.getElementById(id).value; const { ok, j } = await api("/api/financeiro/contas", { method: "POST", body: JSON.stringify({ nome: v("cfNome"), tipo: v("cfTipo"), saldoInicial: v("cfSaldo").replace(",", "."), dataInicial: v("cfData") }) });
  if (!ok) { alert(j.erro || "Não consegui salvar."); return; } cfNome.value = ""; cfSaldo.value = ""; carregarContasFin(); }
async function carregarComp() { const { j } = await api("/api/financeiro/competencia?ano=" + (anoComp.value || hoje().slice(0, 4))); if (!j.ok) { comp.innerHTML = `<div class="err">${esc(j.erro || "")}</div>`; return; }
  const M = j.meses, nomeM = m => ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"][Number(m.slice(5)) - 1], f = v => v ? Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 0, maximumFractionDigits: 0 }) : "";
  const linha = (rot, vals, tot, est) => `<tr style="${est || ""}"><td style="white-space:nowrap;text-align:left">${rot}</td>${vals.map(v => `<td style="text-align:right">${f(v)}</td>`).join("")}<td style="text-align:right"><b>${f(tot)}</b></td></tr>`;
  const sum = a => a.reduce((x, y) => x + y, 0);
  comp.innerHTML = j.linhas.length ? `<table style="min-width:900px;width:100%;border-collapse:collapse;font-size:12px"><tr class="ic"><td style="text-align:left">Conta</td>${M.map(m => `<td style="text-align:right">${nomeM(m)}</td>`).join("")}<td style="text-align:right">Ano</td></tr>
    ${j.linhas.map(l => linha(`${esc(l.cod)} ${esc(l.nome)}`, M.map(m => l.meses[m] || 0), l.total)).join("")}
    ${linha("<b>Despesas variáveis</b>", j.totais.variaveis, sum(j.totais.variaveis), "border-top:1px solid #3a3480")}${linha("<b>Despesas fixas</b>", j.totais.fixas, sum(j.totais.fixas))}${linha("Compras de mercadoria (vão para o CMV)", j.totais.compras, sum(j.totais.compras), "color:#9a95c9")}</table>` : `<div class="ic">Nenhuma despesa lançada para este ano.</div>`; }
(async () => { const a = Number(hoje().slice(0, 4)); anoComp.innerHTML = [a - 1, a, a + 1].map(x => `<option ${x === a ? "selected" : ""}>${x}</option>`).join(""); cfData.value = hoje();
  try { const b = await fetch(B + "/api/pix-bancos").then(r => r.json()); BANCOS = (b && b.bancos) || []; } catch (e) {} carregarContasFin(); carregarComp(); carregarOrc(); carregar(); })();
</script>
