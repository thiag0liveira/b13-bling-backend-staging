<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B13 — Frente de Caixa</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
  body{background:#0f0d24;color:#fff;min-height:100vh}
  .top{background:#181542;padding:14px 20px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.4);position:sticky;top:0;z-index:10;flex-wrap:wrap}
  .top img{height:36px}
  .top .t{font-weight:900;font-size:20px}
  .top .sp{flex:1}
  .pill{font-size:13px;font-weight:800;padding:8px 14px;border-radius:20px}
  .pill.aberto{background:#0a3a20;color:#8fffc0;border:1px solid #2f9e6b}
  .pill.fechado{background:#3a0010;color:#ff8090;border:1px solid #ff4466}
  .btn{background:#FF0082;color:#fff;border:none;border-radius:10px;padding:14px 22px;font-weight:800;font-size:15px;cursor:pointer;min-height:48px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-ghost{background:transparent;border:1px solid #514c96;color:#fff}
  .btn-sm{padding:11px 16px;font-size:14px;min-height:42px}
  .wrap{max-width:1380px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
  @media(max-width:1100px){ .wrap{grid-template-columns:1fr 1fr} }
  @media(max-width:700px){ .wrap{grid-template-columns:1fr} .top{padding:10px 12px} .top .t{font-size:17px} }
  .card{background:#181542;border-radius:14px;padding:16px;margin-bottom:14px}
  .card h3{font-size:16px;margin-bottom:10px}
  .busca{width:100%;padding:16px;font-size:17px;background:#0f0d24;border:2px solid #514c96;border-radius:10px;color:#fff}
  .busca:focus{border-color:#FF0082;outline:none}
  .res{margin-top:8px;max-height:340px;overflow:auto}
  .resitem{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #2a2660;cursor:pointer;border-radius:8px}
  .resitem:hover{background:#1f1c4d}
  .resitem img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:6px;flex-shrink:0}
  .resitem .semimg{width:52px;height:52px;background:#241f52;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .resitem .info{flex:1;min-width:0}
  .resitem .nome{font-size:14px;font-weight:700}
  .resitem .meta{font-size:12px;color:#9a95c9}
  .resitem .preco{font-weight:900;color:#ffd23f;font-size:15px}
  .item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #2a2660;font-size:14px}
  .item img{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:6px;flex-shrink:0}
  .item .semimg{width:46px;height:46px;background:#241f52;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .item .nome{flex:1;min-width:0}
  .item .qtd{display:flex;align-items:center;gap:6px}
  .item .qtd button{width:38px;height:38px;background:#1c1846;border:1px solid #514c96;border-radius:8px;color:#fff;cursor:pointer;font-size:18px;font-weight:800}
  .item .qtd input{width:52px;text-align:center;background:#0f0d24;border:1px solid #514c96;border-radius:6px;color:#fff;padding:8px;font-size:15px}
  .item .subtotal{width:90px;text-align:right;font-weight:800}
  .item .rm{background:#3a0010;border:1px solid #ff4466;color:#ff8090;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;min-height:38px}
  .linha{display:flex;justify-content:space-between;padding:8px 0;font-size:15px;align-items:center}
  .total{font-size:30px;font-weight:900;color:#ffd23f}
  .formas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .forma{background:#1c1846;border:2px solid #514c96;border-radius:12px;padding:18px 12px;text-align:center;cursor:pointer;font-size:15px;font-weight:800;min-height:64px;display:flex;align-items:center;justify-content:center}
  .forma.sel{border-color:#FF0082;background:#2a1a4d}
  .pagRow{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px}
  .pagRow input{width:120px;background:#0f0d24;border:1px solid #514c96;border-radius:8px;color:#fff;padding:10px;text-align:right;font-size:15px}
  .muted{color:#9a95c9;font-size:12px}
  .err{background:#3a0010;border:1px solid #ff4466;color:#ff8090;border-radius:8px;padding:12px;margin:10px 0;font-size:14px}
  .ok{background:#0a3a20;border:1px solid #2f9e6b;color:#8fffc0;border-radius:8px;padding:16px;margin:10px 0;font-size:15px;text-align:center}
  input[type=checkbox]{width:20px;height:20px}
  input[type=number],input[type=text]{background:#0f0d24;border:1px solid #514c96;border-radius:8px;color:#fff;padding:10px;font-size:15px}
  .modalBg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal{background:#181542;border-radius:14px;padding:22px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
  .modal input[type=number],.modal input[type=text],.modal input[type=password]{width:100%;font-size:16px;padding:12px}
  .modal .btn{font-size:15px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bloqueio{text-align:center;padding:50px 20px}
</style>
</head>
<body>
<script src="/nav.js"></script>
<script>
if(!b13RequireLogin())document.write=function(){};
document.addEventListener("DOMContentLoaded",function(){
  const nav=document.createElement("div");
  nav.innerHTML=b13RenderNav("/frente-caixa");
  document.body.insertBefore(nav,document.body.firstChild);
});
</script>

<div class="top">
  <img src="/logo">
  <div class="t">Frente de Caixa</div>
  <span id="pillCaixa" class="pill fechado">Caixa fechado</span>
  <div class="sp"></div>
  <button class="btn btn-ghost btn-sm" onclick="abrirModalMinhasVendas()">🧾 Minhas Vendas</button>
  <button class="btn btn-ghost btn-sm" onclick="imprimirComprovante(ULTIMA_VENDA)">🖨️ Reimprimir última venda</button>
  <button class="btn btn-ghost btn-sm" onclick="pedirAutorizacao(()=>abrirModalMovimento('sangria'))">💸 Sangria</button>
  <button class="btn btn-ghost btn-sm" onclick="pedirAutorizacao(()=>abrirModalMovimento('suprimento'))">💰 Suprimento</button>
  <button class="btn btn-ghost btn-sm" onclick="pedirAutorizacao(abrirModalHistorico)">📜 Histórico</button>
  <button class="btn btn-ghost btn-sm" onclick="pedirAutorizacao(abrirModalCaixasAbertos)">🏪 Caixas Abertos</button>
  <button class="btn btn-sm" id="btnAbrirFechar" onclick="cliqueAbrirFechar()">🔓 Abrir caixa</button>
</div>

<div id="conteudo"></div>
<div id="modais"></div>

<script>
const BACKEND=(location.protocol.indexOf("http")===0)?"":"https://b13-bling-backend-production.up.railway.app";
function brl(n){ return (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function hora(ms){ return new Date(ms).toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo"}); }
function operadorAtual(){ try{ return (b13GetSession()||{}).nome||"—"; }catch(e){ return "—"; } }
function funcionarioIdAtual(){ try{ return (b13GetSession()||{}).id||""; }catch(e){ return ""; } }

let CAIXA={aberta:false,sessao:null,resumo:null};
let CARRINHO=[];
let FORMAS=[];
let PAGAMENTOS=[{formaId:null,formaNome:"",valor:0}];
let CONSUMIDOR_FINAL=null; // {id,nome} — cliente padrão quando ninguém é selecionado
let CLIENTE_SELECIONADO=null; // {id,nome} — se o operador escolher um cliente específico
let _timerPainelAdicionado=null;
let ULTIMA_VENDA=null; // guarda a última venda concluída, pra reimprimir o comprovante

async function carregarConsumidorFinal(){
  try{
    const j=await fetch(BACKEND+"/api/pdv/consumidor-final").then(r=>r.json());
    CONSUMIDOR_FINAL=j.data;
  }catch(e){ CONSUMIDOR_FINAL=null; }
}

// ---------------- sessão de caixa ----------------
async function carregarCaixa(){
  try{
    const j=await fetch(BACKEND+"/api/caixa-sessao/atual?funcionarioId="+encodeURIComponent(funcionarioIdAtual())).then(r=>r.json());
    CAIXA=j;
  }catch(e){ CAIXA={aberta:false}; }
  render();
}

function cliqueAbrirFechar(){
  if(CAIXA.aberta) pedirAutorizacao(abrirModalFechamento);
  else abrirModalCaixa();
}

function abrirModalCaixa(){
  if(CAIXA.aberta) return abrirModalFechamento();
  document.getElementById("modais").innerHTML=`
    <div class="modalBg" onclick="if(event.target===this)fecharModais()">
      <div class="modal">
        <h3>🔓 Abrir caixa</h3>
        <p class="muted" style="margin-bottom:12px">Informe o valor em dinheiro que já está na gaveta (fundo de troco).</p>
        <div class="muted" style="margin-bottom:4px">Troco inicial (R$)</div>
        <input type="number" step="0.01" min="0" id="mTroco" value="0" style="width:100%;font-size:18px;text-align:right" autofocus>
        <div id="mErro"></div>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="btn" style="flex:1" onclick="confirmarAbertura()">Abrir caixa</button>
          <button class="btn btn-ghost" onclick="fecharModais()">Cancelar</button>
        </div>
      </div>
    </div>`;
}

async function confirmarAbertura(){
  const trocoInicial=+document.getElementById("mTroco").value||0;
  try{
    const r=await fetch(BACKEND+"/api/caixa-sessao/abrir",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({trocoInicial,operador:operadorAtual(),funcionarioId:funcionarioIdAtual()})});
    const j=await r.json();
    if(!r.ok||j.erro) throw new Error(j.erro||"Erro ao abrir caixa");
    fecharModais(); carregarCaixa();
  }catch(e){ document.getElementById("mErro").innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

function abrirModalMovimento(tipo){
  if(!CAIXA.aberta) return alert("Abra o caixa antes de registrar "+(tipo==="sangria"?"uma sangria":"um suprimento")+".");
  const ehSangria=tipo==="sangria";
  document.getElementById("modais").innerHTML=`
    <div class="modalBg" onclick="if(event.target===this)fecharModais()">
      <div class="modal">
        <h3>${ehSangria?"💸 Sangria (retirada)":"💰 Suprimento (entrada)"}</h3>
        <p class="muted" style="margin-bottom:12px">${ehSangria?"Retirada de dinheiro da gaveta (ex: depósito, pagamento de despesa).":"Entrada de dinheiro na gaveta (ex: reforço de troco)."}</p>
        <div class="muted" style="margin-bottom:4px">Valor (R$)</div>
        <input type="number" step="0.01" min="0.01" id="mValor" style="width:100%;font-size:18px;text-align:right" autofocus>
        <div class="muted" style="margin:10px 0 4px">Motivo</div>
        <input type="text" id="mMotivo" placeholder="${ehSangria?"ex: depósito bancário":"ex: reforço de troco"}" style="width:100%">
        <div id="mErro"></div>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="btn" style="flex:1" onclick="confirmarMovimento('${tipo}')">Registrar</button>
          <button class="btn btn-ghost" onclick="fecharModais()">Cancelar</button>
        </div>
      </div>
    </div>`;
}

async function confirmarMovimento(tipo){
  const valor=+document.getElementById("mValor").value||0;
  const motivo=document.getElementById("mMotivo").value.trim();
  if(!(valor>0)){ document.getElementById("mErro").innerHTML=`<div class="err">Informe um valor maior que zero.</div>`; return; }
  try{
    const r=await fetch(BACKEND+"/api/caixa-sessao/movimento",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({tipo,valor,motivo,operador:operadorAtual(),funcionarioId:funcionarioIdAtual()})});
    const j=await r.json();
    if(!r.ok||j.erro) throw new Error(j.erro||"Erro ao registrar");
    fecharModais(); carregarCaixa();
  }catch(e){ document.getElementById("mErro").innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

function abrirModalFechamento(){
  const r=CAIXA.resumo||{};
  document.getElementById("modais").innerHTML=`
    <div class="modalBg" onclick="if(event.target===this)fecharModais()">
      <div class="modal">
        <h3>🔒 Fechar caixa — conferência</h3>
        <div class="card" style="background:#1c1846;margin:12px 0">
          <div class="linha"><span>Troco inicial</span><b>${brl(r.trocoInicial)}</b></div>
          <div class="linha"><span>Vendas em dinheiro</span><b>${brl(r.vendasDinheiro)}</b></div>
          <div class="linha"><span>+ Suprimentos</span><b style="color:#8fffc0">${brl(r.totalSuprimentos)}</b></div>
          <div class="linha"><span>− Sangrias</span><b style="color:#ff8090">${brl(r.totalSangrias)}</b></div>
          <div class="linha" style="border-top:1px solid #2a2660;padding-top:8px;margin-top:6px">
            <span><b>Esperado na gaveta</b></span><b style="font-size:18px;color:#ffd23f">${brl(r.esperadoGaveta)}</b>
          </div>
        </div>
        <div class="muted" style="margin-bottom:4px">Valor contado na gaveta (R$)</div>
        <input type="number" step="0.01" min="0" id="mContado" style="width:100%;font-size:20px;text-align:right" oninput="calcularDiferenca()" autofocus>
        <div id="mDif" style="text-align:center;margin-top:10px;font-weight:800"></div>
        <div class="muted" style="margin:10px 0 4px">Observação (opcional)</div>
        <input type="text" id="mObs" placeholder="ex: faltou troco de R$ 2" style="width:100%">
        <div id="mErro"></div>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="btn btn-ghost btn-sm" onclick="imprimirRelatorioCaixa(CAIXA.sessao,CAIXA.resumo,CAIXA.movimentos,null)">🖨️</button>
          <button class="btn" style="flex:1" onclick="confirmarFechamento()">Fechar caixa</button>
          <button class="btn btn-ghost" onclick="fecharModais()">Cancelar</button>
        </div>
      </div>
    </div>`;
}

function calcularDiferenca(){
  const contado=+document.getElementById("mContado").value||0;
  const esperado=(CAIXA.resumo||{}).esperadoGaveta||0;
  const dif=+(contado-esperado).toFixed(2);
  const el=document.getElementById("mDif");
  if(Math.abs(dif)<0.01){ el.innerHTML=`<span style="color:#8fffc0">✅ Caixa bate certinho</span>`; }
  else if(dif>0){ el.innerHTML=`<span style="color:#ffd23f">▲ Sobra de ${brl(dif)}</span>`; }
  else { el.innerHTML=`<span style="color:#ff8090">▼ Falta ${brl(-dif)}</span>`; }
}

async function confirmarFechamento(){
  const valorContado=+document.getElementById("mContado").value||0;
  const observacao=document.getElementById("mObs").value.trim();
  try{
    const r=await fetch(BACKEND+"/api/caixa-sessao/fechar",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({valorContado,observacao,operador:operadorAtual(),funcionarioId:funcionarioIdAtual()})});
    const j=await r.json();
    if(!r.ok||j.erro) throw new Error(j.erro||"Erro ao fechar caixa");
    const f=j.fechamento;
    window._ultimoFechamento=j;
    document.getElementById("modais").innerHTML=`
      <div class="modalBg" onclick="if(event.target===this){fecharModais();carregarCaixa();}">
        <div class="modal" style="text-align:center">
          <h3>✅ Caixa fechado</h3>
          <div class="card" style="background:#1c1846;margin:14px 0;text-align:left">
            <div class="linha"><span>Esperado</span><b>${brl(f.esperado)}</b></div>
            <div class="linha"><span>Contado</span><b>${brl(f.valorContado)}</b></div>
            <div class="linha" style="border-top:1px solid #2a2660;padding-top:8px">
              <span>Diferença</span>
              <b style="color:${Math.abs(f.diferenca)<0.01?"#8fffc0":(f.diferenca>0?"#ffd23f":"#ff8090")}">${brl(f.diferenca)}</b>
            </div>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-ghost" style="flex:1" onclick="imprimirRelatorioCaixa(window._ultimoFechamento.sessao,window._ultimoFechamento.resumo,window._ultimoFechamento.movimentos,window._ultimoFechamento.fechamento)">🖨️ Imprimir relatório</button>
            <button class="btn" style="flex:1" onclick="fecharModais();carregarCaixa()">OK</button>
          </div>
        </div>
      </div>`;
  }catch(e){ document.getElementById("mErro").innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

async function abrirModalCaixasAbertos(){
  document.getElementById("modais").innerHTML=`<div class="modalBg"><div class="modal"><div class="muted">Carregando…</div></div></div>`;
  try{
    const j=await fetch(BACKEND+"/api/caixa-sessao/abertos").then(r=>r.json());
    const lista=j.data||[];
    document.getElementById("modais").innerHTML=`
      <div class="modalBg" onclick="if(event.target===this)fecharModais()">
        <div class="modal" style="max-width:560px">
          <h3>🏪 Caixas abertos agora</h3>
          ${lista.length?lista.map(s=>`
            <div class="card" style="background:#1c1846;margin:10px 0">
              <div style="font-weight:800;margin-bottom:4px">👤 ${esc(s.operador||"—")}</div>
              <div class="muted" style="font-size:12px;margin-bottom:6px">Aberto desde ${hora(s.abertaEm)}</div>
              <div class="linha"><span>Vendas (${s.resumo.qtdVendas})</span><b>${brl(s.resumo.totalVendas)}</b></div>
              <div class="linha"><span>Esperado na gaveta</span><b style="color:#ffd23f">${brl(s.resumo.esperadoGaveta)}</b></div>
              <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:6px" onclick="verMovimentosSessao('${s.id}')">📋 Ver movimentos</button>
            </div>`).join(""):'<div class="muted">Nenhum caixa aberto no momento.</div>'}
          <button class="btn btn-ghost" style="width:100%;margin-top:10px" onclick="fecharModais()">Fechar</button>
        </div>
      </div>`;
  }catch(e){ document.getElementById("modais").innerHTML=`<div class="modalBg" onclick="fecharModais()"><div class="modal"><div class="err">Erro ao carregar</div></div></div>`; }
}

function nomeMovimento(m){
  if(m.tipo==="venda") return `🛒 Venda #${esc(m.numero||m.pedidoId)} — ${brl(m.total)}${m.clienteNome?` <span class="muted" style="font-size:11px">(${esc(m.clienteNome)})</span>`:""}<div style="font-size:11px;color:#9a95c9;margin-top:2px">${(m.pagamentos||[]).map(p=>esc(p.formaNome)+": "+brl(p.valor)).join(" · ")}</div>`;
  if(m.tipo==="sangria") return `💸 Sangria — ${brl(m.valor)}${m.motivo?" ("+esc(m.motivo)+")":""}`;
  if(m.tipo==="suprimento") return `💰 Suprimento — ${brl(m.valor)}${m.motivo?" ("+esc(m.motivo)+")":""}`;
  return esc(m.tipo);
}

async function verMovimentosSessao(id){
  document.getElementById("modais").innerHTML=`<div class="modalBg"><div class="modal"><div class="muted">Carregando…</div></div></div>`;
  try{
    const j=await fetch(BACKEND+"/api/caixa-sessao/"+id+"/movimentos").then(r=>r.json());
    const movs=j.movimentos||[];
    window._sessaoInspecionada=j;
    document.getElementById("modais").innerHTML=`
      <div class="modalBg" onclick="if(event.target===this)fecharModais()">
        <div class="modal" style="max-width:560px">
          <h3>📋 Movimentos — ${esc(j.sessao?.operador||"")}</h3>
          <div class="muted" style="font-size:12px;margin-bottom:8px">Troco inicial: ${brl(j.sessao?.trocoInicial)} · Aberto: ${hora(j.sessao?.abertaEm)}${j.sessao?.fechadaEm?" · Fechado: "+hora(j.sessao.fechadaEm):""}</div>
          ${movs.length?movs.map(m=>`
            <div style="padding:8px 0;border-bottom:1px solid #2a2660;font-size:13px">
              <div>${nomeMovimento(m)}</div>
              <div class="muted" style="font-size:11px">${hora(m.em)}</div>
            </div>`).join(""):'<div class="muted">Nenhum movimento ainda.</div>'}
          <div class="card" style="background:#1c1846;margin:12px 0">
            <div class="linha"><span>Esperado na gaveta</span><b style="color:#ffd23f">${brl(j.resumo?.esperadoGaveta)}</b></div>
            ${j.fechamento?`<div class="linha"><span>Contado</span><b>${brl(j.fechamento.valorContado)}</b></div>
            <div class="linha"><span>Diferença</span><b style="color:${Math.abs(j.fechamento.diferenca)<0.01?"#8fffc0":(j.fechamento.diferenca>0?"#ffd23f":"#ff8090")}">${brl(j.fechamento.diferenca)}</b></div>`:""}
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-ghost" style="flex:1" onclick="imprimirRelatorioCaixa(window._sessaoInspecionada.sessao,window._sessaoInspecionada.resumo,window._sessaoInspecionada.movimentos,window._sessaoInspecionada.fechamento)">🖨️ Imprimir</button>
            <button class="btn btn-ghost" style="flex:1" onclick="fecharModais()">Fechar</button>
          </div>
        </div>
      </div>`;

async function carregarFormas(){
  try{
    const j=await fetch(BACKEND+"/api/formas-pagamento").then(r=>r.json());
    const todas=(j.data||[]).filter(f=>f.situacao!=="I");
    // mostra pix, dinheiro, e credito/debito de cada bandeira (nao filtra so uma) —
    // as outras formas (ficha financeira, estorno, etc) ficam escondidas
    const padroes=[/pix/i,/dinheiro/i,/d[eé]bito/i,/cr[eé]dito.*vista/i];
    FORMAS=todas.filter(f=>padroes.some(p=>p.test(f.descricao||f.nome||""))&&!/pix.*bling.*conta/i.test(f.descricao||f.nome||""));
    if(!FORMAS.length) FORMAS=todas;
  }catch(e){ FORMAS=[]; }
  render();
}

function selecionarForma(formaId,formaNome){
  const idx=PAGAMENTOS.findIndex(p=>!p.formaId);

  PAGAMENTOS[alvo].formaNome=formaNome;
  if(!PAGAMENTOS[alvo].valor) PAGAMENTOS[alvo].valor=Math.max(0,restante());
  render();
}

async function confirmarCpfNota(){

function ligarBusca(){
  const el=document.getElementById("busca"); if(!el) return;
  el.addEventListener("input",function(){
    clearTimeout(_timerBusca);
    const termo=this.value.trim();
    const resEl=document.getElementById("resBusca");
    if(termo.length<2){ resEl.innerHTML=""; return; }
    resEl.innerHTML=`<div class="muted">buscando…</div>`;
    _timerBusca=setTimeout(async()=>{
      try{
        if(/^\d{6,}$/.test(termo)){
          const r=await fetch(BACKEND+"/api/preco/gtin/"+encodeURIComponent(termo)).then(r=>r.json()).catch(()=>null);
          if(r&&r.data){
            adicionarAoCarrinho({produtoId:r.data.produtoId,nome:r.data.nome,preco:r.data.preco,imagem:r.data.imagem,codigo:termo});
            resEl.innerHTML=""; el.value=""; return;
          }
        }
        const j=await fetch(BACKEND+"/api/buscar?nome="+encodeURIComponent(termo)).then(r=>r.json());
        const lista=(j.data||[]).slice(0,25);
        if(!lista.length){ resEl.innerHTML=`<div class="muted">nada encontrado</div>`; return; }
        window._ultimaBusca=lista;
        resEl.innerHTML=lista.map((p,ix)=>`
          <div class="resitem" onclick="selecionarResultado(${ix})" id="rb_${ix}">
            <div class="semimg">📦</div>
            <div class="info"><div class="nome">${esc(p.nome)}</div><div class="meta">#${esc(String(p.codigo||""))} · estoque ${p.estoque??"?"}</div></div>
            <div class="preco" id="pr_${ix}">—</div>
          </div>`).join("");
        // busca preço e imagem de cada resultado em paralelo, atualizando conforme chega
        lista.forEach(async(p,ix)=>{
          if(!p.codigo) return;
          try{
            const r=await fetch(BACKEND+"/api/preco/gtin/"+encodeURIComponent(p.codigo)).then(r=>r.json());
            if(r?.data){
              p._preco=r.data.preco; p._imagem=r.data.imagem;
              const prEl=document.getElementById("pr_"+ix);
              if(prEl) prEl.textContent=brl(r.data.preco);
              const cardEl=document.getElementById("rb_"+ix);
              if(cardEl&&r.data.imagem){
                const ph=cardEl.querySelector(".semimg");
                if(ph) ph.outerHTML=`<img src="${esc(r.data.imagem)}" onerror="this.outerHTML='<div class=&quot;semimg&quot;>📦</div>'">`;
              }
            }
          }catch(e){}
        });
      }catch(e){ resEl.innerHTML=`<div class="muted">erro na busca</div>`; }
    },350);
  });
}

async function selecionarResultado(ix){
  const p=window._ultimaBusca[ix];
  const cardEl=document.getElementById("rb_"+ix);
  // se o preço ainda não chegou (carregando em segundo plano), busca agora e espera antes de adicionar
  if(p._preco==null&&p.codigo){
    if(cardEl) cardEl.style.opacity=".5";
    try{
      const r=await fetch(BACKEND+"/api/preco/gtin/"+encodeURIComponent(p.codigo)).then(r=>r.json());
      if(r?.data){ p._preco=r.data.preco; p._imagem=r.data.imagem; }
    }catch(e){}
    if(cardEl) cardEl.style.opacity="1";
  }
  if(!(p._preco>0)){
    alert("Não foi possível confirmar o preço desse produto. Tenta buscar de novo.");
    return;
  }
  adicionarAoCarrinho({produtoId:p.id,nome:p.nome,preco:p._preco,imagem:p._imagem||null,codigo:p.codigo||""});
  document.getElementById("resBusca").innerHTML="";
  const b=document.getElementById("busca"); if(b){ b.value=""; b.focus(); }
}

// serializa as chamadas (evita duas leituras rápidas do mesmo produto criarem 2 linhas
// em vez de somar a quantidade, já que a checagem de estoque é assíncrona)
let _filaAdicionar=Promise.resolve();
function adicionarAoCarrinho(p){
  const proxima=_filaAdicionar.then(()=>_adicionarAoCarrinhoInterno(p));
  _filaAdicionar=proxima.catch(()=>{});
  return proxima;
}
async function _adicionarAoCarrinhoInterno(p){
  if(!(Number(p.preco)>0)){
    alert("Esse produto não tem preço confirmado. Não é permitido adicionar sem preço.");
    return;
  }
  p.produtoId=Number(p.produtoId);
  const exAntes=CARRINHO.find(i=>Number(i.produtoId)===p.produtoId);
  const qtdDesejada=(exAntes?exAntes.quantidade:0)+1;
  // confere o estoque ao vivo antes de adicionar/aumentar
  let estoqueAtual=0;
  try{ estoqueAtual=(await fetch(BACKEND+"/api/pdv/estoque/"+p.produtoId).then(r=>r.json())).estoque||0; }catch(e){}
  if(qtdDesejada>estoqueAtual){
    pedirAutorizacaoEstoque(p,qtdDesejada,estoqueAtual);
    return;
  }
  // reconfere o carrinho aqui (depois do await), caso outra adição do MESMO produto
  // já tenha rodado enquanto esse fetch estava em andamento
  const ex=CARRINHO.find(i=>Number(i.produtoId)===p.produtoId);
  efetivarAdicao(p,ex,ex?ex.quantidade+1:1,estoqueAtual);
}

function efetivarAdicao(p,ex,qtdDesejada,estoqueAtual){
  if(ex){
    ex.quantidade=qtdDesejada; ex.estoque=estoqueAtual; aplicarPrecoAutomatico(CARRINHO.indexOf(ex)); render();
    mostrarPainelAdicionado(ex);
    return;
  }
  const item={...p,quantidade:qtdDesejada,estoque:estoqueAtual,precoNormal:p.preco,precoFardo:null,caixaQtd:null};
  CARRINHO.push(item);
  render();
  mostrarPainelAdicionado(item);
  // busca em segundo plano se esse produto tem preço de fardo configurado
  if(p.codigo){
    fetch(BACKEND+"/api/pdv/info-fardo/"+encodeURIComponent(p.codigo)).then(r=>r.json()).then(info=>{
      if(info.temFardo){
        item.precoFardo=info.precoFardo; item.caixaQtd=info.caixaQtd;
        aplicarPrecoAutomatico(CARRINHO.indexOf(item));
        render();
      }
    }).catch(()=>{});
  }
}

// produto sem estoque suficiente — pede autorização e, se aprovado, ajusta o estoque no
// Bling pra quantidade que o funcionário está tentando vender (ex: contagem desatualizada)
function pedirAutorizacaoEstoque(p,qtdDesejada,estoqueAtual){
  document.getElementById("modais").innerHTML=`
    <div class="modalBg" onclick="if(event.target===this)fecharModais()">
      <div class="modal">
        <h3>⚠️ Sem estoque no sistema</h3>
        <p style="margin-bottom:14px">Esse produto está com <b>${estoqueAtual} unidade(s)</b> no sistema.</p>
        <div class="muted" style="margin-bottom:4px">Quantas unidades quer vender? (confirma de uma vez, sem precisar autorizar de novo depois)</div>
        <input type="number" id="qtdAjusteEstoque" min="1" value="${qtdDesejada}" style="width:100%;font-size:18px;text-align:center;margin-bottom:14px">
        <p class="muted" style="margin-bottom:16px">Pra vender mesmo assim (ex: chegou mais produto e o estoque ainda não foi atualizado), um <b>gerente, líder de caixa ou admin</b> precisa autorizar o ajuste do estoque no Bling.</p>
        <div style="display:flex;gap:8px">
          <button class="btn" style="flex:1" onclick="continuarAutorizacaoEstoque()">Continuar</button>
          <button class="btn btn-ghost" onclick="fecharModais()">Cancelar</button>
        </div>
      </div>
    </div>`;
  window._itemEstoquePendente=p;
}

function continuarAutorizacaoEstoque(){
  const qtdDesejada=Math.max(1,+document.getElementById("qtdAjusteEstoque").value||1);
  const p=window._itemEstoquePendente;
  pedirAutorizacao(async(autorizadoPor,idDigitado,senhaDigitada)=>{
    try{
      const r=await fetch(BACKEND+"/api/pdv/ajustar-estoque",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({idDigitado,senhaDigitada,produtoId:p.produtoId,quantidade:qtdDesejada})});
      const j=await r.json();
      if(!r.ok||j.erro) throw new Error(j.erro||"Erro ao ajustar estoque no Bling");
      const ex=CARRINHO.find(i=>i.produtoId===p.produtoId);
      efetivarAdicao(p,ex,qtdDesejada,qtdDesejada);
    }catch(e){ alert("Não foi possível ajustar o estoque: "+e.message); }
  },`Autorizando ajuste de estoque pra ${qtdDesejada} unidade(s).`);
}

// se a quantidade bater o minimo do fardo (configurado na Tabela Atacado), troca o preço
// automaticamente pro preço de fardo; produtos sem fardo configurado nunca mudam de preço
function aplicarPrecoAutomatico(ix){
  const item=CARRINHO[ix]; if(!item) return;
  if(item.caixaQtd&&item.precoFardo!=null&&item.quantidade>=item.caixaQtd){
    item.preco=item.precoFardo; item._usandoFardo=true;
  } else {
    item.preco=item.precoNormal; item._usandoFardo=false;
  }
}

function subtotal(){ return CARRINHO.reduce((s,i)=>s+i.preco*i.quantidade,0); }
function descontoAtual(){ return Number(document.getElementById("desconto")?.value||0); }
function totalPedido(){ return Math.max(0,subtotal()-descontoAtual()); }
function totalPago(){ return PAGAMENTOS.reduce((s,p)=>s+(Number(p.valor)||0),0); }
function restante(){ return +(totalPedido()-totalPago()).toFixed(2); }
function somaNaoDinheiro(){ return PAGAMENTOS.filter(p=>!(p.formaNome||"").toLowerCase().includes("dinheiro")).reduce((s,p)=>s+(Number(p.valor)||0),0); }
function alterarQtd(ix,d){
  const item=CARRINHO[ix];
  const nova=Math.max(1,item.quantidade+d);
  if(d>0&&nova>item.estoque){ pedirAutorizacaoEstoque(item,nova,item.estoque); return; }
  item.quantidade=nova; aplicarPrecoAutomatico(ix); render();
}
function definirQtd(ix,v){
  const item=CARRINHO[ix];
  const nova=Math.max(1,+v||1);
  if(nova>item.estoque){ pedirAutorizacaoEstoque(item,nova,item.estoque); render(); return; }
  item.quantidade=nova; aplicarPrecoAutomatico(ix); render();
}
function removerItem(ix){
  pedirAutorizacao(()=>{ CARRINHO.splice(ix,1); render(); });
}

// ---------------- autorização especial (remover item / aplicar desconto) ----------------
let DESCONTO_DESBLOQUEADO=false;
function pedirAutorizacao(aoAutorizar,mensagemExtra){
  window._aoAutorizarCallback=aoAutorizar;
  document.getElementById("modais").innerHTML=`
    <div class="modalBg" onclick="if(event.target===this)fecharModais()">
      <div class="modal">
        <h3>🔒 Autorização necessária</h3>
        <p class="muted" style="margin-bottom:12px">${mensagemExtra?esc(mensagemExtra):"Essa ação exige autorização de um gerente, líder de caixa ou admin."}</p>
        <div class="muted" style="margin-bottom:4px">ID</div>
        <input type="password" id="autId" style="width:100%;font-size:18px;letter-spacing:2px" autofocus autocomplete="off">
        <div class="muted" style="margin:10px 0 4px">Senha</div>
        <input type="password" id="autSenha" style="width:100%;font-size:18px;letter-spacing:2px" autocomplete="off" onkeydown="if(event.key==='Enter')confirmarAutorizacao()">
        <div id="autErro"></div>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="btn" style="flex:1" onclick="confirmarAutorizacao()">Confirmar</button>
          <button class="btn btn-ghost" onclick="fecharModais()">Cancelar</button>
        </div>
      </div>
    </div>`;
}

async function confirmarAutorizacao(){
  const idDigitado=document.getElementById("autId").value.trim();
  const senhaDigitada=document.getElementById("autSenha").value;
  try{
    const r=await fetch(BACKEND+"/api/pdv/autorizar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({idDigitado,senhaDigitada})});
    const j=await r.json();
    if(!r.ok||j.erro) throw new Error(j.erro||"Autorização inválida");
    fecharModais();
    if(window._aoAutorizarCallback) window._aoAutorizarCallback(j.autorizadoPor,idDigitado,senhaDigitada);
  }catch(e){ document.getElementById("autErro").innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

function autorizarDesconto(){
  pedirAutorizacao(()=>{
    DESCONTO_DESBLOQUEADO=true;
    render();
    setTimeout(()=>{ const el=document.getElementById("desconto"); if(el) el.focus(); },50);
  });
}
function limparCarrinho(){
  if(!CARRINHO.length) return;
  pedirAutorizacao(()=>{ CARRINHO=[]; PAGAMENTOS=[{formaId:null,formaNome:"",valor:0}]; DESCONTO_DESBLOQUEADO=false; limparPainelAdicionado(); render(); },"Cancelar a venda e limpar o carrinho exige autorização.");
}

// ---------------- render ----------------
function render(){
  const pill=document.getElementById("pillCaixa");
  const btnAF=document.getElementById("btnAbrirFechar");
  if(CAIXA.aberta){
    pill.className="pill aberto";
    pill.textContent="Caixa aberto · "+brl((CAIXA.resumo||{}).esperadoGaveta);
    btnAF.textContent="🔒 Fechar caixa";
  } else {
    pill.className="pill fechado"; pill.textContent="Caixa fechado";
    btnAF.textContent="🔓 Abrir caixa";
  }

  const cont=document.getElementById("conteudo");
  if(!CAIXA.aberta){
    cont.innerHTML=`<div class="bloqueio">
      <div style="font-size:52px;margin-bottom:14px">🔒</div>
      <h2 style="margin-bottom:8px">Caixa fechado</h2>
      <p class="muted" style="margin-bottom:18px">Abra o caixa informando o troco inicial pra começar a vender.</p>
      <button class="btn" onclick="abrirModalCaixa()">🔓 Abrir caixa</button>
    </div>`;
    return;
  }

  const r=CAIXA.resumo||{};
  const descAtual=descontoAtual();
  const clienteAtual=CLIENTE_SELECIONADO||CONSUMIDOR_FINAL;
  cont.innerHTML=`<div class="wrap">
    <div>
      <div id="painelAdicionado" style="min-height:400px">${ULTIMO_ITEM_PAINEL?htmlPainelAdicionado(ULTIMO_ITEM_PAINEL):htmlLogoGrande()}</div>
      <div class="card">
        <div class="muted" style="margin-bottom:6px">🔍 Buscar produto (nome ou código de barras)</div>
        <input id="busca" class="busca" placeholder="Bipa o código ou digita o nome…" autofocus>
        <div id="resBusca" class="res"></div>
      </div>
      <div class="card">
        <div style="display:flex;align-items:center;margin-bottom:8px">
          <h3 style="flex:1;margin:0">🛒 Carrinho (${CARRINHO.length})</h3>
          ${CARRINHO.length?`<button class="btn btn-ghost btn-sm" onclick="limparCarrinho()">Cancelar venda</button>`:""}
        </div>
        <div id="carrinho">${CARRINHO.length?CARRINHO.map((i,ix)=>`
          <div class="item">
            ${i.imagem?`<img src="${esc(i.imagem)}" onerror="this.outerHTML='<div class=&quot;semimg&quot;>📦</div>'">`:`<div class="semimg">📦</div>`}
            <span class="nome">${esc(i.nome)}${i._usandoFardo?' <span style="color:#FF0082;font-weight:800;font-size:10px">FARDO ✓</span>':''}<br><span class="muted">${brl(i.preco)} un${i.caixaQtd?` · fardo a partir de ${i.caixaQtd}un`:""}</span></span>
            <div class="qtd">
              <button onclick="alterarQtd(${ix},-1)">−</button>
              <input value="${i.quantidade}" onchange="definirQtd(${ix},this.value)">
              <button onclick="alterarQtd(${ix},1)">+</button>
            </div>
            <span class="subtotal">${brl(i.preco*i.quantidade)}</span>
            <button class="rm" onclick="removerItem(${ix})">🗑</button>
          </div>`).join(""):'<div class="muted">Nenhum item ainda.</div>'}</div>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="muted" style="margin-bottom:6px">👤 Cliente</div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="flex:1;font-weight:800">${clienteAtual?esc(clienteAtual.nome):"Consumidor Final"}</span>
          ${CLIENTE_SELECIONADO?`<button class="btn btn-ghost btn-sm" onclick="limparCliente()">✕ Remover</button>`:`
            <button class="btn btn-ghost btn-sm" onclick="abrirBuscaCliente()">🔍 Buscar cliente</button>
            <button class="btn btn-ghost btn-sm" onclick="abrirCpfNota()">🧾 CPF na nota</button>
          `}
        </div>
        <div id="buscaClienteBox"></div>
        <div id="cpfNotaBox"></div>
      </div>

      <div class="card">
        <h3>💳 Pagamento</h3>
        <div class="formas">${FORMAS.map(f=>{
          const nome=f.descricao||f.nome||("Forma "+f.id);
          const sel=PAGAMENTOS.some(p=>String(p.formaId)===String(f.id));
          return `<div class="forma ${sel?"sel":""}" onclick="selecionarForma(${f.id},'${esc(nome).replace(/'/g,"\\'")}')">${esc(nome)}</div>`;
        }).join("")}</div>
        ${PAGAMENTOS.map((p,ix)=>`
          <div class="pagRow">
            <span style="flex:1">${p.formaNome?esc(p.formaNome):'<span class="muted">escolha a forma acima</span>'}</span>
            <input type="number" step="0.01" value="${p.valor}" onchange="PAGAMENTOS[${ix}].valor=+this.value||0;render()">
            ${PAGAMENTOS.length>1?`<button class="rm" onclick="PAGAMENTOS.splice(${ix},1);render()">🗑</button>`:""}
          </div>`).join("")}
        <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px" onclick="adicionarFormaPagamento()">+ Dividir com outra forma</button>
        <div class="linha" style="margin-top:10px"><span>Pago</span><b>${brl(totalPago())}</b></div>
        ${(()=>{
          const rest=restante();
          const ehDin=PAGAMENTOS.some(p=>(p.formaNome||"").toLowerCase().includes("dinheiro"));
          if(rest<-0.009&&ehDin) return `<div class="linha"><span>Troco</span><b style="color:#8fffc0;font-size:18px">${brl(-rest)}</b></div>`;
          if(rest>0.009) return `<div class="linha"><span>Falta</span><b style="color:#ff8090">${brl(rest)}</b></div>`;
          return `<div class="linha"><span>Falta</span><b style="color:#8fffc0">${brl(0)}</b></div>`;
        })()}
        ${somaNaoDinheiro()>totalPedido()+0.009?`<div class="err">⚠️ Pix/Débito/Crédito não podem somar mais que o total da venda. Só dinheiro pode gerar troco.</div>`:""}
        <label style="display:flex;align-items:center;gap:8px;margin:12px 0;font-size:13px">
          <input type="checkbox" id="emitirNfce" checked> Emitir NFCe ao finalizar</label>
        <div id="msgFinalizar"></div>
        <button class="btn" id="btnFinalizar" style="width:100%;padding:16px;font-size:15px"
          ${(!CARRINHO.length||PAGAMENTOS.some(p=>!p.formaId)||restante()>0.009||somaNaoDinheiro()>totalPedido()+0.009)?"disabled":""}
          onclick="finalizarVenda()">✅ Finalizar Venda</button>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="linha"><span>Subtotal</span><b>${brl(subtotal())}</b></div>
        <div class="linha"><span>Desconto (R$)</span>
          <div style="display:flex;gap:6px;align-items:center">
            <input id="desconto" type="number" min="0" step="0.01" value="${descAtual}" style="width:100px;text-align:right" ${DESCONTO_DESBLOQUEADO?"":"disabled"} oninput="render()">
            ${DESCONTO_DESBLOQUEADO?"":`<button class="btn btn-ghost btn-sm" onclick="autorizarDesconto()">🔒</button>`}
          </div></div>
        <div class="linha" style="border-top:1px solid #2a2660;padding-top:10px;margin-top:6px">
          <span>Total</span><span class="total">${brl(totalPedido())}</span></div>
      </div>
      <div class="card">
        <h3>📊 Resumo do caixa</h3>
        <div class="linha"><span>Troco inicial</span><b>${brl(r.trocoInicial)}</b></div>
        <div class="linha"><span>Vendas (${r.qtdVendas||0})</span><b>${brl(r.totalVendas)}</b></div>
        <div class="linha"><span>Suprimentos</span><b style="color:#8fffc0">${brl(r.totalSuprimentos)}</b></div>
        <div class="linha"><span>Sangrias</span><b style="color:#ff8090">${brl(r.totalSangrias)}</b></div>
        <div class="linha" style="border-top:1px solid #2a2660;padding-top:8px;margin-top:4px">
          <span><b>Esperado na gaveta</b></span><b style="color:#ffd23f">${brl(r.esperadoGaveta)}</b></div>
        ${(r.porForma||[]).length?`<div style="margin-top:10px">
          <div class="muted" style="margin-bottom:4px">Por forma de pagamento</div>
          ${r.porForma.map(f=>`<div class="linha" style="font-size:13px"><span>${esc(f.nome)} <span class="muted">(${f.qtd}x)</span></span><b>${brl(f.valor)}</b></div>`).join("")}
        </div>`:""}
      </div>
    </div>
  </div>`;
  ligarBusca();
}

async function finalizarVenda(){
  const msg=document.getElementById("msgFinalizar");
  const btn=document.getElementById("btnFinalizar");
  msg.innerHTML=""; btn.disabled=true; btn.textContent="Processando…";
  const clienteFinal=(CLIENTE_SELECIONADO||CONSUMIDOR_FINAL)||null;
  const itensVenda=CARRINHO.map(i=>({produtoId:i.produtoId,nome:i.nome,quantidade:i.quantidade,preco:i.preco}));
  const descontoVenda=descontoAtual();
  try{
    const body={
      itens:itensVenda.map(i=>({produtoId:i.produtoId,nome:i.nome,quantidade:i.quantidade,valor:i.preco})),
      desconto:descontoVenda,
      pagamentos:(()=>{
        const total=totalPedido();
        const naoDinheiro=PAGAMENTOS.filter(p=>p.formaId&&!(p.formaNome||"").toLowerCase().includes("dinheiro"));
        const dinheiro=PAGAMENTOS.filter(p=>p.formaId&&(p.formaNome||"").toLowerCase().includes("dinheiro"));
        const somaNaoDin=naoDinheiro.reduce((s,p)=>s+(Number(p.valor)||0),0);
        const faltaParaDinheiro=Math.max(0,+(total-somaNaoDin).toFixed(2));
        return [
          ...naoDinheiro.map(p=>({formaId:p.formaId,formaNome:p.formaNome,valor:+Number(p.valor).toFixed(2)})),
          ...dinheiro.map(p=>({formaId:p.formaId,formaNome:p.formaNome,valor:Math.min(+Number(p.valor).toFixed(2),faltaParaDinheiro)})),
        ];
      })(),
      emitirNfce:document.getElementById("emitirNfce").checked,
      funcionarioId:funcionarioIdAtual(),
      contatoId:clienteFinal?.id||null,
      clienteNome:clienteFinal?.nome||"",
    };
    const r=await fetch(BACKEND+"/api/pdv/venda",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok||j.erro) throw new Error(j.erro||"Erro ao finalizar venda");
    ULTIMA_VENDA={
      numero:j.numero||j.pedidoId, pedidoId:j.pedidoId, total:j.total, desconto:descontoVenda,
      itens:itensVenda, pagamentos:body.pagamentos, cliente:clienteFinal, nfce:j.nfce, dataHora:Date.now(),
    };
    CARRINHO=[]; PAGAMENTOS=[{formaId:null,formaNome:"",valor:0}]; DESCONTO_DESBLOQUEADO=false; CLIENTE_SELECIONADO=null;
    limparPainelAdicionado();
    await carregarCaixa();
    const m=document.getElementById("msgFinalizar");
    if(m) m.innerHTML=`<div class="ok">✅ Venda #${esc(j.numero||j.pedidoId)} — ${brl(j.total)}
      ${j.nfce?.erro?`<br><span style="color:#ffb0b0;font-size:12px">NFCe: ${esc(j.nfce.erro)}</span>`:(j.nfce?.erroEnvio?`<br><span style="color:#ffd580;font-size:12px">NFCe gerada mas não transmitida (fica Pendente no Bling): ${esc(j.nfce.erroEnvio)}</span>`:(j.nfce?"<br>NFCe emitida":""))}
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-ghost btn-sm" style="flex:1" onclick="imprimirComprovante(ULTIMA_VENDA)">🖨️ Comprovante</button>
        ${j.nfce?.linkDanfe?`<button class="btn btn-ghost btn-sm" style="flex:1" onclick="window.open('${esc(j.nfce.linkDanfe)}','_blank')">🧾 Imprimir NFCe</button>`:""}
      </div></div>`;
  }catch(e){
    render();
    const m=document.getElementById("msgFinalizar");
    if(m) m.innerHTML=`<div class="err">${esc(e.message)}</div>`;
  }
}

carregarFormas();
carregarCaixa();
carregarConsumidorFinal();
</script>
