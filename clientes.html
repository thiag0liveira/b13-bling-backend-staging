<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>B13 — Clientes</title>
<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;margin:0;padding:0}
:root{--mag:#FF0082;--bg:#0f0d24;--card:#151233;--borda:#2c2660;--muted:#9a95c9;--ok:#3ce88a;--warn:#ffd23f;--ruim:#ff8f7a}
body{background:var(--bg);color:#fff;min-height:100vh}
.top{background:linear-gradient(180deg,#2b2870,#262366);border-bottom:3px solid var(--mag);padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top img{height:34px}.top .t{font-weight:900;font-size:16px}.top .sp{flex:1}
.btn{border:none;border-radius:9px;font-weight:800;cursor:pointer;font-size:12px;padding:8px 12px;color:#fff;text-decoration:none;display:inline-block}
.btn-ghost{background:#1c1846;border:1px solid #3a3480}.btn-mag{background:var(--mag)}
.wrap{padding:14px;display:grid;gap:12px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;background:#1c1846;border:1px solid #514c96;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;color:#fff;user-select:none}
.chip.on{background:var(--mag);border-color:var(--mag)}
input,select{padding:8px 10px;border-radius:9px;border:1px solid #37327a;background:#0f0d24;color:#fff;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:12px;position:relative}
.kpi.alerta{border-color:#7a2a3a;background:#20122a}.kpi .v{font-size:22px;font-weight:900}.kpi .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-top:3px}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:4px}
.card{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:14px}
.card h3{font-size:14px;margin-bottom:4px}.desc{font-size:12px;color:var(--muted);margin-bottom:10px}
.rolagem{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
th{background:#0d0b1e;padding:8px 10px;text-align:right;font-size:11px;color:var(--muted);border-bottom:1px solid var(--borda);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--borda);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.ped{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--borda);border-radius:12px;margin-bottom:6px;background:#120f2c;cursor:pointer;flex-wrap:wrap}
.ped:hover{border-color:var(--mag)}.ped .info{flex:1;min-width:220px}.ped .l1{font-weight:800;font-size:14.5px}.ped .l2{font-size:12px;color:var(--muted);margin-top:3px}
.ped .dir{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.valor{font-weight:900;font-size:15px;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tag.ok{background:#11352a;color:#6be3a8}.tag.warn{background:#3a2a0a;color:var(--warn)}.tag.erro{background:#3d1020;color:#ff8aa3}.tag.neu{background:#24205a;color:#cfcaf5}.tag.azul{background:#0d2a44;color:#7fd0ff}
.ic{font-size:12px;color:#cfcaf5;white-space:nowrap}
.vazio{padding:26px;text-align:center;color:var(--muted)}
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:200;overflow-y:auto;padding:24px 10px}
.fundo.aberto{display:flex}.modal{background:#151233;border:1px solid var(--borda);border-radius:14px;padding:16px;width:100%;max-width:860px}
.bloco{background:#120f2c;border:1px solid var(--borda);border-radius:10px;padding:12px;margin-top:10px}
.bloco h4{font-size:13px;margin-bottom:8px;color:#cfcaf5}
.lin{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px solid #1d1946}.lin:last-child{border-bottom:none}
.lin span:first-child{color:var(--muted)}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.galeria a,.galeria div{display:block;border:1px solid var(--borda);border-radius:8px;overflow:hidden;background:#0b0a1e;text-decoration:none;color:#cfcaf5}
.galeria img{width:100%;height:110px;object-fit:cover;display:block}.galeria video{width:100%;height:110px;display:block;background:#000}
.galeria small{display:block;padding:5px 7px;font-size:10.5px;color:var(--muted)}
.tl{border-left:2px solid var(--borda);padding-left:12px}.tl div{font-size:12.5px;padding:4px 0}.tl b{color:#fff}.tl span{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.spin{display:inline-block;width:20px;height:20px;border:3px solid #514c96;border-top-color:var(--mag);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs .chip{font-size:12.5px}
.barras{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:6px}.barras div{flex:1;background:#3a3480;border-radius:4px 4px 0 0;position:relative;min-height:2px}
.barras div.on{background:var(--mag)}.barras small{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--muted)}
.cli{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--borda);border-radius:12px;margin-bottom:6px;background:#120f2c;cursor:pointer;flex-wrap:wrap}
.cli:hover{border-color:var(--mag)}.cli .info{flex:1;min-width:230px}.cli .l1{font-weight:800;font-size:14.5px}.cli .l2{font-size:12px;color:var(--muted);margin-top:3px}
.par{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.par div{background:#120f2c;border:1px solid var(--borda);border-radius:10px;padding:9px}.par b{display:block;font-size:16px}.par span{font-size:11px;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.form label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}.form input,.form select,textarea{width:100%}
textarea{padding:8px 10px;border-radius:9px;border:1px solid #37327a;background:#0f0d24;color:#fff;font-size:13px;min-height:70px}
#mapa{height:380px;border-radius:10px;border:1px solid var(--borda)}
.err{background:#3d1020;color:#ff8aa3;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:6px}.okmsg{background:#11352a;color:#6be3a8;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:6px}

/* topo: o status do histórico quebra linha no celular em vez de esticar a página */
.top{flex-wrap:wrap}#sinc{white-space:normal;min-width:0;flex:1 1 180px;text-align:right}@media(max-width:600px){#sinc{font-size:10.5px;text-align:left}}
.wrap>*{min-width:0}#kpis{grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr));min-width:0}
</style>
<script src="/nav.js"></script>
<script src="/ficha-pedido.js"></script>
<style>
  body.b13nav-open{ overflow:hidden }
  @media(min-width:900px){
    #b13nav{transform:translateX(0%) !important}
    #b13navOverlay{display:none !important}
    button[onclick="b13ToggleNav()"]{display:none !important}
    body > *:not(#b13nav):not([onclick="b13ToggleNav()"]):not(#b13navOverlay):not(.fundo){ margin-left:200px }
  }
</style>
</head>
<body><script>
  (function(){
    if(!b13RequireLogin()) return;
    if(!b13BloquearSeSemAcesso("/clientes")) return;
    document.addEventListener("DOMContentLoaded",function(){
      const nav=document.createElement("div"); nav.innerHTML=b13RenderNav("/clientes");
      document.body.insertBefore(nav,document.body.firstChild);
    });
  })();
</script>
<div class="top">
  <img src="/logo"><div class="t">👥 Clientes</div><div class="sp"></div>
  <span class="ic" id="sinc"></span>
  <button class="btn btn-ghost" id="btnDup" onclick="abrirDuplicados()">🧩 Duplicados</button>
</div>
<div class="wrap">
  <div class="kpis" id="kpis"><div class="vazio"><div class="spin"></div></div></div>
  <div class="card"><h3>🧑‍💼 Vendas por vendedora</h3>
    <div class="desc">Clientes atendidos por cada vendedora (pedidos registrados no sistema), quantos deles compraram nos últimos 30 dias e o valor vendido. Toque numa vendedora para ver só os clientes dela.</div>
    <div class="rolagem" id="vendedoras"></div></div>
  <div class="card">
    <div class="filtros" style="margin-bottom:10px">
      <input id="busca" type="search" placeholder="🔎 Nome, CPF/CNPJ, telefone ou bairro" style="flex:1;min-width:220px">
      <select id="fOrdem"><option value="ultima">Última compra</option><option value="total">Mais compraram (12 meses)</option><option value="parados">Parados há mais tempo</option><option value="areceber">Mais a receber</option><option value="nome">Nome (A-Z)</option></select>
      <select id="fVend"><option value="">Todas as vendedoras</option></select>
    </div>
    <div class="filtros" id="fStatus" style="margin-bottom:10px"></div>
    <div id="lista"><div class="vazio"><div class="spin"></div></div></div>
  </div>
</div>
<div class="fundo" id="mDup"><div class="modal" id="mDupCorpo" style="max-width:980px"></div></div>
<div class="fundo" id="mCli"><div class="modal" id="mCliCorpo" style="max-width:980px"></div></div>
<script>
const B = location.protocol.indexOf("http") === 0 ? "" : "https://app.b13bebidas.com.br";
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const brl = n => Number(n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const dt = ms => ms ? new Date(ms).toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo" }) : "—";
const dth = ms => ms ? new Date(ms).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
const soDig = s => String(s || "").replace(/\D/g, "");
function token(){ try{ return (b13GetSession()||{}).token||""; }catch(e){ return ""; } }
async function api(p, op){ op = op || {}; const r = await fetch(B + p, { ...op, headers: { "Content-Type": "application/json", "X-Auth-Token": token(), ...(op.headers || {}) } }); const j = await r.json().catch(() => ({})); return { ok: r.ok, status: r.status, j }; }
const ST = { ativo: ["ativo", "ok"], novo: ["novo", "azul"], em_risco: ["em risco", "warn"], parado: ["parado", "erro"], sem_compras: ["sem compras", "neu"] };
const tagSt = s => { const t = ST[s] || [s, "neu"]; return `<span class="tag ${t[1]}">${t[0]}</span>`; };
const wa = tel => { const d = soDig(tel); if (d.length < 10) return ""; return `https://wa.me/${d.length <= 11 ? "55" + d : d}`; };
let F = { status: "", vendedora: "", ordem: "ultima", busca: "", offset: 0 }, DADOS = null, ITENS = [], BANCOS = ["Inter", "Santander", "Itaú"];

async function carregar(mais) {
  if (!mais) { F.offset = 0; ITENS = []; }
  const q = new URLSearchParams({ busca: F.busca, status: F.status, vendedora: F.vendedora, ordem: F.ordem, offset: F.offset, limite: 100 });
  const { ok, j } = await api("/api/clientes?" + q);
  if (!ok) { document.getElementById("lista").innerHTML = `<div class="err">${esc(j.erro || "Não consegui carregar.")}</div>`; return; }
  DADOS = j; ITENS = ITENS.concat(j.itens || []);
  renderTopo(); renderLista();
}
function renderTopo() {
  const R = DADOS.resumo, S = DADOS.sincronizacao;
  const H = DADOS.historico || {};
  document.getElementById("sinc").innerHTML = (S.rodando ? `⏳ copiando clientes do Bling (${esc(S.progresso)})` : (S.em ? `base do Bling: ${S.contatos} contatos · copiada ${dth(S.em)}` : "base do Bling ainda não copiada"))
    + " · " + (H.varreduraCompleta ? `histórico completo do Bling desde ${H.blingDesde ? H.blingDesde.split("-").reverse().slice(1).join("/") : "—"}`
        : `⏳ trazendo o histórico do Bling${H.progresso ? " (" + esc(H.progresso) + ")" : H.mesVarrendo ? " (" + H.mesVarrendo.split("-").reverse().join("/") + ")" : ""}${H.blingDesde ? ", já desde " + H.blingDesde.split("-").reverse().slice(1).join("/") : ""}`)
    + (H.detalhes && H.detalhes.total ? ` · produtos dos pedidos do Bling: ${H.detalhes.feitos} de ${H.detalhes.total}${H.detalhes.feitos < H.detalhes.total ? (H.detalhes.rodando ? " (copiando agora)" : " (copiando à noite)") : " ✓"}` : "");
  const k = (v, l, s, al, st) => `<div class="kpi ${al ? "alerta" : ""}" ${st != null ? `style="cursor:pointer" onclick="filtrar('${st}')"` : ""}><div class="v">${v}</div><div class="l">${l}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`;
  document.getElementById("kpis").innerHTML = [
    k(R.base, "Clientes", "na base do Bling e com pedidos", false, ""),
    k(R.ativos, "Ativos", "comprando no ritmo de sempre", false, "ativo"),
    k(R.novos, "Novos", "primeira compra nos últimos 30 dias", false, "novo"),
    k(R.emRisco, "Em risco", "passaram do intervalo de costume", R.emRisco > 0, "em_risco"),
    k(R.parados, "Parados", "sem comprar há muito tempo", false, "parado"),
    k(brl(R.aReceber), "A receber (prazo)", `${R.comPrazo} cliente(s) com pedido a prazo`, R.aReceber > 0, "prazo"),
    k(brl(R.credito), "Créditos", `${R.comCredito} cliente(s) com crédito`, false, "credito")].join("");
  const sel = document.getElementById("fVend"), atual = F.vendedora;
  sel.innerHTML = `<option value="">Todas as vendedoras</option>` + (DADOS.porVendedora || []).map(v => `<option ${v.vendedor === atual ? "selected" : ""}>${esc(v.vendedor)}</option>`).join("");
  document.getElementById("vendedoras").innerHTML = (DADOS.porVendedora || []).length ? `<table><tr><th>Vendedora</th><th>Clientes atendidos</th><th>Compraram em 30 dias</th><th>Pedidos 90 dias</th><th>Valor 90 dias</th><th>Valor 12 meses</th></tr>
    ${DADOS.porVendedora.map(v => `<tr style="cursor:pointer" onclick="F.vendedora='${esc(v.vendedor)}';document.getElementById('fVend').value=F.vendedora;carregar()"><td><b>${esc(v.vendedor)}</b></td><td>${v.clientes}</td><td>${v.clientesAtivos30}</td><td>${v.pedidos90}</td><td>${brl(v.valor90)}</td><td>${brl(v.valor365)}</td></tr>`).join("")}</table>` : `<div class="vazio">Sem pedidos registrados.</div>`;
  const chips = [["", "Todos"], ["ativo", "Ativos"], ["novo", "Novos"], ["em_risco", "Em risco"], ["parado", "Parados"], ["sem_compras", "Sem compras"], ["prazo", "Com prazo em aberto"], ["credito", "Com crédito"]];
  document.getElementById("fStatus").innerHTML = chips.map(([k2, t]) => `<span class="chip ${F.status === k2 ? "on" : ""}" onclick="filtrar('${k2}')">${t}</span>`).join("");
}
function filtrar(st) { F.status = st; carregar(); }
function renderLista() {
  const el = document.getElementById("lista");
  if (!ITENS.length) { el.innerHTML = `<div class="vazio">Nenhum cliente encontrado.</div>`; return; }
  el.innerHTML = `<div class="desc">${DADOS.total} cliente(s)</div>` + ITENS.map(c => `<div class="cli" onclick="abrirCliente('${esc(c.id)}')">
    <div class="info"><div class="l1">${esc(c.nome)} ${tagSt(c.status)}</div>
      <div class="l2">${c.doc ? esc(c.doc) + " · " : ""}${c.telefone ? esc(c.telefone) + " · " : ""}${c.bairro ? esc(c.bairro) + " · " : ""}${c.pedidos ? `${c.pedidos} pedido(s) · última compra ${dt(c.ultimaCompra)} (${c.diasDesdeUltima} dia(s))` : "sem pedidos no sistema"}${c.vendedoraPrincipal ? " · " + esc(c.vendedoraPrincipal) : ""}</div></div>
    <div style="text-align:right">${c.total365 ? `<div class="valor">${brl(c.total365)}</div><div class="ic">em 12 meses</div>` : ""}
      ${c.aReceber > 0 ? `<span class="tag warn">a receber ${brl(c.aReceber)}</span>` : ""} ${c.credito > 0 ? `<span class="tag ok">crédito ${brl(c.credito)}</span>` : ""}</div>
    ${wa(c.telefone) ? `<a class="btn btn-ghost" href="${wa(c.telefone)}" target="_blank" onclick="event.stopPropagation()">💬</a>` : ""}</div>`).join("")
    + (ITENS.length < DADOS.total ? `<div style="text-align:center;margin-top:8px"><button class="btn btn-ghost" onclick="F.offset=ITENS.length;carregar(true)">Carregar mais</button></div>` : "");
}
let _t = null;
document.getElementById("busca").addEventListener("input", e => { clearTimeout(_t); _t = setTimeout(() => { F.busca = e.target.value.trim(); carregar(); }, 350); });
document.getElementById("fOrdem").addEventListener("change", e => { F.ordem = e.target.value; carregar(); });
document.getElementById("fVend").addEventListener("change", e => { F.vendedora = e.target.value; carregar(); });

// ===================== FICHA DO CLIENTE =====================
let C = null, ABA = "resumo", MAPA = null;
async function abrirCliente(id) {
  document.getElementById("mCli").classList.add("aberto");
  document.getElementById("mCliCorpo").innerHTML = `<div class="vazio"><div class="spin"></div><div style="margin-top:8px">Montando a ficha do cliente…</div></div>`;
  const { ok, j } = await api("/api/clientes/" + encodeURIComponent(id));
  if (!ok) { document.getElementById("mCliCorpo").innerHTML = `<div class="err">${esc(j.erro || "Não consegui abrir.")}</div><button class="btn btn-ghost" onclick="fecharCli()">Fechar</button>`; return; }
  C = j; ABA = "resumo"; renderFicha();
}
function fecharCli() { document.getElementById("mCli").classList.remove("aberto"); if (MAPA) { MAPA.remove(); MAPA = null; } }
document.getElementById("mCli").addEventListener("click", e => { if (e.target.id === "mCli") fecharCli(); });
function renderFicha() {
  const c = C.cadastro, m = C.metricas, tel = c.celular || c.telefone;
  const abas = [["resumo", "📊 Resumo"], ["pedidos", `🧾 Pedidos (${C.pedidos.length})`], ["produtos", "🍺 Produtos"], ["financeiro", "💰 Financeiro"], ["mapa", "🗺️ Mapa e próximos"], ["cadastro", "✏️ Cadastro"]];
  document.getElementById("mCliCorpo").innerHTML = `
    <div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:240px"><div style="font-size:19px;font-weight:900">${esc(c.nome || "(sem nome)")} ${tagSt(m.status)}</div>
        <div class="ic" style="margin-top:4px">${c.doc ? esc(c.doc) + " · " : ""}${tel ? esc(tel) : "sem telefone"}${c.email ? " · " + esc(c.email) : ""}</div></div>
      ${wa(tel) ? `<a class="btn btn-mag" href="${wa(tel)}" target="_blank">💬 WhatsApp</a>` : ""}
      <button class="btn btn-ghost" onclick="fecharCli()">Fechar</button></div>
    <div class="tabs">${abas.map(([k, t]) => `<span class="chip ${ABA === k ? "on" : ""}" onclick="ABA='${k}';renderFicha()">${t}</span>`).join("")}</div>
    <div id="aba"></div>`;
  ({ resumo: abaResumo, pedidos: abaPedidos, produtos: abaProdutos, financeiro: abaFinanceiro, mapa: abaMapa, cadastro: abaCadastro })[ABA]();
}
const par = (v, l) => `<div><b>${v}</b><span>${l}</span></div>`;
function abaResumo() {
  const m = C.metricas, el = document.getElementById("aba");
  if (!m.pedidos) { el.innerHTML = `<div class="vazio">Este cliente ainda não tem pedidos registrados no sistema.</div>` + blocoNota(); return; }
  const maxS = Math.max(1, ...m.diasDaSemana.map(d => d.qtd)), maxM = Math.max(1, ...m.meses.map(x => x.valor));
  el.innerHTML = (m.pedidosComDetalhe < m.pedidos ? `<div class="desc">${m.pedidos} pedidos no total; ${m.pedidosComDetalhe} passaram pelo sistema e têm itens, horário, vendedora e entrega. Os outros vêm do histórico do Bling (data, valor e situação).</div>` : "") + `
    <div class="par">
      ${par(brl(m.total), "total comprado")}${par(m.pedidos, "pedidos")}${par(brl(m.ticketMedio), "ticket médio")}${par(brl(m.maiorPedido), "maior pedido")}
      ${par(dt(m.ultimaCompra), `última compra (há ${m.diasDesdeUltima} dia(s))`)}${par(m.intervaloMedioDias != null ? m.intervaloMedioDias + " dias" : "—", "intervalo típico entre compras")}
      ${par(m.proximaPrevista ? dt(m.proximaPrevista) : "—", "próxima compra prevista")}${par(dt(m.primeiraCompra), "cliente desde")}
      ${par(brl(m.total30), "últimos 30 dias")}${par(brl(m.total90), "últimos 90 dias")}${par(brl(m.total365), "últimos 12 meses")}${par(m.itensPorPedido != null ? m.itensPorPedido : "—", "itens por pedido")}
    </div>
    <div class="grid2" style="margin-top:10px">
      <div class="bloco"><h4>🗓️ Quando costuma comprar</h4>
        <div class="lin"><span>Dias preferidos</span><b>${esc(m.diasPreferidos.join(", ") || "—")}</b></div>
        <div class="lin"><span>Horário mais comum</span><b>${esc(m.horarioPreferido || "—")}</b></div>

async function estornarCredito(mid) {

let DUP = null;
async function contarDuplicados() { const { ok, j } = await api("/api/clientes/duplicados"); if (!ok) return; DUP = j; const b = document.getElementById("btnDup"); b.textContent = `🧩 Duplicados (${j.total})`; b.style.borderColor = j.porForca.certeza ? "#ff8aa3" : ""; }
async function abrirDuplicados() {
  document.getElementById("mDup").classList.add("aberto");
  document.getElementById("mDupCorpo").innerHTML = `<div class="vazio"><div class="spin"></div></div>`;
  await contarDuplicados(); renderDuplicados();
}
function renderDuplicados() {
  const el = document.getElementById("mDupCorpo"), g = (DUP && DUP.grupos) || [];
  const cor = { "certeza": "erro", "provável": "warn", "sugestão": "neu" };
  el.innerHTML = `<div style="display:flex;align-items:center;gap:10px"><div style="flex:1"><div style="font-size:18px;font-weight:900">🧩 Cadastros duplicados</div>
      <div class="ic">${DUP.porForca.certeza} com o mesmo CPF/CNPJ · ${DUP.porForca.provavel} com o mesmo telefone · ${DUP.porForca.sugestao} com o mesmo nome</div></div>
      <button class="btn btn-ghost" onclick="document.getElementById('mDup').classList.remove('aberto')">Fechar</button></div>
    <div class="desc" style="margin-top:8px">Escolha o cadastro <b>principal</b> (já vem marcado o que tem mais pedidos) e unifique. No sistema, o histórico dos outros passa a contar no principal; no Bling, os outros ficam <b>inativos</b> para não aparecerem mais nas buscas. Os pedidos antigos continuam onde estão no Bling. Dá para desfazer pela ficha do cliente.</div>
    ${g.length ? g.map((gr, gi) => `<div class="bloco"><h4><span class="tag ${cor[gr.forca]}">${esc(gr.forca)}</span> ${esc(gr.motivo)}${gr.forca !== "certeza" ? ' <span class="ic">· confira antes de unificar</span>' : ""}</h4>
      ${gr.membros.map((m, mi) => `<label class="lin" style="cursor:pointer;align-items:center"><span style="display:flex;gap:8px;align-items:center"><input type="radio" name="pr_${gi}" value="${esc(m.id)}" ${mi === 0 ? "checked" : ""}>
        <span><b style="color:#fff">${esc(m.nome)}</b> <span class="ic">· ${m.doc ? esc(m.doc) : "sem documento"} · ${m.telefone ? esc(m.telefone) : "sem telefone"} · cód. ${esc(m.id)}</span></span></span>
        <span class="ic">${m.pedidos} pedido(s) · ${brl(m.total)}${m.ultima ? " · última " + dt(m.ultima) : ""}</span></label>`).join("")}
      <div style="display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap"><label class="ic" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="in_${gi}" checked> inativar os outros no Bling</label>
        <button class="btn btn-mag" onclick="unificar(${gi})">Unificar no principal marcado</button><span id="msg_${gi}"></span></div></div>`).join("")
      : `<div class="vazio">Nenhum duplicado encontrado. 🎉</div>`}`;
}
async function unificar(gi) {
  const gr = DUP.grupos[gi], principal = document.querySelector(`input[name="pr_${gi}"]:checked`).value;
  const secs = gr.membros.map(m => m.id).filter(id => id !== principal), nomeP = gr.membros.find(m => m.id === principal).nome;
  if (!confirm(`Unificar ${secs.length} cadastro(s) em "${nomeP}"?${document.getElementById("in_" + gi).checked ? "\n\nOs outros ficarão INATIVOS no Bling." : ""}`)) return;
  document.getElementById("msg_" + gi).innerHTML = `<span class="ic">Unificando…</span>`;
  const { ok, j } = await api("/api/clientes/unificar", { method: "POST", body: JSON.stringify({ principalId: principal, secundarios: secs, inativarNoBling: document.getElementById("in_" + gi).checked }) });
  if (!ok) { document.getElementById("msg_" + gi).innerHTML = `<span class="err">${esc(j.erro || "Não consegui unificar.")}</span>`; return; }
  const falhas = (j.resultado || []).filter(r => r.erro);
  DUP.grupos.splice(gi, 1); DUP.total--; renderDuplicados(); carregar(); contarDuplicados();
  if (falhas.length) alert(`Unificado no sistema. ${falhas.length} cadastro(s) não puderam ser inativados no Bling agora; inative manualmente lá: ${falhas.map(f => f.id).join(", ")}`);
}
async function desunificar(id) {
  if (!confirm("Desfazer a unificação deste cadastro? Ele volta a aparecer separado e é reativado no Bling.")) return;
  const { ok, j } = await api("/api/clientes/desunificar", { method: "POST", body: JSON.stringify({ id }) });
  if (!ok) { alert(j.erro || "Não consegui desfazer."); return; }
  abrirCliente(C.cadastro.id); carregar(); contarDuplicados();
}
