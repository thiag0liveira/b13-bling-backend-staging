<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>B13 — Apoio à Supervisora</title>
<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;margin:0;padding:0}
:root{--mag:#FF0082;--bg:#0f0d24;--card:#151233;--borda:#2c2660;--muted:#9a95c9;--ok:#3ce88a;--warn:#ffd23f;--ruim:#ff8f7a}
body{background:var(--bg);color:#fff;min-height:100vh}
.top{background:linear-gradient(180deg,#2b2870,#262366);border-bottom:3px solid var(--mag);padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top img{height:34px}.top .t{font-weight:900;font-size:16px}.top .sp{flex:1}
.btn{border:none;border-radius:9px;font-weight:800;cursor:pointer;font-size:12px;padding:8px 12px;color:#fff;text-decoration:none;display:inline-block}
.btn-ghost{background:#1c1846;border:1px solid #3a3480}.btn-mag{background:var(--mag)}
.wrap{padding:14px;display:grid;gap:12px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;background:#1c1846;border:1px solid #514c96;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;color:#fff;user-select:none}
.chip.on{background:var(--mag);border-color:var(--mag)}
input,select{padding:8px 10px;border-radius:9px;border:1px solid #37327a;background:#0f0d24;color:#fff;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:12px;position:relative}
.kpi.alerta{border-color:#7a2a3a;background:#20122a}.kpi .v{font-size:22px;font-weight:900}.kpi .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-top:3px}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:4px}
.card{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:14px}
.card h3{font-size:14px;margin-bottom:4px}.desc{font-size:12px;color:var(--muted);margin-bottom:10px}
.rolagem{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
th{background:#0d0b1e;padding:8px 10px;text-align:right;font-size:11px;color:var(--muted);border-bottom:1px solid var(--borda);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--borda);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.ped{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--borda);border-radius:12px;margin-bottom:6px;background:#120f2c;cursor:pointer;flex-wrap:wrap}
.ped:hover{border-color:var(--mag)}.ped .info{flex:1;min-width:220px}.ped .l1{font-weight:800;font-size:14.5px}.ped .l2{font-size:12px;color:var(--muted);margin-top:3px}
.ped .dir{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.valor{font-weight:900;font-size:15px;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tag.ok{background:#11352a;color:#6be3a8}.tag.warn{background:#3a2a0a;color:var(--warn)}.tag.erro{background:#3d1020;color:#ff8aa3}.tag.neu{background:#24205a;color:#cfcaf5}.tag.azul{background:#0d2a44;color:#7fd0ff}
.ic{font-size:12px;color:#cfcaf5;white-space:nowrap}
.vazio{padding:26px;text-align:center;color:var(--muted)}
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:200;overflow-y:auto;padding:24px 10px}
.fundo.aberto{display:flex}.modal{background:#151233;border:1px solid var(--borda);border-radius:14px;padding:16px;width:100%;max-width:860px}
.bloco{background:#120f2c;border:1px solid var(--borda);border-radius:10px;padding:12px;margin-top:10px}
.bloco h4{font-size:13px;margin-bottom:8px;color:#cfcaf5}
.lin{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px solid #1d1946}.lin:last-child{border-bottom:none}
.lin span:first-child{color:var(--muted)}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.galeria a,.galeria div{display:block;border:1px solid var(--borda);border-radius:8px;overflow:hidden;background:#0b0a1e;text-decoration:none;color:#cfcaf5}
.galeria img{width:100%;height:110px;object-fit:cover;display:block}.galeria video{width:100%;height:110px;display:block;background:#000}
.galeria small{display:block;padding:5px 7px;font-size:10.5px;color:var(--muted)}
.tl{border-left:2px solid var(--borda);padding-left:12px}.tl div{font-size:12.5px;padding:4px 0}.tl b{color:#fff}.tl span{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.spin{display:inline-block;width:20px;height:20px;border:3px solid #514c96;border-top-color:var(--mag);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.q{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;min-height:0}
.q h3{margin:0 0 6px;font-size:13.5px;display:flex;align-items:center;gap:6px}.q h3 .n{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600}
.lst{overflow:auto;max-height:230px}.lst.alto{max-height:330px}
.l{display:flex;gap:8px;align-items:center;padding:5px 2px;border-bottom:1px solid #221e4f;font-size:12.5px}.l:last-child{border-bottom:none}.l .x{flex:1;min-width:0}
.l .x b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.l .x span{color:var(--muted);font-size:11px}
.l.click{cursor:pointer}.l.click:hover{background:#1c1846}
.rolagem{overflow-x:auto;max-width:100%}#qComp .mini td{white-space:normal;padding:6px 8px;line-height:1.45}#qComp .mini{font-size:13px}#qVend{grid-column:1/-1}#qHora{grid-column:1/-1}@media(min-width:1100px){#qPreco{grid-column:span 2}}
#precoRes{max-height:440px}
.prod{border:1px solid #2c2660;border-radius:10px;padding:8px 10px;margin-bottom:6px;background:#120f2c}
.prod .pn{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;font-size:14px;margin-bottom:6px}.prod .pn b{line-height:1.3}
.pps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}@media(max-width:600px){#mRiscoCorpo .pps{grid-template-columns:repeat(2,1fr) !important}}
.pp{background:#1c1846;border-radius:8px;padding:6px 8px;text-align:center;min-width:0}.pp span{display:block;font-size:10.5px;color:#9a95c9;font-weight:700;text-transform:uppercase}
.pp b{display:block;font-size:16px;white-space:nowrap}.pp small{display:block;font-size:10.5px;color:#9a95c9}#qVend .mini{font-size:13.5px}#qVend .mini td{padding:7px 8px;line-height:1.45}#qVend .mini th{font-size:12.5px;padding:7px 8px}.q>*{min-width:0;max-width:100%}.q,.grade,.kpis{min-width:0}.q .ic,.q div.ic{white-space:normal}.rolagem{width:100%}#qComp{grid-column:1/-1}.mini{border-collapse:collapse;width:100%;font-size:11.5px}.mini th,.mini td{padding:4px 5px;border-bottom:1px solid #221e4f;text-align:center;white-space:nowrap}.mini th{color:var(--muted);font-weight:700}.mini td:first-child,.mini th:first-child{text-align:left}
.bar{height:10px;background:#221e4f;border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#FF0082,#ffd23f)}
.big{font-size:22px;font-weight:900}.verde{color:#3ce88a}.amar{color:#ffd23f}.verm{color:#ff8aa3}
.inp{display:flex;gap:6px}.inp input{flex:1;min-width:0}
#mapaFrete{height:200px;border-radius:8px;border:1px solid var(--borda);margin-top:6px;display:none}
.l.novo{animation:pisca 6s ease-out}@keyframes pisca{0%,30%{background:#4a3a00}100%{background:transparent}}
.kpi.pos{background:linear-gradient(160deg,#0f3a28,#101f1a);border-color:#2f9e6b}.kpi.neg{background:linear-gradient(160deg,#3d1020,#21101a);border-color:#9e2f4a}
.kpi .cmp{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:#9a95c9}.kpi .cmp b{display:block;font-size:19px;color:#e9e6ff;margin:1px 0}
.kpi .var{font-weight:900;font-size:15px;margin-top:4px}
.chipz{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}.chipz span{background:#1c1846;border:1px solid #3a3480;border-radius:999px;padding:3px 9px;font-size:11.5px}
</style>

<script src="/ficha-pedido.js"></script>
<style>
  body.b13nav-open{ overflow:hidden }
  @media(min-width:900px){ #b13nav{transform:translateX(0%) !important} #b13navOverlay{display:none !important} button[onclick="b13ToggleNav()"]{display:none !important}
    body > *:not(#b13nav):not([onclick="b13ToggleNav()"]):not(#b13navOverlay):not(.fundo){ margin-left:200px } }

<body><script>
  (function(){ if(!b13RequireLogin()) return; if(!b13BloquearSeSemAcesso("/supervisora")) return;
    document.addEventListener("DOMContentLoaded",function(){ const nav=document.createElement("div"); nav.innerHTML=b13RenderNav("/supervisora"); document.body.insertBefore(nav,document.body.firstChild); }); })();
</script>
<div class="top"><img src="/logo"><div class="t">🧭 Apoio à Supervisora</div><div class="sp"></div><span class="ic" id="vivo" style="font-weight:700"></span><span class="ic" id="atual"></span><button class="btn btn-ghost" onclick="carregar()">↻</button></div>
<div class="fundo" id="mRisco"><div class="modal" id="mRiscoCorpo" style="max-width:860px"></div></div>
<div class="wrap" style="max-width:none">
  <div class="kpis" id="kpis"></div>
  <div class="grade" id="grade"><div class="vazio"><div class="spin"></div></div></div>
</div>
<script>
const B = location.protocol.indexOf("http") === 0 ? "" : "https://app.b13bebidas.com.br";
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const brl = n => Number(n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const hm = ms => ms ? new Date(ms).toLocaleTimeString("pt-BR", { timeZone: "America/Sao_Paulo", hour: "2-digit", minute: "2-digit" }) : "";
const dm = ms => ms ? new Date(ms).toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit" }) : "";
const dsem = ms => ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"][new Date(ms - 3 * 3600e3).getUTCDay()];
const diaCurto = d => { const x = new Date(d + "T12:00:00"); return ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"][x.getDay()] + " " + d.slice(8, 10); };
function token() { try { return (b13GetSession() || {}).token || ""; } catch (e) { return ""; } }
async function api(p, op) { op = op || {}; const r = await fetch(B + p, { ...op, headers: { "Content-Type": "application/json", "X-Auth-Token": token() } }); const j = await r.json().catch(() => ({})); return { ok: r.ok, j }; }
let D = null;
const q = (id, titulo, n, corpo) => `<div class="q" id="${id}"><h3>${titulo}${n != null ? `<span class="n">${n}</span>` : ""}</h3>${corpo}</div>`;
// pedido sem caixa: botão para colocar a prazo (quantos dias)
const linhaPedSemCaixa = x => `<div class="l click" onclick="B13Ficha.abrir('${esc(x.id)}')"><div class="x"><b>#${esc(x.numero)} · ${esc(x.cliente)}</b><span>${esc(x.vendedor)} · ${dm(x.criadoEm)} · ${esc(x.situacao || "")}${x.dias ? ` · há ${x.dias} dia(s)` : ""}${x.pagoForaDoCaixa ? " · pago, não acertado no caixa" : ""}</span></div><b>${brl(x.total)}</b>
  <button class="btn btn-ghost" style="padding:3px 7px;font-size:11px;white-space:nowrap" title="Colocar este pedido a prazo" onclick="event.stopPropagation();colocarAPrazo('${esc(x.id)}','${esc(x.numero)}','${esc(x.cliente)}',${Number(x.total) || 0})">⏳ a prazo</button></div>`;
async function colocarAPrazo(id, numero, cliente, total) {
  // confere a situação atual no Bling e o caminho até Prazo (o fluxo do Bling pode não aceitar ir direto)
  const { ok: okC, j: c } = await api("/api/supervisora/pedido/" + encodeURIComponent(id) + "/caminho-prazo");
  if (!okC) { alert(c.erro || "Não consegui conferir a situação do pedido no Bling."); return; }
  if (c.jaEsta) { alert(`O pedido #${numero} já está a prazo.`); carregar(); return; }
  if (c.bloqueado) { alert(c.bloqueado); return; }
  const rota = c.caminho && c.caminho.length > 1 ? `Situação atual: ${c.atualNome}.\nO Bling não aceita ir direto: o pedido vai passar por ${c.atualNome} → ${c.caminho.join(" → ")}.`
    : c.semCaminho ? `Situação atual: ${c.atualNome}.\nAtenção: pelo fluxo do Bling não há caminho direto até Prazo; vou tentar pelas situações-ponte (Em digitação / Em aberto).`
    : `Situação atual: ${c.atualNome}. Muda direto para Prazo.`;
  const v = prompt(`Colocar o pedido #${numero} (${cliente}, ${brl(total)}) A PRAZO.\n\n${rota}\n\nQuantos dias de prazo? (1 a 60)`, "7"); if (v == null) return;
  const dias = parseInt(v, 10); if (!(dias >= 1 && dias <= 60)) { alert("Informe de 1 a 60 dias."); return; }
  const venc = new Date(Date.now() + dias * 86400000).toLocaleDateString("pt-BR");
  if (!confirm(`Confirmar: pedido #${numero} a prazo por ${dias} dia(s), vencendo em ${venc}?\nA situação muda para Prazo no Bling.`)) return;
  const { ok, j } = await api("/api/supervisora/pedido/" + encodeURIComponent(id) + "/prazo", { method: "POST", body: JSON.stringify({ dias }) });
  if (!ok) { alert(j.erro || "Não consegui colocar a prazo."); return; }
  alert(`Pedido #${numero} a prazo por ${j.dias} dia(s).` + (j.viaPonte ? `\nPassou por: ${j.viaPonte} → Prazo.` : ""));
  carregar();
}
const situacaoPrazo = p => {
  if (p.diasParaVencer == null) return `<span class="ic">sem vencimento registrado · ${p.dias != null ? p.dias + " dia(s) em aberto" : ""}</span>`;
  const dv = dm(p.venceEm);
  if (p.diasParaVencer < 0) return `<b class="verm">vencido há ${-p.diasParaVencer} dia(s)</b> <span class="ic">(venceu ${dv})</span>`;
  if (p.diasParaVencer === 0) return `<b class="amar">vence hoje</b> <span class="ic">(${dv})</span>`;
  return `<span class="${p.diasParaVencer <= 2 ? "amar" : ""}">vence em ${p.diasParaVencer} dia(s)</span> <span class="ic">(${dv})</span>`;
};
const linhaPed = x => `<div class="l click" onclick="B13Ficha.abrir('${esc(x.id)}')"><div class="x"><b>#${esc(x.numero)} · ${esc(x.cliente)}</b><span>${esc(x.vendedor)} · ${dm(x.criadoEm)} · ${esc(x.situacao || "")}${x.dias ? ` · há ${x.dias} dia(s)` : ""}${x.pagoForaDoCaixa ? " · pago, não acertado no caixa" : ""}</span></div><b>${brl(x.total)}</b></div>`;
async function carregar() {
  // tempo-limite: nunca fica carregando para sempre; se já havia dados, mantém e só avisa no topo
  let ok = false, j = {};
  try {
    const ac = new AbortController(), to = setTimeout(() => ac.abort(), 25000);
    const r = await fetch(B + "/api/supervisora/painel", { headers: { "X-Auth-Token": token() }, signal: ac.signal }); clearTimeout(to);
    ok = r.ok; j = await r.json().catch(() => ({}));
  } catch (e) { j = { erro: e.name === "AbortError" ? "O servidor demorou para responder." : "Sem conexão com o servidor." }; }
  if (!ok) {
    if (D) { document.getElementById("atual").innerHTML = `<span class="verm">atualização falhou · ${esc(j.erro || "")}</span>`; return; }
    document.getElementById("grade").innerHTML = `<div class="err">${esc(j.erro || "Não consegui carregar.")} <button class="btn btn-mag" style="margin-left:8px" onclick="document.getElementById('grade').innerHTML='<div class=&quot;vazio&quot;><div class=&quot;spin&quot;></div></div>';carregar()">Tentar de novo</button></div>`; return;
  }
  D = j; document.getElementById("atual").textContent = "atualizado " + hm(j.agora); render();
}
function render() {
  const d = D, M = d.metricas, me = d.meta, pct = me.valor ? Math.min(100, Math.round(me.vendido / me.valor * 100)) : 0;
  const varPct = (a, b) => b ? Math.round((a - b) / b * 100) : null, vh = varPct(M.hojeValor, M.hojeSemanaPassada), vs = varPct(M.semanaValor, M.semanaPassada);
  // comparativo com o valor de referência em destaque; quadro verde se está acima, vermelho se está abaixo
  const kComp = (v, l, ref, quando, pct, extra) => { const cl = pct == null ? "" : (pct >= 0 ? "pos" : "neg");
    return `<div class="kpi ${cl}"><div class="l">${l}</div><div class="v">${brl(v)}</div>
      <div class="cmp"><span>comparado com</span><b>${brl(ref)}</b><span>${quando}</span></div>
      ${pct != null ? `<div class="var ${pct >= 0 ? "verde" : "verm"}">${pct >= 0 ? "▲" : "▼"} ${Math.abs(pct)}% ${pct >= 0 ? "acima" : "abaixo"}</div>` : `<div class="s">sem venda no período de comparação</div>`}${extra || ""}</div>`; };
  const k = (v, l, s, cl) => `<div class="kpi"><div class="v ${cl || ""}">${v}</div><div class="l">${l}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`;
  document.getElementById("kpis").innerHTML =
    `<div class="kpi ${me.valor && me.falta <= 0 ? "pos" : ""}" style="grid-column:span 2"><div class="l">🎯 Meta de hoje ${me.valor ? brl(me.valor) : ""} <a href="#" onclick="editarMeta();return false" style="color:#7fd0ff;font-size:11px">${me.mes ? "alterar meta do mês" : "definir meta do mês"}</a></div>
      <div class="v">${brl(me.vendido)} <span style="font-size:13px" class="${me.falta > 0 ? "amar" : "verde"}">${me.valor ? (me.falta > 0 ? "faltam " + brl(me.falta) : "🎉 Meta do dia batida!") : (me.mes && !me.mes.hojeEhDiaDeVenda ? "hoje não é dia de venda" : "")}</span></div>${me.valor ? `<div class="bar"><i style="width:${pct}%;${me.falta <= 0 ? "background:#3ce88a" : ""}"></i></div>` : ""}
      ${me.mes ? `<div class="s">Mês: <b>${brl(me.mes.vendido)}</b> de ${brl(me.mes.meta)} (${Math.round(me.mes.vendido / me.mes.meta * 100)}%)${me.mes.falta > 0 ? ` · faltam ${brl(me.mes.falta)} em ${me.mes.diasRestantes} dia(s) de venda` : " · <span class='verde'>meta do mês batida ✓</span>"}${me.mes.herdada ? " · <span class='amar'>meta repetida do mês anterior</span>" : ""}</div>`
        : (me.valor ? `<div class="s">${pct}% da meta · defina a meta do mês para a meta de hoje ser calculada sozinha</div>` : `<div class="s">Defina a meta do mês: a meta de hoje é calculada pelo que falta e pelos dias de venda que restam.</div>`)}</div>`
    + kComp(M.hojeValor, "Vendido hoje (pedidos)", M.hojeSemanaPassada, `${dsem(M.refHojeAte)} ${dm(M.refHojeAte)} até ${hm(M.refHojeAte)}`, vh)
    + kComp(M.semanaValor, "Semana até agora (pedidos)", M.semanaPassada, `${dm(M.refSemanaIni)} a ${dsem(M.refSemanaAte)} ${dm(M.refSemanaAte)} ${hm(M.refSemanaAte)}`, vs)
    + (M.recebido ? kComp(M.recebido.hoje.total, "💵 Recebido hoje nos caixas", M.recebido.hojeAnt.total, `${dsem(M.refHojeAte)} ${dm(M.refHojeAte)} até ${hm(M.refHojeAte)}`, varPct(M.recebido.hoje.total, M.recebido.hojeAnt.total),
        `<div class="s" style="margin-top:4px">Atacado ${brl(M.recebido.hoje.atacado)} · Frente ${brl(M.recebido.hoje.frente)} · ${M.recebido.hoje.vendas} venda(s)</div>`)
      + kComp(M.recebido.semana.total, "💵 Recebido na semana nos caixas", M.recebido.semanaAnt.total, `${dm(M.refSemanaIni)} a ${dsem(M.refSemanaAte)} ${dm(M.refSemanaAte)} ${hm(M.refSemanaAte)}`, varPct(M.recebido.semana.total, M.recebido.semanaAnt.total),
        `<div class="s" style="margin-top:4px">Atacado ${brl(M.recebido.semana.atacado)} · Frente ${brl(M.recebido.semana.frente)}</div>`) : "")
    + k(M.pedidosSemana, "Pedidos na semana", `ticket médio ${brl(M.ticketMedio)} · ${M.pctEntrega}% entrega`)
    + k(brl(M.aReceberPrazo), "A receber (prazo)", `${d.prazo.length} pedido(s)`, M.aReceberPrazo > 0 ? "amar" : "")

// ===== Pedidos por hora: hoje x mesmo dia da semana passada x média das 4 semanas anteriores =====
let HORA_MET = "qtd", HORA_MODO = "hora";
function quadroHora() {
  const P = D.porHora; if (!P) return "";
  const acum = a => { let s = 0; return a.map(v => (s += v)); };
  const serie = x => { const a = x[HORA_MET].slice(); return HORA_MODO === "acum" ? acum(a) : a; };
  const hj = serie(P.hoje), sp = serie(P.semanaPassada), md = serie(P.media4), hAg = P.horaAgora;
  let h0 = 7, h1 = 22; [P.hoje, P.semanaPassada, P.media4].forEach(x => x.qtd.forEach((q, i) => { if (q > 0) { h0 = Math.min(h0, i); h1 = Math.max(h1, i); } }));
  const horas = []; for (let i = h0; i <= h1; i++) horas.push(i);
  const max = Math.max(1, ...horas.map(i => Math.max(i <= hAg ? hj[i] : 0, sp[i], md[i])));
  const W = 1000, H = 230, L = 52, R = 12, T = 12, Bm = 28, cw = (W - L - R) / (horas.length - 1 || 1);
  const X = i => L + (i - h0) * cw, Y = v => T + (H - T - Bm) * (1 - v / max);
  const fmt = v => HORA_MET === "valor" ? brl(v) : (Math.round(v * 10) / 10).toLocaleString("pt-BR");
  const linha = (arr, cor, extra, ate) => { const pts = horas.filter(i => ate == null || i <= ate).map(i => `${X(i).toFixed(1)},${Y(arr[i]).toFixed(1)}`).join(" ");
    return `<polyline points="${pts}" fill="none" stroke="${cor}" stroke-width="2.5" ${extra || ""}/>` + horas.filter(i => ate == null || i <= ate).map(i => `<circle cx="${X(i).toFixed(1)}" cy="${Y(arr[i]).toFixed(1)}" r="3.2" fill="${cor}"><title>${String(i).padStart(2, "0")}h · ${fmt(arr[i])}</title></circle>`).join(""); };
  const grade = [0, .25, .5, .75, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${Y(max * f)}" y2="${Y(max * f)}" stroke="#2a2660"/><text x="${L - 6}" y="${Y(max * f) + 4}" fill="#9a95c9" font-size="11" text-anchor="end">${HORA_MET === "valor" ? (max * f >= 1000 ? (max * f / 1000).toFixed(1).replace(".", ",") + " mil" : Math.round(max * f)) : Math.round(max * f * 10) / 10}</text>`).join("");
  const eixo = horas.map(i => `<text x="${X(i)}" y="${H - 8}" fill="${i === hAg ? "#FF0082" : "#9a95c9"}" font-size="11" text-anchor="middle">${i}h</text>`).join("");
  const agora = `<line x1="${X(Math.min(Math.max(hAg, h0), h1))}" x2="${X(Math.min(Math.max(hAg, h0), h1))}" y1="${T}" y2="${H - Bm}" stroke="#FF0082" stroke-dasharray="3 4" opacity=".6"/>`;
  const tot = (x, ate) => x[HORA_MET].reduce((a, v, i) => a + (ate == null || i <= ate ? v : 0), 0);
  const tHj = tot(P.hoje, hAg), tSp = tot(P.semanaPassada, hAg), tMd = tot(P.media4, hAg);
  const btn = (grupo, val, txt) => `<span class="chip ${(grupo === "m" ? HORA_MET : HORA_MODO) === val ? "on" : ""}" style="font-size:11.5px;padding:3px 9px" onclick="${grupo === "m" ? "HORA_MET" : "HORA_MODO"}='${val}';document.getElementById('qHora').outerHTML=quadroHora()">${txt}</span>`;
  const corpo = `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px">${btn("m", "qtd", "Pedidos")}${btn("m", "valor", "Valor (R$)")}<span style="width:10px"></span>${btn("o", "hora", "Por hora")}${btn("o", "acum", "Acumulado no dia")}
      <span style="margin-left:auto;font-size:12px"><span style="color:#FF0082">● Hoje ${fmt(tHj)}</span> · <span style="color:#7fd0ff">● ${dsem(Date.parse(P.semanaPassada.data + "T12:00:00-03:00"))} ${P.semanaPassada.data.slice(8, 10)}/${P.semanaPassada.data.slice(5, 7)} ${fmt(tSp)}</span> · <span style="color:#9a95c9">● média 4 semanas ${fmt(tMd)}</span> <span class="ic">(até ${hAg}h)</span></span></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grade}${agora}${linha(md, "#9a95c9", 'stroke-dasharray="6 5"')}${linha(sp, "#7fd0ff")}${linha(hj, "#FF0082", "", hAg)}${eixo}</svg>
    <div class="ic">Pedidos criados no sistema (sem vendas de caixa e sem consumidor final). Média das semanas de ${P.media4.datas.slice().reverse().map(d => d.slice(8, 10) + "/" + d.slice(5, 7)).join(", ")} (mesmo dia da semana).</div>`;
  return q("qHora", "📈 Pedidos por hora: hoje x semanas anteriores", null, corpo);
}

        <div class="pp"><span>Últimos 12 meses</span><b style="font-size:14px">${brl(c.total365)}</b><small>${esc(c.vendedora || "sem vendedora")}</small></div>

// ===== Pix e pendências: atualizam NA HORA (aviso do servidor), sem recarregar a tela =====
let PIX_VISTOS = null;
function quadroPix() {
  const d = D, novos = new Set(PIX_VISTOS ? d.pix.filter(p => !PIX_VISTOS.has(p.chave)).map(p => p.chave) : []);
  PIX_VISTOS = new Set(d.pix.map(p => p.chave));
  const l = `<div class="lst alto">${d.pix.map(p => `<div class="l${novos.has(p.chave) ? " novo" : ""}"><div class="x"><b>${dm(p.em)} ${hm(p.em)} · ${esc(p.forma)} · #${esc(p.numero)}</b><span>${esc(p.cliente || "—")} · caixa ${esc(p.operador)}${p.confirmado ? ` · ✔ ${esc(p.confirmado.por)} ${hm(p.confirmado.em)}` : ""}</span></div><b>${brl(p.valor)}</b>
      <button class="btn ${p.confirmado ? "btn-ghost" : "btn-mag"}" style="padding:4px 8px;font-size:11px" onclick="confPix('${esc(p.chave)}',${p.confirmado ? "true" : "false"})">${p.confirmado ? "desfazer" : "confirmar"}</button></div>`).join("") || `<div class="ic">Nenhum Pix nos caixas atacado nesta semana.</div>`}</div>`;
  return q("qPix", "🔷 Pix recebidos nos caixas atacado", `${d.pix.filter(p => !p.confirmado).length} a confirmar`, l);
}
function quadroPend() {
  const d = D, l = d.pendencias.map(p => `<div class="l click" onclick="B13Ficha.abrir('${esc(p.pedidoId)}')"><div class="x"><b>#${esc(p.numero)} · ${esc(p.cliente)}</b><span>${p.faltas.map(f => `${f.qtd}x ${esc(f.nome)}`).join(", ") || "faltas não detalhadas"}</span></div><b class="verm">− ${brl(p.valorRetirar)}</b></div>`).join("") || `<div class="ic">Nenhuma pendência na separação a partir de hoje.</div>`;
  return q("qPend", "📦 Pendências na separação (hoje em diante)", d.pendencias.length ? "retirar " + brl(d.pendencias.reduce((a, p) => a + p.valorRetirar, 0)) : null, `<div class="lst">${l}</div>`);
}
async function atualizarVivo() {
  if (!D) return;
  const { ok, j } = await api("/api/supervisora/vivo"); if (!ok) return;
  D.pix = j.pix; D.pendencias = j.pendencias;
  const a = document.getElementById("qPix"), b = document.getElementById("qPend");
  if (a) a.outerHTML = quadroPix(); if (b) b.outerHTML = quadroPend();
  document.getElementById("atual").textContent = "atualizado " + hm(j.agora);
}
let _es = null, _reserva = null;
function ligarAvisos() {
  try {
    _es = new EventSource(B + "/api/supervisora/eventos?t=" + encodeURIComponent(token()));
    _es.addEventListener("pronto", () => { if (_reserva) { clearInterval(_reserva); _reserva = null; } document.getElementById("vivo").textContent = "● ao vivo"; document.getElementById("vivo").style.color = "#3ce88a"; });
    _es.addEventListener("mudou", () => atualizarVivo());
    _es.onerror = () => { document.getElementById("vivo").textContent = "● reconectando"; document.getElementById("vivo").style.color = "#ffd23f"; if (!_reserva) _reserva = setInterval(atualizarVivo, 20000); }; // reconecta sozinho; enquanto isso, confere a cada 20 s
  } catch (e) { _reserva = setInterval(atualizarVivo, 20000); }
}
async function confPix(chave, desfazer) { const { ok, j } = await api("/api/supervisora/pix/confirmar", { method: "POST", body: JSON.stringify({ chave, desfazer }) }); if (!ok) { alert(j.erro || "Não consegui."); return; } const p = D.pix.find(x => x.chave === chave); if (p) p.confirmado = j.confirmado; const a = document.getElementById("qPix"); if (a) a.outerHTML = quadroPix(); }
function editarMeta() {
  const me = D.meta, ds = me.diasVenda || [1, 2, 3, 4, 5, 6], nomes = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
  const box = document.getElementById("mRiscoCorpo"); document.getElementById("mRisco").classList.add("aberto");
  box.innerHTML = `<div style="font-size:18px;font-weight:900;margin-bottom:6px">🎯 Meta do mês</div>
    <div class="ic" style="white-space:normal;margin-bottom:10px">A meta de cada dia é calculada sozinha: o que falta para a meta do mês, dividido pelos dias de venda que restam (contando hoje). Se um dia vender menos, a meta dos próximos sobe; se vender mais, cai.</div>
    <label class="ic">Meta de vendas deste mês (R$)</label>
    <input id="mMetaMes" inputmode="decimal" style="width:100%;font-size:18px;padding:10px;margin:4px 0 12px" value="${me.mes ? String(me.mes.meta).replace(".", ",") : ""}" placeholder="ex.: 150000">
    <div class="ic" style="margin-bottom:4px">Dias da semana em que a loja vende</div>
    <div class="chipz">${nomes.map((n, i) => `<label style="background:#1c1846;border:1px solid #3a3480;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer"><input type="checkbox" class="mDia" value="${i}" ${ds.includes(i) ? "checked" : ""}> ${n}</label>`).join("")}</div>
    <div id="mMetaErr"></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-mag" style="flex:1" onclick="salvarMeta()">Salvar</button><button class="btn btn-ghost" onclick="document.getElementById('mRisco').classList.remove('aberto')">Cancelar</button></div>`;
}
async function salvarMeta() {
  const v = document.getElementById("mMetaMes").value.trim(), dias = [...document.querySelectorAll(".mDia:checked")].map(x => Number(x.value));
  if (!v) { document.getElementById("mMetaErr").innerHTML = `<div class="err">Informe a meta do mês.</div>`; return; }
  const { ok, j } = await api("/api/supervisora/meta", { method: "POST", body: JSON.stringify({ metaMes: v, diasVenda: dias }) });
  if (!ok) { document.getElementById("mMetaErr").innerHTML = `<div class="err">${esc(j.erro || "Não consegui salvar.")}</div>`; return; }
  document.getElementById("mRisco").classList.remove("aberto"); carregar();
}
async function buscarPreco() {
  const v = document.getElementById("precoQ").value.trim(), el = document.getElementById("precoRes"); if (v.length < 2) { el.innerHTML = ""; return; }
  const { j } = await api("/api/supervisora/preco?q=" + encodeURIComponent(v));
  window._precoItens = j.itens || [];
  const caixa = (rot, v, sub, cor) => `<div class="pp"><span>${rot}</span><b style="color:${cor}">${v != null ? brl(v) : "—"}</b>${sub ? `<small>${sub}</small>` : ""}</div>`;
  el.innerHTML = (window._precoItens.length ? `<div style="display:flex;justify-content:space-between;align-items:center;margin:2px 0 6px"><span class="ic">${window._precoItens.length} produto(s)</span><button class="btn btn-ghost" style="padding:4px 9px;font-size:11.5px" onclick="enviarPrecoWhats(-1)">💬 Enviar todos no WhatsApp</button></div>` : "")
    + (window._precoItens.map((p, i) => `<div class="prod"><div class="pn"><b>${esc(p.nome)}</b><button class="btn btn-ghost" style="padding:3px 8px;font-size:12px" title="Enviar no WhatsApp" onclick="enviarPrecoWhats(${i})">💬</button></div>
      <div class="pps">${caixa("Varejo", p.varejo, "unidade", "#fff")}${caixa("Atacado", p.atacado, "unidade", "#ffd23f")}${caixa("Fardo", p.fardo, p.fardo != null && p.qtdFardo ? p.qtdFardo + " un" : "", "#7fd0ff")}</div></div>`).join("") || `<div class="ic">Nenhum produto encontrado.</div>`);
}
// manda os preços pelo WhatsApp (WhatsApp Web no computador, aplicativo no celular), escolhendo o contato
function textoPreco(p) {
  return `*${p.nome}*\nVarejo (unidade): ${brl(p.varejo)}` + (p.atacado != null ? `\nAtacado (unidade): ${brl(p.atacado)}` : "") + (p.fardo != null ? `\nFardo${p.qtdFardo ? " com " + p.qtdFardo + " un" : ""}: ${brl(p.fardo)}` : "");
}
function enviarPrecoWhats(i) {
  const l = window._precoItens || []; const itens = i < 0 ? l : [l[i]]; if (!itens.length) return;
  const txt = encodeURIComponent(itens.map(textoPreco).join("\n\n") + "\n\n_B13 Bebidas · preços sujeitos a alteração_");
  const celular = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  window.open(celular ? `https://wa.me/?text=${txt}` : `https://web.whatsapp.com/send?text=${txt}`, "_blank");
}
async function buscarCli() {
  const v = document.getElementById("frCli").value.trim(), el = document.getElementById("frCliRes"); if (v.length < 2) { el.innerHTML = ""; return; }
  const { j } = await api("/api/supervisora/clientes?q=" + encodeURIComponent(v)); window._cliFr = j.itens || [];
  el.innerHTML = window._cliFr.map((c, i) => `<div class="l click" onclick="escolherCli(${i})"><div class="x"><b>${esc(c.nome)}</b><span>${esc(c.endereco || "sem endereço no cadastro")}</span></div></div>`).join("") || `<div class="ic">Nenhum cliente.</div>`;
}
function escolherCli(i) { const c = window._cliFr[i]; document.getElementById("frEnd").value = c.endereco || ""; document.getElementById("frCliRes").innerHTML = `<div class="ic">Cliente: <b>${esc(c.nome)}</b>${c.telefone ? " · " + esc(c.telefone) : ""}</div>`; }
function carregarLeaflet() { return new Promise(ok => { if (window.L) return ok(); const c = document.createElement("link"); c.rel = "stylesheet"; c.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(c); const s = document.createElement("script"); s.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"; s.onload = () => ok(); document.head.appendChild(s); }); }
let MAPA = null;
async function calcFrete() {
  const end = document.getElementById("frEnd").value.trim(), valor = Number(String(document.getElementById("frValor").value || "0").replace(",", ".")) || 0, el = document.getElementById("frRes");
  if (!end) { el.innerHTML = `<span class="verm">Digite ou escolha o endereço.</span>`; return; }
  el.innerHTML = "Calculando…";
  const [f, r] = await Promise.all([fetch(B + "/api/frete?endereco=" + encodeURIComponent(end) + "&valor=" + valor).then(x => x.json()).catch(() => ({})), api("/api/supervisora/rota?endereco=" + encodeURIComponent(end)).then(x => x.j)]);
  el.innerHTML = (f.entregaDisponivel ? `✅ <b>${String(f.km).replace(".", ",")} km</b> · taxa <b>${brl(f.taxa)}</b>${f.gratis ? " (grátis)" : ""}${f.tentativa === "pelo CEP" ? ` <span class="amar">(pelo CEP, aproximado)</span>` : ""}` : `<span class="amar">${esc(f.motivo || f.erro || "Sem frete para esse endereço.")}</span>`)
    + (r && r.ok ? `<br><span class="ic">Caminho: ${String(r.km).replace(".", ",")} km · cerca de ${r.minutos} min · ${esc(r.destino.endereco || "")}</span>` : (r && r.erro ? `<br><span class="ic">${esc(r.erro)}</span>` : ""));
  if (!(r && r.ok)) return;
  await carregarLeaflet(); const box = document.getElementById("mapaFrete"); box.style.display = "block";
  if (MAPA) { MAPA.remove(); MAPA = null; }
  MAPA = L.map("mapaFrete"); L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(MAPA);
  const linha = L.polyline(r.caminho, { color: "#FF0082", weight: 4 }).addTo(MAPA);
  L.circleMarker([r.origem.lat, r.origem.lng], { radius: 7, color: "#3ce88a", fillOpacity: 1 }).addTo(MAPA).bindPopup("Loja");
  L.circleMarker([r.destino.lat, r.destino.lng], { radius: 7, color: "#FF0082", fillOpacity: 1 }).addTo(MAPA).bindPopup("Cliente");
  MAPA.fitBounds(linha.getBounds(), { padding: [12, 12] });
}
