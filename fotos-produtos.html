<script>
const B = location.protocol.indexOf("http") === 0 ? "" : "https://app.b13bebidas.com.br";
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function token() { try { return (b13GetSession() || {}).token || ""; } catch (e) { return ""; } }
async function api(p, op) { op = op || {}; const r = await fetch(B + p, { ...op, headers: { "Content-Type": "application/json", "X-Auth-Token": token() } }); const j = await r.json().catch(() => ({})); return { ok: r.ok, j }; }
let D = null, FILTRO = "problemas", Q = "", PG = 1, ACUM = [], _tq = null, _poll = null;
const FILTROS = [["problemas", "Com problema"], ["semfoto", "Sem foto"], ["quebrado", "Link fora do ar"], ["sugestao", "Com sugestão"], ["prontas", "Prontas p/ Bling"], ["ok", "Fotos OK"], ["naoverificada", "Não verificadas"], ["todas", "Todas"]];
const quando = ms => ms ? new Date(ms).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "nunca";
function buscar() { clearTimeout(_tq); _tq = setTimeout(() => { Q = document.getElementById("fQ").value; PG = 1; carregar(); }, 350); }
let _seq = 0;
async function carregar(mais) { const meu = ++_seq, { ok, j } = await api(`/api/fotos?estado=${FILTRO}&q=${encodeURIComponent(Q)}&pagina=${PG}`); if (meu !== _seq) return; if (!ok) { document.getElementById("fLista").innerHTML = `<div class="fbar ferr">${esc(j.erro || "Não consegui carregar.")}</div>`; return; }
  D = j; if (mais) ACUM = ACUM.concat(j.itens); else ACUM = j.itens.slice(); desenhar(); if ((j.verificacao.job.rodando || j.sugestao.job.rodando) && !_poll) iniciarAcompanhamento(); }
let JOB = null, OPT = new Set(), VISTOS = new Set(), ESTADOS = "", FIM = 0, ERRO_FECHADO = "";
const nomeDe = id => { const p = ACUM.find(x => x.id === id); return p ? p.nome : id; };
function trocarCard(p) { const el = document.getElementById("p-" + p.id); if (!el) return; const t = document.createElement("div"); t.innerHTML = card(p); el.replaceWith(t.firstElementChild); }
function repintar(ids) { ids.forEach(id => { const p = ACUM.find(x => x.id === id); if (p) trocarCard(p); }); }
async function atualizarCards(ids) { const { ok, j } = await api("/api/fotos?ids=" + ids.join(",")); if (!ok) return; j.itens.forEach(n => { const i = ACUM.findIndex(x => x.id === n.id); if (i >= 0) ACUM[i] = n; trocarCard(n); }); if (D) { D.totais = j.totais; desenharQuadros(); } }
async function acompanhar() { const { ok, j } = await api("/api/fotos/job"); if (!ok) return; JOB = j; const s = j.sugestao, v = j.verificacao;
  const novos = (s.prontos || []).filter(id => !VISTOS.has(id)); novos.forEach(id => { VISTOS.add(id); OPT.delete(id); });
  if (novos.length) await atualizarCards(novos);
  const est = (s.andando || []).join(",") + "|" + (s.fila || []).join(","); if (est !== ESTADOS) { ESTADOS = est; repintar((s.andando || []).concat(s.fila || [])); }
  desenharBarra(v, s);
  if (!v.rodando && !s.rodando) { clearInterval(_poll); _poll = null; ESTADOS = ""; FIM = Date.now(); OPT.clear(); desenharBarra(v, s); PG = 1; await carregar(); } }
function desenharBarra(v, s) { const el = document.getElementById("fBar"); let h = "", cls = "fixbar";
  if (s.rodando) { const agora = (s.andando || []).slice(0, 2).map(nomeDe).join(" · "); h = `<div class="rw"><div><span class="sp"></span><b>Procurando fotos…</b> ${s.feito} de ${s.total} · ${s.achou} com fotos · ${s.semResultado} sem resultado${agora ? '<div class="ic" style="white-space:normal">agora: ' + esc(agora) + "</div>" : ""}</div><button class="fb" onclick="parar()">Parar</button></div><div class="pr"><i style="width:${s.total ? Math.round(s.feito / s.total * 100) : 0}%"></i></div>`; }
  else if (v.rodando) h = `<div class="rw"><div><span class="sp"></span><b>Conferindo os links das fotos…</b> ${v.feito} de ${v.total}</div></div><div class="pr"><i style="width:${v.total ? Math.round(v.feito / v.total * 100) : 0}%"></i></div>`;
  else if (s.erro && s.erro !== ERRO_FECHADO && s.fim && s.fim > Date.now() - 1800000) { cls += " err"; h = `<div class="rw"><div><b>A busca parou:</b> ${esc(s.erro)}<div class="ic" style="white-space:normal;color:#ffd0da">Se fala de busca na web, o administrador da conta Anthropic precisa ativá-la no Console.</div></div><button class="fb" onclick="ERRO_FECHADO='${esc(s.erro).replace(/'/g, "")}';desenharBarra(JOB.verificacao,JOB.sugestao)">✕</button></div>`; }
  else if (FIM && Date.now() - FIM < 12000 && s.fim) h = `<div class="rw"><div>✅ <b>Busca concluída.</b> ${s.achou} produto(s) com fotos para escolher, ${s.semResultado} sem resultado${s.erros ? ", " + s.erros + " com erro" : ""}.</div></div>`;
  el.className = cls; el.style.display = h ? "block" : "none"; el.innerHTML = h; document.getElementById("bVer").disabled = !!v.rodando; document.getElementById("bSug").disabled = !!s.rodando; if (h && FIM && !s.rodando && !v.rodando) setTimeout(() => desenharBarra(v, s), 12500); }
async function parar() { await api("/api/fotos/parar", { method: "POST", body: "{}" }); msg("Vou parar depois do que já está sendo procurado."); }
function iniciarAcompanhamento() { VISTOS = new Set(); FIM = 0; if (!_poll) _poll = setInterval(acompanhar, 1500); acompanhar(); }
function desenharQuadros() { const t = D.totais, K = (k, rot, n) => `<div class="k ${FILTRO === k ? "on" : ""}" onclick="FILTRO='${k}';PG=1;carregar()"><div class="v">${n}</div><div class="l">${rot}</div></div>`;
  document.getElementById("fK").innerHTML = K("semfoto", "Sem foto", t.semfoto) + K("quebrado", "Link fora do ar", t.quebrado) + K("ok", "Fotos OK", t.ok) + K("sugestao", "Com sugestão", t.comSugestao) + K("prontas", "Prontas p/ Bling", t.prontas) + K("naoverificada", "Não verificadas", t.naoverificada);
  document.getElementById("fFiltros").innerHTML = FILTROS.map(f => `<button class="fb ${FILTRO === f[0] ? "m" : ""}" onclick="FILTRO='${f[0]}';PG=1;carregar()">${f[1]}</button>`).join("");
}
function desenhar() { desenharQuadros();
  document.getElementById("fMsg").innerHTML = `Última verificação dos links: <b style="color:#fff">${quando(D.verificacao.ultima)}</b>.${D.sugestao.iaAtiva ? "" : " A IA não está ligada (falta a chave no Railway): as sugestões usam só o código de barras."}`;
  document.getElementById("fLista").innerHTML = ACUM.length ? ACUM.map(card).join("") : '<div class="card ic">Nenhum produto neste filtro.</div>';
  const falta = D.total - ACUM.length; document.getElementById("fMais").innerHTML = falta > 0 ? `<button class="fb" onclick="PG++;carregar(true)">Mostrar mais (${falta})</button>` : (D.total ? `<span class="ic">${D.total} produto(s)</span>` : ""); }
const badge = p => p.nova ? '<span class="fe ok">✅ pronta para o Bling</span>' : p.estado === "semfoto" ? '<span class="fe sf">Sem foto</span>' : p.estado === "quebrado" ? `<span class="fe qb">Link fora do ar</span> <span class="ic">${esc(p.motivo || "")}</span>` : p.estado === "ok" ? `<span class="fe ok">Foto OK</span> <span class="ic">${p.w ? p.w + "×" + p.h : ""}</span>` : '<span class="fe nv">Não verificada</span>';
function estadoBusca(id) { if (OPT.has(id)) return "andando"; const s = JOB && JOB.sugestao; if (!s) return ""; return (s.andando || []).indexOf(id) >= 0 ? "andando" : ((s.fila || []).indexOf(id) >= 0 ? "fila" : ""); }
const gUrl = n => "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(n + " supermercado");
function card(p) { const im = p.nova ? p.nova.url : (p.estado === "ok" || p.estado === "naoverificada") && p.url ? p.url : "", eb = p.nova ? "" : estadoBusca(p.id);
  let h = `<div class="fp" id="p-${p.id}"><div class="th">${im ? `<img loading="lazy" src="${esc(im)}" alt="" onerror="this.parentNode.textContent='sem imagem'">` : "sem foto"}</div><div class="inf"><div class="nm">${esc(p.nome)}</div><div class="ic">${esc(p.codigo)}${p.gtin ? " · " + esc(p.gtin) : ""}</div><div>${badge(p)}</div>`;
  if (p.url && !p.nova) h += `<div class="ur">atual: <a href="${esc(p.url)}" target="_blank" rel="noopener" style="color:#9fd0ff">${esc(p.url.length > 70 ? p.url.slice(0, 70) + "…" : p.url)}</a></div>`;
  if (p.nova) return h + `${p.nova.semCopia ? '<div class="ic" style="white-space:normal;color:#ffd27a">⚠️ link direto do site (sem cópia no nosso servidor)</div>' : ""}<div class="ur">novo link: <a href="${esc(p.nova.url)}" target="_blank" rel="noopener" style="color:#9fd0ff">${esc(p.nova.url)}</a>${p.nova.exportadaEm ? " · já exportada em " + quando(p.nova.exportadaEm) : ""}</div><div class="ac"><button class="fb" onclick="desfazer('${p.id}')">↩ Desfazer</button></div></div></div>`;
  if (eb === "andando") h += `<div class="bsc"><span class="sp"></span><b>Procurando fotos para este produto…</b><div class="ic" style="white-space:normal">Leva alguns segundos. As fotos aparecem aqui assim que forem conferidas.</div></div>`;
  else if (eb === "fila") h += `<div class="bsc">⏳ Na fila: vou procurar as fotos deste produto em instantes.</div>`;
  else if (p.sugestao) { const cs = p.sugestao.candidatas || [];
    h += `<div class="ic" style="margin-top:8px;white-space:normal">💡 <b style="color:#fff">${cs.length} foto(s) encontrada(s)</b>, escolha a melhor:</div><div class="cg">` + cs.map((c, i) => `<div class="cd"><div class="th"><img referrerpolicy="no-referrer" loading="lazy" src="${esc(c.previa || c.url)}" alt="" onclick="ampliar('${esc(c.previa || c.url)}')" style="cursor:zoom-in" onerror="semImg(this)"></div><div class="ic" style="white-space:normal">${c.w ? c.w + "×" + c.h : (c.verificada === false ? "não conferida" : "")}</div><button class="fb v" onclick="aceitar('${p.id}',${i})">✅ Usar</button></div>`).join("") + `</div>`
      + `<div class="ac"><button class="fb" onclick="outras('${p.id}')">🚫 Nenhuma serve, procurar outras</button><a class="ic" href="${gUrl(p.nome)}" target="_blank" rel="noopener" style="color:#9fd0ff">🔍 ver no Google</a></div><div class="ur">${esc(cs[0] ? cs[0].fonte : "")}${cs[0] && cs[0].pagina ? ' · <a href="' + esc(cs[0].pagina) + '" target="_blank" rel="noopener" style="color:#9fd0ff">página de origem</a>' : ""}</div>`; }
  else if (p.semResultado) h += `<div class="sem">🔎 Não achei uma foto confiável na busca. Tente a IA, abra o Google ou cole um link abaixo.<div class="ac"><button class="fb m" onclick="sugerirUm('${p.id}',true)">🤖 Tentar com a IA</button><a class="ic" href="${gUrl(p.nome)}" target="_blank" rel="noopener" style="color:#9fd0ff">🔍 ver no Google</a></div></div>`;
  if (!eb && p.estado !== "ok") h += `<div class="ac"><input id="l-${p.id}" placeholder="colar o link de uma foto" autocomplete="off"><button class="fb" onclick="aceitarLink('${p.id}')">Usar link</button>${p.sugestao || p.semResultado ? "" : `<button class="fb m" onclick="sugerirUm('${p.id}')">🔎 Procurar fotos</button>`}</div>`;
  return h + "</div></div>"; }
function ampliar(u) { window.open(u, "_blank"); }
// foto que o navegador não conseguiu carregar some da lista (como na tela Imagens)
function semImg(img) { const cd = img.closest(".cd"), cg = cd && cd.parentNode; if (cd) cd.remove(); if (cg && !cg.querySelector(".cd")) cg.innerHTML = '<div class="sem" style="width:100%">Nenhuma das fotos carregou aqui. Clique em "procurar outras" ou veja no Google.</div>'; }
function msg(t, erro) { const el = document.getElementById("fAviso"); el.style.display = "block"; el.innerHTML = (erro ? '<span class="ferr">' : "") + esc(t) + (erro ? "</span>" : ""); }
async function verificar() { const { ok, j } = await api("/api/fotos/verificar", { method: "POST", body: JSON.stringify({ forcar: true }) }); if (!ok) { msg(j.erro || "Não consegui iniciar.", true); return; } if (!_poll) _poll = setInterval(acompanhar, 3000); acompanhar(); }
async function sugerirLote() { const { ok, j } = await api("/api/fotos/sugerir", { method: "POST", body: JSON.stringify({ max: 25, ia: document.getElementById("cIA").checked }) }); if (!ok) { msg(j.erro || "Não consegui iniciar.", true); return; } if (j.mensagem) { msg(j.mensagem); return; } msg(`Procurando fotos para ${j.produtos} produto(s). Acompanhe pela barra de baixo; cada produto se atualiza quando termina.`); iniciarAcompanhamento(); }
async function sugerirUm(id, ia) { OPT.add(id); repintar([id]); const { ok, j } = await api("/api/fotos/sugerir", { method: "POST", body: JSON.stringify({ ids: [id], ia: !!ia }) }); if (!ok) { OPT.delete(id); repintar([id]); msg(j.erro || "Não consegui iniciar.", true); return; } if (j.jaRodando) { msg("Já tem uma busca em andamento. Espere terminar para pedir outra.", true); OPT.delete(id); repintar([id]); return; } iniciarAcompanhamento(); }
async function aceitar(id, indice, url) { msg("Guardando a foto…"); const { ok, j } = await api("/api/fotos/aceitar", { method: "POST", body: JSON.stringify({ id, indice, url, fallback: true }) }); if (!ok) { msg(j.erro || "Não consegui usar essa foto.", true); return; } msg(j.semCopia ? "✅ Foto escolhida. Não consegui copiar para o nosso servidor (" + (j.aviso || "o site bloqueou") + "), então vai o link direto do site na planilha. Se o site tirar a imagem, o link volta a quebrar." : "✅ Foto guardada. Ela entra na planilha para o Bling."); await atualizarCards([id]); }
function aceitarLink(id) { const u = (document.getElementById("l-" + id).value || "").trim(); if (!u) { msg("Cole o link da foto.", true); return; } aceitar(id, null, u); }
async function outras(id) { await api("/api/fotos/rejeitar", { method: "POST", body: JSON.stringify({ id }) }); await atualizarCards([id]); sugerirUm(id); }
async function desfazer(id) { await api("/api/fotos/desfazer", { method: "POST", body: JSON.stringify({ id }) }); await atualizarCards([id]); }
async function verificar() { const { ok, j } = await api("/api/fotos/verificar", { method: "POST", body: JSON.stringify({ forcar: true }) }); if (!ok) { msg(j.erro || "Não consegui iniciar.", true); return; } iniciarAcompanhamento(); }
function abrirExportar() { const t = D ? D.totais : { prontas: 0, prontasNaoExportadas: 0 }, el = document.getElementById("fExp"); el.style.display = "block";
  el.innerHTML = `<b>⬇️ Exportar para importar no Bling</b><div class="ic" style="white-space:normal;margin:3px 0 6px">A planilha traz o ID, o código, a descrição e o link da foto (a cópia guardada no nosso servidor). Prontas: <b style="color:#fff">${t.prontas}</b> · ainda não exportadas: <b style="color:#fff">${t.prontasNaoExportadas}</b>.</div>
    <div class="ac"><span class="ic">Nome da coluna da foto:</span><input id="eCol" value="${esc(D ? D.colunaBling : "URL Imagens Externas")}"></div>
    <label class="ic" style="display:flex;gap:6px;align-items:center;margin-top:6px"><input type="checkbox" id="eTodas" style="width:15px;height:15px;flex:none"> incluir também as já exportadas</label>
    <div class="ac"><button class="fb v" onclick="exportar('xlsx')">Baixar XLSX</button><button class="fb" onclick="exportar('csv')">Baixar CSV</button></div>
    <div class="ic" style="white-space:normal;margin-top:8px">No Bling: <b style="color:#fff">Cadastros › Produtos › Importar produtos</b>. Baixe o modelo do próprio Bling e confira o nome da coluna das imagens externas (ajuste acima se for diferente). Teste com 2 produtos antes. Se o produto já tem foto, o Bling pode manter a antiga junto da nova.</div>`; el.scrollIntoView({ behavior: "smooth" }); }
async function exportar(fmt) { const col = document.getElementById("eCol").value, todas = document.getElementById("eTodas").checked, url = `${B}/api/fotos/exportar?formato=${fmt}&coluna=${encodeURIComponent(col)}&todas=${todas ? 1 : 0}&marcar=1`;
  const r = await fetch(url, { headers: { "X-Auth-Token": token() } }); if (!r.ok) { const j = await r.json().catch(() => ({})); msg(j.erro || "Não consegui exportar.", true); return; }
  const b = await r.blob(), a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "fotos_para_importar_no_bling." + fmt; a.click(); msg("Planilha baixada. As fotos exportadas ficam marcadas como exportadas."); PG = 1; carregar(); }
carregar();
</script>
</body>
</html>
