<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B13 — Gestão de Caixas</title>
<style>
  *{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}
  :root{--indigo:#262366;--indigo2:#2b2870;--mag:#FF0082;--bg:#0f0d24}
  body{margin:0;background:var(--bg);color:#fff}
  #app{max-width:920px;margin:0 auto;min-height:100vh}
  .top{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--indigo2),var(--indigo));display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:3px solid var(--mag)}
  .top img{height:42px}.top .t{font-weight:900;font-size:18px}.top .sp{flex:1}
  .btn{border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:14px;padding:11px 16px;color:#fff}
  .btn-sm{font-size:12px;padding:8px 12px}
  .btn-mag{background:var(--mag)}.btn-out{background:transparent;border:2px solid #514c96;color:#fff}.btn-ghost{background:#1c1846}
  .btn:disabled{opacity:.4}
  .wrap{padding:16px}
  input,select{padding:12px;border-radius:10px;border:2px solid #514c96;background:#151233;color:#fff;font-size:15px}
  input:focus,select:focus{outline:none;border-color:var(--mag)}
  .card{background:#151233;border:1px solid #2c2660;border-radius:14px;padding:16px;margin-bottom:14px}
  .muted{color:#9a95c9;font-size:13px}
  .err{background:#3a2030;color:#ffbfce;border-radius:10px;padding:10px 12px;font-weight:700;margin:8px 0}
  .linha{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #23204f;font-size:14px}
  .linha:last-child{border-bottom:none}
  .toggle{display:flex;background:#0a0918;border-radius:10px;padding:4px;gap:4px;margin-bottom:14px}
  .toggle button{flex:1;background:transparent;border:none;color:#9a95c9;padding:12px;border-radius:8px;font-weight:800;cursor:pointer;font-size:14px}
  .toggle button.on{background:var(--mag);color:#fff}
  .modalBg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal{background:#151233;border:1px solid #2c2660;border-radius:16px;padding:20px;max-width:560px;width:100%;max-height:88vh;overflow:auto}
  .modal h3{margin:0 0 12px}
</style>
<script src="/nav.js"></script>
<style>
  @media(min-width:900px){
    #b13nav{transform:translateX(0%) !important}
    button[onclick="b13ToggleNav()"]{display:none !important}
    body > *:not(#b13nav):not([onclick="b13ToggleNav()"]):not(#b13navOverlay){ margin-left:200px }
  }
</style>
</head>
<body><script>
  (function(){
    const sess=(typeof b13GetSession==="function")?b13GetSession():null;
    if(!sess){ location.href="/login?next="+encodeURIComponent(location.pathname); return; }
    if(typeof b13BloquearSeSemAcesso==="function" && !b13BloquearSeSemAcesso("/gestao-caixas")) return;
    document.addEventListener("DOMContentLoaded",function(){
      const nav=document.createElement("div");
      nav.innerHTML=b13RenderNav("/gestao-caixas");
      document.body.insertBefore(nav,document.body.firstChild);
    });
  })();
</script>
<div id="app"></div>
<div id="modais"></div>
<script>
if(!window.__b13SemAcesso){
const B=(location.protocol.indexOf("http")===0)?"":"https://b13-bling-backend-production.up.railway.app";
const LOGO="https://i.imgur.com/nBQ2Ck2.png";

window.ABA="abertos";
window.FILTRO_TIPO="todos"; // todos | frente | atacado

function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function brl(v){ return (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function hora(ts){ if(!ts) return "—"; const d=new Date(ts); return d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }
window.GESTOR=(typeof b13GetSession==="function")?b13GetSession():null;
// interpreta número digitado em pt-BR: "1.234,56" ou "150,50" ou "150.50"
function numBR(s){ s=String(s==null?"":s).trim(); if(!s) return 0; if(s.indexOf(",")>=0){ s=s.replace(/\./g,"").replace(",","."); } return parseFloat(s)||0; }
function totalPixForma(porForma){ return (porForma||[]).filter(f=>/pix/i.test(f.nome||"")).reduce((a,f)=>a+(Number(f.valor)||0),0); }
window.fecharModais=function(){ document.getElementById("modais").innerHTML=""; }

// selo indicando o tipo do caixa
function tagTipo(t){
  const at=(t||"frente")==="atacado";
  return `<span style="display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;background:${at?'#1a2a44':'#2a1a3a'};color:${at?'#7fd4ff':'#ff9fd0'}">${at?'🧾 Atacado':'🛒 Frente'}</span>`;
}
// aplica o filtro de tipo na lista vinda do backend
function filtrarTipo(lista){
  if(window.FILTRO_TIPO==="todos") return lista;
  return lista.filter(s=>(s.tipoCaixa||"frente")===window.FILTRO_TIPO);
}

window.render=function(){
  document.getElementById("app").innerHTML=`
    <div class="top"><img src="${LOGO}"><div class="t">🗃️ Gestão de Caixas</div></div>
    <div class="wrap">
      <div class="muted" style="margin-bottom:12px">Acompanhe todos os caixas — Frente de Caixa e Caixa Atacado — os que estão abertos agora e o histórico dos já fechados, com horários, operador e total por forma de pagamento.</div>
      <button class="btn btn-ghost btn-sm" style="margin-bottom:12px" onclick="gerenciarBancosPix()">🏦 Bancos do PIX</button>
      <div class="toggle">
        <button class="${window.ABA==='abertos'?'on':''}" onclick="window.ABA='abertos';render()">🏪 Abertos agora</button>
        <button class="${window.ABA==='historico'?'on':''}" onclick="window.ABA='historico';render()">📜 Histórico</button>
      </div>
      <div class="toggle" style="margin-top:-6px">
        <button class="${window.FILTRO_TIPO==='todos'?'on':''}" onclick="window.FILTRO_TIPO='todos';render()">Todos</button>
        <button class="${window.FILTRO_TIPO==='frente'?'on':''}" onclick="window.FILTRO_TIPO='frente';render()">🛒 Frente</button>
        <button class="${window.FILTRO_TIPO==='atacado'?'on':''}" onclick="window.FILTRO_TIPO='atacado';render()">🧾 Atacado</button>
      </div>
      <div id="conteudo"><div class="muted">Carregando…</div></div>
    </div>`;
  if(window.ABA==="abertos") carregarAbertos(); else carregarHistorico();
}

window.carregarAbertos=async function(){
  const box=document.getElementById("conteudo");
  try{
    const j=await fetch(B+"/api/caixa-sessao/abertos").then(r=>r.json());
    const lista=filtrarTipo(j.data||[]);
    box.innerHTML = lista.length ? lista.map(s=>`
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px">
          <div style="font-weight:800">👤 ${esc(s.operador||"—")} ${tagTipo(s.tipoCaixa)}</div>
          <div class="muted" style="font-size:12px">🕐 Aberto desde ${hora(s.abertaEm)}</div>
        </div>
        <div class="linha" style="margin-top:8px"><span>Vendas (${s.resumo.qtdVendas})</span><b>${brl(s.resumo.totalVendas)}</b></div>
        ${Number(s.resumo.totalSuprimentos)>0?`<div class="linha"><span>💰 Suprimentos</span><b style="color:#8fffc0">${brl(s.resumo.totalSuprimentos)}</b></div>`:""}
        <div class="linha"><span>💸 Sangrias</span><b style="color:${Number(s.resumo.totalSangrias)>0?'#ff8090':'#9a95c9'}">${brl(s.resumo.totalSangrias)}</b></div>
        <div class="linha"><span>Esperado na gaveta</span><b style="color:#ffd23f">${brl(s.resumo.esperadoGaveta)}</b></div>
        ${(s.resumo.porForma||[]).length?`<div style="margin-top:6px;border-top:1px solid #2a2660;padding-top:6px">
          <div class="muted" style="font-size:11px;margin-bottom:2px">Por forma de pagamento</div>
          ${s.resumo.porForma.map(f=>`<div class="linha" style="font-size:12px"><span>${esc(f.nome)} <span class="muted">(${f.qtd}x)</span></span><b>${brl(f.valor)}</b></div>`).join("")}
          ${totalPixForma(s.resumo.porForma)>0.009?`<div class="linha" style="font-size:12px;border-top:1px dashed #2a2660;margin-top:3px;padding-top:3px"><span>🔷 Total PIX</span><b style="color:#7fd4ff">${brl(totalPixForma(s.resumo.porForma))}</b></div>`:""}
        </div>`:""}
        <button class="btn btn-mag btn-sm" style="width:100%;margin-top:8px" onclick="conferirCaixa('${s.id}')">🧮 Conferir caixa (contar e comparar)</button>
        <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:6px" onclick="imprimirRelatorioCaixa('${s.id}')">🖨️ Imprimir relatório</button>
        <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:6px" onclick="verMovimentos('${s.id}')">📋 Ver histórico completo</button>
      </div>`).join("") : '<div class="card"><div class="muted">Nenhum caixa aberto no momento.</div></div>';
  }catch(e){ box.innerHTML=`<div class="err">Erro ao carregar os caixas abertos.</div>`; }
}

window.carregarHistorico=async function(){
  const box=document.getElementById("conteudo");
  try{
    const j=await fetch(B+"/api/caixa-sessao/historico").then(r=>r.json());
    const lista=filtrarTipo(j.data||[]);
    box.innerHTML = lista.length ? lista.map(s=>`
      <div class="card">
        <div style="font-size:12px;color:#9a95c9;margin-bottom:6px">🕐 ${hora(s.abertaEm)} → ${hora(s.fechadaEm)} · 👤 ${esc(s.operador||"—")} ${tagTipo(s.tipoCaixa)}</div>
        <div class="linha"><span>Vendas (${s.resumo.qtdVendas})</span><b>${brl(s.resumo.totalVendas)}</b></div>
        ${(s.resumo.porForma||[]).length?s.resumo.porForma.map(f=>`<div class="linha" style="font-size:12px"><span>${esc(f.nome)} <span class="muted">(${f.qtd}x)</span></span><b>${brl(f.valor)}</b></div>`).join(""):""}
        ${totalPixForma(s.resumo.porForma)>0.009?`<div class="linha" style="font-size:12px"><span>🔷 Total PIX</span><b style="color:#7fd4ff">${brl(totalPixForma(s.resumo.porForma))}</b></div>`:""}
        ${Number(s.resumo.totalSuprimentos)>0?`<div class="linha" style="font-size:12px"><span>💰 Suprimentos</span><b style="color:#8fffc0">${brl(s.resumo.totalSuprimentos)}</b></div>`:""}
        <div class="linha" style="font-size:12px"><span>💸 Sangrias</span><b style="color:${Number(s.resumo.totalSangrias)>0?'#ff8090':'#9a95c9'}">${brl(s.resumo.totalSangrias)}</b></div>
        <div class="linha" style="border-top:1px solid #2a2660;padding-top:6px;margin-top:4px"><span>Esperado</span><b>${brl(s.fechamento?.esperado)}</b></div>
        <div class="linha"><span>Contado</span><b>${brl(s.fechamento?.valorContado)}</b></div>
        <div class="linha"><span>Diferença</span>
          <b style="color:${Math.abs(s.fechamento?.diferenca||0)<0.01?'#8fffc0':((s.fechamento?.diferenca||0)>0?'#ffd23f':'#ff8090')}">${brl(s.fechamento?.diferenca)}</b></div>
        ${s.fechamento?.observacao?`<div class="muted" style="margin-top:6px">obs: ${esc(s.fechamento.observacao)}</div>`:""}
        <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px" onclick="imprimirRelatorioCaixa('${s.id}')">🖨️ Imprimir relatório</button>
        <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:6px" onclick="verMovimentos('${s.id}')">📋 Ver histórico completo</button>
      </div>`).join("") : '<div class="card"><div class="muted">Nenhum caixa fechado ainda.</div></div>';
  }catch(e){ box.innerHTML=`<div class="err">Erro ao carregar o histórico.</div>`; }
}

window.nomeMovimento=function(m){
  if(m.tipo==="venda") return `🛒 Venda #${esc(m.numero||m.pedidoId)} — ${brl(m.total)}${m.clienteNome?` <span class="muted" style="font-size:11px">(${esc(m.clienteNome)})</span>`:""}<div style="font-size:11px;color:#9a95c9;margin-top:2px">${(m.pagamentos||[]).map(p=>esc(p.formaNome)+": "+brl(p.valor)).join(" · ")}</div>`;
  if(m.tipo==="sangria") return `💸 Sangria — ${brl(m.valor)}${m.motivo?" ("+esc(m.motivo)+")":""}`;
  if(m.tipo==="suprimento") return `💰 Suprimento — ${brl(m.valor)}${m.motivo?" ("+esc(m.motivo)+")":""}`;
  return esc(m.tipo);
}

window.verMovimentos=async function(id){
  document.getElementById("modais").innerHTML=`<div class="modalBg"><div class="modal"><div class="muted">Carregando…</div></div></div>`;
  try{
    const j=await fetch(B+"/api/caixa-sessao/"+id+"/movimentos").then(r=>r.json());
    const movs=j.movimentos||[];
    window._GMOVS={id, movs};
    document.getElementById("modais").innerHTML=`
      <div class="modalBg" onclick="if(event.target===this)fecharModais()">
        <div class="modal">
          <h3>📋 Movimentos — ${esc(j.sessao?.operador||"")}</h3>
          <div class="muted" style="font-size:12px;margin-bottom:8px">Troco inicial: ${brl(j.sessao?.trocoInicial)} · Aberto: ${hora(j.sessao?.abertaEm)}${j.sessao?.fechadaEm?" · Fechado: "+hora(j.sessao.fechadaEm):""}</div>
          ${movs.length?movs.map((m,ix)=>`
            <div style="padding:8px 0;border-bottom:1px solid #2a2660;font-size:13px">
              <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
                <div style="flex:1">${nomeMovimento(m)}${m.alterado?' <span style="color:#ff8090;font-size:11px">✏️ alterado</span>':''}</div>
                <button class="btn btn-ghost btn-sm" style="padding:2px 7px" title="Imprimir" onclick="imprimirMovimento(${ix})">🖨️</button>
              </div>
              <div class="muted" style="font-size:11px">${hora(m.em)}</div>
              ${(m.tipo==="venda"&&!m.cancelado)?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">
                <button class="btn btn-ghost btn-sm" style="padding:3px 8px" onclick="editarPagamentoVenda(${ix})">✏️ Mudar forma de pagamento</button>
                <button class="btn btn-ghost btn-sm" style="padding:3px 8px" onclick="editarItensVenda(${ix})">📦 Editar itens</button>
                <button class="btn btn-sm" style="padding:3px 8px;background:#b3341f;color:#fff" onclick="cancelarVendaGestao(${ix})">🚫 Cancelar venda</button>
              </div>`:''}
              ${(m.tipo==="venda"&&m.cancelado)?'<div style="color:#ff8090;font-size:11px;margin-top:4px">🚫 Venda cancelada</div>':''}
            </div>`).join(""):'<div class="muted">Nenhum movimento ainda.</div>'}
          <div class="card" style="background:#1c1846;margin:12px 0">
            ${(j.resumo?.porForma||[]).length?`<div style="margin-bottom:8px">
              <div style="font-weight:800;margin-bottom:4px">💳 Total por forma de pagamento</div>
              <div class="linha"><span>Vendas (${j.resumo.qtdVendas||0})</span><b>${brl(j.resumo.totalVendas)}</b></div>
              ${j.resumo.porForma.map(f=>`<div class="linha" style="font-size:13px"><span>${esc(f.nome)} <span class="muted">(${f.qtd}x)</span></span><b>${brl(f.valor)}</b></div>`).join("")}
              ${totalPixForma(j.resumo.porForma)>0.009?`<div class="linha" style="font-size:13px;border-top:1px dashed #2a2660;margin-top:3px;padding-top:3px"><span>🔷 Total PIX</span><b style="color:#7fd4ff">${brl(totalPixForma(j.resumo.porForma))}</b></div>`:""}
            </div>`:""}
            ${Number(j.resumo?.totalSuprimentos)>0?`<div class="linha"><span>💰 Suprimentos</span><b style="color:#8fffc0">${brl(j.resumo.totalSuprimentos)}</b></div>`:""}
            <div class="linha"><span>💸 Sangrias</span><b style="color:${Number(j.resumo?.totalSangrias)>0?'#ff8090':'#9a95c9'}">${brl(j.resumo?.totalSangrias)}</b></div>
            <div class="linha"><span>Esperado na gaveta</span><b style="color:#ffd23f">${brl(j.resumo?.esperadoGaveta)}</b></div>
            ${j.fechamento?`<div class="linha"><span>Contado</span><b>${brl(j.fechamento.valorContado)}</b></div>
            <div class="linha"><span>Diferença</span><b style="color:${Math.abs(j.fechamento.diferenca)<0.01?'#8fffc0':(j.fechamento.diferenca>0?'#ffd23f':'#ff8090')}">${brl(j.fechamento.diferenca)}</b></div>`:""}
          </div>
          <button class="btn btn-ghost" style="width:100%" onclick="fecharModais()">Fechar</button>
        </div>
      </div>`;
  }catch(e){ document.getElementById("modais").innerHTML=`<div class="modalBg" onclick="fecharModais()"><div class="modal"><div class="err">Erro ao carregar</div></div></div>`; }
}

// ---- CONFERÊNCIA DE CAIXA: contar por forma + dinheiro na gaveta e comparar ----
window.conferirCaixa=async function(id){
  document.getElementById("modais").innerHTML=`<div class="modalBg"><div class="modal"><div class="muted">Carregando…</div></div></div>`;
  try{
    const j=await fetch(B+"/api/caixa-sessao/"+id+"/movimentos").then(r=>r.json());
    if(j.erro) throw new Error(j.erro);
    const r=j.resumo||{};
    window._CONF={
      id,
      formas:(r.porForma||[]).map(f=>({nome:f.nome,esperado:Number(f.valor)||0})),
      esperadoGaveta:Number(r.esperadoGaveta||0),
      esperadoGavetaCalc:Number(r.esperadoGavetaCalc!=null?r.esperadoGavetaCalc:(r.esperadoGaveta||0)),
      esperadoGavetaManual:(r.esperadoGavetaManual!=null?Number(r.esperadoGavetaManual):null),
      operador:j.sessao?.operador||"",
    };
    renderConferencia();
  }catch(e){ document.getElementById("modais").innerHTML=`<div class="modalBg" onclick="fecharModais()"><div class="modal"><div class="err">Erro ao abrir a conferência: ${esc(e.message)}</div><button class="btn btn-ghost" style="width:100%;margin-top:10px" onclick="fecharModais()">Fechar</button></div></div>`; }
}
function linhaConf(ix,f){
  return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
    <div style="flex:1;min-width:0">
      <div style="font-weight:700;font-size:13px">${esc(f.nome)}</div>
      <div class="muted" style="font-size:11px">Esperado: ${brl(f.esperado)}</div>
    </div>
    <input id="conf_${ix}" inputmode="decimal" placeholder="Contado" style="width:104px;text-align:right" oninput="recalcConf()">
    <div id="dif_${ix}" style="width:96px;text-align:right;font-size:12px;font-weight:700;color:#9a95c9">—</div>
  </div>`;
}
window.renderConferencia=function(){
  const C=window._CONF; if(!C) return;
  const temManual=C.esperadoGavetaManual!=null;
  document.getElementById("modais").innerHTML=`
    <div class="modalBg" onclick="if(event.target===this)fecharModais()"><div class="modal">
      <h3>🧮 Conferir caixa — ${esc(C.operador||"")}</h3>
      <div class="muted" style="font-size:12px;margin-bottom:10px">Digite quanto tem de verdade em cada forma e o dinheiro na gaveta. A diferença aparece do lado (verde = bateu, amarelo = sobra, vermelho = falta).</div>
      <div style="font-weight:800;margin-bottom:6px">💳 Formas de pagamento</div>
      ${C.formas.length?C.formas.map((f,ix)=>linhaConf(ix,f)).join(""):'<div class="muted" style="margin-bottom:8px">Nenhuma venda por forma ainda.</div>'}
      <div style="border-top:1px solid #2a2660;margin:10px 0;padding-top:10px">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:13px">💵 Dinheiro na gaveta</div>
            <div class="muted" style="font-size:11px">Esperado: <b style="color:#ffd23f">${brl(C.esperadoGaveta)}</b>${temManual?' <span style="color:#ff9fd0">(ajuste manual)</span>':""} · <a href="#" onclick="editarEsperado(event)" style="color:#7fd4ff">editar</a></div>
            ${temManual?`<div class="muted" style="font-size:10px">Calculado: ${brl(C.esperadoGavetaCalc)}</div>`:""}
          </div>
          <input id="conf_gaveta" inputmode="decimal" placeholder="Contado" style="width:104px;text-align:right" oninput="recalcConf()">
          <div id="dif_gaveta" style="width:96px;text-align:right;font-size:12px;font-weight:700;color:#9a95c9">—</div>
        </div>
      </div>
      <div class="card" style="background:#1c1846;margin:12px 0"><div class="linha"><span><b>Diferença total</b></span><b id="dif_total" style="color:#9a95c9">—</b></div></div>
      <input id="conf_obs" placeholder="Observação (opcional)" style="width:100%;margin-bottom:10px">
      <div id="confMsg"></div>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <button class="btn btn-mag" style="flex:1" onclick="salvarConferencia()">💾 Salvar conferência</button>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn" style="flex:1;background:#b3341f;color:#fff" onclick="fecharCaixaGestao()">🔒 Fechar caixa</button>

window.fecharCaixaGestao=async function(){

    if(j.erro){ if(msg) msg.innerHTML=`<div class="err">${esc(j.erro)}</div>`; return; }
    fecharModais();
    if(typeof carregarAbertos==="function") carregarAbertos();

}

window.recalcConf=function(){
  const C=window._CONF; if(!C) return;
  let total=0;
  const cor=(dif,vazio)=>vazio?"#9a95c9":(Math.abs(dif)<0.01?"#8fffc0":(dif>0?"#ffd23f":"#ff8090"));
  C.formas.forEach((f,ix)=>{
    const campo=document.getElementById("conf_"+ix);
    const vazio=((campo?.value)||"").trim()==="";
    const dif=+(numBR(campo?.value)-f.esperado).toFixed(2);
    if(!vazio) total+=dif;
    const el=document.getElementById("dif_"+ix);
    if(el){ el.textContent=vazio?"—":brl(dif); el.style.color=cor(dif,vazio); }
  });
  const cg=document.getElementById("conf_gaveta");
  const gvazio=((cg?.value)||"").trim()==="";
  const difG=+(numBR(cg?.value)-C.esperadoGaveta).toFixed(2);
  if(!gvazio) total+=difG;
  const elg=document.getElementById("dif_gaveta");
  if(elg){ elg.textContent=gvazio?"—":brl(difG); elg.style.color=cor(difG,gvazio); }
  const elt=document.getElementById("dif_total");
  if(elt){ elt.textContent=brl(total); elt.style.color=(Math.abs(total)<0.01?"#8fffc0":(total>0?"#ffd23f":"#ff8090")); }
}
window.salvarConferencia=async function(){
  const C=window._CONF; if(!C) return;
  const contagem=C.formas.map((f,ix)=>({nome:f.nome,contado:numBR(document.getElementById("conf_"+ix)?.value)}));
  const contadoGaveta=numBR(document.getElementById("conf_gaveta")?.value);
  const observacao=(document.getElementById("conf_obs")?.value||"").trim();
  const msg=document.getElementById("confMsg");
  try{
    const r=await fetch(B+"/api/caixa-sessao/"+C.id+"/conferencia",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contagem,contadoGaveta,observacao,operador:(window.GESTOR&&window.GESTOR.nome)||"",funcionarioId:(window.GESTOR&&window.GESTOR.id)||""})}).then(r=>r.json());
    if(r.erro) throw new Error(r.erro);

    document.getElementById("modais").innerHTML=`
      <div class="modalBg" onclick="fecharModais()"><div class="modal" style="text-align:center">

        <div class="${Math.abs(dt)<0.01?'muted':'err'}" style="margin-top:6px">Diferença total: <b>${brl(dt)}</b>${Math.abs(dt)<0.01?' — bateu certinho!':''}</div>
        <button class="btn btn-mag" style="width:100%;margin-top:14px" onclick="fecharModais()">OK</button>
      </div></div>`;
  }catch(e){ if(msg) msg.innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}
// ---- editar (ajustar) o esperado na gaveta ----
window.editarEsperado=function(ev){
  if(ev&&ev.preventDefault) ev.preventDefault();
  const C=window._CONF; if(!C) return;
  const atual=C.esperadoGavetaManual!=null?C.esperadoGavetaManual:C.esperadoGaveta;
  const v=prompt("Esperado na gaveta (dinheiro).\nDeixe vazio pra voltar ao calculado ("+brl(C.esperadoGavetaCalc)+"):", String(atual));
  if(v===null) return; // cancelou
  const limpar=(String(v).trim()==="");
  fetch(B+"/api/caixa-sessao/"+C.id+"/esperado",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({esperado:numBR(v),limpar,operador:(window.GESTOR&&window.GESTOR.nome)||"",funcionarioId:(window.GESTOR&&window.GESTOR.id)||""})}).then(r=>r.json()).then(r=>{
    if(r.erro){ alert(r.erro); return; }
    const rr=r.resumo||{};
    C.esperadoGaveta=Number(rr.esperadoGaveta||0);
    C.esperadoGavetaCalc=Number(rr.esperadoGavetaCalc!=null?rr.esperadoGavetaCalc:(rr.esperadoGaveta||0));
    C.esperadoGavetaManual=(rr.esperadoGavetaManual!=null?Number(rr.esperadoGavetaManual):null);
    renderConferencia();
    recalcConf();
  }).catch(e=>alert("Erro: "+e.message));
}

window.removerBanco=function(ix){
  const S=window._BANCOS;
  S.bancos.splice(ix,1);

}

    <div style="font-weight:900;font-size:16px">B13 BEBIDAS</div>
    ${corpo}
    ${hist}

}

window.editarItensVenda=function(ix){
  const G=window._GMOVS; if(!G) return;
  const m=G.movs[ix]; if(!m) return;
  window._GITENS={ pedidoId:m.pedidoId, numero:m.numero||m.pedidoId,
    itens:(m.itens||[]).map(i=>({produtoId:i.produtoId,nome:i.nome,quantidade:Number(i.quantidade)||0,valor:Number(i.valor)||0})),
    frete:Number(m.frete)||0, buscas:[] };
  renderEditorItens();
}
window.totalEditorItens=function totalEditorItens(){ const E=window._GITENS; return E?+((E.itens.reduce((s,i)=>s+i.quantidade*i.valor,0))+(E.frete||0)).toFixed(2):0; }
window.renderEditorItens=function renderEditorItens(){
  const E=window._GITENS; if(!E) return;
  const linhas=E.itens.map((i,k)=>`
    <div style="display:flex;gap:6px;align-items:center;border-bottom:1px solid #2a2660;padding:6px 0">
      <div style="flex:1;font-size:13px">${esc(i.nome||("produto "+i.produtoId))}</div>
      <input type="number" min="0" step="1" value="${i.quantidade}" style="width:56px" onchange="window._GITENS.itens[${k}].quantidade=Number(this.value)||0;renderEditorItens()">
      <span class="muted" style="font-size:11px">×</span>
      <input type="number" min="0" step="0.01" value="${i.valor}" style="width:74px" onchange="window._GITENS.itens[${k}].valor=Number(this.value)||0;renderEditorItens()">
      <button class="btn btn-sm" style="background:#b3341f;color:#fff;padding:2px 7px" onclick="window._GITENS.itens.splice(${k},1);renderEditorItens()">🗑</button>
    </div>`).join("");
  const res=(E.buscas||[]).map((p,k)=>`<button class="btn btn-ghost btn-sm" style="width:100%;text-align:left;margin-top:4px" onclick="addItemEditorIdx(${k})">➕ ${esc(p.nome)}${p.codigo?' <span class="muted">#'+esc(String(p.codigo))+'</span>':''}${p.estoque!=null?' · est '+p.estoque:''}</button>`).join("");
  document.getElementById("modais").innerHTML=`
    <div class="modalBg" onclick="if(event.target===this)fecharModais()"><div class="modal">
      <h3>📦 Editar itens — #${esc(E.numero)}</h3>
      <div class="muted" style="font-size:12px;margin-bottom:6px">O Bling é a fonte de estoque/fiscal. Mudanças aqui vão pro Bling e pro histórico do caixa.</div>
      <div style="max-height:34vh;overflow:auto">${linhas||'<div class="muted">Sem itens.</div>'}</div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;font-weight:800">
        <span>Total${E.frete?" (com frete "+brl(E.frete)+")":""}</span><span style="color:#ffd23f">${brl(totalEditorItens())}</span>
      </div>
      <div style="margin-top:10px">
        <input id="buscaItemEditor" placeholder="Adicionar produto (nome)…" onkeydown="if(event.key==='Enter'){event.preventDefault();buscarItemEditor();}">
        <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:4px" onclick="buscarItemEditor()">🔎 Buscar produto</button>
        <div id="resBuscaItem">${res}</div>
      </div>
      <div id="msgEditorItens"></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-mag" style="flex:1" onclick="salvarItensVenda()">💾 Salvar itens</button>
        <button class="btn btn-ghost" onclick="fecharModais()">Cancelar</button>
      </div>
    </div></div>`;
}
window.buscarItemEditor=async function buscarItemEditor(){
  const msg=document.getElementById("msgEditorItens");
  const box=document.getElementById("resBuscaItem");
  try{
    if(!window._GITENS){ if(msg) msg.innerHTML='<div class="err">Editor não iniciado — reabra "Editar itens".</div>'; return; }
    const el=document.getElementById("buscaItemEditor"); const termo=(el?el.value:"").trim();
    if(termo.length<2){ if(msg) msg.innerHTML='<div class="muted">Digite ao menos 2 letras.</div>'; return; }
    if(msg) msg.innerHTML='<div class="muted">Buscando "'+esc(termo)+'"…</div>';
    const resp=await fetch(B+"/api/buscar?nome="+encodeURIComponent(termo));
    if(!resp.ok){ if(msg) msg.innerHTML='<div class="err">Erro HTTP '+resp.status+' na busca.</div>'; return; }
    const j=await resp.json();
    if(j&&j.erro) throw new Error(j.erro);
    const lista=(j.data||[]).slice(0,12).map(p=>({id:p.id,nome:p.nome,codigo:p.codigo,estoque:p.estoque}));
    window._GITENS.buscas=lista;
    if(box) box.innerHTML = lista.length
      ? lista.map((p,k)=>`<button class="btn btn-ghost btn-sm" style="width:100%;text-align:left;margin-top:4px" onclick="addItemEditorIdx(${k})">➕ ${esc(p.nome)}${p.codigo?' <span class="muted">#'+esc(String(p.codigo))+'</span>':''}${p.estoque!=null?' · est '+p.estoque:''}</button>`).join("")
      : "";
    if(msg) msg.innerHTML = lista.length
      ? '<div class="muted">'+lista.length+' produto(s) — toque pra adicionar.</div>'
      : '<div class="muted">Nada encontrado pra "'+esc(termo)+'".</div>';
  }catch(e){ if(msg) msg.innerHTML='<div class="err">Falha na busca: '+esc(e.message||String(e))+'</div>'; }
}
window.addItemEditorIdx=async function(k){
  const E=window._GITENS; if(!E) return;
  const p=(E.buscas||[])[k]; if(!p) return;
  let preco=0;
  if(p.codigo){ try{ const r=await fetch(B+"/api/preco/gtin/"+encodeURIComponent(p.codigo)).then(r=>r.json()); if(r&&r.data&&Number(r.data.preco)>0) preco=Number(r.data.preco); }catch(e){} }
  const existe=E.itens.find(i=>String(i.produtoId)===String(p.id));
  if(existe){ existe.quantidade+=1; }
  else E.itens.push({produtoId:p.id,nome:p.nome,quantidade:1,valor:preco});
  E.buscas=[]; renderEditorItens();
}
window.salvarItensVenda=async function salvarItensVenda(){
  const E=window._GITENS; if(!E) return;
  const msg=document.getElementById("msgEditorItens");
  const itens=E.itens.filter(i=>i.produtoId&&i.quantidade>0);
  if(!itens.length){ if(msg) msg.innerHTML='<div class="err">Deixe ao menos um item.</div>'; return; }
  if(!confirm(`Salvar os itens do pedido #${E.numero}?\n\nNovo total: ${brl(totalEditorItens())}\n\nIsso altera o pedido no Bling (estoque) e registra no histórico do caixa.`)) return;
  if(msg) msg.innerHTML='<div class="muted">Salvando…</div>';
  try{
    const r=await fetch(B+"/api/gestao/editar-itens-venda",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({pedidoId:E.pedidoId, itens, operador:(window.GESTOR&&window.GESTOR.nome)||"Gestão"})}).then(r=>r.json());
    if(r.erro) throw new Error(r.erro);
    const avisoBling = r.blingOk===false
      ? `<div style="margin-top:10px;padding:8px;background:#3a2a0a;border:1px solid #6b5a1f;border-radius:8px;font-size:12px;color:#ffd23f">⚠️ Registrado no histórico do caixa, mas o <b>Bling não foi atualizado</b>: ${esc(r.blingErro||"erro")}.<br>Ajuste o pedido/estoque no Bling manualmente.</div>`
      : "";
    document.getElementById("modais").innerHTML=`
      <div class="modalBg" onclick="fecharModais()"><div class="modal" style="text-align:center">
        <div style="font-size:42px">${r.blingOk===false?"⚠️":"✅"}</div><h3>Itens atualizados</h3>
        <div class="muted" style="margin-top:8px">Pedido #${esc(E.numero)} · novo total ${brl(r.novoTotal)}</div>
        ${avisoBling}
        <button class="btn btn-mag" style="width:100%;margin-top:14px" onclick="fecharModais();render()">OK</button>
      </div></div>`;
  }catch(e){ if(msg) msg.innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

window.cancelarVendaGestao=async function(ix){
  const G=window._GMOVS; if(!G) return;
  const m=G.movs[ix]; if(!m) return;
  const motivo=prompt(`Cancelar a venda #${m.numero||m.pedidoId} (${brl(m.total)})?\n\nIsso move o pedido pra CANCELADO no Bling e tira do total do caixa.\nMotivo (opcional):`);
  if(motivo===null) return;
  try{
    const r=await fetch(B+"/api/gestao/cancelar-venda",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({pedidoId:m.pedidoId, operador:(window.GESTOR&&window.GESTOR.nome)||"Gestão", motivo})}).then(r=>r.json());
    if(r.erro) throw new Error(r.erro);
    const avisoBling = r.blingOk===false
      ? `<div style="margin-top:10px;padding:8px;background:#3a2a0a;border:1px solid #6b5a1f;border-radius:8px;font-size:12px;color:#ffd23f">⚠️ Registrado no histórico do caixa, mas o <b>Bling não foi atualizado</b>: ${esc(r.blingErro||"erro")}.<br>Cancele o pedido no Bling manualmente.</div>`
      : "";
    document.getElementById("modais").innerHTML=`
      <div class="modalBg" onclick="fecharModais()"><div class="modal" style="text-align:center">
        <div style="font-size:42px">${r.blingOk===false?"⚠️":"🚫"}</div><h3>Venda cancelada</h3>
        <div class="muted" style="margin-top:8px">Pedido #${esc(r.numero||m.numero||m.pedidoId)} cancelado.</div>
        ${avisoBling}
        <button class="btn btn-mag" style="width:100%;margin-top:14px" onclick="fecharModais();render()">OK</button>
      </div></div>`;
  }catch(e){ alert("Erro ao cancelar: "+e.message); }
}

window.editarPagamentoVenda=async function(ix){
  const G=window._GMOVS; if(!G) return;
  const m=G.movs[ix]; if(!m) return;
  const formas=await carregarFormasGestao();
  if(!formas.length){ alert("Não consegui carregar as formas de pagamento."); return; }
  const acha=(nome)=>{ const f=formas.find(x=>String(x.nome).toLowerCase()===String(nome||"").toLowerCase()) || formas.find(x=>/pix/i.test(x.nome)&&/pix/i.test(nome||"")); return f?f.id:formas[0].id; };
  const base=(m.pagamentos&&m.pagamentos.length)?m.pagamentos:[{formaNome:"",valor:m.total||0}];
  window._GEDIT={ pedidoId:m.pedidoId, numero:m.numero||m.pedidoId,
    linhas:base.map(p=>({formaId:acha(p.formaNome),valor:Number(p.valor)||0})), formas };
  renderEditorPagamento();
}
window.renderEditorPagamento=function(){
  const E=window._GEDIT; if(!E) return;
  const opt=(sel)=>E.formas.map(f=>`<option value="${f.id}" ${String(f.id)===String(sel)?"selected":""}>${esc(f.nome)}</option>`).join("");
  document.getElementById("modais").innerHTML=`
    <div class="modalBg" onclick="if(event.target===this)fecharModais()"><div class="modal">
      <h3>✏️ Mudar forma de pagamento — #${esc(E.numero)}</h3>
      <div class="muted" style="font-size:12px;margin-bottom:10px">Ajuste a forma (e o valor, se precisar) de cada pagamento. A alteração vai pro Bling e fica registrada no histórico (em vermelho).</div>
      ${E.linhas.map((l,i)=>`<div style="display:flex;gap:6px;margin-bottom:6px;align-items:center">
        <select style="flex:1" onchange="_GEDIT.linhas[${i}].formaId=this.value">${opt(l.formaId)}</select>
        <input type="number" step="0.01" value="${l.valor}" style="width:100px;text-align:right" onchange="_GEDIT.linhas[${i}].valor=+this.value||0">
        <button class="btn btn-ghost btn-sm" style="padding:3px 8px;color:#ff8090" onclick="_GEDIT.linhas.splice(${i},1);renderEditorPagamento()">🗑</button>
      </div>`).join("")}
      <button class="btn btn-ghost btn-sm" style="margin-bottom:10px" onclick="_GEDIT.linhas.push({formaId:_GEDIT.formas[0].id,valor:0});renderEditorPagamento()">+ Adicionar forma</button>
      <div id="editMsg"></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-mag" style="flex:1" onclick="salvarEditPagamentoGestao()">💾 Salvar</button>
        <button class="btn btn-ghost" onclick="fecharModais()">Cancelar</button>
      </div>
    </div></div>`;
}
window.salvarEditPagamentoGestao=async function(){
  const E=window._GEDIT; if(!E) return;
  const msg=document.getElementById("editMsg");
  const linhas=E.linhas.filter(l=>l.formaId&&Number(l.valor)>0).map(l=>{
    const f=E.formas.find(x=>String(x.id)===String(l.formaId));
    return {formaId:l.formaId, formaNome:f?f.nome:"", valor:Number(l.valor)};
  });
  if(!linhas.length){ if(msg) msg.innerHTML='<div class="err">Informe ao menos uma forma com valor.</div>'; return; }
  try{
    const r=await fetch(B+"/api/gestao/editar-pagamento-venda",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({pedidoId:E.pedidoId,numero:E.numero,pagamentos:linhas,operador:(window.GESTOR&&window.GESTOR.nome)||"Gestão",funcionarioId:(window.GESTOR&&window.GESTOR.id)||""})}).then(r=>r.json());
    if(r.erro) throw new Error(r.erro);
    const avisoBling = r.blingOk===false
      ? `<div style="margin-top:10px;padding:8px;background:#3a2a0a;border:1px solid #6b5a1f;border-radius:8px;font-size:12px;color:#ffd23f">⚠️ Registrado no histórico do caixa, mas o <b>Bling não foi atualizado</b>: ${esc(r.blingErro||"erro")}.<br>Ajuste o pedido/estoque no Bling manualmente.</div>`
      : "";
    document.getElementById("modais").innerHTML=`
      <div class="modalBg" onclick="fecharModais()"><div class="modal" style="text-align:center">
        <div style="font-size:42px">${r.blingOk===false?"⚠️":"✅"}</div><h3>Forma de pagamento alterada</h3>
        <div class="muted" style="text-align:left;margin-top:8px">Pedido #${esc(r.numero||E.numero)}<br>De: ${esc(r.de||"—")}<br>Para: ${esc(r.para||"—")}</div>
        ${avisoBling}
        <button class="btn btn-mag" style="width:100%;margin-top:14px" onclick="fecharModais();render()">OK</button>
      </div></div>`;
  }catch(e){ if(msg) msg.innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

render();
}
</script>
