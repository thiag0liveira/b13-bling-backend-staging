<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
  :root{--mag:#FF0082;--bg:#0f0d24}
  body{background:var(--bg);color:#fff}
  #app{max-width:1200px;margin:0 auto;min-height:100vh}

  .faixa{border-left:5px solid #514c96;background:#12102b;border-radius:0 14px 14px 0;
         padding:10px 12px;margin-bottom:16px;box-shadow:0 2px 0 rgba(0,0,0,.35)}

            text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;cursor:pointer;user-select:none}
  .faixa.fechada{padding:8px 12px;margin-bottom:8px;opacity:.85}
  .faixa.fechada .faixaTit{margin-bottom:0}
  .faixaCards{flex-wrap:wrap}
  .faixaQtd{color:#000;border-radius:20px;font-size:11px;font-weight:900;padding:1px 9px}
  .faixaCards{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;align-items:flex-start}

  .card.mini{padding:8px 10px;cursor:pointer}
  .card.mini:hover{border-color:#514c96}
  .sitMini{font-size:9px;font-weight:900;padding:2px 6px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
  .colTitulo{font-size:12px;font-weight:900;color:#9a95c9;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}

  .card.novo{border-color:#3ce88a;box-shadow:0 0 0 1px rgba(60,232,138,.3)}
  .card.aguard{border-color:#ffe600;box-shadow:0 0 0 1px rgba(255,230,0,.25)}

    0%,49%{background:#3a0010;border-color:#ff3b3b;box-shadow:0 0 14px rgba(255,59,59,.5)}

  @keyframes piscaTxt{0%,49%{background:#ff3b3b}50%,100%{background:#ff9c3b;color:#000}}
  .modal .it{display:flex;align-items:center;gap:8px;border-bottom:1px solid #2a2660;padding:6px 0}
  .modal .it input{width:70px;text-align:right;padding:5px}
  .rm{background:none;border:none;color:#ff8090;cursor:pointer;font-size:15px}
  .muted{color:#9a95c9;font-size:12px}
  .btn{border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:13px;padding:9px 12px;color:#fff;width:100%;margin-top:6px}
  .btn-mag{background:var(--mag)}.btn-ghost{background:#1c1846}.btn-wa{background:#1f8f4e}.btn-red{background:transparent;border:1px solid #b3341f;color:#ff8f7a}

  .btn-ok:hover{background:#228556}
  .btn-okOff{background:transparent;border:1px solid #3a6b52;color:#8fbfa5}
  .chip{display:inline-block;border-radius:8px;font-size:10px;font-weight:900;padding:3px 8px}
  .sit{background:#ffe600;color:#000;font-weight:900;padding:5px 8px;border-radius:6px;font-size:11px;display:inline-block;margin:6px 0}
  .ent{background:#29ABE2;color:#000}.ret{background:#FF0082;color:#fff}
  .abas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .aba{background:#1c1846;border:1px solid #514c96;border-radius:20px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer}
  .aba.on{background:var(--mag);border-color:var(--mag)}
  .modalBg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
  .modal{background:#151233;border:1px solid #2c2660;border-radius:16px;padding:18px;max-width:520px;width:100%;max-height:85vh;overflow:auto}
  input,textarea{background:#1c1846;border:1px solid #37327a;border-radius:8px;color:#fff;padding:9px;font-size:14px;width:100%}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid #514c96;border-top-color:#29ABE2;border-radius:50%;animation:girar .8s linear infinite}
  @keyframes girar{to{transform:rotate(360deg)}}
</style>

<script>const B = location.protocol.indexOf("http") === 0 ? "" : "https://b13-bling-backend-production.up.railway.app";
const S = (typeof b13GetSession === "function" ? b13GetSession() : {}) || {};
const esc = s => String(s !== null && s !== void 0 ? s : "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  if (!ms) return "";

  const mesmoDia = d.toDateString() === hoje.toDateString();
  const hh = d.toLocaleTimeString("pt-BR", {
    hour: "2-digit",
    minute: "2-digit"

    day: "2-digit",
    month: "2-digit"

let PEDIDOS = [],

async function buscarBlingProgressivo(qp) {
  try {
    const b = await fetch(B + "/api/pedidos-online?fase=bling" + (qp ? "&" + qp : "")).then(function (r) { return r.json(); });
    BLING_PRONTO = !!b.pronto;
    BLING_PROGRESSO = Number(b.progresso || 0);
    // junta locais + bling (sem duplicar por id)
    var ids = {};
    PEDIDOS_LOCAL.forEach(function (p) { ids[String(p.id)] = true; });
    var extras = (b.data || []).filter(function (p) { return !ids[String(p.id)]; });

      setTimeout(function () { buscarBlingProgressivo(qp); }, 2000); // repuxa até completar

      SIT_CARREGANDO = false;
      _blingTentativas = 0;
      render();
    }
  } catch (e) { SIT_CARREGANDO = false; }
}
let BUSCA_RES = null,
  BUSCANDO = false,
  SITUACOES = [],
  AGUARD_PAG = null;
let EXPANDIDO = {}; // pedidoId -> true (card aberto com todos os botões)

let FAIXAS_ABERTAS = function () {
  try {
    const g = JSON.parse(localStorage.getItem("b13pedFaixas") || "null");
    if (g) return g;
  } catch (e) {}
  return {
    novos: true
  };
}();
function alternarFaixa(k) {
  FAIXAS_ABERTAS[k] = !FAIXAS_ABERTAS[k];
  try {
    localStorage.setItem("b13pedFaixas", JSON.stringify(FAIXAS_ABERTAS));
  } catch (e) {}
  render();
}
function alternar(id) {
  EXPANDIDO[id] = !EXPANDIDO[id];
  render();
}
// Detecta pela SITUAÇÃO (id) — o nome varia conforme a origem ("Separado c/
// Pendências", "SEPARADO C/ PENDÊNCIAS", "Separação pendente"), e a busca por texto
// deixava passar algumas variações, fazendo o pedido sumir da faixa de pendências.
const SEP_PEND = typeof B13_SIT !== "undefined" && B13_SIT.SEP_PEND ? B13_SIT.SEP_PEND : 819227;
function ehPendencia(p) {
  if (Number(p.situacaoId) === Number(SEP_PEND)) return true;
  return /pend[êe]nc|pendente/i.test(String(p.situacao || ""));
}
async function carregar(silencioso) {
  if (!silencioso) {
    CARREGANDO = true;
    render();
  }
  try {
    var qp = (PERIODO_INI && PERIODO_FIM) ? ("ini=" + PERIODO_INI + "&fim=" + PERIODO_FIM) : "";
    // FASE 1 (instantânea): registro local. Mostra na hora.
    const j = await fetch(B + "/api/pedidos-online?fase=local" + (qp ? "&" + qp : "")).then(r => r.json());
    if (j.periodo) { if (!PERIODO_INI) PERIODO_INI = j.periodo.ini; if (!PERIODO_FIM) PERIODO_FIM = j.periodo.fim; }
    if (j.erro) throw new Error(j.erro);
    PEDIDOS_LOCAL = j.data || [];
    PEDIDOS = PEDIDOS_LOCAL.slice();
    SIT_CARREGANDO = true;
    CARREGANDO = false;
    render(); // já mostra os locais
    // FASE 2 (segundo plano): pedidos do Bling, vão chegando de hoje pra trás
    buscarBlingProgressivo(qp);
    try {
      const n = await fetch(B + "/api/pedidos-online/novos/" + encodeURIComponent(S.id)).then(r => r.json());
      VISTO_ATE = Number(n.vistoAte || 0); // tudo criado depois disso é "novo" pra este usuário

    if (!silencioso) alert("Erro ao carregar: " + e.message);
  }

  if (!AGUARD_PAG || Date.now() - (window._apEm || 0) > 180000) {
    try {
      const ap = await fetch(B + "/api/pedidos-online/aguardando-pagamento").then(r => r.json());
      if (!ap.erro) {
        AGUARD_PAG = ap;
        window._apEm = Date.now();

    } catch (e) {}
  }
  CARREGANDO = false;
  render();

const AGUARDANDO = typeof B13_SIT !== "undefined" && B13_SIT.AGUARDANDO ? B13_SIT.AGUARDANDO : 818795;
function ehAguardando(p) {
  return Number(p.situacaoId) === Number(AGUARDANDO);
}
const ATENDIDO = 9;
function ehAtendido(p) {
  return Number(p.situacaoId) === ATENDIDO;
}

// por padrão. A aba "Todos os status" mostra tudo.
function ehEmAndamento(p) {
  return !p.cancelado && !ehAtendido(p);
}
function ordenar(lista) {
  // pedido com PENDÊNCIA vai pro topo — é o que trava a entrega e precisa de ação
  return lista.slice().sort((a, b) => (ehPendencia(b) ? 1 : 0) - (ehPendencia(a) ? 1 : 0));
}
function visiveis() {
  if (BUSCA_RES) return BUSCA_RES; // resultado da busca tem prioridade
  if (FILTRO === "todos") return ordenar(PEDIDOS); // única aba que mostra Atendidos e Cancelados
  if (FILTRO === "entrega") return ordenar(PEDIDOS.filter(p => p.tipo === "entrega" && ehEmAndamento(p)));
  if (FILTRO === "retirada") return ordenar(PEDIDOS.filter(p => p.tipo === "retirada" && ehEmAndamento(p)));
  if (FILTRO === "online") return ordenar(PEDIDOS.filter(p => (p.origem === "totem" || p.origem === "site") && ehEmAndamento(p)));
  if (FILTRO === "atacado") return ordenar(PEDIDOS.filter(p => p.origem !== "totem" && p.origem !== "site" && ehEmAndamento(p)));
  if (FILTRO === "andamento") return ordenar(PEDIDOS.filter(ehEmAndamento));
  // padrão: aguardando separação (é o que precisa de ação)
  return ordenar(PEDIDOS.filter(p => ehAguardando(p) || ehPendencia(p)));
}
// versão MINIMIZADA do card: só o essencial. Clicar abre o card completo.
function ehDiaDaEntrega(p) {
  if (!p.agendamento || !p.agendamento.data) return false;

  return p.agendamento.data === hoje;
}
function cardMini(p) {
  const ehNovo = Number(p.criadoEm || 0) > VISTO_ATE;

  const pend = ehPendencia(p);
  const org = p.origem === "totem" ? "🖥️ Totem" : p.origem === "site" ? "🌐 Site" : "🧑‍💼 " + (p.vendedor || "Atacado");
  const cor = function () {
    if (pend) return null;
    if (p.ok) return {
      bg: "#0f2a1c",
      bd: "#2f9e6b"
    }; // OK: verde
    if (p.agendamento && !p.cancelado) return ehDiaDaEntrega(p) ? {
      bg: "#3a1a00",
      bd: "#ff8c00"
    } : {
      bg: "#0f2233",
      bd: "#29ABE2"
    }; // agendado: azul; HOJE é dia da entrega: laranja
    if (p.cancelado) return {
      bg: "#3a3210",
      bd: "#8a7a1f"
    };
    if (ehAtendido(p)) return {
      bg: "#12291f",
      bd: "#2f9e6b"
    };
    if (aguard) return {
      bg: "#2a2410",
      bd: "#ffe600"
    };
    const t = String(p.situacao || "").toLowerCase();
    if (t.indexOf("separa") >= 0) return {

    if (t.indexOf("rota") >= 0) return {
      bg: "#251438",

    return null;
  }();
  const est = pend ? "" : cor ? 'background:' + cor.bg + ';border-color:' + cor.bd + ';' : '';
  return '<div class="card mini' + (pend ? ' pend' : '') + (ehNovo ? ' novo' : '') + '" style="' + est + '" onclick="alternar(' + p.id + ')">' + '<div style="display:flex;justify-content:space-between;gap:6px;align-items:flex-start">' + '<span style="font-size:11px;font-weight:900;color:#9a95c9">' + esc(org) + '</span>' + '<span style="font-size:10px;color:#9a95c9">' + esc(dataHora(p.criadoEm)) + '</span>' + '</div>' + '<div style="font-weight:900;font-size:14px;margin-top:2px">#' + esc(p.numero) + (p.noSistema === false ? ' <span style="font-size:9px;font-weight:900;padding:1px 5px;border-radius:4px;background:#5a3a1a;color:#ffb86b">só Bling</span>' : '') + '</div>' + '<div style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(p.cliente) + '</div>' + '<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:4px">' + '<span class="sitMini" style="background:' + (pend ? "#ff3b3b" : cor ? cor.bd : "#2a2660") + ';color:' + ((p.cancelado || aguard) && !pend ? "#000" : "#fff") + '">' + esc((p.situacao || "—").toUpperCase().slice(0, 22)) + '</span>' + '<b style="color:#ffd23f;font-size:13px;white-space:nowrap">' + brl(p.total) + '</b>' + '</div>' + '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:3px">' + '<span style="font-size:10px;color:#9a95c9">' + (p.tipo === "entrega" ? "🛵 entrega" : "🏪 retirada") + (p.agendamento ? " · 📅 " + esc(p.agendamento.data.split("-").reverse().slice(0, 2).join("/")) : "") + '</span>' + '<span style="font-size:10px;color:#6b6699">▼ abrir</span>' + '</div>' + (p.ok ? '<div style="font-size:10px;color:#3ce88a;margin-top:2px">✅ OK' + (p.okPor ? " · " + esc(p.okPor) : "") + '</div>' : '') + '</div>';
}
function cardPedido(p) {
  if (!EXPANDIDO[p.id]) return cardMini(p);

// manda o pedido pra separação (Em separação) e pra fila da mesa, na ordem de envio
// UM botão só: o tipo (entrega/retirada) vem do próprio pedido, não da escolha do
// operador — assim a etiqueta da separação nunca sai diferente do que o pedido é.
async function enviarSeparacao(id) {
  const p = (BUSCA_RES || PEDIDOS).find(function (x) {
    return String(x.id) === String(id);
  });
  const tipo = p && p.tipo === "entrega" ? "ENTREGA" : "RETIRADA";
  if (!confirm("Mandar o pedido " + (p ? p.numero : id) + " pra separação?\n\nEle está como " + tipo + (p && p.agendamento ? " agendada para " + p.agendamento.data.split("-").reverse().join("/") : "") + ".")) return;
  try {
    const r = await fetch(B + "/api/mesa/enviar-separacao/" + id, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        funcionarioId: S.id
      })
    });
    const j = await r.json();
    if (j.erro) {
      alert(j.erro);
      // conflito de estado: recarrega pra tela refletir a situação real
      if (r.status === 409 || j.jaEnviado) recarregarAtual();
      return;
    }
    recarregarAtual();
  } catch (e) {
    alert("Erro: " + e.message);
  }
}

/* ===== BUSCA DE PEDIDO (acha até o que saiu da tela) ===== */
async function buscarPedido() {
  const el = document.getElementById("buscaPed");
  const termo = (el ? el.value : "").trim();
  window._buscaTxt = termo;
  if (!termo) {
    limparBusca();
    return;
  }
  // se já está na lista carregada, mostra na hora
  const local = PEDIDOS.filter(p => String(p.numero) === termo || String(p.id) === termo);
  if (local.length) {
    BUSCA_RES = local;
    render();
    return;
  }
  BUSCANDO = true;
  render();
  try {
    const j = await fetch(B + "/api/pedidos-online/buscar/" + encodeURIComponent(termo)).then(r => r.json());
    if (j.naoEncontrado || !(j.data || []).length) {
      BUSCA_RES = [];
      alert("Pedido " + termo + " não encontrado no Bling.");
    } else BUSCA_RES = j.data;
  } catch (e) {
    alert("Erro na busca: " + e.message);
  }
  BUSCANDO = false;
  render();
}
function limparBusca() {
  BUSCA_RES = null;

}
