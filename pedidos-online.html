<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B13 — Pedidos Totem/Site</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
  :root{--mag:#FF0082;--bg:#0f0d24}
  body{background:var(--bg);color:#fff}
  #app{max-width:1200px;margin:0 auto;min-height:100vh}
  .top{position:sticky;top:44px;z-index:20;background:linear-gradient(180deg,#2b2870,#262366);display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:3px solid var(--mag);flex-wrap:wrap}
  .top img{height:32px}.top .t{font-weight:900;font-size:16px}
  .wrap{padding:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .card{background:#151233;border:1px solid #2c2660;border-radius:14px;padding:12px}
  .card.novo{border-color:#3ce88a;box-shadow:0 0 0 1px rgba(60,232,138,.3)}
  .card.aguard{border-color:#ffe600;box-shadow:0 0 0 1px rgba(255,230,0,.25)}
  .modal .it{display:flex;align-items:center;gap:8px;border-bottom:1px solid #2a2660;padding:6px 0}
  .modal .it input{width:70px;text-align:right;padding:5px}
  .rm{background:none;border:none;color:#ff8090;cursor:pointer;font-size:15px}
  .muted{color:#9a95c9;font-size:12px}
  .btn{border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:13px;padding:9px 12px;color:#fff;width:100%;margin-top:6px}
  .btn-mag{background:var(--mag)}.btn-ghost{background:#1c1846}.btn-wa{background:#1f8f4e}.btn-red{background:transparent;border:1px solid #b3341f;color:#ff8f7a}
  .chip{display:inline-block;border-radius:8px;font-size:10px;font-weight:900;padding:3px 8px}
  .sit{background:#ffe600;color:#000;font-weight:900;padding:5px 8px;border-radius:6px;font-size:11px;display:inline-block;margin:6px 0}
  .ent{background:#29ABE2;color:#000}.ret{background:#FF0082;color:#fff}
  .abas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .aba{background:#1c1846;border:1px solid #514c96;border-radius:20px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer}
  .aba.on{background:var(--mag);border-color:var(--mag)}
  .modalBg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
  .modal{background:#151233;border:1px solid #2c2660;border-radius:16px;padding:18px;max-width:520px;width:100%;max-height:85vh;overflow:auto}
  input,textarea{background:#1c1846;border:1px solid #37327a;border-radius:8px;color:#fff;padding:9px;font-size:14px;width:100%}
</style>
<script src="/nav.js"></script>
<style>
  @media(min-width:900px){
    #b13nav{transform:translateX(0%) !important}
    button[onclick="b13ToggleNav()"]{display:none !important}
    body > *:not(#b13nav):not([onclick="b13ToggleNav()"]):not(#b13navOverlay):not(#b13topbar){ margin-left:200px }
  }

</head>
<body><script>
  (function(){
    if(typeof b13RequireLogin==="function" && !b13RequireLogin()) return;
    if(typeof b13BloquearSeSemAcesso==="function" && !b13BloquearSeSemAcesso("/pedidos-online")) return;
    document.addEventListener("DOMContentLoaded",function(){
      const nav=document.createElement("div"); nav.innerHTML=b13RenderNav("/pedidos-online");
      document.body.insertBefore(nav,document.body.firstChild);
    });
  })();
</script>
<div id="app"></div>
<div id="modais"></div>
<script>
const B=(location.protocol.indexOf("http")===0)?"":"https://b13-bling-backend-production.up.railway.app";
const S=(typeof b13GetSession==="function"?b13GetSession():{})||{};
const esc=(s)=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const brl=(v)=>"R$ "+(+v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const soDig=(s)=>String(s??"").replace(/\D/g,"");
// data/hora de criação do pedido (o backend manda em criadoEm)
function dataHora(ms){
  if(!ms) return "";
  const d=new Date(Number(ms));
  const hoje=new Date();
  const mesmoDia=d.toDateString()===hoje.toDateString();
  const hh=d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  return mesmoDia ? ("hoje "+hh) : (d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+hh);
}

let PEDIDOS=[], FILTRO="ativos", CARREGANDO=false, DIAS=7, VISTO_ATE=0, SIT_CARREGANDO=false;

async function carregar(silencioso){
  if(!silencioso){ CARREGANDO=true; render(); }
  try{
    const j=await fetch(B+"/api/pedidos-online?dias="+DIAS).then(r=>r.json());
    if(j.erro) throw new Error(j.erro);
    PEDIDOS=j.data||[]; SIT_CARREGANDO=!!j.situacoesCarregando;
    try{
      const n=await fetch(B+"/api/pedidos-online/novos/"+encodeURIComponent(S.id)).then(r=>r.json());
      VISTO_ATE=Number(n.vistoAte||0); // tudo criado depois disso é "novo" pra este usuário
    }catch(e){}
  }catch(e){ if(!silencioso) alert("Erro ao carregar: "+e.message); }
  CARREGANDO=false; render();
  // as situações vêm em 2º plano — recarrega em silêncio até completar
  if(SIT_CARREGANDO) setTimeout(function(){ carregar(true); }, 4000);
}
const AGUARDANDO=(typeof B13_SIT!=="undefined"&&B13_SIT.AGUARDANDO)?B13_SIT.AGUARDANDO:818795;
function ehAguardando(p){ return Number(p.situacaoId)===Number(AGUARDANDO); }
const ATENDIDO=9;
function ehAtendido(p){ return Number(p.situacaoId)===ATENDIDO; }
// pedido já concluído (Atendido) ou cancelado não precisa de ação — fica escondido
// por padrão. A aba "Todos os status" mostra tudo.
function ehEmAndamento(p){ return !p.cancelado && !ehAtendido(p); }
function visiveis(){
  if(FILTRO==="todos") return PEDIDOS; // única aba que mostra Atendidos e Cancelados
  if(FILTRO==="entrega") return PEDIDOS.filter(p=>p.tipo==="entrega"&&ehEmAndamento(p));
  if(FILTRO==="retirada") return PEDIDOS.filter(p=>p.tipo==="retirada"&&ehEmAndamento(p));
  if(FILTRO==="online") return PEDIDOS.filter(p=>(p.origem==="totem"||p.origem==="site")&&ehEmAndamento(p));
  if(FILTRO==="atacado") return PEDIDOS.filter(p=>p.origem!=="totem"&&p.origem!=="site"&&ehEmAndamento(p));
  if(FILTRO==="andamento") return PEDIDOS.filter(ehEmAndamento);
  // padrão: aguardando separação (é o que precisa de ação)
  return PEDIDOS.filter(p=>ehAguardando(p));
}
function cardPedido(p){
  const ehNovo=Number(p.criadoEm||0)>VISTO_ATE;
  const tel=soDig(p.telefone);
  const aguard=ehAguardando(p);
  const concluido=ehAtendido(p)||p.cancelado;
  const ehOnline=(p.origem==="totem"||p.origem==="site");
  const org=(p.origem==="totem")?"🖥️ Totem":((p.origem==="site")?"🌐 Site":"🧑‍💼 <b style=\"color:#cfc9f5\">"+esc(p.vendedor||"Venda Atacado")+"</b>");
  return '<div class="card'+(ehNovo?' novo':'')+(aguard?' aguard':'')+'"'+(concluido?' style="opacity:.65"':'')+'>'+
    '<div style="display:flex;justify-content:space-between;gap:6px;align-items:center;margin-bottom:2px">'+
      '<span class="muted" style="font-size:11px">'+org+'</span>'+
      '<span class="muted" style="font-size:11px">🕐 '+esc(dataHora(p.criadoEm))+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center">'+
      '<div style="font-weight:900;font-size:15px">Pedido '+esc(p.numero)+'</div>'+
      (ehNovo?'<span class="chip" style="background:#3ce88a;color:#000">NOVO</span>':'')+
    '</div>'+
    '<div class="sit"'+(p.situacao==="carregando…"?' style="background:#2a2660;color:#9a95c9"':'')+'>'+esc((p.situacao||"").toUpperCase())+'</div>'+
    '<div><span class="chip '+(p.tipo==="entrega"?"ent":"ret")+'">'+(p.tipo==="entrega"?"🛵 ENTREGA":"🏪 RETIRADA")+'</span></div>'+
    '<div class="muted" style="margin-top:6px">👤 '+esc(p.cliente)+'</div>'+
    (p.tipo==="entrega"&&p.endereco?'<div class="muted" style="font-size:11px;margin-top:2px">📍 '+esc(p.endereco)+'</div>':'')+
    (p.agendamento?'<div style="margin-top:4px"><span class="chip" style="background:#2f9e6b;color:#fff">📅 '+esc(p.agendamento.data.split("-").reverse().join("/"))+' · '+(p.agendamento.turno==="manha"?"MANHÃ":(p.agendamento.turno==="tarde"?"TARDE":"QUALQUER HORÁRIO"))+'</span></div>'+
      (p.agendamento.obsEntrega?'<div class="muted" style="font-size:11px;margin-top:3px">📝 '+esc(p.agendamento.obsEntrega)+'</div>':''):'')+
    (p.frete>0?'<div class="muted" style="font-size:11px">frete '+brl(p.frete)+'</div>':'')+
    '<div style="color:#ffd23f;font-weight:900;font-size:17px;margin-top:6px">'+brl(p.total)+'</div>'+
    '<div class="muted" style="font-size:11px;margin-top:4px">'+(p.itens||[]).length+' item(ns) · '+esc((p.itens||[]).slice(0,2).map(i=>i.quantidade+"x "+i.nome).join(", "))+((p.itens||[]).length>2?"…":"")+'</div>'+
    '<button class="btn btn-ghost" onclick="verDetalhe('+p.id+')">👁️ Ver itens</button>'+
    (aguard?'<button class="btn btn-mag" onclick="editarPedidoAguardando('+p.id+')">✏️ Editar</button>':'<button class="btn btn-ghost" onclick="editarNoCaixa(\''+esc(p.numero)+'\')">✏️ Editar no caixa</button>')+
    '<button class="btn btn-ghost" onclick="abrirTipoEntrega('+p.id+')">🛵 Entrega / Retirada</button>'+
    (p.tipo==="entrega"&&!p.cancelado?'<button class="btn '+(p.agendamento?"btn-ghost":"btn-mag")+'" onclick="abrirAgendar('+p.id+')">📅 '+(p.agendamento?"Reagendar entrega":"Agendar entrega")+'</button>':'')+
    '<button class="btn btn-wa" onclick="whats(\''+tel+'\',\''+esc(p.numero)+'\',\''+esc(String(p.cliente).replace(/'/g,""))+'\','+p.id+')">💬 WhatsApp</button>'+
    (!p.cancelado&&p.situacaoId!==9?'<button class="btn btn-red" onclick="cancelar('+p.id+',\''+esc(p.numero)+'\')">🚫 Cancelar</button>':'')+
  '</div>';
}
function render(){
  const app=document.getElementById("app");
  const lista=visiveis();
  const nEnt=PEDIDOS.filter(p=>p.tipo==="entrega"&&ehEmAndamento(p)).length, nRet=PEDIDOS.filter(p=>p.tipo==="retirada"&&ehEmAndamento(p)).length;
  const nAgu=PEDIDOS.filter(ehAguardando).length;
  const nOnline=PEDIDOS.filter(p=>(p.origem==="totem"||p.origem==="site")&&ehEmAndamento(p)).length;
  const nAtac=PEDIDOS.filter(p=>p.origem!=="totem"&&p.origem!=="site"&&ehEmAndamento(p)).length;
  const nAnd=PEDIDOS.filter(ehEmAndamento).length;
  const nConc=PEDIDOS.filter(p=>ehAtendido(p)||p.cancelado).length;
  app.innerHTML='<div class="top"><img src="/logo"><div class="t">🛒 Pedidos</div><div style="flex:1"></div>'+
      '<select onchange="DIAS=this.value;carregar()" style="background:#1c1846;border:1px solid #37327a;border-radius:8px;color:#fff;padding:7px">'+
      [1,3,7,15].map(function(d){return '<option value="'+d+'"'+(String(d)===String(DIAS)?" selected":"")+'>'+(d===1?"hoje":d+" dias")+'</option>';}).join("")+'</select>'+
      '<button class="btn btn-ghost" style="width:auto;margin:0" onclick="carregar()">🔄</button>'+
      '<button class="btn btn-ghost" style="width:auto;margin:0" onclick="marcarVistos()">✓ Marcar vistos</button></div>'+
    '<div class="wrap">'+
      '<div class="abas">'+
        '<span class="aba '+(FILTRO==="ativos"?"on":"")+'" onclick="FILTRO=\'ativos\';render()">⏳ Aguardando separação ('+nAgu+')</span>'+
        '<span class="aba '+(FILTRO==="online"?"on":"")+'" onclick="FILTRO=\'online\';render()">🖥️ Totem/Site ('+nOnline+')</span>'+
        '<span class="aba '+(FILTRO==="atacado"?"on":"")+'" onclick="FILTRO=\'atacado\';render()">🧑‍💼 Venda Atacado ('+nAtac+')</span>'+
        '<span class="aba '+(FILTRO==="entrega"?"on":"")+'" onclick="FILTRO=\'entrega\';render()">🛵 Entrega ('+nEnt+')</span>'+
        '<span class="aba '+(FILTRO==="retirada"?"on":"")+'" onclick="FILTRO=\'retirada\';render()">🏪 Retirada ('+nRet+')</span>'+
        '<span class="aba '+(FILTRO==="andamento"?"on":"")+'" onclick="FILTRO=\'andamento\';render()">📋 Em andamento ('+nAnd+')</span>'+
        '<span class="aba '+(FILTRO==="todos"?"on":"")+'" onclick="FILTRO=\'todos\';render()">🗂️ Todos os status ('+PEDIDOS.length+')'+(nConc?' <span style="opacity:.7">· '+nConc+' concluídos</span>':'')+'</span>'+
      '</div>'+
      (CARREGANDO?'<div class="muted" style="padding:16px">Carregando…</div>'
        :(lista.length?'<div class="grid">'+lista.map(cardPedido).join("")+'</div>'
          :'<div class="card"><div class="muted">Nenhum pedido do totem/site nesse período.</div></div>'))+
    '</div>';
}
function verDetalhe(id){
  const p=PEDIDOS.find(function(x){return x.id===id;}); if(!p) return;
  document.getElementById("modais").innerHTML='<div class="modalBg" onclick="if(event.target===this)fechar()"><div class="modal">'+
    '<h3>Pedido '+esc(p.numero)+'</h3>'+
    '<div class="muted" style="margin:4px 0 10px">'+esc(p.cliente)+' · '+(p.tipo==="entrega"?"🛵 Entrega":"🏪 Retirada")+
      '<br>🕐 criado em '+esc(dataHora(p.criadoEm))+((p.origem!=="totem"&&p.origem!=="site")?' · vendedor: '+esc(p.vendedor||"—"):' · '+(p.origem==="totem"?"Totem":"Site"))+'</div>'+
    (p.endereco?'<div class="muted" style="margin-bottom:8px">📍 '+esc(p.endereco)+'</div>':'')+
    (p.itens||[]).map(function(i){return '<div style="display:flex;justify-content:space-between;border-bottom:1px solid #2a2660;padding:5px 0;font-size:13px"><span>'+i.quantidade+'x '+esc(i.nome)+'</span><b>'+brl(i.quantidade*i.valor)+'</b></div>';}).join("")+
    (p.frete>0?'<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:13px"><span>Frete</span><b>'+brl(p.frete)+'</b></div>':'')+
    '<div style="display:flex;justify-content:space-between;padding:8px 0;font-weight:900"><span>Total</span><span style="color:#ffd23f">'+brl(p.total)+'</span></div>'+
    '<button class="btn btn-ghost" onclick="fechar()">Fechar</button></div></div>';
}
function fechar(){ document.getElementById("modais").innerHTML=""; }
function editarNoCaixa(numero){ location.href="/caixa-atacado?abrirPedido="+encodeURIComponent(numero); }
// mesma mensagem do /operacional: pedido completo com itens e total
async function whats(tel,numero,cliente,id){
  try{
    // busca o pedido no Bling pra montar a mensagem com os itens e o total reais
    let ped=null;
    try{ const j=await fetch(B+"/api/pedidos/"+id).then(r=>r.json()); ped=j.data||j; }catch(e){}
    // telefone: usa o do registro; se não tiver, busca igual o operacional faz
    let t=soDig(tel||"");
    if(!t&&ped){
      t=soDig(ped.contato?.celular||ped.contato?.telefone||ped.contato?.fone||"");
      if(!t&&ped.contato?.id){
        try{ const jc=await fetch(B+"/api/contatos/"+ped.contato.id).then(r=>r.json()); const c=jc.data||jc;
          t=soDig(c?.celular||c?.telefone||c?.fone||""); }catch(e){}
      }
      if(!t&&ped.observacoes){ const m=String(ped.observacoes).match(/\((\d[\d\s().-]{7,})\)/); if(m) t=soDig(m[1]); }
    }
    const p=PEDIDOS.find(function(x){return String(x.id)===String(id);});
    const nome=(ped?.contato?.nome)||cliente||"";
    const itens=(ped?.itens?.length?ped.itens.map(function(i){return "- "+(i.descricao||i.produto?.nome||"Produto")+": "+i.quantidade+" un";})
      :((p?.itens)||[]).map(function(i){return "- "+i.nome+": "+i.quantidade+" un";})).join("\n");
    const total=Number(ped?.total ?? p?.total ?? 0);
    const msg="Olá"+(nome?" "+nome:"")+"! Seu pedido *"+(ped?.numero||numero)+"* foi recebido na B13 Bebidas. ✅\n\n"+
      "*Itens do pedido:*\n"+itens+"\n\n*Total: "+brl(total)+"*\n\nEm breve entraremos em contato! 😊";
    if(!t){ alert("Não achei o telefone do cliente. Vou abrir o WhatsApp com a mensagem pronta pra você escolher a conversa."); window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank"); return; }
    const num=t.startsWith("55")?t:("55"+t);
    window.open("https://wa.me/"+num+"?text="+encodeURIComponent(msg),"_blank");
  }catch(e){ alert("Erro ao montar a mensagem do pedido."); }
}
function cancelar(id,numero){
  document.getElementById("modais").innerHTML='<div class="modalBg" onclick="if(event.target===this)fechar()"><div class="modal">'+
    '<h3>🚫 Cancelar pedido '+esc(numero)+'</h3>'+
    '<div class="muted" style="margin:8px 0">O pedido será marcado como <b>Cancelado</b> no Bling.</div>'+
    '<input id="motivoCanc" placeholder="Motivo (ex: cliente desistiu)">'+
    '<div id="errCanc"></div>'+
    '<div style="display:flex;gap:8px;margin-top:12px">'+
    '<button class="btn btn-ghost" style="margin:0" onclick="fechar()">Voltar</button>'+
    '<button class="btn btn-red" id="btnCanc" style="margin:0" onclick="confirmarCancelar('+id+')">Confirmar</button>'+
    '</div></div></div>';
}
async function confirmarCancelar(id){
  const btn=document.getElementById("btnCanc");
  const motivo=(document.getElementById("motivoCanc")||{}).value||"";
  if(btn){ btn.disabled=true; btn.textContent="Cancelando…"; }
  try{
    const j=await fetch(B+"/api/pedidos-online/"+id+"/cancelar",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({motivo,funcionarioId:S.id})}).then(function(r){return r.json();});
    if(j.erro) throw new Error(j.erro);
    fechar(); carregar();
  }catch(e){
    const el=document.getElementById("errCanc");
    if(el) el.innerHTML='<div style="color:#ff8090;font-size:12px;margin-top:8px">'+esc(e.message)+'</div>';
    if(btn){ btn.disabled=false; btn.textContent="Confirmar"; }
  }
}
async function marcarVistos(){
  try{ await fetch(B+"/api/pedidos-online/marcar-visto/"+encodeURIComponent(S.id),{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}); }catch(e){}
  if(typeof b13ChecarNovosPedidos==="function") b13ChecarNovosPedidos();
  carregar();
}
/* ===== EDIÇÃO DO PEDIDO (mesma lógica do /operacional: altera itens direto no Bling) ===== */
function edSetMsg(h){ const el=document.getElementById("edMsg"); if(el) el.innerHTML=h; }
function totalEdit(){ return (window.itensEdit||[]).filter(i=>!i._removido).reduce((s,i)=>s+Number(i.valor||0)*Number(i.quantidade||0),0); }
async function editarPedidoAguardando(id){
  document.getElementById("modais").innerHTML='<div class="modalBg" onclick="if(event.target===this)fechar()"><div class="modal" id="mbox"><div class="muted">Carregando pedido…</div></div></div>';
  try{
    const r=await fetch(B+"/api/pedidos/"+id).then(r=>r.json());
    const ped=r.data||r;
    if(!ped||!ped.itens){ document.getElementById("mbox").innerHTML='<div style="color:#ff8090">Não consegui carregar o pedido.</div><button class="btn btn-ghost" onclick="fechar()">Fechar</button>'; return; }
    window.pedidoEditOrig=ped; window.pedidoEditId=id;
    window.itensEdit=(ped.itens||[]).map(i=>({ produtoId:i.produto?.id, descricao:i.descricao||i.produto?.nome||"",
      quantidade:i.quantidade, quantidadeOriginal:i.quantidade, valor:i.valor, _removido:false, _novo:false }));
    renderEditarAguardando(id);
  }catch(e){ document.getElementById("mbox").innerHTML='<div style="color:#ff8090">Erro ao carregar o pedido.</div><button class="btn btn-ghost" onclick="fechar()">Fechar</button>'; }
}
function renderEditarAguardando(id){
  const rows=(window.itensEdit||[]).map((item,ix)=>linhaItemEdit(item,ix,id)).join("");
  document.getElementById("mbox").innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
      '<h3>✏️ Pedido '+esc(window.pedidoEditOrig?.numero||id)+'</h3>'+
      '<button class="btn btn-ghost" style="width:auto;margin:0" onclick="fechar()">✕</button></div>'+
    '<div class="muted" style="margin-bottom:8px">Ajuste as quantidades ou remova itens. Ao salvar, altera também no Bling.</div>'+
    '<div style="max-height:42vh;overflow:auto">'+rows+'</div>'+
    '<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #2a2660;margin-top:6px">'+
      '<span class="muted">Total ajustado:</span><b style="color:#ffd23f" id="edTotal">'+brl(totalEdit())+'</b></div>'+
    '<div style="margin-top:8px;border-top:1px solid #2a2660;padding-top:8px">'+
      '<div class="muted" style="margin-bottom:4px">➕ Adicionar produto</div>'+
      '<input id="buscaNovoItemEd" placeholder="🔎 Buscar por nome…" oninput="buscarNovoItemEdit(this.value,'+id+')">'+
      '<div id="resBuscaEd"></div></div>'+
    '<div id="edMsg" style="margin-top:8px"></div>'+
    '<div style="display:flex;gap:8px;margin-top:10px">'+
      '<button class="btn btn-ghost" style="margin:0" onclick="fechar()">Cancelar</button>'+
      '<button class="btn btn-mag" style="margin:0" onclick="salvarEditarAguardando('+id+')">💾 Salvar no Bling</button></div>';
}
function linhaItemEdit(item,ix,id){
  if(item._removido){
    return '<div class="it" style="opacity:.5"><div style="flex:1;text-decoration:line-through;font-size:13px">'+esc(item.descricao)+'</div>'+
      '<button class="btn btn-ghost" style="width:auto;margin:0;padding:4px 8px;font-size:11px" onclick="restaurarItemEdit('+ix+','+id+')">desfazer</button></div>';
  }
  return '<div class="it"><div style="flex:1;min-width:0;font-size:13px">'+esc(item.descricao)+
    '<div class="muted" style="font-size:11px">'+brl(item.valor)+' un'+(item._novo?' · <span style="color:#3ce88a">novo</span>':'')+'</div></div>'+
    '<input type="number" min="1" step="1" value="'+item.quantidade+'" onchange="mudarQtdEdit('+ix+',this.value,'+id+')">'+
    '<button class="rm" onclick="removerItemEdit('+ix+','+id+')">🗑</button></div>';
}
function mudarQtdEdit(ix,v,id){
  const q=Math.max(1,parseInt(v)||1);
  window.itensEdit[ix].quantidade=q;
  const t=document.getElementById("edTotal"); if(t) t.textContent=brl(totalEdit());
}
function removerItemEdit(ix,id){ window.itensEdit[ix]._removido=true; renderEditarAguardando(id); }
function restaurarItemEdit(ix,id){ window.itensEdit[ix]._removido=false; renderEditarAguardando(id); }
let _edBuscaT=null;
function buscarNovoItemEdit(q,id){
  clearTimeout(_edBuscaT);
  _edBuscaT=setTimeout(async function(){
    const termo=(q||"").trim();
    const box=document.getElementById("resBuscaEd"); if(!box) return;
    if(termo.length<2){ box.innerHTML=""; return; }
    try{
      const j=await fetch(B+"/api/buscar-atacado?nome="+encodeURIComponent(termo)).then(r=>r.json());
      const lista=(j.data||[]).slice(0,8);
      box.innerHTML=lista.length?lista.map(function(r){
        return '<div class="it" style="cursor:pointer" onclick=\'addItemEdit('+JSON.stringify({id:r.id,nome:r.nome,preco:r.preco??r.precoBling??0}).replace(/'/g,"&#39;")+','+id+')\'>'+
          '<div style="flex:1;font-size:13px">'+esc(r.nome)+'<div class="muted" style="font-size:11px">'+brl(r.preco??r.precoBling??0)+'</div></div><span style="color:#3ce88a">+</span></div>';
      }).join(""):'<div class="muted" style="padding:6px">nada encontrado</div>';
    }catch(e){ box.innerHTML='<div class="muted" style="padding:6px">erro na busca</div>'; }
  },350);
}
function addItemEdit(r,id){
  const ja=window.itensEdit.find(function(i){return String(i.produtoId)===String(r.id)&&!i._removido;});
  if(ja){ ja.quantidade+=1; }
  else window.itensEdit.push({produtoId:r.id,descricao:r.nome,quantidade:1,quantidadeOriginal:0,valor:Number(r.preco)||0,_removido:false,_novo:true});
  const b=document.getElementById("buscaNovoItemEd"); if(b) b.value="";
  const box=document.getElementById("resBuscaEd"); if(box) box.innerHTML="";
  renderEditarAguardando(id);
}
async function salvarEditarAguardando(id){
  const itens=(window.itensEdit||[]).filter(i=>!i._removido).map(i=>({produtoId:i.produtoId,quantidade:Number(i.quantidade),valor:Number(i.valor)}));
  if(!itens.length){ edSetMsg('<div style="color:#ff8090">O pedido precisa ter ao menos 1 item.</div>'); return; }
  edSetMsg('<div class="muted">Salvando no Bling…</div>');
  try{
    const j=await fetch(B+"/api/pedidos/"+id+"/editar-itens",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({itens, funcionarioNome:(S.nome||"")})}).then(r=>r.json());
    if(j.erro){ edSetMsg('<div style="color:#ff8090">❌ '+esc(j.erro)+'</div>'); return; }
    const sinc=j.sincronizado||{};
    const onde=["Bling"]; if(sinc.caixa) onde.push("caixa"); if(sinc.proposta) onde.push("proposta");
    const ia=j.itensAlterados||{};
    const resumo=[
      ia.retirados&&ia.retirados.length?"retirou "+ia.retirados.join(", "):"",
      ia.acrescentados&&ia.acrescentados.length?"acrescentou "+ia.acrescentados.join(", "):"",
      ia.alterados&&ia.alterados.length?"alterou "+ia.alterados.join(", "):"",
    ].filter(Boolean).join(" · ");
    edSetMsg('<div style="color:#3ce88a;font-size:12px">✅ Salvo em: '+onde.join(" + ")+(resumo?"<br><span style=\"color:#9a95c9\">"+esc(resumo)+"</span>":"")+'</div>');
    if(j.avisosEstoque&&j.avisosEstoque.length) alert("⚠️ Atenção:\n"+j.avisosEstoque.join("\n"));
    setTimeout(function(){ fechar(); carregar(); },1200);
  }catch(e){ edSetMsg('<div style="color:#ff8090">Erro de conexão. Nada foi alterado.</div>'); }
}

/* ===== AGENDAR ENTREGA (dia + turno) ===== */
function abrirAgendar(id){
  const p=PEDIDOS.find(function(x){return String(x.id)===String(id);}); if(!p) return;
  const hoje=new Date(); const d0=new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate());
  const dias=[];
  for(let i=0;i<10;i++){ const d=new Date(d0.getTime()+i*86400000);
    const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const nome=i===0?"Hoje":(i===1?"Amanhã":d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"}));
    dias.push({iso,nome});
  }
  const at=p.agendamento||{};
  document.getElementById("modais").innerHTML='<div class="modalBg" onclick="if(event.target===this)fechar()"><div class="modal">'+
    '<h3>📅 Agendar entrega — pedido '+esc(p.numero)+'</h3>'+
    '<div class="muted" style="margin:6px 0 10px">'+esc(p.cliente)+(p.endereco?' · 📍 '+esc(p.endereco):'')+'</div>'+
    '<div class="muted" style="margin-bottom:4px">Dia da entrega</div>'+
    '<select id="agDia" style="width:100%;margin-bottom:10px">'+
      dias.map(function(d){return '<option value="'+d.iso+'"'+(at.data===d.iso?" selected":"")+'>'+d.nome+' ('+d.iso.split("-").reverse().slice(0,2).join("/")+')</option>';}).join("")+
    '</select>'+
    '<div class="muted" style="margin-bottom:4px">Turno <span style="opacity:.7">(informativo — o que foi combinado com o cliente)</span></div>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap">'+
      '<label style="flex:1;min-width:100px;background:#1c1846;border-radius:10px;padding:10px;cursor:pointer;text-align:center"><input type="radio" name="agTurno" value="qualquer"'+((!at.turno||at.turno==="qualquer")?" checked":"")+'> 🕐 Qualquer horário</label>'+
      '<label style="flex:1;min-width:90px;background:#1c1846;border-radius:10px;padding:10px;cursor:pointer;text-align:center"><input type="radio" name="agTurno" value="manha"'+(at.turno==="manha"?" checked":"")+'> ☀️ Manhã</label>'+
      '<label style="flex:1;min-width:90px;background:#1c1846;border-radius:10px;padding:10px;cursor:pointer;text-align:center"><input type="radio" name="agTurno" value="tarde"'+(at.turno==="tarde"?" checked":"")+'> 🌇 Tarde</label>'+
    '</div>'+
    '<div class="muted" style="margin:10px 0 4px">Observação da entrega <span style="opacity:.7">(só pro nosso sistema — não vai pro cliente)</span></div>'+
    '<textarea id="agObs" rows="2" style="width:100%;background:#1c1846;border:1px solid #37327a;border-radius:8px;color:#fff;padding:9px;font-size:13px" placeholder="ex: entregar até 11h · ligar antes · portão azul">'+esc(at.obsEntrega||"")+'</textarea>'+
    '<div id="errAg"></div>'+
    '<div style="display:flex;gap:8px;margin-top:14px">'+
      (p.agendamento?'<button class="btn btn-red" style="margin:0" onclick="desagendar('+id+')">Desagendar</button>':'')+
      '<button class="btn btn-ghost" style="margin:0" onclick="fechar()">Voltar</button>'+
      '<button class="btn btn-mag" style="margin:0" id="btnAg" onclick="salvarAgendamento('+id+')">Salvar</button>'+
    '</div></div></div>';
}
async function salvarAgendamento(id){
  const data=(document.getElementById("agDia")||{}).value||"";
  const el=document.querySelector('input[name="agTurno"]:checked');
  const turno=el?el.value:"qualquer";
  const btn=document.getElementById("btnAg"); if(btn){ btn.disabled=true; btn.textContent="Salvando…"; }
  try{
    const j=await fetch(B+"/api/pedidos-online/"+id+"/agendar-entrega",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({data,turno,obsEntrega:(document.getElementById("agObs")||{}).value||"",funcionarioId:S.id})}).then(function(r){return r.json();});
    if(j.erro) throw new Error(j.erro);
    fechar(); carregar();
  }catch(e){
    const err=document.getElementById("errAg");
    if(err) err.innerHTML='<div style="color:#ff8090;font-size:12px;margin-top:8px">'+esc(e.message)+'</div>';
    if(btn){ btn.disabled=false; btn.textContent="Salvar"; }
  }
}
async function desagendar(id){
  try{ await fetch(B+"/api/pedidos-online/"+id+"/desagendar-entrega",{method:"POST"}); fechar(); carregar(); }
  catch(e){ alert("Erro ao desagendar."); }
}

/* ===== TROCAR ENTREGA <-> RETIRADA (com cálculo de frete) ===== */
function abrirTipoEntrega(id){
  const p=PEDIDOS.find(function(x){return String(x.id)===String(id);}); if(!p) return;
  document.getElementById("modais").innerHTML='<div class="modalBg" onclick="if(event.target===this)fechar()"><div class="modal">'+
    '<h3>🛵 Entrega / Retirada — pedido '+esc(p.numero)+'</h3>'+
    '<div class="muted" style="margin:6px 0 10px">Hoje: <b>'+(p.tipo==="entrega"?"Entrega":"Retirada")+'</b>'+(p.frete>0?' · frete '+brl(p.frete):'')+'</div>'+
    '<div style="display:flex;gap:8px;margin-bottom:10px">'+
      '<label style="flex:1;background:#1c1846;border-radius:10px;padding:10px;cursor:pointer;text-align:center"><input type="radio" name="teTipo" value="retirada"'+(p.tipo!=="entrega"?" checked":"")+' onchange="mostrarCamposEntrega()"> 🏪 Retirada</label>'+
      '<label style="flex:1;background:#1c1846;border-radius:10px;padding:10px;cursor:pointer;text-align:center"><input type="radio" name="teTipo" value="entrega"'+(p.tipo==="entrega"?" checked":"")+' onchange="mostrarCamposEntrega()"> 🛵 Entrega</label>'+
    '</div>'+
    '<div id="camposEntrega" style="display:'+(p.tipo==="entrega"?"block":"none")+'">'+
      '<div class="muted" style="margin-bottom:4px">Endereço de entrega</div>'+
      '<input id="teEnd" value="'+esc(p.endereco||"")+'" placeholder="Rua, número, bairro, cidade">'+
      '<div style="display:flex;gap:8px;margin-top:8px;align-items:flex-end">'+
        '<div style="flex:1"><div class="muted" style="margin-bottom:4px">Frete (R$)</div><input id="teFrete" type="number" step="0.01" value="'+(Number(p.frete)||0)+'"></div>'+
        '<button class="btn btn-ghost" style="width:auto;margin:0" onclick="calcularFretePedido('+id+')">🧮 Calcular</button>'+
      '</div>'+
      '<div id="infoFrete" class="muted" style="font-size:11px;margin-top:4px"></div>'+
    '</div>'+
    '<div id="errTE"></div>'+
    '<div style="display:flex;gap:8px;margin-top:14px">'+
      '<button class="btn btn-ghost" style="margin:0" onclick="fechar()">Voltar</button>'+
      '<button class="btn btn-mag" style="margin:0" id="btnTE" onclick="salvarTipoEntrega('+id+')">Salvar no Bling</button>'+
    '</div></div></div>';
}
function mostrarCamposEntrega(){
  const el=document.querySelector('input[name="teTipo"]:checked');
  const box=document.getElementById("camposEntrega");
  if(box) box.style.display=(el&&el.value==="entrega")?"block":"none";
}
async function calcularFretePedido(id){
  const p=PEDIDOS.find(function(x){return String(x.id)===String(id);});
  const end=(document.getElementById("teEnd")||{}).value||"";
  const info=document.getElementById("infoFrete");
  if(!end.trim()){ if(info) info.innerHTML='<span style="color:#ff8090">Preencha o endereço primeiro.</span>'; return; }
  if(info) info.textContent="Calculando…";
  try{
    const j=await fetch(B+"/api/frete?endereco="+encodeURIComponent(end)+"&valor="+(Number(p?.total)||0)).then(function(r){return r.json();});
    if(j.erro) throw new Error(j.erro);
    if(!j.entregaDisponivel){ if(info) info.innerHTML='<span style="color:#ffd23f">'+esc(j.motivo||"Entrega não disponível")+'</span>'; return; }
    const f=document.getElementById("teFrete"); if(f) f.value=j.taxa;
    if(info) info.innerHTML='✅ '+j.km+' km'+(j.gratis?' · frete grátis':' · R$ '+j.porKm+'/km')+' → '+brl(j.taxa);
  }catch(e){ if(info) info.innerHTML='<span style="color:#ff8090">'+esc(e.message)+'</span>'; }
}
async function salvarTipoEntrega(id){
  const el=document.querySelector('input[name="teTipo"]:checked');
  const tipo=el?el.value:"retirada";
  const endereco=(document.getElementById("teEnd")||{}).value||"";
  const frete=Number((document.getElementById("teFrete")||{}).value||0);
  const btn=document.getElementById("btnTE"); if(btn){ btn.disabled=true; btn.textContent="Salvando…"; }
  try{
    if(tipo==="entrega"&&!endereco.trim()) throw new Error("Informe o endereço da entrega.");
    const j=await fetch(B+"/api/pedidos-online/"+id+"/tipo-entrega",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({tipo,endereco,frete,funcionarioId:S.id})}).then(function(r){return r.json();});
    if(j.erro) throw new Error(j.erro);
    fechar(); carregar();
  }catch(e){
    const err=document.getElementById("errTE");
    if(err) err.innerHTML='<div style="color:#ff8090;font-size:12px;margin-top:8px">'+esc(e.message)+'</div>';
    if(btn){ btn.disabled=false; btn.textContent="Salvar no Bling"; }
  }
}

render();
carregar();
setInterval(function(){ if(!CARREGANDO) carregar(true); }, 60000);
</script>
