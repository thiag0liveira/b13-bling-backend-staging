<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>B13 — Funcionários</title>
<style>
  *{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;margin:0;padding:0}
  :root{--indigo:#262366;--mag:#FF0082;--bg:#0f0d24;--card:#151233;--border:#2c2660}
  body{background:var(--bg);color:#fff;min-height:100vh}
  #app{max-width:900px;margin:0 auto}
  .top{background:linear-gradient(180deg,#2b2870,var(--indigo));border-bottom:3px solid var(--mag);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
  .top img{height:38px}.top .t{font-weight:900;font-size:17px}.top .sp{flex:1}
  .btn{border:none;border-radius:9px;font-weight:800;cursor:pointer;font-size:13px;padding:9px 14px;color:#fff}
  .btn-mag{background:var(--mag)}.btn-out{background:transparent;border:2px solid #514c96}
  .btn-ghost{background:#1c1846}.btn-red{background:#c0392b}.btn-grn{background:#2f9e6b}
  .wrap{padding:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
  .card .info{flex:1}
  .card .nome{font-weight:900;font-size:15px}
  .card .nivel{font-size:12px;color:#9a95c9}
  .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800}
  .badge-gerente{background:#262366;color:#a0a0ff}
  .badge-expedicao{background:#00aaff22;color:#00aaff}
  .badge-admin{background:#ff008222;color:#ff0082}
  .inativo{opacity:.5}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
  .mbox{background:#1c1846;border:1px solid #3a357f;border-radius:14px;max-width:440px;width:100%;padding:20px;max-height:90vh;overflow-y:auto}
  .mbox h3{margin-bottom:14px}
  .mbox input,.mbox select{width:100%;padding:11px;border-radius:9px;border:1px solid #514c96;background:#0f0d24;color:#fff;font-size:14px;margin-bottom:10px}
  .mbox input:focus,.mbox select:focus{outline:none;border-color:var(--mag)}
  .mbox .lbl{font-size:12px;color:#9a95c9;margin-bottom:4px}
  .ok{background:#183a2a;color:#a8f0c8;border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0}
  .err{background:#3a2030;color:#ffbfce;border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0}
  .muted{color:#9a95c9;font-size:13px}
  .login-wrap{max-width:380px;margin:12vh auto;text-align:center}
  .login-wrap input{width:100%;padding:13px;border-radius:10px;border:2px solid #514c96;background:var(--card);color:#fff;font-size:16px;margin-bottom:10px}
</style>
<script src="/nav.js"></script>
<style>
  body.b13nav-open{ overflow:hidden }
  @media(min-width:900px){
    #b13nav{transform:translateX(0%) !important}
    #b13navOverlay{display:none !important}
    button[onclick="b13ToggleNav()"]{display:none !important}
    body > *:not(#b13nav):not([onclick="b13ToggleNav()"]):not(#b13navOverlay){ margin-left:200px }
  }
</style>
</head>
<body><script>
  (function(){
    if(!b13RequireLogin()) return;
    document.addEventListener("DOMContentLoaded",function(){
      const nav=document.createElement("div");
      nav.innerHTML=b13RenderNav("/funcionarios");
      document.body.insertBefore(nav,document.body.firstChild);
    });
  })();
</script>
<div id="app"></div>
<div id="modal" style="display:none" class="modal" onclick="if(event.target===this)fecharModal()">
  <div class="mbox" id="mbox"></div>
</div>
<script>
const B=location.protocol.indexOf("http")===0?"":"https://b13-bling-backend-production.up.railway.app";
const LOGO="/logo";
const NIVEIS={admin:"Admin",gerente:"Gerente",lider_caixa:"Líder de Caixa",expedicao:"Expedição",financeiro_atacado:"Financeiro",vendedor:"Vendedor",conferente:"Conferente"};
const GRUPOS_AUTORIZAM_PDV=["admin","gerente","lider_caixa"]; // grupos que conseguem autorizar ações no Frente de Caixa
let logado=false, funcs=[], msg="";
try{ if(typeof b13PodeAba==="function") logado=b13PodeAba("/funcionarios"); }catch(e){}

const esc=s=>(s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

async function carregar(){
  try{ const r=await fetch(B+"/api/funcionarios"); const j=await r.json(); funcs=j.data||[]; }
  catch(e){ msg=`<div class="err">Erro ao carregar funcionários</div>`; }
  render();
}

function render(){
  const app=document.getElementById("app");
  const top=`<div class="top"><img src="${LOGO}"><div class="t">Gestão de Funcionários</div><div class="sp"></div>
    ${logado?`<button class="btn btn-mag" onclick="abrirNovo()">+ Novo funcionário</button>
    <a href="/gestao" class="btn btn-out" style="text-decoration:none">← Gestão</a>
    <button class="btn btn-ghost" onclick="sair()">Sair</button>`:""}
  </div>`;

  if(!logado){
    app.innerHTML=top+`<div class="login-wrap">
      <div style="font-size:48px;margin-bottom:10px">👥</div>
      <h2 style="margin-bottom:16px">Acesso Administrativo</h2>
      <input id="pwInp" type="password" placeholder="Senha admin" onkeydown="if(event.key==='Enter')login()">
      <button class="btn btn-mag" style="width:100%" onclick="login()">Entrar</button>
      <div id="pwErr" class="muted" style="margin-top:8px"></div>
    </div>`; return;
  }

  const cards=funcs.length ? funcs.map(f=>`
    <div class="card ${!f.ativo?'inativo':''}">
      <div style="font-size:28px">${f.nivel==='admin'?'👑':f.nivel==='gerente'?'🧑‍💼':'🔧'}</div>
      <div class="info">
        <div class="nome">${esc(f.nome)} <span class="badge badge-${f.nivel}">${esc(NIVEIS[f.nivel]||f.nivel)}</span>
          ${!f.ativo?'<span class="badge" style="background:#3a2030;color:#ff9db0">Inativo</span>':''}
          ${f.precisaTrocarSenha?'<span class="badge" style="background:#3a2a00;color:#ffd23f">🔑 Precisa trocar senha</span>':''}</div>
        <div class="nivel">${f.login?`Login: <b>${esc(f.login)}</b> · `:""}ID: ${esc(f.id)}</div>
      </div>
      <button class="btn btn-ghost" onclick="abrirEditar('${f.id}')">✏️ Editar</button>
      <button class="btn ${f.ativo?'btn-red':'btn-grn'}" onclick="toggleAtivo('${f.id}',${!f.ativo})">${f.ativo?'Desativar':'Ativar'}</button>
    </div>`).join("")
    : `<div class="muted" style="text-align:center;padding:30px">Nenhum funcionário cadastrado.<br><br>
        <button class="btn btn-mag" onclick="abrirNovo()">+ Adicionar primeiro funcionário</button></div>`;

  // seção de grupos — quem está em cada um
  const gruposHtml=Object.keys(NIVEIS).map(nivelKey=>{
    const membros=funcs.filter(f=>f.nivel===nivelKey||((f.permissoes||[]).includes(nivelKey)));
    if(!membros.length) return "";
    return `<div class="card" style="display:block">
      <div class="nome" style="margin-bottom:6px">${esc(NIVEIS[nivelKey])} <span class="muted" style="font-weight:400">(${membros.length})</span></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${membros.map(m=>`<span class="badge badge-${m.nivel}">${esc(m.nome)}</span>`).join("")}
      </div>
    </div>`;
  }).join("");

  app.innerHTML=top+`<div class="wrap">
    ${msg}
    <h3 style="margin:10px 0">👥 Grupos</h3>
    ${gruposHtml||'<div class="muted">Nenhum grupo com membros ainda.</div>'}
    <h3 style="margin:20px 0 10px">🧑 Funcionários</h3>
    ${cards}
  </div>`;
  msg="";
}

function login(){ location.href="/login?next=/funcionarios"; }
function sair(){ logado=false; if(typeof b13ClearSession==="function") b13ClearSession(); render(); }
function fecharModal(){ document.getElementById("modal").style.display="none"; }

// Estado de trabalho do modal aberto no momento (novo ou editar) — a lista de
// permissões "de verdade" (as mesmas usadas em todo o resto do sistema), mas
// controlada pela tela só através das abas, nunca mostrando esses nomes internos.
let PERMS_ATUAL=[];

function abaLiberada(tab){ return tab.acoes.some(a=>PERMS_ATUAL.includes("admin")||PERMS_ATUAL.includes(a)); }

// bloco: uma linha por aba do menu lateral (igual o menu de verdade), com toggle de acesso
function htmlPermsBlock(checked){
  PERMS_ATUAL=(checked||[]).slice();
  return `<div class="lbl">Acesso às abas do sistema</div>
    <div id="fPerms" style="background:#0f0d24;border:1px solid #514c96;border-radius:9px;padding:10px;margin-bottom:10px">
      <label style="display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #201d47;font-size:13px;font-weight:800">
        <input type="checkbox" id="fAdmin" ${PERMS_ATUAL.includes("admin")?"checked":""} onclick="toggleAdmin()"> Admin — acesso total a tudo
      </label>
      <div id="fAbasLista"></div>
    </div>
    <div class="muted" style="font-size:11px;margin:-6px 0 10px">Cada aba agora tem sua própria permissão — marcar/desmarcar uma não afeta as outras.</div>`;
}
function renderAbasLista(){
  const box=document.getElementById("fAbasLista"); if(!box) return;
  const isAdmin=PERMS_ATUAL.includes("admin");
  box.innerHTML=(window.B13_NAV_LINKS||[]).map(l=>{
    const liberado=abaLiberada(l);
    return `<label style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #201d47;font-size:13px;${isAdmin?'opacity:.6':''}">
      <span><code style="background:#1c1846;padding:1px 5px;border-radius:4px;margin-right:6px">${esc(l.href)}</code>${esc(l.label)}</span>
      <span style="display:flex;align-items:center;gap:6px">
        <span style="font-weight:700;color:${liberado?'#3ce88a':'#ff8090'}">${liberado?'✅ Tem acesso':'🚫 Sem acesso'}</span>
        <input type="checkbox" ${liberado?"checked":""} ${isAdmin?"disabled":""} onclick="toggleAba('${l.href}')">
      </span>
    </label>`;
  }).join("");
}
function toggleAdmin(){
  if(PERMS_ATUAL.includes("admin")){
    if(!confirm("Remover Admin? O acesso vai voltar a ser controlado aba por aba (tudo desmarcado até você escolher de novo).")) { document.getElementById("fAdmin").checked=true; return; }
    PERMS_ATUAL=[];
  } else {
    PERMS_ATUAL=["admin"];
  }
  renderAbasLista();
}
function toggleAba(href){
  const tab=(window.B13_NAV_LINKS||[]).find(l=>l.href===href); if(!tab) return;
  if(abaLiberada(tab)){
    // desmarcando: antes de tirar a(s) acao(oes) dessa aba, preserva o acesso de
    // QUALQUER outra aba que dependia da mesma trava compartilhada (comum em
    // funcionarios antigos, que ainda usam as permissoes antigas tipo editar_pedido) —
    // migra elas pra sua propria acao especifica antes de remover a trava velha
    const acoesRemovendo=tab.acoes.slice();
    (window.B13_NAV_LINKS||[]).forEach(outra=>{
      if(outra.href===href) return;
      const dependiaDeAlgumaRemovida=outra.acoes.some(a=>acoesRemovendo.includes(a));
      const aindaLiberadaSemElas=outra.acoes.some(a=>!acoesRemovendo.includes(a)&&PERMS_ATUAL.includes(a));
      if(dependiaDeAlgumaRemovida && !aindaLiberadaSemElas && !PERMS_ATUAL.includes(outra.acoes[0])){
        PERMS_ATUAL.push(outra.acoes[0]); // garante a acao propria dela antes de remover a compartilhada
      }
    });
    PERMS_ATUAL=PERMS_ATUAL.filter(p=>!acoesRemovendo.includes(p));
  } else {
    // marcando: usa só a acao PRÓPRIA dessa aba (a primeira da lista) — nunca afeta outras abas
    const acaoPrincipal=tab.acoes[0];
    if(!PERMS_ATUAL.includes(acaoPrincipal)) PERMS_ATUAL.push(acaoPrincipal);
  }
  renderAbasLista();
}

function abrirNovo(){
  document.getElementById("modal").style.display="flex";
  document.getElementById("mbox").innerHTML=`<h3>Novo Funcionário</h3>
    <div class="lbl">Nome</div><input id="fNome" placeholder="Nome completo">
    <div class="lbl">Login (usuário de acesso)</div><input id="fLogin" placeholder="Ex.: joao.silva">
    <div class="lbl">Senha inicial</div><input id="fSenha" type="password" value="12345">
    <div class="muted" style="font-size:11px;margin:-6px 0 10px">Senha padrão sugerida: <b>12345</b>. O funcionário será obrigado a criar uma senha própria (maiúscula, minúscula e número) no primeiro acesso.</div>
    ${htmlPermsBlock([])}
    <div class="lbl">Nível (referência)</div>
    <select id="fNivel">
      <option value="expedicao">Expedição</option>
      <option value="financeiro_atacado">Financeiro Atacado</option>
      <option value="vendedor">Vendedor</option>
      <option value="conferente">Conferente</option>
      <option value="lider_caixa">Líder de Caixa</option>
      <option value="gerente">Gerente</option>
      <option value="admin">Admin</option>
    </select>
    <div class="lbl">Vendedor Bling (pra vincular as vendas no Frente de Caixa)</div>
    ${htmlVendedorBusca(null)}
    <div id="fMsg"></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-mag" style="flex:1" onclick="salvarNovo()">💾 Salvar</button>
      <button class="btn btn-ghost" style="flex:1" onclick="fecharModal()">Cancelar</button>
    </div>`;
  renderAbasLista();
}

// gera o bloco de busca/seleção de vendedor Bling, reaproveitado no criar e no editar
function htmlVendedorBusca(f){
  const idAtual=f?.vendedorBlingId||"";
  const nomeAtual=f?.vendedorBlingNome||"";
  return `<div style="background:#0f0d24;border:1px solid #514c96;border-radius:9px;padding:10px;margin-bottom:10px">
    <input type="hidden" id="fVendedorId" value="${esc(String(idAtual))}">
    <div id="fVendedorAtual" style="font-size:13px;margin-bottom:6px">
      ${idAtual?`Vinculado a: <b style="color:#FF0082">${esc(nomeAtual||("Vendedor "+idAtual))}</b> <button class="btn btn-ghost" style="font-size:11px;padding:3px 8px;margin-left:6px" onclick="limparVendedor()">✕ remover</button>`:`<span class="muted">Nenhum vendedor vinculado</span>`}
    </div>
    <input id="fVendedorBusca" placeholder="Buscar vendedor pelo nome..." oninput="buscarVendedorDebounce()">
    <div id="fVendedorResultados" style="margin-top:6px"></div>
  </div>`;
}
function limparVendedor(){
  document.getElementById("fVendedorId").value="";
  document.getElementById("fVendedorAtual").innerHTML=`<span class="muted">Nenhum vendedor vinculado</span>`;
}
function escolherVendedor(id,nome){
  document.getElementById("fVendedorId").value=id;
  document.getElementById("fVendedorAtual").innerHTML=`Vinculado a: <b style="color:#FF0082">${esc(nome)}</b> <button class="btn btn-ghost" style="font-size:11px;padding:3px 8px;margin-left:6px" onclick="limparVendedor()">✕ remover</button>`;
  document.getElementById("fVendedorBusca").value="";
  document.getElementById("fVendedorResultados").innerHTML="";
}
let _vendedorBuscaT=null;
function buscarVendedorDebounce(){
  clearTimeout(_vendedorBuscaT);
  _vendedorBuscaT=setTimeout(buscarVendedor,350);
}
async function buscarVendedor(){
  const termo=document.getElementById("fVendedorBusca").value.trim();
  const div=document.getElementById("fVendedorResultados");
  if(termo.length<2){ div.innerHTML=""; return; }
  div.innerHTML=`<span class="muted" style="font-size:12px">Buscando...</span>`;
  try{
    const r=await fetch(B+"/api/vendedores/busca?termo="+encodeURIComponent(termo),{headers:{"X-Auth-Token":b13GetSession()?.token||""}});
    const j=await r.json();
    const lista=j.data||[];
    div.innerHTML=lista.length?lista.map(v=>`<div style="padding:6px;border-bottom:1px solid #2a2650;cursor:pointer;font-size:13px" onclick="escolherVendedor('${v.id}','${esc(v.nome).replace(/'/g,"\\'")}')">${esc(v.nome)}</div>`).join(""):`<span class="muted" style="font-size:12px">Nenhum vendedor encontrado</span>`;
  }catch(e){ div.innerHTML=`<span class="err" style="font-size:12px">Erro na busca</span>`; }
}

function abrirEditar(id){
  const f=funcs.find(x=>x.id===id); if(!f) return;
  const perms=f.permissoes||[f.nivel];
  document.getElementById("modal").style.display="flex";
  document.getElementById("mbox").innerHTML=`<h3>Editar — ${esc(f.nome)}</h3>
    <div class="lbl">Nome</div><input id="fNome" value="${esc(f.nome)}">
    <div class="lbl">Login</div><input id="fLogin" value="${esc(f.login||f.id)}">
    <div class="lbl">Nova senha (deixe em branco pra manter)</div><input id="fSenha" type="password" placeholder="Nova senha (opcional)">
    <div style="margin:-6px 0 10px">
      <button class="btn btn-ghost" style="font-size:11px;padding:5px 10px" onclick="resetarSenhaPadrao('${id}')">🔄 Resetar p/ senha padrão (12345)</button>
      ${f.precisaTrocarSenha?'<span class="badge" style="background:#3a2a00;color:#ffd23f;margin-left:6px">🔑 Aguardando troca no próximo login</span>':''}
    </div>
    ${htmlPermsBlock(perms)}
    <div class="lbl">Nível (referência)</div>
    <select id="fNivel">
      <option value="expedicao" ${f.nivel==='expedicao'?'selected':''}>Expedição</option>
      <option value="financeiro_atacado" ${f.nivel==='financeiro_atacado'?'selected':''}>Financeiro Atacado</option>
      <option value="vendedor" ${f.nivel==='vendedor'?'selected':''}>Vendedor</option>
      <option value="conferente" ${f.nivel==='conferente'?'selected':''}>Conferente</option>
      <option value="lider_caixa" ${f.nivel==='lider_caixa'?'selected':''}>Líder de Caixa</option>
      <option value="gerente" ${f.nivel==='gerente'?'selected':''}>Gerente</option>
      <option value="admin" ${f.nivel==='admin'?'selected':''}>Admin</option>
    </select>
    <div class="lbl">Vendedor Bling (pra vincular as vendas no Frente de Caixa)</div>
    ${htmlVendedorBusca(f)}
    <div class="lbl">Código de confirmação (Frente de Caixa)</div>
    <div style="background:#0f0d24;border:1px solid #514c96;border-radius:9px;padding:10px;margin-bottom:10px;font-size:13px">
      Código: <b style="color:#FF0082;font-size:16px">${esc(f.codigoConfirmacao||"—")}</b>
      ${!f.codigoConfirmacao?`<button class="btn btn-ghost" style="font-size:11px;padding:5px 10px;margin-left:8px" onclick="gerarCodigo('${id}')">🔄 Gerar código</button>`:""}
      <div class="lbl" style="margin-top:8px">PIN de confirmação ${f.temPin?"(já configurado — deixe em branco pra manter)":"(ainda não configurado)"}</div>
      <input id="fPin" type="password" placeholder="PIN de confirmação" style="width:100%">
      ${perms.some(p=>GRUPOS_AUTORIZAM_PDV.includes(p))?`
      <div class="muted" style="margin-top:8px;font-size:12px;background:#1c1846;border-radius:6px;padding:8px">
        Esse funcionário pode autorizar ações no Frente de Caixa. Pra autorizar, ele digita:<br>
        <b>ID</b>: dia de hoje + código (ex: código ${esc(f.codigoConfirmacao||"T01")} no dia 27 → <code>27${esc(f.codigoConfirmacao||"T01")}</code>)<br>
        <b>Senha</b>: PIN + dia de hoje (ex: PIN 1234 no dia 27 → <code>123427</code>)
      </div>`:""}
    </div>
    <div id="fMsg"></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-mag" style="flex:1" onclick="salvarEditar('${id}')">💾 Salvar</button>
      <button class="btn btn-ghost" style="flex:1" onclick="fecharModal()">Cancelar</button>
    </div>`;
  renderAbasLista();
}

async function resetarSenhaPadrao(id){
  if(!confirm("Resetar a senha desse funcionário pra padrão (12345)? Ele vai precisar trocar no próximo login.")) return;
  try{
    const r=await fetch(B+"/api/funcionarios/"+id,{method:"PATCH",headers:{"Content-Type":"application/json","X-Auth-Token":b13GetSession()?.token||""},body:JSON.stringify({resetarSenhaPadrao:true})});
    const j=await r.json();
    if(r.ok&&j.ok){ alert("✅ Senha resetada para 12345."); await carregar(); abrirEditar(id); }
    else alert(j.erro||"Erro ao resetar senha");
  }catch(e){ alert("Erro de conexão"); }
}

async function salvarNovo(){
  const nome=document.getElementById("fNome").value.trim();
  const senha=document.getElementById("fSenha").value;
  const nivel=document.getElementById("fNivel").value;
  const permissoes=PERMS_ATUAL.slice();
  if(!nome||!senha){ document.getElementById("fMsg").innerHTML=`<div class="err">Preencha nome e senha</div>`; return; }
  if(!permissoes.length){ document.getElementById("fMsg").innerHTML=`<div class="err">Selecione ao menos uma permissão</div>`; return; }
  try{
    const vendedorBlingId=document.getElementById("fVendedorId")?.value||"";
    const vendedorBlingNome=vendedorBlingId?(document.getElementById("fVendedorAtual").querySelector("b")?.textContent||""):"";
    const r=await fetch(B+"/api/funcionarios",{method:"POST",headers:{"Content-Type":"application/json","X-Auth-Token":b13GetSession()?.token||""},body:JSON.stringify({nome,login:document.getElementById("fLogin").value.trim().toLowerCase().replace(/\s+/g,""),senha,nivel,permissoes,vendedorBlingId,vendedorBlingNome})});
    const j=await r.json();
    if(r.ok&&j.ok){ fecharModal(); msg=`<div class="ok">✅ Funcionário criado!</div>`; carregar(); }
    else document.getElementById("fMsg").innerHTML=`<div class="err">${esc(j.erro||"Erro")}</div>`;
  }catch(e){ document.getElementById("fMsg").innerHTML=`<div class="err">Erro de conexão</div>`; }
}

async function gerarCodigo(id){
  try{
    const r=await fetch(B+"/api/funcionarios/"+id,{method:"PATCH",headers:{"Content-Type":"application/json","X-Auth-Token":b13GetSession()?.token||""},body:JSON.stringify({gerarCodigo:true})});
    const j=await r.json();
    if(r.ok&&j.ok){ await carregar(); abrirEditar(id); }
    else alert(j.erro||"Erro ao gerar código");
  }catch(e){ alert("Erro de conexão"); }
}

async function salvarEditar(id){
  const nome=document.getElementById("fNome").value.trim();
  const senha=document.getElementById("fSenha").value;
  const nivel=document.getElementById("fNivel").value;
  const login=document.getElementById("fLogin").value.trim().toLowerCase();
  const permissoes=PERMS_ATUAL.slice();
  const pinConfirmacao=document.getElementById("fPin")?.value||"";
  if(!permissoes.length){ document.getElementById("fMsg").innerHTML=`<div class="err">Selecione ao menos uma permissão</div>`; return; }
  const vendedorBlingId=document.getElementById("fVendedorId")?.value||"";
  const vendedorBlingNome=vendedorBlingId?(document.getElementById("fVendedorAtual").querySelector("b")?.textContent||""):"";
  const body={nome,nivel,login,permissoes,vendedorBlingId,vendedorBlingNome}; if(senha) body.senha=senha; if(pinConfirmacao) body.pinConfirmacao=pinConfirmacao;
  try{
    const r=await fetch(B+"/api/funcionarios/"+id,{method:"PATCH",headers:{"Content-Type":"application/json","X-Auth-Token":b13GetSession()?.token||""},body:JSON.stringify(body)});
    const j=await r.json();
    if(r.ok&&j.ok){ fecharModal(); msg=`<div class="ok">✅ Funcionário atualizado!</div>`; carregar(); }
    else if(r.status===401){
      // sessão expirou — avisa e manda pro login (não perde o trabalho por um erro genérico)
      document.getElementById("fMsg").innerHTML=`<div class="err">Sua sessão expirou. Você vai ser levado pro login pra entrar de novo.</div>`;
      setTimeout(()=>{ try{ localStorage.removeItem("b13sess"); }catch(e){} location.href="/login?next="+encodeURIComponent(location.pathname); },1800);
    }
    else document.getElementById("fMsg").innerHTML=`<div class="err">${esc(j.erro||"Erro")}</div>`;
  }catch(e){ document.getElementById("fMsg").innerHTML=`<div class="err">Erro de conexão</div>`; }
}

async function toggleAtivo(id,ativo){
  if(!confirm(`${ativo?'Ativar':'Desativar'} este funcionário?`)) return;
  try{
    await fetch(B+"/api/funcionarios/"+id,{method:"PATCH",headers:{"Content-Type":"application/json","X-Auth-Token":b13GetSession()?.token||""},body:JSON.stringify({ativo})});
    carregar();
  }catch(e){}
}

document.getElementById("app").innerHTML=`<div class="top"><img src="${LOGO}"></div>`;
document.querySelector(".top img").src=LOGO;
if(logado) carregar(); else render();
</script>
