<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B13 — Painel de Pedidos</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
  :root{--mag:#FF0082;--indigo:#181542}
  html,body{height:100%;background:#0b0920;color:#fff;overflow:hidden}
  .top{height:8vh;display:flex;align-items:center;gap:16px;padding:0 24px;background:linear-gradient(90deg,#262366,#181542);border-bottom:3px solid var(--mag)}
  .top img{height:5vh}
  .top .t{font-size:3vh;font-weight:900;letter-spacing:1px}
  .top .sp{flex:1}
  .top .hora{font-size:2.4vh;font-weight:800;color:#cfc9f5}
  .grade{height:92vh;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:#000}
  .quad{display:flex;flex-direction:column;overflow:hidden;padding:1.4vh 1.6vw}
  .quad h2{font-size:2.6vh;font-weight:900;margin-bottom:1vh;display:flex;align-items:center;gap:10px;flex-shrink:0}
  .quad .qtd{font-size:1.8vh;opacity:.7;font-weight:700}
  .lista{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:0.9vh}
  .ped{background:rgba(255,255,255,.07);border-radius:10px;padding:1vh 1.2vw;display:flex;align-items:center;gap:12px;font-size:2.3vh}
  .ped .num{font-weight:900;font-size:2.6vh}
  .ped .cli{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.9}
  .ped .extra{font-size:1.9vh;font-weight:700}
  .vazio{opacity:.4;font-size:2vh;padding:2vh 0}

  /* cores por quadrante */
  .q-aguardando{background:#1a1840}
  .q-aguardando h2{color:#ffd23f}
  .q-separando{background:#0d2440}
  .q-separando h2{color:#29ABE2}
  .q-separando .ped .extra{color:#7fd4ff}
  .q-pendencia{background:#3a0d18}
  .q-pendencia h2{color:#ff5f8f}
  .q-separado{background:#0a2a18}
  .q-separado h2{color:#3ce88a}

  .ped-pend{background:rgba(255,0,80,.15);border:2px solid #ff5f8f}
  .ped-pend .aviso{color:#ff8fae;font-weight:900;font-size:2vh;animation:pisca 1s steps(1) infinite}
  @keyframes pisca{ 50%{opacity:0} }

  .ped-pronto{background:rgba(60,232,138,.14);border:2px solid #3ce88a}
  .ped-pronto .extra{color:#3ce88a;font-weight:900;animation:pulsePronto 1.4s ease-in-out infinite}
  @keyframes pulsePronto{ 0%,100%{opacity:1} 50%{opacity:.55} }
</style>
</head>
<body>
<div class="top">
  <img src="/logo" onerror="this.style.display='none'">
  <div class="t">ACOMPANHAMENTO DE PEDIDOS</div>
  <div class="sp"></div>
  <div class="hora" id="hora"></div>
</div>
<div class="grade">
  <div class="quad q-aguardando">
    <h2>⏳ Aguardando separação <span class="qtd" id="c-aguardando"></span></h2>
    <div class="lista" id="aguardando"></div>
  </div>
  <div class="quad q-separando">
    <h2>🔧 Em separação <span class="qtd" id="c-separando"></span></h2>
    <div class="lista" id="separando"></div>
  </div>
  <div class="quad q-pendencia">
    <h2>⚠️ Pedidos com pendência <span class="qtd" id="c-pendencia"></span></h2>
    <div class="lista" id="pendencia"></div>
  </div>
  <div class="quad q-separado">
    <h2>✅ Pronto para retirada <span class="qtd" id="c-separado"></span></h2>
    <div class="lista" id="separado"></div>
  </div>
</div>

<script>
const BACKEND=(location.protocol.indexOf("http")===0)?"":"https://b13-bling-backend-production.up.railway.app";
const esc=(s)=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const brl=(v)=>"R$ "+(+v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});

function relogio(){
  const el=document.getElementById("hora");
  if(el) el.textContent=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}
setInterval(relogio,1000); relogio();

function pedHtml(p,tipo){
  if(tipo==="pendencia") return `
    <div class="ped ped-pend">
      <span class="num">#${esc(p.numero)}</span>
      <span class="cli">${esc(p.cliente)}</span>
      <span class="aviso">COMPARECER AO CAIXA DO ATACADO!</span>
    </div>`;
  if(tipo==="separado") return `
    <div class="ped ped-pronto">
      <span class="num">#${esc(p.numero)}</span>
      <span class="cli">${esc(p.cliente)}</span>
      <span class="extra">PRONTO PARA RETIRADA</span>
    </div>`;
  if(tipo==="separando") return `
    <div class="ped">
      <span class="num">#${esc(p.numero)}</span>
      <span class="cli">${esc(p.cliente)}</span>
      <span class="extra">👤 ${esc(p.funcionario)}</span>
    </div>`;
  return `
    <div class="ped">
      <span class="num">#${esc(p.numero)}</span>
      <span class="cli">${esc(p.cliente)}</span>
    </div>`;
}

function preenche(id,lista,tipo){
  const box=document.getElementById(id);
  const cont=document.getElementById("c-"+id);
  if(cont) cont.textContent="("+lista.length+")";
  if(!lista.length){ box.innerHTML=`<div class="vazio">Nenhum pedido</div>`; return; }
  box.innerHTML=lista.map(p=>pedHtml(p,tipo)).join("");
}

async function atualizar(){
  try{
    const j=await fetch(BACKEND+"/api/painel-pedidos").then(r=>r.json());
    if(j.erro) return;
    preenche("aguardando",j.aguardando||[],"aguardando");
    preenche("separando",j.separando||[],"separando");
    preenche("pendencia",j.pendencia||[],"pendencia");
    preenche("separado",j.separado||[],"separado");
  }catch(e){ /* mantém a última tela em caso de falha momentânea */ }
}

atualizar();
setInterval(atualizar,10000); // atualiza a cada 10s
</script>
</body>
</html>
