function fixar(id, daqui, limpar) { const v = limpar ? "" : num("pv-" + id); if (!limpar && !v) { aviso("Digite o valor previsto.", true); return; } agir("/api/gastos-fixos/previsto", { id, mes: MES, valor: v, aPartirDe: !!daqui }, limpar ? "" : "Previsto salvo."); }
function pausar(id, ativo) { agir("/api/gastos-fixos/item", { id, ativo }, ativo ? "Voltou a ser esperado." : "Pausado: sai do total e dos alertas."); }
function nota(id) { agir("/api/gastos-fixos/item", { id, nota: num("nt-" + id) }, "Nota salva."); }
function mudarTipo(id, tipo) { agir("/api/gastos-fixos/tipo", { id, tipo }, tipo === "variavel" ? "Agora é variável todo mês: a conta nasce estimada e você confirma o valor real." : "Agora é fixo."); }
function valorReal(id) { agir("/api/gastos-fixos/valor-real", { id, mes: MES, valor: num("vr-" + id) }, "Valor real salvo. Ele passa a ser a estimativa dos próximos meses."); }
function criarNovo() { const t = document.querySelector('input[name=nt]:checked').value; NOVO = false; agir("/api/gastos-fixos/novo", { nome: num("nn"), grupo: document.getElementById("ng").value, cod: document.getElementById("nc").value, tipo: t, valor: num("nv"), dia: num("nd"), repetir: document.getElementById("nr").checked && !!num("nv") }, "Gasto criado."); }
function fixaMensal(id) { agir("/api/gastos-fixos/fixa-mensal", { id, valor: num("rv-" + id), dia: num("rd-" + id) }, "Pronto: a conta passa a nascer sozinha todo mês no Contas a Pagar."); }
function lancar(id) { agir("/api/gastos-fixos/lancar", { id, mes: MES, valor: num("lv-" + id) }, "Lançado no Contas a Pagar."); }
function adicionar(sid, cod, grupo) { agir("/api/gastos-fixos/novo", { nome: num("sn-" + sid), cod, grupo, valor: num("sv-" + sid), dia: num("sd-" + sid), repetir: document.getElementById("sr-" + sid).checked && !!num("sv-" + sid), sugestaoId: sid }, "Gasto adicionado à lista."); }
function dispensar(sid) { agir("/api/gastos-fixos/sugestao", { id: sid, acao: "dispensar" }); }

async function carregarProv() { const r = await api("/api/gastos-fixos/provisao"); if (!r.ok) { aviso(r.j.erro || "Não consegui calcular.", true); return; } PROV = r.j; if (ABA === "prov") desenhar(); }
const pct1 = n => String(Math.round(n * 100) / 100).replace(".", ",");
function vProv() { if (!PROV) return '<div class="card mini" style="margin-top:8px">Calculando…</div>'; const P = PROV, c = P.calculo, g = P.config;
  const lin = (t, v, s) => `<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #221e4f"><span>${t}${s ? ' <span class="mini">' + s + "</span>" : ""}</span><b>${brl(v)}</b></div>`;
  const opt = D.meses.map(m => `<option value="${m}" ${g.desde === m ? "selected" : ""}>${NM[Number(m.split("-")[1]) - 1]}/${m.split("-")[0]}</option>`).join("");
  const inp = (id, rot, val, ex) => `<label class="mini" style="display:flex;flex-direction:column;gap:2px;flex:1 1 110px">${rot}<input id="${id}" inputmode="decimal" value="${val == null ? "" : String(val).replace(".", ",")}" ${ex || ""} style="width:100%;text-align:right"></label>`;
  return `<div class="card" style="margin-top:8px"><b>🧮 Provisão de 13º, férias e encargos (lucro real)</b>
    <div class="mini" style="margin:4px 0 8px">O 13º e as férias só saem do caixa no fim do ano, mas o custo existe todo mês. Aqui o sistema reconhece <b style="color:#fff">1/12 do 13º</b> e <b style="color:#fff">1/12 das férias com 1/3</b> por mês, mais os encargos que incidem sobre eles (INSS patronal, RAT, terceiros e FGTS, porque na empresa de lucro real não há o Simples). O valor entra nos custos como lançamento calculado, sem criar conta a pagar.</div>
    ${lin("Base: salários por mês", c.base, c.fonte)}${lin("13º (1/12)", c.p13)}${lin("Férias com 1/3", c.pFerias)}${lin("Encargos sobre 13º e férias", c.encargosSobre, pct1(c.encargosPct) + "%")}${c.rescisao > 0 ? lin("Rescisões (estimativa)", c.rescisao, "aviso prévio e multa de 40%") : ""}
    <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:16px"><b>Provisão por mês</b><b style="color:#7fe3a8">${brl(c.total)} <span class="mini">(${pct1(c.totalPct)}% da folha)</span></b></div>
    <div class="mini">Por ano: <b style="color:#fff">${brl(c.total * 12)}</b>. Pago em dezembro: 13º de <b style="color:#fff">${brl(c.decimoTerceiroDez)}</b> (um mês de folha com encargos), mais férias de <b style="color:#fff">${brl(c.feriasAno)}</b> ao longo do ano.</div></div>
    <div class="card" style="margin-top:8px"><b>Ajustes</b><div class="mini" style="margin:3px 0 6px">Confirme as taxas com o contador. O RAT depende da atividade e do FAP da empresa, e os "terceiros" (Sistema S e salário-educação) dependem do enquadramento.</div>
    <div class="ac">${inp("pv-inss", "INSS patronal %", g.inss)}${inp("pv-rat", "RAT/FAP %", g.rat)}${inp("pv-ter", "Terceiros %", g.terceiros)}${inp("pv-fgts", "FGTS %", g.fgts)}${inp("pv-rot", "Rotatividade ao ano %", g.rotatividade)}</div>
    <div class="ac">${inp("pv-base", "Base mensal (vazio = automática)", g.baseManual, 'placeholder="' + String(c.base).replace(".", ",") + '"')}<label class="mini" style="display:flex;flex-direction:column;gap:2px;flex:1 1 140px">Provisionar a partir de<select id="pv-desde" style="background:#151233;border:1px solid #37327a;border-radius:8px;color:#fff;padding:6px">${opt}</select></label></div>
    <label class="mini" style="display:flex;gap:6px;align-items:center;margin-top:6px"><input type="checkbox" id="pv-ativo" ${g.ativo ? "checked" : ""} style="width:16px;height:16px"> Lançar a provisão nos custos todo mês</label>
    <div class="ac"><button class="gb v" onclick="salvarProv()">Salvar e recalcular</button></div></div>
    <div class="card" style="margin-top:8px"><b>Situação até agora</b>
    ${g.ativo ? `<div class="mini" style="margin-top:4px">Provisionado desde ${NM[Number(g.desde.split("-")[1]) - 1].toLowerCase()}: <b style="color:#fff">${P.mesesProvisionados} mês(es)</b>, somando <b style="color:#fff">${brl(P.acumulado)}</b>. Do 13º, já reservado ${brl(P.acumulado13)} de ${brl(P.decimoTerceiroPrevisto)}${P.faltaParaDecimo > 0 ? ` (<b style="color:#ff8aa3">faltam ${brl(P.faltaParaDecimo)}</b> porque a provisão começou tarde no ano)` : ""}.</div>` : '<div class="mini" style="margin-top:4px">A provisão ainda não está sendo lançada. Marque a opção acima e escolha de quando começar. Se escolher janeiro, os meses anteriores entram nos custos do sistema como foram calculados (a planilha de janeiro a setembro não muda).</div>'}
    ${P.jaProvisionadoNasFichas > 0 ? `<div class="ins atencao" style="margin-top:8px"><b>👀 Já existe provisão nas fichas de funcionários</b><div class="t">As fichas de custo já geram ${brl(P.jaProvisionadoNasFichas)} por mês em "Provisão de 13º e férias". O cálculo acima usa só o salário de quem ainda não tem provisão na ficha, para não contar em dobro.</div></div>` : ""}
    <div class="ins" style="margin-top:8px"><b>ℹ️ Quando pagar o 13º e as férias</b><div class="t">Lance o pagamento na conta <b>9.4 Baixa de provisão (13º e férias pagos)</b>, que fica fora do resultado. Se lançar em "Salários" (5.1.1), o custo conta duas vezes: uma pela provisão e outra pelo pagamento. No lucro real, a provisão é o que vale para o resultado do mês.</div></div></div>`; }
async function salvarProv() { const v = id => document.getElementById(id).value.trim(), corpo = { inss: v("pv-inss"), rat: v("pv-rat"), terceiros: v("pv-ter"), fgts: v("pv-fgts"), rotatividade: v("pv-rot"), baseManual: v("pv-base"), desde: v("pv-desde"), ativo: document.getElementById("pv-ativo").checked };
  const r = await api("/api/gastos-fixos/provisao/config", { method: "POST", body: JSON.stringify(corpo) }); if (!r.ok) { aviso(r.j.erro || "Não consegui salvar.", true); return; } aviso("Provisão salva e recalculada."); PROV = null; await carregar(MES); }
carregar();
</script>
</body>
</html>
