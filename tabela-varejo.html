<script>
const B = location.protocol.indexOf("http") === 0 ? "" : "https://app.b13bebidas.com.br";
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const brl = n => n == null ? "—" : Number(n).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const num2 = n => n == null ? "" : Number(n).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const numBR = t => { t = String(t == null ? "" : t).trim(); if (!t) return null; const n = t.includes(",") ? Number(t.replace(/\./g, "").replace(",", ".")) : /^\d{1,3}(\.\d{3})+$/.test(t) ? Number(t.replace(/\./g, "")) : Number(t); return isFinite(n) ? n : NaN; };
function token() { try { return (b13GetSession() || {}).token || ""; } catch (e) { return ""; } }
async function api(p, op) { op = op || {}; const r = await fetch(B + p, { ...op, headers: { "Content-Type": "application/json", "X-Auth-Token": token() } }); const j = await r.json().catch(() => ({})); return { ok: r.ok, j }; }
let D = null, FILTRO = "todos", BUSCA = "", ORD = "nome", MET = "margem", EST = new Map(), FORCA = null, SEL = new Set(), MAIS = {}, _tb = null;
const LIM = 60;
// ---------- cálculos ----------
const pct = (p, c) => !(p > 0) || !(c > 0) ? null : MET === "markup" ? (p - c) / c * 100 : (p - c) / p * 100;
const fmtPct = v => v == null ? "—" : v.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "%";
const cls = v => v == null ? "nd" : v < 10 ? "bad" : v < 20 ? "med" : "ok";
const badge = (p, c) => { const v = pct(p, c); return `<span class="pc ${cls(MET === "markup" ? (v == null ? null : v / (1 + v / 100)) : v)}">${fmtPct(v)}</span>`; };
const precoVar = i => i.precoNovo || i.precoVarejo, qtdEf = i => i.qtdFardo || i.caixaQtd || null, fardoEf = i => i.precoFardo || i.precoFardoAtacado || null;
const fardoUn = i => { const q = qtdEf(i), f = fardoEf(i); return q && f ? f / q : null; };
const margemVar = i => { const v = pct(precoVar(i), i.custo); return v; };
// ---------- dados ----------
async function carregar() { const { ok, j } = await api("/api/tabela-varejo"); if (!ok) { document.getElementById("lista").innerHTML = `<div class="err">${esc(j.erro || "Não consegui carregar.")}</div>`; return; } D = j; prepararFiltros(); render(); }
function prepararFiltros() { const ir = document.getElementById("ir"); ir.innerHTML = '<option value="">Ir para a categoria…</option><option value="__sem">Sem categoria</option>' + D.categorias.map(c => `<option value="${esc(c.id)}">${esc(c.nome)} (${c.qtd})</option>`).join(""); }
const nomeCat = id => id ? ((D.categorias.find(c => c.id === id) || {}).nome || "") : "Sem categoria";
function filtrados() { const q = BUSCA.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""), toks = q.split(/\s+/).filter(Boolean);
  let L = D.itens.filter(i => { if (toks.length) { const t = (i.nome + " " + i.codigo).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); if (!toks.every(x => t.includes(x))) return false; }
    if (FILTRO === "sem") return !i.categoriaId; if (FILTRO === "baixa") { const m = margemVar(i); return m != null && (MET === "markup" ? m < 18 : m < 15); } if (FILTRO === "alt") return i.precoNovo && i.precoNovo !== i.precoVarejo;
    if (FILTRO === "semcusto") return !i.custo; if (FILTRO === "semfardo") return !fardoEf(i); if (FILTRO === "estoque") return i.estoque > 0; return true; });
  const ordF = { nome: (a, b) => a.nome.localeCompare(b.nome), margem: (a, b) => (margemVar(a) ?? 1e9) - (margemVar(b) ?? 1e9), margemmaior: (a, b) => (margemVar(b) ?? -1e9) - (margemVar(a) ?? -1e9), varejo: (a, b) => (precoVar(b) || 0) - (precoVar(a) || 0), estoque: (a, b) => b.estoque - a.estoque }[ORD];
  return L.sort(ordF); }
// ---------- desenho ----------
function celulas(i) { const pv = precoVar(i), alt = i.precoNovo && i.precoNovo !== i.precoVarejo, q = qtdEf(i), fe = fardoEf(i), fu = fardoUn(i);
  return `<div class="vals">
    <div class="cel"><div class="t">Custo</div><div class="v" id="c-${i.id}">${i.custo ? brl(i.custo) : '<span style="color:#ffd23f;font-size:13px">sem custo</span>'}</div></div>
    <div class="cel"><div class="t">Varejo ${alt ? '<span style="color:#ffd23f">· rascunho</span>' : ""}</div><input id="v-${i.id}" inputmode="decimal" enterkeyhint="done" value="${pv ? num2(pv) : ""}" placeholder="0,00" oninput="digitando('${i.id}','v')" onchange="salvar('${i.id}','v')" onkeydown="if(event.key==='Enter')this.blur()"><div id="pv-${i.id}">${badge(pv, i.custo)}${alt ? ` <span class="sub">Bling ${brl(i.precoVarejo)}</span>` : ""}</div></div>
    <div class="cel"><div class="t">Atacado</div><div class="v">${i.precoAtacado ? brl(i.precoAtacado) : '<span style="color:#6f6aa8">—</span>'}</div><div>${i.precoAtacado ? badge(i.precoAtacado, i.custo) : ""}</div></div>
    <div class="cel"><div class="t">Fardo ${i.precoFardo ? "" : (i.precoFardoAtacado ? '<span class="sub">(do atacado)</span>' : "")}</div><input id="f-${i.id}" inputmode="decimal" enterkeyhint="done" value="${i.precoFardo ? num2(i.precoFardo) : ""}" placeholder="${i.precoFardoAtacado ? num2(i.precoFardoAtacado) : "0,00"}" oninput="digitando('${i.id}','f')" onchange="salvar('${i.id}','f')" onkeydown="if(event.key==='Enter')this.blur()">
      <div class="mini"><input id="q-${i.id}" inputmode="numeric" enterkeyhint="done" value="${i.qtdFardo || ""}" placeholder="${i.caixaQtd || "un"}" oninput="digitando('${i.id}','q')" onchange="salvar('${i.id}','q')" onkeydown="if(event.key==='Enter')this.blur()"><span class="sub">un</span><span id="fu-${i.id}" class="sub">${fu ? brl(fu) + "/un" : ""}</span></div><div id="pf-${i.id}">${fu ? badge(fu, i.custo) : ""}</div></div>
  </div>`; }
function linha(i) { const alt = i.precoNovo && i.precoNovo !== i.precoVarejo;
  return `<div class="rw ${alt ? "alt" : ""}" id="r-${i.id}"><div><input type="checkbox" ${SEL.has(i.id) ? "checked" : ""} onchange="marcar('${i.id}',this.checked)" style="width:18px;height:18px"></div>

    ${celulas(i)}</div>`; }
function render() { if (!D) return; const L = filtrados(), grupos = new Map(); L.forEach(i => { const k = i.categoriaId || ""; (grupos.get(k) || grupos.set(k, []).get(k)).push(i); });
  const ordem = [...(grupos.has("") ? [{ id: "", nome: "Sem categoria" }] : []), ...D.categorias.filter(c => grupos.has(c.id))], buscando = BUSCA.trim().length > 0; window._padrao = FORCA !== null ? FORCA : (buscando || L.length <= 250); const aberta = id => EST.has(id) ? EST.get(id) : window._padrao;
  const nAlt = D.itens.filter(i => i.precoNovo && i.precoNovo !== i.precoVarejo).length, nSem = D.itens.filter(i => !i.categoriaId).length;
  document.getElementById("resumo").textContent = `${D.itens.length} produtos · ${L.length} na lista${nSem ? " · " + nSem + " sem categoria" : ""}`;
  const chip = (k, t) => `<span class="chp ${FILTRO === k ? "on" : ""}" onclick="FILTRO='${k}';render()">${t}</span>`;
  document.getElementById("chips").innerHTML = chip("todos", "Todos") + chip("sem", `Sem categoria (${nSem})`) + chip("baixa", "Margem baixa") + chip("alt", `Com alteração (${nAlt})`) + chip("semcusto", "Sem custo") + chip("semfardo", "Sem fardo") + chip("estoque", "Com estoque");
  document.getElementById("lista").innerHTML = ordem.length ? ordem.map(c => { const itens = grupos.get(c.id), isOpen = aberta(c.id), ms = itens.map(margemVar).filter(v => v != null), med = ms.length ? ms.reduce((a, b) => a + b, 0) / ms.length : null, lim = MAIS[c.id] || LIM;
    return `<div><div class="gh ${isOpen ? "aberta" : ""}" onclick="alternar('${c.id}')"><span class="seta">▶</span><b>${esc(c.nome)} <span class="ic">(${itens.length})</span></b><span class="ic">média</span><span class="pc ${cls(med)}">${fmtPct(med)}</span><label onclick="event.stopPropagation()" class="ic" style="display:flex;gap:4px;align-items:center"><input type="checkbox" style="width:16px;height:16px" ${itens.every(i => SEL.has(i.id)) ? "checked" : ""} onchange="marcarGrupo('${c.id}',this.checked)">todos</label></div>
      ${isOpen ? itens.slice(0, lim).map(linha).join("") + (itens.length > lim ? `<div style="text-align:center;padding:10px"><button class="btn btn-ghost" onclick="MAIS['${c.id}']=${lim + LIM};render()">Mostrar mais ${Math.min(LIM, itens.length - lim)} (faltam ${itens.length - lim})</button></div>` : "") : ""}</div>`; }).join("") : '<div class="ic" style="padding:14px">Nenhum produto neste filtro.</div>';
  barras(); }
function alternar(id) { const atual = EST.has(id) ? EST.get(id) : window._padrao; EST.set(id, !atual); render(); }
function abrirTodas(sim) { EST.clear(); FORCA = sim; render(); }
function irCat(id) { if (!id) return; const k = id === "__sem" ? "" : id; EST.set(k, true); FILTRO = "todos"; render(); const el = [...document.querySelectorAll(".gh")].find(g => g.getAttribute("onclick") === `alternar('${k}')`); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); document.getElementById("ir").value = ""; }
function buscar() { clearTimeout(_tb); _tb = setTimeout(() => { BUSCA = document.getElementById("busca").value; MAIS = {}; EST.clear(); FORCA = null; render(); }, 250); }
// ---------- edição ----------
function digitando(id, k) { const i = D.itens.find(x => x.id === id); if (!i) return; const g = x => numBR(document.getElementById(x + "-" + id).value);
  if (k === "v") { const v = g("v"); document.getElementById("pv-" + id).innerHTML = badge(v > 0 ? v : null, i.custo) + (v > 0 && v !== i.precoVarejo ? ` <span class="sub">Bling ${brl(i.precoVarejo)}</span>` : ""); }
  else { const f = g("f") > 0 ? g("f") : (i.precoFardoAtacado || null), q = g("q") > 0 ? g("q") : (i.caixaQtd || null), fu = f && q ? f / q : null; document.getElementById("fu-" + id).textContent = fu ? brl(fu) + "/un" : ""; document.getElementById("pf-" + id).innerHTML = fu ? badge(fu, i.custo) : ""; } }
async function salvar(id, k) { const i = D.itens.find(x => x.id === id); if (!i) return; const el = document.getElementById(k + "-" + id), bruto = el.value.trim(), v = numBR(bruto);
  if (bruto && (isNaN(v) || v <= 0)) { avisar("Valor inválido. Use números, por exemplo 9,50."); el.value = k === "v" ? num2(precoVar(i)) : k === "f" ? (i.precoFardo ? num2(i.precoFardo) : "") : (i.qtdFardo || ""); digitando(id, k); return; }
  const corpo = k === "v" ? { precoNovo: bruto ? v : "" } : k === "f" ? { precoFardo: bruto ? v : "" } : { qtdFardo: bruto ? Math.round(v) : "" };
  const { ok, j } = await api("/api/tabela-varejo/item/" + id, { method: "PUT", body: JSON.stringify(corpo) }); if (!ok) { avisar(j.erro || "Não consegui salvar."); return; }
  Object.assign(i, j.item); atualizarLinha(i); piscaOk(id); barras(); }
function atualizarLinha(i) { const r = document.getElementById("r-" + i.id); if (!r) return; const alt = i.precoNovo && i.precoNovo !== i.precoVarejo; r.classList.toggle("alt", !!alt); const v = r.querySelector(".vals"); const foco = document.activeElement && document.activeElement.id; const tmp = document.createElement("div"); tmp.innerHTML = celulas(i); v.replaceWith(tmp.firstElementChild); if (foco) { const e = document.getElementById(foco); if (e) e.blur && 0; } }
const piscaOk = id => { const e = document.getElementById("ok-" + id); if (!e) return; e.classList.add("on"); setTimeout(() => e.classList.remove("on"), 1800); };
async function mudarCat(id, v) { if (v === "__nova") { novaCategoria(id); render(); return; } const { ok, j } = await api("/api/tabela-varejo/item/" + id, { method: "PUT", body: JSON.stringify({ categoriaId: v }) }); if (!ok) { avisar(j.erro || "Não consegui mover."); render(); return; }
  const i = D.itens.find(x => x.id === id); Object.assign(i, j.item); await recarregarCategorias(); render(); }
async function recarregarCategorias() { const { ok, j } = await api("/api/tabela-varejo"); if (ok) { D.categorias = j.categorias; prepararFiltros(); } }
// ---------- seleção em lote ----------
function marcar(id, sim) { if (sim) SEL.add(id); else SEL.delete(id); barras(); }
function marcarGrupo(cid, sim) { filtrados().filter(i => (i.categoriaId || "") === cid).forEach(i => { if (sim) SEL.add(i.id); else SEL.delete(i.id); }); render(); }
function barras() { const bs = document.getElementById("barSel"), ba = document.getElementById("barAlt"), nAlt = D ? D.itens.filter(i => i.precoNovo && i.precoNovo !== i.precoVarejo).length : 0;
  bs.classList.toggle("on", SEL.size > 0); bs.style.bottom = nAlt ? "58px" : "0";
  if (SEL.size) bs.innerHTML = `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><b>${SEL.size} selecionado(s)</b><select id="lote" style="flex:1;min-width:150px"><option value="">Mover para…</option><option value="__sem">Sem categoria</option>${D.categorias.map(c => `<option value="${esc(c.id)}">${esc(c.nome)}</option>`).join("")}<option value="__nova">➕ Nova categoria…</option></select><button class="btn btn-mag" style="padding:7px 14px" onclick="moverLote()">Mover</button><button class="btn btn-ghost" style="padding:7px 12px" onclick="SEL.clear();render()">✕</button></div>`;
  ba.classList.toggle("on", nAlt > 0); if (nAlt) ba.innerHTML = `<div style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span>✏️ <b>${nAlt}</b> preço(s) de varejo alterado(s), ainda <b>só aqui</b></span><span style="display:flex;gap:6px"><button class="btn btn-mag" style="padding:7px 12px" onclick="abrirAplicar()">Aplicar no Bling</button><button class="btn btn-ghost" style="padding:7px 12px" onclick="descartar()">Descartar</button></span></div>`; }
async function moverLote() { const v = document.getElementById("lote").value; if (!v) { avisar("Escolha a categoria de destino."); return; } if (v === "__nova") { novaCategoria(null, true); return; }
  const { ok, j } = await api("/api/tabela-varejo/lote", { method: "POST", body: JSON.stringify({ ids: [...SEL], categoriaId: v === "__sem" ? "" : v }) }); if (!ok) { avisar(j.erro || "Não consegui mover."); return; }
  D.itens.forEach(i => { if (SEL.has(i.id)) i.categoriaId = v === "__sem" ? "" : v; }); SEL.clear(); await recarregarCategorias(); render(); avisar(j.movidos + " produto(s) movido(s).", true); }
// ---------- avisos e janelas ----------
function avisar(msg, ok) { const el = document.getElementById("msg"); el.innerHTML = `<span style="color:${ok ? "#3ce88a" : "#ff8aa3"}">${esc(msg)}</span>`; clearTimeout(avisar._t); avisar._t = setTimeout(() => { el.innerHTML = ""; }, 7000); }
const janela = h => { document.getElementById("mdlCorpo").innerHTML = h; document.getElementById("mdl").classList.add("aberto"); };
const fechar = () => document.getElementById("mdl").classList.remove("aberto");
document.getElementById("mdl").addEventListener("click", e => { if (e.target.id === "mdl") fechar(); });
function novaCategoria(paraItem, lote) { janela(`<h3 style="margin:0 0 6px">➕ Nova categoria</h3><input id="ncNome" placeholder="ex.: Cervejas, Refrigerantes, Águas…" autocomplete="off" onkeydown="if(event.key==='Enter')criarCat()"><div id="ncMsg" style="margin-top:6px"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-ghost" style="flex:1" onclick="fechar();render()">Cancelar</button><button class="btn btn-mag" style="flex:1" onclick="criarCat()">Criar</button></div>`); window._ncItem = paraItem || null; window._ncLote = !!lote; setTimeout(() => document.getElementById("ncNome").focus(), 50); }
async function criarCat() { const nome = document.getElementById("ncNome").value.trim(), msg = document.getElementById("ncMsg"); if (!nome) { msg.innerHTML = '<div class="err">Informe o nome.</div>'; return; }
  const { ok, j } = await api("/api/tabela-varejo/categorias", { method: "POST", body: JSON.stringify({ nome }) }); if (!ok) { msg.innerHTML = `<div class="err">${esc(j.erro || "Não consegui criar.")}</div>`; return; }
  D.categorias.push({ ...j.categoria, qtd: 0 }); prepararFiltros();
  if (window._ncItem) await mudarCat(window._ncItem, j.categoria.id); else if (window._ncLote) { document.getElementById("lote") && (document.getElementById("lote").value = j.categoria.id); fechar(); await moverLote(); return; }
  fechar(); render(); }
function abrirCategorias() { const L = D.categorias;
  janela(`<h3 style="margin:0 0 6px">⚙️ Categorias</h3><div class="ic" style="white-space:normal;margin-bottom:6px">Renomeie, mude a ordem ou apague. Apagar uma categoria devolve os produtos dela para "Sem categoria".</div>
    ${L.map((c, k) => `<div style="display:flex;gap:6px;align-items:center;margin:5px 0"><input id="rn-${c.id}" value="${esc(c.nome)}" onchange="renomear('${c.id}',this.value)" style="flex:1"><span class="ic">${c.qtd}</span><button class="btn btn-ghost" style="padding:5px 9px" ${k === 0 ? "disabled" : ""} onclick="moverCat('${c.id}','cima')">↑</button><button class="btn btn-ghost" style="padding:5px 9px" ${k === L.length - 1 ? "disabled" : ""} onclick="moverCat('${c.id}','baixo')">↓</button><button class="btn btn-ghost" style="padding:5px 9px" onclick="apagarCat('${c.id}')">🗑️</button></div>`).join("") || '<div class="ic">Nenhuma categoria ainda.</div>'}
    <div style="display:flex;gap:6px;margin-top:10px"><input id="ncNome" placeholder="Nova categoria" onkeydown="if(event.key==='Enter')criarCatLista()"><button class="btn btn-mag" style="padding:7px 14px" onclick="criarCatLista()">Criar</button></div><div id="ncMsg" style="margin-top:6px"></div><button class="btn btn-ghost" style="width:100%;margin-top:10px" onclick="fechar();render()">Fechar</button>`); }
async function criarCatLista() { const nome = document.getElementById("ncNome").value.trim(); if (!nome) return; const { ok, j } = await api("/api/tabela-varejo/categorias", { method: "POST", body: JSON.stringify({ nome }) }); if (!ok) { document.getElementById("ncMsg").innerHTML = `<div class="err">${esc(j.erro)}</div>`; return; } await recarregarCategorias(); abrirCategorias(); }
async function renomear(id, nome) { const { ok, j } = await api("/api/tabela-varejo/categorias/" + id, { method: "PUT", body: JSON.stringify({ nome }) }); if (!ok) { avisar(j.erro || "Não consegui renomear."); } await recarregarCategorias(); abrirCategorias(); }
async function moverCat(id, d) { await api("/api/tabela-varejo/categorias/" + id, { method: "PUT", body: JSON.stringify({ mover: d }) }); await recarregarCategorias(); abrirCategorias(); }
async function apagarCat(id) { const c = D.categorias.find(x => x.id === id); janela(`<h3 style="margin:0 0 6px">🗑️ Apagar "${esc(c.nome)}"?</h3><div class="ic" style="white-space:normal">Os ${c.qtd} produto(s) dela voltam para "Sem categoria". Os preços não mudam.</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-ghost" style="flex:1" onclick="abrirCategorias()">Cancelar</button><button class="btn btn-mag" style="flex:1" onclick="apagarCat2('${id}')">Apagar</button></div>`); }
async function apagarCat2(id) { await api("/api/tabela-varejo/categorias/" + id, { method: "DELETE" }); const r = await api("/api/tabela-varejo"); if (r.ok) { D = r.j; prepararFiltros(); } abrirCategorias(); }
async function importarAtacado() { const { ok, j } = await api("/api/tabela-varejo/importar-categorias-atacado", { method: "POST", body: "{}" }); if (!ok) { avisar(j.erro || "Não consegui importar."); return; } await carregar(); avisar(j.colocados ? `${j.colocados} produto(s) colocados em categorias (${j.criadas} categoria(s) nova(s)), usando a tabela de atacado.` : "Nenhum produto sem categoria combina com a tabela de atacado.", !!j.colocados); }
// ---------- aplicar no Bling ----------
function abrirAplicar() { const L = D.itens.filter(i => i.precoNovo && i.precoNovo !== i.precoVarejo);
  janela(`<h3 style="margin:0 0 4px">Aplicar no Bling</h3><div class="ic" style="white-space:normal;margin-bottom:6px">Estes preços de varejo vão substituir os do Bling. Leia o QR do dia (gerente, financeiro ou admin).</div>
    <div style="max-height:44vh;overflow:auto">${L.map(i => `<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #221e4f"><span style="min-width:0"><b>${esc(i.nome)}</b><br><span class="ic">${brl(i.precoVarejo)} → <b style="color:#fff">${brl(i.precoNovo)}</b></span></span><span style="text-align:right;white-space:nowrap" class="ic">margem<br>${fmtPct(pct(i.precoVarejo, i.custo))} → <b style="color:#fff">${fmtPct(pct(i.precoNovo, i.custo))}</b></span></div>`).join("")}</div>
    <input id="qr" type="password" placeholder="QR de autorização do dia" style="margin-top:8px" onkeydown="if(event.key==='Enter')aplicar()"><div id="apMsg" style="margin-top:8px"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-ghost" style="flex:1" onclick="fechar()">Cancelar</button><button class="btn btn-mag" style="flex:1" onclick="aplicar()">Aplicar ${L.length}</button></div>`); setTimeout(() => document.getElementById("qr").focus(), 60); }
async function aplicar() { const qr = document.getElementById("qr").value.trim(), msg = document.getElementById("apMsg"); if (!qr) { msg.innerHTML = '<div class="err">Leia o QR de autorização.</div>'; return; }
  let ids = D.itens.filter(i => i.precoNovo && i.precoNovo !== i.precoVarejo).map(i => i.id), feitos = 0, falhas = [];
  while (ids.length) { const lote = ids.splice(0, 20); msg.innerHTML = `<div class="ic">⏳ Enviando ao Bling… ${feitos + falhas.length} de ${feitos + falhas.length + lote.length + ids.length}</div>`;
    const { ok, j } = await api("/api/tabela-varejo/aplicar-bling", { method: "POST", body: JSON.stringify({ ids: lote, tokenQr: qr }) }); if (!ok) { msg.innerHTML = `<div class="err">${esc(j.erro || "Não consegui aplicar.")}</div>`; return; }
    (j.resultados || []).forEach(r => { if (r.ok) feitos++; else falhas.push(r); }); }
  await carregar(); msg.innerHTML = `<div style="color:#3ce88a;font-weight:800">✅ ${feitos} preço(s) aplicado(s) no Bling.</div>${falhas.length ? `<div class="err" style="white-space:normal">${falhas.length} não passaram: ${falhas.map(f => esc(f.erro)).join("; ")}</div>` : ""}`; setTimeout(() => { if (!falhas.length) fechar(); }, 1400); }
async function descartar() { janela(`<h3 style="margin:0 0 6px">Descartar rascunhos?</h3><div class="ic" style="white-space:normal">Os preços de varejo alterados aqui voltam para os do Bling. Nada foi enviado ao Bling.</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-ghost" style="flex:1" onclick="fechar()">Voltar</button><button class="btn btn-mag" style="flex:1" onclick="descartar2()">Descartar</button></div>`); }
async function descartar2() { await api("/api/tabela-varejo/descartar-rascunhos", { method: "POST", body: "{}" }); fechar(); await carregar(); }
function baixarCsv() { fetch(B + "/api/tabela-varejo.csv", { headers: { "X-Auth-Token": token() } }).then(r => r.blob()).then(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "tabela_varejo.csv"; a.click(); }); }
carregar();
