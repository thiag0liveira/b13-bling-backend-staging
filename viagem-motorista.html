<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minha viagem — B13 Bebidas</title>
<script src="/nav.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0f0d24;color:#fff;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .topo{background:#181433;border-bottom:2px solid #FF0082;padding:14px 16px;position:sticky;top:0;z-index:5}
  .topo h1{margin:0;font-size:17px}
  .muted{color:#9a95c9}
  .content{padding:14px}
  .card{background:#181433;border:1px solid #2c2660;border-radius:12px;padding:14px;margin-bottom:12px}
  .btn{border:none;border-radius:8px;padding:12px 16px;font-weight:800;font-size:14px;cursor:pointer;width:100%}
  .btn-mag{background:#FF0082;color:#fff}
  .btn-ghost{background:#241f4d;color:#fff}
  .btn-grn{background:#1f8f4e;color:#fff}
  .btn[disabled]{opacity:.5}
  .pedido{background:#0f0d24;border:1px solid #2c2660;border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer}
  .pedido.done{border-color:#2f9e6b;background:#0f2418}
  .badge{font-size:10px;font-weight:900;border-radius:5px;padding:2px 8px}
  input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #2c2660;background:#0f0d24;color:#fff;font-size:14px;margin-top:4px}
  label{font-size:12px;color:#9a95c9;display:block;margin-top:10px}
  .item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #201c48;font-size:13px}
  .modalBg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .modal{background:#181433;border-radius:16px 16px 0 0;padding:16px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
  canvas#assinaturaCv{width:100%;height:160px;background:#fff;border-radius:8px;touch-action:none}
  canvas#assinaturaCvGrande{width:100%;height:42vh;background:#fff;border-radius:8px;touch-action:none}
  .err{color:#ff8090}
  .segbtn{flex:1;padding:10px 6px;border-radius:8px;border:1px solid #2c2660;background:#0f0d24;color:#9a95c9;font-weight:800;font-size:12px;cursor:pointer;text-align:center}
  .segbtn.on-ok{background:#0f3a24;border-color:#2f9e6b;color:#3ce88a}
  .segbtn.on-problema{background:#3a0010;border-color:#b3341f;color:#ff8f7a}
  .stepper{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
  .stepbtn{width:40px;height:40px;border-radius:8px;border:none;background:#241f4d;color:#fff;font-size:20px;font-weight:900;cursor:pointer}
  .pagLinha{display:flex;gap:6px;margin-top:6px;align-items:center}
  .formasGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}
  .formaBtn{background:#1c1846;border:2px solid #514c96;border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;font-size:11px;font-weight:800;min-height:40px;display:flex;align-items:center;justify-content:center}
  .formaBtn.sel{border-color:#FF0082;background:#2a1a4d}
  .fullscreen{position:fixed;inset:0;background:#0f0d24;z-index:30;display:flex;flex-direction:column;overflow-y:auto}
  #mapaMotorista{width:100%;flex:1;background:#181433}
</style>
</head>
<body>
<div id="app"><div class="content"><div class="muted">Carregando sua viagem…</div></div></div>
<script>
var TOKEN = location.pathname.split("/viagem/")[1];
var B = location.protocol.indexOf("http") === 0 ? "" : "https://b13-bling-backend-production.up.railway.app";
var V = null; // dados da viagem
var PEDIDO_ATIVO = null; // pedido aberto no modal de finalizar
var PROBLEMAS = {}; // produtoId -> quantidade com problema (no modal atual)
var ITEM_STATUS = {}; // produtoId -> 'ok' | 'problema'
var PAGAMENTOS = []; // [{formaId, valor}]
var OCORRENCIA = { descricao: "", url: null, tipo: null };
var FORMAS = [];
var PIX_BANCOS = { bancos: ["Inter", "Santander", "Itaú"], padrao: "Inter" };
var TAXA_CARTAO = 0.035;
function ehFormaCartao(nome){ return /cr[eé]dito/i.test(nome||"") || /d[eé]bito/i.test(nome||""); }
function ehFormaPix(nome){ return /pix/i.test(nome||"") && /banco/i.test(nome||""); }
function comTaxa(valor){ return +(Number(valor||0) * (1 + TAXA_CARTAO)).toFixed(2); }
var _watchId = null;
var ULTIMA_POS = null; // {lat,lng}
function iniciarRastreamento(){
  if(!("geolocation" in navigator) || _watchId != null) return;
  _watchId = navigator.geolocation.watchPosition(function(pos){
    ULTIMA_POS = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    fetch(B + "/api/viagem/" + TOKEN + "/localizacao", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(ULTIMA_POS)
    }).catch(function(){});
    var el = document.getElementById("localizacaoAtualLinha");
    if(el) el.innerHTML = htmlLinhaLocalizacao();
  }, function(){ /* usuário negou ou indisponível — segue sem localização */ }, { enableHighAccuracy:true, maximumAge:15000, timeout:20000 });
}
function pegarPosicaoAgora(){
  return new Promise(function(resolve){
    if(!("geolocation" in navigator)) { resolve(ULTIMA_POS); return; }
    navigator.geolocation.getCurrentPosition(function(pos){
      resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
    }, function(){ resolve(ULTIMA_POS); }, { enableHighAccuracy:true, timeout:8000, maximumAge:5000 });
  });
}
function htmlLinhaLocalizacao(){
  if(!ULTIMA_POS) return '<span class="muted">📍 Obtendo localização…</span>';
  return '<span class="muted">📍 Localização compartilhada — </span><a href="https://maps.google.com/?q=' + ULTIMA_POS.lat + ',' + ULTIMA_POS.lng + '" target="_blank" style="color:#7fd4ff">ver no mapa</a>';
}

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function brl(v){ return "R$ " + Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function decodePolyline(str){
  var index=0, lat=0, lng=0, coords=[];
  while(index<str.length){
    var b, shift=0, result=0;
    do{ b=str.charCodeAt(index++)-63; result|=(b&0x1f)<<shift; shift+=5; }while(b>=0x20);
    lat += result&1 ? ~(result>>1) : result>>1;
    shift=0; result=0;
    do{ b=str.charCodeAt(index++)-63; result|=(b&0x1f)<<shift; shift+=5; }while(b>=0x20);
    lng += result&1 ? ~(result>>1) : result>>1;
    coords.push([lat/1e5, lng/1e5]);
  }
  return coords;
}

function carregar(){
  fetch(B + "/api/viagem/" + TOKEN).then(function(r){ return r.json(); }).then(function(j){
    if(j.erro){ document.getElementById("app").innerHTML = '<div class="content"><div class="card"><b class="err">'+esc(j.erro)+'</b></div></div>'; return; }
    V = j;
    if(V.localizacaoAtual && !ULTIMA_POS) ULTIMA_POS = { lat:V.localizacaoAtual.lat, lng:V.localizacaoAtual.lng };
    if(!V.finalizada) iniciarRastreamento();
    // mesma lógica do caixa atacado: pix (banco/máquina), dinheiro, débito,
    // crédito à vista — mais o boleto ADEGA 13, que o caixa atacado não usa mas
    // a entrega precisa.
    fetch(B + "/api/formas-pagamento").then(function(r){ return r.json(); }).then(function(fj){
      var todas = (fj.data||[]).filter(function(f){ return f.situacao!=="I"; });
      var padroes = [/pix/i, /dinheiro/i, /d[eé]bito/i, /cr[eé]dito.*vista/i];
      var filtradas = todas.filter(function(f){
        var n = f.descricao||f.nome||"";
        return padroes.some(function(p){ return p.test(n); }) && !/pix.*bling.*conta/i.test(n);
      });
      var pixReal = filtradas.find(function(f){ return /pix/i.test(f.descricao||f.nome||""); });
      var semPix = filtradas.filter(function(f){ return !/pix/i.test(f.descricao||f.nome||""); });
      var boleto = todas.find(function(f){ return /^boleto adega ?13/i.test(f.descricao||f.nome||""); });
      var lista = [];
      if(pixReal){
        lista.push({ id: pixReal.id, nome: "Pix Banco", pixTipo: "banco" });
        lista.push({ id: pixReal.id, nome: "Pix Máquina", pixTipo: "maquina" });
      }
      lista = lista.concat(semPix.map(function(f){ return { id:f.id, nome: f.descricao||f.nome }; }));
      if(boleto) lista.push({ id: boleto.id, nome: boleto.descricao||boleto.nome });
      FORMAS = lista.length ? lista : todas.map(function(f){ return { id:f.id, nome: f.descricao||f.nome }; });
    }).catch(function(){});
    fetch(B + "/api/pix-bancos").then(function(r){ return r.json(); }).then(function(bj){
      if(bj && Array.isArray(bj.bancos) && bj.bancos.length) PIX_BANCOS = bj;
    }).catch(function(){});
    // vincula o usuário logado nesse aparelho, se tiver sessão do sistema
    try{
      var f = typeof b13GetSession === "function" ? b13GetSession() : null;
      if(f && f.id){
        fetch(B + "/api/viagem/" + TOKEN + "/vincular-usuario", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({funcionarioId:f.id}) });
      }
    }catch(e){}
    render();
  }).catch(function(){
    document.getElementById("app").innerHTML = '<div class="content"><div class="card">Erro ao carregar a viagem. Confira sua internet e recarregue a página.</div></div>';
  });
}

function render(){
  const scrollY = window.scrollY;
  renderInterno();
  requestAnimationFrame(function(){ window.scrollTo(0, scrollY); });
}
function renderInterno(){
  if(!V) return;
  var app = document.getElementById("app");
  if(V.finalizada){
    app.innerHTML = '<div class="topo"><h1>🚚 ' + esc(V.carroNome) + '</h1><div class="muted">Viagem finalizada</div></div>' +
      '<div class="content"><div class="card" style="text-align:center">' +
        '<div style="font-size:40px">✅</div>' +
        '<div style="font-weight:900;margin-top:6px">Viagem encerrada</div>' +
        '<div class="muted" style="margin-top:6px">KM inicial: ' + V.kmInicial + ' · KM final: ' + V.kmFinal + ' · Rodou ' + (V.kmFinal - V.kmInicial).toFixed(1) + ' km</div>' +
        '<div class="muted" style="margin-top:10px">' + V.feitas + ' de ' + V.totalEntregas + ' entrega(s) concluída(s)</div>' +
        (V.localizacaoFinal ? '<div class="muted" style="margin-top:10px">📍 Encerrada em <a href="https://maps.google.com/?q=' + V.localizacaoFinal.lat + ',' + V.localizacaoFinal.lng + '" target="_blank" style="color:#7fd4ff">ver no mapa</a></div>' : '') +
      '</div></div>';
    return;
  }
  var pendentes = V.entregas.filter(function(e){ return e.status !== "entregue"; });
  var feitos = V.entregas.filter(function(e){ return e.status === "entregue"; });
  var proxima = pendentes[0];
  var h = '<div class="topo"><h1>🚚 ' + esc(V.carroNome) + '</h1>' +
    '<div class="muted">' + (V.motoristaNome ? esc(V.motoristaNome) + " · " : "") + 'KM inicial ' + V.kmInicial + ' · ' + V.feitas + '/' + V.totalEntregas + ' entregues</div>' +
    '<div id="localizacaoAtualLinha" style="margin-top:4px;font-size:12px">' + htmlLinhaLocalizacao() + '</div></div>';
  h += '<div class="content">';
  if(proxima){
    h += '<div class="card" style="border-color:#ffd23f"><div class="badge" style="background:#3a2a00;color:#ffd23f">🧭 SUGESTÃO: ENTREGAR PRIMEIRO</div>' +
      '<div style="font-weight:900;margin-top:8px;font-size:15px">Pedido ' + esc(proxima.numero) + ' — ' + esc(proxima.clienteNome) + '</div>' +
      '<div class="muted" style="margin-top:4px">📍 ' + esc(proxima.endereco || "endereço não informado") + '</div></div>';
  }
  h += '<div style="font-weight:900;margin:6px 0">📦 Entregas dessa viagem (em ordem sugerida)</div>';
  V.entregas.forEach(function(e, ix){
    var done = e.status === "entregue";
    h += '<div class="pedido' + (done?' done':'') + '" onclick="' + (done?'':'abrirEntrega(' + e.pedidoId + ')') + '">' +
      '<div style="display:flex;justify-content:space-between;align-items:center">' +
        '<div><b>' + (ix+1) + '. Pedido ' + esc(e.numero) + '</b> — ' + esc(e.clienteNome) + '</div>' +
        (done ? '<span class="badge" style="background:#0f3a24;color:#3ce88a">✅ ENTREGUE</span>' : '<span class="badge" style="background:#3a2a00;color:#ffd23f">PENDENTE</span>') +
      '</div>' +
      '<div class="muted" style="font-size:12px;margin-top:4px">📍 ' + esc(e.endereco || "—") + ' · ' + brl(e.total) + '</div>' +
      (done && e.entrega ? '<div class="muted" style="font-size:11px;margin-top:4px">Recebido: ' + brl(e.entrega.valorFinal) + (e.entrega.valorProblema>0 ? ' (descontado ' + brl(e.entrega.valorProblema) + ' de avaria/falta)':'') + ' · ' + (e.entrega.pagamentos||[]).map(function(p){ return esc(p.formaNome)+': '+brl(p.valor); }).join(", ") + (e.entrega.ocorrencia ? ' · 📸 ocorrência registrada' : '') + '</div>' : '') +
    '</div>';
  });
  h += '<button class="btn btn-ghost" style="margin-top:10px" onclick="abrirMapaViagem()">🗺️ Ver mapa da rota</button>';
  h += '<button class="btn btn-ghost" style="margin-top:10px" onclick="abrirFinalizarViagem()">🏁 Finalizar viagem (informar KM final)</button>';
  h += '</div>';
  app.innerHTML = h;
}

function abrirEntrega(pedidoId){
  PEDIDO_ATIVO = V.entregas.find(function(e){ return e.pedidoId === pedidoId; });
  ITEM_STATUS = {}; // produtoId -> 'ok' | 'problema'
  PROBLEMAS = {}; // produtoId -> quantidade com problema
  PAGAMENTOS = [];
  OCORRENCIA = { descricao: "", url: null, tipo: null };
  (PEDIDO_ATIVO.itens || []).forEach(function(it){ ITEM_STATUS[it.produtoId || 0] = "ok"; });
  renderModalEntrega();
}
function fecharModalDom(){
  // só tira o modal da tela, sem mexer em PEDIDO_ATIVO — usada quando ainda vamos
  // PRECISAR do pedido ativo logo em seguida (ex.: indo pra tela de assinatura)
  var m = document.getElementById("modalWrap");
  if(m) m.remove();
}
function fecharModal(){
  fecharModalDom();
  PEDIDO_ATIVO = null;
}
function valorProblemaTotal(){
  var e = PEDIDO_ATIVO, soma = 0;
  (e.itens||[]).forEach(function(it){
    var pid = it.produtoId || 0;
    if(ITEM_STATUS[pid] === "problema") soma += (PROBLEMAS[pid]||0) * Number(it.valor||0);
  });
  return +soma.toFixed(2);
}
function valorFinalCalc(){ return Math.max(0, +(PEDIDO_ATIVO.total - valorProblemaTotal()).toFixed(2)); }

function marcarItemStatus(produtoId, status){
  ITEM_STATUS[produtoId] = status;
  if(status === "problema" && !PROBLEMAS[produtoId]){
    PROBLEMAS[produtoId] = 1; // padrão: 1 unidade, não a quantidade toda — ajustável depois
  }
  renderModalEntrega();
}
function mudarQtdProblema(produtoId, delta){
  var it = (PEDIDO_ATIVO.itens||[]).find(function(i){ return (i.produtoId||0) === produtoId; });
  var max = it ? it.quantidade : 99;
  PROBLEMAS[produtoId] = Math.max(1, Math.min(max, (PROBLEMAS[produtoId]||1) + delta));
  renderModalEntrega();
}
function digitarQtdProblema(produtoId, valor){
  var it = (PEDIDO_ATIVO.itens||[]).find(function(i){ return (i.produtoId||0) === produtoId; });
  var max = it ? it.quantidade : 99;
  PROBLEMAS[produtoId] = Math.max(1, Math.min(max, parseInt(valor) || 1));
  renderModalEntrega();
}
function marcarQtdProblemaTudo(produtoId){
  var it = (PEDIDO_ATIVO.itens||[]).find(function(i){ return (i.produtoId||0) === produtoId; });
  PROBLEMAS[produtoId] = it ? it.quantidade : 1;
  renderModalEntrega();
}

// ---- pagamentos: botões pré-definidos, igual ao caixa atacado (tocar adiciona,
// pode repetir a mesma forma — ex.: 2 Pix) ----
// quanto do total (produto+frete, sem taxa) já está coberto: pagamentos que não são
// cartão entram cheios; os de cartão entram sem a taxa embutida (V/1,035) -- mesma
// lógica do caixa atacado (totalPagoProduto)
function totalPagoSemTaxa(){
  return +PAGAMENTOS.reduce(function(s,p){
    var v = Number(p.valor)||0;
    if(ehFormaCartao(p.formaNome)) return s + v/(1+TAXA_CARTAO);
    return s + v;
  }, 0).toFixed(2);
}
function selecionarFormaPagamento(formaId, formaNome){
  const falta = +(valorFinalCalc() - totalPagoSemTaxa()).toFixed(2);
  const valor = ehFormaCartao(formaNome) ? (falta>0?comTaxa(falta):0) : (falta>0?falta:0);
  PAGAMENTOS.push({ formaId: formaId, formaNome: formaNome, valor: valor });
  renderModalEntrega();
}
function mudarValorPagamento(ix, valor){ PAGAMENTOS[ix].valor = valor === "" ? 0 : Number(valor); }
function removerLinhaPagamento(ix){ PAGAMENTOS.splice(ix,1); renderModalEntrega(); }
function somaPagamentos(){ return +PAGAMENTOS.reduce(function(s,p){ return s + (Number(p.valor)||0); }, 0).toFixed(2); }

// ---- ocorrência (foto/vídeo + descrição) ----
function toggleOcorrencia(){
  var box = document.getElementById("ocorrenciaBox");
  if(box) box.style.display = box.style.display === "none" ? "" : "none";
}
function anexarOcorrencia(input){
  var file = input.files && input.files[0];
  if(!file) return;
  var msgEl = document.getElementById("ocorrenciaMsg");
  msgEl.innerHTML = '<span class="muted">Enviando anexo…</span>';
  var reader = new FileReader();
  reader.onload = function(){
    fetch(B + "/api/comprovante/" + PEDIDO_ATIVO.pedidoId, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ dataUrl: reader.result, tipo: file.type.indexOf("video")===0?"video":"foto",
        evento:"ocorrencia_entrega", funcionarioId: V.motoristaFuncionarioId||null, funcionarioNome: V.motoristaNome||null })
    }).then(function(r){ return r.json(); }).then(function(j){
      if(j.erro){ msgEl.innerHTML = '<span class="err">' + esc(j.erro) + '</span>'; return; }
      OCORRENCIA.url = j.url; OCORRENCIA.tipo = file.type.indexOf("video")===0?"video":"foto";
      msgEl.innerHTML = '<span style="color:#3ce88a">✅ Anexo enviado.</span>';
    }).catch(function(){ msgEl.innerHTML = '<span class="err">Erro ao enviar o anexo.</span>'; });
  };
  reader.readAsDataURL(file);
}

function renderModalEntrega(){
  var e = PEDIDO_ATIVO;
  var itensHtml = (e.itens||[]).map(function(it){
    var pid = it.produtoId || 0;
    var st = ITEM_STATUS[pid] || "ok";
    return '<div style="border-bottom:1px solid #201c48;padding:8px 0">' +
      '<div style="font-size:13px">' + esc(it.descricao) + ' <span class="muted">(' + it.quantidade + 'un · ' + brl(it.valor) + ' cada)</span></div>' +
      '<div style="display:flex;gap:6px;margin-top:6px">' +
        '<div class="segbtn ' + (st==="ok"?"on-ok":"") + '" onclick="marcarItemStatus(' + pid + ',\'ok\')">✅ Está tudo OK</div>' +
        '<div class="segbtn ' + (st==="problema"?"on-problema":"") + '" onclick="marcarItemStatus(' + pid + ',\'problema\')">⚠️ Não está OK</div>' +
      '</div>' +
      (st === "problema" ? '<div class="stepper">' +
        '<button type="button" class="stepbtn" onclick="mudarQtdProblema(' + pid + ',-1)">−</button>' +
        '<div style="min-width:80px;text-align:center">' +
          '<input type="number" min="1" max="' + it.quantidade + '" value="' + (PROBLEMAS[pid]||1) + '" style="width:56px;text-align:center;padding:6px;margin-top:0" onchange="digitarQtdProblema(' + pid + ',this.value)">' +
          '<div class="muted" style="font-size:10px">de ' + it.quantidade + ' com problema</div>' +
        '</div>' +
        '<button type="button" class="stepbtn" onclick="mudarQtdProblema(' + pid + ',1)">+</button>' +
        '<button type="button" class="btn btn-ghost" style="width:auto;padding:8px 10px;font-size:11px" onclick="marcarQtdProblemaTudo(' + pid + ')">Tudo (' + it.quantidade + ')</button>' +
      '</div>' : '') +
    '</div>';
  }).join("");
  var formasBotoes = '<div class="formasGrid">' + FORMAS.map(function(f){
    var qtd = PAGAMENTOS.filter(function(p){ return p.formaId == f.id && p.formaNome === f.nome; }).length;
    return '<div class="formaBtn' + (qtd?' sel':'') + '" onclick="selecionarFormaPagamento(' + f.id + ',\'' + esc(f.nome).replace(/'/g,"\\'") + '\')">' + esc(f.nome) + (qtd>1?' <b style="color:#ffd23f">×'+qtd+'</b>':'') + '</div>';
  }).join("") + '</div>';
  var pagamentosHtml = PAGAMENTOS.map(function(p, ix){
    return '<div class="pagLinha">' +
      '<span class="muted" style="flex:1.2;font-size:12px">' + esc(p.formaNome) + '</span>' +
      '<input type="number" step="0.01" placeholder="Valor" style="flex:1" value="' + p.valor + '" onchange="mudarValorPagamento(' + ix + ',this.value)">' +
      '<button type="button" class="stepbtn" style="width:34px;height:34px;font-size:14px;background:#3a0010;color:#ff8f7a" onclick="removerLinhaPagamento(' + ix + ')">✕</button>' +
    '</div>';
  }).join("");
  var valorProb = valorProblemaTotal(), valorFinal = valorFinalCalc();
  var diff = +(valorFinal - totalPagoSemTaxa()).toFixed(2);
  var html = '<div class="modalBg" id="modalWrap"><div class="modal">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
      '<h3 style="margin:0">Pedido ' + esc(e.numero) + '</h3>' +
      '<button class="btn btn-ghost" style="width:auto;padding:6px 12px" onclick="fecharModal()">✕</button>' +
    '</div>' +
    '<div class="muted">' + esc(e.clienteNome) + '</div>' +
    '<div style="margin-top:10px"><b style="font-size:13px">Confira cada produto</b></div>' +
    itensHtml +
    '<div style="display:flex;justify-content:space-between;margin-top:10px;font-size:14px">' +
      '<span class="muted">Total do pedido' + (e.frete>0 ? ' (já inclui frete de ' + brl(e.frete) + ')' : '') + '</span><span>' + brl(e.total) + '</span></div>' +
    (valorProb>0 ? '<div style="display:flex;justify-content:space-between;font-size:13px;color:#ff8f7a"><span>Desconto (avaria/falta)</span><span>-' + brl(valorProb) + '</span></div>' : '') +
    '<div style="display:flex;justify-content:space-between;font-weight:900;font-size:16px;margin-top:2px"><span>Valor a receber</span><span style="color:#3ce88a">' + brl(valorFinal) + '</span></div>' +
    '<div style="margin-top:12px"><b style="font-size:13px">Forma(s) de pagamento recebida(s)</b>' +
    '<div class="muted" style="font-size:11px;margin:4px 0">Toque na forma pra adicionar. Pode repetir a mesma forma (ex.: 2 Pix).</div>' +
    formasBotoes +
    pagamentosHtml +
    (Math.abs(diff)>0.009 ? '<div class="muted" style="font-size:11px;margin-top:4px;color:#ffd23f">' + (diff>0 ? 'Falta ' + brl(diff) : 'Está ' + brl(-diff) + ' a mais') + ' pra fechar certinho — precisa bater exato pra continuar.</div>' : '') +
    '</div>' +
    '<button type="button" class="btn btn-ghost" style="margin-top:12px" onclick="toggleOcorrencia()">📸 Abrir ocorrência (foto/vídeo)</button>' +
    '<div id="ocorrenciaBox" style="display:none;margin-top:8px">' +
      '<textarea id="ocorrenciaTxt" rows="2" placeholder="Descreva o que aconteceu…" onchange="OCORRENCIA.descricao=this.value"></textarea>' +
      '<input type="file" accept="image/*,video/*" capture="environment" style="margin-top:6px" onchange="anexarOcorrencia(this)">' +
      '<div id="ocorrenciaMsg" style="margin-top:4px;font-size:12px"></div>' +
    '</div>' +
    '<div id="msgEntrega" style="margin-top:8px"></div>' +
    '<button class="btn btn-mag" style="margin-top:12px" onclick="irParaAssinatura()">Continuar pra assinatura →</button>' +
  '</div></div>';
  var antigo = document.getElementById("modalWrap");
  var modalAntigo = antigo ? antigo.querySelector(".modal") : null;
  var scrollAnterior = modalAntigo ? modalAntigo.scrollTop : 0;
  if(antigo) antigo.remove();
  var wrap = document.createElement("div");
  wrap.innerHTML = html;
  document.body.appendChild(wrap.firstElementChild);
  var modalNovo = document.querySelector("#modalWrap .modal");
  if(modalNovo) modalNovo.scrollTop = scrollAnterior;
}

function irParaAssinatura(){
  try{
    var msgEl = document.getElementById("msgEntrega");
    var temForma = PAGAMENTOS.some(function(p){ return p.formaId && Number(p.valor)>0; });
    if(valorFinalCalc()>0 && !temForma){
      msgEl.innerHTML = '<span class="err">Escolha ao menos uma forma de pagamento com valor.</span>';
      msgEl.scrollIntoView({behavior:"smooth", block:"center"});
      return;
    }
    // trava de verdade: o valor pago (descontando a taxa embutida nos pagamentos de
    // cartão) precisa bater exatamente com o valor a receber — não deixa fechar nem
    // a maior nem a menor.
    var diffFinal = +(valorFinalCalc() - totalPagoSemTaxa()).toFixed(2);
    if(Math.abs(diffFinal) > 0.009){
      var msgDiff = (diffFinal>0 ? 'Falta ' + brl(diffFinal) : 'Está ' + brl(-diffFinal) + ' a mais') + ' pra fechar certinho com o valor a receber (' + brl(valorFinalCalc()) + ').';
      msgEl.innerHTML = '<span class="err">' + msgDiff + ' Ajuste o(s) valor(es) antes de continuar (confira se não adicionou a mesma forma 2x sem querer).</span>';
      msgEl.scrollIntoView({behavior:"smooth", block:"center"});
      alert("⚠️ " + msgDiff + "\n\nConfira as formas de pagamento adicionadas antes de continuar.");
      return;
    }
    const temPix = PAGAMENTOS.some(function(p){ return ehFormaPix(p.formaNome); });
    if(temPix){ perguntarBancoPix(); return; }
    fecharModalDom();
    renderAssinaturaGrande();
  }catch(erroInesperado){
    alert("Deu um erro inesperado ao tentar continuar: " + erroInesperado.message + "\n\nTira um print dessa mensagem e manda pro suporte.");
  }
}
function perguntarBancoPix(){
  const linhasPix = [];
  PAGAMENTOS.forEach(function(p, i){ if(ehFormaPix(p.formaNome)) linhasPix.push(i); });
  const bancos = PIX_BANCOS.bancos && PIX_BANCOS.bancos.length ? PIX_BANCOS.bancos : ["Inter","Santander","Itaú"];
  const pad = PIX_BANCOS.padrao && bancos.indexOf(PIX_BANCOS.padrao)>=0 ? PIX_BANCOS.padrao : bancos[0];
  const html = '<div class="modalBg" id="modalPix"><div class="modal">' +
    '<h3 style="margin:0 0 8px">🏦 Pix — qual banco recebeu?</h3>' +
    linhasPix.map(function(ix, k){
      return '<div style="border:1px solid #2c2660;border-radius:10px;padding:8px;margin-bottom:8px">' +
        '<div style="font-weight:700;margin-bottom:6px;font-size:12px">Pix' + (linhasPix.length>1 ? ' #'+(k+1) : '') + ' — ' + brl(PAGAMENTOS[ix].valor) + '</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
        bancos.map(function(b){
          return '<div class="formaBtn' + ((PAGAMENTOS[ix].banco||pad)===b?' sel':'') + '" style="min-width:80px" onclick="PAGAMENTOS[' + ix + '].banco=\'' + b + '\';perguntarBancoPix()">' + b + '</div>';
        }).join("") + '</div></div>';
    }).join("") +
    '<div style="display:flex;gap:8px;margin-top:6px">' +
      '<button class="btn btn-ghost" style="flex:1" onclick="fecharModais()">Cancelar</button>' +
      '<button class="btn btn-mag" style="flex:1" onclick="confirmarBancoPix()">Confirmar</button>' +
    '</div>' +
  '</div></div>';
  var atual = document.getElementById("modalPix");
  if(atual) atual.remove();
  const wrap = document.createElement("div"); wrap.innerHTML = html; document.body.appendChild(wrap.firstElementChild);
}
function fecharModais(){ const m = document.getElementById("modalPix"); if(m) m.remove(); }
function confirmarBancoPix(){
  try{
    fecharModais();
    fecharModalDom();
    renderAssinaturaGrande();
  }catch(erroInesperado){
    alert("Deu um erro inesperado ao continuar: " + erroInesperado.message + "\n\nTira um print dessa mensagem e manda pro suporte.");
  }
}

// ---- assinatura (canvas com toque/mouse, tela cheia) ----
var _sigCtx = null, _sigDesenhando = false;
function renderAssinaturaGrande(){
  var e = PEDIDO_ATIVO;
  var html = '<div class="fullscreen">' +
    '<div class="topo"><h1>✍️ Assinatura do cliente</h1><div class="muted">Pedido ' + esc(e.numero) + ' — ' + esc(e.clienteNome) + ' · ' + brl(valorFinalCalc()) + '</div></div>' +
    '<div class="content" style="flex:1;display:flex;flex-direction:column">' +
      '<div class="muted" style="margin-bottom:6px;font-size:12px">Peça pro cliente assinar com o dedo na área abaixo</div>' +
      '<div style="font-size:10px;line-height:1.4;color:#9a95c9;text-align:center;margin-bottom:6px;padding:0 4px">AO RECEBER SUAS MERCADORIAS, confira e relate quaisquer divergências no ato do recebimento.<br><b style="color:#ffd23f">NÃO ACEITAMOS RECLAMAÇÕES POSTERIORES.</b></div>' +
      '<canvas id="assinaturaCvGrande"></canvas>' +
      '<div style="display:flex;gap:8px;margin-top:8px">' +
        '<button class="btn btn-ghost" onclick="limparAssinatura()">↺ Limpar</button>' +
        '<button class="btn btn-ghost" onclick="voltarParaItens()">← Voltar</button>' +
      '</div>' +
      '<div id="msgEntrega" style="margin-top:8px"></div>' +
      '<button class="btn btn-grn" style="margin-top:10px" onclick="confirmarEntrega()">✅ Finalizar entrega</button>' +
    '</div>' +
  '</div>';
  var wrap = document.createElement("div");
  wrap.innerHTML = html;
  document.body.appendChild(wrap.firstElementChild);
  configurarAssinatura();
}
function voltarParaItens(){
  var f = document.querySelector(".fullscreen");
  if(f) f.remove();
  renderModalEntrega();
}
function configurarAssinatura(){
  var cv = document.getElementById("assinaturaCvGrande");
  if(!cv) return;
  var rect = cv.getBoundingClientRect();
  cv.width = rect.width; cv.height = rect.height;
  _sigCtx = cv.getContext("2d");
  _sigCtx.lineWidth = 2.5; _sigCtx.lineCap = "round"; _sigCtx.strokeStyle = "#000";
  function pos(ev){
    var r = cv.getBoundingClientRect();
    var t = ev.touches ? ev.touches[0] : ev;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function iniciar(ev){ _sigDesenhando = true; var p = pos(ev); _sigCtx.beginPath(); _sigCtx.moveTo(p.x,p.y); ev.preventDefault(); }
  function mover(ev){ if(!_sigDesenhando) return; var p = pos(ev); _sigCtx.lineTo(p.x,p.y); _sigCtx.stroke(); ev.preventDefault(); }
  function parar(){ _sigDesenhando = false; }
  cv.addEventListener("mousedown", iniciar); cv.addEventListener("mousemove", mover); window.addEventListener("mouseup", parar);
  cv.addEventListener("touchstart", iniciar, {passive:false}); cv.addEventListener("touchmove", mover, {passive:false}); cv.addEventListener("touchend", parar);
}
function limparAssinatura(){
  var cv = document.getElementById("assinaturaCvGrande");
  if(cv && _sigCtx) _sigCtx.clearRect(0,0,cv.width,cv.height);
}

function confirmarEntrega(){
 try{
  var msgEl = document.getElementById("msgEntrega");
  var cv = document.getElementById("assinaturaCvGrande");
  var vazio = true;
  try{
    var d = cv.getContext("2d").getImageData(0,0,cv.width,cv.height).data;
    for(var i=3;i<d.length;i+=4){ if(d[i]!==0){ vazio=false; break; } }
  }catch(e){ vazio=false; }
  if(vazio){ msgEl.innerHTML = '<span class="err">Peça pro cliente assinar antes de finalizar.</span>'; return; }
  var itensProblema = Object.keys(ITEM_STATUS).filter(function(k){ return ITEM_STATUS[k]==="problema"; }).map(function(k){ return {produtoId:Number(k), quantidade:PROBLEMAS[k]||1}; });
  var pagamentos = PAGAMENTOS.filter(function(p){ return p.formaId && Number(p.valor)>0; }).map(function(p){
    return { formaId:p.formaId, formaNome: p.formaNome||"", valor:Number(p.valor), banco:p.banco||null };
  });
  msgEl.innerHTML = '<span class="muted">Salvando…</span>';
  fetch(B + "/api/viagem/" + TOKEN + "/entrega/" + PEDIDO_ATIVO.pedidoId, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ itensProblema:itensProblema, pagamentos:pagamentos,
      assinaturaDataUrl: cv.toDataURL("image/png"),
      ocorrencia: (OCORRENCIA.url || OCORRENCIA.descricao) ? OCORRENCIA : null })
  }).then(function(r){ return r.json(); }).then(function(j){
    if(j.erro){ msgEl.innerHTML = '<span class="err">' + esc(j.erro) + '</span>'; return; }
    if(j.atendidoOk===false){ alert("O pagamento foi registrado, mas não consegui fechar o pedido no Bling (" + (j.atendidoErro||"erro") + "). Avise o suporte — o pedido pode continuar aparecendo como 'Em rota'."); }
    var f = document.querySelector(".fullscreen");
    if(f) f.remove();
    PEDIDO_ATIVO = null;
    carregar();
  }).catch(function(){ msgEl.innerHTML = '<span class="err">Erro de conexão. Tenta de novo.</span>'; });
 }catch(erroInesperado){
   alert("Deu um erro inesperado ao finalizar: " + erroInesperado.message + "\n\nTira um print dessa mensagem e manda pro suporte.");
 }
}

function abrirFinalizarViagem(){
  var pendentes = V.entregas.filter(function(e){ return e.status !== "entregue"; }).length;
  var aviso = pendentes ? '<div class="card" style="border-color:#ff8090"><b class="err">⚠️ Ainda tem ' + pendentes + ' entrega(s) pendente(s) nessa viagem.</b> Se finalizar mesmo assim, elas continuam marcadas como não entregues.</div>' : '';
  var html = '<div class="modalBg" id="modalWrap"><div class="modal">' +
    '<h3 style="margin:0 0 8px">🏁 Finalizar viagem</h3>' + aviso +
    '<div class="muted">KM inicial: ' + V.kmInicial + '</div>' +
    '<label>KM final (do painel do carro agora)</label>' +
    '<input id="kmFinalInp" type="number" inputmode="numeric" placeholder="Ex: 45230">' +
    '<div id="msgFin" style="margin-top:8px"></div>' +
    '<div style="display:flex;gap:8px;margin-top:12px">' +
      '<button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>' +
      '<button class="btn btn-grn" onclick="confirmarFinalizarViagem()">Confirmar</button>' +
    '</div>' +
  '</div></div>';
  var wrap = document.createElement("div"); wrap.innerHTML = html; document.body.appendChild(wrap.firstElementChild);
}
function confirmarFinalizarViagem(){
 try{
  var msgEl = document.getElementById("msgFin");
  var km = parseFloat(document.getElementById("kmFinalInp").value);
  if(!(km>=0)){ msgEl.innerHTML = '<span class="err">Informe o KM final.</span>'; return; }
  msgEl.innerHTML = '<span class="muted">Pegando localização e salvando…</span>';
  pegarPosicaoAgora().then(function(pos){
    var body = { kmFinal:km };
    if(pos){ body.lat = pos.lat; body.lng = pos.lng; }
    return fetch(B + "/api/viagem/" + TOKEN + "/finalizar", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
  }).then(function(r){ return r.json(); }).then(function(j){
    if(j.erro){ msgEl.innerHTML = '<span class="err">' + esc(j.erro) + '</span>'; return; }
    fecharModal();
    carregar();
  }).catch(function(){ msgEl.innerHTML = '<span class="err">Erro de conexão.</span>'; });
 }catch(erroInesperado){
   alert("Deu um erro inesperado ao finalizar a viagem: " + erroInesperado.message + "\n\nTira um print dessa mensagem e manda pro suporte.");
 }
}

function abrirMapaViagem(){
  const partida = ULTIMA_POS || V.lojaCoord || { lat:-19.917, lng:-43.934 };
  const usandoLocalAtual = !!ULTIMA_POS;
  const html = '<div class="fullscreen">' +
    '<div class="topo"><h1>🗺️ Mapa da rota</h1><div class="muted" id="mapaMotoristaInfo">' + esc(V.carroNome) + (usandoLocalAtual ? ' · partindo da sua localização atual' : ' · partindo da B13') + ' · calculando o trajeto…</div></div>' +
    '<div id="mapaMotorista"></div>' +
    '<div class="content"><button class="btn btn-ghost" onclick="fecharMapaViagem()">← Voltar</button></div>' +
  '</div>';
  const wrap = document.createElement("div");
  wrap.innerHTML = html;
  document.body.appendChild(wrap.firstElementChild);
  setTimeout(function(){
    const mapa = L.map("mapaMotorista").setView([partida.lat, partida.lng], 12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(mapa);
    L.marker([partida.lat, partida.lng]).addTo(mapa).bindPopup(usandoLocalAtual ? "📍 Você está aqui" : "🏪 B13 Bebidas (saída/volta)");
    const paradas = V.entregas.filter(function(e){ return e.endereco; }).map(function(e){ return { id:e.pedidoId, endereco:e.endereco }; });
    const pontosMarcadores = [[partida.lat, partida.lng]];
    V.entregas.forEach(function(e, ix){
      if(!e.lat || !e.lng) return;
      pontosMarcadores.push([e.lat, e.lng]);
      const done = e.status === "entregue";
      L.marker([e.lat, e.lng]).addTo(mapa).bindPopup((ix+1) + "º — Pedido " + e.numero + (done ? " ✅" : "") + "<br>" + e.clienteNome);
    });
    const infoEl = document.getElementById("mapaMotoristaInfo");
    if(!paradas.length){ if(infoEl) infoEl.textContent = infoEl.textContent.replace(" · calculando o trajeto…",""); if(pontosMarcadores.length>1) mapa.fitBounds(pontosMarcadores); return; }
    // busca o trajeto real (contornando as ruas), na ORDEM que já está definida —
    // não reotimiza, porque a ordem já foi organizada na tela de rota
    fetch(B + "/api/rotas/calcular", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ paradas: paradas, otimizar:false, origemLat: partida.lat, origemLng: partida.lng })
    }).then(function(r){ return r.json(); }).then(function(j){
      if(infoEl) infoEl.textContent = infoEl.textContent.replace(" · calculando o trajeto…","");
      if(j.erro || !j.polyline){
        // se não conseguir calcular a rota real, cai pra linha reta entre os pontos
        if(pontosMarcadores.length>1){ L.polyline(pontosMarcadores, { color:"#FF0082", weight:4, dashArray:"6,6" }).addTo(mapa); mapa.fitBounds(pontosMarcadores); }
        if(infoEl) infoEl.textContent += " (não consegui calcular o trajeto real — mostrando linha reta)";
        return;
      }
      if(infoEl) infoEl.textContent += " · " + j.distanciaTotalKm + " km · ~" + j.duracaoTotalMin + " min dirigindo";
      const linha = decodePolyline(j.polyline);
      L.polyline(linha, { color:"#FF0082", weight:4 }).addTo(mapa);
      if(linha.length) mapa.fitBounds(linha); else if(pontosMarcadores.length>1) mapa.fitBounds(pontosMarcadores);
    }).catch(function(){
      if(infoEl) infoEl.textContent = infoEl.textContent.replace(" · calculando o trajeto…"," (erro ao calcular o trajeto real — mostrando linha reta)");
      if(pontosMarcadores.length>1){ L.polyline(pontosMarcadores, { color:"#FF0082", weight:4, dashArray:"6,6" }).addTo(mapa); mapa.fitBounds(pontosMarcadores); }
    });
  }, 50);
}
function fecharMapaViagem(){
  const f = document.querySelector(".fullscreen");
  if(f) f.remove();
}

window.onerror = function(msg, url, linha, coluna, erro){
  alert("Deu um erro inesperado nessa tela: " + msg + " (linha " + linha + ")\n\nTira um print dessa mensagem e manda pro suporte — sem isso a gente fica sem saber o que travou.");
  return false;
};
// window.onerror não pega erro dentro de Promise (ex.: .then() sem .catch()) — isso
// falha 100% em silêncio sem essa captura separada, parecendo só "travar" sem aviso.
window.addEventListener("unhandledrejection", function(ev){
  const msg = (ev.reason && (ev.reason.message || ev.reason)) || "erro desconhecido";
  alert("Deu um erro inesperado nessa tela (numa operação assíncrona): " + msg + "\n\nTira um print dessa mensagem e manda pro suporte.");
});

carregar();
