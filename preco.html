<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B13 — Consulta de Preço</title>
<style>
  *{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
  :root{--indigo:#262366;--mag:#FF0082;--bg:#0f0d24}
  body{margin:0;background:var(--bg);color:#fff;min-height:100vh;display:flex;flex-direction:column}
  .top{background:linear-gradient(180deg,#2b2870,var(--indigo));padding:16px 20px;border-bottom:4px solid var(--mag);display:flex;align-items:center;gap:12px}
  .top img{height:40px}
  .top .t{font-weight:900;font-size:20px;letter-spacing:.5px}
  .top .sp{flex:1}
  .top .link{color:#9a95c9;font-size:11px;text-decoration:none}
  #app{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .scan-icon{font-size:80px;margin-bottom:10px;opacity:.85}
  .titulo{font-size:22px;font-weight:900;margin-bottom:6px}
  .sub{color:#9a95c9;font-size:14px;margin-bottom:26px}
  .scanWrap{position:relative;width:240px;height:110px;margin:0 auto;display:flex;align-items:center;justify-content:center;
    background:#151233;border:2px solid #2a2660;border-radius:16px;overflow:hidden;box-shadow:0 0 0 0 rgba(255,0,130,.4);
    animation:pulseBox 1.8s ease-in-out infinite;transition:transform .6s cubic-bezier(.4,0,.2,1),margin .6s ease}
  .scanWrap.pos-top{transform:scale(.5);margin-bottom:-30px}
  .scanWrap.pos-center{transform:scale(1);margin-bottom:22px}
  @keyframes pulseBox{0%,100%{box-shadow:0 0 0 0 rgba(255,0,130,.35)}50%{box-shadow:0 0 26px 4px rgba(255,0,130,.35)}}
  .barcode{width:190px;height:64px;background:
    repeating-linear-gradient(90deg,#fff 0 3px,transparent 3px 5px,#fff 5px 9px,transparent 9px 12px,#fff 12px 15px,transparent 15px 17px,#fff 17px 21px,transparent 21px 24px,#fff 24px 26px,transparent 26px 30px);
    border-radius:4px;opacity:.92}
  .laser{position:absolute;left:8px;right:8px;height:3px;border-radius:3px;background:#FF0082;box-shadow:0 0 10px 3px #FF0082,0 0 22px 6px rgba(255,0,130,.6);animation:scanline 1.7s ease-in-out infinite}
  @keyframes scanline{0%{top:14px}50%{top:88px}100%{top:14px}}
  .carrossel{min-height:150px;display:flex;align-items:center;justify-content:center;width:100%;max-width:900px}
  .frase{font-size:26px;font-weight:900;color:#ffd23f;max-width:600px;line-height:1.4;animation:fadeIn .5s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .fotosTrack{width:100%;overflow:hidden;height:130px;display:flex;align-items:center}
  .fotosStrip{display:flex;gap:28px;align-items:center;white-space:nowrap;animation:slideLR 10s linear}
  @keyframes slideLR{from{transform:translateX(-30%)}to{transform:translateX(130%)}}
  .fotosStrip .card{display:inline-flex;flex-direction:column;align-items:center;width:120px}
  .fotosStrip img{width:110px;height:110px;object-fit:contain;background:#fff;border-radius:14px}
  .fotosStrip .nomeF{font-size:11px;color:#c9c4ec;margin-top:6px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #entrada{opacity:0;position:absolute;pointer-events:none}
  .resultado{background:#151233;border:2px solid var(--mag);border-radius:20px;padding:32px 40px;max-width:520px;width:100%;animation:pop .18s ease-out}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .resultado img{width:140px;height:140px;object-fit:contain;border-radius:12px;background:#fff;margin-bottom:14px}
  .resultado .nome{font-size:20px;font-weight:800;margin-bottom:14px;line-height:1.3}
  .resultado .preco{font-size:56px;font-weight:900;color:#FF0082}
  .resultado .preco small{font-size:22px;color:#ffd23f;display:block;font-weight:700;margin-top:2px}
  .maisPrecos{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .cardPreco{border-radius:14px;padding:12px 18px;min-width:120px}
  .cardPreco .rot{font-size:13px;font-weight:800;opacity:.85}
  .cardPreco .val{font-size:28px;font-weight:900;margin-top:2px}
  .cardPreco.fardo{background:#FF0082;color:#fff}
  .cardPreco.atacado{background:#29ABE2;color:#000}
  .cardPreco .obs{font-size:11px;font-weight:700;margin-top:2px;opacity:.85}
  .naoachou{background:#2a0a00;border:2px solid #e5563f;border-radius:20px;padding:32px 40px;max-width:480px}
  .naoachou .ico{font-size:56px;margin-bottom:10px}
  .naoachou .msg{font-size:18px;font-weight:800;color:#ff8090}
  .naoachou .cod{color:#9a95c9;font-size:13px;margin-top:6px}
  .rodape{padding:14px;text-align:center;color:#514c96;font-size:11px}
  .adminBox{position:fixed;bottom:10px;right:10px;font-size:10px}
  .adminBox button{background:#1c1846;color:#9a95c9;border:1px solid #2a2660;border-radius:6px;padding:5px 9px;font-size:10px;cursor:pointer}
  .barraProg{background:#0a0918;border:1px solid #514c96;border-radius:8px;height:12px;overflow:hidden;margin-top:8px;max-width:280px}
  .barraProg .fill{height:100%;background:linear-gradient(90deg,#FF0082,#ff5fae);transition:width .2s}
  /* etiqueta de MANUTENÇÃO: discreta (o cliente não precisa ver), cor da bolinha diz o estado */
  .sinc{display:inline-flex;align-items:center;gap:7px;font:600 11px Arial;color:#6f6aa8;cursor:pointer;user-select:none;padding:4px 8px;border-radius:999px}
  .sinc:hover{background:#1c1846}
  .sinc i{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
  .sinc.ok i{background:#3ce88a}.sinc.off i{background:#ffd23f}.sinc.velho i{background:#ff5c7a}
  .sinc.off,.sinc.velho{color:#9a95c9}
  .diag{position:fixed;top:70px;right:16px;width:400px;max-width:calc(100vw - 32px);background:#151233;border:1px solid #2c2660;border-radius:14px;padding:14px;z-index:80;font:13px Arial;color:#e6e2ff;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .diag h4{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between}.diag .l{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #23204f}
  .diag .l span{color:#9a95c9}.diag .l b{text-align:right}.diag .obs{font-size:11.5px;color:#9a95c9;margin-top:8px}
  .diag .bts{display:flex;gap:8px;margin-top:10px}.diag button{flex:1;background:#1c1846;color:#cfcaf5;border:1px solid #3a3480;border-radius:8px;padding:8px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="top">
  <img src="/logo">
  <div class="t">Consulta de Preço</div>
  <div class="sp"></div>
  <span style="font-size:11px;color:#9a95c9" id="indiceInfo"></span>
</div>
<div id="app"></div>
<div class="rodape">Aponte o leitor pro código de barras do produto</div>
<input id="entrada" autofocus>
<script>const B = location.protocol.indexOf("http") === 0 ? "" : "https://b13-bling-backend-production.up.railway.app";
let buffer = "";
let timerReset = null;
function brl(n) {
  return (Number(n) || 0).toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}
function esc(s) {
  return String(s !== null && s !== void 0 ? s : "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

// ---- carrossel da tela ociosa: a animação de escanear NUNCA some (só muda de
// tamanho/posição) — ao redor dela alternam frases e fotos de produtos, pra deixar
// claro o tempo todo que o terminal é pra ler preço.
const FRASES = ["SE PRECISA DE PRODUTOS PARA REVENDA, PROCURE NOSSO BALCÃO DO ATACADO", "CONSULTE NOSSA TABELA DE ATACADO"];
let FOTOS = [];
async function carregarFotosProdutos() {
  try {
    // fotos montadas só com dados do servidor (tabela + catálogo da madrugada): não consulta o Bling
    const j = await fetch(B + "/api/preco/fotos").then(r => r.json());
    const imgs = (j.fotos || []).map(f => ({ imagem: f.imagem, nome: f.nome || "" }));
    for (let i = imgs.length - 1; i > 0; i--) {
      const k = Math.floor(Math.random() * (i + 1));
      [imgs[i], imgs[k]] = [imgs[k], imgs[i]];
    } // embaralha
    FOTOS = imgs;
    // pré-carrega as imagens aos poucos em segundo plano, pra já estarem no cache
    // do navegador quando entrarem no carrossel (evita picos de rede)
    let i2 = 0;
    const preload = () => {
      if (i2 >= FOTOS.length) return;
      const im = new Image();
      im.src = FOTOS[i2].imagem;
      i2++;
      setTimeout(preload, 300);
    };
    preload();
  } catch (e) {/* mantém as fotos que já tinha, não zera por causa de uma falha passageira */}
}
const FOTOS_POR_LOTE = 10; // mostra poucas de cada vez (mais leve) e avança de lote a cada fase, cobrindo todas antes de repetir
let idxLoteFoto = 0;
function proximoLoteFotos() {
  if (!FOTOS.length) return [];
  const totalLotes = Math.max(1, Math.ceil(FOTOS.length / FOTOS_POR_LOTE));
  const lote = FOTOS.slice(idxLoteFoto * FOTOS_POR_LOTE, (idxLoteFoto + 1) * FOTOS_POR_LOTE);
  idxLoteFoto = (idxLoteFoto + 1) % totalLotes;
  return lote;
}
function duracaoFotos(qtd) {
  return Math.max(10000, Math.min(35000, (qtd || 1) * 2800));
} // devagar: ~2.8s por foto

const PASSOS = [{
  pos: "center",
  modo: "nada",
  dur: 6000
}, {
  pos: "top",
  modo: "frase",
  texto: FRASES[0],
  dur: 8000
}, {
  pos: "center",
  modo: "fotos"
}, {
  pos: "center",
  modo: "nada",
  dur: 5000
}, {
  pos: "top",
  modo: "frase",
  texto: FRASES[1],
  dur: 8000
}, {
  pos: "center",
  modo: "fotos"
}, {
  pos: "center",
  modo: "nada",
  dur: 5000
}];
let idleAtivo = false,
  idlePasso = 0,
  idleTimer = null,
  idleFaseDur = 8000;
function renderPasso(passo) {
  const box = document.getElementById("scanBox");
  if (!box) return; // tela ociosa não está mais na tela
  box.className = "scanWrap pos-" + passo.pos;
  const area = document.getElementById("carrossel");
  if (!area) return;
  if (passo.modo === "frase") {
    area.innerHTML = `<div class="frase">${esc(passo.texto)}</div>`;
    idleFaseDur = passo.dur;
    return;
  }
  if (passo.modo === "fotos") {
    const lote = proximoLoteFotos();
    if (!lote.length) {
      area.innerHTML = "";
      idleFaseDur = 8000;
      return;
    }
    idleFaseDur = duracaoFotos(lote.length) + 1500;
    area.innerHTML = `<div class="fotosTrack"><div class="fotosStrip" style="animation-duration:${(idleFaseDur - 1500) / 1000}s">${lote.map(f => `<div class="card"><img src="${esc(f.imagem)}" loading="lazy" onerror="this.parentElement.style.display='none'"><div class="nomeF">${esc(f.nome)}</div></div>`).join("")}</div></div>`;
    return;
  }
  area.innerHTML = "";
  idleFaseDur = passo.dur;
}
function idleTick() {
  if (!idleAtivo) return;
  try {
    const passo = PASSOS[idlePasso % PASSOS.length];
    renderPasso(passo);
    idlePasso++;
  } catch (e) {
    idleFaseDur = 6000;
  } // nunca deixa um erro isolado travar o carrossel de vez
  if (idleAtivo) idleTimer = setTimeout(idleTick, idleFaseDur);
}
function pararCarrossel() {
  idleAtivo = false;
  clearTimeout(idleTimer);
}
function iniciarCarrossel() {
  if (idleAtivo) return;
  idleAtivo = true;
  idlePasso = 0;
  idleTick();
}
function telaIdle() {
  pararCarrossel();
  document.getElementById("app").innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;width:100%">
      <div id="scanBox" class="scanWrap pos-center"><div class="barcode"></div><div class="laser"></div></div>
      <div class="titulo">Consulte o preço do produto</div>
      <div class="sub">Escaneie o código de barras</div>
      <div id="carrossel" class="carrossel"></div>
    </div>`;
  iniciarCarrossel();
}
// ===== CACHE: catálogo guardado na própria tela =====
// A leitura responde na hora com o catálogo guardado (funciona com internet lenta ou caindo). A cada 15 min
// pergunta ao servidor se o catálogo mudou; a cada leitura confirma o preço em segundo plano e corrige a tela
// se tiver mudado.
const CAT_KEY = "b13_preco_catalogo_v1", OVR_KEY = "b13_preco_ajustes_v1";
let CAT = { versao: "", mapa: new Map(), em: 0 }, ONLINE = true, EXIBINDO = null;
// manutenção: data do catálogo completo no servidor, conferências, conexão e correções
const CATALOGO_VELHO_DIAS = 2, DIAG_KEY = "b13_preco_diag_v1";
let SINC = (() => { try { return JSON.parse(localStorage.getItem(DIAG_KEY) || "{}"); } catch (e) { return {}; } })();
function salvarSinc() { try { localStorage.setItem(DIAG_KEY, JSON.stringify(SINC)); } catch (e) {} }
function itemTela(it) { return { produtoId: it.id, nome: it.n, preco: it.p, precoAtacado: it.a ?? null, precoFardo: it.f ?? null, caixaQtd: it.q ?? null, imagem: it.i || null }; }
function aplicarCatalogo(versao, itens, em) {
  const m = new Map(); (itens || []).forEach(it => { const p = itemTela(it); (it.k || []).forEach(c => { if (c) m.set(String(c), p); }); });
  let ovr = {}; try { ovr = JSON.parse(localStorage.getItem(OVR_KEY) || "{}"); } catch (e) {}
  if (ovr.versao === versao) Object.entries(ovr.itens || {}).forEach(([c, p]) => m.set(c, p)); // correções feitas depois desse catálogo
  CAT = { versao, mapa: m, em: em || Date.now() };
}
function carregarCatalogoGuardado() { try { const s = JSON.parse(localStorage.getItem(CAT_KEY) || "null"); if (s && s.itens) aplicarCatalogo(s.versao, s.itens, s.em); } catch (e) {} }
function comTempo(url, ms) { const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms); return fetch(url, { signal: ctl.signal }).then(r => { clearTimeout(t); if (!r.ok) throw new Error("http " + r.status); return r.json(); }); }
async function atualizarCatalogo() {
  try {
    const t0 = performance.now();
    const j = await comTempo(B + "/api/preco/catalogo?versao=" + encodeURIComponent(CAT.versao || ""), 30000);
    ONLINE = true; SINC.respostaMs = Math.round(performance.now() - t0); SINC.offlineDesde = null; SINC.conferidoEm = Date.now();
    if (j.indiceAtualizadoEm) SINC.indiceEm = j.indiceAtualizadoEm; if (j.indiceCodigos != null) SINC.indiceCodigos = j.indiceCodigos;
    salvarSinc();
    if (!j.mesmo && j.itens) {
      aplicarCatalogo(j.versao, j.itens, Date.now());
      try { localStorage.setItem(CAT_KEY, JSON.stringify({ versao: j.versao, itens: j.itens, em: Date.now() })); localStorage.removeItem(OVR_KEY); } catch (e) {}
    } else if (j.mesmo) CAT.em = Date.now();
  } catch (e) { ONLINE = false; if (!SINC.offlineDesde) { SINC.offlineDesde = Date.now(); salvarSinc(); } }
  marcarConexao();
}
function guardarCorrecao(codigo, p) {
  CAT.mapa.set(String(codigo), p);
  try { const o = JSON.parse(localStorage.getItem(OVR_KEY) || "{}"); if (o.versao !== CAT.versao) { o.versao = CAT.versao; o.itens = {}; } o.itens[String(codigo)] = p; localStorage.setItem(OVR_KEY, JSON.stringify(o)); } catch (e) {}
}
function marcarConexao() {
  let el = document.getElementById("semConexao");
  if (!el) { el = document.createElement("div"); el.id = "semConexao"; el.style.cssText = "position:fixed;left:12px;bottom:10px;z-index:50;font:700 12px Arial;color:#ffd23f;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:8px;display:none"; document.body.appendChild(el); }
  el.style.display = ONLINE ? "none" : "block";
  renderSinc();
  el.textContent = "📶 sem conexão · mostrando os preços guardados" + (CAT.em ? " (atualizados " + new Date(CAT.em).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) + ")" : "");
}
function mostrarProduto(p) {
  const extras = [];
  if (p.precoFardo != null) extras.push(`<div class="cardPreco fardo"><div class="rot">FARDO</div><div class="val">${brl(p.precoFardo)}</div>${p.caixaQtd ? `<div class="obs">a partir de ${p.caixaQtd} un.</div>` : ""}</div>`);
  if (p.precoAtacado != null) extras.push(`<div class="cardPreco atacado"><div class="rot">ATACADO</div><div class="val">${brl(p.precoAtacado)}</div></div>`);
  document.getElementById("app").innerHTML = `
    <div class="resultado">
      ${p.imagem ? `<img src="${esc(p.imagem)}" onerror="this.style.display='none'">` : ""}
      <div class="nome">${esc(p.nome)}</div>
      <div class="preco">${brl(p.preco)}<small>VAREJO — preço unitário</small></div>
      ${extras.length ? `<div class="maisPrecos">${extras.join("")}</div>` : ""}
    </div>`;
}
function agendarVolta() { if (timerReset) clearTimeout(timerReset); timerReset = setTimeout(() => { EXIBINDO = null; telaIdle(); }, 6000); }
// confirma em segundo plano; se o preço ou o nome mudaram, corrige a tela (se ainda for o mesmo produto) e guarda
async function confirmar(codigo, atual) {
  try {
    const j = await comTempo(B + "/api/preco/gtin/" + encodeURIComponent(codigo) + "?vivo=1", 20000);
    ONLINE = true;
    if (j.data && (Number(j.data.preco) !== Number(atual.preco) || j.data.nome !== atual.nome || j.data.precoAtacado !== atual.precoAtacado || j.data.precoFardo !== atual.precoFardo)) {
      guardarCorrecao(codigo, j.data);
      const hoje = new Date().toDateString(); if (SINC.corrigidosDia !== hoje) { SINC.corrigidosDia = hoje; SINC.corrigidosHoje = 0; } SINC.corrigidosHoje = (SINC.corrigidosHoje || 0) + 1; salvarSinc();
      if (EXIBINDO === codigo) mostrarProduto(j.data);
    }
  } catch (e) { ONLINE = false; }
  marcarConexao();
}
async function buscarPreco(codigo) {
  pararCarrossel();
  EXIBINDO = codigo;
  const guardado = CAT.mapa.get(String(codigo));
  if (guardado) { mostrarProduto(guardado); agendarVolta(); confirmar(codigo, guardado); return; } // na hora
  document.getElementById("app").innerHTML = `<div class="sub" style="font-size:16px">Buscando…</div>`;
  try {
    const j = await comTempo(B + "/api/preco/gtin/" + encodeURIComponent(codigo), 12000);
    ONLINE = true;
    if (EXIBINDO !== codigo) return;
    if (j.data) { mostrarProduto(j.data); guardarCorrecao(codigo, j.data); confirmar(codigo, j.data); }
    else {
      document.getElementById("app").innerHTML = `
        <div class="naoachou">
          <div class="ico">❓</div>
          <div class="msg">Produto não encontrado</div>
          <div class="cod">Código: ${esc(codigo)}</div>
        </div>`;
    }
  } catch (e) {
    ONLINE = false;
    if (EXIBINDO === codigo) document.getElementById("app").innerHTML = `
      <div class="naoachou">
        <div class="ico">📶</div>
        <div class="msg">Sem conexão no momento</div>
        <div class="cod">Esse produto ainda não estava guardado nesta tela. Tente de novo em instantes.</div>
      </div>`;
  }
  marcarConexao();
  agendarVolta();
}

// ===== ETIQUETA DE MANUTENÇÃO + DIAGNÓSTICO (clique na etiqueta ou digite DIAG + Enter) =====
function quando(ms) { if (!ms) return "—"; const d = new Date(ms), hoje = new Date(); const hm = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); return d.toDateString() === hoje.toDateString() ? hm : d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + " " + hm; }
function ha(ms) { if (!ms) return ""; const m = Math.round((Date.now() - ms) / 60000); if (m < 60) return "há " + m + " min"; const h = Math.round(m / 60); if (h < 48) return "há " + h + " h"; return "há " + Math.round(h / 24) + " dias"; }
function estadoSinc() {
  if (!ONLINE) return { c: "off", t: "sem conexão" + (SINC.offlineDesde ? " desde " + quando(SINC.offlineDesde) : "") + " · usando preços guardados" };
  const dias = SINC.indiceEm ? (Date.now() - SINC.indiceEm) / 86400000 : null;
  if (dias != null && dias > CATALOGO_VELHO_DIAS) return { c: "velho", t: "catálogo do Bling de " + quando(SINC.indiceEm) + " (" + ha(SINC.indiceEm) + ") · atualizar índice" };
  return { c: "ok", t: "catálogo do Bling " + quando(SINC.indiceEm) + " · conferido " + quando(SINC.conferidoEm || CAT.em) };
}
function renderSinc() {
  const el = document.getElementById("indiceInfo"); if (!el) return;
  const e = estadoSinc();
  el.innerHTML = `<span class="sinc ${e.c}" onclick="abrirDiag()" title="Manutenção: clique para ver o diagnóstico"><i></i>${e.t}</span>`;
  if (document.getElementById("diag")) abrirDiag(true);
}
let _diagTimer = null;
function abrirDiag(soAtualizar) {
  let d = document.getElementById("diag");
  if (!d) { if (soAtualizar) return; d = document.createElement("div"); d.id = "diag"; d.className = "diag"; document.body.appendChild(d); }
  const prod = new Set([...CAT.mapa.values()]).size, e = estadoSinc();
  const l = (a, b) => `<div class="l"><span>${a}</span><b>${b}</b></div>`;
  d.innerHTML = `<h4><span>🔎 Sincronização desta tela</span><span style="cursor:pointer" onclick="fecharDiag()">✕</span></h4>
    ${l("Situação", `<span style="color:${e.c === "ok" ? "#3ce88a" : e.c === "off" ? "#ffd23f" : "#ff5c7a"}">${e.c === "ok" ? "tudo certo" : e.c === "off" ? "sem conexão" : "catálogo antigo"}</span>`)}
    ${l("Catálogo completo atualizado com o Bling", SINC.indiceEm ? quando(SINC.indiceEm) + " (" + ha(SINC.indiceEm) + ")" : "—")}
    ${l("Códigos no catálogo do servidor", SINC.indiceCodigos != null ? Number(SINC.indiceCodigos).toLocaleString("pt-BR") : "—")}
    ${l("Produtos guardados nesta tela", prod.toLocaleString("pt-BR") + (CAT.versao ? ` · versão ${CAT.versao.slice(0, 6)}` : ""))}
    ${l("Última conferência com o servidor", (SINC.conferidoEm || CAT.em) ? quando(SINC.conferidoEm || CAT.em) + " (" + ha(SINC.conferidoEm || CAT.em) + ")" : "—")}
    ${l("Conexão", ONLINE ? `online${SINC.respostaMs ? " · servidor respondeu em " + SINC.respostaMs + " ms" : ""}` : `sem conexão${SINC.offlineDesde ? " desde " + quando(SINC.offlineDesde) : ""}`)}
    ${l("Preços corrigidos hoje nesta tela", SINC.corrigidosDia === new Date().toDateString() ? (SINC.corrigidosHoje || 0) : 0)}
    ${l("Próxima atualização do catálogo", "toda madrugada, entre 03:00 e 06:30")}
    ${l("Versão desta tela", (VERSAO_TELA || "—").slice(0, 7) + " · recarga diária às " + horaRecarga())}
    <div class="obs">Os preços de cada produto se confirmam sozinhos a cada leitura. O catálogo completo (que traz produtos novos do Bling) é refeito toda madrugada sem disputar a fila com os caixas. A tela se atualiza sozinha quando sai versão nova, só quando está ociosa e com internet.</div>
    <div class="bts"><button onclick="conferirAgora()">↻ Conferir agora</button><button onclick="fecharDiag()">Fechar</button></div>`;
  clearTimeout(_diagTimer); _diagTimer = setTimeout(fecharDiag, 60000); // fecha sozinho: a tela volta a ser do cliente
}
function fecharDiag() { const d = document.getElementById("diag"); if (d) d.remove(); clearTimeout(_diagTimer); input.focus(); }
async function conferirAgora() { await atualizarCatalogo(); try { const j = await comTempo(B + "/api/preco/indice-info", 15000); if (j.atualizadoEm) { SINC.indiceEm = new Date(j.atualizadoEm).getTime(); SINC.indiceCodigos = j.qtd; salvarSinc(); } } catch (e) {} renderSinc(); }
setInterval(renderSinc, 60000); // atualiza o "há X min"
// ===== ATUALIZAÇÃO AUTOMÁTICA DA TELA (zero chamadas ao Bling) =====
// Confere a versão publicada junto com o catálogo (a cada 15 min). Se mudou, ou na recarga diária (minuto sorteado
// entre 06:45 e 07:15, para os terminais nunca recarregarem juntos), recarrega SÓ quando a tela está ociosa, sem
// diagnóstico aberto e COM internet (sem internet a página não voltaria).
let VERSAO_TELA = null, _recarregarMotivo = null;
const RECARGA_KEY = "b13_preco_recarga_v1";
function minutoRecarga() { let r = {}; try { r = JSON.parse(localStorage.getItem(RECARGA_KEY) || "{}"); } catch (e) {} if (r.minuto == null) { r.minuto = 405 + Math.floor(Math.random() * 31); try { localStorage.setItem(RECARGA_KEY, JSON.stringify(r)); } catch (e) {} } return r; }
function horaRecarga() { const m = minutoRecarga().minuto; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
async function conferirVersao() {
  try { const j = await comTempo(B + "/api/versao", 15000); if (!j.commit) return; if (!VERSAO_TELA) { VERSAO_TELA = j.commit; return; } if (j.commit !== VERSAO_TELA) _recarregarMotivo = "versão nova"; } catch (e) {}
}
async function talvezRecarregar() {
  const agora = new Date(), r = minutoRecarga(), min = agora.getHours() * 60 + agora.getMinutes(), hoje = agora.toDateString();
  if (!_recarregarMotivo && min >= r.minuto && min < r.minuto + 120 && r.ultimaDiaria !== hoje) _recarregarMotivo = "recarga diária";
  if (!_recarregarMotivo || EXIBINDO !== null || document.getElementById("diag")) return;
  try { await comTempo(B + "/api/versao", 8000); } catch (e) { return; } // só com o servidor respondendo
  if (_recarregarMotivo === "recarga diária") { r.ultimaDiaria = hoje; try { localStorage.setItem(RECARGA_KEY, JSON.stringify(r)); } catch (e) {} }
  location.reload();
}
conferirVersao();
setInterval(conferirVersao, 15 * 60 * 1000);
setInterval(talvezRecarregar, 60 * 1000);

carregarCatalogoGuardado();
atualizarCatalogo();
setInterval(atualizarCatalogo, 15 * 60 * 1000);
window.addEventListener("online", atualizarCatalogo);
const input = document.getElementById("entrada");
function manterFoco() {
  input.focus();
}
input.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const v = input.value.trim();
    input.value = "";
    if (v && v.toUpperCase() === "DIAG") { abrirDiag(); return; } // manutenção
    if (v) buscarPreco(v);
  }
});
document.addEventListener("click", manterFoco);
setInterval(manterFoco, 1500);
async function carregarIndiceInfo() {
  try {
    const j = await fetch(B + "/api/preco/indice-info").then(r => r.json());
    if (!j.qtd) { document.getElementById("indiceInfo").innerHTML = `<span class="sinc velho"><i></i>catálogo vazio · atualizar índice</span>`; return; }
    if (j.atualizadoEm) { SINC.indiceEm = new Date(j.atualizadoEm).getTime(); SINC.indiceCodigos = j.qtd; salvarSinc(); }
    renderSinc();
  } catch (e) { renderSinc(); }
}
telaIdle(); // monta a tela de espera (leitor + carrossel) ao abrir
carregarIndiceInfo();
carregarFotosProdutos();
setInterval(carregarFotosProdutos, 30 * 60 * 1000); // atualiza a lista de fotos a cada 30 min</script>
