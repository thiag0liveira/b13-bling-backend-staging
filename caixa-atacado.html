<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B13 — Caixa Atacado</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
  body{background:#0f0d24;color:#fff;min-height:100vh}
  .top{background:#181542;padding:14px 20px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.4);position:sticky;top:0;z-index:10;flex-wrap:wrap}
  .top img{height:36px}
  .top .t{font-weight:900;font-size:20px}
  .top .sp{flex:1}
  .pill{font-size:13px;font-weight:800;padding:8px 14px;border-radius:20px}
  .pill.aberto{background:#0a3a20;color:#8fffc0;border:1px solid #2f9e6b}
  .pill.fechado{background:#3a0010;color:#ff8090;border:1px solid #ff4466}
  .pill.nfce{background:#2a2000;color:#ffd23f;border:1px solid #7a6a00}
  .btn{background:#FF0082;color:#fff;border:none;border-radius:10px;padding:14px 22px;font-weight:800;font-size:15px;cursor:pointer;min-height:48px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-ghost{background:transparent;border:1px solid #514c96;color:#fff}
  .btn-sm{padding:11px 16px;font-size:14px;min-height:42px}
  .wrap{max-width:1500px;margin:0 auto;padding:16px;display:grid;grid-template-columns:280px 1fr 1fr 1fr;gap:16px}
  @media(max-width:1300px){ .wrap{grid-template-columns:260px 1fr 1fr} }
  @media(max-width:1000px){ .wrap{grid-template-columns:1fr 1fr} }
  @media(max-width:700px){ .wrap{grid-template-columns:1fr} .top{padding:10px 12px} .top .t{font-size:17px} }
  .card{background:#181542;border-radius:14px;padding:16px;margin-bottom:14px}
  .card h3{font-size:16px;margin-bottom:10px}
  .busca{width:100%;padding:16px;font-size:17px;background:#0f0d24;border:2px solid #514c96;border-radius:10px;color:#fff}
  .busca:focus{border-color:#FF0082;outline:none}
  .res{margin-top:8px;max-height:340px;overflow:auto}
  .resitem{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #2a2660;cursor:pointer;border-radius:8px}
  .resitem:hover{background:#1f1c4d}
  .resitem img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:6px;flex-shrink:0}
  .resitem .semimg{width:52px;height:52px;background:#241f52;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .resitem .info{flex:1;min-width:0}
  .resitem .nome{font-size:14px;font-weight:700}
  .resitem .meta{font-size:12px;color:#9a95c9}
  .resitem .preco{font-weight:900;color:#ffd23f;font-size:15px}
  .item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #2a2660;font-size:14px}
  .item .nome{flex:1;min-width:0}
  .item .qtd{display:flex;align-items:center;gap:6px}
  .item .qtd button{width:38px;height:38px;background:#1c1846;border:1px solid #514c96;border-radius:8px;color:#fff;cursor:pointer;font-size:18px;font-weight:800}
  .item .qtd input{width:52px;text-align:center;background:#0f0d24;border:1px solid #514c96;border-radius:6px;color:#fff;padding:8px;font-size:15px}
  .item .subtotal{width:90px;text-align:right;font-weight:800}
  .item .rm{background:#3a0010;border:1px solid #ff4466;color:#ff8090;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;min-height:38px}
  .linha{display:flex;justify-content:space-between;padding:8px 0;font-size:15px;align-items:center}
  .total{font-size:30px;font-weight:900;color:#ffd23f}
  .formas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .forma{background:#1c1846;border:2px solid #514c96;border-radius:12px;padding:18px 12px;text-align:center;cursor:pointer;font-size:15px;font-weight:800;min-height:64px;display:flex;align-items:center;justify-content:center}
  .forma.sel{border-color:#FF0082;background:#2a1a4d}
  .pagRow{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px}
  .pagRow input{width:120px;background:#0f0d24;border:1px solid #514c96;border-radius:8px;color:#fff;padding:10px;text-align:right;font-size:15px}
  .muted{color:#9a95c9;font-size:12px}
  .err{background:#3a0010;border:1px solid #ff4466;color:#ff8090;border-radius:8px;padding:12px;margin:10px 0;font-size:14px}
  .ok{background:#0a3a20;border:1px solid #2f9e6b;color:#8fffc0;border-radius:8px;padding:16px;margin:10px 0;font-size:15px;text-align:center}
  input[type=checkbox]{width:20px;height:20px}
  input[type=number],input[type=text]{background:#0f0d24;border:1px solid #514c96;border-radius:8px;color:#fff;padding:10px;font-size:15px}
  .modalBg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal{background:#181542;border-radius:14px;padding:22px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
  .modal input[type=number],.modal input[type=text]{width:100%;font-size:16px;padding:12px}
  /* coluna de pedidos — compacta */
  .pedBusca{width:100%;padding:10px;font-size:14px;background:#0f0d24;border:1px solid #514c96;border-radius:8px;color:#fff;margin-bottom:8px}
  .pedLista{max-height:calc(100vh - 230px);overflow:auto}
  .pedItem{padding:8px 10px;border:1px solid #2a2660;border-radius:8px;margin-bottom:6px;cursor:pointer;background:#12102e}
  .pedItem:hover{border-color:#FF0082}
  .pedItem.sel{border-color:#FF0082;background:#241a44}
  .pedItem .l1{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .pedItem .num{font-weight:800;font-size:13px}
  .pedItem .val{font-weight:800;color:#8fffc0;font-size:13px}
  .pedItem .cli{font-size:11px;color:#cfc9f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stag{display:inline-block;font-size:9px;font-weight:800;padding:1px 6px;border-radius:10px;background:#2a2660;color:#cfc9f5;margin-top:2px}
  .bloqueio{text-align:center;padding:50px 20px}
</style>
</head>
<body>
<script src="/nav.js"></script>
<script>
if(!b13RequireLogin())document.write=function(){};
if(!b13BloquearSeSemAcesso("/caixa-atacado"))document.write=function(){};
document.addEventListener("DOMContentLoaded",function(){
  const nav=document.createElement("div");
  nav.innerHTML=b13RenderNav("/caixa-atacado");
  document.body.insertBefore(nav,document.body.firstChild);
});
</script>

<div class="top">
  <img src="/logo">
  <div class="t">Caixa Atacado</div>
  <span id="pillCaixa" class="pill fechado">Caixa fechado</span>
  <span class="pill nfce">NFC-e desligada por padrão</span>
  <div class="sp"></div>
  <button class="btn btn-ghost btn-sm" onclick="abrirModalMovimento('sangria')">💸 Sangria</button>
  <button class="btn btn-ghost btn-sm" onclick="abrirModalMovimento('suprimento')">💰 Suprimento</button>
  <button class="btn btn-ghost btn-sm" onclick="abrirModalCaixasAbertos()">🏪 Caixas Abertos</button>
  <button class="btn btn-ghost btn-sm" onclick="abrirModalHistorico()">📜 Histórico</button>
  <button class="btn btn-sm" id="btnAbrirFechar" onclick="cliqueAbrirFechar()">🔓 Abrir caixa</button>
</div>

<div id="conteudo"></div>
<div id="modais"></div>

<script>
const BACKEND=(location.protocol.indexOf("http")===0)?"":"https://b13-bling-backend-production.up.railway.app";
const S=b13GetSession()||{};
const TIPO_CAIXA="atacado";

let CAIXA={aberta:false,resumo:{}};
let PEDIDOS=[];          // pedidos não atendidos (coluna extra)
let PEDIDO_ATUAL=null;   // {id,numero,situacaoNome,vendedorNome,...} — null = venda nova
let CARRINHO=[];
let CLIENTE_NOME="";
let FORMAS=[];
let PAGAMENTOS=[];
let _timerBusca=null;

function brl(n){ return (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function hora(ms){ if(!ms) return "—"; return new Date(ms).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }
function fecharModais(){ document.getElementById("modais").innerHTML=""; }

function subtotal(){ return CARRINHO.reduce((s,i)=>s+Number(i.valor)*Number(i.quantidade),0); }
function totalPedido(){ return +subtotal().toFixed(2); }
function totalPago(){ return PAGAMENTOS.reduce((s,p)=>s+(Number(p.valor)||0),0); }
function restante(){ return +(totalPedido()-totalPago()).toFixed(2); }

// ---------------- sessão de caixa ----------------
async function carregarSessao(){
  try{
    const j=await fetch(BACKEND+"/api/caixa-sessao/atual?tipoCaixa="+TIPO_CAIXA+"&funcionarioId="+encodeURIComponent(S.id||"")).then(r=>r.json());
    CAIXA = j.aberta ? {aberta:true,sessao:j.sessao,resumo:j.resumo,movimentos:j.movimentos} : {aberta:false,resumo:{}};
  }catch(e){ CAIXA={aberta:false,resumo:{}}; }
}

function cliqueAbrirFechar(){ if(CAIXA.aberta) modalFechar(); else modalAbrir(); }

function modalAbrir(){
  document.getElementById("modais").innerHTML=`
    <div class="modalBg" onclick="if(event.target===this)fecharModais()"><div class="modal">
      <h3>🔓 Abrir caixa atacado</h3>
      <p class="muted" style="margin-bottom:8px">Informe o troco inicial (fundo de caixa).</p>
      <input id="mTroco" type="number" step="0.01" placeholder="0,00" style="text-align:center;font-size:20px" autofocus>
      <div id="mErro"></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn" style="flex:1" onclick="confirmarAbrir()">Abrir caixa</button>
        <button class="btn btn-ghost" onclick="fecharModais()">Cancelar</button>
      </div>
    </div></div>`;
}
async function confirmarAbrir(){
  const trocoInicial=+document.getElementById("mTroco").value||0;
  try{
    const r=await fetch(BACKEND+"/api/caixa-sessao/abrir",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({trocoInicial,operador:S.nome,funcionarioId:S.id,tipoCaixa:TIPO_CAIXA})}).then(r=>r.json());
    if(r.erro) throw new Error(r.erro);
    CAIXA={aberta:true,sessao:r.sessao,resumo:r.resumo,movimentos:[]};
    fecharModais(); render();
  }catch(e){ document.getElementById("mErro").innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

function abrirModalMovimento(tipo){
  if(!CAIXA.aberta){ alert("Abra o caixa primeiro."); return; }
  const t=tipo==="sangria"?"💸 Sangria (retirada)":"💰 Suprimento (entrada)";
  document.getElementById("modais").innerHTML=`
    <div class="modalBg" onclick="if(event.target===this)fecharModais()"><div class="modal">
      <h3>${t}</h3>
      <input id="mVal" type="number" step="0.01" placeholder="Valor" style="margin-bottom:8px" autofocus>
      <input id="mMot" type="text" placeholder="Motivo (opcional)">
      <div id="mErro"></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn" style="flex:1" onclick="confirmarMovimento('${tipo}')">Confirmar</button>
        <button class="btn btn-ghost" onclick="fecharModais()">Cancelar</button>
      </div>
    </div></div>`;
}
async function confirmarMovimento(tipo){
  const valor=+document.getElementById("mVal").value||0;
  const motivo=document.getElementById("mMot").value||"";
  if(!(valor>0)){ document.getElementById("mErro").innerHTML=`<div class="err">Informe um valor maior que zero.</div>`; return; }
  try{
    const r=await fetch(BACKEND+"/api/caixa-sessao/movimento",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({tipo,valor,motivo,operador:S.nome,funcionarioId:S.id,tipoCaixa:TIPO_CAIXA})}).then(r=>r.json());
    if(r.erro) throw new Error(r.erro);
    fecharModais(); await carregarSessao(); render();
  }catch(e){ document.getElementById("mErro").innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

async function modalFechar(){
  await carregarSessao();
  const r=CAIXA.resumo||{};
  document.getElementById("modais").innerHTML=`
    <div class="modalBg" onclick="if(event.target===this)fecharModais()"><div class="modal">
      <h3>🔒 Fechar caixa — conferência</h3>
      <div class="card" style="background:#12102e">
        <div class="linha"><span>Troco inicial</span><b>${brl(r.trocoInicial)}</b></div>
        <div class="linha"><span>Vendas em dinheiro</span><b>${brl(r.vendasDinheiro)}</b></div>
        <div class="linha"><span>+ Suprimentos</span><b style="color:#8fffc0">${brl(r.totalSuprimentos)}</b></div>
        <div class="linha"><span>− Sangrias</span><b style="color:#ff8090">${brl(r.totalSangrias)}</b></div>
        <div class="linha" style="border-top:1px solid #2a2660;padding-top:8px"><span><b>Esperado na gaveta</b></span><b style="color:#ffd23f;font-size:18px">${brl(r.esperadoGaveta)}</b></div>
      </div>
      ${(r.porForma||[]).length?`<div class="card" style="background:#12102e">
        <div style="font-weight:800;margin-bottom:4px">💳 Por forma de pagamento</div>
        <div class="linha"><span>Vendas (${r.qtdVendas||0})</span><b>${brl(r.totalVendas)}</b></div>
        ${r.porForma.map(f=>`<div class="linha" style="font-size:13px"><span>${esc(f.nome)} <span class="muted">(${f.qtd}x)</span></span><b>${brl(f.valor)}</b></div>`).join("")}
      </div>`:""}
      <p class="muted" style="margin:6px 0 4px">Quanto tem na gaveta (contado)?</p>
      <input id="mContado" type="number" step="0.01" placeholder="0,00" style="text-align:center;font-size:18px">
      <input id="mObs" type="text" placeholder="Observação (opcional)" style="margin-top:8px">
      <div id="mErro"></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn" style="flex:1" onclick="confirmarFechar()">Fechar caixa</button>
        <button class="btn btn-ghost" onclick="fecharModais()">Cancelar</button>
      </div>
    </div></div>`;
}
async function confirmarFechar(){
  const valorContado=+document.getElementById("mContado").value||0;
  const observacao=document.getElementById("mObs").value||"";
  try{
    const r=await fetch(BACKEND+"/api/caixa-sessao/fechar",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({valorContado,observacao,operador:S.nome,funcionarioId:S.id,tipoCaixa:TIPO_CAIXA})}).then(r=>r.json());
    if(r.erro) throw new Error(r.erro);
    CAIXA={aberta:false,resumo:{}};
    const f=r.fechamento||{};
    document.getElementById("modais").innerHTML=`
      <div class="modalBg" onclick="fecharModais()"><div class="modal" style="text-align:center">
        <div style="font-size:38px">🔒</div><h3>Caixa fechado!</h3>
        <div class="card" style="background:#12102e;text-align:left">
          <div class="linha"><span>Esperado</span><b>${brl(f.esperado)}</b></div>
          <div class="linha"><span>Contado</span><b>${brl(f.valorContado)}</b></div>
          <div class="linha"><span>Diferença</span><b style="color:${Math.abs(f.diferenca)<0.01?'#8fffc0':(f.diferenca>0?'#ffd23f':'#ff8090')}">${brl(f.diferenca)}</b></div>
        </div>
        <button class="btn" style="width:100%" onclick="fecharModais();render()">OK</button>
      </div></div>`;
  }catch(e){ document.getElementById("mErro").innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

async function abrirModalCaixasAbertos(){
  document.getElementById("modais").innerHTML=`<div class="modalBg"><div class="modal"><div class="muted">Carregando…</div></div></div>`;
  try{
    const j=await fetch(BACKEND+"/api/caixa-sessao/abertos?tipoCaixa="+TIPO_CAIXA).then(r=>r.json());
    const lista=j.data||[];
    document.getElementById("modais").innerHTML=`
      <div class="modalBg" onclick="if(event.target===this)fecharModais()"><div class="modal">
        <h3>🏪 Caixas atacado abertos</h3>
        ${lista.length?lista.map(s=>`
          <div class="card" style="background:#12102e">
            <div style="font-weight:800">👤 ${esc(s.operador||"—")}</div>
            <div class="muted" style="margin-bottom:6px">Aberto desde ${hora(s.abertaEm)}</div>
            <div class="linha"><span>Vendas (${s.resumo.qtdVendas})</span><b>${brl(s.resumo.totalVendas)}</b></div>
            <div class="linha"><span>Esperado na gaveta</span><b style="color:#ffd23f">${brl(s.resumo.esperadoGaveta)}</b></div>
          </div>`).join(""):'<div class="muted">Nenhum caixa atacado aberto.</div>'}
        <button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="fecharModais()">Fechar</button>
      </div></div>`;
  }catch(e){ document.getElementById("modais").innerHTML=`<div class="modalBg" onclick="fecharModais()"><div class="modal"><div class="err">Erro ao carregar</div></div></div>`; }
}

async function abrirModalHistorico(){
  document.getElementById("modais").innerHTML=`<div class="modalBg"><div class="modal"><div class="muted">Carregando…</div></div></div>`;
  try{
    const j=await fetch(BACKEND+"/api/caixa-sessao/historico").then(r=>r.json());
    const lista=(j.data||[]).filter(s=>(s.tipoCaixa||"frente")==="atacado");
    document.getElementById("modais").innerHTML=`
      <div class="modalBg" onclick="if(event.target===this)fecharModais()"><div class="modal">
        <h3>📜 Histórico — Caixa Atacado</h3>
        ${lista.length?lista.map(s=>`
          <div class="card" style="background:#12102e">
            <div class="muted" style="margin-bottom:6px">🕐 ${hora(s.abertaEm)} → ${hora(s.fechadaEm)} · 👤 ${esc(s.operador||"—")}</div>
            <div class="linha"><span>Vendas (${s.resumo.qtdVendas})</span><b>${brl(s.resumo.totalVendas)}</b></div>
            ${(s.resumo.porForma||[]).length?s.resumo.porForma.map(f=>`<div class="linha" style="font-size:12px"><span>${esc(f.nome)}</span><b>${brl(f.valor)}</b></div>`).join(""):""}
            <div class="linha" style="border-top:1px solid #2a2660;padding-top:6px"><span>Contado</span><b>${brl(s.fechamento?.valorContado)}</b></div>
            <div class="linha"><span>Diferença</span><b style="color:${Math.abs(s.fechamento?.diferenca||0)<0.01?'#8fffc0':((s.fechamento?.diferenca||0)>0?'#ffd23f':'#ff8090')}">${brl(s.fechamento?.diferenca)}</b></div>
          </div>`).join(""):'<div class="muted">Nenhum caixa atacado fechado ainda.</div>'}
        <button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="fecharModais()">Fechar</button>
      </div></div>`;
  }catch(e){ document.getElementById("modais").innerHTML=`<div class="modalBg" onclick="fecharModais()"><div class="modal"><div class="err">Erro ao carregar</div></div></div>`; }
}

// ---------------- pedidos (coluna extra) ----------------
async function carregarPedidos(){
  try{
    const j=await fetch(BACKEND+"/api/caixa-atacado/pedidos-nao-atendidos").then(r=>r.json());
    PEDIDOS=j.data||[];
  }catch(e){ PEDIDOS=[]; }
  pintarPedidos();
}
function pintarPedidos(){
  const box=document.getElementById("pedLista"); if(!box) return;
  const f=(window._filtroPed||"").toLowerCase().trim();
  let lista=PEDIDOS;
  if(f) lista=lista.filter(p=>String(p.numero||"").includes(f)||String(p.clienteNome||"").toLowerCase().includes(f));
  if(!lista.length){ box.innerHTML=`<div class="muted" style="padding:8px">${PEDIDOS.length?"Nenhum pedido bate com o filtro.":"Nenhum pedido a receber."}</div>`; return; }
  box.innerHTML=lista.map(p=>`
    <div class="pedItem ${PEDIDO_ATUAL&&PEDIDO_ATUAL.id===p.id?'sel':''}" onclick="abrirPedido('${p.id}')">
      <div class="l1"><span class="num">#${esc(p.numero||p.id)}</span><span class="val">${brl(p.total)}</span></div>
      <div class="cli">${esc(p.clienteNome||"sem cliente")}</div>
      <span class="stag">${esc(p.situacaoNome||"")}</span>
    </div>`).join("");
}

async function abrirPedido(id){
  try{
    const j=await fetch(BACKEND+"/api/caixa-atacado/pedido/"+id).then(r=>r.json());
    if(j.erro) throw new Error(j.erro);
    PEDIDO_ATUAL={id:j.id,numero:j.numero,situacaoNome:j.situacaoNome,vendedorNome:j.vendedorNome,contatoId:j.contatoId};
    CLIENTE_NOME=j.clienteNome||"";
    CARRINHO=(j.itens||[]).map(it=>({produtoId:it.produtoId,nome:it.nome,quantidade:it.quantidade,valor:it.valor,codigo:it.codigo}));
    PAGAMENTOS=[];
    render();
  }catch(e){ alert("Não foi possível abrir o pedido: "+e.message); }
}

function novaVenda(){ PEDIDO_ATUAL=null; CLIENTE_NOME=""; CARRINHO=[]; PAGAMENTOS=[]; render(); }

// ---------------- busca de produto / carrinho ----------------
function alterarQtd(ix,d){ CARRINHO[ix].quantidade=Math.max(1,Number(CARRINHO[ix].quantidade)+d); render(); }
function definirQtd(ix,v){ CARRINHO[ix].quantidade=Math.max(1,Number(v)||1); render(); }
function removerItem(ix){ CARRINHO.splice(ix,1); render(); }

function addProduto(p){
  const ex=CARRINHO.find(i=>Number(i.produtoId)===Number(p.produtoId));
  if(ex){ ex.quantidade++; } else { CARRINHO.push({produtoId:p.produtoId,nome:p.nome,quantidade:1,valor:Number(p.preco)||0,codigo:p.codigo||""}); }
  render();
}

function ligarBusca(){
  const el=document.getElementById("busca"); if(!el) return;
  el.addEventListener("keydown",function(ev){
    if(ev.key==="Enter"){ ev.preventDefault(); clearTimeout(_timerBusca); const t=this.value.trim(); if(t) buscarProduto(t,el,document.getElementById("resBusca"),true); }
  });
  el.addEventListener("input",function(){
    clearTimeout(_timerBusca);
    const termo=this.value.trim(); const resEl=document.getElementById("resBusca");
    if(termo.length<2){ resEl.innerHTML=""; return; }
    resEl.innerHTML='<div class="muted">buscando…</div>';
    _timerBusca=setTimeout(()=>buscarProduto(termo,el,resEl,false),350);
  });
}
async function buscarProduto(termo,el,resEl,ehEnter){
  try{
    if(/^\d{6,}$/.test(termo)){
      const r=await fetch(BACKEND+"/api/preco/gtin/"+encodeURIComponent(termo)).then(r=>r.json()).catch(()=>null);
      if(r&&r.data&&r.data.preco>0){ addProduto({produtoId:r.data.produtoId,nome:r.data.nome,preco:r.data.preco,codigo:termo}); el.value=""; return; }
      if(ehEnter){ resEl.innerHTML=`<div class="muted">Código de barras <b>${esc(termo)}</b> não encontrado.</div>`; return; }
    }
    const j=await fetch(BACKEND+"/api/buscar?nome="+encodeURIComponent(termo)).then(r=>r.json());
    const lista=(j.data||[]).slice(0,25);
    if(!lista.length){ resEl.innerHTML='<div class="muted">nada encontrado</div>'; return; }
    window._ultimaBusca=lista;
    resEl.innerHTML=lista.map((p,ix)=>`
      <div class="resitem" onclick="selecionarResultado(${ix})">
        <div class="semimg">📦</div>
        <div class="info"><div class="nome">${esc(p.nome)}</div><div class="meta">#${esc(String(p.codigo||""))}</div></div>
        <div class="preco" id="pr_${ix}">—</div>
      </div>`).join("");
    lista.forEach(async(p,ix)=>{
      if(!p.codigo) return;
      try{ const r=await fetch(BACKEND+"/api/preco/gtin/"+encodeURIComponent(p.codigo)).then(r=>r.json());
        if(r?.data){ p._preco=r.data.preco; const e=document.getElementById("pr_"+ix); if(e) e.textContent=brl(r.data.preco); }
      }catch(e){}
    });
  }catch(e){ resEl.innerHTML='<div class="err">erro na busca</div>'; }
}
function selecionarResultado(ix){
  const p=(window._ultimaBusca||[])[ix]; if(!p) return;
  addProduto({produtoId:p.id,nome:p.nome,preco:p._preco||0,codigo:p.codigo});
  document.getElementById("resBusca").innerHTML=""; document.getElementById("busca").value="";
}

// ---------------- pagamento ----------------
function selecionarForma(id,nome){
  const ix=PAGAMENTOS.findIndex(p=>String(p.formaId)===String(id));
  if(ix>=0){ PAGAMENTOS.splice(ix,1); }
  else{
    const rest=restante();
    PAGAMENTOS.push({formaId:id,formaNome:nome,valor:rest>0?rest:0});
  }
  render();
}
function adicionarFormaPagamento(){ PAGAMENTOS.push({formaId:"",formaNome:"",valor:0}); render(); }

// ---------------- render principal (visual do frente de caixa) ----------------
function render(){
  const pill=document.getElementById("pillCaixa");
  const btnAF=document.getElementById("btnAbrirFechar");
  if(CAIXA.aberta){ pill.className="pill aberto"; pill.textContent="Caixa aberto"; btnAF.textContent="🔒 Fechar caixa"; }
  else { pill.className="pill fechado"; pill.textContent="Caixa fechado"; btnAF.textContent="🔓 Abrir caixa"; }

  const cont=document.getElementById("conteudo");
  if(!CAIXA.aberta){
    cont.innerHTML=`<div class="bloqueio">
      <div style="font-size:52px;margin-bottom:14px">🔒</div>
      <h2 style="margin-bottom:8px">Caixa atacado fechado</h2>
      <p class="muted" style="margin-bottom:18px">Abra o caixa informando o troco inicial pra começar a receber.</p>
      <button class="btn" onclick="modalAbrir()">🔓 Abrir caixa</button>
    </div>`;
    return;
  }

  const r=CAIXA.resumo||{};
  cont.innerHTML=`<div class="wrap">

    <!-- COLUNA EXTRA: pedidos a receber -->
    <div>
      <div class="card">
        <div style="display:flex;align-items:center;margin-bottom:8px">
          <h3 style="flex:1;margin:0">📋 Pedidos a receber</h3>
          <button class="btn btn-ghost btn-sm" onclick="carregarPedidos()">🔄</button>
        </div>
        <input class="pedBusca" placeholder="Filtrar nº ou cliente…" oninput="window._filtroPed=this.value;pintarPedidos()" value="${esc(window._filtroPed||'')}">
        <div class="pedLista" id="pedLista"><div class="muted">Carregando…</div></div>
      </div>
    </div>

    <!-- COLUNA 1: busca + carrinho -->
    <div>
      <div class="card">
        ${PEDIDO_ATUAL?`<div style="margin-bottom:10px;padding:10px;background:#12102e;border-radius:10px;border:1px solid #2a2660">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <b>Pedido #${esc(PEDIDO_ATUAL.numero||PEDIDO_ATUAL.id)}</b>
            <button class="btn btn-ghost btn-sm" onclick="novaVenda()">✖ fechar</button>
          </div>
          <div class="muted" style="margin-top:4px">📌 Status: <b style="color:#ffd23f">${esc(PEDIDO_ATUAL.situacaoNome||"—")}</b></div>
          <div class="muted">🧑‍💼 Vendedor: <b style="color:#cfc9f5">${esc(PEDIDO_ATUAL.vendedorNome||"—")}</b></div>
          ${CLIENTE_NOME?`<div class="muted">👤 Cliente: <b style="color:#cfc9f5">${esc(CLIENTE_NOME)}</b></div>`:''}
        </div>`:`<h3 style="margin-bottom:8px">🛒 Nova venda</h3>`}
        <div class="muted" style="margin-bottom:6px">🔍 Buscar produto (nome ou código de barras)</div>
        <input id="busca" class="busca" placeholder="Bipa o código ou digita o nome…">
        <div id="resBusca" class="res"></div>
      </div>
      <div class="card">
        <div style="display:flex;align-items:center;margin-bottom:8px">
          <h3 style="flex:1;margin:0">🛒 Itens (${CARRINHO.length})</h3>
          ${CARRINHO.length?`<button class="btn btn-ghost btn-sm" onclick="novaVenda()">Limpar</button>`:""}
        </div>
        <div id="carrinho">${CARRINHO.length?CARRINHO.map((i,ix)=>`
          <div class="item">
            <span class="nome">${esc(i.nome)}<br><span class="muted">${brl(i.valor)} un</span></span>
            <div class="qtd">
              <button onclick="alterarQtd(${ix},-1)">−</button>
              <input value="${i.quantidade}" onchange="definirQtd(${ix},this.value)">
              <button onclick="alterarQtd(${ix},1)">+</button>
            </div>
            <span class="subtotal">${brl(i.valor*i.quantidade)}</span>
            <button class="rm" onclick="removerItem(${ix})">🗑</button>
          </div>`).join(""):'<div class="muted">Selecione um pedido à esquerda ou adicione itens.</div>'}</div>
      </div>
    </div>

    <!-- COLUNA 2: pagamento -->
    <div>
      <div class="card">
        <h3>💳 Pagamento</h3>
        <div class="formas">${FORMAS.map(f=>{
          const nome=f.descricao||f.nome||("Forma "+f.id);
          const sel=PAGAMENTOS.some(p=>String(p.formaId)===String(f.id));
          return `<div class="forma ${sel?"sel":""}" onclick="selecionarForma(${f.id},'${esc(nome).replace(/'/g,"\\'")}')">${esc(nome)}</div>`;
        }).join("")}</div>
        ${PAGAMENTOS.map((p,ix)=>`
          <div class="pagRow">
            <span style="flex:1">${p.formaNome?esc(p.formaNome):'<span class="muted">escolha a forma acima</span>'}</span>
            <input type="number" step="0.01" value="${p.valor}" onchange="PAGAMENTOS[${ix}].valor=+this.value||0;render()">
            ${PAGAMENTOS.length>1?`<button class="rm" onclick="PAGAMENTOS.splice(${ix},1);render()">🗑</button>`:""}
          </div>`).join("")}
        <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px" onclick="adicionarFormaPagamento()">+ Dividir com outra forma</button>
        <div class="linha" style="margin-top:10px"><span>Pago</span><b>${brl(totalPago())}</b></div>
        <div class="linha"><span>Falta</span><b style="color:${restante()>0.009?'#ff8090':'#8fffc0'}">${brl(Math.max(0,restante()))}</b></div>
        <label style="display:flex;align-items:center;gap:8px;margin:12px 0;font-size:13px">
          <input type="checkbox" id="emitirNfce"> Emitir NFC-e (desligada por padrão)</label>
        <div id="msgFinalizar"></div>
        <button class="btn" id="btnFinalizar" style="width:100%;padding:16px"
          ${(!CARRINHO.length||!PAGAMENTOS.length||PAGAMENTOS.some(p=>!p.formaId))?"disabled":""}
          onclick="finalizar()">✅ Finalizar e receber</button>
      </div>
    </div>

    <!-- COLUNA 3: totais + resumo do caixa -->
    <div>
      <div class="card">
        <div class="linha" style="border-top:1px solid #2a2660;padding-top:10px">
          <span>Total</span><span class="total">${brl(totalPedido())}</span></div>
      </div>
      <div class="card">
        <h3>📊 Resumo do caixa</h3>
        <div class="linha"><span>Troco inicial</span><b>${brl(r.trocoInicial)}</b></div>
        <div class="linha"><span>Vendas (${r.qtdVendas||0})</span><b>${brl(r.totalVendas)}</b></div>
        <div class="linha"><span>Suprimentos</span><b style="color:#8fffc0">${brl(r.totalSuprimentos)}</b></div>
        <div class="linha"><span>Sangrias</span><b style="color:#ff8090">${brl(r.totalSangrias)}</b></div>
        <div class="linha" style="border-top:1px solid #2a2660;padding-top:8px"><span><b>Esperado na gaveta</b></span><b style="color:#ffd23f">${brl(r.esperadoGaveta)}</b></div>
        ${(r.porForma||[]).length?`<div style="margin-top:10px">
          <div class="muted" style="margin-bottom:4px">Por forma de pagamento</div>
          ${r.porForma.map(f=>`<div class="linha" style="font-size:13px"><span>${esc(f.nome)} <span class="muted">(${f.qtd}x)</span></span><b>${brl(f.valor)}</b></div>`).join("")}
        </div>`:""}
      </div>
    </div>
  </div>`;
  ligarBusca();
  pintarPedidos();
}

async function finalizar(){
  const btn=document.getElementById("btnFinalizar");
  const msg=document.getElementById("msgFinalizar");
  if(!CAIXA.aberta){ alert("Abra o caixa primeiro."); return; }
  if(!CARRINHO.length){ msg.innerHTML=`<div class="err">Adicione itens.</div>`; return; }
  const linhas=PAGAMENTOS.filter(p=>p.formaId&&Number(p.valor)>0);
  if(!linhas.length){ msg.innerHTML=`<div class="err">Informe ao menos uma forma de pagamento.</div>`; return; }
  const total=totalPedido();
  const soma=linhas.reduce((s,p)=>s+Number(p.valor),0);
  if(Math.abs(soma-total)>=0.01 && !confirm(`A soma dos pagamentos (${brl(soma)}) é diferente do total (${brl(total)}). Continuar?`)) return;
  btn.disabled=true; btn.textContent="Processando…";
  const emitirNfce=document.getElementById("emitirNfce").checked;
  const pagamentos=linhas.map(p=>({formaId:p.formaId,formaNome:p.formaNome,valor:Number(p.valor)}));
  const itens=CARRINHO.map(i=>({produtoId:i.produtoId,nome:i.nome,quantidade:i.quantidade,valor:i.valor}));
  try{
    let resp;
    if(PEDIDO_ATUAL){
      resp=await fetch(BACKEND+"/api/caixa-atacado/finalizar",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({pedidoId:PEDIDO_ATUAL.id,numero:PEDIDO_ATUAL.numero,itens,pagamentos,emitirNfce,funcionarioId:S.id,clienteNome:CLIENTE_NOME})}).then(r=>r.json());
    }else{
      resp=await fetch(BACKEND+"/api/pdv/venda",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({itens,pagamentos,emitirNfce,funcionarioId:S.id,clienteNome:CLIENTE_NOME,tipoCaixa:TIPO_CAIXA})}).then(r=>r.json());
    }
    if(resp.erro) throw new Error(resp.erro);
    const nfMsg=emitirNfce?(resp.nfce?.ok?" NFC-e emitida.":(resp.nfce?.erro?" (NFC-e falhou)":"")):"";
    document.getElementById("modais").innerHTML=`
      <div class="modalBg" onclick="fecharModais()"><div class="modal" style="text-align:center">
        <div style="font-size:44px">✅</div><h3>Pedido finalizado!</h3>
        <div class="ok">Total: ${brl(resp.total||total)}.${nfMsg}</div>
        <button class="btn" style="width:100%" onclick="fecharModais();novaVenda();carregarPedidos();carregarSessao().then(render)">OK</button>
      </div></div>`;
  }catch(e){ btn.disabled=false; btn.textContent="✅ Finalizar e receber"; msg.innerHTML=`<div class="err">Erro: ${esc(e.message)}</div>`; }
}

// ---------------- init ----------------
(async function(){
  await carregarSessao();
  try{
    const j=await fetch(BACKEND+"/api/formas-pagamento").then(r=>r.json());
    const todas=(j.data||[]).filter(f=>f.situacao!=="I");
    // mesma lógica do Frente de Caixa: mostra pix, dinheiro, débito e crédito à vista;
    // as outras formas (ficha, estorno, etc) ficam escondidas. Se nada casar, mostra todas.
    const padroes=[/pix/i,/dinheiro/i,/d[eé]bito/i,/cr[eé]dito.*vista/i];
    FORMAS=todas.filter(f=>padroes.some(p=>p.test(f.descricao||f.nome||""))&&!/pix.*bling.*conta/i.test(f.descricao||f.nome||""));
    if(!FORMAS.length) FORMAS=todas;
  }catch(e){ FORMAS=[]; }
  render();
  await carregarPedidos();
})();
</script>
</body>
