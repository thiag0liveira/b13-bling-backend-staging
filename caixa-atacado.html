<script>const BACKEND = location.protocol.indexOf("http") === 0 ? "" : "https://b13-bling-backend-production.up.railway.app";
const S = b13GetSession() || {};
const TIPO_CAIXA = "atacado";
let CAIXA = {
  aberta: false,
  resumo: {}
};
let ULTIMA_VENDA = null; // guarda a última venda concluída, pra reimprimir o comprovante
let PEDIDOS = []; // pedidos não atendidos (coluna extra)
let PEDIDO_ATUAL = null; // {id,numero,situacaoNome,vendedorNome,...} — null = venda nova
let OUTRAS_DESPESAS = 0; // outras despesas que já vieram do pedido do Bling (taxa da vendedora)
let FRETE = 0; // valor do frete que veio do pedido do Bling (entrega)
let COBRAR_TAXA_CARTAO = true; // por padrão cobra 3,5% no cartão de crédito (atacado); pode desmarcar
let CARRINHO = [];
let CLIENTE_NOME = "";
let FORMAS = [];
let PAGAMENTOS = [];
let ULTIMO_ITEM_PAINEL = null; // painel grande: logo ou último produto adicionado
let MODO_PRECO = "atacado"; // 'atacado' (padrão) ou 'varejo' (preço do Bling + lógica de fardo)
let MODO_EDICAO_PAGAMENTO = false; // true = editando o pagamento de um pedido já finalizado (com QR de gerente/admin)
let TOKEN_EDICAO = ""; // QR autorizador guardado só em memória durante a edição (nunca salvo)
let AUTORIZADO_POR = ""; // nome de quem autorizou (só pra exibir)
let AUTORIZOU_MENOR = null; // {autorizadoPor, falta} quando um gerente liberou fechar com valor menor
let DESTINO_PEDIDO = null; // "pronto" (cliente já levou) | "separacao" (vai separar)
let FINALIZANDO = false; // trava global: NUNCA duas finalizações ao mesmo tempo (clique duplo, modal, Enter)
let OP_ID = null; // id único da tentativa de finalização (idempotência no servidor)
function gerarOpId() {
  return "op-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
}
let PIX_BANCOS = {
  bancos: ["Inter", "Santander", "Itaú"],
  padrao: "Inter"
}; // editável na Gestão
let BANCO_PIX_ESCOLHIDO = ""; // banco escolhido ao finalizar um PIX Banco
let _timerBusca = null;
function brl(n) {
  return (Number(n) || 0).toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}
function esc(s) {
  return String(s !== null && s !== void 0 ? s : "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}
function hora(ms) {
  if (!ms) return "—";
  return new Date(ms).toLocaleString("pt-BR", {
    day: "2-digit",
    month: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  });
}
function fecharModais() {
  document.getElementById("modais").innerHTML = "";
}
function subtotal() {
  return CARRINHO.reduce((s, i) => s + Number(i.valor) * Number(i.quantidade), 0);
}
// taxa de cartão de crédito: 3,5% do valor pago em cartão de crédito, só em pedido
// de atacado (algum item de atacado) e quando a cobrança está marcada.
function ehPedidoAtacado() {
  return CARRINHO.some(i => i.modoPreco === "atacado" || i.origemPreco === "atacado") || PEDIDO_ATUAL != null;
}
function valorEmCredito() {
  return PAGAMENTOS.filter(p => /cr[eé]dito/i.test(p.formaNome || "")).reduce((s, p) => s + (Number(p.valor) || 0), 0);
}
function valorEmDebito() {
  return PAGAMENTOS.filter(p => /d[eé]bito/i.test(p.formaNome || "")).reduce((s, p) => s + (Number(p.valor) || 0), 0);
}
const TAXA_CARTAO = 0.035; // 3,5% — repassada ao cliente no atacado
// O valor lançado no cartão JÁ INCLUI a taxa (é o que o cliente passa na maquininha).
// Então a taxa é EXTRAÍDA dele, não somada por cima: taxa = V - V/1,035.
// Isso evita o efeito circular (taxa sobre taxa) que fazia o valor subir ao confirmar.
function taxaCartao() {
  if (!COBRAR_TAXA_CARTAO) return 0;
  if (!ehPedidoAtacado()) return 0; // varejo não tem taxa
  const noCartao = valorEmCredito() + valorEmDebito();
  return +(noCartao * TAXA_CARTAO / (1 + TAXA_CARTAO)).toFixed(2);
}
// quanto cobrar no cartão pra pagar uma parte do pedido: parte + 3,5% dela
function comTaxa(valorProduto) {
  return +(Number(valorProduto || 0) * (1 + TAXA_CARTAO)).toFixed(2);
}
function ehFormaCartao(nome) {
  return /cr[eé]dito/i.test(nome || "") || /d[eé]bito/i.test(nome || "");
}
function totalPedido() {
  return +(subtotal() + OUTRAS_DESPESAS + FRETE + taxaCartao()).toFixed(2);
}

// calcula o valor certo pra cobrar no cartão (crédito/débito) já considerando que a
// própria taxa de 3,5% incide sobre esse valor — sem isso, o operador digita só o
// valor do produto e o "Falta" nunca fecha (fica faltando exatamente a taxa).
// Fórmula: se X = total do que vai no cartão, a taxa é 0,035*X, e o total a receber
// vira (semTaxa + 0,035*X). Pra fechar (pago == total), X precisa cobrir também os
// outros pagamentos (dinheiro/pix) já lançados: X = (semTaxa - outros) / 0,965.
// liga/desliga a taxa e JÁ corrige o valor lançado no cartão: com a taxa ligada o
// valor cobrado inclui os 3,5%; desligada, volta ao valor do produto. Sem isso, ao
// desmarcar sobrava a taxa no cartão e a tela mostrava "troco" num pagamento em cartão.
function alternarTaxaCartao(ligada) {
  COBRAR_TAXA_CARTAO = !!ligada;
  const linhasCartao = PAGAMENTOS.filter(p => ehFormaCartao(p.formaNome));
  if (linhasCartao.length) {
    const fator = ligada ? 1 + TAXA_CARTAO : 1 / (1 + TAXA_CARTAO);
    linhasCartao.forEach(p => {
      p.valor = +(Number(p.valor || 0) * fator).toFixed(2);
    });
  }
  render();
}
function ajustarCartaoComTaxa() {
  const semTaxa = totalSemTaxa();
  const outros = PAGAMENTOS.filter(p => !ehFormaCartao(p.formaNome)).reduce((s, p) => s + (Number(p.valor) || 0), 0);
  const linhasCartao = PAGAMENTOS.filter(p => ehFormaCartao(p.formaNome));
  if (!linhasCartao.length) return;
  // parte do pedido que vai no cartão + 3,5% dela (a taxa fica embutida no valor cobrado)
  const novoTotalCartao = comTaxa(+(semTaxa - outros).toFixed(2));
  if (novoTotalCartao <= 0) {
    alert("Os outros pagamentos já cobrem o total — não sobra valor pra cartão.");
    return;
  }
  const atualCartao = linhasCartao.reduce((s, p) => s + (Number(p.valor) || 0), 0);
  if (linhasCartao.length === 1) {
    linhasCartao[0].valor = novoTotalCartao;
  } else {
    // mais de uma linha de cartão: distribui proporcionalmente ao que já estava em cada uma
    linhasCartao.forEach((p, idx) => {
      const prop = atualCartao > 0 ? (Number(p.valor) || 0) / atualCartao : 1 / linhasCartao.length;
      p.valor = idx === linhasCartao.length - 1 ? +(novoTotalCartao - linhasCartao.slice(0, -1).reduce((s, x) => s + Number(x.valor || 0), 0)).toFixed(2) // último ajusta a sobra do arredondamento
      : +(novoTotalCartao * prop).toFixed(2);
    });
  }
  render();
}
// monta a nota que vai pra observação do Bling: mostra só "PIX: valor" (o banco/maquininha
// é interno e fica nos registros do caixa, não na nota fiscal).
// soma tudo que é PIX (banco de qualquer banco + maquininha) a partir do porForma do resumo
function totalPixForma(porForma) {
  return (porForma || []).filter(f => /pix/i.test(f.nome || "")).reduce((s, f) => s + (Number(f.valor) || 0), 0);
}
function notaPix(pags) {
  const arr = Array.isArray(pags) ? pags : PAGAMENTOS;
  // na observação da nota, o Pix aparece só como "PIX: valor" (o banco/maquininha é
  // informação interna e fica nos registros do caixa, não na nota fiscal)
  const totalPix = arr.filter(p => /pix/i.test(p.formaNome || "")).reduce((s, p) => s + (Number(p.valor) || 0), 0);
  return totalPix > 0.009 ? "PIX: " + brl(totalPix) : "";
}
// pergunta qual banco recebeu o PIX (padrão pré-selecionado); ao confirmar, finaliza
function perguntarBancosPix() {
  const bancos = PIX_BANCOS.bancos && PIX_BANCOS.bancos.length ? PIX_BANCOS.bancos : ["Inter", "Santander", "Itaú"];
  const pad = PIX_BANCOS.padrao && bancos.includes(PIX_BANCOS.padrao) ? PIX_BANCOS.padrao : bancos[0];
  // lista as linhas Pix Banco (com o índice real em PAGAMENTOS)
  const linhas = PAGAMENTOS.map((p, i) => ({
    p,
    i
  })).filter(x => /pix/i.test(x.p.formaNome || "") && /banco/i.test(x.p.formaNome || ""));
  const varios = linhas.length > 1;
  document.getElementById("modais").innerHTML = `
    <div class="modalBg" onclick="if(event.target===this)fecharModais()"><div class="modal">
      <h3>🏦 PIX Banco — qual banco?</h3>
      <div class="muted" style="font-size:12px;margin-bottom:10px">${varios ? "Escolha o banco de cada PIX Banco." : "Selecione o banco que recebeu o PIX."}</div>
      ${linhas.map((x, k) => `
        <div style="border:1px solid #2a2660;border-radius:10px;padding:10px;margin-bottom:8px">
          <div style="font-weight:700;margin-bottom:6px">PIX Banco${varios ? " #" + (k + 1) : ""} — ${brl(x.p.valor)}</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${bancos.map(b => `<label class="forma" style="display:flex;align-items:center;gap:6px;cursor:pointer;margin:0;padding:6px 10px">
              <input type="radio" name="bancoPix_${x.i}" value="${esc(b)}" ${b === (x.p.banco || pad) ? "checked" : ""}> <span>${esc(b)}</span></label>`).join("")}
          </div>
        </div>`).join("")}
      <div style="display:flex;gap:8px;margin-top:6px">
        <button class="btn" style="flex:1" onclick="confirmarBancosPix()">Confirmar e finalizar</button>
        <button class="btn btn-ghost" onclick="fecharModais()">Cancelar</button>
      </div>
    </div></div>`;
}
function confirmarBancosPix() {
  // aplica o banco escolhido em cada linha Pix Banco
  PAGAMENTOS.forEach((p, i) => {
    if (/pix/i.test(p.formaNome || "") && /banco/i.test(p.formaNome || "")) {
      const sel = document.querySelector(`input[name="bancoPix_${i}"]:checked`);
      p.banco = sel ? sel.value : PIX_BANCOS.padrao || "Inter";
    }
  });
  fecharModais();
  finalizar();
}
function totalPago() {
  return PAGAMENTOS.reduce((s, p) => s + (Number(p.valor) || 0), 0);
}
// TROCO só existe em DINHEIRO — cartão e pix não devolvem troco (se o valor do
// cartão passou do total, é erro de digitação, não troco).
function valorEmDinheiro() {
  return PAGAMENTOS.filter(p => /dinheiro/i.test(p.formaNome || "")).reduce((s, p) => s + (Number(p.valor) || 0), 0);
}
function trocoAtual() {
  const sobra = -restante(); // quanto passou do total
  if (sobra < 0.009) return 0;
  const dinheiro = valorEmDinheiro();
  if (dinheiro < 0.009) return 0; // sobrou, mas não tem dinheiro: não é troco
  return +Math.min(sobra, dinheiro).toFixed(2); // nunca devolve mais do que veio em dinheiro
}
// sobra que NÃO é troco (ex.: cartão digitado a mais) — isso é erro, precisa avisar
function sobraSemDinheiro() {
  const sobra = -restante();
  if (sobra < 0.009) return 0;
  return +(sobra - trocoAtual()).toFixed(2);
}
// tira da observação as notas automáticas do sistema, deixando só o texto do usuário
function limparObs(obs) {
  if (!obs) return "";
  return String(obs).split("\n").filter(l => !/^\s*\[Altera[çc][ãa]o/i.test(l)).map(l => l.split(" · ").filter(p => {
    const t = p.trim();
    return !(/^PIX da maquininha:/i.test(t) || /^PIX Banco/i.test(t) || /^PIX:\s/i.test(t) || /^Total PIX/i.test(t) || /VALOR MENOR/i.test(t));
  }).join(" · ")).join("\n").replace(/\s*\|\s*edit\s+[\d-]+\s+[\d:]+/gi, "").trim();
}
function restante() {
  return +(totalPedido() - totalPago()).toFixed(2);
}

// ---------------- sessão de caixa ----------------
async function carregarSessao() {
  try {
    const j = await fetch(BACKEND + "/api/caixa-sessao/atual?tipoCaixa=" + TIPO_CAIXA + "&funcionarioId=" + encodeURIComponent(S.id || "")).then(r => r.json());
    CAIXA = j.aberta ? {
      aberta: true,
      sessao: j.sessao,
      resumo: j.resumo,
      movimentos: j.movimentos
    } : {
      aberta: false,
      resumo: {}
    };
  } catch (e) {
    CAIXA = {
      aberta: false,
      resumo: {}
    };
  }
}
function cliqueAbrirFechar() {
  if (CAIXA.aberta) modalFechar();else modalAbrir();
}
function modalAbrir() {
