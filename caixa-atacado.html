<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B13 — Caixa Atacado</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
  body{background:#0f0d24;color:#fff;min-height:100vh}
  .top{background:#181542;padding:14px 20px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.4);position:sticky;top:0;z-index:10;flex-wrap:wrap}
  .top img{height:36px}
  .top .t{font-weight:900;font-size:20px}
  .top .sp{flex:1}
  .pill{font-size:13px;font-weight:800;padding:8px 14px;border-radius:20px}
  .pill.aberto{background:#0a3a20;color:#8fffc0;border:1px solid #2f9e6b}
  .pill.fechado{background:#3a0010;color:#ff8090;border:1px solid #ff4466}
  .pill.nfce{background:#2a2000;color:#ffd23f;border:1px solid #7a6a00}
  .btn{background:#FF0082;color:#fff;border:none;border-radius:10px;padding:14px 22px;font-weight:800;font-size:15px;cursor:pointer;min-height:48px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-ghost{background:transparent;border:1px solid #514c96;color:#fff}
  .btn-sm{padding:11px 16px;font-size:14px;min-height:42px}
  .wrap{max-width:1500px;margin:0 auto;padding:16px;display:grid;grid-template-columns:280px 1fr 1fr 1fr;gap:16px}
  @media(max-width:1300px){ .wrap{grid-template-columns:260px 1fr 1fr} }
  @media(max-width:1000px){ .wrap{grid-template-columns:1fr 1fr} }
  @media(max-width:700px){ .wrap{grid-template-columns:1fr} .top{padding:10px 12px} .top .t{font-size:17px} }
  .card{background:#181542;border-radius:14px;padding:16px;margin-bottom:14px}
  .card h3{font-size:16px;margin-bottom:10px}
  .busca{width:100%;padding:16px;font-size:17px;background:#0f0d24;border:2px solid #514c96;border-radius:10px;color:#fff}
  .busca:focus{border-color:#FF0082;outline:none}
  .res{margin-top:8px;max-height:340px;overflow:auto}
  .resitem{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #2a2660;cursor:pointer;border-radius:8px}
  .resitem:hover{background:#1f1c4d}
  .resitem img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:6px;flex-shrink:0}
  .resitem .semimg{width:52px;height:52px;background:#241f52;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .resitem .info{flex:1;min-width:0}
  .resitem .nome{font-size:14px;font-weight:700}
  .resitem .meta{font-size:12px;color:#9a95c9}
  .resitem .preco{font-weight:900;color:#ffd23f;font-size:15px}
  .item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #2a2660;font-size:14px}
  .item .nome{flex:1;min-width:0}
  .item .qtd{display:flex;align-items:center;gap:6px}
  .item .qtd button{width:38px;height:38px;background:#1c1846;border:1px solid #514c96;border-radius:8px;color:#fff;cursor:pointer;font-size:18px;font-weight:800}
  .item .qtd input{width:52px;text-align:center;background:#0f0d24;border:1px solid #514c96;border-radius:6px;color:#fff;padding:8px;font-size:15px}
  .item .subtotal{width:90px;text-align:right;font-weight:800}
  .item .rm{background:#3a0010;border:1px solid #ff4466;color:#ff8090;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;min-height:38px}
  .linha{display:flex;justify-content:space-between;padding:8px 0;font-size:15px;align-items:center}
  .total{font-size:30px;font-weight:900;color:#ffd23f}
  .formas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .forma{background:#1c1846;border:2px solid #514c96;border-radius:12px;padding:18px 12px;text-align:center;cursor:pointer;font-size:15px;font-weight:800;min-height:64px;display:flex;align-items:center;justify-content:center}
  .forma.sel{border-color:#FF0082;background:#2a1a4d}
  .pagRow{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px}
  .pagRow input{width:120px;background:#0f0d24;border:1px solid #514c96;border-radius:8px;color:#fff;padding:10px;text-align:right;font-size:15px}
  .muted{color:#9a95c9;font-size:12px}
  .err{background:#3a0010;border:1px solid #ff4466;color:#ff8090;border-radius:8px;padding:12px;margin:10px 0;font-size:14px}
  .ok{background:#0a3a20;border:1px solid #2f9e6b;color:#8fffc0;border-radius:8px;padding:16px;margin:10px 0;font-size:15px;text-align:center}
  input[type=checkbox]{width:20px;height:20px}
  input[type=number],input[type=text]{background:#0f0d24;border:1px solid #514c96;border-radius:8px;color:#fff;padding:10px;font-size:15px}
  .modalBg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal{background:#181542;border-radius:14px;padding:22px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
  .modal input[type=number],.modal input[type=text]{width:100%;font-size:16px;padding:12px}
  /* coluna de pedidos — compacta */
  .pedBusca{width:100%;padding:10px;font-size:14px;background:#0f0d24;border:1px solid #514c96;border-radius:8px;color:#fff;margin-bottom:8px}
  .pedLista{max-height:calc(100vh - 230px);overflow:auto}
  .pedItem{padding:8px 10px;border:1px solid #2a2660;border-radius:8px;margin-bottom:6px;cursor:pointer;background:#12102e}
  .pedItem:hover{border-color:#FF0082}
  .pedItem.sel{border-color:#FF0082;background:#241a44}
  .pedItem .l1{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .pedItem .num{font-weight:800;font-size:13px}
  .pedItem .val{font-weight:800;color:#8fffc0;font-size:13px}
  .pedItem .cli{font-size:11px;color:#cfc9f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stag{display:inline-block;font-size:9px;font-weight:800;padding:1px 6px;border-radius:10px;background:#2a2660;color:#cfc9f5;margin-top:2px}
  .bloqueio{text-align:center;padding:50px 20px}
</style>

if(!b13RequireLogin())document.write=function(){};
if(!b13BloquearSeSemAcesso("/caixa-atacado"))document.write=function(){};
document.addEventListener("DOMContentLoaded",function(){
  const nav=document.createElement("div");
  nav.innerHTML=b13RenderNav("/caixa-atacado");
  document.body.insertBefore(nav,document.body.firstChild);

<div class="top">
  <img src="/logo">
  <div class="t">Caixa Atacado</div>
  <span id="pillCaixa" class="pill fechado">Caixa fechado</span>
  <button id="pillModo" class="pill" onclick="alternarModoPreco()" style="cursor:pointer;background:#1a2a44;color:#7fd4ff" title="Toque pra alternar entre preço de atacado e varejo">🏷️ Atacado</button>
  <div class="sp"></div>
  <button class="btn btn-ghost btn-sm" onclick="abrirModalMinhasVendas()">🧾 Minhas Vendas</button>
  <button class="btn btn-ghost btn-sm" onclick="imprimirPedidoAtual()">🧾 Imprimir pedido atual</button>
  <button class="btn btn-ghost btn-sm" onclick="imprimirComprovante(ULTIMA_VENDA)">🖨️ Reimprimir última venda</button>
  <button class="btn btn-ghost btn-sm" onclick="imprimirPorNumero()">🔢 Imprimir por nº do pedido</button>
  <button class="btn btn-ghost btn-sm" onclick="abrirModalMovimento('sangria')">💸 Sangria</button>
  <button class="btn btn-ghost btn-sm" onclick="abrirModalMovimento('suprimento')">💰 Suprimento</button>
  <button class="btn btn-ghost btn-sm" onclick="abrirModalCaixasAbertos()">🏪 Caixas Abertos</button>
  <button class="btn btn-ghost btn-sm" onclick="abrirModalHistorico()">📜 Histórico</button>
  <button class="btn btn-sm" id="btnAbrirFechar" onclick="cliqueAbrirFechar()">🔓 Abrir caixa</button>
</div>

<div id="conteudo"></div>
<div id="modais"></div>

<script>
const BACKEND=(location.protocol.indexOf("http")===0)?"":"https://b13-bling-backend-production.up.railway.app";
const S=b13GetSession()||{};
const TIPO_CAIXA="atacado";

let CAIXA={aberta:false,resumo:{}};
let ULTIMA_VENDA=null; // guarda a última venda concluída, pra reimprimir o comprovante
let PEDIDOS=[];          // pedidos não atendidos (coluna extra)
let PEDIDO_ATUAL=null;   // {id,numero,situacaoNome,vendedorNome,...} — null = venda nova
let OUTRAS_DESPESAS=0;   // outras despesas que já vieram do pedido do Bling (taxa da vendedora)
let FRETE=0;            // valor do frete que veio do pedido do Bling (entrega)
let COBRAR_TAXA_CARTAO=true; // por padrão cobra 3,5% no cartão de crédito (atacado); pode desmarcar
let CARRINHO=[];
let CLIENTE_NOME="";
let FORMAS=[];
let PAGAMENTOS=[];
let ULTIMO_ITEM_PAINEL=null;   // painel grande: logo ou último produto adicionado
let MODO_PRECO="atacado";      // 'atacado' (padrão) ou 'varejo' (preço do Bling + lógica de fardo)
let MODO_EDICAO_PAGAMENTO=false; // true = editando o pagamento de um pedido já finalizado (com QR de gerente/admin)
let TOKEN_EDICAO="";             // QR autorizador guardado só em memória durante a edição (nunca salvo)
let AUTORIZADO_POR="";           // nome de quem autorizou (só pra exibir)
let AUTORIZOU_MENOR=null;        // {autorizadoPor, falta} quando um gerente liberou fechar com valor menor
let PIX_BANCOS={bancos:["Inter","Santander","Itaú"],padrao:"Inter"}; // editável na Gestão
let BANCO_PIX_ESCOLHIDO="";       // banco escolhido ao finalizar um PIX Banco
let _timerBusca=null;

function brl(n){ return (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function hora(ms){ if(!ms) return "—"; return new Date(ms).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }
function fecharModais(){ document.getElementById("modais").innerHTML=""; }

function subtotal(){ return CARRINHO.reduce((s,i)=>s+Number(i.valor)*Number(i.quantidade),0); }
// taxa de cartão de crédito: 3,5% do valor pago em cartão de crédito, só em pedido
// de atacado (algum item de atacado) e quando a cobrança está marcada.
function ehPedidoAtacado(){ return CARRINHO.some(i=>i.modoPreco==="atacado"||i.origemPreco==="atacado") || (PEDIDO_ATUAL!=null); }
function valorEmCredito(){
  return PAGAMENTOS.filter(p=>/cr[eé]dito/i.test(p.formaNome||"")).reduce((s,p)=>s+(Number(p.valor)||0),0);
}
function valorEmDebito(){
  return PAGAMENTOS.filter(p=>/d[eé]bito/i.test(p.formaNome||"")).reduce((s,p)=>s+(Number(p.valor)||0),0);
}
function taxaCartao(){
  if(!COBRAR_TAXA_CARTAO) return 0;
  if(!ehPedidoAtacado()) return 0; // varejo não tem taxa
  return +((valorEmCredito()+valorEmDebito())*0.035).toFixed(2);
}
function totalPedido(){ return +(subtotal()+OUTRAS_DESPESAS+FRETE+taxaCartao()).toFixed(2); }
// monta a nota que vai pra observação do Bling: mostra só "PIX: valor" (o banco/maquininha
// é interno e fica nos registros do caixa, não na nota fiscal).
// soma tudo que é PIX (banco de qualquer banco + maquininha) a partir do porForma do resumo
function totalPixForma(porForma){ return (porForma||[]).filter(f=>/pix/i.test(f.nome||"")).reduce((s,f)=>s+(Number(f.valor)||0),0); }
function notaPix(pags){
  const arr=Array.isArray(pags)?pags:PAGAMENTOS;
  // na observação da nota, o Pix aparece só como "PIX: valor" (o banco/maquininha é
  // informação interna e fica nos registros do caixa, não na nota fiscal)
  const totalPix=arr.filter(p=>/pix/i.test(p.formaNome||"")).reduce((s,p)=>s+(Number(p.valor)||0),0);
  return totalPix>0.009 ? ("PIX: "+brl(totalPix)) : "";
}
// pergunta qual banco recebeu o PIX (padrão pré-selecionado); ao confirmar, finaliza
function perguntarBancosPix(){
  const bancos=(PIX_BANCOS.bancos&&PIX_BANCOS.bancos.length)?PIX_BANCOS.bancos:["Inter","Santander","Itaú"];
  const pad=(PIX_BANCOS.padrao&&bancos.includes(PIX_BANCOS.padrao))?PIX_BANCOS.padrao:bancos[0];
  // lista as linhas Pix Banco (com o índice real em PAGAMENTOS)
  const linhas=PAGAMENTOS.map((p,i)=>({p,i})).filter(x=>/pix/i.test(x.p.formaNome||"")&&/banco/i.test(x.p.formaNome||""));
  const varios=linhas.length>1;
  document.getElementById("modais").innerHTML=`
    <div class="modalBg" onclick="if(event.target===this)fecharModais()"><div class="modal">
      <h3>🏦 PIX Banco — qual banco?</h3>
      <div class="muted" style="font-size:12px;margin-bottom:10px">${varios?"Escolha o banco de cada PIX Banco.":"Selecione o banco que recebeu o PIX."}</div>
      ${linhas.map((x,k)=>`
        <div style="border:1px solid #2a2660;border-radius:10px;padding:10px;margin-bottom:8px">
          <div style="font-weight:700;margin-bottom:6px">PIX Banco${varios?(" #"+(k+1)):""} — ${brl(x.p.valor)}</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${bancos.map(b=>`<label class="forma" style="display:flex;align-items:center;gap:6px;cursor:pointer;margin:0;padding:6px 10px">
              <input type="radio" name="bancoPix_${x.i}" value="${esc(b)}" ${b===(x.p.banco||pad)?"checked":""}> <span>${esc(b)}</span></label>`).join("")}
          </div>
        </div>`).join("")}
      <div style="display:flex;gap:8px;margin-top:6px">
        <button class="btn" style="flex:1" onclick="confirmarBancosPix()">Confirmar e finalizar</button>
        <button class="btn btn-ghost" onclick="fecharModais()">Cancelar</button>
      </div>
    </div></div>`;
}
function confirmarBancosPix(){
  // aplica o banco escolhido em cada linha Pix Banco
  PAGAMENTOS.forEach((p,i)=>{
    if(/pix/i.test(p.formaNome||"")&&/banco/i.test(p.formaNome||"")){
      const sel=document.querySelector(`input[name="bancoPix_${i}"]:checked`);
      p.banco = sel ? sel.value : (PIX_BANCOS.padrao||"Inter");
    }
  });
  fecharModais();
  finalizar();
}
function totalPago(){ return PAGAMENTOS.reduce((s,p)=>s+(Number(p.valor)||0),0); }
// tira da observação as notas automáticas do sistema, deixando só o texto do usuário
function limparObs(obs){
  if(!obs) return "";
  return String(obs).split("\n")
    .filter(l=>!/^\s*\[Altera[çc][ãa]o/i.test(l))
    .map(l=>l.split(" · ").filter(p=>{
      const t=p.trim();
      return !(/^PIX da maquininha:/i.test(t) || /^PIX Banco/i.test(t) || /^PIX:\s/i.test(t) || /^Total PIX/i.test(t) || /VALOR MENOR/i.test(t));
    }).join(" · "))
    .join("\n")
    .replace(/\s*\|\s*edit\s+[\d-]+\s+[\d:]+/gi,"")
    .trim();
}
function restante(){ return +(totalPedido()-totalPago()).toFixed(2); }

// ---------------- sessão de caixa ----------------
async function carregarSessao(){
  try{
    const j=await fetch(BACKEND+"/api/caixa-sessao/atual?tipoCaixa="+TIPO_CAIXA+"&funcionarioId="+encodeURIComponent(S.id||"")).then(r=>r.json());
    CAIXA = j.aberta ? {aberta:true,sessao:j.sessao,resumo:j.resumo,movimentos:j.movimentos} : {aberta:false,resumo:{}};
  }catch(e){ CAIXA={aberta:false,resumo:{}}; }
}

function cliqueAbrirFechar(){ if(CAIXA.aberta) modalFechar(); else modalAbrir(); }

function modalAbrir(){
  document.getElementById("modais").innerHTML=`
    <div class="modalBg" onclick="if(event.target===this)fecharModais()"><div class="modal">
      <h3>🔓 Abrir caixa atacado</h3>
      <p class="muted" style="margin-bottom:8px">Informe o troco inicial (fundo de caixa).</p>
      <input id="mTroco" type="number" step="0.01" placeholder="0,00" style="text-align:center;font-size:20px" autofocus>
      <div id="mErro"></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn" style="flex:1" onclick="confirmarAbrir()">Abrir caixa</button>
        <button class="btn btn-ghost" onclick="fecharModais()">Cancelar</button>
      </div>
    </div></div>`;
}
async function confirmarAbrir(){
  const trocoInicial=+document.getElementById("mTroco").value||0;
  try{
    const r=await fetch(BACKEND+"/api/caixa-sessao/abrir",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({trocoInicial,operador:S.nome,funcionarioId:S.id,tipoCaixa:TIPO_CAIXA})}).then(r=>r.json());
    if(r.erro) throw new Error(r.erro);
    CAIXA={aberta:true,sessao:r.sessao,resumo:r.resumo,movimentos:[]};
    fecharModais(); render();
  }catch(e){ document.getElementById("mErro").innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

function abrirModalMovimento(tipo){
  if(!CAIXA.aberta){ alert("Abra o caixa primeiro."); return; }
  const t=tipo==="sangria"?"💸 Sangria (retirada)":"💰 Suprimento (entrada)";
  document.getElementById("modais").innerHTML=`
    <div class="modalBg" onclick="if(event.target===this)fecharModais()"><div class="modal">
      <h3>${t}</h3>
      <input id="mVal" type="number" step="0.01" placeholder="Valor" style="margin-bottom:8px" autofocus>
      <input id="mMot" type="text" placeholder="Motivo (opcional)">
      <div id="mErro"></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn" style="flex:1" onclick="confirmarMovimento('${tipo}')">Confirmar</button>
        <button class="btn btn-ghost" onclick="fecharModais()">Cancelar</button>
      </div>
    </div></div>`;
}
async function confirmarMovimento(tipo){
  const valor=+document.getElementById("mVal").value||0;
  const motivo=document.getElementById("mMot").value||"";
  if(!(valor>0)){ document.getElementById("mErro").innerHTML=`<div class="err">Informe um valor maior que zero.</div>`; return; }
  try{
    const r=await fetch(BACKEND+"/api/caixa-sessao/movimento",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({tipo,valor,motivo,operador:S.nome,funcionarioId:S.id,tipoCaixa:TIPO_CAIXA})}).then(r=>r.json());
    if(r.erro) throw new Error(r.erro);
    await carregarSessao(); render();
    // guarda o movimento pra impressão e mostra sucesso com botão de imprimir
    const mov={tipo,valor,motivo,operador:S.nome,em:Date.now()};
    window._ultimoMovimento=mov;
    const ehSangria=tipo==="sangria";
    document.getElementById("modais").innerHTML=`
      <div class="modalBg" onclick="fecharModais()"><div class="modal" style="text-align:center">
        <div style="font-size:42px">${ehSangria?'💸':'💰'}</div>
        <h3>${ehSangria?'Sangria registrada':'Suprimento registrado'}</h3>
        <div class="ok">${brl(valor)}${motivo?' · '+esc(motivo):''}</div>
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="btn btn-ghost" style="flex:1" onclick="imprimirMovimento(window._ultimoMovimento)">🖨️ Imprimir</button>
          <button class="btn" style="flex:1" onclick="fecharModais()">OK</button>
        </div>
      </div></div>`;
  }catch(e){ document.getElementById("mErro").innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

async function modalFechar(){
  await carregarSessao();
  const r=CAIXA.resumo||{};
  document.getElementById("modais").innerHTML=`
    <div class="modalBg" onclick="if(event.target===this)fecharModais()"><div class="modal">
      <h3>🔒 Fechar caixa — conferência</h3>
      <div class="card" style="background:#12102e">
        <div class="linha"><span>Troco inicial</span><b>${brl(r.trocoInicial)}</b></div>
        <div class="linha"><span>Vendas em dinheiro</span><b>${brl(r.vendasDinheiro)}</b></div>
        <div class="linha"><span>+ Suprimentos</span><b style="color:#8fffc0">${brl(r.totalSuprimentos)}</b></div>
        <div class="linha"><span>− Sangrias</span><b style="color:#ff8090">${brl(r.totalSangrias)}</b></div>
        <div class="linha" style="border-top:1px solid #2a2660;padding-top:8px"><span><b>Esperado na gaveta</b></span><b style="color:#ffd23f;font-size:18px">${brl(r.esperadoGaveta)}</b></div>
      </div>
      ${(r.porForma||[]).length?`<div class="card" style="background:#12102e">
        <div style="font-weight:800;margin-bottom:4px">💳 Por forma de pagamento</div>
        <div class="linha"><span>Vendas (${r.qtdVendas||0})</span><b>${brl(r.totalVendas)}</b></div>
        ${r.porForma.map(f=>`<div class="linha" style="font-size:13px"><span>${esc(f.nome)} <span class="muted">(${f.qtd}x)</span></span><b>${brl(f.valor)}</b></div>`).join("")}

async function carregarPedidos(){
  try{
    const j=await fetch(BACKEND+"/api/caixa-atacado/pedidos-nao-atendidos").then(r=>r.json());
    PEDIDOS=j.data||[];
  }catch(e){ PEDIDOS=[]; }
  pintarPedidos();
}
function pintarPedidos(){
  const box=document.getElementById("pedLista"); if(!box) return;
  const f=(window._filtroPed||"").toLowerCase().trim();
  let lista=PEDIDOS;
  if(f) lista=lista.filter(p=>String(p.numero||"").includes(f)||String(p.clienteNome||"").toLowerCase().includes(f));
  // se o filtro é um número e não achou na lista carregada, oferece buscar no Bling
  const ehNumero=/^\d+$/.test(f);
  const nadaNaLista=!lista.length;
  let extra="";
  if(f && nadaNaLista && ehNumero){
    extra=`<div class="muted" style="padding:8px">Nenhum pedido #${esc(f)} entre os recentes.
      <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px" onclick="buscarPedidoNoBling('${esc(f)}')">🔎 Buscar #${esc(f)} no Bling</button></div>`;
  }
  if(nadaNaLista){ box.innerHTML=extra||`<div class="muted" style="padding:8px">${PEDIDOS.length?"Nenhum pedido bate com o filtro.":"Nenhum pedido a receber."}</div>`; return; }
  box.innerHTML=lista.map(p=>`
    <div class="pedItem ${PEDIDO_ATUAL&&PEDIDO_ATUAL.id===p.id?'sel':''}" onclick="abrirPedido('${p.id}')">
      <div class="l1"><span class="num">#${esc(p.numero||p.id)}</span><span class="val">${brl(p.total)}</span></div>
      <div class="cli">${esc(p.clienteNome||"sem cliente")}</div>
      <span class="stag">${esc(p.situacaoNome||"")}</span>
    </div>`).join("") + (ehNumero?extra:"");
}

// quando bipam um código longo no filtro (cara de código de pedido do totem, não
// de filtro rápido), dispara a busca no Bling automaticamente após uma pequena pausa
let _timerBuscaPed=null;
function agendarBuscaPedido(v){
  clearTimeout(_timerBuscaPed);
  const t=String(v||"").trim();
  // 7+ dígitos = é um id/número de pedido bipado, não alguém filtrando "5001"
  if(/^\d{7,}$/.test(t)){
    const naLista=PEDIDOS.some(p=>String(p.numero||"")===t);
    if(!naLista) _timerBuscaPed=setTimeout(()=>buscarPedidoNoBling(t),400);
  }
}

// busca um pedido pelo número direto no Bling (fora da janela dos recentes)
function pesquisarPedidoDigitado(){
  const el=document.querySelector(".pedBusca");
  const v=((el?el.value:window._filtroPed)||"").trim();
  if(!v){ pintarPedidos(); return; }
  window._filtroPed=v;
  if(/^\d+$/.test(v)){ buscarPedidoNoBling(v); } // sempre re-pesquisa no Bling, mesmo se já estiver na lista
  else { pintarPedidos(); }
}

async function buscarPedidoNoBling(numero){
  const box=document.getElementById("pedLista");
  if(box) box.innerHTML=`<div class="muted" style="padding:8px">Procurando #${esc(numero)} no Bling…</div>`;
  try{
    const j=await fetch(BACKEND+"/api/caixa-atacado/buscar-pedido/"+encodeURIComponent(numero)).then(r=>r.json());
    if(j.erro) throw new Error(j.erro);
    if(!j.achou){ if(box) box.innerHTML=`<div class="muted" style="padding:8px">Pedido #${esc(numero)} não encontrado no Bling.<button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px" onclick="window._filtroPed='';pintarPedidos()">Voltar</button></div>`; return; }
    // já finalizado (atendido/pago) → pode reabrir com autorização; cancelado → não
    if(j.atendido || j.cancelado){
      const podeReabrir=!!j.atendido;
      document.getElementById("modais").innerHTML=`
        <div class="modalBg" onclick="if(event.target===this)fecharModais()"><div class="modal" style="text-align:center">
          <div style="font-size:42px">${j.atendido?'✅':'🚫'}</div>
          <h3>Pedido #${esc(j.numero)} ${j.atendido?'já finalizado':'cancelado'}</h3>
          <div class="muted">Este pedido está como <b>${esc(j.situacaoNome)}</b>.${podeReabrir?' Um gerente, financeiro ou admin pode reabrir pra corrigir a forma de pagamento.':''}</div>
          <div style="display:flex;gap:8px;margin-top:14px">
            ${podeReabrir?`<button class="btn" style="flex:1" onclick="pedirAutorizacaoReabrir(${j.id},'${esc(j.numero)}')">🔓 Reabrir com autorização</button>`:''}
            <button class="btn btn-ghost" style="flex:1" onclick="fecharModais();window._filtroPed='';pintarPedidos()">${podeReabrir?'Cancelar':'OK'}</button>
          </div>
        </div></div>`;
      if(box) box.innerHTML=`<div class="muted" style="padding:8px">Pedido #${esc(numero)} ${j.atendido?'já finalizado':'cancelado'}.<button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px" onclick="window._filtroPed='';pintarPedidos()">Voltar</button></div>`;
      return;
    }
    // não atendido → abre normalmente
    abrirPedido(j.id);
    window._filtroPed=""; pintarPedidos();
  }catch(e){ if(box) box.innerHTML=`<div class="err">Erro: ${esc(e.message)}</div>`; }
}

async function abrirPedido(id){
  try{
    const j=await fetch(BACKEND+"/api/caixa-atacado/pedido/"+id).then(r=>r.json());
    if(j.erro) throw new Error(j.erro);
    PEDIDO_ATUAL={id:j.id,numero:j.numero,situacaoNome:j.situacaoNome,vendedorNome:j.vendedorNome,contatoId:j.contatoId};
    CLIENTE_NOME=j.clienteNome||"";
    CARRINHO=(j.itens||[]).map(it=>({produtoId:it.produtoId,nome:it.nome,quantidade:it.quantidade,valor:it.valor,codigo:it.codigo,modoPreco:"atacado"}));
    OUTRAS_DESPESAS=Number(j.outrasDespesas||0); // puxa a taxa que a vendedora colocou
    FRETE=Number(j.frete||0); // puxa o frete do pedido (entrega)
    COBRAR_TAXA_CARTAO=true;
    PAGAMENTOS=[];
    ULTIMO_ITEM_PAINEL=null; // volta a logo até bipar um produto
    window._obsVenda=limparObs(j.observacao||""); // carrega a observação existente do pedido (sem as notas automáticas)
    render();
  }catch(e){ alert("Não foi possível abrir o pedido: "+e.message); }
}

// ---- reabrir pedido JÁ FINALIZADO pra corrigir a forma de pagamento (só com QR de gerente/admin) ----
// ---- prompt reutilizável de QR de autorização (gerente/financeiro/admin) ----
function pedirQrAcao(titulo, texto, onConfirm){
  document.getElementById("modais").innerHTML=`
    <div class="modalBg" onclick="if(event.target===this)fecharModais()"><div class="modal">
      <h3>${titulo}</h3>
      <p class="muted" style="margin-bottom:8px">${texto}</p>
      <div class="muted" style="margin-bottom:4px">QR de autorização</div>
      <input id="qrAcao" type="password" inputmode="text" placeholder="Bipe o QR ou cole o código"
        autocomplete="new-password" name="qr_${Date.now()}" autocorrect="off" autocapitalize="off" spellcheck="false"
        data-lpignore="true" data-1p-ignore data-form-type="other" autofocus>
      <div id="qrErroAcao"></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn" style="flex:1" id="btnQrAcao">Confirmar</button>
        <button class="btn btn-ghost" onclick="fecharModais()">Cancelar</button>
      </div>
    </div></div>`;
  const go=async()=>{
    const campo=document.getElementById("qrAcao");
    const tokenQr=(campo?.value||"").trim();
    const erroEl=document.getElementById("qrErroAcao");
    if(!tokenQr){ if(erroEl) erroEl.innerHTML=`<div class="err">Leia ou cole o QR de autorização.</div>`; return; }
    await onConfirm(tokenQr, campo, erroEl);
  };
  setTimeout(()=>{
    const t=document.getElementById("qrAcao");
    if(t) t.addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); go(); } });
    const b=document.getElementById("btnQrAcao");
    if(b) b.onclick=go;
  },50);
}

// ---- pagamento MENOR que o total: pede QR de gerente/admin pra liberar ----
function pedirQrValorMenor(falta){
  pedirQrAcao(
    `⚠️ Fechar com valor menor`,
    `O pagamento está <b>${brl(falta)}</b> abaixo do total. Fechar assim precisa da autorização de um gerente, financeiro ou admin. Leia o QR pra liberar.`,
    async (tokenQr, campo, erroEl)=>{
      try{
        const r=await fetch(BACKEND+"/api/caixa-atacado/autorizar",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({tokenQr})}).then(r=>r.json());
        if(r.erro) throw new Error(r.erro);
        AUTORIZOU_MENOR={autorizadoPor:r.autorizadoPor||"—", falta:+Number(falta).toFixed(2)};
        if(campo) campo.value="";
        fecharModais();
        finalizar(); // segue o fechamento já autorizado
      }catch(e){ if(campo) campo.value=""; if(erroEl) erroEl.innerHTML=`<div class="err">${esc(e.message)}</div>`; }
    }
  );
}

// ---- reabrir pedido finalizado: QR no INÍCIO (só abre com autorização) ----
function pedirAutorizacaoReabrir(id,numero){
  pedirQrAcao(
    `🔓 Reabrir pedido #${esc(numero)}`,
    "Reabrir um pedido já finalizado precisa da autorização de um gerente, financeiro ou admin. Leia o QR do caixa (ou cole o código).",
    async (tokenQr, campo, erroEl)=>{

        const r=await fetch(BACKEND+"/api/caixa-atacado/autorizar",{method:"POST",headers:{"Content-Type":"application/json"},

        AUTORIZADO_POR=r.autorizadoPor||"";

      }catch(e){ if(campo) campo.value=""; if(erroEl) erroEl.innerHTML=`<div class="err">${esc(e.message)}</div>`; }
    }
  );
}
async function conferirPedidoContraBling(id){
  try{
    const c=await fetch(BACKEND+"/api/caixa-atacado/conferir-bling/"+id).then(r=>r.json());
    if(!c||!c.ok||!c.difere) return; // bate com o Bling: não incomoda
    const lin=(txt)=>`<div style="padding:6px 8px;border-bottom:1px solid #2c2660;font-size:13px">${txt}</div>`;
    let html="";
    if(c.total&&c.total.difere) html+=lin(`💰 <b>Total</b>: caixa ${brl(c.total.caixa)} × Bling <b>${brl(c.total.bling)}</b>`);
    (c.itens?.divergentes||[]).forEach(d=>{ html+=lin(`✏️ <b>${esc(d.nome)}</b>: caixa ${d.caixa.quantidade}× ${brl(d.caixa.valor)} × Bling ${d.bling.quantidade}× ${brl(d.bling.valor)}`); });
    (c.itens?.soNoCaixa||[]).forEach(i=>{ html+=lin(`➕ Só no <b>caixa</b>: ${i.quantidade}× ${esc(i.nome)}`); });
    (c.itens?.soNoBling||[]).forEach(i=>{ html+=lin(`➖ Só no <b>Bling</b>: ${i.quantidade}× ${esc(i.nome)}`); });
    if(!html) return;
    document.getElementById("modais").innerHTML=`
      <div class="modalBg"><div class="modal">
        <h3 style="color:#ffd23f">⚠️ Este pedido não bate com o Bling</h3>
        <div class="muted" style="margin:6px 0 10px">O que o caixa registrou está diferente do que está no Bling. O <b>Bling é a fonte certa</b> (estoque/fiscal). Confira antes de mexer:</div>
        <div style="max-height:50vh;overflow:auto;border:1px solid #2c2660;border-radius:8px">${html}</div>
        <button class="btn btn-mag" style="width:100%;margin-top:14px" onclick="fecharModais()">Entendi, continuar</button>
      </div></div>`;
  }catch(e){}
}

async function abrirPedidoParaEdicao(id){
  try{
    const j=await fetch(BACKEND+"/api/caixa-atacado/pedido/"+id).then(r=>r.json());
    if(j.erro) throw new Error(j.erro);
    PEDIDO_ATUAL={id:j.id,numero:j.numero,situacaoNome:j.situacaoNome,vendedorNome:j.vendedorNome,contatoId:j.contatoId};
    CLIENTE_NOME=j.clienteNome||"";
    // itens travados (precoEditado) — na edição de pagamento não se mexe nos itens
    CARRINHO=(j.itens||[]).map(it=>({produtoId:it.produtoId,nome:it.nome,quantidade:it.quantidade,valor:it.valor,codigo:it.codigo,modoPreco:"atacado",precoEditado:true}));
    OUTRAS_DESPESAS=Number(j.outrasDespesas||0);
    FRETE=Number(j.frete||0);
    COBRAR_TAXA_CARTAO=false; // total já está fechado; não recalcula taxa na edição
    PAGAMENTOS=[];
    ULTIMO_ITEM_PAINEL=null;
    MODO_EDICAO_PAGAMENTO=true;
    window._obsVenda=limparObs(j.observacao||""); // carrega a observação existente do pedido (sem as notas automáticas)
    window._filtroPed="";
    render();
    conferirPedidoContraBling(id); // destaca se o registro do caixa não bate com o Bling
  }catch(e){ alert("Não foi possível abrir o pedido pra edição: "+e.message); MODO_EDICAO_PAGAMENTO=false; }
}
// ---- salvar novo pagamento: QR de novo no FINAL ----
function salvarEdicaoPagamento(){
  const msg=document.getElementById("msgFinalizar");
  const linhas=PAGAMENTOS.filter(p=>p.formaId&&Number(p.valor)>0);
  if(!linhas.length){ if(msg) msg.innerHTML=`<div class="err">Informe ao menos uma forma de pagamento.</div>`; return; }
  const total=totalPedido();
  const soma=linhas.reduce((s,p)=>s+Number(p.valor),0);
  if(Math.abs(soma-total)>=0.01 && !confirm(`A soma dos pagamentos (${brl(soma)}) é diferente do total (${brl(total)}). Continuar?`)) return;
  const pagamentos=linhas.map(p=>({formaId:p.formaId,formaNome:p.formaNome,valor:Number(p.valor)}));
  pedirQrAcao(
    `💾 Confirmar novo pagamento — #${esc(PEDIDO_ATUAL?.numero||"")}`,
    "Pra salvar a nova forma de pagamento, leia o QR de novo (gerente, financeiro ou admin).",
    async (tokenQr, campo, erroEl)=>{
      try{
        const comTimeout=(url,opts,ms=60000)=>{ const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),ms); return fetch(url,{...opts,signal:ctrl.signal}).finally(()=>clearTimeout(t)); };
        const resp=await comTimeout(BACKEND+"/api/caixa-atacado/editar-pagamento",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({pedidoId:PEDIDO_ATUAL.id,numero:PEDIDO_ATUAL.numero,pagamentos,tokenQr,funcionarioId:S.id,frete:FRETE})}).then(r=>r.json());
        if(resp.erro) throw new Error(resp.erro);
        if(campo) campo.value="";
        document.getElementById("modais").innerHTML=`
          <div class="modalBg" onclick="if(event.target===this)fecharModais()"><div class="modal" style="text-align:center">
            <div style="font-size:44px">✏️</div><h3>Pagamento alterado!</h3>
            <div class="ok" style="text-align:left;margin-top:8px">Pedido #${esc(resp.numero||PEDIDO_ATUAL.numero)}<br>
              <span class="muted">De:</span> ${esc(resp.de||"—")}<br>
              <span class="muted">Para:</span> ${esc(resp.para||"—")}<br>
              <span class="muted">Autorizado por:</span> ${esc(resp.autorizadoPor||AUTORIZADO_POR||"—")}</div>
            ${resp.incluidoNoCaixa?`<div style="margin-top:10px;padding:8px;background:#2a2410;border:1px solid #6b5f1f;border-radius:8px;color:#ffd23f;font-size:12px;text-align:left">⚠️ Este pedido não estava em nenhum caixa do sistema. Foi <b>incluído no caixa atual</b> (${esc(resp.incluidoNoCaixa.operador||"você")}).</div>`:""}
            <button class="btn" style="width:100%;margin-top:14px" onclick="fecharModais();novaVenda();carregarPedidos();carregarSessao().then(render)">OK</button>
          </div></div>`;
      }catch(e){
        if(campo) campo.value="";

// define o modo direto (usado pelos botões grandes de Atacado/Varejo)
function definirModoPreco(modo){
  MODO_PRECO = modo==="varejo" ? "varejo" : "atacado";
  // atualiza o pill do topo
  const pill=document.getElementById("pillModo");
  if(pill){

    else { pill.textContent="🏷️ Atacado"; pill.style.background="#1a2a44"; pill.style.color="#7fd4ff"; }

  }
}

// no modo varejo, se a quantidade bater o mínimo do fardo, troca pro preço de fardo
function aplicarPrecoAutomatico(ix){
  const item=CARRINHO[ix]; if(!item) return;
  if(item.precoEditado) return; // preço editado manualmente (com QR) não é sobrescrito
  if(item.modoPreco==="varejo" && item.caixaQtd && item.precoFardo!=null && item.quantidade>=item.caixaQtd){
    item.valor=item.precoFardo; item._usandoFardo=true;
  } else if(item.modoPreco==="varejo" && item.precoNormal!=null){
    item.valor=item.precoNormal; item._usandoFardo=false;
  }
}

function addProduto(p){
  const item={produtoId:p.produtoId,nome:p.nome,valor:Number(p.preco)||0,imagem:p.imagem||null};
  const ex=CARRINHO.find(i=>Number(i.produtoId)===Number(p.produtoId));
  if(ex){ ex.quantidade++; aplicarPrecoAutomatico(CARRINHO.indexOf(ex)); }
  else {
    const novo={produtoId:p.produtoId,nome:p.nome,quantidade:1,valor:Number(p.preco)||0,codigo:p.codigo||"",imagem:p.imagem||null,
      origemPreco:p.origemPreco||"bling", modoPreco:MODO_PRECO, precoNormal:Number(p.preco)||0, precoFardo:null, caixaQtd:null};
    CARRINHO.push(novo);
    // no modo varejo, busca se o produto tem preço de fardo configurado (aplica por qtd)
    if(MODO_PRECO==="varejo" && p.codigo){
      fetch(BACKEND+"/api/pdv/info-fardo/"+encodeURIComponent(p.codigo)).then(r=>r.json()).then(info=>{
        if(info&&info.temFardo){ novo.precoFardo=info.precoFardo; novo.caixaQtd=info.caixaQtd; aplicarPrecoAutomatico(CARRINHO.indexOf(novo)); render(); }
      }).catch(()=>{});
    }
  }
  ULTIMO_ITEM_PAINEL=item; // mostra o produto no painel grande
  render();
}

function ligarBusca(){
  const el=document.getElementById("busca"); if(!el) return;
  el.addEventListener("keydown",function(ev){
    if(ev.key==="Enter"){ ev.preventDefault(); clearTimeout(_timerBusca); const t=this.value.trim(); if(t) buscarProduto(t,el,document.getElementById("resBusca"),true); }
  });
  el.addEventListener("input",function(){
    clearTimeout(_timerBusca);
    const termo=this.value.trim(); const resEl=document.getElementById("resBusca");
    if(termo.length<2){ resEl.innerHTML=""; return; }
    resEl.innerHTML='<div class="muted">buscando…</div>';
    _timerBusca=setTimeout(()=>buscarProduto(termo,el,resEl,false),350);
  });
}
async function buscarProduto(termo,el,resEl,ehEnter){
  const q = MODO_PRECO==="atacado" ? "?atacado=1" : ""; // varejo = preço do Bling
  try{
    if(/^\d{4,}$/.test(termo)){
      const r=await fetch(BACKEND+"/api/preco/gtin/"+encodeURIComponent(termo)+q).then(r=>r.json()).catch(()=>null);
      if(r&&r.data&&r.data.preco>0){ addProduto({produtoId:r.data.produtoId,nome:r.data.nome,preco:r.data.preco,codigo:termo,origemPreco:r.data.origemPreco}); el.value=""; return; }
      // não é produto → pode ser o código de barras de um PEDIDO do totem (o barcode é o id do pedido)
      resEl.innerHTML='<div class="muted">verificando se é um pedido…</div>';
      const achouPedido=await tentarAbrirComoPedido(termo);
      if(achouPedido){ el.value=""; resEl.innerHTML=""; return; }
      if(ehEnter){ resEl.innerHTML=`<div class="muted">Código <b>${esc(termo)}</b> não encontrado (nem produto, nem pedido).</div>`; return; }
      resEl.innerHTML="";
    }
    const j=await fetch(BACKEND+"/api/buscar?nome="+encodeURIComponent(termo)).then(r=>r.json());
    const lista=(j.data||[]).slice(0,25);
    if(!lista.length){ resEl.innerHTML='<div class="muted">nada encontrado</div>'; return; }
    window._ultimaBusca=lista;
    resEl.innerHTML=lista.map((p,ix)=>`
      <div class="resitem" onclick="selecionarResultado(${ix})">
        <div class="semimg">📦</div>
        <div class="info"><div class="nome">${esc(p.nome)}</div><div class="meta">#${esc(String(p.codigo||""))}</div></div>
        <div class="preco" id="pr_${ix}">—</div>
      </div>`).join("");
    lista.forEach(async(p,ix)=>{
      if(!p.codigo) return;
      try{ const r=await fetch(BACKEND+"/api/preco/gtin/"+encodeURIComponent(p.codigo)+q).then(r=>r.json());
        if(r?.data){ p._preco=r.data.preco; p._origemPreco=r.data.origemPreco; const e=document.getElementById("pr_"+ix); if(e) e.textContent=brl(r.data.preco); }
      }catch(e){}
    });
  }catch(e){ resEl.innerHTML='<div class="err">erro na busca</div>'; }
}

  try{

function quebrarTexto(ctx, texto, maxW, maxLinhas){
  texto=String(texto||"").trim();
  if(!texto) return [""];
  const cabe=(s)=>ctx.measureText(s).width<=maxW;
  const palavras=texto.split(/\s+/);
  const linhas=[]; let atual="";
  for(const p of palavras){
    const teste=atual?atual+" "+p:p;
    if(cabe(teste)){ atual=teste; }
    else {
      if(atual) linhas.push(atual);
      if(!cabe(p)){ // palavra maior que a linha: corta em pedaços
        let resto=p;
        while(resto.length && !cabe(resto)){
          let corte=resto;
          while(corte.length>1 && !cabe(corte)) corte=corte.slice(0,-1);
          linhas.push(corte); resto=resto.slice(corte.length);
        }
        atual=resto;
      } else { atual=p; }
    }
  }
  if(atual) linhas.push(atual);
  if(linhas.length<=maxLinhas) return linhas;
  const cortadas=linhas.slice(0,maxLinhas);
  let ult=cortadas[maxLinhas-1];
  while(ult.length>1 && !cabe(ult+"…")) ult=ult.slice(0,-1);
  cortadas[maxLinhas-1]=ult+"…";
  return cortadas;
}
function desenharComprovante(v, qrEl, barCanvas, logoImg){
  const itensArr=(v.itens||[]);
  const itemH=54, headerH=136, qrSize=210;
  const W=580, padd=24;
  // quebra os nomes de produto em até 2 linhas (mede com um contexto temporário)
  const _mc=document.createElement("canvas").getContext("2d"); _mc.font="900 19px Arial";
  const maxNomeW=W-200-padd-16;
  itensArr.forEach(i=>{ i._nomeLinhas=quebrarTexto(_mc, i.nome||("Produto "+i.produtoId), maxNomeW, 2); });
  const extraLinhasItens=itensArr.reduce((s,i)=>s+((i._nomeLinhas.length||1)-1),0);
  const H=1080 + itensArr.length*itemH + extraLinhasItens*24 + (v.pagamentos||[]).length*32 + (v.observacao?80:0) + ((Number(v.outrasDespesas||0)>0||Number(v.frete||0)>0)?64:0) + (Number(v.outrasDespesas||0)>0&&Number(v.frete||0)>0?30:0) + (v.operador?40:0);
  const cv=document.createElement("canvas");
  const dpr=3; cv.width=W*dpr; cv.height=H*dpr; // resolução alta = impressão nítida
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
  ctx.textBaseline="alphabetic";

  // cabeçalho (fundo preto pra sair sólido na térmica)
  ctx.fillStyle="#000"; ctx.fillRect(0,0,W,headerH-14);
  ctx.fillStyle="#fff"; ctx.font="900 34px Arial"; ctx.textAlign="left"; ctx.fillText("B13 BEBIDAS",padd,52);
  ctx.font="900 15px Arial"; ctx.fillStyle="#fff"; ctx.textAlign="left";
  ctx.fillText("Av. Brigadeiro Eduardo Gomes, 1668 — Glória, BH",padd,headerH-40);
  ctx.fillText("(31) 99971-9888",padd,headerH-22);
  ctx.fillStyle="#000"; ctx.fillRect(0,headerH-10,W,4);

  let y=headerH+30;
  // pedido + código de barras
  ctx.font="900 15px Arial"; ctx.fillStyle="#000"; ctx.textAlign="left"; ctx.fillText("PEDIDO",padd,y);
  ctx.font="900 46px Arial"; ctx.fillStyle="#000"; ctx.fillText("#"+(v.numero||"—"),padd,y+46);
  ctx.font="900 15px Arial"; ctx.fillStyle="#000"; ctx.fillText(new Date(v.dataHora||Date.now()).toLocaleString("pt-BR"),padd,y+72);
  if(barCanvas){
    const bw=250, bh=barCanvas.height*(bw/barCanvas.width);
    try{ ctx.drawImage(barCanvas,W-padd-bw,y-4,bw,bh);
      ctx.font="900 13px Arial"; ctx.fillStyle="#000"; ctx.textAlign="center";
      ctx.fillText("Apresente no caixa",W-padd-bw/2,y-4+bh+16);
    }catch(e){}
  }
  y+=112;
  ctx.fillStyle="#000"; ctx.fillRect(0,y,W,2); y+=32;

  // cliente
  ctx.font="900 15px Arial"; ctx.fillStyle="#000"; ctx.textAlign="left"; ctx.fillText("CLIENTE",padd,y);
  ctx.font="900 26px Arial"; ctx.fillStyle="#000"; ctx.fillText(v.cliente?.nome||"Consumidor Final",padd,y+30);
  y+=52;
  if(v.operador){
    ctx.font="900 15px Arial"; ctx.fillStyle="#000"; ctx.textAlign="left"; ctx.fillText("RECEBIDO POR",padd,y);
    ctx.font="900 22px Arial"; ctx.fillStyle="#000"; ctx.fillText(v.operador,padd+180,y); y+=34;
  }
  ctx.fillStyle="#000"; ctx.fillRect(0,y,W,2); y+=32;

  // itens
  ctx.font="900 15px Arial"; ctx.fillStyle="#000"; ctx.textAlign="left"; ctx.fillText(`ITENS (${itensArr.length})`,padd,y); y+=26;
  ctx.font="900 14px Arial"; ctx.fillStyle="#000";
  ctx.textAlign="left"; ctx.fillText("PRODUTO",padd,y);
  ctx.textAlign="center"; ctx.fillText("QTD",W-200,y);
  ctx.textAlign="right"; ctx.fillText("UNIT.",W-padd,y);
  y+=10; ctx.fillStyle="#000"; ctx.fillRect(padd,y,W-padd*2,2); y+=itemH-14;
  itensArr.forEach((i,ix)=>{
    const linhas=i._nomeLinhas||[String(i.nome||("Produto "+i.produtoId))];
    ctx.fillStyle="#000"; ctx.font="900 19px Arial"; ctx.textAlign="left";
    linhas.forEach((ln,li)=>ctx.fillText(ln,padd,y+li*24));
    ctx.font="900 22px Arial"; ctx.fillStyle="#000"; ctx.textAlign="center"; ctx.fillText(String(i.quantidade),W-200,y);
    ctx.font="900 17px Arial"; ctx.fillStyle="#000"; ctx.textAlign="right"; ctx.fillText(brl(i.preco),W-padd,y);
    const extra=(linhas.length-1)*24;
    if(ix<itensArr.length-1){ ctx.fillStyle="#000"; ctx.fillRect(padd,y+extra+18,W-padd*2,1); }
    y+=itemH+extra;
  });
  y+=8; ctx.fillStyle="#000"; ctx.fillRect(0,y,W,2); y+=36;

  // subtotal + outras despesas + frete, quando houver
  const _outras=Number(v.outrasDespesas||0);
  const _frete=Number(v.frete||0);
  if(_outras>0.009 || _frete>0.009){
    const _sub=+(Number(v.total||0)-_outras-_frete).toFixed(2);
    ctx.font="900 20px Arial"; ctx.fillStyle="#000"; ctx.textAlign="left"; ctx.fillText("Subtotal",padd,y);
    ctx.textAlign="right"; ctx.fillText(brl(_sub),W-padd,y); y+=30;
    if(_outras>0.009){ ctx.textAlign="left"; ctx.fillText("Outras despesas",padd,y); ctx.textAlign="right"; ctx.fillText(brl(_outras),W-padd,y); y+=30; }
    if(_frete>0.009){ ctx.textAlign="left"; ctx.fillText("Frete",padd,y); ctx.textAlign="right"; ctx.fillText(brl(_frete),W-padd,y); y+=30; }
    y+=4;
  } else { y+=12; }

  // total + PAGO
  ctx.font="900 32px Arial"; ctx.fillStyle="#000"; ctx.textAlign="left"; ctx.fillText("TOTAL",padd,y);
  ctx.textAlign="right"; ctx.font="900 38px Arial"; ctx.fillText(brl(v.total),W-padd,y); y+=40;
  ctx.textAlign="left"; ctx.font="900 22px Arial"; ctx.fillStyle="#000"; ctx.fillText("✓ PAGO",padd,y); y+=34;
  // formas de pagamento
  (v.pagamentos||[]).forEach(p=>{
    ctx.font="900 18px Arial"; ctx.fillStyle="#000"; ctx.textAlign="left"; ctx.fillText(p.formaNome||"—",padd,y);
    ctx.textAlign="right"; ctx.fillText(brl(p.valor),W-padd,y); y+=30;
  });
  // observação
  if(v.observacao && String(v.observacao).trim()){
    y+=8; ctx.font="900 15px Arial"; ctx.fillStyle="#000"; ctx.textAlign="left"; ctx.fillText("OBSERVAÇÃO",padd,y); y+=24;
    ctx.font="900 18px Arial"; ctx.fillStyle="#000";
    let obs=String(v.observacao).trim(); if(obs.length>52) obs=obs.slice(0,51)+"…";
    ctx.fillText(obs,padd,y); y+=26;
  }
  y+=12;

  // divisor tracejado grosso
  ctx.strokeStyle="#000"; ctx.lineWidth=2; ctx.setLineDash([8,5]); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth=1; y+=36;

  // QR
  if(qrEl){ const qrX=(W-qrSize)/2; try{ ctx.drawImage(qrEl,qrX,y,qrSize,qrSize); }catch(e){} y+=qrSize+26; }
  ctx.fillStyle="#000"; ctx.font="900 15px Arial"; ctx.textAlign="center"; ctx.fillText("Leia o QR para ver o status do pedido",W/2,y); y+=26;
  ctx.font="900 17px Arial"; ctx.fillStyle="#000"; ctx.fillText("Obrigado pela preferência!",W/2,y); y+=28;

  // apara pro tamanho real
  const cvFinal=document.createElement("canvas");
  cvFinal.width=W*dpr; cvFinal.height=Math.round(y*dpr);
  cvFinal.getContext("2d").drawImage(cv,0,0);
  return cvFinal;
}

async function finalizar(){
  if(MODO_EDICAO_PAGAMENTO) return salvarEdicaoPagamento();
  const btn=document.getElementById("btnFinalizar");
  const msg=document.getElementById("msgFinalizar");
  if(!CAIXA.aberta){ alert("Abra o caixa primeiro."); return; }
  if(!CARRINHO.length){ msg.innerHTML=`<div class="err">Adicione itens.</div>`; return; }
  const linhas=PAGAMENTOS.filter(p=>p.formaId&&Number(p.valor)>0);
  if(!linhas.length){ msg.innerHTML=`<div class="err">Informe ao menos uma forma de pagamento.</div>`; return; }
  const total=totalPedido();
  const soma=linhas.reduce((s,p)=>s+Number(p.valor),0);
  const dif=+(soma-total).toFixed(2);
  if(dif < -0.01){
    // pagou MENOS que o total → só fecha com autorização de gerente/financeiro/admin (QR)
    if(!AUTORIZOU_MENOR){ pedirQrValorMenor(+(total-soma).toFixed(2)); return; }
  } else if(dif > 0.01){
    // pagou MAIS que o total (troco) → confirma
    if(!confirm(`Recebido ${brl(soma)} para um total de ${brl(total)} (troco ${brl(dif)}). Continuar?`)) return;
  }
  // se pagou com "Pix Banco", pergunta o banco de CADA Pix Banco antes de finalizar
  const pixBancoSemBanco=PAGAMENTOS.some(p=>/pix/i.test(p.formaNome||"")&&/banco/i.test(p.formaNome||"")&&!p.banco);
  if(pixBancoSemBanco){ perguntarBancosPix(); return; }
  btn.disabled=true; btn.textContent="Processando…";
  const emitirNfce=document.getElementById("emitirNfce").checked;
  const observacaoUsuario=(document.getElementById("obsVenda")?.value||"").trim();
  const pagamentos=linhas.map(p=>{
    let nome=p.formaNome;
    // cada Pix Banco vira "Pix Banco <Banco>" com o banco escolhido pra AQUELA linha
    if(/pix/i.test(nome||"")&&/banco/i.test(nome||"")) nome="Pix Banco "+(p.banco||PIX_BANCOS.padrao||"Inter");
    return {formaId:p.formaId,formaNome:nome,valor:Number(p.valor)};
  });
  // acrescenta na observação do Bling qual PIX foi (banco/maquininha), e se fechou com valor menor
  const notaMenor=AUTORIZOU_MENOR?`[Valor menor: faltou ${brl(AUTORIZOU_MENOR.falta)}, autoriz. ${AUTORIZOU_MENOR.autorizadoPor}]`:"";
  const observacao=[observacaoUsuario, notaPix(pagamentos), notaMenor].filter(Boolean).join(" · ");
  const itens=CARRINHO.map(i=>({produtoId:i.produtoId,nome:i.nome,quantidade:i.quantidade,valor:i.valor,
    modoPreco: i._usandoFardo ? "fardo" : (i.origemPreco==="atacado" ? "atacado" : (i.precoEditado ? "editado" : "bling"))}));
  // Regra de status final no Bling (POR ENQUANTO):
  //  - TODO pedido finalizado no caixa termina em ATENDIDO, caminhando SEPARADO -> ATENDIDO
  //    (o backend garante o caminho: passa por Separado antes de mover pra Atendido).
  //  (Regra antiga, guardada caso volte: ATENDIDO só p/ venda nova 100% varejo; resto SEPARADO.)
  const usouAtacado = CARRINHO.some(i => i.modoPreco==="atacado" || i.origemPreco==="atacado");
  const taxaCredito = taxaCartao(); // 3,5% do crédito + débito, se aplicável e marcado
  const statusFinal = "atendido";
  try{
    // timeout de segurança: se o Bling demorar demais, não deixa preso em "Processando…"
    const comTimeout=(url,opts,ms=60000)=>{
      const ctrl=new AbortController();
      const t=setTimeout(()=>ctrl.abort(),ms);
      return fetch(url,{...opts,signal:ctrl.signal}).finally(()=>clearTimeout(t));
    };
    let resp;
    if(PEDIDO_ATUAL){
      resp=await comTimeout(BACKEND+"/api/caixa-atacado/finalizar",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({pedidoId:PEDIDO_ATUAL.id,numero:PEDIDO_ATUAL.numero,itens,pagamentos,emitirNfce,funcionarioId:S.id,clienteNome:CLIENTE_NOME,observacao,statusFinal,taxaCredito,outrasDespesasBase:OUTRAS_DESPESAS,freteBase:FRETE,autorizouMenor:AUTORIZOU_MENOR})}).then(r=>r.json());
    }else{
      resp=await comTimeout(BACKEND+"/api/pdv/venda",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({itens,pagamentos,emitirNfce,funcionarioId:S.id,clienteNome:CLIENTE_NOME,tipoCaixa:TIPO_CAIXA,observacao,statusFinal,taxaCredito,freteBase:FRETE,autorizouMenor:AUTORIZOU_MENOR})}).then(r=>r.json());
    }
    if(resp.erro) throw new Error(resp.erro);
    // guarda a venda pra poder reimprimir o comprovante
    ULTIMA_VENDA={
      numero:resp.numero||PEDIDO_ATUAL?.numero||resp.pedidoId, pedidoId:resp.pedidoId||PEDIDO_ATUAL?.id,
      total:total, desconto:0,
      outrasDespesas:+(OUTRAS_DESPESAS+taxaCredito).toFixed(2),
      frete:FRETE,
      itens:itens.map(i=>({produtoId:i.produtoId,nome:i.nome,quantidade:i.quantidade,preco:i.valor})),
      pagamentos, cliente:{nome:CLIENTE_NOME||"Consumidor Final"}, dataHora:Date.now(), nfce:resp.nfce||null, observacao, operador:S.nome||"",
    };
    window._obsVenda=""; // limpa pra próxima venda
    const nfMsg=emitirNfce?(resp.nfce?.ok?" NFC-e emitida.":(resp.nfce?.erro?" (NFC-e falhou)":"")):"";
    const reposto=(resp.estoqueReposto||[]);
    const repMsg=reposto.length?`<div class="muted" style="text-align:left;margin-top:8px;font-size:12px">📦 Estoque reposto pra concluir: ${reposto.map(r=>esc(r.nome||("produto "+r.produtoId))+" (+"+r.faltava+")").join(", ")}</div>`:"";
    document.getElementById("modais").innerHTML=`
      <div class="modalBg" onclick="fecharModais()"><div class="modal" style="text-align:center">
        <div style="font-size:44px">${resp.aviso?'⚠️':'✅'}</div><h3>${resp.aviso?'Pagamento registrado':'Pedido finalizado!'}</h3>
        <div class="ok">Total: ${brl(resp.total||total)}.${nfMsg}</div>
        ${repMsg}
        ${resp.aviso?`<div class="err" style="text-align:left;margin-top:8px">${esc(resp.aviso)}</div>`:""}
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="btn btn-ghost" style="flex:1" onclick="imprimirComprovante(ULTIMA_VENDA)">🖨️ Reimprimir</button>
          <button class="btn" style="flex:1" onclick="fecharModais();novaVenda();carregarPedidos();carregarSessao().then(render)">OK</button>
        </div>
      </div></div>`;
    // imprime o comprovante do pedido automaticamente (formato totem: barcode + QR)
    setTimeout(()=>{ try{ imprimirComprovante(ULTIMA_VENDA); }catch(e){} }, 300);
  }catch(e){
    btn.disabled=false; btn.textContent="✅ Finalizar e receber";
    if(e.name==="AbortError"){
      msg.innerHTML=`<div class="err">O Bling está demorando muito pra responder. <b>NÃO clique em finalizar de novo ainda</b> — confira em "Minhas Vendas" ou no Bling se o pedido #${esc(PEDIDO_ATUAL?.numero||"")} já foi para Atendido. Se não foi, tente novamente.</div>`;
    } else {
      msg.innerHTML=`<div class="err">Erro: ${esc(e.message)}</div>`;
    }
  }
}

// ---------------- init ----------------
(async function(){
  await carregarSessao();
  try{ const b=await fetch(BACKEND+"/api/pix-bancos").then(r=>r.json()); if(b&&Array.isArray(b.bancos)&&b.bancos.length) PIX_BANCOS=b; }catch(e){}
  try{
    const j=await fetch(BACKEND+"/api/formas-pagamento").then(r=>r.json());
    const todas=(j.data||[]).filter(f=>f.situacao!=="I");
    // mesma lógica do Frente de Caixa: mostra pix, dinheiro, débito e crédito à vista;
    // as outras formas (ficha, estorno, etc) ficam escondidas. Se nada casar, mostra todas.
    const padroes=[/pix/i,/dinheiro/i,/d[eé]bito/i,/cr[eé]dito.*vista/i];
    const filtradas=todas.filter(f=>padroes.some(p=>p.test(f.descricao||f.nome||""))&&!/pix.*bling.*conta/i.test(f.descricao||f.nome||""));
    // PIX vira DUAS opções: "Pix Banco" e "Pix Máquina" — ambas usam o MESMO id do PIX
    // no Bling (lá grava como PIX); a diferença (banco/maquininha) vai na observação.
    const pixReal=filtradas.find(f=>/pix/i.test(f.descricao||f.nome||""));
    const semPix=filtradas.filter(f=>!/pix/i.test(f.descricao||f.nome||""));
    FORMAS=[];
    if(pixReal){
      FORMAS.push({id:pixReal.id, nome:"Pix Banco", pixTipo:"banco"});
      FORMAS.push({id:pixReal.id, nome:"Pix Máquina", pixTipo:"maquina"});
    }
    FORMAS=FORMAS.concat(semPix);
    if(!FORMAS.length) FORMAS=todas;
  }catch(e){ FORMAS=[]; }
  render();
  await carregarPedidos();
})();
