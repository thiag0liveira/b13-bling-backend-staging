<div class="wrap">

<script>
const B = location.protocol.indexOf("http") === 0 ? "" : "https://app.b13bebidas.com.br";
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const brl = n => n == null ? "—" : Number(n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const hojeISO = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);
const isoParaBR = d => d ? String(d).slice(0, 10).split("-").reverse().join("/") : "";
function brParaISO(t) { let m = String(t || "").replace(/\D/g, ""); if (m.length === 6) m = m.slice(0, 4) + "20" + m.slice(4); if (m.length !== 8) return ""; const iso = `${m.slice(4)}-${m.slice(2, 4)}-${m.slice(0, 2)}`, d = new Date(iso + "T12:00:00Z"); return !isNaN(d) && d.toISOString().slice(0, 10) === iso ? iso : ""; }
function mascara(el) { const d = el.value.replace(/\D/g, "").slice(0, 8); el.value = d.length > 4 ? d.slice(0, 2) + "/" + d.slice(2, 4) + "/" + d.slice(4) : d.length > 2 ? d.slice(0, 2) + "/" + d.slice(2) : d; }
function token() { try { return (b13GetSession() || {}).token || ""; } catch (e) { return ""; } }
async function api(p, op) { op = op || {}; const r = await fetch(B + p, { ...op, headers: { "Content-Type": "application/json", "X-Auth-Token": token() } }); const j = await r.json().catch(() => ({})); return { ok: r.ok, j }; }
const MESES = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
let MES = hojeISO().slice(0, 7), GRUPO = "", CAT = "", FUNC = "", SIT = "", BUSCA = "", D = null, _tb = null;
const addMes = (m, k) => { const [a, n] = m.split("-").map(Number), d = new Date(Date.UTC(a, n - 1 + k, 1)); return d.toISOString().slice(0, 7); };
function mudarMes(k) { MES = addMes(MES, k); carregar(); }
function hoje() { MES = hojeISO().slice(0, 7); carregar(); }
async function carregar() {
  document.getElementById("mesTxt").textContent = MESES[Number(MES.slice(5)) - 1] + " / " + MES.slice(0, 4);
  const { ok, j } = await api("/api/custos?" + new URLSearchParams({ mes: MES, grupo: GRUPO, cat: CAT, func: FUNC, situacao: SIT, busca: BUSCA }));
  if (!ok) { document.getElementById("kpis").innerHTML = `<div class="err" style="grid-column:1/-1">${esc(j.erro || "Não consegui carregar.")}</div>`; return; }
  D = j; render();
}
function variacao(atual, ant) { if (!(ant > 0)) return ""; const p = Math.round((atual - ant) / ant * 100); return `<span style="color:${p > 0 ? "#ff8aa3" : "#3ce88a"}">${p > 0 ? "▲" : "▼"} ${Math.abs(p)}%</span> vs mês anterior`; }
function render() {
  const R = D.resumo, G = D.grupos;
  document.getElementById("kpis").innerHTML = [["Custos do mês", brl(R.total), variacao(R.total, R.anterior) || R.qtd + " lançamentos"], ["Já pago", brl(R.pago), R.total ? Math.round(R.pago / R.total * 100) + "% do mês" : ""], ["Em aberto", brl(R.aberto), ""], ["Vencido", brl(R.vencido), R.vencido ? '<span style="color:#ff8aa3">precisa pagar</span>' : "nada vencido"]].map(([l, v, s]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("");
  const maior = Math.max(1, ...G.filter(g => !g.foraDoTotal).map(g => g.total));
  document.getElementById("grupos").innerHTML = `<div class="gr ${GRUPO === "" ? "on" : ""}" onclick="setGrupo('')"><div class="t"><b>📊 Todos os custos</b><b>${brl(R.total)}</b></div></div>` + G.filter(g => g.total > 0 || g.id === "pessoal" || g.id === GRUPO).map(g => `<div class="gr ${GRUPO === g.id ? "on" : ""}" onclick="setGrupo('${g.id}')"><div class="t"><b>${g.icone} ${esc(g.nome)}</b><b>${brl(g.total)}</b></div>
    <div class="ic" style="white-space:normal">${g.qtd} lançamento(s)${g.aberto > 0 ? " · em aberto " + brl(g.aberto) : ""}${g.anterior > 0 || g.total > 0 ? " · " + (variacao(g.total, g.anterior) || "") : ""}</div>
    ${g.foraDoTotal ? '<div class="ic">não entra no total de custos</div>' : `<div class="bar"><i style="width:${Math.max(2, Math.round(g.total / maior * 100))}%"></i></div>`}</div>`).join("");
  renderBloco();
}
function setGrupo(g) { GRUPO = g; CAT = ""; FUNC = ""; carregar(); }
function setCat(c) { CAT = CAT === c ? "" : c; carregar(); }
function setSit(s) { SIT = SIT === s ? "" : s; carregar(); }
function setFunc(f) { FUNC = f; carregar(); window.scrollTo({ top: document.getElementById("blocoGrupo").offsetTop - 60, behavior: "smooth" }); }
function renderBloco() {
  const g = D.grupos.find(x => x.id === GRUPO), titulo = g ? g.icone + " " + g.nome : "📋 Todos os lançamentos";
  const cats = (D.categorias || []).filter(c => c.qtd > 0 || c.cod === CAT).map(c => `<span class="chipf ${CAT === c.cod ? "on" : ""}" onclick="setCat('${c.cod}')">${esc(c.nome)} · ${brl(c.total)}</span>`).join("");
  const sits = [["abertas", "Em aberto"], ["pagas", "Pagas"], ["vencidas", "Vencidas"]].map(([k, t]) => `<span class="chipf ${SIT === k ? "on" : ""}" onclick="setSit('${k}')">${t}</span>`).join("");
  let pessoal = "";
  if (GRUPO === "pessoal" && D.pessoal) { const P = D.pessoal;
    pessoal = `<div class="card"><h3 style="margin:0 0 2px">👥 Folha do mês por funcionário</h3><div class="ic" style="white-space:normal;margin-bottom:6px">Total <b style="color:#fff">${brl(P.total)}</b> · pago ${brl(P.pago)} · em aberto ${brl(P.aberto)}. Cada funcionário tem uma ficha de custo (salário, encargos, benefícios e provisão) que gera os lançamentos mensais dele.</div>
      ${P.funcionarios.map(f => `<div class="fx"><div style="display:flex;justify-content:space-between;gap:8px"><span class="nm">${esc(f.nome)}${f.ativo ? "" : ' <span class="bd vencida">inativo</span>'}</span><b>${brl(f.total)}</b></div>
        <div class="ic">${esc(f.nivel)}${f.temFicha ? "" : ' · <span style="color:#ffd23f">sem ficha de custo</span>'}</div>
        ${f.total > 0 ? `<div class="cmp">${f.salario ? `<span>Salário <b>${brl(f.salario)}</b></span>` : ""}${f.encargos ? `<span>Encargos <b>${brl(f.encargos)}</b></span>` : ""}${f.beneficios ? `<span>Benefícios <b>${brl(f.beneficios)}</b></span>` : ""}${f.provisao ? `<span>Provisão 13º/férias <b>${brl(f.provisao)}</b></span>` : ""}${f.prolabore ? `<span>Pró-labore <b>${brl(f.prolabore)}</b></span>` : ""}${f.prestador ? `<span>Serviço <b>${brl(f.prestador)}</b></span>` : ""}${f.outros ? `<span>Outros <b>${brl(f.outros)}</b></span>` : ""}</div><div class="ic">pago ${brl(f.pago)} · em aberto ${brl(f.aberto)}</div>` : '<div class="ic" style="margin:4px 0">Nenhum custo lançado neste mês.</div>'}
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button class="btn btn-ghost" style="padding:5px 11px" onclick="abrirFicha('${esc(f.id)}')">📝 ${f.temFicha ? "Ficha de custo" : "Criar ficha de custo"}</button>${f.lancamentos ? `<button class="btn btn-ghost" style="padding:5px 11px" onclick="setFunc('${esc(f.id)}')">Ver lançamentos (${f.lancamentos})</button>` : ""}</div></div>`).join("")}
      ${P.semVinculo.lancamentos ? `<div class="fx" style="border-color:#8a7a1f"><div style="display:flex;justify-content:space-between"><span class="nm">⚠️ Sem funcionário vinculado</span><b>${brl(P.semVinculo.total)}</b></div><div class="ic" style="white-space:normal">${P.semVinculo.lancamentos} lançamento(s) de pessoal não ligados a ninguém. O sistema pode sugerir pelo nome que aparece neles.</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button class="btn btn-mag" style="padding:5px 11px" onclick="abrirSugestoes()">🔗 Sugerir vínculos pelo nome</button><button class="btn btn-ghost" style="padding:5px 11px" onclick="setFunc('__sem')">Ver quais são</button></div></div>` : ""}
      ${P.encargosEmpresa && P.encargosEmpresa.lancamentos ? `<div class="fx"><div style="display:flex;justify-content:space-between"><span class="nm">🏛️ Encargos pagos em guia (INSS, FGTS)</span><b>${brl(P.encargosEmpresa.total)}</b></div><div class="ic" style="white-space:normal">${P.encargosEmpresa.lancamentos} guia(s) da empresa, não ligadas a uma pessoa. Já estão no total da folha.</div><button class="btn btn-ghost" style="padding:5px 11px;margin-top:6px" onclick="setFunc('__guias')">Ver guias</button></div>` : ""}</div>`; }
  const fNome = FUNC === "__sem" ? "sem funcionário vinculado" : FUNC === "__guias" ? "guias de encargos (INSS, FGTS)" : (D.funcionarios.find(x => x.id === FUNC) || {}).nome;
  document.getElementById("blocoGrupo").innerHTML = pessoal + `<div class="card"><h3 style="margin:0 0 4px">${esc(titulo)}</h3>
    ${cats ? `<div style="margin-bottom:4px">${cats}</div>` : ""}<div>${sits}</div>
    ${FUNC ? `<div class="ic" style="margin:4px 0">Funcionário: <b style="color:#fff">${esc(fNome || "")}</b> <a href="#" style="color:#ff5fa8" onclick="FUNC='';carregar();return false">tirar filtro</a></div>` : ""}
    <input id="busca" placeholder="🔎 buscar por descrição, funcionário ou fornecedor" value="${esc(BUSCA)}" oninput="buscar(this.value)" style="width:100%;margin:6px 0">
    <div class="ic" style="margin-bottom:4px"><b style="color:#fff">${D.totalItens}</b> lançamento(s) · soma do mês <b style="color:#fff">${brl(D.somaItens)}</b></div>
    <div id="lista">${D.itens.map(linha).join("") || '<div class="ic" style="padding:10px 0">Nenhum lançamento nesse filtro.</div>'}</div></div>`;
}
function buscar(v) { BUSCA = v; clearTimeout(_tb); _tb = setTimeout(async () => { await carregar(); const b = document.getElementById("busca"); if (b) { b.focus(); b.setSelectionRange(b.value.length, b.value.length); } }, 450); }
function linha(x) { const cls = x.status === "paga" ? "paga" : x.status === "vencida" ? "vencida" : x.status === "vence logo" ? "vence" : "aberta";
  return `<div class="ls" onclick="${x.sintetico ? "location.href='" + (x.destino ? x.destino : "/taxas-cartao?mes=" + MES) + "'" : "abrirEditar('" + esc(x.id) + "')"}"><div style="min-width:0"><div class="d">${esc(x.descricao)}</div><div class="m">${esc(x.categoria)}${x.funcionarioNome ? " · 👤 " + esc(x.funcionarioNome) : (x.grupo === "pessoal" ? ' · <span style="color:#ffd23f">sem funcionário</span>' : "")}${x.fornecedor && !x.funcionarioNome ? " · " + esc(x.fornecedor) : ""} ${x.sintetico ? "· <b style='color:#7fd0ff'>calculado pelo sistema</b> (toque para ver como)" : " · vence " + isoParaBR(x.vencimento) + (x.recorrenteId ? " · fixa mensal" : "") + `<span class="bd ${cls}">${esc(x.status)}</span>`}</div></div>
    <div class="v">${brl(x.valorMes)}${x.meses > 1 ? `<div class="ic">de ${brl(x.valor)} ÷ ${x.meses} meses</div>` : ""}</div></div>`; }
function exportar() { fetch(B + "/api/custos.csv?" + new URLSearchParams({ mes: MES, grupo: GRUPO, func: FUNC }), { headers: { "X-Auth-Token": token() } }).then(r => r.blob()).then(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "custos_" + MES + ".csv"; a.click(); }); }
// ---------- janelas ----------
const abrirJanela = h => { document.getElementById("mdlCorpo").innerHTML = h; document.getElementById("mdl").classList.add("aberto"); };
function fecharJanela() { document.getElementById("mdl").classList.remove("aberto"); }
document.getElementById("mdl").addEventListener("click", e => { if (e.target.id === "mdl") fecharJanela(); });
function selCategoria(sel) { const porG = {}; D.plano.forEach(p => (porG[p.grupo] = porG[p.grupo] || []).push(p)); return Object.entries(porG).map(([g, l]) => { const gg = D.grupos.find(x => x.id === g); return `<optgroup label="${esc(gg ? gg.nome : g)}">${l.map(p => `<option value="${esc(p.cod)}" ${p.cod === sel ? "selected" : ""}>${esc(p.rotulo)}</option>`).join("")}</optgroup>`; }).join(""); }
const selFunc = sel => `<option value="">— sem vínculo —</option>` + D.funcionarios.map(f => `<option value="${esc(f.id)}" ${f.id === sel ? "selected" : ""}>${esc(f.nome)}${f.nivel ? " (" + esc(f.nivel) + ")" : ""}</option>`).join("");
const campoData = (id, iso) => `<div class="dt"><input id="${id}" inputmode="numeric" placeholder="dd/mm/aaaa" value="${esc(isoParaBR(iso))}" oninput="mascara(this)"><label class="btn btn-ghost">📅<input type="date" value="${esc(iso || "")}" onchange="document.getElementById('${id}').value=isoParaBR(this.value)"></label></div>`;
function abrirEditar(id) { const x = D.itens.find(i => i.id === id); if (!x) return; const paga = x.status === "paga";
  abrirJanela(`<h3 style="margin:0 0 4px">✏️ Editar custo</h3><div class="ic" style="white-space:normal">${paga ? "Esta conta já está paga: dá para mudar a descrição, a categoria e o funcionário. Para mudar valor ou vencimento, desfaça o pagamento em Contas a Pagar." : "Mudanças valem para este lançamento."}</div>
    <label><span class="ic">Descrição</span><input id="eDesc" value="${esc(x.descricao)}"></label>
    <label><span class="ic">Categoria</span><select id="eCat">${selCategoria(x.cod)}</select></label>
    <label><span class="ic">👤 Funcionário (para custos de pessoal)</span><select id="eFunc">${selFunc(x.funcionarioId)}</select></label>
    <label><span class="ic">Valor R$ ${x.meses > 1 ? "(total, dividido em " + x.meses + " meses)" : ""}</span><input id="eVal" inputmode="decimal" value="${String(x.valor).replace(".", ",")}" ${paga ? "disabled" : ""}></label>
    <label><span class="ic">Vencimento</span>${paga ? `<input value="${esc(isoParaBR(x.vencimento))}" disabled>` : campoData("eVenc", x.vencimento)}</label>
    <label><span class="ic">Observação</span><input id="eObs" value="${esc(x.observacao)}"></label>
    ${x.recorrenteId ? `<div style="margin-top:8px" class="ic"><b style="color:#fff">Despesa fixa mensal.</b> Aplicar a:<br><label style="display:inline"><input type="radio" name="eEsc" value="este" checked style="width:auto"> só este mês</label> &nbsp; <label style="display:inline"><input type="radio" name="eEsc" value="proximos" style="width:auto"> este e os próximos meses</label></div>` : ""}
    <div id="eMsg" style="margin-top:8px"></div>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-ghost" style="flex:1" onclick="fecharJanela()">Cancelar</button><button class="btn btn-mag" style="flex:1" onclick="salvarEditar('${esc(id)}')">💾 Salvar</button></div>
    ${paga ? "" : `<a href="/contas-pagar" style="display:block;text-align:center;margin-top:10px;color:#ff5fa8;font-size:13px">Pagar esta conta em Contas a Pagar →</a>`}`); }
async function salvarEditar(id) {
  const g = i => (document.getElementById(i) || {}).value, msg = document.getElementById("eMsg"), x = D.itens.find(i => i.id === id);
  const corpo = { descricao: g("eDesc"), categoria: g("eCat"), funcionarioId: g("eFunc"), observacao: g("eObs") }; if (g("eVal") != null) corpo.valor = g("eVal");
  if (document.getElementById("eVenc")) { const v = brParaISO(g("eVenc")); if (!v) { msg.innerHTML = '<div class="err">Vencimento inválido. Digite dia/mês/ano.</div>'; return; } corpo.vencimento = v; }
  const esc2 = document.querySelector('input[name="eEsc"]:checked'); if (esc2) corpo.escopo = esc2.value;
  const catPlano = D.plano.find(p => p.cod === corpo.categoria); if (catPlano) corpo.categoria = catPlano.rotulo;
  msg.innerHTML = '<div class="ic">Salvando…</div>'; const { ok, j } = await api("/api/custos/lancamento/" + encodeURIComponent(id), { method: "POST", body: JSON.stringify(corpo) });
  if (!ok) { msg.innerHTML = `<div class="err">${esc(j.erro || "Não consegui salvar.")}</div>`; return; }
  msg.innerHTML = `<div style="color:#3ce88a;font-weight:800">✅ Salvo${j.afetados > 1 ? " em " + j.afetados + " meses" : ""}.</div>`; await carregar(); setTimeout(fecharJanela, 700); }
function abrirNovo() { const cat = CAT || (GRUPO === "pessoal" ? "5.1.1" : GRUPO === "ocupacao" ? "5.2.1" : GRUPO === "admin" ? "5.3.1" : "5.9"), venc = MES + "-" + hojeISO().slice(8, 10);
  abrirJanela(`<h3 style="margin:0 0 4px">➕ Novo custo</h3>
    <label><span class="ic">Descrição</span><input id="nDesc" placeholder="ex.: Aluguel da loja"></label>
    <label><span class="ic">Categoria</span><select id="nCat">${selCategoria(cat)}</select></label>
    <label><span class="ic">👤 Funcionário (para custos de pessoal)</span><select id="nFunc">${selFunc("")}</select></label>
    <label><span class="ic">Valor R$</span><input id="nVal" inputmode="decimal" placeholder="0,00"></label>
    <label><span class="ic">Vencimento</span>${campoData("nVenc", venc)}</label>
    <label style="display:flex;gap:8px;align-items:center"><input id="nRep" type="checkbox" style="width:auto"><span class="ic" style="margin:0">Repetir todo mês (despesa fixa)</span></label>
    <div id="nMsg" style="margin-top:8px"></div>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-ghost" style="flex:1" onclick="fecharJanela()">Cancelar</button><button class="btn btn-mag" style="flex:1" onclick="salvarNovo()">💾 Salvar</button></div>`); }
async function salvarNovo() {
  const g = i => document.getElementById(i).value.trim(), msg = document.getElementById("nMsg"), v = brParaISO(g("nVenc")); if (!v) { msg.innerHTML = '<div class="err">Vencimento inválido.</div>'; return; }
  const cat = D.plano.find(p => p.cod === g("nCat")), corpo = { descricao: g("nDesc"), categoria: cat ? cat.rotulo : "", funcionarioId: g("nFunc"), valor: g("nVal"), vencimento: v, repetirMensal: document.getElementById("nRep").checked, competencia: v.slice(0, 7) };
  const { ok, j } = await api("/api/custos/lancamento", { method: "POST", body: JSON.stringify(corpo) }); if (!ok) { msg.innerHTML = `<div class="err">${esc(j.erro || "Não consegui salvar.")}</div>`; return; }
  msg.innerHTML = '<div style="color:#3ce88a;font-weight:800">✅ Custo lançado.</div>'; await carregar(); setTimeout(fecharJanela, 600); }
// ---------- sugestões de vínculo pelo nome ----------
let SUG = [];
async function abrirSugestoes() { abrirJanela('<div class="ic">Procurando pelo nome…</div>'); const { ok, j } = await api("/api/custos/sugestoes"); if (!ok) { abrirJanela(`<div class="err">${esc(j.erro || "Não consegui buscar.")}</div><button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="fecharJanela()">Fechar</button>`); return; }
  SUG = j.itens;
  abrirJanela(`<h3 style="margin:0 0 2px">🔗 Vincular custos de pessoal</h3><div class="ic" style="white-space:normal;margin-bottom:6px">${j.comSugestao} de ${j.total} lançamento(s) têm um funcionário sugerido pelo nome. Confira e desmarque o que estiver errado. Nos demais, abra o lançamento e escolha a pessoa.</div>
    <div style="max-height:52vh;overflow:auto">${SUG.map((x, i) => `<label style="display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #221e4f;margin:0"><input type="checkbox" class="sg" data-i="${i}" ${x.sugestao ? "checked" : "disabled"} style="width:auto;margin-top:3px"><span style="flex:1"><b>${esc(x.descricao)}</b><br><span class="ic" style="white-space:normal">${esc(x.fornecedor)} · ${brl(x.valor)} · ${isoParaBR(x.vencimento)}</span><br>${x.sugestao ? `<span style="color:#3ce88a">→ ${esc(x.sugestao.nome)}</span>` : (x.ambigua ? '<span style="color:#ffd23f">mais de uma pessoa combina: escolha à mão</span>' : '<span class="ic">nenhuma pessoa combina</span>')}</span></label>`).join("")}</div>
    <div id="sgMsg" style="margin-top:8px"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-ghost" style="flex:1" onclick="fecharJanela()">Cancelar</button><button class="btn btn-mag" style="flex:1" onclick="aplicarSugestoes()" ${j.comSugestao ? "" : "disabled"}>✅ Vincular marcados</button></div>`); }
async function aplicarSugestoes() { const pares = [...document.querySelectorAll(".sg:checked")].map(c => SUG[Number(c.dataset.i)]).filter(x => x && x.sugestao).map(x => ({ id: x.id, funcionarioId: x.sugestao.id })), msg = document.getElementById("sgMsg");
  if (!pares.length) { msg.innerHTML = '<div class="err">Marque ao menos um.</div>'; return; }
  const { ok, j } = await api("/api/custos/vincular", { method: "POST", body: JSON.stringify({ pares }) }); if (!ok) { msg.innerHTML = `<div class="err">${esc(j.erro || "Não consegui vincular.")}</div>`; return; }
  msg.innerHTML = `<div style="color:#3ce88a;font-weight:800">✅ ${j.vinculados} lançamento(s) vinculado(s).</div>`; await carregar(); setTimeout(fecharJanela, 800); }
// ---------- ficha de custo do funcionário ----------
let FICHA = null;
async function abrirFicha(fid) { abrirJanela('<div class="ic">Carregando…</div>'); const { ok, j } = await api("/api/custos/ficha/" + encodeURIComponent(fid)); if (!ok) { abrirJanela(`<div class="err">${esc(j.erro || "Não consegui abrir.")}</div><button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="fecharJanela()">Fechar</button>`); return; }
  FICHA = j; const f = j.ficha || {}, num = n => n == null || n === "" ? "" : String(n).replace(".", ",");
  abrirJanela(`<h3 style="margin:0 0 2px">📝 Ficha de custo</h3><div class="ic" style="white-space:normal;margin-bottom:4px"><b style="color:#fff">${esc(j.funcionario.nome)}</b>${j.funcionario.nivel ? " · " + esc(j.funcionario.nivel) : ""}. Ao salvar, o sistema cria as despesas fixas mensais desta pessoa (salário, encargos, benefícios e provisão) e ajusta as contas em aberto.</div>
    <label><span class="ic">Salário mensal R$</span><input id="fSal" inputmode="decimal" value="${num(f.salario)}" oninput="prevFicha()" placeholder="0,00"></label>
    <label><span class="ic">Encargos (FGTS, INSS)</span><div style="display:flex;gap:6px"><select id="fEncModo" onchange="prevFicha()" style="width:120px"><option value="pct" ${f.encargosModo !== "valor" ? "selected" : ""}>% do salário</option><option value="valor" ${f.encargosModo === "valor" ? "selected" : ""}>R$ fixo</option></select><input id="fEnc" inputmode="decimal" value="${num(f.encargos)}" oninput="prevFicha()" placeholder="0"></div></label>
    <label><span class="ic">Benefícios por mês R$ (vale-transporte, alimentação)</span><input id="fBen" inputmode="decimal" value="${num(f.beneficios)}" oninput="prevFicha()" placeholder="0,00"></label>
    <label><span class="ic">Provisão de 13º e férias (% do salário). Referência: 1/12 do 13º + 1/12 de férias + 1/3 constitucional ≈ 11,11%</span><input id="fProv" inputmode="decimal" value="${num(f.provisaoPct)}" oninput="prevFicha()" placeholder="0"></label>
    <label><span class="ic">Pagamento</span><div style="display:flex;gap:6px"><select id="fDiaTipo" style="width:150px"><option value="dia" ${f.diaTipo !== "util" ? "selected" : ""}>dia do mês</option><option value="util" ${f.diaTipo === "util" ? "selected" : ""}>dia útil nº</option></select><input id="fDia" inputmode="numeric" value="${f.dia || 5}" placeholder="5"></div></label>
    <label><span class="ic">Valer a partir de (mês). Se o salário deste mês já foi pago, escolha o próximo mês, para não gerar uma conta repetida.</span><input id="fIni" type="month" value="${esc(f.inicio || MES)}"></label>
    <label style="display:flex;gap:8px;align-items:center"><input id="fAtivo" type="checkbox" style="width:auto" ${f.ativo === false ? "" : "checked"}><span class="ic" style="margin:0">Ficha ativa (desmarque quando a pessoa sair da empresa)</span></label>
    <label><span class="ic">Observação</span><input id="fObs" value="${esc(f.observacao || "")}"></label>
    <div id="fPrev" style="margin-top:10px;background:#0f0d24;border:1px solid #37327a;border-radius:10px;padding:8px 10px"></div><div id="fMsg" style="margin-top:6px"></div>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-ghost" style="flex:1" onclick="fecharJanela()">Cancelar</button><button class="btn btn-mag" style="flex:1" onclick="salvarFicha()">💾 Salvar ficha</button></div>`); prevFicha(); }
const nm = v => { const t = String(v || "").trim(); if (!t) return 0; const n = t.includes(",") ? Number(t.replace(/\./g, "").replace(",", ".")) : /^\d{1,3}(\.\d{3})+$/.test(t) ? Number(t.replace(/\./g, "")) : Number(t); return isFinite(n) ? n : 0; };
function prevFicha() { const sal = nm(document.getElementById("fSal").value), enc = document.getElementById("fEncModo").value === "pct" ? sal * nm(document.getElementById("fEnc").value) / 100 : nm(document.getElementById("fEnc").value), ben = nm(document.getElementById("fBen").value), prov = sal * nm(document.getElementById("fProv").value) / 100;
  document.getElementById("fPrev").innerHTML = `<div class="ic">Salário ${brl(sal)} + encargos ${brl(enc)} + benefícios ${brl(ben)} + provisão ${brl(prov)}</div><div style="font-size:18px;font-weight:900;margin-top:2px">Custo mensal: ${brl(sal + enc + ben + prov)}</div><div class="ic">≈ ${brl((sal + enc + ben + prov) * 12)} por ano</div>`; }
async function salvarFicha() { const g = i => document.getElementById(i).value, msg = document.getElementById("fMsg");
  const corpo = { salario: g("fSal"), encargosModo: g("fEncModo"), encargos: g("fEnc"), beneficios: g("fBen"), provisaoPct: g("fProv"), diaTipo: g("fDiaTipo"), dia: g("fDia"), inicio: g("fIni"), ativo: document.getElementById("fAtivo").checked, observacao: g("fObs") };
  msg.innerHTML = '<div class="ic">Salvando…</div>'; const { ok, j } = await api("/api/custos/ficha/" + encodeURIComponent(FICHA.funcionario.id), { method: "POST", body: JSON.stringify(corpo) });
  if (!ok) { msg.innerHTML = `<div class="err">${esc(j.erro || "Não consegui salvar.")}</div>`; return; }
  msg.innerHTML = `<div style="color:#3ce88a;font-weight:800">✅ Ficha salva. Custo mensal ${brl(j.custoMensal)}.</div>`; await carregar(); setTimeout(fecharJanela, 900); }
carregar();
</script>
<script src="/categorias-despesa.js"></script>
