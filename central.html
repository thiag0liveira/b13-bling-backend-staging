<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B13 — Central</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
  :root{--mag:#FF0082;--bg:#0f0d24}
  body{background:var(--bg);color:#fff}
  #app{max-width:1100px;margin:0 auto;min-height:100vh}
  .top{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#2b2870,#262366);display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:3px solid var(--mag)}
  .top img{height:36px}.top .t{font-weight:900;font-size:16px}.top .sp{flex:1}
  .wrap{padding:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
  .card{background:#151233;border:1px solid #2c2660;border-radius:14px;padding:14px}
  .card.wide{grid-column:1/-1}
  .muted{color:#9a95c9;font-size:12px}
  .h{font-weight:800;font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .big{font-size:26px;font-weight:900;color:#ffd23f}
  .lin{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #2a2660;padding:5px 0;font-size:13px}
  .lin:last-child{border-bottom:none}
  .btn{border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:12px;padding:7px 11px;color:#fff;text-decoration:none;display:inline-block}
  .btn-mag{background:var(--mag)}.btn-ghost{background:#1c1846}
  .tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px}
  .tag-ok{background:#0a2a1a;color:#3ce88a}.tag-warn{background:#3a2a0a;color:#ffd23f}.tag-bad{background:#3a0010;color:#ff8090}
  .cx{background:#1c1846;border-radius:10px;padding:10px;margin-top:8px}
  .cx summary{cursor:pointer;font-weight:800;list-style:none}
  .cx summary::-webkit-details-marker{display:none}
</style>
<script src="/nav.js"></script>
<style>
  @media(min-width:900px){
    #b13nav{transform:translateX(0%) !important}
    button[onclick="b13ToggleNav()"]{display:none !important}
    body > *:not(#b13nav):not([onclick="b13ToggleNav()"]):not(#b13navOverlay){ margin-left:200px }
  }
</style>
</head>
<body><script>
  (function(){
    if(typeof b13RequireLogin==="function" && !b13RequireLogin()) return;
    if(typeof b13BloquearSeSemAcesso==="function" && !b13BloquearSeSemAcesso("/central")) return;
    document.addEventListener("DOMContentLoaded",function(){
      const nav=document.createElement("div"); nav.innerHTML=b13RenderNav("/central");
      document.body.insertBefore(nav,document.body.firstChild);
    });
  })();
</script>
<div id="app"></div>
<script>
const B=(location.protocol.indexOf("http")===0)?"":"https://b13-bling-backend-production.up.railway.app";
const esc=(s)=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const brl=(v)=>"R$ "+(+v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const hora=(ms)=>ms?new Date(ms).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"";
let D=null, TIMER=null, DIA="";
const nEv={fechado_valor_menor:"Valor menor",pagamento_editado_caixa:"Pagamento editado",pedido_reaberto:"Pedido reaberto",venda_cancelada:"Venda cancelada",venda_cancelada_gestao:"Cancelada (gestão)",itens_retirados:"Itens retirados",itens_acrescentados:"Itens acrescentados",itens_alterados_gestao:"Itens alterados (gestão)",pedido_incluido_no_caixa:"Incluído no caixa"};
const lins=(arr,f)=>(arr&&arr.length)?arr.map(f).join(""):'<div class="muted">—</div>';
const card=(titulo,corpo,extra)=>`<div class="card">${titulo?`<div class="h"><span>${titulo}</span>${extra||""}</div>`:""}${corpo}</div>`;

function blocoCaixa(c){
  const fech=c.fechamento?` · fechado ${hora(c.fechadaEm)}${c.fechamento.diferenca!=null?` · dif ${brl(c.fechamento.diferenca)}`:""}`:"";
  return `<details class="cx"><summary>👤 ${esc(c.operador||"—")} <span class="tag ${c.tipoCaixa==='atacado'?'tag-ok':'tag-warn'}">${c.tipoCaixa==='atacado'?'Atacado':'Frente'}</span>
    <span style="float:right;color:#ffd23f">${brl(c.resumo.totalVendas)}</span><div class="muted" style="font-weight:400">aberto ${hora(c.abertaEm)}${fech} · ${c.resumo.qtdVendas} venda(s)</div></summary>
    <div style="margin-top:8px">
      ${(c.resumo.porForma||[]).map(f=>`<div class="lin"><span>${esc(f.nome)} <span class="muted">(${f.qtd}x)</span></span><b>${brl(f.valor)}</b></div>`).join("")}
      ${c.totalPix>0.009?`<div class="lin"><span>🔷 Total PIX</span><b>${brl(c.totalPix)}</b></div>`:""}
      <div class="lin"><span>💰 Suprimentos</span><b>${brl(c.resumo.totalSuprimentos)}</b></div>
      <div class="lin"><span>💸 Sangrias</span><b>${brl(c.resumo.totalSangrias)}</b></div>
      <div class="lin"><span>Esperado na gaveta</span><b style="color:#ffd23f">${brl(c.resumo.esperadoGaveta)}</b></div>
    </div></details>`;
}
function render(){
  const app=document.getElementById("app");
  const topo=`<div class="top"><button onclick="b13ToggleNav()" style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer">☰</button><img src="/logo"><div class="t">🏠 Central</div><div class="sp"></div>
    <input type="date" value="${DIA}" onchange="DIA=this.value;D=null;carregar()" style="background:#1c1846;border:1px solid #37327a;border-radius:8px;color:#fff;padding:6px">
    <button class="btn btn-ghost" onclick="carregar()">🔄</button></div>`;
  if(!D){ app.innerHTML=topo+`<div class="wrap"><div class="card"><div class="muted">Carregando…</div></div></div>`; return; }
  const f=D.fechamentoDia||{}, b=D.bling||{};
  const bl=(x)=>x==null?'<span class="muted">⏳</span>':x;
  app.innerHTML=topo+`
    <div class="wrap">
      <div class="muted" style="margin-bottom:10px">${b.em?"Bling atualizado às "+hora(b.em):"Bling: buscando em segundo plano…"}${b.calculando?" ⏳":""}</div>
      <div class="grid">
        <div class="card wide"><div class="h"><span>💵 Caixas abertos (${(D.caixasAbertos||[]).length})</span><span class="big">${brl(D.totalCaixasAbertos)}</span></div>
          ${(D.caixasAbertos||[]).map(blocoCaixa).join("")||'<div class="muted">Nenhum caixa aberto agora.</div>'}
          ${(D.caixasFechadosDia||[]).length?`<div class="h" style="margin-top:12px"><span>🔒 Caixas fechados no dia (${D.caixasFechadosDia.length})</span></div>${D.caixasFechadosDia.map(blocoCaixa).join("")}`:""}
        </div>

        ${card("📊 Fechamento do dia (todos os caixas)",`<div class="big">${brl(f.totalVendas)}</div><div class="muted" style="margin-bottom:8px">${f.qtdVendas||0} venda(s)${f.canceladas?` · ${f.canceladas} cancelada(s)`:""}</div>
          ${lins(f.porForma,x=>`<div class="lin"><span>${esc(x.nome)}</span><b>${brl(x.valor)}</b></div>`)}
          ${f.totalPix>0.009?`<div class="lin"><span>🔷 Total PIX</span><b>${brl(f.totalPix)}</b></div>`:""}
          <div class="lin"><span>💰 Suprimentos</span><b>${brl(f.suprimentos)}</b></div><div class="lin"><span>💸 Sangrias</span><b>${brl(f.sangrias)}</b></div>`)}

        ${card("🧑‍💼 Vendas por operador (caixa)",lins(f.porOperador,o=>`<div class="lin"><span>${esc(o.nome)} <span class="muted">(${o.qtd})</span></span><b>${brl(o.valor)}</b></div>`)
          +`<div class="h" style="margin-top:12px"><span>📋 Pedidos do dia por vendedor (Bling)</span></div>`+(b.pedidos&&!b.pedidos.erro?lins(b.pedidos.porVendedor,v=>`<div class="lin"><span>${esc(v.nome)} <span class="muted">(${v.qtd})</span></span><b>${brl(v.valor)}</b></div>`)+`<div class="muted" style="margin-top:6px">Total: ${b.pedidos.total} pedido(s) · ${brl(b.pedidos.valor)}</div>`:'<div class="muted">⏳ Buscando no Bling…</div>'))}

        ${card("🛒 Consumidor Final × Clientes",`<div class="lin"><span>Consumidor Final <span class="muted">(${f.consumidorFinal?.qtd||0})</span></span><b>${brl(f.consumidorFinal?.valor)}</b></div>
          <div class="h" style="margin-top:10px"><span>Clientes que compraram</span></div>${lins(f.clientes,c=>`<div class="lin"><span>${esc(c.nome)} <span class="muted">(${c.qtd})</span></span><b>${brl(c.valor)}</b></div>`)}`)}

        ${card("🔝 Produtos que mais saíram (caixa)",lins(f.produtosMaisVendidos,p=>`<div class="lin"><span>${esc(p.nome)}</span><b>${p.qtd} un · <span class="muted">${brl(p.valor)}</span></b></div>`))}

        ${card("💰 Maiores vendas do dia",lins(f.maioresVendas,v=>`<div class="lin"><span>#${esc(v.numero)} ${esc(v.cliente)} <span class="muted">· ${esc(v.operador)}</span></span><b>${brl(v.total)}</b></div>`)
          +(b.pedidos&&!b.pedidos.erro&&b.pedidos.maiores?.length?`<div class="h" style="margin-top:12px"><span>Maiores pedidos (Bling)</span></div>`+lins(b.pedidos.maiores,p=>`<div class="lin"><span>#${esc(p.numero)} ${esc(p.cliente)}</span><b>${brl(p.total)}</b></div>`):""))}

        ${card("🏷️ Preço usado nos itens",lins(f.porModoPreco,m=>`<div class="lin"><span>${esc(m.modo)} <span class="muted">(${m.itens} itens · ${m.unidades} un)</span></span><b>${brl(m.valor)}</b></div>`)+`<div class="muted" style="margin-top:6px">bling = preço do Bling · atacado = tabela · fardo = preço de fardo · editado = alterado com QR</div>`)}

        ${card("🔐 Autorizações do dia",`<div class="big" style="font-size:20px">${D.qtdAutorizacoes||0}</div>`+lins(D.autorizacoes,a=>`<div class="lin"><span>${hora(a.em)} · <b>${esc(nEv[a.evento]||a.evento)}</b> #${esc(a.pedidoId)}${a.detalhe?` <span class="muted">${esc(a.detalhe)}</span>`:""}</span><span class="muted">${esc(a.por)}${a.autorizadoPor?" / aut. "+esc(a.autorizadoPor):""}</span></div>`))}

        ${card("📦 Produtos retirados de pedidos",`<div class="muted" style="margin-bottom:6px">Possível falta de estoque — confira.</div>`+lins(D.produtosRetirados,p=>`<div class="lin"><span>${esc(p.nome)}</span><b>${p.vezes}x</b></div>`))}

        ${card("⏳ Pedidos em aberto / não pagos",`<div class="lin"><span>Não pagos (caixa)</span><b>${D.qtdNaoPagos||0}</b></div>`+lins(D.naoPagos,p=>`<div class="lin"><span>#${esc(p.pedidoId)} <span class="muted">${esc(p.status)}</span></span><b>${p.valorPedido!=null?brl(p.valorPedido):""}</b></div>`)
          +(b.pedidos&&!b.pedidos.erro?`<div class="h" style="margin-top:12px"><span>Pedidos do dia não atendidos (Bling): ${b.pedidos.qtdEmAberto||0}</span></div>`+lins(b.pedidos.emAberto,p=>`<div class="lin"><span>#${esc(p.numero)} ${esc(p.cliente)} <span class="muted">${esc(p.situacao)}</span></span><b>${brl(p.total)}</b></div>`):""))}

        ${card("🧾 Notas do dia",`<div class="lin"><span>Notas de saída emitidas (Bling)</span><b>${b.notasEmitidas&&!b.notasEmitidas.erro?b.notasEmitidas.qtd+" · "+brl(b.notasEmitidas.valor):bl(null)}</b></div>
          <div class="lin"><span>NFC-e emitidas pelo sistema</span><b>${D.nfce?.emitidasDia||0}</b></div>
          <div class="lin"><span>Vendas atacado sem NFC-e</span><b style="color:${D.nfce?.pendentesDia?'#ffd23f':'#3ce88a'}">${D.nfce?.pendentesDia||0}</b></div>
          ${b.notasEmitidas&&b.notasEmitidas.porCliente?.length?`<div class="h" style="margin-top:10px"><span>Notas por cliente</span></div>`+lins(b.notasEmitidas.porCliente,c=>`<div class="lin"><span>${esc(c.nome)}</span><b>${brl(c.valor)}</b></div>`):""}
          <a class="btn btn-ghost" style="margin-top:8px" href="/gestao-nfce">Gestão de NFC-e →</a>`)}

        ${card("📥 Entradas de hoje",(b.entradas&&!b.entradas.erro?`<div class="big" style="font-size:20px">${b.entradas.qtd} nota(s)</div>${b.entradas.fornecedores?.length?`<div class="muted">${b.entradas.fornecedores.map(esc).join(", ")}</div>`:""}
          <div class="h" style="margin-top:10px"><span>Produtos que entraram hoje</span></div>${lins(b.entradas.produtos,p=>`<div class="lin"><span>${esc(p.nome)}</span><b>${p.qtd} un</b></div>`)}`:'<div class="muted">⏳ Buscando no Bling…</div>')
          +(D.entradasMesTop?`<div class="h" style="margin-top:12px"><span>Mais entraram no mês</span></div>`+lins(D.entradasMesTop,p=>`<div class="lin"><span>${esc(p.nome)}</span><b>${p.qtd} un</b></div>`):"")+`<a class="btn btn-ghost" style="margin-top:8px" href="/entradas">Entradas do mês →</a>`)}

        ${card("🔔 Avisos pendentes",lins(D.avisos?.ultimos,x=>`<div class="lin"><span>${esc(x.titulo)}</span><span class="muted">${hora(x.em)}</span></div>`)+`<a class="btn btn-ghost" style="margin-top:8px" href="/avisos">Ver todos →</a>`,`<span class="big" style="color:${D.avisos?.pendentes?'#ffd23f':'#3ce88a'}">${D.avisos?.pendentes||0}</span>`)}

        ${card("📄 Propostas & Pedidos",`<div class="lin"><span>Propostas em aberto</span><b>${D.propostas?.abertas||0}</b></div><div class="lin"><span>Pedidos gerados no dia</span><b>${D.propostas?.pedidosGeradosDia||0}</b></div>
          ${Object.entries(D.propostas?.porOrigemDia||{}).map(([o,q])=>`<div class="lin"><span>· ${esc(o)}</span><b>${q}</b></div>`).join("")}<a class="btn btn-ghost" style="margin-top:8px" href="/propostas">Abrir →</a>`)}
        ${D.origemPedidos?card("🏪 Origem dos pedidos (Atacado × Varejo)",`
          <div class="lin"><span>Atacado <span class="muted">(passou pelo caixa atacado)</span></span><b>${D.origemPedidos.atacado.qtd} · ${brl(D.origemPedidos.atacado.valor)}</b></div>
          <div class="lin"><span>Varejo <span class="muted">(não passou pelo caixa atacado)</span></span><b>${D.origemPedidos.varejo.qtd} · ${brl(D.origemPedidos.varejo.valor)}</b></div>
          ${D.origemPedidos.qtdPossiveisErros?`<div class="h" style="margin-top:10px;color:#ff8090"><span>⚠️ Possível erro — Atendido mas não passou no caixa atacado (${D.origemPedidos.qtdPossiveisErros})</span></div>`+lins(D.origemPedidos.possiveisErros,p=>`<div class="lin"><span>#${esc(p.numero)} ${esc(p.cliente)} <span class="muted">· vend. ${esc(p.vendedor)}</span></span><b>${brl(p.total)}</b></div>`):'<div class="muted" style="margin-top:8px">Nenhum pedido do atacado ficou sem passar no caixa. ✅</div>'}
        `):(b.pedidos&&!b.pedidos.erro?"":card("🏪 Origem dos pedidos (Atacado × Varejo)",'<div class="muted">⏳ Buscando no Bling…</div>'))}
      </div>
    </div>`;
}
async function carregar(){
  try{ const j=await fetch(B+"/api/central/resumo"+(DIA?"?data="+DIA:"")).then(r=>r.json()); if(!j.erro){ D=j; if(!DIA) DIA=j.dia; } render(); }catch(e){}
  clearTimeout(TIMER);
  TIMER=setTimeout(carregar,(D&&D.bling&&D.bling.calculando)?5000:60000);
}
render(); carregar();
</script>
</body>
</html>
