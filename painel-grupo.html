<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>B13 — Visão geral</title>
<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;margin:0;padding:0}
:root{--mag:#FF0082;--bg:#0f0d24;--card:#151233;--borda:#2c2660;--muted:#9a95c9;--ok:#3ce88a;--warn:#ffd23f;--ruim:#ff8f7a}
body{background:var(--bg);color:#fff;min-height:100vh}
.top{background:linear-gradient(180deg,#2b2870,#262366);border-bottom:3px solid var(--mag);padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top img{height:34px}.top .t{font-weight:900;font-size:16px}.top .sp{flex:1}
.btn{border:none;border-radius:9px;font-weight:800;cursor:pointer;font-size:12px;padding:8px 12px;color:#fff;text-decoration:none;display:inline-block}
.btn-ghost{background:#1c1846;border:1px solid #3a3480}.btn-mag{background:var(--mag)}
.wrap{padding:14px;display:grid;gap:12px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;background:#1c1846;border:1px solid #514c96;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;color:#fff;user-select:none}
.chip.on{background:var(--mag);border-color:var(--mag)}
input,select{padding:8px 10px;border-radius:9px;border:1px solid #37327a;background:#0f0d24;color:#fff;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:12px;position:relative}
.kpi.alerta{border-color:#7a2a3a;background:#20122a}.kpi .v{font-size:22px;font-weight:900}.kpi .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-top:3px}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:4px}
.card{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:14px}
.card h3{font-size:14px;margin-bottom:4px}.desc{font-size:12px;color:var(--muted);margin-bottom:10px}
.rolagem{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
th{background:#0d0b1e;padding:8px 10px;text-align:right;font-size:11px;color:var(--muted);border-bottom:1px solid var(--borda);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--borda);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.ped{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--borda);border-radius:12px;margin-bottom:6px;background:#120f2c;cursor:pointer;flex-wrap:wrap}
.ped:hover{border-color:var(--mag)}.ped .info{flex:1;min-width:220px}.ped .l1{font-weight:800;font-size:14.5px}.ped .l2{font-size:12px;color:var(--muted);margin-top:3px}
.ped .dir{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.valor{font-weight:900;font-size:15px;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tag.ok{background:#11352a;color:#6be3a8}.tag.warn{background:#3a2a0a;color:var(--warn)}.tag.erro{background:#3d1020;color:#ff8aa3}.tag.neu{background:#24205a;color:#cfcaf5}.tag.azul{background:#0d2a44;color:#7fd0ff}
.ic{font-size:12px;color:#cfcaf5;white-space:nowrap}
.vazio{padding:26px;text-align:center;color:var(--muted)}
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:200;overflow-y:auto;padding:24px 10px}
.fundo.aberto{display:flex}.modal{background:#151233;border:1px solid var(--borda);border-radius:14px;padding:16px;width:100%;max-width:860px}
.bloco{background:#120f2c;border:1px solid var(--borda);border-radius:10px;padding:12px;margin-top:10px}
.bloco h4{font-size:13px;margin-bottom:8px;color:#cfcaf5}
.lin{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px solid #1d1946}.lin:last-child{border-bottom:none}
.lin span:first-child{color:var(--muted)}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.galeria a,.galeria div{display:block;border:1px solid var(--borda);border-radius:8px;overflow:hidden;background:#0b0a1e;text-decoration:none;color:#cfcaf5}
.galeria img{width:100%;height:110px;object-fit:cover;display:block}.galeria video{width:100%;height:110px;display:block;background:#000}
.galeria small{display:block;padding:5px 7px;font-size:10.5px;color:var(--muted)}
.tl{border-left:2px solid var(--borda);padding-left:12px}.tl div{font-size:12.5px;padding:4px 0}.tl b{color:#fff}.tl span{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.spin{display:inline-block;width:20px;height:20px;border:3px solid #514c96;border-top-color:var(--mag);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs .chip{font-size:12.5px}
.barras{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:6px}.barras div{flex:1;background:#3a3480;border-radius:4px 4px 0 0;position:relative;min-height:2px}
.barras div.on{background:var(--mag)}.barras small{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--muted)}
.cli{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--borda);border-radius:12px;margin-bottom:6px;background:#120f2c;cursor:pointer;flex-wrap:wrap}
.cli:hover{border-color:var(--mag)}.cli .info{flex:1;min-width:230px}.cli .l1{font-weight:800;font-size:14.5px}.cli .l2{font-size:12px;color:var(--muted);margin-top:3px}
.par{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.par div{background:#120f2c;border:1px solid var(--borda);border-radius:10px;padding:9px}.par b{display:block;font-size:16px}.par span{font-size:11px;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.form label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}.form input,.form select,textarea{width:100%}
textarea{padding:8px 10px;border-radius:9px;border:1px solid #37327a;background:#0f0d24;color:#fff;font-size:13px;min-height:70px}
#mapa{height:380px;border-radius:10px;border:1px solid var(--borda)}
.err{background:#3d1020;color:#ff8aa3;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:6px}.okmsg{background:#11352a;color:#6be3a8;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:6px}
.wrap .filtros{flex-wrap:wrap;min-width:0}.wrap .card{min-width:0;max-width:100%}.wrap .filtros input,.wrap .filtros select{max-width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:12px}.grid2>*{min-width:0}
.dist .lin{cursor:pointer}.dist .lin:hover{background:#1c1846}.barra{height:6px;background:#221e4f;border-radius:4px;overflow:hidden;margin-top:3px}.barra i{display:block;height:100%;background:#FF0082}
.ped{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid #221e4f;cursor:pointer}.ped:hover{background:#1c1846}.ped .x{flex:1;min-width:0}.ped .x b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ped .x span{color:var(--muted);font-size:12px}.tagp{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:4px;background:#2a2660;color:#cfcaff}
.tagp.ok{background:#0f3a28;color:#3ce88a}.tagp.al{background:#3d1020;color:#ff8aa3}.tagp.am{background:#3a2e08;color:#ffd23f}
.abas{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.abas span{padding:6px 12px;border-radius:999px;border:1px solid #3a3480;cursor:pointer;font-size:13px}.abas span.on{background:#FF0082;border-color:#FF0082;color:#fff}
.edtab input{background:#0f0c29;color:#fff;border:1px solid #3a3480;border-radius:6px;padding:6px;width:100%}

/* topo: o status do histórico quebra linha no celular em vez de esticar a página */
.top{flex-wrap:wrap}#sinc{white-space:normal;min-width:0;flex:1 1 180px;text-align:right}@media(max-width:600px){#sinc{font-size:10.5px;text-align:left}}
.aviso{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;margin-bottom:6px;text-decoration:none;color:#fff;border:1px solid #2a2660;background:#1c1846}
.aviso:hover{border-color:#FF0082}.aviso .ic2{font-size:16px}.aviso.alto{border-left:4px solid #ff5a7a}.aviso.medio{border-left:4px solid #ffd23f}.aviso.baixo{border-left:4px solid #7fd0ff}.aviso.bom{border-left:4px solid #3ce88a}.aviso.info{border-left:4px solid #9a95c9}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:12px}.grid3>*{min-width:0}
.leg{display:flex;gap:12px;font-size:11.5px;color:#9a95c9;margin-top:4px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.wrap>*{min-width:0;max-width:100%;box-sizing:border-box}#kpis{grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr))}#atalhos{flex-wrap:wrap}
.lin>span{min-width:0;overflow-wrap:anywhere;white-space:normal}.lin>b{flex-shrink:0;white-space:nowrap;margin-left:8px}.lin{gap:6px}
</style>
<script src="/nav.js"></script>
<script src="/ficha-pedido.js"></script>
<style>
  body.b13nav-open{ overflow:hidden }
  @media(min-width:900px){
    #b13nav{transform:translateX(0%) !important}
    #b13navOverlay{display:none !important}
    button[onclick="b13ToggleNav()"]{display:none !important}
    body > *:not(#b13nav):not([onclick="b13ToggleNav()"]):not(#b13navOverlay):not(.fundo){ /* menu agora no topo */ }
  }
</style>
</head>
<body><script>
  (function(){ if(!b13RequireLogin()) return; if(!b13BloquearSeSemAcesso(location.pathname)) return;
    document.addEventListener("DOMContentLoaded",function(){ const nav=document.createElement("div"); nav.innerHTML=b13RenderNav(location.pathname); document.body.insertBefore(nav,document.body.firstChild); }); })();
</script>
<div class="top"><img src="/logo"><div class="t" id="titulo">Visão geral</div><div class="sp"></div><span class="ic" id="sinc"></span></div>
<div class="wrap">
  <div class="card"><div class="filtros" id="atalhos"></div></div>
  <div class="kpis" id="kpis"><div class="vazio"><div class="spin"></div></div></div>
  <div class="card" id="cAlertas" style="display:none"><h3>🧭 O que pede atenção</h3><div id="alertas"></div></div>
  <div id="grupos"></div>
  <div id="graficos"></div>
  <div class="grid3" id="listas"></div>
</div>
<script>
const B = location.protocol.indexOf("http") === 0 ? "" : "https://app.b13bebidas.com.br";
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function token() { try { return (b13GetSession() || {}).token || ""; } catch (e) { return ""; } }
const G = (location.pathname.split("/")[2] || "").replace(/[^a-z]/g, "");
async function carregar() {
  const r = await fetch(B + "/api/painel-grupo/" + G, { headers: { "X-Auth-Token": token() } }); const D = await r.json().catch(() => ({}));
  if (!r.ok) { document.getElementById("kpis").innerHTML = `<div class="err">${esc(D.erro || "Não consegui carregar.")}</div>`; return; }
  document.getElementById("titulo").textContent = D.titulo; document.title = "B13 — " + D.titulo.replace(/^\S+\s/, "");
  document.getElementById("sinc").textContent = "atualizado " + new Date(D.geradoEm).toLocaleTimeString("pt-BR", { timeZone: "America/Sao_Paulo", hour: "2-digit", minute: "2-digit" }) + (D.ms != null ? " · " + D.ms + " ms" : "");
  // atalhos: as telas deste grupo que a pessoa pode abrir
  try { const meu = (window.B13_NAV_LINKS || []).find(l => l.href === location.pathname); const g = meu && meu.grupo;
    document.getElementById("atalhos").innerHTML = (window.B13_NAV_LINKS || []).filter(l => l.grupo === g && !l.oculto && l.href !== location.pathname && l.acoes.some(a => b13Pode(a))).map(l => `<a class="chip" href="${l.href}" style="text-decoration:none;color:inherit">${esc(l.label)}</a>`).join(""); } catch (e) {}
  document.getElementById("kpis").innerHTML = (D.kpis || []).map(k => `<a class="kpi ${k.nivel || ""}" ${k.link ? `href="${k.link}"` : ""} style="text-decoration:none;color:inherit"><div class="v">${esc(k.valor)}</div><div class="l">${esc(k.rotulo)}</div><div class="s">${esc(k.sub)}</div></a>`).join("") || `<div class="ic">Sem indicadores.</div>`;
  const ic = { alto: "🚨", medio: "⚠️", baixo: "ℹ️", bom: "✅", info: "💡" };
  document.getElementById("cAlertas").style.display = (D.alertas || []).length ? "" : "none";
  document.getElementById("alertas").innerHTML = (D.alertas || []).map(a => `<a class="aviso ${a.nivel}" href="${a.link || "#"}"><span class="ic2">${ic[a.nivel] || "•"}</span><span style="flex:1">${esc(a.texto)}</span>${a.link ? `<span class="ic">abrir ›</span>` : ""}</a>`).join("");
  // GESTÃO: painéis de todos os menus
  document.getElementById("grupos").innerHTML = (D.resumoGrupos || []).length ? `<div class="card"><h3>🗂️ Painéis de todos os menus</h3><div class="grid3">${D.resumoGrupos.map(g => `<a href="${g.link}" class="card" style="margin:0;text-decoration:none;color:inherit;display:block"><div style="display:flex;justify-content:space-between;gap:6px"><b>${esc(g.titulo)}</b>${g.alertas ? `<span class="tagp al" style="background:#3d1020;color:#ff8aa3;border-radius:999px;padding:1px 8px;font-size:11px">${g.alertas} alerta(s)</span>` : ""}</div>
    ${(g.kpis || []).map(k => `<div class="lin"><span>${esc(k.rotulo)}</span><b style="color:${k.nivel === "alerta" ? "#ff8aa3" : "inherit"}">${esc(k.valor)}</b></div>`).join("") || `<div class="ic">${esc(g.erro || "—")}</div>`}<div class="ic" style="margin-top:4px">abrir painel ›</div></a>`).join("")}</div></div>` : "";
  // gráficos (barras)
  const fmt = (v, f) => f === "brl" ? Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }) : Number(v || 0).toLocaleString("pt-BR");
  document.getElementById("graficos").innerHTML = (D.graficos || []).filter(g => (g.pontos || []).length > 1).map(g => { const P = g.pontos, mx = Math.max(1, ...P.map(p => p.valor)), mn = Math.min(...P.map(p => p.valor)), W = Math.max(P.length * 18, 320), alt = 140, w = W / P.length, cada = P.length > 16 ? Math.ceil(P.length / 12) : 1;
    return `<div class="card"><h3>${esc(g.titulo)}</h3><div class="ic" style="white-space:normal">de ${fmt(P[0].valor, g.formato)} para ${fmt(P[P.length - 1].valor, g.formato)} · menor ${fmt(mn, g.formato)} · maior ${fmt(mx, g.formato)}</div><div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${alt + 28}" style="width:100%;height:${alt + 28}px">${P.map((p, i) => { const h = Math.round(p.valor / mx * alt); return `<rect x="${i * w + 2}" y="${alt - h + 4}" width="${w - 4}" height="${h}" rx="2" fill="#FF0082"><title>${esc(p.rotulo)}: ${fmt(p.valor, g.formato)}</title></rect>${i % cada === 0 || i === P.length - 1 ? `<text x="${i * w + w / 2}" y="${alt + 20}" fill="#9a95c9" font-size="10" text-anchor="middle">${esc(p.rotulo)}</text>` : ""}`; }).join("")}</svg></div></div>`; }).join("");
  document.getElementById("listas").innerHTML = (D.listas || []).map(l => `<div class="card"><h3>${esc(l.titulo)} ${l.link ? `<a href="${l.link}" class="ic" style="float:right;color:#7fd0ff">abrir ›</a>` : ""}</h3>${(l.linhas || []).map(x => `<div class="lin"><span>${esc(x.a)}</span><b>${esc(x.b)}</b></div>`).join("") || `<div class="ic">Nada por aqui.</div>`}</div>`).join("");
}
carregar(); setInterval(carregar, 5 * 60000);
</script>
</body>
</html>
